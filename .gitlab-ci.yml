# CI for @saxonberg.
#
#   validate      — lint + test + build, on merge requests only, and
#                   held behind a manual `gate` job (click ▶ when ready,
#                   typically right before merge). Intermediate pushes to
#                   the MR burn no minutes; the post-merge master re-run
#                   is gone entirely.
#   build         — build + push the prod release image (git tags only).
#   e2e           — Playwright against a throwaway full stack (MR only).
#   documentation — publish the TypeDoc site to GitLab Pages.
#   deploy        — manual: deploy-dev (native git pull on the mutable
#                   box, default branch) and deploy-prod (immutable image
#                   from a tag). Both materialize config from SSM in CI.
#
# The app never talks to AWS. SSM Parameter Store is read by the deploy
# job (which holds AWS creds), rendered to an env file, and shipped to
# the box — the server only ever reads process.env. See
# docs/deployment.md § Configuration & secrets.

stages:
  - gate
  - validate
  - build
  - e2e
  - documentation
  - deploy

# Run pipelines ONLY for merge requests and default-branch pushes, and
# never two for the same commit — avoids the duplicate branch+MR
# pipeline and saves CI minutes.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # Tag pipelines cut a stable prod release (build-image + deploy-prod).
    - if: '$CI_COMMIT_TAG'

# Shared Node + pnpm setup. The pnpm store is cached on the lockfile
# hash, so install is near-instant after the first run.
.node:
  image: node:22
  interruptible: true
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - npm install -g pnpm@10
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

# MR-only existence. validate (lint/test/build) + e2e exist on merge
# request pipelines only — never on the post-merge master push (that
# re-run was redundant and the heaviest CI spend). master pipelines now
# just publish Pages + offer the manual dev deploy; tag pipelines still
# build + ship the prod release.
.mr-only:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Manual pre-merge gate. On a merge request the pipeline starts BLOCKED
# here; validate/e2e don't run until you click ▶ on this job — typically
# right before merging. So intermediate pushes to the MR burn no CI
# minutes, while a full lint/test/build/e2e pass is still forced before
# merge. allow_failure: false leaves the pipeline blocked until played;
# turn on Settings → Merge requests → "Pipelines must succeed" to gate
# the merge button on it too.
gate:
  stage: gate
  image: alpine:3
  allow_failure: false
  script:
    - echo "Gate opened — validate + e2e will now run."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual

lint:
  extends: [.node, .mr-only]
  stage: validate
  # Blocking gate: the lint backlog was cleared on the fix-lint-backlog
  # branch, so lint now fails the pipeline. The ruleset still emits
  # warnings (e.g. unused vars) that don't fail the build.
  script:
    - pnpm lint

test:
  extends: [.node, .mr-only]
  stage: validate
  script:
    - pnpm test

build:
  extends: [.node, .mr-only]
  stage: validate
  script:
    # `pnpm build` runs tsc for server + types, but the client builds
    # with Vite (esbuild), which strips types without checking them —
    # so typecheck the client explicitly via its tsc `build:types`.
    - pnpm build
    - pnpm --filter @saxonberg/client build:types

pages:
  extends: .node
  stage: documentation
  script:
    # TypeDoc reads the server's TS project references, so
    # @saxonberg/types must be built first — a fresh CI checkout has no
    # dist (the `build` job survives only because `pnpm build` builds
    # types first).
    - pnpm --filter @saxonberg/types build
    # TypeDoc writes the static site to packages/server/docs/api/html;
    # GitLab Pages serves whatever lands in ./public. Use `run` — bare
    # `pnpm docs` invokes pnpm's built-in `docs` command on newer pnpm
    # (10.34+), not our script.
    - pnpm run docs
    - rm -rf public
    - mv packages/server/docs/api/html public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Browser end-to-end tests against a full, throwaway stack. Playwright's
# `webServer` boots the server (AUTH_MODE=test) + client and waits for
# them; the DB is a job-scoped `mongo` service container, not a real
# database. Everything here is ephemeral/throwaway — `mongodb://mongo`
# and the session secret guard nothing real, so there are no secrets to
# materialize (Param Store is only for the live instance). MR-only (via
# .mr-only) — it's heavy, and catching a broken stack on the MR before
# merge is the whole point; the post-merge master re-run added little.
e2e:
  extends: [.node, .mr-only]
  stage: e2e
  # Browsers preinstalled; tag must match @saxonberg/e2e's @playwright/test.
  image: mcr.microsoft.com/playwright:v1.60.0-noble
  services:
    - name: mongo:7
      alias: mongo
  variables:
    MONGODB_URI: 'mongodb://mongo:27017'
    MONGODB_DATABASE: 'saxonberg_e2e'
    SESSION_SECRET: 'ci-e2e-not-a-secret'
    CLIENT_URL: 'http://localhost:5173'
  script:
    - pnpm --filter @saxonberg/e2e test
  artifacts:
    when: on_failure
    paths:
      - e2e/playwright-report/
      - e2e/test-results/
    expire_in: 1 week

# Two deploy targets, two models (see docs/deployment.md § Two instances):
#   dev  — a mutable native git checkout (live write/reload). Updated by
#          `deploy-dev` on default-branch pushes: git pull + rebuild +
#          restart on the box. No image.
#   prod — an immutable image from a stable git TAG. `build-image` builds
#          the release image; `deploy-prod` ships it. Tags only.
#
# Both deploys keep AWS off the box: `deploy/materialize-env.sh` renders
# the env file from SSM in CI (which holds the creds) and scp's it in.
#
# Required CI/CD variables (Settings → CI/CD → Variables), all masked.
# DEPLOY_HOST / DEPLOY_USER / SSH_PRIVATE_KEY are ENVIRONMENT-SCOPED
# (set distinct values for the `dev` and `production` environments):
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  — IAM user scoped to
#       ssm:GetParametersByPath on /saxonberg/* + kms:Decrypt
#   AWS_DEFAULT_REGION                          — e.g. us-west-2
#   SSH_PRIVATE_KEY                             — the deploy user's key
#   DEPLOY_HOST                                 — the box's hostname
#   DEPLOY_USER  (dev: saxonberg · prod: a deploy user)

# Shared SSH + tooling setup for the deploy jobs.
.deploy-base:
  image: alpine:3
  before_script:
    - apk add --no-cache aws-cli openssh-client bash
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

# DEV: refresh the mutable native instance in place. `when: manual` — the
# server is stateful (the world lives in memory; a restart drops live
# connections), so you merge freely and click deploy when ready.
deploy-dev:
  extends: .deploy-base
  stage: deploy
  script:
    - bash deploy/materialize-env.sh dev env.out
    - scp env.out "$DEPLOY_USER@$DEPLOY_HOST:/srv/saxonberg/.env"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd /srv/saxonberg && ./deploy/dev/update.sh"
  environment:
    name: dev
    url: https://dev.saxonberg.panterasbox.net
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual

# PROD: build the release image (tags only) and ship it immutably.
build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_TAG'

deploy-prod:
  extends: .deploy-base
  stage: deploy
  needs:
    - build-image
  script:
    - bash deploy/materialize-env.sh production env.out
    - scp deploy/prod/docker-compose.yml deploy/prod/Caddyfile "$DEPLOY_USER@$DEPLOY_HOST:/srv/saxonberg/"
    - scp env.out "$DEPLOY_USER@$DEPLOY_HOST:/srv/saxonberg/.env"
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" "
        cd /srv/saxonberg &&
        echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY' &&
        export IMAGE='$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG' &&
        docker compose pull &&
        docker compose up -d &&
        docker image prune -f
      "
  environment:
    name: production
    url: https://saxonberg.panterasbox.net
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
