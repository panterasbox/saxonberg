<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1024" height="1024" shape-rendering="crispEdges">
  <!-- The NetHack @: the IBM VGA 8x16 text-mode glyph (code page 437, 0x40),
       white on black, each pixel 1.35x taller than wide as on a 720x400 screen. -->
  <defs>
    <filter id="phosphor" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.35" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="24" height="24" fill="#000"/>
  <g fill="#fff" filter="url(#phosphor)">
    <rect x="9.5" y="5.925" width="5" height="1.35"/>
    <rect x="8.5" y="7.275" width="2" height="1.35"/>
    <rect x="13.5" y="7.275" width="2" height="1.35"/>
    <rect x="8.5" y="8.625" width="2" height="1.35"/>
    <rect x="13.5" y="8.625" width="2" height="1.35"/>
    <rect x="8.5" y="9.975" width="2" height="1.35"/>
    <rect x="11.5" y="9.975" width="4" height="1.35"/>
    <rect x="8.5" y="11.325" width="2" height="1.35"/>
    <rect x="11.5" y="11.325" width="4" height="1.35"/>
    <rect x="8.5" y="12.675" width="2" height="1.35"/>
    <rect x="11.5" y="12.675" width="4" height="1.35"/>
    <rect x="8.5" y="14.025" width="2" height="1.35"/>
    <rect x="11.5" y="14.025" width="3" height="1.35"/>
    <rect x="8.5" y="15.375" width="2" height="1.35"/>
    <rect x="9.5" y="16.725" width="5" height="1.35"/>
  </g>
</svg>
