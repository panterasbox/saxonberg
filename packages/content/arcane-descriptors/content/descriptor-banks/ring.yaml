# Rings — band form × marking.
primaryAxis: band form
primary:
  [flat, rounded, braided, split, coiled, wide, narrow, ridged,
   pinched, stepped, doubled, hexed]
secondaryAxis: marking
secondary:
  [engraved, pitted, scored, dimpled, chased, blank, hatched,
   stippled, grooved, filigreed]

# ── the unidentified long description (class-level, never per item) ──
# The authored `longDescription` on a template is written for the
# IDENTIFIED item and routinely gives the answer away. This is what a
# specimen of the class reads as until the viewer actually knows.
#
# ⚠ Two rules. Claim no MATERIAL — a specimen is truly brass or ash or
# glass, per instance, and class prose that names a substance is simply
# false on half of them. And never hand-write the ARTICLE before
# `{descriptor}`: half the bank is vowel-initial, so write `{a}` (or
# `{A}`) and let it resolve against the word actually drawn.
unidentifiedLong: >
  {A} {descriptor} band sized for a finger, and plain everywhere it is
  not worked. Rings are made to be worn and not explained, and this one
  carries nothing that would explain it.
