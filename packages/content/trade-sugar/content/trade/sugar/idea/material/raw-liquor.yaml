# Raw liquor — raw sugar dissolved in the copper. ⭐⭐ Everything the
# trade does to it is written on this row and read by the kernel's boil:
#
# - `solidsKgPerL` is a fresh liquor's strength; the plateau rewrites the
#   pan's own figure as it boils water off.
# - `boilingPointElevation` is sucrose's: the boil climbs from 100 °C to
#   about 122 °C at the strike and past 140 °C as it caramelises, which
#   is what `measure temperature copper` reads rising.
# - `concentratesTo` is the syllabus — syrup at two-thirds sugar, the
#   strike at nine-tenths (and only from a liquor pure enough to grain: an
#   untempered one goes to blackstrap), caramel, burnt. Names only: no
#   sugar leaves the liquor at an arrow.
# - ⭐ `solubility` + `crystallizesTo` are what makes sugar SET
#   (matter-model-overlaps D12): sucrose's solubility in kg per litre of
#   solution, held above the boil's own concentration all the way up the
#   elevation curve (the pan never grains on the fire), so a strike sets
#   only as it cools — and only once something STARTS it (D14): a piece of
#   sugar put in, a stir, or cooled past `metastableRatio` on its own (a
#   coarse mass). The crop is loaf sugar (raw sugar in a hogshead); the
#   mother liquor is molasses, and it runs out of the mould over four days.
# - ⭐ `purity` is sucrose's share of the dissolved solids — a fresh
#   liquor's 0.8; tempering and skimming raise the liquor's own (its
#   payload's), and every crop lowers what is left by the mass balance, so
#   each re-strike is poorer. `gradeByPurity` reads the grade off it, and a
#   liquor under `minCrystalPurity` will not grain at all: blackstrap.
#
# The stage rows `extends:` this one and keep the curve and the arrows;
# an arrow that names the material already in the pan does nothing.
class: /platform/idea/material/Syrup
data:
  smells: [{ aroma: /base-library/aromas/sugar, strength: 30 }]
  name: raw liquor
  keywords: [raw-liquor, liquor, sugar, syrup]
  appearance: thin and brown, a scum rising on it
  density: 1250
  specificHeat: 3200
  thermalConductivity: 0.5
  electricalConductivity: 0.1
  tastes: [{ type: sweet, amount: 250 }]
  spoilActivationEnergy: 60000
  waterActivity: 0.9
  nutrients: ["sugar", "water"]
  nutrientAmounts: { sugar: 480000, water: 500000 }
  tags: ["liquid", "food", "raw-liquor"]
  boilingPoint: 373
  latentHeatOfVaporization: 2260000
  solidsKgPerL: 0.6
  boilingPointElevation:
    - [0, 0]
    - [0.5, 1.5]
    - [0.7, 5]
    - [0.8, 10]
    - [0.85, 14]
    - [0.9, 22]
    - [0.95, 32]
    - [0.98, 50]
    - [0.99, 60]
    - [1, 70]
  concentratesTo:
    - { fromW: 0.68, becomes: /trade/sugar/idea/material/cane-syrup }
    - { fromW: 0.9, becomes: /trade/sugar/idea/material/strike, minPurity: 0.86, elseBecomes: /trade/sugar/idea/material/blackstrap }
    - { fromW: 0.985, becomes: /trade/sugar/idea/material/caramel }
    - { fromW: 0.995, becomes: /trade/sugar/idea/material/burnt-sugar }
  # Sucrose, kg per litre of solution by `s = w / (1 − 0.375 w)`: 0.89 at
  # 20 °C, 1.20 at the water's boil, and past each boiling point the
  # elevation curve reaches (a strike boils at 395 K holding 1.36).
  solubility:
    - [273, 0.86]
    - [293, 0.89]
    - [323, 0.98]
    - [353, 1.10]
    - [373, 1.20]
    - [395, 1.38]
    - [405, 1.49]
    - [423, 1.57]
    - [443, 1.62]
  crystallizesTo:
    product: /trade/sugar/idea/material/loaf-sugar
    residue: /trade/sugar/idea/material/molasses
    # A hogshead's block is purged coarse and never clayed: muscovado.
    productAs:
      /trade/sugar/thing/raw-sugar-block: /trade/sugar/idea/material/raw-sugar
    drainDays: 4
    metastableRatio: 1.7
    # A fresh liquor's; the liquor's own rides its payload.
    purity: 0.8
    minCrystalPurity: 0.86
    gradeByPurity:
      - [0, poor]
      - [0.88, fair]
      - [0.92, fine]
