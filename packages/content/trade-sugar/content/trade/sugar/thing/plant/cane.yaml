# A stand of sugar cane (sugar D15). ⭐ The warmth is the gate: it stops
# below 288 K and wants 300, and it takes most of a year to ripen — so at
# Terminus's 42° the winter kills it before it is ready, and at Waponi
# Woo's 30° it stops only on the coolest winter nights (a January night
# there reads ~284 K, measured on a standing world) — Madeira's latitude,
# the first Atlantic sugar island.
class: /platform/thing/Plant
data:
  shortDescription: stand of sugar cane
  keywords: [cane, "sugar cane", stand, crop]
  # What `sample` pulls out of the stand (field population D7).
  specimenNoun: stalk of cane
  register: indefinite
  longDescription: |
    Sugar cane taller than a man, jointed stems as thick as a wrist under a crown of long saw-edged leaves.
  _speciesPath: /stuff/idea/species/plantae/tracheophyta/liliopsida/poales/poaceae/saccharum/officinarum
  _materialPath: /stuff/idea/material/tissue/plant-tissue
  lifecycleState: alive
  harvestTemplatePath: /trade/sugar/thing/crop/cane
  nutrientDraw: 40
  # ⭐ Cut with a knife (cover build D3): the cane knife's swath is the
  # ground one stroke works. Bare hands cut a little, and badly.
  harvestTool: reaping
  profile:
    moistureHappyAt: 0.4
    moistureWiltAt: 0.1
    litresPerGameDay: 0.6
    luxHappyAt: 400
    luxDarkAt: 40
    coldStopK: 288
    warmHappyK: 300
    rootDemand: { seedling: 0.3, young: 1.5, established: 3.0, mature: 4.0 }
    daysToStage: { young: 30, established: 120, mature: 330 }
    # ⭐⭐ RATOON — cut, and it comes again from the root (the polycarp
    # cycle; the plant keeps its place). ⭐ An AREA crop since the cover
    # build: one plant stands over the whole piece and each `harvest` cuts
    # one knife's swath of it (about a bundle), so the gang works the
    # piece round by AREA and the fill below is the ratoon's own regrowth
    # once the last of the piece is down — not, as it was, a five-day
    # stand-in for the rotation. ⚠ One bundle a stroke still: three
    # thirty-kilo bundles froze every cutter in place
    # (`locomotion-gate-failed`, sugar drive 8), so the knife's swath is
    # sized to one.
    fruitSetCount: 1
    fruitFillDays: 120
    # ⭐ The yield is two numbers (cover build D2): 0.8 kg of sett a square
    # metre, ten times that back — about 80 tonnes a hectare, which is a
    # plantation's figure. Each ratoon gives about an eighth less, so a
    # piece cut five or six times is tired and wants grubbing out and
    # replanting from cut cane.
    seedRateKgPerM2: 0.8
    yieldRatio: 10
    yieldDeclinePerCycle: 0.12
