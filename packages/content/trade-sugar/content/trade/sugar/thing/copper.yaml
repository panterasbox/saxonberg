# The sugar copper — a refinery's boiling pan: a hundred and twenty litres
# of beaten copper, open, set on the arch to boil. ⭐ What boils in it is
# the kernel's plateau reading the liquor's own material; the copper's
# grade (written by `temper` and `skim`) is what the strike arrow reads.
class: /trade/sugar/thing/Copper
