# A plough beam — ⭐ the part a plough is built round and the one that
# outlives everything fitted to it. The share wears out every season and
# the stilts every few; the beam is hewn once and passed down. Hewn ash:
# it takes the whole draught of whatever is pulling, along its length.
class: /platform/thing/Timber
