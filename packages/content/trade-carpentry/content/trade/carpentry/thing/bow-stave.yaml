# A bowstave — a riven length of yew with the sapwood left on the back
# and the heartwood on the belly. ⭐ The part a bow is made of, and the
# one where the species is the whole point: sapwood takes the stretch,
# heartwood takes the squeeze, and yew is the wood that has both in one
# piece. Carved from a riven blank (`carve bowstave`); a bowyer buys
# them seasoned and keeps them years.
#
# Riven, never sawn: a stave whose fibres are cut across snaps at the
# first full draw. The bill names this row with `material: yew`; one
# carved from an ash blank is an ash bow, and a worse one.
class: /platform/thing/Timber
