# A straight haft — the plain helve a mace, a war-hammer or a flail is
# hung on. No curve, no swell at the neck: a striking weapon wants its
# weight in the head and a grip it cannot twist out of.
class: /platform/thing/Timber
data:
  keywords: [haft, straight-haft, "straight haft", helve]
  shortDescription: straight haft
  register: indefinite
  longDescription: >-
    A straight wooden helve, octagonal at the grip and rounded where
    a head is meant to go on, a wedge slot sawn down the top end.
  mass: 0.8
  # ⭐ Riven and carved wood: it SEASONS (assembly D2). One off a shelf
  # has had its year; one carved from a green billet carries the billet's
  # fraction instead, and warps where it is fitted.
  constructionForm: riven
  seasonedFraction: 1
  _materialPath: /stuff/idea/material/wood/oak
