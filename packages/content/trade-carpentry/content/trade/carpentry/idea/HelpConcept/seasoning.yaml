# ⭐⭐ Why you wait — the reason a woodworker's yard is full of stacked
# wood that nobody is using.
class: /platform/idea/HelpConcept
data:
  key: seasoning
  title: Seasoning
  summary: Why green wood is cheap, and why a thing made of it fails.
  keywords: [seasoning, seasoned, green, dry, drying, warp, shrink, board, wood]
  seeAlso: [grain, the-cut]
  body: |
    A tree is wet. Half the weight of a fresh-felled oak is water, and
    wood shrinks as that water leaves it — not evenly, but more across the
    growth rings than along them. A board that dries after it has been
    made into something pulls the something apart.

    ## Green and seasoned

    **Green** wood is wood that has not dried: easy to work, cheap, and
    honest to buy if you know what it is. **Seasoned** wood has stood in
    the air until it has given up what water it is going to give, and it
    will not move much again.

    Seasoning takes time and nothing else. A stack of boards in the open
    air, with sticks between them so the air can get round, dries at its
    own species' rate — about a year for an inch of oak, less for pine,
    longer for elm. Rain on an open stack puts the water back. A shed
    with a roof and open sides is the whole of the technology.

    ⭐ **Work it green and it fails, for a stated reason.** A haft carved
    green shrinks in the head and works loose. A frame pegged green
    racks as the rails shrink round the pegs. Nothing is wrong with the
    work; the wood moved after it.

    ## Why it is priced

    Because somebody had to own that wood for a year without being paid
    for it. Seasoned stock costs more than green, and it should: the
    difference is the timber yard's patience.
