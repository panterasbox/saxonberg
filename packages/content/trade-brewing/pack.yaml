id: trade-brewing
version: 0.1.0          # reserved; nothing reads/enforces it (non-goal: version machinery)
root: /trade/brewing
description: >-
  The brewing trade — de-stubbed by the fermentation build (W5): the
  working brewhouse (mash tun, standpipe, work board, warm vats, the
  house barm) over the kernel transform, the COLD STORE below it (the
  lager line: the cold strain plus the cold cellar, D14), the mash and
  lager-mash recipes with spent grain as conservation's residue (P11 —
  sold back to the growers), the cask as a Vat-family conditioning
  vessel (real ale, P9), the ale/lager ferment + culture profiles, and
  the cellars beats that mash, pitch, keg and consign onto the
  distribution counter. The floor-keg faucet stands until the W8
  switchover.
requires:
  # The trade is placeless (economic bootstrap D6/D7): its mechanism is
  # held by the Ministry of Trade — a seat, never a committee. Its
  # premises, if any, sit in the world under a locality's committee.
  title:
    - { extent: /trade/brewing, holder: { organization: /compact/trade } }
