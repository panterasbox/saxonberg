# The cask — the conditioning vessel (fermentation P9): a row of the
# VAT family, so ale racked into it referments its residual sugar
# SEALED where it stands — real ale, naturally carbonated. `liquidTight`,
# NOT `sealed`, and that is not an oversight: a cask breathes through
# the oak; bung it (`close`) and the conditioning profile takes over.
class: /platform/thing/Vat
extends: /stuff/thing/vessel/cask
data:
  shortDescription: "cask"
  keywords: [cask, barrel, oak, empty]
  register: indefinite
  longDescription: "An oak cask, hooped and bunged, that once held something stronger."
  # The VESSEL KIND — the tie between this row and every product
  # that is this vessel filled (an emptied one counts and reads as this).
  category: cask
  _materialPath: /stuff/idea/material/wood/oak
  interiorBulk: true
  interiorCapacity: 50
  closure: liquidTight
  open: true
  # ⭐ A conditioning cask gives its ale nothing — the commons cask's oak
  # character is a SPIRIT cask's, and an ale cask is pitched and seasoned
  # until it does not taint. Stated as empty so the inheritance is not
  # silent (assembly D10; AC 27 — the brewing behaviour is unchanged).
  imparts: []
  charredImparts: []
