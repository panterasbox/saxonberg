# Tamsin Roke — the brewery outfit's hand. Holds the outfit's `hand` position
# (`purchases: true`): dealt the house card at hire, then the `consigns`
# brain drives the literal verbs — `get`, `wallet use house`, `consign …
# --ask` — carrying the stock to the cash-and-carry counter and consigning
# it AS the outfit. The counter path is this config's, never the trade's.
class: /platform/agent/Cast
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: Tamsin Roke
  pronouns: they
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  primaryKeyword: hand
  alternateNames: ["tamsin", "roke"]
  shortDescription: "a broad brewer's hand in a rubber apron"
  longDescription: |
    A broad-shouldered hand in a rubber apron, forearms like hawsers from rolling kegs. Smells of malt.
  dispositions:
    - { disposition: diligence, valence: 60 }
  # ── the dossier ─────────────────────────────────────────────────
  # Evidence, never values: each entry below expands into the same rows a
  # lived history would have written, marked `claim`. Seeded once at
  # postRegister and skipped if any claim already exists, so a reclone or
  # a reboot cannot mint a second history.
  # ⚠ A best-guess pass, explicitly provisional — the considered version
  # is a content pass of its own before go-live.
  archetype: hand
  competence:
    - { discipline: brewing, asserting: novice }
    - { discipline: fermenting, asserting: novice }
  behaviors:
    # The producing beats (fermentation W5). The brewhouse beat mashes
    # off the board, pitches the house barm, kegs finished ale and
    # consigns it; alternate mash beats run the LAGER LEG — the cold
    # mash carried down and pitched with the cold strain. The cold-store
    # beat kegs finished lager (it never mashes or buys). The W8
    # switchover retired the keg faucet: every keg on the counter is
    # now a batch these beats brewed.
    - brain: /lib/behavior/cellars
      trigger: cadence:120s
      config:
        home: /trade/brewing/location/brewing-floor
        counterRoom: /trade/distribution/location/cash-and-carry
        crushes: [mash]
        pitchJar: true
        lagerLeg:
          recipe: lager-mash
          room: /trade/brewing/location/cold-store
        buyKeyword: malt
        inputMin: 1
        vesselCategory: keg
        vesselKeyword: keg
        batch: 3
        buyEvery: 5
        asks:
          ale: 12
          "cask ale": 14
    - brain: /lib/behavior/cellars
      trigger: cadence:150s
      config:
        home: /trade/brewing/location/cold-store
        counterRoom: /trade/distribution/location/cash-and-carry
        crushes: []
        buyEvery: 0
        vesselCategory: keg
        vesselKeyword: keg
        batch: 3
        asks:
          lager: 13
    - brain: /lib/behavior/idles
      trigger: cadence:41s
      config:
        pool:
          - { kind: free, value: "rolls a keg into line with one boot." }
          - { kind: free, value: "rinses a coupler and hangs it up." }
