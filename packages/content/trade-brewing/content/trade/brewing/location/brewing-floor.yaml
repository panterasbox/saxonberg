# the brewery outfit's floor — the yard: the outfit's Stock (the floor rows' home
# `container:` — the sweep stands them at target here) and the hand whose
# `consigns` beat carries them to the cash-and-carry. No exits: the hand
# teleports (the `shifts` shape); a walk is the locomotion slate's.
# An ordinary location, not a FurnishableRoom: that class is the
# FURNISHING archetypes' base. A trade floor's durability lives on its
# persistable fixtures (the Stock, the racking, the counter) — the
# consigned goods and their listings ride those, never the room; the
# `populates` set below is the placement and respawns each boot.
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  # ⚠ `coords:` is the MEMBERSHIP operation — `setCoords` is the only way
  # an authored row joins a zone, so without it this floor was in no grid
  # and inherited nothing from one. See the zone row beside it.
  coords:
    x: 0
    y: 0
    z: 0
  shortDescription: "the brewery floor"
  primaryKeyword: floor
  keywords: ["floor", "brewery", "brewhouse", "yard"]
  longDescription: |
    A wet stone floor under a roller door, and a working one: the copper tun steams by the standpipe, two oak vats stand chalk-tallied against the wall, the brewhouse board hangs over the paddle rack, and a wired jar of barm sits shoulder-high out of the draught. Stacked kegs wait by the door; the cold store is below.
  ambientIntensity: 25
  ambientColorTemperature: 4200
  # A warm brewhouse: the ale band's happy middle (the cold store is
  # the lager's — the band is a PLACE, never a rule).
  _temperature: 288
  # A working brewhouse displaces its own air (P11).
  reserves:
    air:
      capacityValue: 100
      currentValue: 100
      unit: "%"
  props:
    - /trade/brewing/thing/brewing-stock
    - /trade/brewing/thing/mash-tun
    - /trade/brewing/thing/standpipe
    - /trade/brewing/thing/brewhouse-board
    - /trade/brewing/thing/vat
    - /trade/brewing/thing/vat
    - /trade/brewing/thing/jar-of-barm
  cast:
    - /trade/brewing/agent/brewing-hand
