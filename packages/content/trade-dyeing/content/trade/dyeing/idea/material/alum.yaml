# Potash alum — a MORDANT.
#
# Brightens — the "true" colour. The default, the expensive one, and the reason a bright red was a rich household’s red.
#
# ⚠ A mordant is not a dye. It carries no colour of its own; it is what
# a colour BINDS TO, which is why the skill in this trade is
# front-loaded: you commit to a colour family in the first bath, before
# you can see anything at all.
class: /platform/idea/material/Material
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: alum
  appearance: clear white alum crystals
  keywords: [alum, alum]
  density: 1750
  thermalConductivity: 0.3
  hardness: 2
  toughness: 1
  specificHeat: 900
  electricalConductivity: 1.0e-4
  waterAbsorptionCapacity: 5
  edibility: false
  nutrients: []
  toxicity: []
  tags: ['mordant', 'mineral', 'brightening']
  composition: []
  chemistry:
    formula: KAl(SO4)2
    molarMass: 258.19
  biologicalSource: null
