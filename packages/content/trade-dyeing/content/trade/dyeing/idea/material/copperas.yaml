# Copperas — a MORDANT.
#
# ⭐ SADDENS — darkens and dulls. Madder goes maroon, weld goes olive. One of those facts that reads like a discovered secret the first time somebody uses it on purpose.
#
# ⚠ A mordant is not a dye. It carries no colour of its own; it is what
# a colour BINDS TO, which is why the skill in this trade is
# front-loaded: you commit to a colour family in the first bath, before
# you can see anything at all.
# ⭐ The dyer's word is "iron"; the substance is copperas, iron(II) sulfate —
# a salt. Until the material decomposition this row was a second `iron`.
class: /platform/idea/material/Salt
data:
  name: copperas
  keywords: [copperas, iron]
  appearance: rusty green copperas
  density: 1750
  thermalConductivity: 0.3
  hardness: 2
  toughness: 1
  specificHeat: 900
  electricalConductivity: 1.0e-4
  tags: ['mordant', 'mineral', 'saddening']
  formula: FeSO4
  molarMass: 151.91
