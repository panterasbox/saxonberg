# Alum liquor — ⭐ alum is made by cooling a hot liquor (ceramics S17).
#
# The alum works boiled their leached liquor strong and ran it into
# "roching" casks to cool: potash alum dissolves about seventeen times
# better at the boil than at freezing, so the clear hot liquor sets its
# crop on the cask walls as it cools, and the mother liquor (`residue`, the
# liquor itself) goes back to the pans. The crop is this pack's own mordant.
#
# ⚠ The curve is approximate (kg per liter of solution); its STEEPNESS is
# the lesson, against salt's nearly flat one.
class: /platform/idea/material/Material
