# The dyehouse vat — rung N of the ladder.
#
# ⭐ `rate` for scale and `control` for EVENNESS, which is the quality
# axis this trade already needs — and **evenness is what the dyehouse
# sells**. A garment dyed at home in a household pot is the worst stage
# on the worst equipment and comes out visibly amateur, which is correct
# and is another legible social signal.
