verbs: [mordant]
category: dyeing
controller: /trade/dyeing/idea/cmd/dyeing/MordantController
description: "Prepare cloth in a metal bath so a colour will bind"
help: |
  `mordant <thing> [in <bath>]` puts cloth through the first of two
  baths. The bath is a vessel of mordant — alum, iron (copperas) or
  tannin — and a piece takes a dose of it; bare, the first such vessel
  in reach is used.

  ⭐ A mordant carries no colour of its own. It is what a colour BINDS
  TO — so the skill in this trade is front-loaded: you commit to a
  colour family before you can see anything at all. **Alum** brightens
  to the true colour, **iron** saddens it (madder goes maroon, weld goes
  olive), and **tannin** is what makes a plant fibre take a metal at
  all.

  ⚠⚠ Skip it and the colour does not hold. It washes straight out on
  the first launder, and there is nothing to be done about it
  afterwards.

  ⚠ Woad takes no mordant. A vat dye is a different chemistry, and alum
  before a woad vat is alum wasted — the vat will say so.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: target
    type: object
    required: true
    scope: [inventory, reachable]
    requires: DyedMixin
  # ⭐ WHICH BATH — DECLARED, not hunted (C9, controller-liquidity W11).
  # It was a bare word (`with alum`) that bound nothing and cost nothing;
  # the mordant is the bath's MATERIAL now, and a dose is spent from it.
  # Bare, the binder hands over every reachable vessel and the controller
  # takes the first holding a mordant; `mordant the wool in the tub` names
  # one.
  - name: bath
    type: objects
    required: false
    prepositions: [in, with, at]
    default: "reachable:[mixin.BulkableMixin]"
    scope: ["here", "peers", "person"]
    requires: [BulkableMixin]
