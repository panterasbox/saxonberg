id: trade-dyeing
version: 0.1.0
root: /trade/dyeing
description: >-
  The dyeing trade — colour, and ⚠⚠ TWO CHEMISTRIES rather than one.
  Madder and weld are MORDANT dyes: they need a metal ion to bind, so
  what colour you get is decided at the mordant bath before you can see
  it. Woad is a VAT dye — insoluble, reduced in an alkaline vat,
  oxidised in the AIR to blue, and taking no mordant at all. ⭐ Competence
  buys fastness and repeatability, never a brighter hue: the dye decides
  the colour, the craft decides whether it stays.
requires:
  # The trade is placeless (economic bootstrap D6/D7): its mechanism is
  # held by the Ministry of Trade — a seat, never a committee. Its
  # premises, if any, sit in the world under a locality's committee.
  title:
    - { extent: /trade/dyeing, holder: { organization: /compact/trade } }
  # ⭐ The dyestuff roster warms on first use (the scan sweep): `dye`
  # stands the catalogue up before it matches a bath — nothing boots it.
  # The dyehouse's own boot entries moved to `terminus` with the rows
  # (economic bootstrap D6): a trade is placeless; its floor is the city's.
