# Milk of lime — quicklime slaked in water (potash D14): a hot white slurry
# of slaked lime, caustic, and the thing a soap-boiler stirs into a lye to
# make it strong enough for hard soap. Made in the kettle by pouring water
# on a lump of lime; it heats as it slakes.
class: /platform/idea/material/PigmentPaint
data:
  smells: [{ aroma: /base-library/aromas/lime, strength: 60 }]
  name: milk of lime
  keywords: ["milk of lime", "slaked lime", limewash, slurry]
  appearance: a thin white slurry, like watered milk
  density: 1150
  specificHeat: 3600
  thermalConductivity: 0.6
  meltingPoint: 271
  corrosiveTo: [tissue]
  tags: [liquid, caustic, alkali, slaked-lime]
  # ⭐ LIMEWASH (paint build, requirements gap 1): brushed on a wall it
  # lays a white coat that hardens by drinking the air — carbonation, over
  # days, and slowly where the air does not move. Rows only: the kettle that
  # slakes it is unchanged.
  laysCoat: true
  coatWord: limewashed
  solidsKgPerL: 0.3
  # A limewash wants renewing every season or two.
  weatheringMPerGameYear: 0.00003
  pigment: { transmitR: 0.97, transmitG: 0.97, transmitB: 0.95, hidingPower: 0.55, lightfastness: 1 }
  kinetics:
    - key: set
      sets: carbonation
      order: 0
      rate: [[273, 0], [283, 0.012], [293, 0.02], [303, 0.03]]
