# Lye — water dripped through wood ash in a hopper (cleanliness D24). The
# potash in the ash goes into the water and comes out of the bottom as a
# caustic liquor strong enough to float an egg. About half a day. ⭐ Run
# only by a hopper with ash in it (`Hopper.matchProfile`): nothing else
# carries `lye-leach`.
class: /platform/idea/maturation/MaturationProfile
data:
  key: lye-leach
  inputCategory: lye-leach
  mechanism: chemical
  # ⭐ A leach is the water dissolving the salt out of the ash — not a
  # ferment — so it runs in any water that is liquid (found by the potash
  # drive: a winter lean-to at 274 K stalled at the old 275 K floor, the
  # hopper never made lye, and the pots boiled plain water).
  stallBelowK: 273
  happyK: 275
  damageAboveK: 400
  ratePerDay: 2
  productMaterial: /trade/chandlery/idea/material/lye
  wildStrain: ''
  spontaneousLagDays: 0
