# A candle — ⭐⭐ **the end of two chains, and it burns itself down.**
#
# Bees → comb → crushed for wax → melted → dipped. Or: a beast → suet →
# rendered to tallow → poured → dipped. **One row for both**, because
# `Candle` builds its descriptions off the material and the recipe
# derives the material from whatever was in the pot.
#
# ⚠ It moved here from `/stuff/thing/candle` in `generic-objects`, where
# it had **beeswax welded into three fields** — `shortDescription:
# beeswax candle`, `_materialPath: …/beeswax`, and a long description
# that said *pale wax* and *smelling of honey*. A tallow candle was
# therefore unauthorable without a second row.
#
# ⚠ A `Lamp` with no refill: what it burns is itself, which is why the
# fuel reserve IS the candle. Dimmer and warmer than a lantern, and that
# difference is what a player sees when they light one.
#
# ⚠ The stem is the bare noun. `Candle.getShortDescription` puts the
# material in front of it (*tallow candle*), so authoring one here would
# render *beeswax beeswax candle*.
#
# ⚠ It does not answer to `wick`. A lantern's wick is a PART (the
# chandler's `wick` row), and a bill's part is matched by keyword: a
# candle answering to `wick` would be fitted into a lantern's burner.
class: /trade/chandlery/thing/Candle
data:
  keywords: [candle, taper]
  shortDescription: candle
  register: indefinite
  longDescription: ""
  # ⚠ No `_materialPath`. The dip stamps it, and a candle that arrived
  # any other way is honestly made of nothing in particular.
  mass: 0.12
  # ⚠ Ships cold and out (`lint:light-sources` refuses a Burner row that
  # omits `lit:`, and a candle that arrives already burning is a candle
  # nobody decided to light).
  lit: false
  # ⭐⭐ **The fire build: a burner's fuel is a BED, not a Reserve.** This
  # row authored `reserves: { fuel: … }` — a percentage of nothing, which
  # could not say what the flame was burning and which nothing refills.
  # `ReservedMixin` left the `Burner` chain, so that block was inert and
  # a candle off a shop counter was a light that could never be lit.
  #
  # ⚠ The bed is a DEFAULT, not a weld — which is the distinction this
  # class exists to make. Tallow is the ordinary candle (the class's own
  # docstring: *the cheap light the whole medieval world actually
  # burned*), so a candle that arrived off a counter is a tallow one; a
  # DIPPED candle has `adoptMaterialFuel()` re-charge the bed with
  # whatever fat was in the pot, beside the smell it already adopts. So a
  # third fat is still a material row and no code here.
  maxBurnPowerW: 80
  fuelCapacityKg: 0.2
  fuelBed:
    /trade/cooking/idea/material/tallow: 0.1
  # Dim and very warm — a tenth of a lantern and a good deal yellower.
  # ⭐⭐ The darkness sweep (fire build): `emittedIntensity` is a CEILING
  # now rather than the reading, because luminosity is incandescent soot
  # — a flame at full draught sheds `fire.light.sootyFloor` (0.6) of it.
  # Every burner's authored figure is scaled by 1/0.6 so a well-run flame
  # lights its room exactly as brightly as it did before. 12 → 20.
  emittedIntensity: 20
  emittedColorTemperature: 1900
