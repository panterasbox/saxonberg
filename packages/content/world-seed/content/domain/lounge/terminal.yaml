# The lounge's TPA node — the network's eager boot root (in bootstrap.ts).
# Both-directional, comped; routes to the Terminus arrival gate on University
# Avenue (the standalone University Avenue terminal is retired — Terminus
# absorbs the campus-arrival role; walk across the avenue to campus).
# `seatIn` names the lounge Warren: the terminal seats ITSELF into the elastic
# host on postRegister and registers to re-seat on host migration
# (FixtureMixin). Its arrival room is the Warren host
# (LoungeTerminal.getArrivalRoom).
#
# The lounge arrival room is a Warren host (a runtime role) that carries no
# stable address, so the board's covering-Locality lookup can't resolve "The
# Lounge" — LoungeTerminal overrides `getDestinationLabel()` to return "The
# Lounge" directly (the guaranteed board label, D13/[DECIDE-ADDR]), while the
# terminal's own `shortDescription` stays generic (it reads correctly in the
# lounge room). The keyword `lounge` is the typeable `teleport lounge` handle.
class: /domain/lounge/LoungeTerminal
hydratorClass: /obj/persistence/PersistentHydrator
data:
  seatIn: /domain/lounge/warren
  shortDescription: a Teleport Authority terminal
  keywords: [lounge]
  directionality: both
  routes:
    - to: /domain/terminus/terminal/arrival-terminal
