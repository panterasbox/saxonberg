# Terminus Terminal — Departure Gate B (out of service). One of two dead
# gates: authored-static out-of-service content (D8). Its terminal shows a
# grey status light and refuses travel. Generic room; connections declared
# explicitly on both sides — the hall lies one cell east.
class: /obj/location/Room
hydratorClass: /obj/persistence/PersistentHydrator
data:
  shortDescription: Departure Gate B
  primaryKeyword: gate-b
  longDescription: |
    A departure gate off the hall, cordoned off behind a folding barrier. Its terminal stands dark, the status light a dead grey; a laminated notice zip-tied to the rail reads OUT OF SERVICE — thank you for your patience. Dust has settled on the platform. Whatever line ran from here doesn't, for now.
  coords:
    x: -1
    y: 0
    z: 0
  populates:
    - /domain/terminus/terminal/departure-terminal-b
  exits:
    east:
      destination: /domain/terminus/terminal/hall
  details:
    notice:
      keywords: [notice, sign, barrier, cordon]
      description: |
        A laminated notice, curling at the corners: OUT OF SERVICE. No date, no explanation — the Authority's idea of an apology. The barrier behind it is the folding kind, more suggestion than wall.
