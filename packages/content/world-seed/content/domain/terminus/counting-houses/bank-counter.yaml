# The Goodkin teller counter — the BankMixin fixture in the banking hall. The
# banking verbs come off IT (a Location's own contributions don't reach
# occupants), not the room. Its Container contents ARE the cash vault (the
# till), secured by till security (vault coin leaves only through the banking
# verbs — never a loose `get`). corpoKey: goodkin is the affiliation opening an
# account here records; the corpo royalty on each fee flows to the Goodkin
# treasury off this key.
#
# Terms (the fee schedule) are authored here and read at each verb. Goodkin's
# schedule is nearly fee-free (the design: the core custodial loop — open,
# deposit, withdraw your own money — is free everywhere; fees live only on
# movement/convenience). Goodkin's ONE live fee is a light cross-corpo wire fee
# (rivalry has a cost); everything else is zero (built-but-permissive).
#
# The Goodkin branch Business is resolved from the counter's own path via its
# operatingLocations (EmploymentApi.businessAt), not a field here. The opening
# vault float is seeded at boot (BankingApi.seedFloat — mint coin into the till
# backed 1:1 by the branch's own operating balance), so early withdrawals work
# before customer deposits accumulate.
class: /obj/BankCounter
hydratorClass: /obj/persistence/PersistentHydrator
data:
  shortDescription: the Goodkin teller counter
  longDescription: |
    A long counter of honey-coloured wood topped with a brass rail, a worn
    ledger pad, a tray of stamped Goodkin sunrise tokens, and a little card
    reader angled toward the customer side. A discreet brass grille separates
    the public side from the till and the vault beyond. It is kept scrupulously
    tidy, and there is always, somehow, a fresh cup of coffee going cold on the
    customer's side of it.
  keywords: [counter, teller, desk, window, till, grille]
  corpoKey: goodkin
  terms:
    minBalance: 0
    openingFee: 0
    transactionFee: 0
    wireFee: 0
    crossCorpoFee: 2
    cardReissueFee: 0
