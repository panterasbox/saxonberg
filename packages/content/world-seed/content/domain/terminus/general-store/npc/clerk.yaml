# Pemby — the general-store clerk. The on-shift server on the counter's roster
# (position `clerk`); with the counter self-service + instant, he's flavour and
# a paid pair of hands rather than a gate. Cheerful, encyclopaedic about which
# torch burns longer. No employment block on the NPC — the Business roster is
# the single source of truth (the tick lazy-materializes the record).
class: /obj/NPC
hydratorClass: /obj/persistence/PersistentHydrator
data:
  name: Pemby
  pronouns: he
  _speciesPath: /obj/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  primaryKeyword: clerk
  alternateNames: [pemby, shopkeeper, boy]
  shortDescription: a cheerful shop clerk
  longDescription: |
    A gangly young man in a canvas apron two sizes too big, sleeves shoved up, a pencil behind one ear and another lost somewhere in his hair. He knows the stock the way some people know a song — which torch burns longer, which lantern's worth the extra coin — and he'll tell you, unasked, at length, and usually he's right.
  dispositions:
    - { disposition: diligence, valence: 55 }
    - { disposition: gregariousness, valence: 60 }
  behaviors:
    - brain: /lib/behavior/introduces
      trigger: arrival
    - brain: /lib/behavior/greets
      trigger: arrival
      config:
        lines:
          - "\"Welcome in!\" Pemby calls, not looking up from the ledger. \"Torches by the till, waterskins on the hook, everything's on the slate.\""
          - "\"Kitting out?\" Pemby grins. \"Start with light and water, trust me. Everything else you can regret later.\""
          - "\"Anything you can't find, just holler — or leave it on the shelf and I'll sell it on for you.\""
    - brain: /lib/behavior/idles
      trigger: cadence:21s
      config:
        pool:
          - { kind: free, value: "straightens a row of lanterns so the tin catches the light." }
          - { kind: free, value: "licks a pencil and updates the price slate, frowning at his own handwriting." }
          - { kind: say, value: "Fill the skin before you go down. Nobody ever came back wishing they'd carried less water." }
          - { kind: free, value: "trims a torch's oily wrap so it'll catch clean on the first strike." }
