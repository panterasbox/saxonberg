# University Avenue — the crossing (Gus's room). One segment of a normal
# city street, and the busiest crossing in Terminus because the TPA terminal
# empties onto it from the SOUTH. Corrected geometry (2026-07-12): the
# Terminus station fronts SOUTH (players spill out of `arrival-gate` and cross
# north into this room), the locked university gate stands NORTH across the
# avenue, and the avenue continues E/W — WEST to the Goodkin bank (temp
# reachable), EAST soft-walled by Gus in dialogue (no real exit that way; the
# paddle gates nothing — see the crossing-guard sheet).
#
# The room is a `/obj/Crossing` (CartesianLocation subclass) for one reason:
# the dynamic `tower` detail reads the world clock directly and appends the
# terminal clock tower's honest civic hour (the drift-reveal). The tower
# itself is prose, not Stuff. Everything else is plain seed data.
#
# Cross-zone exits are authored explicitly on BOTH sides: `south`→the
# Terminus arrival gate is the reciprocal of the gate's own `north`→here (two
# independently-owned zones that touch; a cardinal name is allowed cross-zone).
# The NORTH gate is a real, closed + LOCKED Door onto a placeholder
# gatehouse — the campus interior is deferred, but the boundary is honest
# (Gus soft-walls it: "the gate's for the gown, not yet"). Note: exits eager-
# clone their destination at boot (Exitable.applyExits → StuffApi.singleton),
# so the north gate points at a real loadable stub (`campus-gate`), NOT a
# dangling path — the locked *veto* never resolves the destination, but boot
# hydration does.
class: /obj/Crossing
hydratorClass: /obj/persistence/PersistentHydrator
data:
  shortDescription: University Avenue
  primaryKeyword: crossing
  # Sky-exposed outdoor city street: the biome makes the room weather-eligible
  # (SkyExposedBiome from the base-library content pack) and the address puts
  # it under the University Avenue locality (weather + departures-board name).
  _biomePath: /obj/biome/outdoor/baseline
  _address: university-avenue/crossing
  longDescription: |
    A broad city crossing where University Avenue meets the mouth of the Terminus station. The street is loud with strangers — travellers spilling out of the terminal to the south, checking the sky, hurrying on — and empty of anyone who lives here; the locals keep to the districts downtown, and the avenue running east and west is a place people pass through, never stop. Across the way to the north, past a low wall and a set of tall shut gates, the pale terraces of Eternal University rise behind their railings. Underfoot the stone is swept but worn in a diagonal track, the way a hundred thousand arrivals have already crossed it. In all the churn, one thing holds still: the crossing guard at his post, watching a road that no cart ever comes down.
  coords:
    x: 0
    y: 0
    z: 0
  exits:
    # SOUTH across the avenue to the Terminus arrival gate (cross-branch, both
    # sides explicit). WEST one cell to the Goodkin bank (temp reachable; the
    # bank declares `east` back here). NORTH through the locked university gate
    # onto the placeholder gatehouse. NO east exit — Gus soft-walls it.
    south:
      destination: /domain/terminus/terminal/arrival-gate
    west:
      destination: /domain/terminus/counting-houses/avenue-block
    north:
      destination: /domain/eternal/university-avenue/campus-gate
      door: /domain/eternal/university-avenue/campus-gate-door
  details:
    tower:
      keywords: [tower, clock, clocktower, time]
      # Static base; /obj/Crossing.getDetail appends the world clock's LIVE
      # civic reading across the avenue (the drift-reveal). Degrades to this
      # string alone when no world clock is running.
      description: |
        High on the face of the Terminus station across the avenue, a civic clock tower keeps the standard time the whole station runs on — the honest hour, posted where the whole street can check it.
    gate:
      keywords: [gate, gates, gatehouse, university, campus, wall, railings]
      description: |
        Tall iron gates set in a low stone wall, shut and chained, the university's pale terraces rising behind them. A brass plate on the pier reads, in worn capitals, ETERNAL UNIVERSITY. The gate is for the gown, and it is not open yet.
    terminal:
      keywords: [terminal, station, terminus, facade, mouth, arch]
      description: |
        The grey mouth of the Terminus station fronts the crossing to the south — a frosted-glass arch under a weathered stone facade, arrivals coming through it in ones and twos, blinking at the daylight. It is where everyone here has just come from, and where most of them are already leaving to.
    street:
      keywords: [street, avenue, road, stone, kerb, curb, gutter]
      description: |
        University Avenue runs east and west, swept stone gone smooth down the middle and grittier at the gutters. It is a passage, not a place — nobody's shopfront, nobody's corner; the doors along it are shut and dark, businesses that keep their custom somewhere the locals actually live.
    trees:
      keywords: [trees, tree, plane, planes, grate, grates, bench, seat]
      description: |
        A row of plane trees stands in iron grates along the kerb, mottled bark peeling in map-shapes, their crowns thin against a real city sky. A single municipal bench sits beneath them, bolted to the stone and clean of wear — somewhere to sit, if anyone here ever sat.
    lamp:
      keywords: [lamp, lamppost, lamp-post, post, iron, light]
      description: |
        A cast-iron lamppost leans a little at the kerb, fluted and old, dark by day. Come dusk it will find its own light without anyone asking — the one bit of the street that keeps a schedule as faithfully as Gus does.
  # Realized Stuff is kept DELIBERATELY sparse — only things a player would
  # reach out and touch that also carry the room's flavor (the curation pass,
  # 2026-07-13). The generic municipal furniture (a bench, a lamppost, a litter
  # bin) is now prose in `details:` above, not a prop table in the contents
  # list. What stands up as real objects:
  #   - the camp chair — the *relief's*, kept deployed (unfolded); the running
  #     joke that an empty crossing has a whole shift roster. Foldable, sit-able.
  #   - the beacon — the walk/stop signal for a road no cart comes down.
  #   - the gutter ticket-stub — one takeable bit of an arrival's litter loose
  #     on the stone (the churn of the terminal made touchable).
  #   - Gus — a plain bare-string populate (an NPC clone moved into the room);
  #     his gear is NOT populated here (the `/obj/Gus` class equips it at
  #     standup — no declarative seed path to wear/wield gear on a creature).
  # The thermos rides on Gus (his "won't open"), not loose here.
  populates:
    - /domain/eternal/university-avenue/camp-chair
    - /domain/eternal/university-avenue/beacon
    - /domain/eternal/university-avenue/gutter-litter
    - /domain/eternal/university-avenue/npc/gus
