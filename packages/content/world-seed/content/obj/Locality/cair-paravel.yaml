# Cair Paravel — a nested Locality proving longest-prefix-wins.
#
# Claims `narnia/castle`. A scope at `narnia/castle/...` resolves here,
# not to the shallower Narnia — the more-specific Locality covers.
# templatePath `cair-paravel` deliberately bears no resemblance to the
# claimed address `narnia/castle` (a place name is not a path segment).
class: /obj/Locality
hydratorClass: /obj/persistence/PersistentHydrator
data:
  name: Cair Paravel
  _address: narnia/castle
