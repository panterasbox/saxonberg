# The bare shore — clearmere's: the same air as circlemere's, with no snow
# on the ice. Black ice beside snow-ice, one variable apart. Teleport only.
class: /platform/location/Shore
data:
  shortDescription: bare shore
  keywords: [shore, bare]
  register: definite
  longDescription: |
    A wind-scoured shore where no snow lies, above a small mere. The wind takes everything that falls here off across the water. East, the camp.
  _biomePath: /stuff/idea/biome/outdoor/baseline
  coords:
    x: 0
    y: 0
    z: 0
  exits:
    east:
      destination: /world/circle/camp
      media: [ground]
      edgeMinutes: 20
  # ⭐ The mere, in this shore's own words — and WHICH water it is
  # (maritime revision 3).
  details:
    mere:
      keywords: [mere, water, ice, clearmere]
      description: |
        A small mere the wind keeps swept, so whatever is on it shows dark and clear.
  waters:
    mere: clearmere:mere
