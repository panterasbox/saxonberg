# The v1 default fast-travel credential — a carryable TPA travel card. Issued
# into every fresh avatar's inventory by Avatar.installDefaultLoadout. State
# (the registered-node set) lives on the card, so it's transferable.
class: /world/common/tpa/TravelCard
hydratorClass: /obj/persistence/PersistentHydrator
data:
  shortDescription: a Teleport Authority travel card
  primaryKeyword: card
  longDescription: |
    A slim card of brushed alloy, warm to the touch, its face etched with the Teleport Authority's spiral mark. A row of tiny indicator pips records the stops you've registered.
  # The born-with travel credential record (registered-node set + floor)
  # comes from TravelCard.defaultCredentialKinds.
