# The casting yard — the roster's open range: a combustible straw dummy
# (firebolt → REAL ignition, spread, char), a stone basin (conjure-water),
# room to shove/veil/glowlight. Fixtures placed declaratively.
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: casting yard
  keywords: [yard, casting]
  register: definite
  longDescription: |
    A flagstone practice yard, scorch-ringed at the centre where workings land. A straw practice dummy slumps on its post, and a stone basin squats by the wall for the water exercises.
  coords:
    x: 0
    y: 0
    z: 0
  props:
    - /world/practicum/practice-dummy
    # ⭐ The thing that actually catches. The dummy demonstrates HITTING a
    # target; the tinder demonstrates SETTING IT ALIGHT, and after the
    # spell-cost correction those are honestly different acts — 22 kJ
    # lights forty grams of tinder and 831 kJ would be needed to light a
    # 1.5 kg dummy. See the row's own arithmetic.
    - /world/practicum/tinder-bundle
    - /world/practicum/basin
