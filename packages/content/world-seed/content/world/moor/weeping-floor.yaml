# The weeping-chamber floor — flagstones that the indoor rain pools across. A
# `Floor` (Adornment) with an authored **surface bulk** slot, starting dry:
# the chamber's authored (scope-pinned) rain fills it exactly as the heath's
# modelled storm fills the peat — the source-indifference spine invariant, one
# floor over from a real sky.
class: /platform/thing/Floor
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: wet flagstones
  # ⚠⚠ This list used to be `[flagstones, wet]` — NEITHER `floor` nor
  # `ground`. The MQL scope walk pools a thing's own `getKeywords()`, and
  # `pushDetails` gives a detail the pool `[<its id>]` and never its
  # authored keywords, so the `details.floor.keywords` below could not help:
  # `sit` and `look floor` both found nothing in this chamber.
  # `FloorMixin` unions both words onto every floor now, and `lint:ground`
  # clause (d) holds every floor ROW to saying them out loud as well.
  keywords: [flagstones, wet, floor, ground]
  register: proper
  longDescription: Worn flagstones under a spreading skin of rainwater that never quite drains.
  # Slate, dressed, on grade — `set-paving`. Flagstones are riven slate,
  # which is why the moor has them: `rock/slate` is the country rock of the
  # Ferrow cap and it CLEAVES, which is what makes it roof and pave.
  _materialPath: /stuff/idea/material/rock/slate
  worked: true
  onGrade: true
  surfaceBulk: true
  surfaceCapacity: 60
  staticSlots:
    - name: 'ground:1'
      accepts: SlottableMixin
      capacity: 9007199254740991
      postures: [sit, lie, kneel, stand]
      userFacingDetail: floor
  details:
    floor:
      keywords: [floor, flagstones, ground, water, pool]
      description: Worn flagstones under a spreading skin of rainwater.
