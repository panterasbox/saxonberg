# The weeping-chamber floor — flagstones that the indoor rain pools across. A
# `Floor` (Adornment) with an authored **surface bulk** slot, starting dry:
# the chamber's authored (scope-pinned) rain fills it exactly as the heath's
# modelled storm fills the peat — the source-indifference spine invariant, one
# floor over from a real sky.
class: /platform/thing/Floor
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: wet flagstones
  longDescription: Worn flagstones under a spreading skin of rainwater that never quite drains.
  surfaceBulk: true
  surfaceCapacity: 60
  staticSlots:
    - name: 'ground:1'
      accepts: SlottableMixin
      capacity: 9007199254740991
      postures: [sit, lie, kneel, stand]
      userFacingDetail: floor
  details:
    floor:
      keywords: [floor, flagstones, ground, water, pool]
      description: Worn flagstones under a spreading skin of rainwater.
