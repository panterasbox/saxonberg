# The heath floor — a peaty ground that pools rainwater. A `Floor` (Adornment)
# with an authored **surface bulk** slot but NO standing water yet: the storm's
# rain fills it over time (fresh water, weakly conductive), and it evaporates
# when the sky clears. The same pool the conduction walk reads — wet ground +
# an ambient strike = a shock, with no new glue. Mirrors the substation's
# flooded-floor, authored empty.
class: /platform/thing/Floor
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: sodden peat ground
  # ⚠ `floor` was missing until `lint:ground` clause (d) asked. This row was
  # the ONE of six that already carried `ground`, and it still could not be
  # reached by the word `floor`.
  keywords: [ground, sodden, peat, floor]
  register: proper
  longDescription: Black peat, waterlogged and treacherous, pooling the rain into shallow meres.
  # ⭐⭐ Peat, undressed, on grade — and the kind it reads as is the one
  # thing in the game that CHANGES WITH THE WEATHER. Dry, an earth-class
  # floor with no standing water is `earth`; once the storm has filled the
  # surface slot below it is `mire`. One floor answering differently, which
  # is exactly what this row's own prose already describes — *"waterlogged
  # and treacherous, pooling the rain"*. Nothing new stores that; the fold
  # reads the puddle.
  _materialPath: /stuff/idea/material/organic/peat
  onGrade: true
  # Surface-bulk: an (initially dry) pool the rain fills. No surfaceMaterial /
  # surfaceAmount — it starts dry; the weather fills it with fresh water.
  surfaceBulk: true
  surfaceCapacity: 80
  staticSlots:
    - name: 'ground:1'
      accepts: SlottableMixin
      capacity: 9007199254740991
      postures: [sit, lie, kneel, stand]
      userFacingDetail: ground
  # ⚠⚠ **No `floor` / `ground` DETAIL.** There used to be one here, and the
  # drive is what found it: `look floor` bound the DETAIL rather than the
  # floor object, and a detail's description renders WITHOUT the host's
  # `markupAugmenters` — so the derived sentence naming the material was
  # invisible in exactly the place an author would look for it. The detail
  # was a workaround for a floor not being addressable by its own name;
  # `FloorMixin` unions `floor` and `ground` onto the class, so the object
  # answers and the self-referential detail is now redundant AND harmful.
  # `lint:ground` clause (f) refuses one. A detail naming a real sub-feature
  # — the crossing's worn track, the yard's gutter — is the opposite case
  # and is exactly what details are for.
