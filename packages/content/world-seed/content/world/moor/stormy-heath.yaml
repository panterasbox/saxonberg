# The stormy heath — the outdoor demonstrator room. A SkyExposed
# Location whose covering Locality (`The Weeping Moor`, address
# `moor`) pins it to an always-alive storm. Stand here and the resolved storm
# drives everything: rain fills the heath's Floor pool, a wet body reads a
# deadlier shock, an ambient strike can crack through `conduct`, overcast dims
# the light, and `analyze weather` / `look up` read a towering cumulonimbus.
#
# Its Floor pool is authored **empty** (`adornments:`); the rain fills it. No
# exits wired (reachable by teleport — the substation precedent).
class: /platform/location/Shore
data:
  shortDescription: storm-lashed heath
  keywords: [heath, storm-lashed]
  register: indefinite
  longDescription: |
    Open moorland under a bruised, boiling sky. Heather flattens in the wind and the rain comes sideways in grey sheets; far off, a stand of dead birches stands black against the lightning. There is nowhere here that is dry.
  # SkyExposed outdoor biome (from the base-library content pack) — the storm
  # reaches this scope.
  _biomePath: /stuff/idea/biome/outdoor/baseline
  # Address puts this room under the Weeping Moor Locality's `moor` prefix.
  _address: moor/heath
  coords:
    x: 0
    y: 0
    z: 0
  # The (initially dry) Floor pool the rain fills — a fixture.
  adornments:
    - /world/moor/heath-floor
  # ⭐⭐ East to the turf bank (extraction build). ⚠ The heath had no exits at
  # all — it was teleport-only, the substation precedent — and it needs one
  # now: the fuel-or-the-field choice is only a choice if you can walk to it.
  # ⚠ And the mere above carries a fishing reach, so the ground somebody
  # drains at the bank is upslope of water somebody fishes.
  exits:
    east:
      destination: /world/moor/turf-bank
      edgeMinutes: 2
  # ⭐ The tarn, in the heath's own words — and WHICH water it is
  # (maritime revision 3): the Holloway's HEAD, 1100 m up, cold, fast,
  # fresh, soft and acid. ⚠ The moor's Locality cites `holloway:vale`;
  # the place's own citation wins. ⚠ Not `mere` or `water` — the heath
  # floor's pool answers to both.
  details:
    tarn:
      keywords: [tarn, black mere, black-mere, peat-water, holloway]
      description: |
        A mere of black peat-water lying in a fold of the heath, rain-pocked and wind-scoured, spilling at its lower lip into a beck that goes off white down the moor. Cold enough to ache. Something moves under the surface and is gone.
  waters:
    tarn: holloway:head
