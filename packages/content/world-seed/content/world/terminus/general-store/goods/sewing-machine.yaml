# The treadle sewing machine — the sewing kit's up-market variant, and
# the capability table's proof: same `mending` kind, different
# parameters, NO class beyond ToolItem — a tool variant is pure seed
# data. Rate 3 works soft goods in a third the time; control `fine`
# floors every repair at that band (skill embedded in the capital).
# 18 kg: shop capital by encumbrance, not the pocket kind.
class: /platform/thing/ToolItem
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a treadle sewing machine
  primaryKeyword: sewing-machine
  keywords: [sewing-machine, machine, sewing, treadle]
  longDescription: |
    Cast iron and walnut, a wheel taller than your hand, a needle that never hesitates. Everything the kit does, it does before you've finished threading.
  capabilities:
    - { kind: mending, rate: 3, control: fine }
  _materialPath: /stuff/idea/material/element/iron
  mass: 18
