# Terminus Terminal — Departure Gate A (operational). The one working gate:
# its terminal runs the free return to the lounge and the paid line out to the
# newbie-wilds crossroads. Generic room. Every connection is declared
# explicitly on both sides (the template is self-describing): the hall lies one
# cell west.
class: /obj/location/Room
hydratorClass: /obj/persistence/PersistentHydrator
data:
  shortDescription: Departure Gate A
  primaryKeyword: gate-a
  longDescription: |
    A departure gate off the east side of the hall: a raised platform ringed by a brass rail, a departures terminal standing at its head like a lectern. Gate A is the one that runs — its status light burns a steady red, and a short queue forms and dissolves as travellers step up, name a stop, and are gone.
  coords:
    x: 1
    y: 0
    z: 0
  # The gate room stands up its own terminal (lazy cascade — no manifest
  # entry). `singleton()` loads it and its `seatSelf` seats it here.
  populates:
    - /world/terminus/terminal/departure-terminal-a
  exits:
    west:
      destination: /world/terminus/terminal/hall
  details:
    rail:
      keywords: [rail, railing, platform]
      description: |
        A brass rail worn bright by a thousand hands, ringing the departure platform. Step inside it, up to the terminal, and read the board with `teleport`.
