# The standpipe in the yard — a tap on a post, and an inexhaustible water
# source (the dorm tap's role, out of doors).
#
# It matters more than it looks: without water on the lot, every single
# watering is a round trip into town, which turns the care loop from a
# habit into a chore. The dorm gave a houseplant a tap down the corridor
# for the same reason.
class: /platform/thing/UnboundedReceptacle
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a standpipe
  primaryKeyword: standpipe
  keywords: [standpipe, tap, pipe, spigot, water]
  longDescription: |
    A galvanised pipe standing out of the grass with a brass tap on top of it, dripping slightly and greening the ground beneath. It was here before the fence was.
  interiorBulk: true
  interiorMaterial: /stuff/idea/material/bulk/water
