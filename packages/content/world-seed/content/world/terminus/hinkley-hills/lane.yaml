# Hinkley Lane — the street, and the only one. Three rooms make the whole
# suburb: you arrive, you walk up the lane, you turn in at your lot.
#
# There is NO authored exit into a lot. A gate is hung here per SOLD lot
# by the LotHolder (a deferred `LotGateExit`, directioned by the lot leaf
# — `lot-1`), because the street cannot name one room: each lot's room is
# minted at its own identity path. A static `north -> .../yard` named the
# shared source TEMPLATE, which then materialized as an unowned yard on
# nobody's lot — the defect that shipped past a green unit suite.
#
# The unbuilt neighbouring lots are `details:` PROSE, not nine empty
# rooms. Their emptiness is the story — a subdivision drawn for a hundred
# families that got one — and prose tells it better than a hundred
# identical rooms would, at a hundredth the cost. Room-spec rule: prose is
# bulk, Stuff is few.
class: /platform/location/CartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: Hinkley Lane
  primaryKeyword: lane
  alternateNames: [road, street]
  _address: terminus/hinkley-hills/lane
  _biomePath: /stuff/idea/biome/outdoor/baseline
  ambientIntensity: 600
  ambientColorTemperature: 5800
  longDescription: |
    A made road with nothing on it, running west up the slope between lots that were surveyed and then left alone. Stakes and faded string mark out the boundaries; the grass inside them is the same grass as outside them, only taller where nobody walks.

    Where a lot has been taken there is a gate in the fence and, behind it, somebody's roof. Everything else is numbers on stakes.
  coords:
    x: -1
    y: 0
    z: 0
  exits:
    east:
      destination: /world/terminus/hinkley-hills/arrival
  details:
    lots:
      keywords: [lots, lot, stakes, string, survey, grass]
      description: |
        Lot 3, lot 4, lot 5, on up the slope — numbers stencilled on stakes with string run between them, sagging where the posts have leaned. The survey was done properly and at some expense. Nothing has been built on any of them.

        Whoever paid for this expected a hundred families. They got one road, one gate, and a great deal of grass.
    house:
      keywords: [house, gate, fence, white]
      description: |
        A low white house set back behind a wire fence, with a gate in it that has been oiled recently. Not large and not new, but kept: somebody lives there and means to go on doing it.
    road:
      keywords: [road, surface, kerb]
      description: |
        Properly made, with a kerb and a camber, and swept clean by nothing but wind. It runs up the slope and stops where the survey stopped.
