# The stun baton — the electricity combat toe-hold, an authored weapon
# template (the steel-dagger pattern + the Energized/Switchable electrical
# layer). A `StunBaton` (Weapon + Energized + Switchable): a light hafted club
# whose electrodes are held at a contact-stun potential. Wield it, switch it
# on, and a landed hit routes a direct two-terminal shock through
# `ElectricityApi.shockContact` — the current, at a body-limited ~50 mA, sits
# in the tetany band (a disarm), not fibrillation. Low-lethal.
#
# Authored OFF (`on: false`) so, lying in the cell's pool, it is inert — it
# does NOT electrify the water until someone picks it up and arms it. (An
# ARMED baton dropped in the pool WOULD become a source — correct physics,
# the conduction walk reads every Energized node; safe here because it ships
# safed.) Per-instance (cloned fresh); one-handed.
class: /obj/equipment/StunBaton
hydratorClass: /obj/persistence/PersistentHydrator
data:
  shortDescription: a stun baton
  primaryKeyword: baton
  longDescription: >
    A short, rubber-gripped baton with two blunt steel electrodes at the tip
    and a thumb-switch on the haft. Dead weight until it is armed; then the
    gap between the electrodes spits and crackles.
  _materialPath: /obj/material/alloy/steel
  constructionForm: hafted
  gradeBand: fine
  mass: 0.6
  # A quick, light club — a favourable emergent-tempo hook (see combat Tempo).
  balanceFactor: 1.4
  # One-handed — claims a single hand slot (wield it in either hand).
  slotClaims:
    "/obj/species/BodyPlan/biped": ["hand:right"]
  # Contact-stun potential (~5 kV): body-limited to ~50 mA on a landed hit —
  # the tetany/disarm band, not lethal.
  voltage: 5000
  # Ships safed; arm it with `switch on the baton`.
  on: false
