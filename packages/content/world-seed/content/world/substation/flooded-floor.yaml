# The flooded switch-cell floor — the brine pool that grounds you and carries
# the current. A `Floor` (Adornment) with an authored **surface bulk** pool of
# salt water (~40 L standing water), attached to the cell via its `adornments:`
# map. The conductive medium the shock model reads: `ElectricityLogic` finds
# this pooled floor, sees a conductive surface material + a non-zero amount,
# and grounds anyone standing in it. Mirrors `/stuff/thing/surface/default-floor` (the
# posture `ground:1` slot + the `floor` detail) with the pool authored on top.
class: /platform/thing/Floor
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a flooded concrete floor
  longDescription: A concrete floor under a skin of brackish standing water.
  # Surface-bulk: an authored brine pool (the conductive medium + ground).
  surfaceBulk: true
  surfaceMaterial: /stuff/idea/material/bulk/salt-water
  surfaceAmount: 40
  staticSlots:
    - name: 'ground:1'
      accepts: SlottableMixin
      capacity: 9007199254740991
      postures: [sit, lie, kneel, stand]
      userFacingDetail: floor
  details:
    floor:
      keywords: [floor, ground, water, pool, brine]
      description: A concrete floor under a skin of brackish standing water.
