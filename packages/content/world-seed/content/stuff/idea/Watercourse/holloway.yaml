# The Holloway — the SECOND basin, a neighbouring drainage over the
# northern watershed.
#
# ⭐ Its whole job is to be UNRELATED. Two places on the Kestrel resolve
# an upstream/downstream relation; a place here and a place there resolve
# none at all, which is a different answer from "downstream" and the one
# that stops a diversion in one valley curtailing a right in another.
# The moor sits on it.
class: /system/water/idea/Watercourse
data:
  key: holloway
  name: the Holloway
  basin: holloway
  # Soft and acid — the moor's peat. Cold, fast and thin: trout water.
  water: { pH: 6.0, hardnessDgh: 3, nitrateMgL: 0.5 }
  # Where on the world it runs (the climate build): the realm's latitude,
  # authored here because a reach is not a place a zone chain reaches.
  # Elevation is each node's own.
  site: { latitudeDeg: 42 }
  # ⭐ The river as a LINE (the river build): off the moor's rills, out to
  # the Greywater at its own named mouth west of the bar.
  source: { kind: rills }
  mouth: { into: sea, node: /stuff/idea/WaterExpanse/greywater/holloway-mouth }
  bed: gravel
  nodes:
    - { name: head, km: 45, elevation: 1100, catchmentKm2: 300, stocks: [{ species: /stuff/idea/species/brown-trout }, { species: /stuff/idea/species/eel }] }
    - { name: vale, km: 25, elevation: 300, channelWidthM: 14, catchmentKm2: 180, stocks: [{ species: /stuff/idea/species/brown-trout }, { species: /stuff/idea/species/eel }, { species: /stuff/idea/species/carp }] }
    - { name: mouth, km: 0, elevation: 0, channelWidthM: 70, stocks: [{ species: /stuff/idea/species/eel }, { species: /stuff/idea/species/carp }, { species: /stuff/idea/species/grey-mullet }, { species: /stuff/idea/species/shore-crab }, { species: /stuff/idea/species/sturgeon }] }
