# Lantern Waste — a sibling Locality under the Narnia root.
#
# Claims `narnia/wild`, a sibling of Cair Paravel's `narnia/castle`.
# Proves the trie distinguishes siblings: a `narnia/wild/...` scope
# resolves here; a `narnia/other/...` scope falls back to Narnia; a
# scope outside the `narnia` tree resolves to no Locality (global).
class: /platform/idea/Locality
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: Lantern Waste
  _address: narnia/wild
