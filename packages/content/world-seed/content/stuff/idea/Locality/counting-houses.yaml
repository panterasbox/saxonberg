# The Counting-Houses — the downtown financial quarter Locality, off
# University Avenue (the way money districts sit on their own street, Lombard
# off Cheapside). Names the district on departures boards / address readouts
# and carries the weather node for its outdoor street. Homed under
# `seeds/obj/address/` (the terminus/narnia precedent) so
# AddressRegistry.postRegister eagerly clones + warms its prefix at boot — a
# domain-dir seed would never register. templatePath ≠ claimed address.
class: /platform/idea/Locality
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  # ⭐⭐ The town's street-lighting service (envelope W5). ONE FIGURE IN
  # ONE PLACE: a town does not track lamps, it funds a service and finds
  # out it is short when the streets go dark. Which streets exist and in
  # what order they are lit is the STREETS' business (`seniority` on each
  # row); what a street-night costs and who is paid is the extent's.
  # The counting houses light their own row and the market square in
  # front of it — a district that keeps late hours and pays for them.
  #
  # ⚠ The money comes from the REALM treasury, not this extent's: there
  # is one treasury per currency and no Locality holds an account yet. So
  # v1 reads as "the realm appropriates for Terminus's lamps". The
  # PREFERENCE here is the town's, as designed; a locality treasury is a
  # named deferred seam (livelihood-slate §7, credit-slate Q8).
  _publicLighting:
    fuelPerStreetNight: 4
    supplier: /world/terminus/general-store/business
  name: The Counting-Houses
  _address: terminus/city/counting-houses
  # ── the watershed (D21) ───────────────────────────────────────────
  # The city drinks at the confluence — downstream of the mining town AND the
  # farming valley, which is the whole of its water politics.
  _reach: kestrel:confluence
  _catchmentKm2: 30

