# University Avenue — the campus-edge street Locality. Names the crossing on
# departures boards and claims the `terminus/city/university-avenue` prefix so the
# crossing room (`_address: terminus/city/university-avenue/crossing`) resolves
# here and is
# weather-eligible under it. Homed under seeds/lib/address/ (the narnia /
# terminus precedent) so AddressRegistry.postRegister eagerly clones + warms
# its prefix at boot. templatePath ≠ claimed address.
class: /platform/idea/Locality
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: University Avenue
  _address: terminus/city/university-avenue
  # ── the watershed (D21) ───────────────────────────────────────────
  # City ground: it drains to the confluence like the rest of Terminus.
  _reach: kestrel:confluence
  _catchmentKm2: 20

