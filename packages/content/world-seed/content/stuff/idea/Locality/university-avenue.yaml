# University Avenue — the campus-edge street Locality. Names the crossing on
# departures boards and claims the `terminus/city/university-avenue` prefix so the
# crossing room (`_address: terminus/city/university-avenue/crossing`) resolves
# here and is
# weather-eligible under it. Homed under seeds/lib/address/ (the narnia /
# terminus precedent) so AddressRegistry.postRegister eagerly clones + warms
# its prefix at boot. templatePath ≠ claimed address.
class: /platform/idea/Locality
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  # ⭐⭐ The town's street-lighting service (envelope W5). ONE FIGURE IN
  # ONE PLACE: a town does not track lamps, it funds a service and finds
  # out it is short when the streets go dark. Which streets exist and in
  # what order they are lit is the STREETS' business (`seniority` on each
  # row); what a street-night costs and who is paid is the extent's.
  # The avenue association lights the crossing. A separate bill from the
  # city's, because a separate locality claims the ground.
  #
  # ⚠ The money comes from the REALM treasury, not this extent's: there
  # is one treasury per currency and no Locality holds an account yet. So
  # v1 reads as "the realm appropriates for Terminus's lamps". The
  # PREFERENCE here is the town's, as designed; a locality treasury is a
  # named deferred seam (livelihood-slate §7, credit-slate Q8).
  _publicLighting:
    fuelPerStreetNight: 4
    supplier: /world/terminus/general-store/business
  name: University Avenue
  _address: terminus/city/university-avenue
  # ── the watershed (D21) ───────────────────────────────────────────
  # City ground: it drains to the confluence like the rest of Terminus.
  _reach: kestrel:confluence
  _catchmentKm2: 20

