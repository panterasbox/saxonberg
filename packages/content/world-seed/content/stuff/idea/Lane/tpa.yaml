# The Teleport Authority network — ⭐⭐ **the limit case of a lane**: no
# intermediate stops and no duration.
#
# D2's own claim, made concrete. A lane's two independent numbers are
# stop density and duration; drive both to zero and you have
# teleportation, which stops being a special treatment and becomes the
# far end of one axis. Everything else in the design — a stopping local,
# an express, a rail line — is a point on the same axis.
#
# ⚠ Its edges are AUTHORED, because there are no walkable exits to induce
# from. That is the same escape hatch rail would use, which is what makes
# *"rail is a data addition"* a fact rather than a hope: a realm that
# wants a railway ships a row like this one and no code at all.
#
# ⭐ **The Lounge is on it and on nothing else.** Saxonberg and the Lounge
# joining the road map is a stated non-goal — the Compact's seat is meant
# to be built by decree of the pact — so the leg into the Lounge rides
# the Authority's network. That is not a loophole; it is this lane doing
# exactly the work the design says it does, and it is diegetically right.
#
# `operator` names the Authority: a lane somebody RUNS, beside two that
# nobody does.
class: /system/transport/idea/Lane
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  key: tpa
  name: the Line
  mode: ""
  seeds: []
  edges:
    - { from: /world/terminus/terminal/location/hall, to: /world/terminus/hinkley-hills/location/arrival }
    - { from: /world/terminus/terminal/location/hall, to: /world/newbie-wilds/crossroads/hub }
    - { from: /world/terminus/terminal/location/hall, to: /world/lounge/location/bar }
  stops: []
  operator: /system/tpa/idea/teleport-authority
