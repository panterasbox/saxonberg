# The haar — a BELT of sea fog that joins nothing: a band two and a
# half miles deep running west from the Rock, with no endpoints.
# ⭐ Behaves exactly as a band between two nodes.
#
# ⚠ Bounded east and west, and the bound is load-bearing: where bands
# overlap the NARROWEST owns the weather, so a belt right round the world
# would never win anywhere a corridor runs through it — the Westerlies
# would be all anybody ever saw of the fog.
#
# ⭐⭐ Nothing here authors FOG (maritime R10). `weatherLean` leans the
# weather field — fog rolls forty times as often in here — and the sky,
# the crossing report ("Fog closes in.") and the range of sight all follow
# from the roll. A clear day in the haar is rare, and it happens.
class: /system/water/idea/WaterBand
data:
  name: the haar
  # Two opposite corners, range and bearing from the bar.
  extent:
    kind: belt
    from: { rho: 10602, theta: 33 }
    to: { rho: 33311, theta: 66.4 }
  lean: { directionDeg: 180, strengthMps: 0.5 }
  weatherLean: { fog: 40 }
  gearHardness: 0.1
