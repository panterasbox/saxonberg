# The survey instrument, and ⭐ the TOP rung of the mining ladder — a
# compass in gimbals over a clinometer is the most exacting thing the
# trade makes, and it is exacting because a survey that is wrong sends a
# heading into the wrong ground.
recipeId: miners-dial
name: Miner's Dial
keywords: [dial, miners-dial]
# ⭐⭐ The stock slot asks for `forgeable`, and that one tag is the whole
# rule: **an anvil recipe takes stock an anvil can work.** `ferrous`
# would admit a pig of cast iron, which shatters under a hammer;
# `metal` would admit a pig AND a bloom, which is a quarter glass.
# Hot iron, steel and copper are what an anvil actually works, and they
# are what carries the tag.
inputSlots:
  - { slot: body, category: forgeable, minGrade: good, kind: item, count: 1 }
  - { slot: case, category: wood, minGrade: fair, kind: item, count: 1 }
toolCapabilities: [striking, anvil]
outputTemplate: /trade/mining/thing/miners-dial
outputMaterial: ''
outputApplication: tangible
requiresHeatK: 1100
difficulty: formidable
discipline: mining
