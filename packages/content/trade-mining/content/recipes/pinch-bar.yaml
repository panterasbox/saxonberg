# ⚠ The tool that makes ground non-lethal: you bar the loose down before
# you work under it. Its rung is deliberately LOW — safety equipment a
# beginner cannot make is safety equipment nobody has.
recipeId: pinch-bar
name: Pinch Bar
keywords: [bar, pinch-bar]
# ⭐⭐ The stock slot asks for `forgeable`, and that one tag is the whole
# rule: **an anvil recipe takes stock an anvil can work.** `ferrous`
# would admit a pig of cast iron, which shatters under a hammer;
# `metal` would admit a pig AND a bloom, which is a quarter glass.
# Hot iron, steel and copper are what an anvil actually works, and they
# are what carries the tag.
inputSlots:
  - { slot: stock, category: forgeable, minGrade: fair, kind: item, count: 1 }
toolCapabilities: [striking, anvil]
outputTemplate: /trade/mining/thing/pinch-bar
outputMaterial: ''
outputApplication: tangible
requiresHeatK: 1100
difficulty: easy
discipline: mining
