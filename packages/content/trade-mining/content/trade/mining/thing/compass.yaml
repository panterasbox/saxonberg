# A surveyor's compass — the cheap end of the survey ladder, and the one
# a prospector actually owns.
#
# ⭐ It reads STRIKE at the surface and dip on a face, exactly as the
# miner's dial does. What the dial buys is not a channel the compass
# lacks — it is that the dial is a mine instrument, hung and levelled,
# and the compass is a thing in your pocket. Both feed the same reading;
# the reader's eye is what sets the error band. Competence buys
# resolution; equipment buys access.
class: /trade/mining/thing/instrument/SurveyInstrument
data:
  # ⚠ No `needle`: the needle is a PART now, and a bill's part is matched
  # by keyword.
  keywords: [compass, surveyors-compass, "surveyor's", surveyor, brass]
  shortDescription: surveyor's brass compass
  register: indefinite
  longDescription: >-
    A heavy brass compass in a fitted case, its card marked in whole
    degrees and its needle jewelled at the pivot. The lid carries a
    folding sight vane, scratched to nothing along one edge from years of
    being set down on rock.
  mass: 0.4
  capabilities: ["surveying"]
  # ⚠ COPPER for brass — the realm has no zinc (see the housing's row).
  _materialPath: /stuff/idea/material/element/copper
  # ⭐⭐ What a surveyor's compass is MADE OF (assembly D3, D14) — the
  # instrument exemplar: a housing, a rose GLUED into it, a needle and a
  # crystal SEATED in it. ⭐ Nothing else is needed for the derived
  # property: a reading's ceiling reads the instrument's condition, and an
  # assembly's condition is its worst line's — so a cracked crystal or a
  # dragging needle reads coarser (AC 11), and `fit pane to compass` or
  # `fit compass-needle to compass` puts it right. The crystal is a pane
  # of the glasshouse's glass, `role: facing`.
  bill:
    parts:
      - { part: housing, template: /trade/mining/thing/compass-housing, count: 1, role: structural, material: /stuff/idea/material/element/copper }
      - { part: rose, template: /trade/mining/thing/compass-rose, count: 1, role: structural, material: /stuff/idea/material/textile/linen }
      - { part: compass-needle, template: /trade/mining/thing/compass-needle, count: 1, role: structural, material: /stuff/idea/material/alloy/steel }
      - { part: crystal, template: /trade/glass/thing/pane, count: 1, role: facing, material: /stuff/idea/material/glass/glass }
    joints:
      - { key: mounting, method: glued, members: [rose, housing] }
      - { key: pivot, method: seated, members: [compass-needle, housing] }
      - { key: glazing, method: seated, members: [crystal, housing] }
