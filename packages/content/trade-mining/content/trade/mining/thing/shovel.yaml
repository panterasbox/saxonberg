# A shovel — for the half of mining that is moving what you broke.
class: /platform/thing/ToolItem
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  primaryKeyword: shovel
  keywords: ["shovel", "spade"]
  shortDescription: a short-handled shovel
  longDescription: >-
    A worn steel blade on a short handle — short because a long one has
