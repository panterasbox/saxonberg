# dip — how steeply a seam falls, read off a face where the vein is
# actually showing.
#
# ⚠ It cannot be read at the surface, and nothing forbids it: the trace
# where an orebody meets the ground is a LINE, and a line has no fall in
# it. Dip is why you drive a heading.
class: /trade/mining/idea/reading/DipReading
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  channel: dip
  kind: fact
  scope: [here]
  discipline: geology
  instrument: surveying
  # ⚠ It was `\"a surveyor's compass or a miner's dial"` — a stray
  # escaped quote in an UNQUOTED YAML scalar, so the backslash and the
  # quotes went into the prose verbatim and a prospector was told
  # *It wants \"a surveyor's compass or a miner's dial".* Found in a
  # browser; the wire checkpoint matched /compass/ and could not see the
  # junk around the word it was looking for.
  instrumentNoun: "a surveyor's compass or a miner's dial"
  eyeCeiling: untrained
  improves: >-
    how deep the lode goes and how far a shaft must follow it
  stakes: >-
    a shaft sunk on the wrong angle, which is most of a season
