# The canary in its cage — the mine's air instrument.
#
# ⚠ Its silence is the reading, and it can die. That is the point: air is
# the ONE lethal hazard in this build, and it is lethal because it comes
# with a free continuous warning, an obvious unilateral escape (walk out
# — every exit stays open) and no rescue requirement.
# ⭐⭐ It is a `KeptAnimal` now, and this is the one place the
# requirements' "nothing else about it changes" is not literally true. An
# `Extra` is, by the rung's own declaration, the thing that holds no
# personal opinion of anybody — so a bird that can bond cannot stay one.
# Its brain path, species, description and mass are untouched, and
# `reads-air` keeps working because `KeptAnimal` composes `Behaved`.
#
# ⭐ Admitting it costs nothing and is honest: miners have always kept
# canaries, named them, and been sorry when one died. The game just never
# had a rung that could hold that.
class: /platform/agent/KeptAnimal
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  _speciesPath: /stuff/idea/species/animalia/chordata/aves/passeriformes/fringillidae/serinus/canaria
  lifecycleState: alive
  keywords: [canary, bird, cage, wicker]
  shortDescription: canary in a wicker cage
  register: indefinite
  longDescription: >-
    A small yellow bird in a wicker cage, hung from a nail or carried on
    a hook. It watches you sideways with a bright black eye. Miners do
    not keep it for company.
  mass: 0.02
  behaviors:
    - brain: /trade/mining/behavior/reads-air
      trigger: cadence:20s
      config: {}
