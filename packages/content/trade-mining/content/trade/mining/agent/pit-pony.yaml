# The pit pony — haulage, and no new mechanism at all.
#
# ⭐ Carry capacity derives from body MASS in the shipped encumbrance
# substrate, so hitching the cart to 320 kg of pony instead of carrying
# it yourself is a measurably lower load ratio. The pony is better at
# hauling because it is heavier, which is the real reason — and no code
# in this pack computes it.
#
# ⚠ The pack CLASS existed only to give it a brain: the old
# `HaulingCreature` carried none, so a venue listing one under `cast:`
# was refused at hydrate — *that is a prop, not cast* — and the refusal
# was right: `cast:` means things with a brain, and an animal that cannot
# idle reads as furniture. Found by driving, in a room that would not
# stand up.
#
# ⭐⭐ **The class is gone and this is a plain ROW now** (the base-class
# narrowing, 2026-09-30). `platform/agent/DraftAnimal` is
# `Mountable(Hauler(Beast))` and `Beast` carries the brain, so the one
# thing the subclass added is on the rung. A second draft animal is a
# row: a species, a mass, a brain.
#
# ⚠⚠ And what it cost to be a `HaulingCreature` was that the pony was a
# `Character` — it composed `CasterMixin`, `MemorizedMixin`,
# `EmployedMixin` and `PersonaMixin`. It could cast spells and hold a
# job. The old class reached for the whole person rung to get
# `HaulerMixin`.
class: /platform/agent/DraftAnimal
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/perissodactyla/equidae/equus/caballus-pumilus
  lifecycleState: alive
  keywords: [pony, pit-pony, horse, stocky, pit]
  shortDescription: stocky pit pony
  register: indefinite
  longDescription: >-
    A short, barrel-chested pony with a clipped mane and the patient,
    unbothered look of an animal that has done this a great many times.
    Its harness is worn smooth where the traces run.
  mass: 320
  behaviors:
    - brain: /lib/behavior/idles
      trigger: cadence:55s
      config:
        pool:
          - { kind: free, value: "shifts its weight and blows out through its nose." }
          - { kind: free, value: "leans into the traces without being asked, then stops when nothing follows." }
          - { kind: free, value: "turns one ear toward the dark and leaves it there." }
