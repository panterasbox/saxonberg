id: trade-mining
version: 0.1.0
root: /trade/mining
description: >-
  The mining trade — everything that answers "how does a mine WORK",
  and nothing that answers "what is it like here". The five acts (hew,
  drive, sink, raise, shore) and stake; MineWarren, the Warren subclass
  that carves rooms, and WorkingMixin, which every read a mine needs
  derives from — so a hand-authored mine with no warren at all behaves
  identically. The Deposit class (the geology field's model, never an
  orebody), the ore lump and its grade, the survey instruments and their
  three channels, the tool recipes, the geology Discipline, the mine
  archetype, and the two FUNCTIONAL species any mine needs — the pit
  pony that hauls and the canary that reads air.
  A venue supplies the orebody, the room prose and the ecology; that is
  the falsifiable line — a second mining town needs ZERO pack code.
requires:
  # The trade is placeless (economic bootstrap D6/D7): its mechanism is
  # held by the Ministry of Trade — a seat, never a committee. Its
  # premises, if any, sit in the world under a locality's committee.
  title:
    - { extent: /trade/mining, holder: { organization: /compact/trade } }
