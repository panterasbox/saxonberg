verbs: [grind]
controller: /trade/milling/idea/cmd/milling/GrindController
description: "Put something through the stones that is not grain"
help: |
  `grind` puts bone through the stones and gives you a sack of bone meal.
  `grind <something>` is the general form for anything else the stones
  will take.

  ⭐ **It is a different act from `mill`, and the difference is whether
  there is a decision in it.** Milling grain *separates* it, and how much
  of the outer coat you keep is a real choice with a cost at both ends.
  Grinding bone has no such dial: bone ground is bone meal, and there is
  nothing to bolt out of it.

  Bone meal is a slow amendment. `feed` it into a field and it goes in as
  organic matter rather than as nitrogen — a little of it feeds the crop
  this year and most of it over the next several, which is why a
  well-amended field is still paying you in three.

  ⚠ You need stones in reach: a hand quern does, and so does a mill.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: what
    type: string
    required: false
  # ⭐⭐ WHICH STONES, declared rather than re-derived — `mill`'s own arg,
  # for its stated reasons, and the query is the MIXIN rather than a
  # class so the metal chain's stamp mill answers too.
  - name: stones
    type: object
    required: false
    prepositions: [at, with, on]
    default: "reachable:[mixin.ComminutingMixin]"
    scope: ["reachable"]
    requires: [ComminutingMixin]
