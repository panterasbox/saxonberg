# A sack of flour — a `Sack`: bulk inside, with the maker's
# mark and the grade on the HOLDER. Grade rides the sack, never the
# matter: a quantity of flour has no identity to be graded, and a marked
# sack does. The same convention a bottle of graded gin follows.
class: /platform/thing/Sack
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: flour sack
  keywords: [flour, sack, meal]
  register: indefinite
  longDescription: |
    A coarse linen sack, the seams white with what has worked through them.
  mass: 0.4
  interiorBulk: true
  interiorMaterial: /stuff/idea/material/food/wheat-flour
  interiorCapacityValue: 25
  interiorCapacityUnit: L
  category: sack
