# Rennet (dairy D8) — a dried vell steeped in brine: salt, water and the
# stomach of a young head, left to draw. What a cheesemaker sets a FIRM
# curd with; poured into a working vat of milk, it turns the batch.
#
# ⭐ The vell is only to be had off a young animal (its butchery line's
# `maxAgeDays`), so a creamery's rennet supply is a calf register's
# business, and that is how the dairy and the farm are one economy.
