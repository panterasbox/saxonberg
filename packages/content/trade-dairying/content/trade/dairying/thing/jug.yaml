# A jug — an earthenware jug, the dairy's measure and its carrier for
# buttermilk, whey and scalded milk.
class: /platform/thing/CraftVessel
data:
  shortDescription: earthenware jug
  keywords: [jug, "earthenware jug"]
  register: indefinite
  longDescription: A round-bellied earthenware jug with a lip for pouring.
  category: jug
  interiorBulk: true
  interiorCapacity: 2
  _materialPath: /stuff/idea/material/ceramic/earthenware
  mass: 0.8
  # ⭐ (ceramics S1, M6) A fused lead glaze — glossy, and (M7) it gives
  # lead to anything acid kept in it, which nothing about it says.
  coats:
    inside:
      - { material: /stuff/idea/material/glaze/lead, thicknessM: 0.0003, state: fused }
    outside:
      - { material: /stuff/idea/material/glaze/lead, thicknessM: 0.0003, state: fused }
