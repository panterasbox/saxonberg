# A butter crock — what churned butter is poured off into and kept in, as
# soft stock a cook ladles from.
class: /platform/thing/CraftVessel
data:
  shortDescription: butter crock
  keywords: [crock, "butter crock", butter-crock]
  register: indefinite
  longDescription: A squat glazed crock with a slate lid, cool to the touch.
  category: butter-crock
  interiorBulk: true
  interiorCapacity: 2
  _materialPath: /stuff/idea/material/ceramic/earthenware
  mass: 1.2
  # ⭐ (ceramics S1, M6) A fused lead glaze — glossy, and (M7) it gives
  # lead to anything acid kept in it, which nothing about it says.
  coats:
    inside:
      - { material: /stuff/idea/material/glaze/lead, thicknessM: 0.0003, state: set }
    outside:
      - { material: /stuff/idea/material/glaze/lead, thicknessM: 0.0003, state: set }
