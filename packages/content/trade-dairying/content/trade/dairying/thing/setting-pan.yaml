# A setting pan — a wide, shallow earthenware pan with a wooden plug in
# the bottom (dairy D4). Milk stands in it overnight, the cream rises, and
# pulling the plug (`pour pan into pail`) lets the skim run out from under
# it and stops at the cream. See `milk-setting.yaml`.
class: /trade/dairying/thing/SettingPan
data:
  shortDescription: setting pan
  keywords: [pan, setting-pan, "setting pan"]
  register: indefinite
  longDescription: >-
    A wide, shallow pan of brown-glazed earthenware with a wooden plug
    stopping a hole in the bottom. It is made to hold milk still while the
    cream comes up.
  interiorBulk: true
  interiorCapacity: 10
  closure: liquidTight
  # ⭐ Brown-GLAZED earthenware, as the prose says. The ceramics build
  # pointed it at bare terracotta, and a porous pan wept the milk set in it
  # (the ceramics finalize). The brown glaze of a milk pan was a lead one —
  # and it gives lead to milk gone sour, which nothing about it says.
  _materialPath: /stuff/idea/material/ceramic/earthenware
  mass: 3
  coats:
    inside:
      - { material: /stuff/idea/material/glaze/lead, thicknessM: 0.0003, state: set }
