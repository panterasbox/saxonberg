# Whey — what a set curd gives up (dairy D7): the `productMaterial` of a
# curd profile, drawn off the vat down to the curd. ⭐ It still carries the
# lactic culture, so a crock of whey IS a living starter (the
# `whey-starter` culture profile keys on this tag), and the milk sugar it
# holds is what a feed restores. Backslopping: the drained whey into the
# crock is next time's starter.
