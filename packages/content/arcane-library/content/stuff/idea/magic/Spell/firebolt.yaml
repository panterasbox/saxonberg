# Firebolt — create·fire, the flagship impulse: injects REAL heat. At a
# body it folds through the covering stack into a burn (armor inversion
# free); at an object it deposits real thermal joules and real combustion
# takes over (tryAutoignite → spread, smoke, char) — no magic-side damage
# path exists. See docs/subsystems/magic.md.
class: /platform/idea/magic/Spell
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  spellId: firebolt
  name: Firebolt
  verb: create
  noun: fire
  # ⭐⭐ **The cost the price list actually implies.** This row authored
  # `cost: 20` (20 kJ committed) against `joules: 900000` delivered —
  # η ≈ 45, against arcane-science.md rules 1 and 6, which cap η at 1.
  # Magic in this world moves and rearranges; it does not manufacture
  # energy, and a spell that returns 45× what it costs is a free power
  # plant with a wand attached.
  #
  # 30 τ is under the science's own worked firebolt (35.2 τ) and buys
  # 30 kJ at the blessed band. `lint:spell-cost` holds it.
  cost: 30
  castingProfile:
    requiredBand: novice
    castSeconds: 3
  targeting: any
  effects:
    # The bolt itself. [cursed · uncursed · blessed] — magnitude, which
    # stays authored per working rather than engine-fixed, because how
    # much a guttering firebolt loses is a fact about FIREBOLT.
    - kind: inject-channel
      channel: heat
      energy: [1, 2, 4]
      # ⭐ **The band ladder is EFFICIENCY, not magnitude** (magic-items:
      # *"blessed means EFFICIENT, not benevolent"*). Against 30 τ =
      # 30 kJ committed: cursed η 0.5 · uncursed η 0.85 (the price list's
      # heat row) · blessed η 1.0, the ceiling.
      #
      # ⚠ `energy` (the abstract covering-fold token) is UNCHANGED. What
      # a firebolt does to a PERSON runs through the body arm and did not
      # move; `joules` feeds the object arm only, so this correction
      # changes what a firebolt does to things.
      joules: [15000, 25500, 30000]
    # ── and firebolt's OWN answer to being cursed ──
    #
    # ⚠ This is firebolt's expression, NOT a rule about cursed wands. A
    # frost wand might go brittle; a rod of shoving might shove the
    # wielder; a cursed scroll might lay the curse it was meant to lift.
    # The engine offers the CAPABILITY (`bands` + `self`); what the low
    # end of a working feels like is the author's to decide, and it
    # should fit that working's identity.
    #
    # For a bolt of fire the honest bad end is that it comes out the
    # wrong side. Cursed is not merely weaker — the feeble bolt still
    # flies, and the rest of it goes into the hand holding the wand.
    - kind: inject-channel
      bands: [cursed]
      self: true
      channel: heat
      energy: 3
      # The backfire is the bolt that did not go out — the cursed band's
      # own committed energy, landing on the hand instead of the target.
      joules: 15000
      site: body.arm.right.hand
      resist: { axis: channel, intensity: 2 }
  description: >-
    A lance of true flame. What it touches, it heats — flesh burns, tinder
    catches, iron merely warms. The fire it starts is real fire.
