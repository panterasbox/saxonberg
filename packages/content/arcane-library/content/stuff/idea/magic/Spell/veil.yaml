# Veil — create·sense, the belief-side semblance: an imposed disguise
# (Disguisable.setDisguise) held up by a SustainedEffect. A MODIFIER —
# the veil drops inside a suppression field and under dispel. Semblance,
# not invisibility: you are seen, but not as yourself.
class: /platform/idea/magic/Spell
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  spellId: veil
  name: Veil
  verb: create
  noun: sense
  cost: 22
  castingProfile:
    requiredBand: competent
    castSeconds: 4
  targeting: self
  durationSeconds: 1800
  effects:
    # Band-authored (cursed · uncursed · blessed — `MagicEffects.forBand`
    # band-resolves any 2–3 list): a cursed veil draws every eye, a
    # blessed one leaves no memory at all. The ring that carries this
    # obliges it (`lint:blessed-bands`).
    - kind: cloak
      disguise:
        - a figure every eye is drawn to
        - a veiled, indistinct figure
        - a face no memory keeps
  description: >-
    The features blur; the name slides off. Watchers see someone — just
    never quite you — for as long as the working holds.
