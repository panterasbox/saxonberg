# potion of veiling — a catalog potion: three lines on `Potion`.
#
# The vessel is the arcana pack's preset `Receptacle` (glass, 0.25 L of
# interior bulk, the flask/vial/potion/draught keywords), so a catalog
# potion says only what it looks like and what is in it. The POTION is
# the liquid — the `veiling-draught` material carries the working, the dose,
# and the identity (one identification covers every flask of the
# substance); the flask reads the same to everybody.
#
# 0.25 L is the reference dose (the material's `dose` block), so a full
# flask is exactly one dose and drinking half of it is half.
class: /system/arcana/thing/Potion
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a stoppered glass flask
  longDescription: >
    A squat glass flask with a waxed stopper, the kind an apothecary sells by the crate. Whatever is in it moves a little slowly when tilted.
  interiorMaterial: /stuff/idea/material/potion/veiling-draught
  interiorAmount: 0.25
