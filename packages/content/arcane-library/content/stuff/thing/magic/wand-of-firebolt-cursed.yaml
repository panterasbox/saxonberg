# ⛔ `unreachable: awaiting:magic-items-slate`, and ⚠ a CORRECTION to the
# reachability sweep's own plan, which said to delete this row.
#
# The plan's reasoning was that the row sat at `regionTarget: 0` *"until
# generation odds land"* and the odds HAVE landed — `wand-of-firebolt`
# carries `blessingOdds: { cursed: 3, uncursed: 95, blessed: 2 }` and
# `ResidencyLogic.rollBlessing` stamps the band on each minted instance,
# so cursed wands do now enter the world from the ORDINARY row. That
# much is right, and it makes the comment below (*"only when somebody
# clones it deliberately… without making it a hazard nobody opted
# into"*) stale: a 3-in-100 roll is exactly a hazard nobody opted into.
#
# ⚠ But deleting it is wrong. `arcane-library/README.md` lists it and
# `plans/slate-compaction/magic-items.md:88` cites it as the code
# evidence for *a cursed identify plants a false identification*.
# Deleting content two docs point at in order to satisfy a gate is the
# gate wagging the dog. And the live question — whether a hand-authored
# cursed exemplar should still exist beside a mechanism that mints the
# same object — is a DISTRIBUTION question, which is the slate's.
#
# ⭐ So it is parked with the five other arcane-library rows the sweep
# parked, and the stale `regionTarget: 0` comment stays exactly where it
# is as the evidence of what needs deciding.
unreachable: awaiting:magic-items-slate
# A cursed wand of firebolt — the BUC exemplar, and the first thing in
# the world that is not `uncursed`.
#
# Deliberately the SAME wand as `wand-of-firebolt`, one band down, and
# nothing else differs. That is the entire claim BUC makes: a cursed
# wand of firebolt is a *weaker wand of firebolt*, not a wand with
# something else wrong with it. Everything a player experiences falls
# out of that one field:
#
#   - it delivers 0.6× (`BUC_POTENCY`), so firebolt lands soft;
#   - it will not leave the hand that took it (`refusesRelease`);
#   - being charged, D11 sharpens it — it bleeds its charge into the
#     holder rather than merely sitting there.
#
# ⚠ And note what "cursed" does NOT mean: it is not *malicious*, it is
# *inefficient*. The blessed twin of this wand would be a BETTER
# firebolt wand — and the blessed twin of a wand of dread would be a
# better wand of dread, which is why knowing an item's band tells you
# nothing about whether it is safe to use. See `Blessing`.
#
# It shares `wand-of-firebolt`'s census key on purpose: it is the same
# kind of thing for stock purposes, and a separate bucket would let a
# player read BUC off the census.
class: /system/arcana/thing/Wand
data:
  shortDescription: slender ashwood wand
  keywords: [wand, slender, ashwood]
  register: indefinite
  longDescription: >
    A finger-length rod of pale ash, banded at the grip with tarnished
    brass. Held still, it is faintly warm.
  carriedSpellPath: /stuff/idea/magic/Spell/firebolt
  makerId: /obj/npc/practicum/artificer
  deliveryEfficiency: 1.4
  capacityTau: 900
  alwaysOn: false
  censusKey: wand
  materialTags: [wood, brass]
  descriptorClass: wand
  # ⚠ NOT stocked by the spawn table. Until generation odds land (the
  # follow-on), a cursed item enters the world only when somebody clones
  # it deliberately — which is what makes it testable without making it
  # a hazard nobody opted into.
  regionTarget: 0
  identifiedName: a wand of firebolt
  # ── the one field that differs from the ordinary wand ──
  blessingBand: cursed
  # You HOLD a wand. Without a slot claim there is nothing for a
  # curse to stick to — `remove`/`unwield` only gate what is
  # actually occupying a body slot.
  slotClaims:
    "/stuff/idea/species/BodyPlan/biped": ["hand:right"]
