# The spark spell's transient energized locus — cloned for one conduction
# resolution (voltage set from the spell, the real graph does the rest),
# then destructed. Players never see one at rest.
class: /arcane-library/thing/SparkLocus
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: crackle of gathered charge
  register: indefinite
  longDescription: >-
    A snapping knot of charge, gone as fast as it came.
