# A scroll of identify — the exemplar consumable.
#
# It affords `read` and NOTHING ELSE (requirements D34). It used to
# carry an `identify` verb of its own; that declaration is deleted, not
# relocated, because a verb appearing in your affordance list because of
# what you are holding tells you what you are holding — and the scroll
# would have identified itself for free.
#
# So: verbs key on the visible KIND (a scroll), effects key on the
# hidden CLASS (which scroll). Structurally identical to every other
# consumable rather than a special case.
class: /system/arcana/thing/Scroll
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a scroll of identify
  primaryKeyword: scroll
  longDescription: >
    A tight roll of vellum dense with shifting glyphs. Read it upon a
    thing and its true nature surfaces in the margins for a moment.
  markText: >-
    a dense column of glyphs that will not hold still long enough to be
    copied
  markForm: inked
  carriedSpellPath: /stuff/idea/magic/Spell/identify
  usesRemaining: 1
  censusKey: scroll
  materialTags: [vellum]
  descriptorClass: scroll
  regionTarget: 4
  identifiedName: a scroll of identify
  # Reading it visibly resolves something. You learn what it was by
  # watching it work.
  selfIdentifying: true
