# The bench — the fixed coupling, at the practical ceiling.
#
# `0.98` and never 1: an efficiency of 1 is a perpetual-motion machine
# in a model denominated in real joules. The last 2% is heat, and the
# bench is exactly the apparatus built to get rid of it.
#
# This is the object that makes "the mage who fills wands" a PLACE as
# well as a person — the service has premises, which is what turns it
# into a vocation rather than a favour.
class: /arcana/thing/Conduit
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a charging bench
  primaryKeyword: bench
  keywords: [bench, cradle, apparatus]
  longDescription: >
    A slab of slate bedded on brass, with a sink of coiled pipe beneath
    it that stays cold to the touch no matter what has been done on top.
    The heat has to go somewhere, and somebody thought about where.
  # ⚠ `stone/slate` never existed (the namespace is `rock/`), so this
  # bench resolved no material at all. Nearest authored rock; the
  # material vocabulary is closed by doctrine.
  _materialPath: /stuff/idea/material/rock/granite
  mass: 60
  couplingEfficiency: 0.98
