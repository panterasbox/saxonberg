# that OWNS this question. `magic-items.md` is explicit that magic
# distribution is **census-gated**, and the census is the mechanism that
# decides how many of a thing the realm carries and where. This row has
# no `censusKey`, so no census draws it and nothing places it: it is a
# shipped magic item nobody can meet.
#
# ⚠ The disposition is deliberately NOT a general-store line. The other
# nineteen rows the reachability sweep placed went on a shelf because a
# player would plausibly own one; a magic item's distribution is a
# design question about scarcity and discovery that a shopkeeper's par
# would answer by accident. The slate decides it; this key is the record
# that it is undecided rather than forgotten.
unreachable: awaiting:magic-items-slate
# The bench — the fixed coupling, at the practical ceiling.
#
# `0.98` and never 1: an efficiency of 1 is a perpetual-motion machine
# in a model denominated in real joules. The last 2% is heat, and the
# bench is exactly the apparatus built to get rid of it.
#
# This is the object that makes "the mage who fills wands" a PLACE as
# well as a person — the service has premises, which is what turns it
# into a vocation rather than a favour.
class: /system/arcana/thing/Conduit
data:
  shortDescription: charging bench
  keywords: [bench, cradle, apparatus, charging]
  register: indefinite
  longDescription: >
    A slab of slate bedded on brass, with a sink of coiled pipe beneath
    it that stays cold to the touch no matter what has been done on top.
    The heat has to go somewhere, and somebody thought about where.
  # ⚠ `stone/slate` never existed (the namespace is `rock/`), so this
  # bench resolved no material at all. Nearest authored rock; the
  # material vocabulary is closed by doctrine.
  _materialPath: /stuff/idea/material/rock/granite
  mass: 60
  couplingEfficiency: 0.98
