# ⛔ `unreachable: awaiting:magic-items-slate` — held against the slate
# that OWNS this question. `magic-items.md` is explicit that magic
# distribution is **census-gated**, and the census is the mechanism that
# decides how many of a thing the realm carries and where. This row has
# no `censusKey`, so no census draws it and nothing places it: it is a
# shipped magic item nobody can meet.
#
# ⚠ The disposition is deliberately NOT a general-store line. The other
# nineteen rows the reachability sweep placed went on a shelf because a
# player would plausibly own one; a magic item's distribution is a
# design question about scarcity and discovery that a shopkeeper's par
# would answer by accident. The slate decides it; this key is the record
# that it is undecided rather than forgotten.
unreachable: awaiting:magic-items-slate
# potion of blistering — a catalog potion: three lines on `Potion`.
#
# The vessel is the arcana pack's preset `Receptacle` (glass, 0.25 L of
# interior bulk, the flask/vial/potion/draught keywords), so a catalog
# potion says only what it looks like and what is in it. The POTION is
# the liquid — the `blistering-draught` material carries the working, the dose,
# and the identity (one identification covers every flask of the
# substance); the flask reads the same to everybody.
#
# 0.25 L is the reference dose (the material's `dose` block), so a full
# flask is exactly one dose and drinking half of it is half.
class: /system/arcana/thing/Potion
data:
  shortDescription: stoppered glass flask
  keywords: [flask, stoppered, glass]
  register: indefinite
  longDescription: >
    A squat glass flask with a waxed stopper. Whatever is in it moves a little slowly when tilted, and the glass is faintly warm.
  interiorMaterial: /stuff/idea/material/potion/blistering-draught
  interiorAmount: 0.25
