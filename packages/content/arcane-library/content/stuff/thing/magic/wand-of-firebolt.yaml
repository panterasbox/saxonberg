# A wand of firebolt — the charged-item exemplar.
#
# It carries the SHIPPED `firebolt` spell rather than a bespoke one:
# an item is a new trigger, never a new mechanism, and one authored
# definition serving both doors is the whole of wave 1.
#
# `capacityKJ: 900` against firebolt's 20-point cost is about 45 firings
# from full — a real resource, spent in an afternoon of trouble, and
# worth the trip to a mage who will fill it again.
#
# `alwaysOn: false` is the cheap mode. A ring that conferred its effect
# continuously would set this true and flatten in days rather than
# months (D8) — that is one field, not a different class.
#
# `deliveryEfficiency: 1.4` is the maker's, fixed at manufacture (D7). A
# novice firing this genuinely outperforms that novice casting, which is
# the point of the whole class.
class: /arcana/thing/Wand
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a slender ashwood wand
  primaryKeyword: wand
  longDescription: >
    A finger-length rod of pale ash, banded at the grip with tarnished
    brass. Held still, it is faintly warm.
  carriedSpellPath: /stuff/idea/magic/Spell/firebolt
  makerId: /obj/npc/practicum/artificer
  deliveryEfficiency: 1.4
  capacityKJ: 900
  alwaysOn: false
  # ── distribution (D21) ──
  # Material tags weigh PLACE AFFINITY; effect tags are READ from
  # Arcane and never repeated here — a copy would drift from the spell
  # it came from, and a ward would end up consulting the distribution
  # subsystem to decide whether to suppress this.
  censusKey: wand
  materialTags: [wood, brass]
  # The item's own baseline; a zone's `stocks` list overrides it.
  regionTarget: 2
  # Unidentified until used or identified — a wand has its own
  # descriptor bank (ornament × proportion).
  descriptorClass: wand
  identifiedName: a wand of firebolt
  # A lance of true flame is not subtle. Firing it once tells you
  # exactly what you are holding — which is the experiment a scroll
  # of identify lets you skip paying for.
  selfIdentifying: true
  # You HOLD a wand. Without a slot claim there is nothing for a
  # curse to stick to — `remove`/`unwield` only gate what is
  # actually occupying a body slot.
  slotClaims:
    "/stuff/idea/species/BodyPlan/biped": ["hand:right"]
  # ── generation odds (mint-time only) ──
  # Weights, not percentages. Cursed is rare and blessed rarer still —
  # a displacement from the ordinary should stay a surprise. A Zone that
  # declares `blessingOdds` overrides this wholesale.
  #
  # Cursed can roll at all only because there is now recourse for it
  # (`remove-curse`). *Calibrate at launch* — D21 holds every
  # distribution constant to that.
  blessingOdds: { cursed: 3, uncursed: 95, blessed: 2 }
  # The identified parts: named for what the thing DOES, which is why
  # they cannot show before you know. `sigil` alone answers the question.
  details:
    sigil:
      keywords: [sigil, glyph, mark]
      description: >
        A firebolt glyph cut deep into the brass band and blackened by
        its own work — the maker's, and legible to anyone taught to read
        the grid.
    grip:
      keywords: [grip, handle]
      description: >
        Ash worn smooth, and warm even now. Firing this heats the wand
        rather than the hand holding it, which is the whole reason the
        class is safe to sell.
