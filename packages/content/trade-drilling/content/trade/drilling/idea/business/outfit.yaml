# ⭐⭐ The drilling outfit — the seed row, and its SEATS are authored
# HERE, which is the whole point of it.
#
# `positions` has no runtime setter and should not have one: what seats a
# business has is a fact about the KIND of business, not about this one.
# So the one seat a bore crew has is written down once, here, and every
# outfit minted at every siting in the realm gets it for free. That is
# what the no-runtime-setter constraint actually permits, rather than
# something it blocks.
#
# ⚠ `appointingAuthority` and `banksAt` are deliberately EMPTY. They are
# overlaid at mint from the person who sited the hole and the bank they
# keep an account at — the stall seed's shape exactly, and the reason an
# outfit cannot exist without somebody's money behind it.
#
# ⭐ A player on a crew uses `apply for roustabout at <outfit>` and
# `clock on` like any other job, because the seat is a real derived
# opening on a real business. The engine measures who is standing at the
# rig and never asks who is behind the eyes.
class: /trade/drilling/idea/DrillingOutfit
data:
  name: drilling outfit
  appointingAuthority: { path: "" }
  banksAt: ""
  # ⭐⭐ **The seat's SHAPE is here; whether it is HIRING is not.** Two
  # different facts with two different homes, and `lint:openings` is what
  # made the distinction visible: a seed row that advertised a place
  # (`headcount:`) was told, correctly, that *this house authors no
  # `banksAt` — there is no operating account for the wage to come out
  # of, the shift settles into a throw, and the worker is never paid.*
  #
  # Which is exactly true of a SEED. It has no bank, no claim, no hole
  # and no proprietor; those are overlaid at the siting, from the person
  # who spent the money. So the seed says what a roustabout's seat IS —
  # the key, the title, the wage — and the **minted outfit** says how
  # many places it has, because an opening is a claim about a going
  # concern and a seed is not one.
  #
  # ⚠ The mint reads these positions and adds the headcount, so the seat
  # is defined ONCE. See `BoreController.site`.
  # ⭐⭐⭐ **A bore crew starts at the beam.** The wage runs from the
  # moment they take hold of it, whether the beam turns or not, and that
  # is the whole of what makes a dry hole expensive rather than merely
  # disappointing.
  #
  # ⚠ The kernel default is `false` — *a shift is something you choose to
  # start* — and it is right for a chart: a press office's appointee
  # starts nothing by being appointed. This house is the other kind, so
  # this house says so. ⭐ It is a declaration about hiring and therefore
  # lives on the chart, beside `positions`; it is NOT a trade mechanism,
  # and any house that hires hands who cannot clock themselves on can set
  # it. See employment.md § Starting work on hire.
  startsShiftOnHire: true
  positions:
    - key: roustabout
      title: roustabout
      wageRate: 4
