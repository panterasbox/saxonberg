verbs: [line]
category: drilling
controller: /trade/drilling/idea/cmd/drilling/LineController
description: "Run tube down the hole so it will hold"
help: |
  ⭐ The one act at a rig that buys nothing except the ability to keep
  going. A liner produces no goods, raises no rate and improves no
  reading: it stops the hole caving in, and it stops the water above
  coming down into whatever you are trying to lift out.

  Which is exactly why it matters. `bore` refuses to go deeper through
  soft wet ground until the hole is lined, and the refusal names the
  remedy — so nobody is stuck, only delayed and poorer.

  ⚠ A liner is timber and leather. `carve liner` takes two of timber.
examples:
  - cmd: line
    note: Run the liner you are carrying down the hole
  - cmd: line with liner
    note: The same, naming it
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: hole
    type: object
    required: false
    default: "reachable:[mixin.GroundPointMixin]"
    scope: ["here", "peers", "person"]
    requires: [GroundPointMixin]
  - name: rig
    prepositionRequired: true
    type: object
    required: false
    # ⚠ `at` only: `with`/`using` name the liner (they collided, so
    # `line with liner` bound the rig's slot — controller-liquidity W12).
    prepositions: [at]
    default: "reachable:[capability.derrick]"
    scope: ["here", "peers", "person"]
    requires: [ToolMixin]
  - name: liner
    prepositionRequired: true
    type: object
    required: false
    prepositions: [with, using]
    # ⚠ The liner by name, never "the first thing in your pack" — the hole
    # destroyed whatever bound (C8). `canLine` refuses anything else.
    default: "me:i:liner"
    scope: ["inventory", "reachable"]
    requires: TangibleMixin
