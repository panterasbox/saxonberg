verbs: [hire]
controller: /trade/drilling/idea/cmd/drilling/HireController
description: "Take somebody on at the rig"
help: |
  `hire <person>` puts whoever is standing in front of you on your
  outfit's books and on the beam, from now.

  ⭐ **A bore crew is hired at the bore**, out of whoever has walked up
  to it, which is how it actually worked. The wage runs from the moment
  they take hold of the beam, whether the beam turns or not — and the
  only thing that stops it is `dismiss`.

  A player who wants to be on somebody's crew does not need this verb:
  `apply for roustabout at <outfit>` and `clock on`, like any other job.
  The wage and the work are the same either way, because the engine
  measures who is standing at the rig and never asks who is behind the
  eyes.

  ⚠ It is your outfit or it is nobody's — you can only hire for a rig
  you are the proprietor of.
examples:
  - cmd: hire the roustabout
    note: Sign somebody on and put them to work
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  # ⭐⭐ THE RIG — DECLARED, not hunted for (`lint:instrument-args`), and
  # the query is the CAPABILITY rather than the class: a second kind of
  # rig any pack ships works with nothing here changed, and the tag on
  # the derrick row is CONSUMED rather than decorative.
  - name: rig
    type: object
    required: false
    prepositions: [at, with, using]
    default: "reachable:[capability.derrick]"
    scope: ["reachable"]
    requires: [ToolMixin]
  # ⭐ THE HOLE. ⚠ `required: false` and ABSENT IS MEANINGFUL: no hole
  # bound means there is no hole here, which is the fork `bore` takes to
  # site one. A required arg would have made siting unreachable.
  - name: hole
    type: object
    required: false
    default: "reachable:[mixin.GroundPointMixin]"
    scope: ["reachable"]
    requires: [GroundPointMixin]
  - name: target
    type: object
    required: true
    scope: [reachable]
    requires: class:Agent
    greedy: true
