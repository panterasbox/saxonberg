# The bailer — a leather bucket with a flap valve in the bottom, on the
# end of the rope.
#
# ⭐⭐ **The pre-pump lift, and it is on the rig from the first yard.** It
# is not a Stage-C tool that arrives with the oil: a bit swimming in
# standing water cuts nothing, so clearing the hole is what a bailer is
# for long before there is anything down there worth lifting. That is
# also why *drilling before the pump* is the honest order — a well
# without a pump is not abandoned, it is bailed.
#
# ⚠ Leather and timber, not rubber. Every pre-industrial lift in the
# world was leather-packed, and the drilling design believed otherwise
# for a while before somebody checked.
#
# ⭐⭐ It is also the thing that AFFORDS `bore`, which is why it has a
# class of its own rather than being a bare `Tool`. A derrick cannot be
# what affords raising a derrick — the spade/field split the kernel
# already blessed. See `Bailer.ts`.
class: /trade/drilling/thing/Bailer
data:
  keywords: [bailer, bucket, bail, sandpump]
  shortDescription: well bailer
  register: indefinite
  longDescription: >-
    A tube of stiffened hide three feet long with an iron hoop at the
    mouth and a leather flap in the bottom that opens going down and
    shuts coming up. It is stained to the colour of the ground it has
    been in.
  mass: 6
  capabilities: ["bailing"]
