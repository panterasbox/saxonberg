# Exit-kind: a flight of stairs — admits walking, refuses wheels (the
# haulage residue `media` can't express). See archway.yaml for the
# exit-kind mechanism notes.
class: /platform/idea/Exit
data:
  media: [ground]
  wheelPassable: false
  messageOut: "{{ mover }} takes the stairs."
  messageIn: "{{ mover }} arrives up the stairs."
  # ⭐ Size and carrying D8: a stair turns, and only a rigid thing no
  # longer than this swings round the landing — the sofa in the stairwell.
  # A straight flight authors its own `turn` (or none) per site.
  turn: 2.2
