# A horn spoon — the commonest utensil there is, and the one nobody makes
# yet: its maker is the ⭐CARVER, a roster gap nothing has built. It ships
# as a row so the loop works today, and a carving trade will find a real
# customer waiting when it arrives.
#
# ⭐ It is `Cutlery` — SERVICEWARE, which is claimed when you eat, dirtied
# by the meal, washed at the basin and counted on the house par, exactly
# like the bowls and the bar's glasses. It is not a VESSEL: it was a
# `CraftVessel` for one build and carried an interior slot
# never filled — serviceware without contents. `utensilKind: spoon` is
# what `eat` matches on (`lib/bulk/Utensil.ts`).
class: /platform/thing/Cutlery
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a horn spoon
  primaryKeyword: spoon
  keywords: [spoon, horn-spoon, utensil]
  longDescription: |
    A shallow spoon cut from a cow's horn and scraped thin, the bowl of it gone translucent amber where the light comes through. Warm to hold, and it never scalds a lip.
  utensilKind: spoon
  _materialPath: /stuff/idea/material/organic/horn
  mass: 0.03
