# The default floor — what `Location.ensureFloor()` clones for every room
# that does not author one of its own. Before the ground build NOTHING
# attached this row; 27 of 180 Locations had a floor and `sit` declined in
# the room a new player wakes up in.
#
# ⚠ `noDefaultFloor: true` on a Location opts out, and that opt-out is now
# REAL — it was documented here (and in posture.md and spatial.md) for two
# builds while no code read it. Today the void row uses it, and mid-air and
# mid-water rooms will: a place with no floor is a place you cannot stand.
#
# The keyword list authors `floor` and `ground` even though `FloorMixin`
# unions them onto every floor by construction. Belt and braces, and a row
# should read honestly on its own — `lint:ground` clause (d) holds every
# floor row to it. ⚠⚠ The `details.floor` keyword list below is NOT what
# `sit` resolves against: `pushDetails` gives a detail the pool `[<its id>]`
# and never its authored keywords, which is exactly why the words have to
# be up here.
#
# This row authors NO material. That is deliberate — it is what sends the
# floor to rung 4 of the ladder (`Location.floorDefaults()`, board-floored
# indoors, loam outdoors) so the same row reads as boards in a dorm and as
# ground in a lane.
#
# UNBOUNDED_CAPACITY = Number.MAX_SAFE_INTEGER (9007199254740991);
# JSON/BSON-safe substitute for Infinity (which doesn't round-trip).
class: /platform/thing/Floor
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: featureless plain floor
  keywords: [floor, ground, featureless, plain, underfoot]
  register: indefinite
  longDescription: A featureless plain floor.
  # Surface-bulk: an uncapped puddle slot. Spills, over-pours, and
  # open-vessel drain-through pool here as the floor's surface bulk
  # (no `surfaceCapacity` ⇒ unbounded sink). Starts empty.
  surfaceBulk: true
  # Kept even though `FloorMixin` supplies exactly this spec when a row
  # authors none: the shape is pinned by `lib/slot/__tests__/Floor.test.ts`
  # and reading it here is how an author learns what a floor's slot IS.
  staticSlots:
    - name: 'ground:1'
      accepts: SlottableMixin
      capacity: 9007199254740991
      postures: [sit, lie, kneel, stand]
      userFacingDetail: floor
  details:
    floor:
      keywords: [floor, ground, dirt, surface]
      description: A featureless plain floor.
