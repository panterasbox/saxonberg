# A block of ice — the cold you carry into an icebox, and the clock.
#
# ⭐ `Casting` is the shipped re-meltable solid, and its own docstring
# names ice as an intended use: "a cast lump of whatever froze (metal
# run into a mould, wax, ice)". It melts through the shipped plateau —
# at 273 K the leak goes into latent heat and the temperature holds,
# until `mass × latentHeatOfFusion` is spent and the block destructs.
#
# ⚠ A KNOWN COST, accepted rather than overlooked: `Casting` composes
# `AlloyedMixin`, which is load-bearing for metal (an off-spec quench
# must not lose the carbon somebody spent three smelts putting in) and
# INERT on ice. The client shows a player what mixins an object
# composes, so this block will claim it can be alloyed and tempered.
# That is a real misrepresentation, filed against
# `docs/slates/builds/base-class-narrowing-slate.md`: the re-meltable-
# solid concept is welded to metallurgy, and the fix is that slate's,
# not a one-row class here.
#
# ⚠ Nobody sells it. The icehouse-keeper's vocation and the
# agricultural year (cold free in winter, dear in summer) are
# `docs/slates/tails/preservation-slate.md`'s. This row exists so a
# retail row can name it the day that trade ships.
class: /platform/thing/Casting
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: block of ice
  keywords: [ice, block, ice-block]
  register: indefinite
  longDescription: |
    A four-kilo block of ice, clouded white at the heart and sweating along every edge.
  _materialPath: /trade/bottling/idea/material/ice
  # ⚠⚠ **Four kilos, and it belongs IN A BOX.** Found by driving: ice
  # conducts well, so a bare block's own R is tiny and the leak is
  # enormous — a block left loose in a warm kitchen is gone in
  # something like five game-MINUTES, and one seeded on the cookhouse
  # floor did not survive the world booting. That is not a defect, it
  # is the design working: the cold runs out, and a box is what slows
  # it. Inside the icebox the block borrows the walls
  # (`CoolboxMixin.insulationR`) and lasts hours.
  #
  # So a venue that keeps ice ships it INSIDE its icebox (see the
  # cookhouse's `stocked-icebox`), never loose. The plan's Risk 3
  # called the shot: *if the block is gone before the bands diverge,
  # raise the R or the mass — authoring, not a defect.* The answer
  # turned out to be neither: put it where the R already is.
  mass: 4
  # ⭐⭐ **It has to arrive COLD, and this line is what the drive
  # bought.** Without it the block spawns at the model's default room
  # temperature — a "block of ice" at 293 K, which is above its own
  # 273 K melting point: not ice, not cold storage, and already
  # melting the instant it exists. Every other route to a cold solid is
  # a history (a freeze, a quench) and an authored object has no
  # history, so it says so itself.
  #
  # 268 K is out of an icehouse: below freezing, with a little of the
  # winter still in it. It warms to the plateau and holds there while
  # it melts, which is the clock the icebox runs on.
  stampedTemperatureK: 268
