# Key — the carryable physical key template, cloned per issue (a bearer
# instrument holding a keychain credential). Its shortDescription + the keyway
# it turns are set at issue time by CredentialApi.issueKey (a brass key, a keycard, or
# a master ring). The born-with (empty) keychain record comes from
# Key.defaultCredentialKinds.
class: /platform/thing/Key
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a key
  keywords: [key]
