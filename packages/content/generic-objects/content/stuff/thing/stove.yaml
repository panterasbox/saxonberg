# A closed stove — the same mechanism as the open hearth, and a better
# machine: a firebox with a door loses less up the chimney, so it puts
# MORE into the room off the same fuel and lasts longer doing it. It also
# casts almost no light, which is the trade.
#
# ⭐ A second heating object and ZERO new code: `Hearth` is the class, and
# what makes this a stove is three numbers and some prose.
class: /platform/thing/Hearth
data:
  shortDescription: cast-iron stove
  keywords: [stove, fire, firebox, iron]
  register: definite
  longDescription: >
    A squat cast-iron stove on four stubby feet, its door shut on a red
    line of light and its flue climbing into the wall. The top plate is
    flat enough to stand a kettle on and hot enough to mean it.
  lit: false
  # More of the fire reaches the room, and it burns slower.
  heatOutputW: 2200
  burnTemperatureK: 650
  # A closed firebox: a line of light around the door, and no more.
  # ⭐⭐ The darkness sweep (fire build). `emittedIntensity` is a CEILING
  # now, not the reading: luminosity is incandescent soot, so a solid-fuel
  # flame at full draught sheds `fire.light.sootyFloor` (0.6) of it and a
  # starved one climbs back toward it. Every burner's authored figure is
  # scaled by 1/0.6 so a well-run fire lights its room exactly as brightly
  # as it did before — and a badly-run one now lights it MORE, which is
  # the lesson. ⚠ No room lit only by a fire has gone dark (AC20).
  emittedIntensity: 13
  emittedColorTemperature: 1800
  # ⭐ The fire build: fuel is a BED (kilograms, by material) that
  # `stoke` fills, and the vessel's size is a POWER rather than a
  # percentage-per-minute of nothing. What it reaches depends on what
  # is in it.
  maxBurnPowerW: 7000
  fuelCapacityKg: 20
