# A brazier — a basket of coals on legs. The least of the three: it heats
# what is immediately around it and little else, and it is the one you can
# carry into a room that has no chimney.
#
# ⚠ Not to be confused with the practicum's bronze brazier, which is a
# `Campfire` row and shipped alight on purpose.
class: /platform/thing/Hearth
data:
  shortDescription: iron brazier
  keywords: [brazier, coals, basket, fire, iron]
  register: indefinite
  longDescription: >
    An iron basket on three splayed legs, blackened to the rim and
    standing in its own small ring of scorched floor. It warms whoever is
    nearest and argues with nobody about the rest of the room.
  lit: false
  heatOutputW: 700
  burnTemperatureK: 750
  # ⭐⭐ The darkness sweep (fire build). `emittedIntensity` is a CEILING
  # now, not the reading: luminosity is incandescent soot, so a solid-fuel
  # flame at full draught sheds `fire.light.sootyFloor` (0.6) of it and a
  # starved one climbs back toward it. Every burner's authored figure is
  # scaled by 1/0.6 so a well-run fire lights its room exactly as brightly
  # as it did before — and a badly-run one now lights it MORE, which is
  # the lesson. ⚠ No room lit only by a fire has gone dark (AC20).
  emittedIntensity: 100
  emittedColorTemperature: 1800
  # ⭐ The fire build: fuel is a BED (kilograms, by material) that
  # `stoke` fills, and the vessel's size is a POWER rather than a
  # percentage-per-minute of nothing. What it reaches depends on what
  # is in it.
  maxBurnPowerW: 3000
  fuelCapacityKg: 8
