# ⚠⚠ **The row's `_materialPath` is a DEFAULT, not a claim.** Both mint
# paths override a crafted output's material from the stock it was made
# of, unconditionally — so a blade forged out of a wrought-iron bar IS
# iron and reads as iron on the card and under `analyze`. What the
# default is for is a clone nobody forged: the newbie wilds prop five of
# these rows, and after material height entered delivery a weapon with
# NO material delivers zero. A material-less prop would be a stick.
#
# ⭐ Which is why the NAME no longer says steel. The row cannot know what
# metal a particular one is made of, so it does not say — the shape is
# the row's and the metal is the instance's, and `analyze weapon` is
# where you find out.
class: /platform/thing/equipment/Shield
data:
  shortDescription: faced shield
  keywords: [shield, faced]
  register: indefinite
  longDescription: >
    A broad round shield of oak boards faced in stiff hide, an iron boss
    riveted over the grip. Held up between you and one foe it turns almost
    anything — but it guards only what it faces, and two attackers will
    find the side it can't cover.
  # ⚠ LEATHER, because the face is hide (assembly D7): a whole's authored
  # material is its FACING's by convention — the outer surface is what an
  # edge, a flame or a splash of lye meets first. It read steel while the
  # shield was three bars of metal at the anvil.
  _materialPath: /stuff/idea/material/organic/leather
  _detailMaterialPaths:
    boards: /stuff/idea/material/wood/oak
  # An armor construction (it resists like plate) worn in the hand, not on the
  # body — combat folds it into the covering stack as a directional front
  # cover and grants its holder a large guard bonus. Occupies the off-hand.
  constructionForm: plate
  gradeBand: fine
  slotClaims:
    "/stuff/idea/species/BodyPlan/biped": ["hand:left"]
  # ⭐ What a shield is MADE OF (assembly D3, W2's fold route): three oak
  # boards, a hide FACE glued over them, and an iron boss riveted through
  # the middle with four rivets. ⭐ The face is `role: facing` — an edge
  # blow lands on it and a blunt one on the boards behind it, because the
  # fold asks which part answers the channel. `fit shield` raises one;
  # `fit hide-face to shield` re-faces a cut-up one.
  bill:
    parts:
      - { part: shield-board, plural: shield-boards, template: /trade/carpentry/thing/board, count: 3, role: structural, material: /stuff/idea/material/wood/oak }
      - { part: hide-face, template: /trade/tanning/thing/hide-face, count: 1, role: facing, material: /stuff/idea/material/organic/leather }
      - { part: boss, template: /trade/smithing/thing/shield-boss, count: 1, role: structural, material: /stuff/idea/material/element/iron }
      - { part: rivet, plural: rivets, template: /trade/smithing/thing/rivet, count: 4, role: fastener, material: /stuff/idea/material/element/iron }
    joints:
      - { key: bossing, method: riveted, members: [boss, shield-board], fastener: rivet }
      - { key: facing, method: glued, members: [hide-face, shield-board] }
