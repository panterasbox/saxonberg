# ⚠⚠ **The row's `_materialPath` is a DEFAULT, not a claim.** Both mint
# paths override a crafted output's material from the stock it was made
# of, unconditionally — so a blade forged out of a wrought-iron bar IS
# iron and reads as iron on the card and under `analyze`. What the
# default is for is a clone nobody forged: the newbie wilds prop five of
# these rows, and after material height entered delivery a weapon with
# NO material delivers zero. A material-less prop would be a stick.
#
# ⭐ Which is why the NAME no longer says steel. The row cannot know what
# metal a particular one is made of, so it does not say — the shape is
# the row's and the metal is the instance's, and `analyze weapon` is
# where you find out.
class: /platform/thing/equipment/Shield
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: faced shield
  keywords: [shield, faced]
  register: indefinite
  longDescription: >
    A broad round shield, oak-boarded and faced in metal. Held up between you
    and one foe it turns almost anything — but it guards only what it faces,
    and two attackers will find the side it can't cover.
  _materialPath: /stuff/idea/material/alloy/steel
  _detailMaterialPaths:
    boards: /stuff/idea/material/wood/oak
  # An armor construction (it resists like plate) worn in the hand, not on the
  # body — combat folds it into the covering stack as a directional front
  # cover and grants its holder a large guard bonus. Occupies the off-hand.
  constructionForm: plate
  gradeBand: fine
  slotClaims:
    "/stuff/idea/species/BodyPlan/biped": ["hand:left"]
