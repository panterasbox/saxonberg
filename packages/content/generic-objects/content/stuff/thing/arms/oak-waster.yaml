class: /platform/thing/equipment/Weapon
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: oak waster
  keywords: [waster, sword, practice-sword, oak]
  register: indefinite
  longDescription: >
    A practice sword carved from a single billet of oak — an arming sword's
    weight, length, and crossguard, with a rounded "edge" that couldn't cut
    butter. Every drill hall keeps a rack of them: it trains the true
    sword's tempo and guard, and the worst it deals is a bruise you'll
    remember to parry next time.
  _materialPath: /stuff/idea/material/wood/oak
  # The blunted delivery form: sword-shaped, no edge presented. Blows
  # resolve as blunt (contusions through the tissue fold; a padded jacket
  # absorbs them outright) while the derived playstyle — reach, balance,
  # tempo, guard — is byte-identical to the steel arming sword's, because
  # those derive from mass x length x form, never from what it's made of.
  constructionForm: blunted
  gradeBand: fine
  mass: 1.0
  length: 0.9
  slotClaims:
    "/stuff/idea/species/BodyPlan/biped": ["hand:right"]
  # ⭐ A practice sword. It trains the same craft as the steel — that is what it is FOR.
  exercises: [blades]
