# The fire poker — the smithing ladder's trivial rung: a hafted iron rod.
# Material + mass flow from the consumed stock at forge time. Weapon-class
# (hafted → blunt delivery) so even the first thing a learner forges is
# real — it stirs a fire and cracks a knee.
class: /platform/thing/equipment/Weapon
data:
  shortDescription: fire poker
  keywords: [poker, fire-poker, rod, fire]
  register: indefinite
  longDescription: |
    A straight iron rod with a knurled grip and a bent working tip. The first thing an apprentice forges, and the last tool a hearth gives up.
  constructionForm: hafted
  gradeBand: fair
  mass: 1.0
  length: 0.7
  slotClaims:
    "/stuff/idea/species/BodyPlan/biped": ["hand:right"]
  # ⭐ Not a weapon, but swung like one; a bar of iron trains the bludgeon.
  exercises: [bludgeons]
  # ⭐ Size and carrying (W6 arms audit): its shape is a ROD and its box
  # its blade/shaft, so the length rule (`Carrying.handsFor` — longer than
  # 0.6 of the holder's stature takes two hands) reads it.
  shape: rod
  dimensions: { width: 0.03, depth: 0.02, height: 0.7 }
