class: /platform/thing/equipment/Weapon
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a steel dagger
  primaryKeyword: dagger
  longDescription: >
    A slim double-edged dagger of good steel, a hand-span of blade. It
    delivers a cutting edge, and its point will find a gap in mail.
  _materialPath: /stuff/idea/material/alloy/steel
  constructionForm: bladed
  gradeBand: fine
  # The authored *shape* — a light, short blade. Playstyle derives: light
  # mass -> fast tempo + an exploiter (cashes openings), short length ->
  # a close-range weapon that owns the clinch. See combat WeaponProfile.
  mass: 0.3
  length: 0.25
  # One-handed — claims a single hand slot (wield it in either hand).
  slotClaims:
    "/stuff/idea/species/BodyPlan/biped": ["hand:right"]
