class: /platform/thing/equipment/Shield
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a steel-faced shield
  primaryKeyword: shield
  longDescription: >
    A broad round shield, oak-boarded and faced in steel. Held up between you
    and one foe it turns almost anything — but it guards only what it faces,
    and two attackers will find the side it can't cover.
  _materialPath: /stuff/idea/material/alloy/steel
  _detailMaterialPaths:
    boards: /stuff/idea/material/wood/oak
  # An armor construction (it resists like plate) worn in the hand, not on the
  # body — combat folds it into the covering stack as a directional front
  # cover and grants its holder a large guard bonus. Occupies the off-hand.
  constructionForm: plate
  gradeBand: fine
  slotClaims:
    "/stuff/idea/species/BodyPlan/biped": ["hand:left"]
