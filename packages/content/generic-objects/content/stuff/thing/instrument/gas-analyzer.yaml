# GasAnalyzer — handheld atmosphere-identifying instrument that reads it.
#
# ⭐⭐ A ROW over `/platform/thing/ToolItem`, not a class of its own.
#
# Every one of these instruments used to be an empty `Thing` subclass
# whose only content was `commandContributions` — it put the whole
# `measure` view on its carrier, and each channel's controller then
# checked `instanceof <ThatExactClass>`. Two costs:
#
#   1. ⚠⚠ **The instrument was unextendable.** A second maker's
#      thermometer was silently refused by a class check, which is the
#      `ComminutingMixin` lesson in the reading register: the question is
#      what a thing can DO, never what class it is.
#   2. **It could not be graded, worn, or broken**, because a bare Thing
#      composes none of that — so a fine instrument and a shoddy one read
#      identically forever.
#
# As a `ToolItem` it is graded, durable and wears on use, and the channel
# row names the CAPABILITY below rather than this file. The affordance
# moved to the Avatar: everyone can type `measure`, and what an
# instrument buys is the reading, not the verb.
class: /platform/thing/ToolItem
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: gas analyzer
  keywords: [analyzer, gas]
  register: indefinite
  long: A bulky brass-and-glass device with a chemistry tube. It identifies the bulk medium filling the surrounding space (air, water, vacuum, …).
  capabilities: [gas-analysis]
  mass: 1.8
  _materialPath: /stuff/idea/material/alloy/bronze
