# Oven — a baking / roasting furnace. A gentle cooking heat (500 K), far below
# smelting; no bellows. Lit with `ignite`.
class: /platform/thing/Oven
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a clay oven
  longDescription: >
    A rounded clay oven with an arched mouth, warm to the hand and smelling of
    woodsmoke and bread.
  keywords: [oven, hearth, furnace]
  burnTemperatureK: 500
  bellowsMultiplier: 1
  fuelBurnRatePerMin: 0.2
  lit: false
  reserves:
    fuel:
      capacityValue: 100
      currentValue: 100
      unit: "%"
      theme: combustion
      floorEffect: null
  emittedIntensity: 30
  emittedColorTemperature: 1800
