class: /platform/thing/equipment/DisguiseGarment
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a deep grey hood
  primaryKeyword: hood
  longDescription: >
    A plain grey hood of coarse wool, cut deep enough to throw a face
    into shadow. Drawn up, it leaves little to recognize but a shape.
  slotClaims:
    "/stuff/idea/species/BodyPlan/biped": [head]
  # Disguise data (DisguiseBearingMixin). Drawn up, the hood presents
  # "a hooded figure" and masks identity — a known wearer reads as that
  # to others until it comes off, when recognition re-fires for free.
  appearsAs: a hooded figure
  masksIdentity: true
  covers: [face]
  # Coarse wool, as the prose already said.
  _materialPath: /stuff/idea/material/textile/wool
  constructionForm: woven
  gradeBand: fair
  mass: 0.3
