# A bee veil — ⭐⭐ **ordinary clothing, and that is the whole design.**
#
# It is linen over your head. It works because it is woven cloth over the
# place bees go for, and the shipped covering stack attenuates a sting the
# same way it attenuates anything else — so nobody authored a mitigation
# table, and a hood or a wrapped scarf would help for the same reason.
#
# ⚠ It covers the HEAD slot, which is the honest approximation until there
# is a `face` body part. A veil over your hat with nothing over your hands
# is how most people get stung.
class: /platform/thing/equipment/Garment
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: bee veil
  keywords: [veil, "bee veil", net, hat]
  register: indefinite
  longDescription: >
    A wide-brimmed hat with a cylinder of black horsehair netting hanging
    from it, drawn in under the arms with tapes. You can see out of it
    better than it looks.
  slotClaims:
    "/stuff/idea/species/BodyPlan/biped": [head]
  _materialPath: /stuff/idea/material/textile/linen
  constructionForm: woven
  gradeBand: fair
  mass: 0.3
