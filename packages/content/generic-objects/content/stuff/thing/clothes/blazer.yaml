class: /platform/thing/equipment/Garment
data:
  shortDescription: sharp blazer
  keywords: [blazer, sharp]
  register: indefinite
  longDescription: >
    A well-cut blazer, a touch too confident for a first-year. The
    wearer clearly intends to be taken seriously, and soon.
  slotClaims:
    "/stuff/idea/species/BodyPlan/biped": [torso]
  # Cut close from a fine worsted — the cost is in the cloth and the cutting.
  _materialPath: /stuff/idea/material/textile/wool
  constructionForm: /platform/fabrics/woven
  gradeBand: fine
  mass: 0.9
  # ⭐ Two hip pockets and an inner pocket (size and carrying D29).
  placements:
    - { member: /platform/placements/pocket, name: left pocket, mouth: { width: 0.15, height: 0.045 }, volumeM3: 0.0012 }
    - { member: /platform/placements/pocket, name: right pocket, mouth: { width: 0.15, height: 0.045 }, volumeM3: 0.0012 }
    - { member: /platform/placements/pocket, name: inner pocket, mouth: { width: 0.13, height: 0.025 }, volumeM3: 0.0005, covered: true }
