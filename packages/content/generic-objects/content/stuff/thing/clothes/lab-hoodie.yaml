class: /platform/thing/equipment/Garment
data:
  shortDescription: faded lab hoodie
  keywords: [hoodie, faded, lab]
  register: indefinite
  longDescription: >
    A soft, faded hoodie with a half-scrubbed equation inked on one
    cuff. It has the look of someone who codes through the night and
    forgets to eat.
  slotClaims:
    "/stuff/idea/species/BodyPlan/biped": [torso]
  # Knit, not woven: the loops are why it is soft and why it lets the wind straight through.
  _materialPath: /stuff/idea/material/textile/wool
  constructionForm: /platform/fabrics/knit
  gradeBand: fair
  mass: 0.7
  # ⭐ One front pouch pocket, open both ends (size and carrying D29).
  placements:
    - { member: /platform/placements/in, name: front pocket, mouth: { width: 0.2, height: 0.05 }, volumeM3: 0.0015 }
