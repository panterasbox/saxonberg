  _materialPath: /stuff/idea/material/textile/linen
  constructionForm: /platform/fabrics/woven
  gradeBand: fair
  mass: 0.5
  # ⭐ Two side pockets with realistic mouths (size and carrying D26/D29):
  # the first small thing a newcomer picks up goes in one.
  placements:
    - { member: /platform/placements/in, name: left pocket, mouth: { width: 0.12, height: 0.035 }, volumeM3: 0.0006 }
    - { member: /platform/placements/in, name: right pocket, mouth: { width: 0.12, height: 0.035 }, volumeM3: 0.0006 }
