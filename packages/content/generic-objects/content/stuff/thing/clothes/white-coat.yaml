class: /platform/thing/equipment/Garment
data:
  shortDescription: crisp white coat
  keywords: [coat, crisp, white]
  register: indefinite
  longDescription: >
    A clean white clinical coat, pockets still stiff. It lends the
    wearer an air of competence they may not yet have earned — but
    intend to.
  slotClaims:
    "/stuff/idea/species/BodyPlan/biped": [torso]
  # Bleached linen. ⭐ It is white for a REASON: the coat is sacrificial, and a stain shows.
  _materialPath: /stuff/idea/material/textile/linen
  constructionForm: /platform/fabrics/woven
  gradeBand: fair
  mass: 0.7
  # ⭐ Two deep patch pockets (size and carrying D29).
  placements:
    - { member: /platform/placements/in, name: left pocket, mouth: { width: 0.16, height: 0.05 }, volumeM3: 0.0015 }
    - { member: /platform/placements/in, name: right pocket, mouth: { width: 0.16, height: 0.05 }, volumeM3: 0.0015 }
