class: /platform/thing/equipment/Garment
data:
  shortDescription: rugged field jacket
  keywords: [jacket, rugged, field]
  register: indefinite
  longDescription: >
    A heavy, many-pocketed field jacket built for weather and work. It
    has the quiet competence of something meant to stand between you and
    trouble.
  slotClaims:
    "/stuff/idea/species/BodyPlan/biped": [torso]
  # Heavy close-woven duck. The weight IS the weather-proofing — a dense weave is what breaks a wind.
  _materialPath: /stuff/idea/material/textile/linen
  constructionForm: woven
  gradeBand: fair
  mass: 1.4
  # ⭐ Four flapped pockets — two at the chest, two at the hip (size and
  # carrying D29). Flapped, so they close.
  placements:
    - { member: /platform/placements/pocket, name: left chest pocket, mouth: { width: 0.12, height: 0.03 }, volumeM3: 0.0006, closes: true }
    - { member: /platform/placements/pocket, name: right chest pocket, mouth: { width: 0.12, height: 0.03 }, volumeM3: 0.0006, closes: true }
    - { member: /platform/placements/pocket, name: left hip pocket, mouth: { width: 0.16, height: 0.05 }, volumeM3: 0.0015, closes: true }
    - { member: /platform/placements/pocket, name: right hip pocket, mouth: { width: 0.16, height: 0.05 }, volumeM3: 0.0015, closes: true }
