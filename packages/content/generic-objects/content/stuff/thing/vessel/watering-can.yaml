# A watering can — the instrument that confers `water`. The row's own
# `capabilities` entry names the verb and its placement: `carried`, so
# the verb lights only while the can is in your pack.
class: /platform/thing/WateringCan
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a tin watering can
  primaryKeyword: can
  keywords: [can, "watering can", watering, tin]
  longDescription: |
    A dented tin can with a long spout and a wire handle, sized for reaching over a windowsill without soaking the sill.
  material: /stuff/idea/material/alloy/steel
  interiorBulk: true
  interiorCapacity: 2
  capabilities:
    - { kind: watering, verbs: [platform/cmd/bulk/water.yaml], placement: carried }
