# A candle — ⭐⭐ **the end of the chain, and it burns itself down.**
#
# Bees → comb → crushed for wax → a candle that lights a room. Four steps,
# each one a real act, and the light at the end is the payoff for taking
# the worse of the two extraction recipes (AC 12).
#
# ⚠ A `Lamp` with no refill: what it burns is itself, which is why the
# fuel reserve is the candle. It is dimmer and warmer in colour than a
# lantern, and that difference is what a player sees when they light one.
class: /platform/thing/Lamp
data:
  keywords: [candle, taper, wax]
  shortDescription: beeswax candle
  register: indefinite
  longDescription: >-
    A hand-dipped taper of pale wax with a linen wick, smelling of honey
    before it is even lit.
  _materialPath: /stuff/idea/material/organic/beeswax
  mass: 0.12
  # ⚠ Ships cold and out (`lint:light-sources` refuses a Burner row that
  # omits `lit:`, and a candle that arrives already burning is a candle
  # nobody decided to light).
  lit: false
  reserves:
    fuel:
      capacityValue: 100
      currentValue: 100
      unit: "%"
      theme: combustion
      floorEffect: null
  # Dim and very warm — a tenth of a lantern and a good deal yellower.
  emittedIntensity: 12
  emittedColorTemperature: 1900
