# A candle — ⭐⭐ **the end of the chain, and it burns itself down.**
#
# Bees → comb → crushed for wax → a candle that lights a room. Four steps,
# each one a real act, and the light at the end is the payoff for taking
# the worse of the two extraction recipes (AC 12).
#
# ⚠ A `Lamp` with no refill: what it burns is itself, which is why the
# fuel reserve is the candle. It is dimmer and warmer in colour than a
# lantern, and that difference is what a player sees when they light one.
class: /platform/thing/Lamp
data:
  keywords: [candle, taper, wax]
  shortDescription: beeswax candle
  register: indefinite
  longDescription: >-
    A hand-dipped taper of pale wax with a linen wick, smelling of honey
    before it is even lit.
  _materialPath: /stuff/idea/material/organic/beeswax
  mass: 0.12
  # ⚠ Ships cold and out (`lint:light-sources` refuses a Burner row that
  # omits `lit:`, and a candle that arrives already burning is a candle
  # nobody decided to light).
  lit: false
  # Dim and very warm — a tenth of a lantern and a good deal yellower.
  # ⭐⭐ The darkness sweep (fire build). `emittedIntensity` is a CEILING
  # now, not the reading: luminosity is incandescent soot, so a solid-fuel
  # flame at full draught sheds `fire.light.sootyFloor` (0.6) of it and a
  # starved one climbs back toward it. Every burner's authored figure is
  # scaled by 1/0.6 so a well-run fire lights its room exactly as brightly
  # as it did before — and a badly-run one now lights it MORE, which is
  # the lesson. ⚠ No room lit only by a fire has gone dark (AC20).
  emittedIntensity: 20
  emittedColorTemperature: 1900
  # ⭐ The fire build: fuel is a BED (kilograms, by material) that
  # `stoke` fills, and the vessel's size is a POWER rather than a
  # percentage-per-minute of nothing. What it reaches depends on what
  # is in it.
  # ⚠ A candle burns ITSELF: the bed is the wax, 100 g of it, and there
  # is no refilling a candle. 15 W is a candle.
  maxBurnPowerW: 80
  fuelCapacityKg: 0.2
  fuelBed:
    /stuff/idea/material/organic/beeswax: 0.1
