# ⛔ `unreachable: exemplar`, and ⭐ the reason is this row's own header:
# it is the standing proof that the `Kiln` CLASS was unnecessary. The
# dials are all there is now, on `Oven`, which is the right parent — and
# that claim needs a row to be true OF. ⚠ It is NOT deleted (the plan
# said to): deleting it would delete the evidence for a decision
# already made, and the row is correct now in a way the clone it
# replaced never was (the old one could not hold a charge, so it could
# not be fired, which is why it stood nowhere for its whole life).
# ⭐ What lifts this: a pottery or lime trade. Then a kiln is propped in
# a yard and this key comes off.
unreachable: exemplar
# Kiln — a ceramics / lime firing furnace. A steady pottery heat (1200 K),
# with a modest bellows boost. Lit with `ignite`, run with `fire`.
#
# ⭐⭐ **The `Kiln` CLASS is gone, and this row is why it could go.** `Forge`
# and `Kiln` were byte-identical — the same imports and the same composition
# — so the forge/kiln distinction was two class names over one behaviour and
# a row's dials. And `Oven`'s own comment gives the only real distinction
# there is: *"`ContainerMixin` INSIDE `ThermalMixin`: an oven is a chamber you
# put bread in. A `Forge` and a `Kiln` are deliberately NOT containers — a
# forge is a fire you bring a workpiece to."*
#
# ⭐ That reasoning is right and the classification contradicted it: **you
# stack ware in a kiln and shut it**, so a kiln is on the OVEN side and the
# forge is the odd one out. `Kiln` had been cloned from the wrong parent, and
# that clone is exactly why it could not hold a charge — a kiln that cannot
# hold a charge cannot be fired, which is why this row stood nowhere in the
# world for its whole life.
#
# So the dials were always what made it a kiln, and now they are all there is.
class: /platform/thing/Oven
data:
  shortDescription: brick kiln
  keywords: [brick, kiln, furnace, oven]
  register: indefinite
  longDescription: >
    A domed brick kiln with a low stoking door, its inner walls glazed by
    countless firings.
  burnTemperatureK: 1200
  bellowsMultiplier: 1.25
  lit: false
  # ⭐⭐ The darkness sweep (fire build). `emittedIntensity` is a CEILING
  # now, not the reading: luminosity is incandescent soot, so a solid-fuel
  # flame at full draught sheds `fire.light.sootyFloor` (0.6) of it and a
  # starved one climbs back toward it. Every burner's authored figure is
  # scaled by 1/0.6 so a well-run fire lights its room exactly as brightly
  # as it did before — and a badly-run one now lights it MORE, which is
  # the lesson. ⚠ No room lit only by a fire has gone dark (AC20).
  emittedIntensity: 100
  emittedColorTemperature: 2000
  # ⭐ The fire build: fuel is a BED (kilograms, by material) that
  # `stoke` fills, and the vessel's size is a POWER rather than a
  # percentage-per-minute of nothing. What it reaches depends on what
  # is in it.
  maxBurnPowerW: 25000
  fuelCapacityKg: 60
