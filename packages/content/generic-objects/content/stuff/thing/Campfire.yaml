# ⛔ `unreachable: exemplar` — the demo combustion fixture `fire.md` and
# `thermal.md` point at, and it is not meant to stand in the world: it
# ships ALIGHT, with a full fuel reserve and a warming slot, so a
# campfire propped in a room is a fire somebody lit and walked away
# from. The practicum's bronze brazier is the deliberate exception and
# is its own row. ⭐ What a player CAN own is the brazier and the stove
# (general-store lines since the reachability sweep): the same `Hearth`
# mechanism, three numbers apart, carried and bought rather than found
# burning.
unreachable: exemplar
# Campfire — the demo combustion fixture. A fuel reserve (content theme
# 'combustion') burns down over game-time; while lit the fire is pinned
# hot (its surface scalds — contact burns through the general thermal
# hook) and casts light; on burnout it cools to embers. A `log:1` warming
# slot lets a body sit at the fire to both recover (restQuality) and stay
# warm (warmth, read by the body's effective-ambient resolver).
class: /platform/thing/Campfire
data:
  shortDescription: crackling campfire
  keywords: [crackling, campfire, fire, flames, hearth]
  register: indefinite
  longDescription: >
    A ring of stones cradles a crackling campfire, its flames licking at
    split logs. Heat rolls off it in waves.
  # Light — authored glow (flicker comes for free from the light layer).
  # ⭐ A campfire row ships ALIGHT, and now says so. `BurnerMixin.lit`
  # defaults true, so this was the shipped behaviour already — the
  # envelope build's `lint:light-sources` clause (g) only makes it a
  # sentence somebody wrote instead of a default nobody chose. It is
  # right here: the prose says "crackling", "flames licking at split
  # logs". A campfire you have to light is a `lit: false` row.
  lit: true
  # ⭐⭐ The darkness sweep (fire build). `emittedIntensity` is a CEILING
  # now, not the reading: luminosity is incandescent soot, so a solid-fuel
  # flame at full draught sheds `fire.light.sootyFloor` (0.6) of it and a
  # starved one climbs back toward it. Every burner's authored figure is
  # scaled by 1/0.6 so a well-run fire lights its room exactly as brightly
  # as it did before — and a badly-run one now lights it MORE, which is
  # the lesson. ⚠ No room lit only by a fire has gone dark (AC20).
  emittedIntensity: 200
  emittedColorTemperature: 1800
  # Warming bonus + recovery for a body in the log-seat (outdoor radiant
  # warmth reaches only slot-occupants; an indoor fire would warm the room).
  restQuality: 1.2
  warmth: 9
  staticSlots:
    - name: 'log:1'
      accepts: SlottableMixin
      capacity: 4
      postures: [sit, kneel]
      userFacingDetail: logs
  details:
    logs:
      keywords: [log, logs, seat, stone, stones]
      description: Split logs and flat stones ring the fire — somewhere to sit.
  # ⭐ The fire build: fuel is a BED (kilograms, by material) that
  # `stoke` fills, and the vessel's size is a POWER rather than a
  # percentage-per-minute of nothing. What it reaches depends on what
  # is in it.
  # ⭐ It ships ALIGHT, so it ships with a charge in it — eight kilos of
  # split oak, which at 8 kW is about four and a half game hours. A
  # campfire nobody feeds goes out, which it could not do before.
  maxBurnPowerW: 8000
  fuelCapacityKg: 20
  fuelBed:
    /stuff/idea/material/wood/oak: 8
