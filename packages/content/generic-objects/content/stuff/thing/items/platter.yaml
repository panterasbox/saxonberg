# A platter — the dinnerware kind a ROAST comes out on: wide, shallow, and
# meant to be carved from at the table rather than eaten off. Third of the
# three commons dinnerware kinds (plate · bowl · platter), and the same
# claimed-not-cloned vessel as the other two.
class: /platform/thing/Dish
data:
  shortDescription: platter
  keywords: [platter, dish, board, serving]
  register: indefinite
  longDescription: |
    A broad oval platter with a shallow lip and a channel cut round the rim to catch what a roast gives up.
  _materialPath: /stuff/idea/material/ceramic/earthenware
  category: platter
  interiorBulk: true
  interiorCapacity: 0.8
  mass: 0.8
  # ⭐ (ceramics S1, M6) A fused lead glaze — glossy, and (M7) it gives
  # lead to anything acid kept in it, which nothing about it says.
  coats:
    inside:
      - { material: /stuff/idea/material/glaze/lead, thicknessM: 0.0003, state: fused }
    outside:
      - { material: /stuff/idea/material/glaze/lead, thicknessM: 0.0003, state: fused }
