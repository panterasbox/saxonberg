# A flask of blistering draught — the thrown carrier's demonstrator.
#
# Structurally identical to the flask of veiling: an ordinary
# `Receptacle` carrying 0.25 L (one reference dose) of a potion material,
# with all the identity on the MATERIAL rather than on the glass.
#
# The one thing that matters for the ranged build is what it is made OF.
# The vessel breaks by ITS OWN material — glass, whose toughness is far
# below the shatter threshold — not by the draught's. Those are two
# different materials and confusing them would make every potion as
# fragile as its bottle.
class: /platform/thing/Receptacle
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a sealed glass flask
  primaryKeyword: flask
  keywords: [flask, vial, potion, draught, caustic]
  longDescription: >
    A thick-walled flask sealed with wax and pitch rather than a simple
    stopper. Whatever is inside is faintly cloudy, and the glass is
    warmer than it ought to be.
  material: /stuff/idea/material/glass
  interiorBulk: true
  interiorCapacity: 0.25
  interiorMaterial: /stuff/idea/material/potion/blistering-draught
  interiorAmount: 0.25
