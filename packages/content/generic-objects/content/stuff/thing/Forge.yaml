# Forge — a bellows-fed smithing furnace. Charcoal-fuelled, its base held
# temperature (1300 K) is hot but shy of iron's 1811 K melting point; working
# the bellows scales it by 1.6 (→ 2080 K), so smelting heat is reachable ONLY
# with the bellows — the forge's reasoned mechanic. Lit with `ignite`.
class: /platform/thing/Forge
data:
  shortDescription: stone forge
  keywords: [stone, forge, hearth, furnace, bellows]
  register: indefinite
  longDescription: >
    A squat stone forge with a deep charcoal bed and a great leather bellows
    at its side. Cold, it is just soot and iron fittings; lit and pumped, it
    roars white-hot.
  # Burner config — charcoal base heat + a bellows multiplier to smelting heat.
  burnTemperatureK: 1300
  bellowsMultiplier: 1.6
  lit: false
  # ⭐⭐ The darkness sweep (fire build). `emittedIntensity` is a CEILING
  # now, not the reading: luminosity is incandescent soot, so a solid-fuel
  # flame at full draught sheds `fire.light.sootyFloor` (0.6) of it and a
  # starved one climbs back toward it. Every burner's authored figure is
  # scaled by 1/0.6 so a well-run fire lights its room exactly as brightly
  # as it did before — and a badly-run one now lights it MORE, which is
  # the lesson. ⚠ No room lit only by a fire has gone dark (AC20).
  emittedIntensity: 150
  emittedColorTemperature: 2200
  # ⭐ The fire build: fuel is a BED (kilograms, by material) that
  # `stoke` fills, and the vessel's size is a POWER rather than a
  # percentage-per-minute of nothing. What it reaches depends on what
  # is in it.
  # 20 kW with the bellows on top — a smith's fire, and the biggest
  # ordinary one in the game.
  maxBurnPowerW: 20000
  fuelCapacityKg: 30
