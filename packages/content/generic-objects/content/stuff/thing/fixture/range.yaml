# The kitchen range — a residential skin of the Hearthworks cookhouse hearth
# (`/stuff/thing/Oven`, a `BurnerMixin` appliance at gentle cooking heat, lit with
# `ignite`, burning its fuel reserve down at 0.2%/min).
#
# The kitchen's standing heat. `cook` asks for reachable heat where the
# recipe wants it, the pot, and the ingredients — so a range in your own
# home is not a new mechanic, it is the ERRAND COLLAPSE that makes the
# archetype worth having (D12).
class: /platform/thing/Oven
data:
  shortDescription: kitchen range
  keywords: [range, stove, oven, hearth, fire, kitchen]
  register: indefinite
  longDescription: >
    A cast-iron range squatting against the wall, its firebox door hinged at
    the front and a flat plate on top worn silver where pots have stood.
  burnTemperatureK: 500
  bellowsMultiplier: 1
  lit: false
  # ⭐⭐ The darkness sweep (fire build). `emittedIntensity` is a CEILING
  # now, not the reading: luminosity is incandescent soot, so a solid-fuel
  # flame at full draught sheds `fire.light.sootyFloor` (0.6) of it and a
  # starved one climbs back toward it. Every burner's authored figure is
  # scaled by 1/0.6 so a well-run fire lights its room exactly as brightly
  # as it did before — and a badly-run one now lights it MORE, which is
  # the lesson. ⚠ No room lit only by a fire has gone dark (AC20).
  emittedIntensity: 50
  emittedColorTemperature: 1800
  mass: 150
  # ⭐ The fire build: fuel is a BED (kilograms, by material) that
  # `stoke` fills, and the vessel's size is a POWER rather than a
  # percentage-per-minute of nothing. What it reaches depends on what
  # is in it.
  maxBurnPowerW: 5000
  fuelCapacityKg: 20
