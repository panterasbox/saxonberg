# The kitchen counter — a work surface. `/lib/spatial/Surface` is the
# shipped generic (a shelf, counter, table): items placed on it via
# `placeOn` keep `container = the room` and gain `restingOn = this`, so they
# read as being ON the counter rather than as loose room clutter.
class: /platform/thing/Surface
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: kitchen counter
  register: indefinite
  primaryKeyword: counter
  keywords: [counter, worktop, surface, bench]
  longDescription: |
    A scrubbed wooden counter running the length of one wall, scarred with knife marks and pale where it has been washed a thousand times.
  mass: 90
