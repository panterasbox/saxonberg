# The bed — the substrate's first real REST SURFACE.
#
# The shipped dorm `Bed` is a `Placing` prop you cannot lie on, and until
# now nothing in the world authored `restQuality` but a campfire log. This
# is what makes the bedroom archetype non-decorative on day one: metabolism
# already recovers by `posture × restQuality` on a reconcile-on-read clock,
# so a bed you own is recovery you keep while you are away (D10).
#
# `/platform/thing/Chair` is the reusable posture-bearing class — the slot spec is
# authored per seed, which is why a bed needs no class of its own.
class: /platform/thing/Chair
data:
  shortDescription: bed
  keywords: [bed, mattress, bedding]
  register: indefinite
  longDescription: |
    A proper bed — a wooden frame, a deep mattress, blankets turned down at one corner. It looks like somewhere you could actually sleep.
  # An authored constant, deliberately: making it DERIVE from bedding
  # freshness, tidiness or how dark the room is is the same aggregation as
  # every other condition read, and it needs the condition model this build
  # does not ship. A four-poster is simply better than a cot.
  restQuality: 2.0
  # A fixture by encumbrance (the anvil rule) as well as by title.
  mass: 80
  staticSlots:
    - name: 'lie:1'
      accepts: SlottableMixin
      capacity: 1
      postures: [lie, sit]
      userFacingDetail: mattress
  details:
    mattress:
      keywords: [mattress, blanket, blankets, sheets]
      description: A deep mattress under heavy blankets, turned down at one corner.
    frame:
      keywords: [frame, wood, posts]
      description: A plain wooden frame, pegged rather than nailed, worn smooth at the footboard.
  # ⭐ What a bed is MADE OF (assembly D3): a joiner's pegged bedstead
  # (the frame row — legs, rails, pegs — with its own bill) and a tailor's
  # stitched mattress SEATED in it. The mattress is the WEAR part, and
  # `Chair.getRestQuality` is where that is felt: a bed whose mattress has
  # gone rests you like a bare frame. `fit mattress to bed` replaces it.
  bill:
    parts:
      - { part: bedstead, template: /trade/carpentry/thing/frame, count: 1, role: structural, material: /stuff/idea/material/wood/ash }
      - { part: mattress, template: /trade/tailoring/thing/mattress, count: 1, role: wear, material: /stuff/idea/material/textile/linen }
    joints:
      - { key: bedding, method: seated, members: [mattress, bedstead] }
