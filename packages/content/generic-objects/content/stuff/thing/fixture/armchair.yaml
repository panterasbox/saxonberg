# An armchair — NOT a built-in. The living room ships nearly empty on
# purpose: the empty room is the invitation, and filling it is the whole
# point of the build (D16).
#
# So this is a good you BUY, own, and place. It is here as content the store
# can stock and a tenant can own — and being tenant chattel, it leaves with
# the tenant and survives eviction into storage.
#
# Modest `restQuality`: the third instance of one pattern (a bed is high, a
# tub is warm, a chair is a chair).
class: /platform/thing/Chair
data:
  shortDescription: worn armchair
  keywords: [armchair, chair, seat, worn]
  register: indefinite
  longDescription: |
    A deep armchair with sagging springs and a blanket over one arm, the upholstery rubbed shiny where hands have rested.
  restQuality: 1.2
  mass: 35
  staticSlots:
    - name: 'sit:1'
      accepts: SlottableMixin
      capacity: 1
      postures: [sit]
      userFacingDetail: seat
  details:
    seat:
      keywords: [seat, cushion, upholstery]
      description: A sagging cushion that has taken the shape of whoever sits in it most.
  # ⭐⭐ What an armchair is MADE OF (assembly D3) — and the NESTING case
  # (AC 5): a joiner's pegged frame, which is itself legs, rails and pegs
  # with a bill of its own, and a tailor's stitched cushion, which is
  # covers and stuffing with one of its own, SEATED together by hand.
  # ⭐ The cushion is the WEAR part: `Chair.getRestQuality` reads every
  # structural line's condition and drops to a bare frame's rest when the
  # cushion has failed — and `fit cushion to armchair` puts a new one in
  # without a peg of the frame being touched.
  #
  # `seat-frame`, not `frame`: a bill's part is matched by keyword as well
  # as by row, and a hive frame answers to `frame`.
  bill:
    parts:
      - { part: seat-frame, template: /trade/carpentry/thing/frame, count: 1, role: structural, material: /stuff/idea/material/wood/ash }
      - { part: cushion, template: /trade/tailoring/thing/cushion, count: 1, role: wear, material: /stuff/idea/material/textile/linen }
    joints:
      - { key: upholstery, method: seated, members: [cushion, seat-frame] }
