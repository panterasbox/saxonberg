# A clothes line — a rope between two posts, with pegs (cleanliness D11). A
# wet garment hung on it dries in the open air, faster than one in a room;
# a DryingRack by another name, because hanging a shirt to dry and hanging a
# ham to dry are the same act.
class: /platform/thing/DryingRack
data:
  shortDescription: clothes line
  keywords: [line, "clothes line", "washing line", rope, pegs]
  register: indefinite
  longDescription: A rope strung taut between two posts, with a bag of wooden pegs hung on one of them.
  airExposure: 1
  placements: [/platform/placements/on, /platform/placements/from]
  _materialPath: /stuff/idea/material/textile/linen
  mass: 3
  # ⭐ Size and carrying (W1 finding): washing hangs `from` a line along
  # its LENGTH, and 3 kg of linen derives to a 19 cm block — two shirts.
  # The line is strung between two posts, so it says how long it runs.
  dimensions: { width: 0.02, depth: 0.02, height: 2.5 }
