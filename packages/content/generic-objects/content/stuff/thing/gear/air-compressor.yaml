# Air compressor — the dive-shop refill source for the scuba proof. A
# large interior bulk of `air`: refill a depleted tank from it via
# `BulkableApi.transfer` (the `fill`/pour verb path). Its budget is large
# enough to read as a fixed refill station rather than a carried supply.
class: /platform/thing/Receptacle
data:
  shortDescription: air compressor
  keywords: [compressor, air]
  register: indefinite
  longDescription: >
    A squat electric air compressor bolted to the wall, a coiled fill hose
    hanging from its manifold. A sticker reads FILL CYLINDERS HERE.
  interiorBulk: true
  interiorMaterial: /stuff/idea/material/bulk/air
  interiorCapacity: 1000
  # ⭐⭐ `sealed`, and it has to be said now. Air has a boiling point
  # (79 K) since the fire build, so `requiredClosureFor` classes it as a
  # GAS — and a gas is held only by a vessel built gas-tight. ⚠ The
  # default is `liquidTight`, which this row relied on and which would
  # now let the tank's charge escape into the room on every fill. ⭐ The
  # happy consequence: `getAirGauge()` (amount over capacity) becomes an
  # honest PRESSURE read by reinterpretation, with no new field.
  closure: sealed
  interiorAmount: 1000
