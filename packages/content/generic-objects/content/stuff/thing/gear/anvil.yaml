# Anvil — a heavy object well past a normal biped's strain ceiling.
# Exercises the encumbrance lift gate: `get anvil` declines diegetically
# (the anvil doesn't budge). 200 kg sits above
# baseMass(70) × CAPACITY_FRACTION(0.5) × OVERLOAD_FACTOR(2.0) = 70 kg.
class: /platform/thing/Thing
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a blacksmith's anvil
  primaryKeyword: anvil
  longDescription: >
    A blacksmith's anvil, a single dense block of iron on a worn oak
    stump. It is not going anywhere you intend to carry it.
  mass: 200
