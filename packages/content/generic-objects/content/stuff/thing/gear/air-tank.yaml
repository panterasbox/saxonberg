# Air tank — the carried-supply proof for respiration. Worn on the
# torso; its interior bulk is compressed `air` the respiration driver
# taps while submerged. Capacity 6 L of air budget, seeded full. When it
# empties underwater the body falls into the supply-exhausted crisis.
# Refill via `BulkableApi.transfer` from a dive-shop air source.
class: /platform/thing/AirTank
data:
  shortDescription: air tank
  keywords: [tank, air]
  register: indefinite
  longDescription: >
    A scuffed aluminium diving cylinder on a webbing harness, fitted with
    a regulator. A gauge on the manifold reads the air remaining.
  mass: 8
  interiorBulk: true
  interiorMaterial: /stuff/idea/material/bulk/air
  interiorCapacity: 6
  # ⭐⭐ `sealed`, and it has to be said now. Air has a boiling point
  # (79 K) since the fire build, so `requiredClosureFor` classes it as a
  # GAS — and a gas is held only by a vessel built gas-tight. ⚠ The
  # default is `liquidTight`, which this row relied on and which would
  # now let the tank's charge escape into the room on every fill. ⭐ The
  # happy consequence: `getAirGauge()` (amount over capacity) becomes an
  # honest PRESSURE read by reinterpretation, with no new field.
  closure: sealed
  interiorAmount: 6
  slotClaims:
    "/stuff/idea/species/BodyPlan/biped": [torso]
