# Handcart — a wheeled Vessel you hitch and pull. The worked example of
# the haulage substrate: cargo loaded into it leaves the hauler's
# encumbrance books (it lives in the cart's own container); only the
# draftFactor-attenuated draft load is borne while hitched.
#
# draftFactor 0.04 (well-wheeled, level-path common case) — a heavy load
# presents only a few felt kg of draft and often stays under the
# light-load floor, draining no endurance. A dragged sledge would set it
# high (~0.35); carrying it in your arms is 1.0.
class: /platform/thing/equipment/Handcart
data:
  shortDescription: wooden handcart
  keywords: [handcart, wooden]
  register: indefinite
  longDescription: >
    A sturdy two-wheeled handcart with a long pull-handle and a plank
    bed. Loaded right, one person can move a load that would flatten
    them to carry — so long as the ground stays level.
  mass: 25
  # ⭐ Its size (size and carrying drive, step 18): a plank bed on two
  # wheels with the handles out in front — 0.9 m across the wheels, 1.6 m
  # handle to tail. With no box and no material its size was unknown, an
  # unknown size is never refused, and the drive was told to `put
  # handcart in breast pocket`. Now a narrow gate stops it.
  _materialPath: /stuff/idea/material/wood/ash
  dimensions: { width: 0.9, depth: 1.6, height: 0.7 }
  draftFactor: 0.04
  handedness: 2
  passageMode: wheeled
  # ⭐ Riding in it is SITTING in it (size and carrying D38): the bed is a
  # posture-bearing slot like a bench's — `sit in handcart`, `lie in …`, `stand`.
  staticSlots:
    - { name: bed, accepts: SlottableMixin, capacity: 1, postures: [sit, lie] }
