# The BATHROOM — PRESENCE (D13). A third kind of answer: not function
# (bedroom), not bundle (kitchen). A residence without one reads broken and
# every player will look for it, so it exists; what it is FOR is not
# modelled, and that is deliberate.
#
# Its three fixtures sit at three different rungs of the LOD ladder — a
# fixture is modelled to the depth at which the world actually reads it, and
# no deeper:
#
#   toilet -> prose only        (its function is not worth modelling)
#   basin  -> real water        (filling and pouring are shipped acts)
#   tub    -> a real affordance (restQuality + warmth, both already read)
#
# Washing shipped with the cleanliness build: a dressing's quality is its
# clean tier (washed, sanitised, boiled), and the hands that dress a wound
# seed it as they are kept — the basin is where both are reached.
#
# The interior lock: a bathroom is the one room in a home that locks from
# the inside. `Lockable` ships, and the door can carry it as authored
# detail; with one leaseholder per unit it has no mechanical consequence
# yet. Recorded because it is the seam co-lease, guests and the prison's
# panopticon would consume, not because it was overlooked.
class: /platform/location/FurnishableRoom
data:
  # ⭐ Daylight reaches this room through a real opening, and the
  # opening is named so the claim is something a player can walk up
  # to and look at. The room follows the sun: bright at noon, dark
  # at night unless somebody lights something.
  ambientSource: sky
  ambientOpening: window
  shortDescription: bathroom
  keywords: [bathroom, bath, washroom, room]
  register: indefinite
  longDescription: |
    A small tiled room with a tub along one wall, a basin under a clouded mirror, and a window of frosted glass that lets in light and nothing else.
  ambientIntensity: 20
  ambientColorTemperature: 4000
  props:
    - /stuff/thing/fixture/toilet
    - /stuff/thing/fixture/basin
    - /stuff/thing/fixture/tub
  details:
    window:
      keywords: [window, glass, light]
      description: |
        A small frosted window, high up and cranked open a couple of fingers.
