# Default floor — composes Adornment + Postured. One unbounded-
# capacity ground:1 slot accepting all four core postures. Authored
# per-Location in the room's adornments map; voids omit it via the
# `noDefaultFloor: true` opt-out.
#
# UNBOUNDED_CAPACITY = Number.MAX_SAFE_INTEGER (9007199254740991);
# JSON/BSON-safe substitute for Infinity (which doesn't round-trip).
class: /obj/Floor
hydratorClass: /obj/persistence/PersistentHydrator
data:
  shortDescription: a featureless plain floor
  longDescription: A featureless plain floor.
  # Surface-bulk: an uncapped puddle slot. Spills, over-pours, and
  # open-vessel drain-through pool here as the floor's surface bulk
  # (no `surfaceCapacity` ⇒ unbounded sink). Starts empty.
  surfaceBulk: true
  staticSlots:
    - name: 'ground:1'
      accepts: SlottableMixin
      capacity: 9007199254740991
      postures: [sit, lie, kneel, stand]
      userFacingDetail: floor
  details:
    floor:
      keywords: [floor, ground, dirt, surface]
      description: A featureless plain floor.
