# A large plant pot — the same class as the small one, differing only in
# how much soil it holds. 3 L carries a peace lily all the way to `mature`,
# so this is the purchase a root-bound plant argues for. It is deliberately
# the first thing a new player has a REASON to buy, and the reason is
# legible before the purchase.
class: /obj/PlantPot
hydratorClass: /obj/persistence/PersistentHydrator
data:
  shortDescription: a large clay pot
  primaryKeyword: pot
  keywords: [pot, "large pot", "clay pot", planter]
  longDescription: |
    A deep unglazed pot you would need both arms for, broad enough at the mouth to get a full root ball into without wrecking it.
  material: /obj/material/ceramic/ceramic
  interiorBulk: true
  interiorCapacity: 3
  # `liquidTight` (the default), NOT `open`: an `open` interior does not
  # RETAIN bulk — the transfer drains it straight through to the floor. A
  # pot's drainage hole lets water out, but the soil has to stay in it.
  #
  # The WATER is the `moisture` reserve below, not the bulk interior: bulk
  # is the soil, and phase 2 moved the water out of the plant and into the
  # ground it is rooted in. A pot is a bed with one slot, so the pot holds
  # it. NO `nitrogen` reserve — a houseplant is never nutrient-limited,
  # and that is the seam that keeps phase 1's behaviour intact.
  reserves:
    moisture:
      capacityValue: 1.2
      currentValue: 1.2
      unit: "L"
      theme: cultivation
      floorEffect: wilting
  staticSlots:
    - name: plant
      accepts: SlottableMixin
      capacity: 1
      userFacingDetail: planting
  details:
    planting:
      keywords: [soil, planting, hole, rim]
      description: A wide drainage hole, and depth enough for a grown plant's roots.
