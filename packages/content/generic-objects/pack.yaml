id: generic-objects
version: 0.2.0          # reserved; nothing reads/enforces it (non-goal: version machinery)
root: /generic-objects
description: >-
  Generic objects — the object clusters (items, arms, armor, clothes, gear,
  vessels, fixtures, instruments, traps, surfaces, exits, the four room
  archetypes) and the loose objects (Campfire … Casting). The junk drawer,
  slimming: the libations drain took the brand, the demo bottles, the mug
  and the whole growing cluster (pots, plants, seeds, crops, beds → the
  produce trade); each trade pack takes its objects as it ships.
requires:
  # One claim per cluster the pack ships — the branches are the pack's;
  # the loose rows are covered by the host's /stuff. Held by the default
  # maintainers group.
  # The commons are held by the Ministry of Trade (economic bootstrap D7) —
  # a seat over the physics of things, never a committee.
  title:
    - { extent: /stuff/thing/items, holder: { organization: /compact/trade } }
    - { extent: /stuff/thing/arms, holder: { organization: /compact/trade } }
    - { extent: /stuff/thing/armor, holder: { organization: /compact/trade } }
    - { extent: /stuff/thing/clothes, holder: { organization: /compact/trade } }
    - { extent: /stuff/thing/gear, holder: { organization: /compact/trade } }
    - { extent: /stuff/thing/vessel, holder: { organization: /compact/trade } }
    - { extent: /stuff/thing/fixture, holder: { organization: /compact/trade } }
    - { extent: /stuff/thing/instrument, holder: { organization: /compact/trade } }
    - { extent: /stuff/thing/traps, holder: { organization: /compact/trade } }
    - { extent: /stuff/thing/surface, holder: { organization: /compact/trade } }
    - { extent: /stuff/idea/exits, holder: { organization: /compact/trade } }
    - { extent: /stuff/location/room, holder: { organization: /compact/trade } }
