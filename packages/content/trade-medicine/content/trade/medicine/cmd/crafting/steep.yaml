verbs: [steep]
controller: /trade/medicine/idea/cmd/crafting/SteepController
description: "Steep a medicinal herb in water to draw a draught"
help: |
  `steep <herb> in <vessel>` draws a medicinal herb's active into water —
  a draught you can then `administer`. The vessel needs a little water to
  start. One verb, no fire: the herbalist's simple prep, ahead of the full
  pharmacy.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: simple
    type: object
    required: true
    scope: ["inventory", "reachable"]
    requires: any
  - name: vessel
    type: object
    required: true
    prepositions: [in, into]
    scope: ["inventory", "reachable"]
    requires: [BulkableMixin]
