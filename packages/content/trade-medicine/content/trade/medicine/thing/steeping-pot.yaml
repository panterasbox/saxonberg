# A steeping pot — an earthenware pot of water, for steeping a simple into
# a draught (D10). Pre-filled so `steep <herb> in pot` works directly.
class: /platform/thing/Receptacle
data:
  shortDescription: earthenware steeping pot
  keywords: [pot, steeping, earthenware, water]
  register: indefinite
  longDescription: |
    A squat earthenware pot half full of clean water, kept for steeping.
  interiorBulk: true
  interiorCapacity: 1.0
  interiorMaterial: /stuff/idea/material/bulk/water
  interiorAmount: 0.5
  # ⭐ (ceramics S1) What it is fired from — a body, not a description.
  _materialPath: /stuff/idea/material/ceramic/earthenware
  mass: 1.0
  # ⭐ (ceramics S1, M6) A fused lead glaze — glossy, and (M7) it gives
  # lead to anything acid kept in it, which nothing about it says.
  coats:
    inside:
      - { material: /stuff/idea/material/glaze/lead, thicknessM: 0.0003, state: set }
