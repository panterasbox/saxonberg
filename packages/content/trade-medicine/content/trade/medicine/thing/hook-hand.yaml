# A hook hand — a worn stand-in for a lost hand (recovery D16). Restores
# less than a leg does (0.35): a hook grips, but coarsely. Derived
# function, refuses a whole body — the peg-leg pattern for the hand.
class: /trade/medicine/thing/Prosthesis
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: iron hook hand
  keywords: [hook, hand, iron, prosthesis]
  register: indefinite
  longDescription: |
    A blunt iron hook set in a leather socket, strapped over the forearm. It closes on nothing and grips everything.
  forParts: [body.arm.left.hand, body.arm.right.hand]
  restores: 0.35
  slotClaims:
    "/stuff/idea/species/BodyPlan/biped": ["hands"]
