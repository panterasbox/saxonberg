# A peg leg — a worn stand-in for a lost leg (recovery D16). Function is
# DERIVED: while worn on a body missing a leg, `Vitals.ownFunction` reads
# `restores` (0.6) for that leg instead of 0. `fitsSlot` refuses a whole
# body — you cannot strap it over a leg you still have.
class: /trade/medicine/thing/Prosthesis
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: carved peg leg
  keywords: [peg, leg, wooden, prosthesis]
  register: indefinite
  longDescription: |
    A shaped wooden leg with a padded leather cup and buckled straps, worn smooth where a stump would rest.
  forParts: [body.leg.left, body.leg.right]
  restores: 0.6
  slotClaims:
    "/stuff/idea/species/BodyPlan/biped": ["legs"]
