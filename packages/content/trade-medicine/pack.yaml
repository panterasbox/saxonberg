id: trade-medicine
version: 0.1.0
root: /trade/medicine
description: >-
  The medical trade — how a body is READ, and the instruments that treat
  it. It ships `analyze patient` (the diagnostic surface that turns a
  medic's competence into INFORMATION), the trade's INSTRUMENTS (the
  `splint` that backs `set`ting a bone and the surgeon's kit that backs
  `operate`, on the Whetstone carried-affordance shape), a remedy (an
  `antivenin` Material + vial the kernel's `dose` reads), and Aldis's
  `nurses` brain — the physician who practises, triaging the room and
  dressing or tending through the same body primitives a player uses.

  ⭐ The line it holds: competence buys what you can SEE, never what you
  can DO. An untrained eye knows something is wrong; a novice reads the
  signs; a competent medic knows which conditions could produce them —
  PLURAL and UNRANKED, because that ambiguity is what makes the medic's
  choice a choice; a proficient one knows what would treat it and how it
  spreads; an expert reads how far it has gone. A better medic SETS a bone
  more cleanly and OPERATES with a steadier hand (careQuality), but the
  diagnosis is still the choice, never the engine's.

  ⚠ It ships no venue. A clinic is rows — a business, a room, a tariff,
  a cot — in whatever locality wants one, which is the second-instance
  test: a second clinic needs ZERO pack code.
requires:
  # The trade is placeless (economic bootstrap D6/D7): its mechanism is
  # held by the Ministry of Trade — a seat, never a committee. Its
  # premises, if any, sit in the world under a locality's committee.
  title:
    - { extent: /trade/medicine, holder: { organization: /compact/trade } }
