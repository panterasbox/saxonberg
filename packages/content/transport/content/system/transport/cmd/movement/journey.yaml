# journey — order a trip along a lane, and read how it is going.
#
# Afforded by CONTENT: a rig, a barge or a coach contributes this view to
# whoever is standing beside it or riding in it. There is no core mixin
# that grants it, which is what lets a second realm ship a second kind of
# cart with zero pack code.
#
# ⚠ Deliberately NOT `drive` and NOT `ride`. `drive` is taken twice over
# — the kernel's one-leg passthrough, and trade-mining's "drive a heading"
# — and `ride` means STEER YOUR MOUNT, not "be a passenger". Overloading
# either is how a live dispatch bug gets shipped.
#
# ⚠ There is no `journey stop`: stopping is the shipped `cancel`.
verbs: [journey]
controller: /system/transport/idea/cmd/movement/JourneyController
description: "Take a vehicle along a lane to somewhere, or read the trip you are on."
help: |
  Order a trip, or read the one you are on.

    journey to the crossroads
    journey to crossroads via spine
    journey

  ⭐ Name a STOP ON THE ROADS FROM HERE — the places this road actually
  goes, by the name on the map ("the crossroads", "last water"). Name
  something the roads from here do not reach and the refusal lists what
  they do, so you never have to guess. (A durable path works too, and so
  does anything you can point at.)

  Naming a place plans the route and sets off. The vehicle is really in
  every room it passes through, so a busy road looks busy — and so
  somebody can be waiting on it.

  Your HANDS are on the reins for the whole trip: you cannot fight while
  you are driving, which is why a valuable load travels with an escort.
  Passengers hold nothing at all — they board with `go <vehicle>` and get
  off with `out`, and if the vehicle is open they watch the road go by.

  Bare `journey` reads the trip: where you are, how far is left, and
  roughly how long. A blocked road stops you where you stand — the
  journey does not find a way around, because that would hide the
  geography. Re-issue when the way is clear.

  To stop early, `cancel`.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: destination
    type: string
    required: false
    greedy: true
    prepositions: [to]
  # ⚠ An ARG with a preposition, not an option. `journey to the depot via
  # spine` reads the way somebody would say it — and the greedy
  # destination swallows everything up to the next preposition, so a
  # bare `via` with nothing to bind it to is a parse error ("unexpected
  # bareword 'via' after query"). Found by driving, on a help example
  # this file was already advertising.
  - name: via
    type: string
    required: false
    prepositions: [via]
