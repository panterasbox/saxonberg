# `launch` — put the boat you are sitting in over the side (maritime).
# Afforded from inside a `Boat`; you are then wherever the boat is.
verbs: [launch]
controller: /system/transport/idea/cmd/movement/LaunchController
description: "Put the boat you are sitting in over the side"
help: |
  Sitting in a boat out of the water — on a bank, a landing, a ship's
  deck — `launch` puts her in the water beside you, and you in her: at a
  riverbank she floats at the edge (`paddle` pushes off); from a ship
  stopped at sea she goes into the water alongside. `recover` takes her
  back out, onto a bank within hail or the deck of a ship alongside.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
