# A setting pole (the river build, D20, D24) — a punt's: pushes off the
# bottom, so it needs one it can reach; in shallow water there is nothing
# stronger.
class: /system/transport/thing/Propulsion
data:
  shortDescription: setting pole
  keywords: [pole, "setting pole", quant]
  register: indefinite
  longDescription: Twelve feet of ash with an iron shoe on the foot, for pushing a boat off the river bed.
  _materialPath: /stuff/idea/material/wood/ash
  mass: 4
  propulsionKind: pole
  needs: bottom
  crewPowered: true
  efficiency: 0.5
  reachM: 2.5
  # ⭐ Its size (size and carrying drive, step 8): twelve feet of ash is a
  # ROD 3.66 m long. With no box its 4 kg derived to a small cube, so the
  # length rule (`Carrying.handsFor`) never saw it and a person could hold
  # it in one hand beside a lantern. A pole longer than you are tall takes
  # both hands; it is rows like this the arms audit (W6-h) fixed.
  shape: rod
  dimensions: { width: 0.045, depth: 0.045, height: 3.66 }
