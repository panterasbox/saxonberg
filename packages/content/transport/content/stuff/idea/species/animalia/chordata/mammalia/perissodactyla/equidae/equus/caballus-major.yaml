# Equus caballus major — the draft horse. Tall, heavy-boned, deliberate,
# and bred for one number.
#
# ⭐ That number is `mass: 700`, and it is the whole of the animal's
# haulage advantage: carry capacity derives from body mass in the shipped
# encumbrance substrate, so a wagon's draft load sits at a fraction of
# the ratio a person would bear. Nothing in this pack computes it.
#
# It ships in the transport pack rather than the species commons for the
# reason the pit pony ships in the mining trade: a draft animal is a need
# every ROAD has, and the functional half of an ecology belongs with the
# system that needs it. A realm's own beasts belong to the realm.
class: /platform/idea/species/Species
hydratorClass: /platform/idea/persistence/PersistentHydrator
