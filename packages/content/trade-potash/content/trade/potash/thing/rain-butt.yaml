# A rain butt — ⭐ the soft water an ashery wants (potash D16). A lye made
# with rain is stronger than one made with river water, because hard water
# spends some of the ash's alkali on its own lime before any of it reaches
# the lye: where your water comes from is a thing an ash-burner knows.
# ⭐ A rain STORE (water-supply D5): the gutter fills it from the lean-to's
# roof. Staged (D30): its level derives from the sky.
class: /platform/thing/WaterStore
data:
  shortDescription: rain butt
  keywords: ["rain butt", butt, barrel, rainwater, water]
  register: indefinite
  longDescription: >-
    A tarred barrel under the eaves of the lean-to, fed by a wooden gutter
    and brimming with rainwater the colour of weak tea.
  interiorBulk: true
  interiorMaterial: /stuff/idea/material/bulk/water
  interiorCapacity: 220
  initialLevelL: 200
  fillsFrom: rain
  catchmentM2: 10
  # Rain: about as soft as water comes.
  hardnessDgh: 1
  fixedInPlace: true
  mass: 220
  _materialPath: /stuff/idea/material/wood/oak
