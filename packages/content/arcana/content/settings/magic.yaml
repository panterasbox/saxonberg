# magic — application settings shipped by the platform pack (the
# `settings` kind: merge-missing — a key the app_settings singleton lacks is
# merged in; a value the operator changed via `config` is never touched).
settings:
  # How far a working reaches by default. `far` means "anywhere in the
  # scene", which is what every shipped spell already did — the band gate
  # only bites for a carrier that declares a tighter envelope (a thrown
  # contact payload reaches `close`).
  - key: magic.spellEnvelope
    value: "far"

  # Magic (casting core) — see docs/subsystems/magic.md. SHAPE (the effect
  # union, the impulse/modifier line, the fold) is code; these are the
  # magnitudes. Mana is an absolute avail/max pool in `pt`.
  - key: magic.castSecondsDefault
    value: "3"

  - key: magic.costDefault
    value: "15"

  - key: magic.abortCostFraction
    value: "0"

  - key: magic.depthCapacity.low
    value: "80"

  - key: magic.depthCapacity.mid
    value: "120"

  - key: magic.depthCapacity.high
    value: "180"

  - key: magic.recoveryPerMinBase
    value: "1.5"

  - key: magic.serenityFactor.low
    value: "0.6"

  - key: magic.serenityFactor.mid
    value: "1"

  - key: magic.serenityFactor.high
    value: "1.6"

  - key: magic.composureBase.low
    value: "0.7"

  - key: magic.composureBase.mid
    value: "1"

  - key: magic.composureBase.high
    value: "1.4"

  - key: magic.composure.floorFactor
    value: "0.4"

  - key: magic.potency.competenceFactor
    value: "0.25"

  - key: magic.overchannel.severityPerDeficit
    value: "0.1"

  - key: magic.overchannel.clearThreshold
    value: "0.5"

  - key: magic.dread.decayPerSec
    value: "0.005"

  - key: magic.glowlight.lumens
    value: "500"

  - key: magic.conjure.waterLitres
    value: "1"
