# Biped — two legs, two prehensile hands, upright. Shared by humans,
# dwarves, elves, orcs, halflings. Sensory anatomy: two frontal eyes,
# two lateral ears, one forward nose. Capability variance lives on
# species, not here.
class: /platform/idea/species/BodyPlan
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: biped
  # Whole-body default mass (kg). A Creature of this plan seeds its
  # getMass() from this unless the instance authors its own mass. Shared
  # body-size signal (encumbrance carry capacity now; metabolism basal
  # drain + thermal mass later) — see docs/subsystems/encumbrance.md.
  baseMass: 70
  # The plan's reference stature (m), beside its reference mass — the
  # linear half of the fit measurement. Every species that authors none
  # inherits this; the ten playable ones all override.
  baseStature: 1.75
  # Slots reference anatomy where they have a home (the slot↔part
  # relations live on the slot side): `bodyPart` = the part the slot
  # attaches at (lose it → slot disabled); `covers` = parts an occupant
  # protects (coverage relation, for armor / hit-location — no consumer
  # yet). Multi-part wear slots (legs/feet/hands) have no single
  # `bodyPart`; the cranial bay and neck attach at a part but cover
  # nothing. See docs/subsystems/vitals.md.
  # ⚠⚠ The covering slots carry `capacity: 4`, and without it LAYERING
  # IS IMPOSSIBLE. Every wear slot defaulted to capacity 1, so a body
  # could hold exactly one torso garment — the shipped gambeson and the
  # shipped hauberk could never be worn together, and the whole
  # outside-in covering model (the resist fold, the ladder, per-part
  # insulation) had nothing to walk. Four is a real historical stack:
  # shirt, gambeson, mail, surcoat.
  #
  # It is a CAP rather than unbounded because "wear forty shirts" would
  # otherwise be free insulation; the ladder decides the ORDER, and this
  # decides how deep it can get.
  slots:
    - { name: head,           accepts: WearableMixin, capacity: 4, covers: [body.head] }
    - { name: torso,          accepts: WearableMixin, capacity: 4, covers: [body.torso] }
    - { name: legs,           accepts: WearableMixin, capacity: 4, covers: [body.leg.left, body.leg.right] }
    - { name: feet,           accepts: WearableMixin, capacity: 4, covers: [body.leg.left.foot, body.leg.right.foot] }
    - { name: hands,          accepts: WearableMixin, capacity: 4, covers: [body.arm.left.hand, body.arm.right.hand] }
    - { name: 'finger:left',  accepts: WearableMixin, bodyPart: body.arm.left.hand }
    - { name: 'finger:right', accepts: WearableMixin, bodyPart: body.arm.right.hand }
    - { name: neck,           accepts: WearableMixin }
    - { name: 'hand:left',    accepts: WieldableMixin, bodyPart: body.arm.left.hand }
    - { name: 'hand:right',   accepts: WieldableMixin, bodyPart: body.arm.right.hand }
    # Belt sheath — a carry slot for a sheathed sidearm (the disarm answer:
    # `fight draw` fast-switches a weapon from here into a grip). Accepts the
    # broad SlottableMixin so a weapon can be sheathed here without claiming
    # it as a wield slot. See docs/subsystems/combat.md (hand-slot economy).
    - { name: 'sidearm',      accepts: SlottableMixin }
    # Cranial implant slot — accepts SlottableMixin (the broad
    # interface every augment composes). The "implant" semantic
    # lives in the slot's name and the augment's targetSlot field,
    # not in the validator enum. See docs/subsystems/augmentation.md.
    - { name: cranial,        accepts: SlottableMixin, bodyPart: body.head }
  locomotionModes:
    - walk
    - climb
    - swim
  defaultLocomotionMode: walk
  sensoryPorts:
    - { modality: vision, count: 2, position: frontal }
    - { modality: hearing, count: 2, position: lateral }
    - { modality: smell, count: 1, position: forward }
    # ⚠ Touch and taste were MISSING, and their absence was silent: the
    # `feel` and `taste` verbs ship, their `requiresTouch`/`requiresTaste`
    # validators ship, the modality singletons ship — and no body plan
    # granted either, so every character in the world got "You can't feel
    # anything." forever. A live drive found it going after the libations
    # plan's own acceptance check ("a G&T colder than the rail — `feel`").
    #
    # Skin is `circumferential` (all around); the tongue is `forward`.
    - { modality: touch, count: 1, position: circumferential }
    - { modality: taste, count: 1, position: forward }
  # Typed anatomy (Vitals substrate). Sixteen parts: limbs / head / torso,
  # plus brain / spine ×2 / heart / lungs / liver. Tissue masses (kg) are
  # the strength substrate AND the depth ladder's ordering; stable body.*
  # keys are the trauma-site anchor.
  #
  # ⭐⭐ Two relations point at the capacity vocabulary and they are NOT
  # interchangeable:
  #   `governs` — this organ RUNS the thing. One brain, so consciousness is
  #     the MIN over what governs it: lose the brain, lose the capacity.
  #     Also makes the part INTERIOR.
  #   `serves`  — this limb is FOR the thing. Two legs, so locomotion is
  #     the MEAN over what serves it: one leg gone is a hobble, not a halt.
  #     Does NOT make the part interior — a hand has to be coverable.
  # Plus `innervatedBy` / `suppliedBy`, authored only where the supply path
  # DIVERGES from the tree (for a limb, the parent chain already is it).
  bodyParts:
    - key: body.torso
      parent: null
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/bone, mass: 8 }
        - { tissuePath: /stuff/idea/material/tissue/muscle, mass: 12 }
        - { tissuePath: /stuff/idea/material/tissue/flesh, mass: 20 }
    - key: body.head
      parent: body.torso
      severable: true
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/bone, mass: 1 }
        - { tissuePath: /stuff/idea/material/tissue/flesh, mass: 4 }
    - key: body.arm.left
      parent: body.torso
      severable: true
      # The arm hangs off the torso structurally, but its CONTROL comes
      # down the upper spine — cut the spine and the arm is dead without
      # anything touching the arm.
      innervatedBy: [body.torso.spine.upper]
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/bone, mass: 1.5 }
        - { tissuePath: /stuff/idea/material/tissue/muscle, mass: 3 }
        - { tissuePath: /stuff/idea/material/tissue/flesh, mass: 1 }
    - key: body.arm.left.hand
      parent: body.arm.left
      severable: true
      # ⭐ What the hand is FOR. `serves`, not `governs`: a hand that
      # GOVERNED manipulation would be an internal organ, silently dropped
      # from every covering and insulation walk. Two hands, so the capacity
      # is their MEAN — losing one costs you half, not all.
      serves: [manipulation]
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/bone, mass: 0.4 }
        - { tissuePath: /stuff/idea/material/tissue/muscle, mass: 0.3 }
        - { tissuePath: /stuff/idea/material/tissue/flesh, mass: 0.3 }
    - key: body.arm.right
      parent: body.torso
      severable: true
      innervatedBy: [body.torso.spine.upper]
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/bone, mass: 1.5 }
        - { tissuePath: /stuff/idea/material/tissue/muscle, mass: 3 }
        - { tissuePath: /stuff/idea/material/tissue/flesh, mass: 1 }
    - key: body.arm.right.hand
      parent: body.arm.right
      severable: true
      serves: [manipulation]
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/bone, mass: 0.4 }
        - { tissuePath: /stuff/idea/material/tissue/muscle, mass: 0.3 }
        - { tissuePath: /stuff/idea/material/tissue/flesh, mass: 0.3 }
    - key: body.leg.left
      parent: body.torso
      severable: true
      serves: [locomotion]
      innervatedBy: [body.torso.spine.lower]
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/bone, mass: 4 }
        - { tissuePath: /stuff/idea/material/tissue/muscle, mass: 8 }
        - { tissuePath: /stuff/idea/material/tissue/flesh, mass: 3 }
    - key: body.leg.left.foot
      parent: body.leg.left
      severable: true
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/bone, mass: 0.8 }
        - { tissuePath: /stuff/idea/material/tissue/muscle, mass: 0.5 }
        - { tissuePath: /stuff/idea/material/tissue/flesh, mass: 0.5 }
    - key: body.leg.right
      parent: body.torso
      severable: true
      serves: [locomotion]
      innervatedBy: [body.torso.spine.lower]
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/bone, mass: 4 }
        - { tissuePath: /stuff/idea/material/tissue/muscle, mass: 8 }
        - { tissuePath: /stuff/idea/material/tissue/flesh, mass: 3 }
    - key: body.leg.right.foot
      parent: body.leg.right
      severable: true
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/bone, mass: 0.8 }
        - { tissuePath: /stuff/idea/material/tissue/muscle, mass: 0.5 }
        - { tissuePath: /stuff/idea/material/tissue/flesh, mass: 0.5 }
    - key: body.torso.heart
      parent: body.torso
      governs: [heartRate, circulation]
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/muscle, mass: 0.3 }
    - key: body.torso.lungs
      parent: body.torso
      governs: [respiratoryRate, respiration]
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/flesh, mass: 1 }
    # ⭐⭐ The four organs that make anatomy mean something. Each is
    # INTERIOR (it governs, or something's supply runs through it), so none
    # is covered by a garment, none appears in the surface-fraction walk,
    # and none can be dressed with a bandage — which is exactly the point.
    #
    # ⚠ Masses are real and load-bearing: the depth ladder reaches the
    # largest CROSS-SECTION first (Meeh's `mass^(2/3)`), so a torso wound
    # deep enough to reach something finds the liver before the heart.
    # These are the numbers an author tunes to change that.
    - key: body.head.brain
      parent: body.head
      governs: [consciousness]
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/flesh, mass: 1.3 }
    # ⭐ The spine governs NOTHING and is interior anyway — the arms and
    # legs name it in `innervatedBy`, and a conduit is inside you. This is
    # the case that made interiority a method instead of a field read.
    - key: body.torso.spine.upper
      parent: body.torso
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/bone, mass: 0.6 }
    - key: body.torso.spine.lower
      parent: body.torso.spine.upper
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/bone, mass: 0.5 }
    # The pharma seam: `clearance` has a read and an `assess` line this
    # build; scaling toxin clearance by it is the next one's.
    - key: body.torso.liver
      parent: body.torso
      governs: [clearance]
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/flesh, mass: 1.5 }
