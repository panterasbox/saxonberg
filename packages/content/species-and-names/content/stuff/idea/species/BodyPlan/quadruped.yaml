# Quadruped — four legs, no prehensile hands. Shared by typical
# mammals (dogs, cats, horses) and amphibians (frogs use this too in
# v1; an `amphibian-quadruped` variant lands later if frogs need a
# distinct one). The `back:1` slot accepts any Slottable — saddles
# claim it via Wearable's slot claim, riders occupy it bareback.
class: /platform/idea/species/BodyPlan
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: quadruped
  # Slots reference anatomy via `bodyPart` / `covers` where they have a
  # home. `back:1` (the saddle/rider surface) deliberately has neither —
  # it's a non-anatomical surface affordance, the case that keeps slots a
  # distinct axis rather than something anatomy owns.
  slots:
    # Capacity 4, the biped's reason: a covering slot that holds one
    # thing cannot layer, and the covering stack has nothing to walk.
    - { name: head,    accepts: WearableMixin, capacity: 4, covers: [body.head] }
    - { name: collar,  accepts: WearableMixin }
    - { name: 'back:1', accepts: SlottableMixin, userFacingDetail: back }
    # Cranial implant slot — parallel to biped. See augmentation
    # subsystem doc; sessile body plans deliberately omit this slot
    # (plants don't get implants in v1).
    - { name: cranial, accepts: SlottableMixin, bodyPart: body.head }
  locomotionModes:
    - walk
    - swim
  defaultLocomotionMode: walk
  sensoryPorts:
    - { modality: vision, count: 2, position: frontal }
    - { modality: hearing, count: 2, position: lateral }
    - { modality: smell, count: 1, position: forward }
    # ⚠ Touch and taste were MISSING, and their absence was silent: the
    # `feel` and `taste` verbs ship, their `requiresTouch`/`requiresTaste`
    # validators ship, the modality singletons ship — and no body plan
    # granted either, so every character in the world got "You can't feel
    # anything." forever. A live drive found it going after the libations
    # plan's own acceptance check ("a G&T colder than the rail — `feel`").
    #
    # Skin is `circumferential` (all around); the tongue is `forward`.
    - { modality: touch, count: 1, position: circumferential }
    - { modality: taste, count: 1, position: forward }
  # Typed anatomy (Vitals substrate). Four legs, no prehensile hands, so
  # nothing `serves: [manipulation]` — a wolf has no `manipulation` capacity
  # and reads `full` for it, which is the honest answer for a body that
  # never had one (the absence is data, not a guard).
  #
  # ⭐ The same organ roster as the biped — brain / spine ×2 / heart /
  # lungs / liver — because a wolf is an animal with the same insides. All
  # four legs innervate off the LOWER spine: a quadruped's forelimbs are
  # legs, not arms, and the tree says so.
  bodyParts:
    - key: body.torso
      parent: null
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/bone, mass: 6 }
        - { tissuePath: /stuff/idea/material/tissue/muscle, mass: 10 }
        - { tissuePath: /stuff/idea/material/tissue/flesh, mass: 12 }
    - key: body.head
      parent: body.torso
      severable: true
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/bone, mass: 0.8 }
        - { tissuePath: /stuff/idea/material/tissue/flesh, mass: 2 }
    - key: body.leg.frontLeft
      parent: body.torso
      severable: true
      serves: [locomotion]
      innervatedBy: [body.torso.spine.lower]
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/bone, mass: 1 }
        - { tissuePath: /stuff/idea/material/tissue/muscle, mass: 2 }
        - { tissuePath: /stuff/idea/material/tissue/flesh, mass: 1 }
    - key: body.leg.frontRight
      parent: body.torso
      severable: true
      serves: [locomotion]
      innervatedBy: [body.torso.spine.lower]
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/bone, mass: 1 }
        - { tissuePath: /stuff/idea/material/tissue/muscle, mass: 2 }
        - { tissuePath: /stuff/idea/material/tissue/flesh, mass: 1 }
    - key: body.leg.rearLeft
      parent: body.torso
      severable: true
      serves: [locomotion]
      innervatedBy: [body.torso.spine.lower]
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/bone, mass: 1.2 }
        - { tissuePath: /stuff/idea/material/tissue/muscle, mass: 2.5 }
        - { tissuePath: /stuff/idea/material/tissue/flesh, mass: 1 }
    - key: body.leg.rearRight
      parent: body.torso
      severable: true
      serves: [locomotion]
      innervatedBy: [body.torso.spine.lower]
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/bone, mass: 1.2 }
        - { tissuePath: /stuff/idea/material/tissue/muscle, mass: 2.5 }
        - { tissuePath: /stuff/idea/material/tissue/flesh, mass: 1 }
    - key: body.torso.heart
      parent: body.torso
      governs: [heartRate, circulation]
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/muscle, mass: 0.1 }
    - key: body.torso.lungs
      parent: body.torso
      governs: [respiratoryRate, respiration]
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/flesh, mass: 0.5 }
    - key: body.head.brain
      parent: body.head
      governs: [consciousness]
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/flesh, mass: 0.15 }
    - key: body.torso.spine.upper
      parent: body.torso
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/bone, mass: 0.3 }
    - key: body.torso.spine.lower
      parent: body.torso.spine.upper
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/bone, mass: 0.25 }
    - key: body.torso.liver
      parent: body.torso
      governs: [clearance]
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/flesh, mass: 0.6 }
