# Homo periannath — fantasy halfling. Same biped anatomy as sapiens,
# scaled small; vision and lifespan stay close to human (~150 years).
# Quick, comfortable, fond of a good meal and a warm hole.
class: /platform/idea/species/Species
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  illustration: species/periannath.png
  binomial: Homo periannath
  sentient: true
  commonNames: ["halfling"]
  _bodyPlanPath: /stuff/idea/species/BodyPlan/biped
  # ── Size (textiles A4). Overrides the plan's 70 kg / 1.75 m; `0`
  # would inherit. ⭐ The fiction — *small, fond of a good meal* — FALLS OUT of the
  # arithmetic rather than being asserted: girth = √(mass/stature)
  # = 6.02 against the human's 6.32, so this one is near-human girth at 60% of the height, which is exactly what separates a halfling from a gnome.
  # ⚠ Paid for, deliberately: mass drives carry capacity, basal
  # drain, thermal mass and the mass-scaled fist alike. Do not
  # 'balance' the cost away — incomparability is the point.
  baseMass: 38
  stature: 1.05
  # Fisticuffs (the bar-fight build): the humanoid innate — a
  # mass-scaled blunt fist, so a disarmed or unarmed person can still
  # brawl and a heavier build hits harder. Rides the same
  # materials-response funnel as any blunt blow.
  naturalAttacks:
    - key: fist
      channel: blunt
      massScaled: true
  _parentCladePath: /stuff/idea/species/animalia
  _defaultMaterialPath: /stuff/idea/material/tissue/flesh
  innateMixins: ["CasterMixin"]
  vitalProfile:
    coreTemperature: { baseline: 310, survivableMin: 301, survivableMax: 315 }
    heartRate: { baseline: 70, survivableMin: 30, survivableMax: 220 }
    respiratoryRate: { baseline: 16, survivableMin: 6, survivableMax: 40 }
    bloodPressureSystolic: { baseline: 120, survivableMin: 70, survivableMax: 200 }
    bloodPressureDiastolic: { baseline: 80, survivableMin: 40, survivableMax: 130 }
    spo2: { baseline: 98, survivableMin: 70, survivableMax: 100 }
    bloodVolume: { baseline: 5, survivableMin: 3.2, survivableMax: 5 }
  lifecycleStates: ["alive", "dead", "undead"]
  sexDeterminationSystem: dioecious
  reproductiveMode: sexual
  lifespanMin: 0
  lifespanMax: 150
  circadianBand: diurnal
  diet: omnivore
  visionProfile:
    scotopicMin: pitch-black
    photopicMax: blinding
    bandShift: 0
  olfactoryProfile:
    acuity: normal
  longDescription: >-
    A small, soft-cheeked figure barely waist-high to a tall folk, with
    quick bright eyes, nimble bare feet, and the easy, well-fed comfort
    of someone never far from a warm hearth.
  nameBankKeys: ["halfling"]
  facultyProfile: { depth: low, serenity: mid, composure: high }
