# Lithobates catesbeianus — American bullfrog. Quadruped amphibian,
# short lifespan, mostly nocturnal. The non-mammal acceptance entry.
class: /platform/idea/species/Species
data:
  binomial: Lithobates catesbeianus
  commonNames: ["bullfrog", "frog"]
  _bodyPlanPath: /stuff/idea/species/BodyPlan/quadruped
  # ⭐ Adult liveweight in kg. A grown bullfrog, which is a heavy frog and still half a kilo.
  adultMass: 0.5
  _parentCladePath: /stuff/idea/species/animalia
  _defaultMaterialPath: /stuff/idea/material/tissue/flesh
  vitalProfile:
    coreTemperature: { baseline: 293, survivableMin: 278, survivableMax: 305 }
    heartRate: { baseline: 50, survivableMin: 5, survivableMax: 120 }
    respiratoryRate: { baseline: 40, survivableMin: 5, survivableMax: 120 }
    bloodPressureSystolic: { baseline: 30, survivableMin: 15, survivableMax: 60 }
    bloodPressureDiastolic: { baseline: 20, survivableMin: 8, survivableMax: 40 }
    spo2: { baseline: 95, survivableMin: 50, survivableMax: 100 }
    bloodVolume: { baseline: 0.03, survivableMin: 0.018, survivableMax: 0.03 }
  # ⭐ How a frog breathes, by stage (underwater D21): a tadpole on gills,
  # a froglet on gills and new lungs, the adult on lungs — and its skin,
  # which takes three-quarters of what it needs from the water, so it stays
  # under four times as long as its breath alone would let it, and still
  # has to come up.
  breathingByStage:
    newborn:
      - { medium: water, apparatus: gills, intake: 1 }
    juvenile:
      - { medium: water, apparatus: gills, intake: 0.6 }
      - { medium: air, apparatus: lungs, intake: 0.6 }
    adult:
      - { medium: air, apparatus: lungs, intake: 1 }
      - { medium: water, apparatus: skin, intake: 0.75 }
    aged:
      - { medium: air, apparatus: lungs, intake: 1 }
      - { medium: water, apparatus: skin, intake: 0.75 }
  # ⭐ What water a tadpole needs (underwater D21): fresh, and not foul — the
  # adult has its lungs and the bank; the tadpole has only the water.
  habitatByStage:
    newborn:
      role: forage
      tolerances:
        salinityPpt: { max: 2, margin: 3 }
        oxygenMgL: { min: 4, margin: 2 }
  lifecycleStates: ["alive", "dead"]
  sexDeterminationSystem: xy
  reproductiveMode: sexual
  lifespanMin: 0
  lifespanMax: 8
  circadianBand: nocturnal
  diet: carnivore
  visionProfile:
    scotopicMin: pitch-black
    photopicMax: bright
    bandShift: 0
