# Homo orcus — fantasy orc (the full orc, beside the half-orc semiorcus).
# Same biped anatomy as sapiens, built broad and powerful; a keen nose and
# low-light eyes, short and intense of life. Playable. See
# docs/slates/builds/species-expansion-slate.md.
class: /platform/idea/species/Species
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  illustration: species/orcus.png
  binomial: Homo orcus
  sentient: true
  commonNames: ["orc"]
  _bodyPlanPath: /stuff/idea/species/BodyPlan/biped
  # ── Size (textiles A4). Overrides the plan's 70 kg / 1.75 m; `0`
  # would inherit. ⭐ The fiction — *broad and fierce, short-lived* — FALLS OUT of the
  # arithmetic rather than being asserted: girth = √(mass/stature)
  # = 7.22 against the human's 6.32, so this one is the heaviest build short of the dragonborn.
  # ⚠ Paid for, deliberately: mass drives carry capacity, basal
  # drain, thermal mass and the mass-scaled fist alike. Do not
  # 'balance' the cost away — incomparability is the point.
  baseMass: 100
  stature: 1.92
  # Fisticuffs (the bar-fight build): the humanoid innate — a
  # mass-scaled blunt fist, so a disarmed or unarmed person can still
  # brawl and a heavier build hits harder. Rides the same
  # materials-response funnel as any blunt blow.
  naturalAttacks:
    - key: fist
      channel: blunt
      massScaled: true
  _parentCladePath: /stuff/idea/species/animalia
  _defaultMaterialPath: /stuff/idea/material/tissue/flesh
  innateMixins: ["CasterMixin"]
  vitalProfile:
    coreTemperature: { baseline: 310, survivableMin: 301, survivableMax: 316 }
    heartRate: { baseline: 64, survivableMin: 28, survivableMax: 210 }
    respiratoryRate: { baseline: 15, survivableMin: 5, survivableMax: 40 }
    bloodPressureSystolic: { baseline: 122, survivableMin: 72, survivableMax: 200 }
    bloodPressureDiastolic: { baseline: 82, survivableMin: 42, survivableMax: 130 }
    spo2: { baseline: 98, survivableMin: 70, survivableMax: 100 }
    bloodVolume: { baseline: 6, survivableMin: 3.9, survivableMax: 6 }
  lifecycleStates: ["alive", "dead", "undead"]
  sexDeterminationSystem: dioecious
  reproductiveMode: sexual
  lifespanMin: 0
  lifespanMax: 60
  circadianBand: crepuscular
  diet: omnivore
  visionProfile:
    scotopicMin: very-dim
    photopicMax: bright
    bandShift: -1
  olfactoryProfile:
    acuity: keen
  longDescription: >-
    A broad, heavy-shouldered figure well over the common height,
    green-grey of skin with a jutting jaw and prominent tusks, fierce-eyed
    and restless, with a keen nose that reads a room before the eyes do.
  nameBankKeys: ["orcish"]
  facultyProfile: { depth: low, serenity: mid, composure: low }
