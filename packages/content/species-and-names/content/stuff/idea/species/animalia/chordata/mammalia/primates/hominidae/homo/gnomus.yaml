# Homo gnomus — fantasy gnome. Same biped anatomy as sapiens, small and
# wiry; a subterranean tinker-folk (the NetHack Mines) with keen low-light
# eyes and a long, inquisitive life. Playable. See
# docs/slates/builds/species-expansion-slate.md.
class: /platform/idea/species/Species
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  illustration: species/gnomus.png
  binomial: Homo gnomus
  sentient: true
  commonNames: ["gnome"]
  _bodyPlanPath: /stuff/idea/species/BodyPlan/biped
  # ── Size (textiles A4). Overrides the plan's 70 kg / 1.75 m; `0`
  # would inherit. ⭐ The fiction — *small, wiry* — FALLS OUT of the
  # arithmetic rather than being asserted: girth = √(mass/stature)
  # = 5.48 against the human's 6.32, so this one is the LOWEST girth of anyone — wiry is a number here, not an adjective.
  # ⚠ Paid for, deliberately: mass drives carry capacity, basal
  # drain, thermal mass and the mass-scaled fist alike. Do not
  # 'balance' the cost away — incomparability is the point.
  baseMass: 30
  stature: 1.0
  # Fisticuffs (the bar-fight build): the humanoid innate — a
  # mass-scaled blunt fist, so a disarmed or unarmed person can still
  # brawl and a heavier build hits harder. Rides the same
  # materials-response funnel as any blunt blow.
  naturalAttacks:
    - key: fist
      channel: blunt
      massScaled: true
  _parentCladePath: /stuff/idea/species/animalia
  _defaultMaterialPath: /stuff/idea/material/tissue/flesh
  innateMixins: ["CasterMixin"]
  vitalProfile:
    coreTemperature: { baseline: 310, survivableMin: 301, survivableMax: 315 }
    heartRate: { baseline: 80, survivableMin: 35, survivableMax: 230 }
    respiratoryRate: { baseline: 18, survivableMin: 7, survivableMax: 42 }
    bloodPressureSystolic: { baseline: 118, survivableMin: 68, survivableMax: 200 }
    bloodPressureDiastolic: { baseline: 78, survivableMin: 38, survivableMax: 130 }
    spo2: { baseline: 98, survivableMin: 70, survivableMax: 100 }
    bloodVolume: { baseline: 4, survivableMin: 2.6, survivableMax: 4 }
  lifecycleStates: ["alive", "dead", "undead"]
  sexDeterminationSystem: xy
  reproductiveMode: sexual
  lifespanMin: 0
  lifespanMax: 350
  circadianBand: crepuscular
  diet: omnivore
  visionProfile:
    scotopicMin: very-dim
    photopicMax: bright
    bandShift: -1
  olfactoryProfile:
    acuity: normal
  longDescription: >-
    A small, wiry figure barely waist-high, bright-eyed and quick-fingered,
    with the restless, tinkering attention of someone forever halfway
    through taking something apart to see how it works.
  nameBankKeys: ["gnomish"]
  facultyProfile: { depth: low, serenity: high, composure: mid }
