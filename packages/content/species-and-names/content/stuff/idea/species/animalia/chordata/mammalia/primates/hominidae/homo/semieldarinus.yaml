# Homo semieldarinus — fantasy half-elf. Same biped anatomy as sapiens;
# split the difference between human and elf — a mild low-light edge and
# a stretched (but mortal) lifespan, at home in neither world fully.
# Playable. See docs/slates/builds/species-expansion-slate.md.
class: /platform/idea/species/Species
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  illustration: species/semieldarinus.png
  binomial: Homo semieldarinus
  sentient: true
  commonNames: ["half-elf"]
  _bodyPlanPath: /stuff/idea/species/BodyPlan/biped
  _parentCladePath: /stuff/idea/species/animalia
  _defaultMaterialPath: /stuff/idea/material/tissue/flesh
