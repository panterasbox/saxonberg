# Homo ogrus — fantasy ogre. Same biped anatomy as sapiens, built
# enormous and slow; the dim-or-gentle heavy, distinct from the disciplined
# troll. NPC-first. The "dumb brute" framing is persona, played mundane —
# not a species law. See docs/slates/builds/species-expansion-slate.md.
