# The hog — the meat animal, and the first thing a cook learns to take
# apart. A quadruped omnivore of kingdom Animalia; emphatically not
# sentient (the cull path — a hog is stock, and the game says so plainly).
#
# ⭐ It ships mostly so that **butchering is learnable without hunting
# first**. A carcass hanging in the Hearthworks cookhouse is a hog, and a
# cook who has never held a bow can still find out what a knife does to
# one — which is how the trade actually works.
class: /platform/idea/species/Species
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  binomial: Sus domesticus
  commonNames: ["hog", "pig", "swine", "boar"]
  _bodyPlanPath: /stuff/idea/species/BodyPlan/quadruped
  _parentCladePath: /stuff/idea/species/animalia
  _defaultMaterialPath: /stuff/idea/material/tissue/flesh
  vitalProfile:
    coreTemperature: { baseline: 312, survivableMin: 303, survivableMax: 317 }
    heartRate: { baseline: 80, survivableMin: 35, survivableMax: 220 }
    respiratoryRate: { baseline: 16, survivableMin: 6, survivableMax: 55 }
    bloodPressureSystolic: { baseline: 130, survivableMin: 70, survivableMax: 200 }
    bloodPressureDiastolic: { baseline: 80, survivableMin: 40, survivableMax: 130 }
    spo2: { baseline: 97, survivableMin: 65, survivableMax: 100 }
    bloodVolume: { baseline: 5, survivableMin: 3, survivableMax: 5 }
  lifecycleStates: ["alive", "dead"]
  sexDeterminationSystem: xy
  reproductiveMode: sexual
  lifespanMin: 0
  lifespanMax: 15
  circadianBand: diurnal
  diet: omnivore
  visionProfile:
    scotopicMin: dim
    photopicMax: bright
    bandShift: 0
  longDescription: >-
    A heavy-shouldered hog, bristled and blunt-snouted, with the small
    unbothered eye of an animal that has never had to be clever about
    anything except food.
  nameBankKeys: []
  # ⭐ A hog is a great deal of meat, and that is the whole point of one:
  # eight cuts off a clean job is far more than one sitting, which is what
  # turns preservation from a curiosity into a decision.
  butcheryYield:
    - { cut: /stuff/thing/items/stew-meat, units: 6 }
    - { cut: /stuff/thing/items/prime-cut, units: 2 }
