# torso-fowl — a body module (organism-biology D1): a subtree of parts with
# relative keys ('' is the instance's own key) and tissue weights.
parts:
- key: ''
  tissues:
  - {tissue: /stuff/idea/material/tissue/bone, weight: 0.1}
  - {tissue: /stuff/idea/material/tissue/muscles/breast-white, weight: 0.24}
  - {tissue: /stuff/idea/material/food/animal-fat, weight: 0.05}
  - {tissue: /stuff/idea/material/tissue/flesh, weight: 0.318}
- key: heart
  parent: ''
  governs: [heartRate]
  tissues:
  - {tissue: /stuff/idea/material/tissue/muscle, weight: 0.003}
- key: lungs
  parent: ''
  governs: [respiratoryRate]
  tissues:
  - {tissue: /stuff/idea/material/tissue/flesh, weight: 0.005}
- key: liver
  parent: ''
  governs: [clearance]
  tissues:
  - {tissue: /stuff/idea/material/tissue/flesh, weight: 0.008}
