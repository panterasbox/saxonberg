# mouth that tastes the water it grazes, no ears yet, no nose that works
# out of the water.
parts:
- key: ''
  senses: [{modality: taste, media: [water]}]
  tissues:
  - {tissue: /stuff/idea/material/tissue/cartilage, weight: 0.03}
