# torso-anuran — a frog's body (organism-biology W7): the organs of a
# quadruped's torso at a frog's proportions, and a bare, wet skin with no
# coat — an ectotherm keeps no heat to insulate. W8's metamorphosis gives
# the tadpole and the froglet their own modules beside this one.
parts:
- key: ''
  senses: [{modality: touch}]
  breathes: [{medium: water, apparatus: skin, intake: 0.75}]
  tissues:
  - {tissue: /stuff/idea/material/tissue/bone, weight: 0.05}
  - {tissue: /stuff/idea/material/tissue/flesh, weight: 0.25}
  - {tissue: /stuff/idea/material/tissue/intestine, weight: 0.03}
- key: heart
  parent: ''
  governs: [heartRate, circulation]
  tissues:
  - {tissue: /stuff/idea/material/tissue/muscle, weight: 0.003}
- key: lungs
  parent: ''
  governs: [respiratoryRate, respiration]
  breathes: [{medium: air, apparatus: lungs, intake: 1}]
  tissues:
  - {tissue: /stuff/idea/material/tissue/flesh, weight: 0.01}
- key: spine
  parent: ''
  tissues:
  - {tissue: /stuff/idea/material/tissue/bone, weight: 0.005}
- key: liver
  parent: ''
