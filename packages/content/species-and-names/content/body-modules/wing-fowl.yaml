# wing-fowl — a body module (organism-biology D1): a subtree of parts with
# relative keys ('' is the instance's own key) and tissue weights.
parts:
- key: ''
  severable: true
  tissues:
  - {tissue: /stuff/idea/material/tissue/bone, weight: 0.012}
  - {tissue: /stuff/idea/material/tissue/muscles/breast-white, weight: 0.018}
fill: sparse
integument:
  skin: {material: /stuff/idea/material/tissue/skin}
  coat: {material: /stuff/idea/material/tissue/feather, depthM: 0.015, loft: 0.9}
