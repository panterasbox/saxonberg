# torso-avian — a body module (organism-biology D1): a subtree of parts with
# relative keys ('' is the instance's own key) and tissue weights.
# ⭐ W3: two kidneys, each SUSTAINING filtration (any one suffices), their
# share taken from the torso's flesh.
