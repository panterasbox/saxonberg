- key: ''
  senses: [{modality: touch}]
  tissues:
  - {tissue: /stuff/idea/material/tissue/bone, weight: 0.1351}
  - {tissue: /stuff/idea/material/tissue/muscles/breast-red, weight: 0.2702}
  - {tissue: /stuff/idea/material/tissue/flesh, weight: 0.1777}
- key: heart
  parent: ''
  governs: [heartRate]
  tissues:
  - {tissue: /stuff/idea/material/tissue/muscle, weight: 0.0135}
- key: lungs
