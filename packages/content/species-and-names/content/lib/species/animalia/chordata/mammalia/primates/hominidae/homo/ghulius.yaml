# Homo ghulius — fantasy ghoul. Same biped anatomy as sapiens, lean and
# pallid; runs cool (at ease in the cold) with a keen nose and an
# unsentimental, reading gaze. Cast as a *living people*, mundane
# (§17.D): a death-ASSOCIATED kind of person, NOT undead — the
# "undead/unclean/they-feed-on-us" framing is slander the fiction
# refutes, never biology (lifecycleStates: alive/dead; material flesh;
# omnivore). The stigmatized death-caste allegory. See
# docs/staging/eternal-university/npcs/medical-examiner.md (Dr. Vance)
# and docs/slates/builds/species-expansion-slate.md.
class: /lib/species/Species
hydratorClass: /lib/persistence/PersistentHydrator
data:
  illustration: species/ghulius.png
  binomial: Homo ghulius
  sentient: true
  commonNames: ["ghoul"]
  _bodyPlanPath: /lib/body-plans/biped
  _parentCladePath: /lib/species/animalia
  _defaultMaterialPath: /lib/material/tissue/flesh
  innateMixins: ["CasterMixin"]
  vitalProfile:
    coreTemperature: { baseline: 305, survivableMin: 296, survivableMax: 312 }
    heartRate: { baseline: 60, survivableMin: 28, survivableMax: 210 }
    respiratoryRate: { baseline: 14, survivableMin: 5, survivableMax: 40 }
    bloodPressureSystolic: { baseline: 118, survivableMin: 68, survivableMax: 200 }
    bloodPressureDiastolic: { baseline: 78, survivableMin: 38, survivableMax: 130 }
    spo2: { baseline: 98, survivableMin: 70, survivableMax: 100 }
    bloodVolume: { baseline: 5, survivableMin: 3.2, survivableMax: 5 }
  lifecycleStates: ["alive", "dead"]
  sexDeterminationSystem: xy
  reproductiveMode: sexual
  lifespanMin: 0
  lifespanMax: 150
  circadianBand: crepuscular
  diet: omnivore
  visionProfile:
    scotopicMin: very-dim
    photopicMax: bright
    bandShift: -1
  olfactoryProfile:
    acuity: keen
  longDescription: >-
    A lean, ash-pale figure, grey-skinned and cool to the touch, with a
    still, unhurried gravity and a flat, reading gaze that misses
    nothing; plainly a person, for all that strangers flinch from the
    deathly pallor as though from the dead themselves.
  nameBankKeys: ["common"]
  facultyProfile: { depth: low, serenity: mid, composure: mid }
