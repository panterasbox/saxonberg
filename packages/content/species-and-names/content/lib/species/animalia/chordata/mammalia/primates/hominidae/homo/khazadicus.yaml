  longDescription: >-
    A short, broad-shouldered figure, thick through the chest and
    deep-rooted in stance, with the weathered, stone-patient look of
    someone bred to the dark and the deep.
  nameBankKeys: ["dwarvish"]
  facultyProfile: { depth: mid, serenity: low, composure: high }
