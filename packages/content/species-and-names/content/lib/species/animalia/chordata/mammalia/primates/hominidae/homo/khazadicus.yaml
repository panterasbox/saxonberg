# Homo khazadicus — fantasy dwarf. Same biped anatomy as sapiens; the
# vision profile shifts toward scotopic (better in low light), and the
# lifespan stretches to ~400 years. Recommended pick over Homo elvicus
# for v1 because the visual contrast against sapiens is sharper in
# composition tables.
class: /lib/species/Species
hydratorClass: /lib/persistence/PersistentHydrator
data:
  illustration: species/khazadicus.png
  binomial: Homo khazadicus
  sentient: true
  commonNames: ["dwarf"]
  _bodyPlanPath: /lib/body-plans/biped
  _parentCladePath: /lib/species/animalia
  _defaultMaterialPath: /lib/material/tissue/flesh
  innateMixins: ["CasterMixin"]
  vitalProfile:
    coreTemperature: { baseline: 310, survivableMin: 299, survivableMax: 316 }
    heartRate: { baseline: 60, survivableMin: 28, survivableMax: 210 }
    respiratoryRate: { baseline: 14, survivableMin: 5, survivableMax: 38 }
    bloodPressureSystolic: { baseline: 125, survivableMin: 70, survivableMax: 205 }
    bloodPressureDiastolic: { baseline: 82, survivableMin: 40, survivableMax: 135 }
    spo2: { baseline: 98, survivableMin: 68, survivableMax: 100 }
    bloodVolume: { baseline: 5.5, survivableMin: 3.6, survivableMax: 5.5 }
  lifecycleStates: ["alive", "dead", "undead"]
  sexDeterminationSystem: xy
  reproductiveMode: sexual
  lifespanMin: 0
  lifespanMax: 400
  circadianBand: diurnal
  diet: omnivore
