id: corpo-aevex
version: 0.2.0          # reserved; nothing reads/enforces it (non-goal: version machinery)
root: /corpo/aevex
description: The aevex corpo — its mark, its brands, and its org chart.
dependsOn: [platform]   # /corpo is the platform's; this pack claims its own branch under it
# The corpo's own chart maintains its pack (content-packs wave 3, D8): the
# organization row this pack ships, resident from boot.
maintainers: { organization: /corpo/aevex }
requires:
  # The organization holds its own branch — which is what makes it the
  # committee over /corpo/aevex (the subsidiaries' appointing authority).
  # On a world where the retired `aevex` board group held it, the title
  # migrates to the organization.
  title:
    - { extent: /corpo/aevex }
boot:
  - { template: /corpo/aevex, role: producer, reason: appoint and the chart reads resolve the organization by templatePath }
