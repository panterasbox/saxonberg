# A dog loaf — ⭐ horse-bread, and the one loaf in the game that is not
# for you.
#
# ⚠ It is a `Provision` and it IS edible — a person can eat this, and
# people did when it was the only bread they could afford. It is not
# poison and the game does not refuse it; it is simply bad bread, and the
# board's price is what says so.
