verbs: [bake]
controller: /trade/baking/idea/cmd/baking/BakeController
description: "Put a proofed dough into the oven"
help: |
  `bake` makes a lean loaf from a proofed dough in reach. `bake
  flatbread` makes the unleavened kind, which takes raw dough and five
  minutes and wants no culture at all.

  ⭐⭐ **The loaf goes INTO the oven, and it does not come out by
  itself.** Everything else you make is handed to you finished. Bread is
  not: it is minted done and then it keeps taking heat, and an oven at
  500 K will carry it from done to overdone to burnt while you are doing
  something else. Taking it out is a thing you do.

  Where there is more than one fire in reach, say which: `bake at the
  brick oven`. A two-word dough name works bare, and quoting works too
  (`bake "rye sponge"`).

  ⚠ Too fierce a fire does not refuse to bake — it scorches the outside
  while the middle is still raw. You are allowed to ruin bread, and a
  ruined loaf is a loaf you are holding rather than an error message.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  # ⭐⭐ `greedy: true`, and `required: false` stays EXPLICIT — the
  # reasoning is `platform/cmd/retail/buy.yaml`'s. A lean loaf and a
  # flatbread are one word each, but a named dough is not, and the
  # trailing `oven` slot was eating word two and losing its own default
  # with it. ⚠ `greedy` DEFAULTS an arg to required
  # (`CommandDefinition.ts:703-723`), so the explicit `required: false`
  # is what keeps bare `bake` working — dropping it would make the oven
  # mandatory and break every bakehouse with one fire.
  - name: loaf
    type: string
    required: false
    greedy: true
  # ⭐⭐ WHICH OVEN, declared rather than re-derived — the `buy … from
  # <counter>` shape. `bake` alone is unchanged; a bakehouse with two
  # ovens becomes addressable (`bake at the big oven`), which a
  # controller-side default never was.
  #
  # ⚠ The query is `BurnerMixin`, and the controller narrows from there
  # into the state it actually needs: lit, fuelled, and a CHAMBER you can
  # put something in. That split is deliberate and follows `buy`'s own
  # note — one arg finds every fire, and the controller decides which of
  # them is an oven rather than a campfire. A predicate cannot express
  # "lit", so pretending the arg could would be worse than honest.
    # ⭐⭐ `greedy: true` on the TRAILING arg too, and it is the same
    # defect wearing the other hat: a non-greedy arg takes exactly ONE
    # token, so naming the counter at all — ``bake at the brick oven`` —
    # answered *"that doesn't match any known command shape"*. The
    # article and the ordinal are two more tokens and there was nowhere
    # to put them. Identical to the `look at the ground` defect the
    # ground build found in a browser, on a verb that invites you to say
    # which counter. Safe because this arg is LAST, which is the other
    # half of `validateArgOrdering`.
  - name: oven
    type: object
    required: false
    greedy: true
    prepositions: [at, in, on]
    default: "reachable:[mixin.BurnerMixin]"
    scope: ["reachable"]
    requires: [BurnerMixin]
