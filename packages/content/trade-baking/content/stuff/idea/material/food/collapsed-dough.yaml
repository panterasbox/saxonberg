# Collapsed dough — ⭐ what happens to a proof you FORGOT.
#
# The `bread-dough` profile's `turnedMaterial`: a batch left open past
# its `turnDays` goes over. The gluten sheet has stretched past what it
# can hold, the gas has gone out of it, and it will not rise again.
#
# ⚠ It is not poison and it is not waste — you can still bake it, and
# what you get is a flat, sour, close-grained loaf. That is the honest
# outcome of the mistake: a worse loaf, not a lost one.
class: /platform/idea/material/Material
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
