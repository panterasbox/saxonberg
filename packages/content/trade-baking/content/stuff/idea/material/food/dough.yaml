# Dough — flour, water and salt worked together. ⭐ NOT a ferment yet.
#
# The `dough` tag is what the `bread-dough` maturation profile matches
# on (`inputCategory`), so the moment a trough holds this, the batch can
# start. What decides whether it DOES is the trough's cloth: covered, it
# waits for a pitched culture; open, wild flora settle out of the air.
class: /platform/idea/material/Material
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: dough
  keywords: [dough, paste]
  appearance: slack and pale, tacky to the touch
  density: 1100
  specificHeat: 2800
  thermalConductivity: 0.45
  electricalConductivity: 0.01
  waterAbsorptionCapacity: 5
  hardness: 1
  toughness: 2
  edibility: true
  # Wet, and full of everything a microbe wants. Raw dough spoils fast,
  # which is the honest reason you do not leave it three days.
  waterActivity: 0.96
  spoilActivationEnergy: 55000
  nutrients: ["carb", "protein"]
  nutrientAmounts: { carb: 480000, protein: 55000 }
  toxicity: []
  tags: ["food", "dough", "baking"]
  composition: []
