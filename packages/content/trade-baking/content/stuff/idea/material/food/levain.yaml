# Levain — the starter. A living culture of wild yeast and lactobacilli
# kept in a crock and fed.
#
# ⭐ It rides the shipped CULTURE half of the maturation substrate, the
# same one `jar-of-barm` uses for ale: a culture has `viability` that
# falls when it is not fed (`starveDays`), and a dead one is dead. A
# baker's starter is a thing you keep alive, and forgetting it for a
# fortnight is a real loss.
