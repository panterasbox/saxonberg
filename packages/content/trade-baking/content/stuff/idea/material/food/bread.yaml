# Bread — ⭐ and there is exactly ONE row, which is the point.
#
# A tangible needs a material for its mass, its thermal constants and its
# spoilage figures, and bread is bread. What makes one loaf different
# from another is not its material — it is its COMPOSITION, the parts the
# miller's extraction decided on, carried all the way here.
#
# ⚠ So these `nutrientAmounts` are the FALLBACK, read only by a loaf that
# knows nothing about what went into it. Any loaf that came out of the
# chain reads its own parts instead, and two loaves of this same material
# feed you measurably differently.
#
# ⭐ `bread` is also the tag `lint:doneness` reads: any row made of matter
# tagged `bread` must be on a class that can STALE. A loaf on bare
# `Provision` would spoil and never go hard — silently, which is exactly
# the failure `lint:perishable` cannot see, because such a row passes it.
class: /platform/idea/material/Material
data:
  name: bread
  keywords: [bread, loaf, crumb]
  appearance: risen and browned, hollow when you knock it
  density: 280
  specificHeat: 2500
  thermalConductivity: 0.05
  electricalConductivity: 0.001
  waterAbsorptionCapacity: 40
  hardness: 2
  toughness: 2
  edibility: true
  # Drier than the dough it came from — the oven drove a lot off. Still
  # damp enough to mould in a warm room, which is what a bread box is for.
  waterActivity: 0.94
  spoilActivationEnergy: 50000
  # ⭐⭐ Staling (kinetics): the oven's gelatinised starch re-crystallising
  # (retrogradation). NOT spoilage, and the two run opposite ways in the
  # cold: fastest a few degrees above freezing, stopped by ice, and
  # REVERSED by heat (a stale loaf comes back in the oven, but only to the
  # floor — each pass loses a little). Which is why the icebox is the worst
  # place for bread. A Gaussian peaking at 277 K, a sixth of its peak at
  # room temperature. Phrases share no word with the freshness bands.
  kinetics:
    - key: staling
      order: 0
      rate:
        - [273, 0]
        - [273.5, 0.0183]
        - [277, 0.02]
        - [281, 0.0179]
        - [285, 0.0128]
        - [289, 0.00736]
        - [293, 0.00338]
        - [297, 0.00124]
        - [301, 0.000366]
        - [309, 0.0000164]
        - [315, 0]
        - [329, 0]
        - [330, -1.2]
      floor: 0.2
      words:
        - [0, ""]
        - [0.25, "The crumb has tightened a little."]
        - [0.5, "It has gone dry and close-grained; the crust is leathery."]
        - [0.8, "It is hard all the way through. You could knock on it."]
      senses: [vision, touch]
  nutrients: ["carb", "protein"]
  nutrientAmounts: { carb: 500000, protein: 85000 }
  toxicity: []
  tags: ["food", "bread", "baking"]
  composition: []
