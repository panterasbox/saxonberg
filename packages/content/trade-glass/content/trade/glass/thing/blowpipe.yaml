# The blowpipe — the glassmaker's iron. A hollow rod that holds one gather
# and affords the hot shop (gob/shape/reheat/crack) to whoever carries it.
# The `blowpipe` capability is what those views bind their `pipe` arg to.
class: /trade/glass/thing/Blowpipe
data:
  keywords: [blowpipe, pipe, iron, "blow pipe", punty]
  shortDescription: blowpipe
  register: indefinite
  longDescription: >-
    A long hollow iron rod, one end wound with wire for grip, the other
    blackened and glassy from the gathers it has carried.
  mass: 2.4
  capabilities: ["blowpipe"]
  # ⭐ The forms this pipe blows — `Form` rows, loaded when a `shape` asks
  # (`FormingMixin`). A blown jar or flask is one more row here.
  forms:
    - /trade/glass/idea/form/bottle
    - /trade/glass/idea/form/cylinder
