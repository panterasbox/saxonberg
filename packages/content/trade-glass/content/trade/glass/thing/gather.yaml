# A gather — a blob of hot glass on the pipe (glass build D10). `gob` mints
# it into the blowpipe at the melt's temperature and alloying; it cools by
# the kernel's own Newton drift from that moment, and the hot-work window
# is the time before it falls below working heat. The mass and alloying
# here are nominal — `gob` sets them from the melt it is drawn from.
class: /trade/glass/thing/Gather
data:
  keywords: [gather, gob, "hot glass", blob]
  shortDescription: gather of hot glass
  register: indefinite
  longDescription: >-
    A glowing blob of glass on the end of the pipe, soft as toffee while
    the colour is in it.
  _materialPath: /stuff/idea/material/glass/glass
  mass: 0.4
  stampedTemperatureK: 1450
  form: gather
