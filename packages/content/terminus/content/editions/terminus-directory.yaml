# The Terminus Directory — the city's residents, trades and offices, printed
# by the Gazette. A FROZEN edition: what the city was the day it
# was set. Whoever has moved since, the directory still says where they were;
# that is what paper is. The directory on the Gazette's counter is bound to
# it (`edition:` on its row); a page torn out carries its page away.
#
# ⚠ Authored, not compiled: the residence and address data do not yet say
# who lives at which door, and a directory compiled from a player's home
# wants that player's consent (the unlisted number) — see the paper plan's
# deferred list.
title: The Terminus Directory
pages:
