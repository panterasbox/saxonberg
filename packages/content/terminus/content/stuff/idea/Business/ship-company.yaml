# A ship's company (harbors P2, B1) — the house whose roster mans a ship of
# a kind. One `master` seat: whoever holds it commands her, takes her helm
# and answers for her at a harbor office.
#
# ⭐ The SEED of every smack's company (harbors B2): the yard mints one per
# ship from it (`asIdentityPath …/ship-company/<serial>`, the drilling
# outfit's precedent), naming HER handle as the authority's ship — so her
# register's managing owner appoints her master (`kind: register`). The
# seed itself names no ship, and so nobody appoints at it: it is a shape,
# not a company.
class: /platform/idea/Business
data:
  name: "a ship's company"
  appointingAuthority:
    kind: register
  positions:
    - key: master
      noun: master
      label: in command of her
      wageRate: 5
      headcount: 1
  startsShiftOnHire: true
  banksAt: goodkin
