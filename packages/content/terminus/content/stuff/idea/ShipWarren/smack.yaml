# The smack's warren — the rooms every smack is minted
# with, keyed `(room row, <serial>/<leaf>)`: copies of her PLAN, which is
# HER kind row's (`/stuff/idea/Ship/smack` — its `extent` and `entrance`),
# handed to this warren as she stands it up.
# ⭐ Each smack is a COPY of the smack's zone (zone-instancing D11), named
# under its row by her serial (`zoneNaming: under-row`), joined to the
# world by her berth — a way aboard that comes and goes (`joins: berth`).
# Her rooms' ways, cells and floors are their own rows' (`floorM` is how
# high a floor stands above her keel: water fills her from the bottom up).
class: /platform/idea/ShipWarren
data:
  zoneNaming: under-row
  joins: berth
