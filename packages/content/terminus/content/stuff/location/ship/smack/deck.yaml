# A smack's deck (harbors B1) — her warren's entry room, minted keyed
# `(this row, <serial>/deck)`. The tiller affords `course`/`anchor`/`hail`;
# her two mooring lines are what she makes fast with (P6); the dinghy is
# what goes over the side; the deck is a shore of whatever sea is under her
# (stamped by her warren as she wakes — the row names the feature, the
# ship names the sea).
#
# ⭐ No record of its own (review 2 — persistence is the exception): the
# deck comes up from this row each time she wakes, her gear below with it.
# What is loose here when she sleeps is stowed in her hold, and gear carried
# off her stays gone (her warren keeps the shortfall), so this list is her
# fit-out, not a faucet. A struck flag is hoisted again; a line moved off
# the bitts but still on deck is back at them.
#
# ⛔ No way below is authored here: her warren wires them from
# the floorplan, keyed — a row-authored destination would name every
# smack's cabin at once.
class: /platform/location/Compartment
data:
  shortDescription: smack's deck
  keywords: [deck, smack, ship]
  register: definite
  _biomePath: /stuff/idea/biome/outdoor/open-water
  longDescription: |
    A short deck between low bulwarks, the mast stepped forward with its gaff and sail lashed along the boom, a hatch battened over the fish hold and a companionway down into the cabin. A tiller swings over the transom.
  props:
    - /system/transport/thing/tiller
    - /system/transport/thing/dinghy
    # ⭐ Her mooring lines (P6): alongside, each goes ashore round a bollard.
    # ⭐ Her bitts (review 1): the lines kept AT them are her mooring lines.
    - { template: /platform/thing/bitts, as: bitts }
    - { template: /platform/thing/mooring-line, count: 2, on: bitts }
    # ⭐ Her pump well and the rod to sound it (harbors P19): `pump well`,
    # `measure bilge`.
    - /stuff/thing/bilge-well
    - /platform/thing/sounding-rod
    # ⭐ Her colors (P16): the flag on her flagstaff is the flag she flies —
    # Terminus' ensign, as the yard enters her in the city's register. A
    # claim only: strike it, or fly another, and her register is unchanged.
    - { template: /platform/thing/flagstaff, as: flagstaff }
    - { template: /stuff/thing/flag/terminus-city, on: flagstaff }
  exits:
    # ⭐ Ashore is wherever she is made fast (P4), worked out when taken;
    # the destination is only her home port. The way back aboard is hers.
    ashore:
      kind: /platform/idea/exits/ashore
      destination: /world/terminus/harbor/town-quay
      oneWay: true
    side:
      kind: /system/water/idea/exits/sea-side
      destination: /system/water/location/sea/patch
  details:
    sea:
      keywords: [sea, water]
      description: |
        Below the rail, the water.
    gunwale:
      keywords: [gunwale, rail, bulwark, bulwarks]
      description: |
        The low rail along her side, worn pale where the nets come in over it.
