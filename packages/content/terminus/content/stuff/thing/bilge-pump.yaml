# The bilge pump (harbors P19) — an elm barrel stepped down into a ship's
# bilge well with a long iron brake on it. What keeps her afloat.
#
# ⭐ `mechanism: suction`, like the village pump: it draws, and the row says
# nothing about a limit — a bilge is never deep enough to find the wall.
# A stroke a spell (20 s) at 0.6 L/s throws twelve litres over the side;
# a smack whose seams are worn lets in about four between strokes.
#
# Born with its packing: a cup of leather the tanner made, which wears
# with every spell at the brake (see /trade/tanning/thing/packing).
class: /platform/thing/Pump
data:
  keywords: [pump, "bilge pump", brake, barrel]
  shortDescription: bilge pump
  register: indefinite
  longDescription: >-
    A barrel bored out of an elm trunk, stepped down into the well with its
    top at knee height and a long iron brake pivoted across it. A lead spout
    runs from it to a scupper in the rail.
  mass: 30
  _materialPath: /stuff/idea/material/wood/elm
  mechanism: /platform/idea/PumpMechanism/suction
  liftM: 4
  throughputLps: 0.6
  strokeS: 20
  props:
    - /trade/tanning/thing/packing
