# Terminus — the ARRIVAL terminal (a floor node). The landing point inbound
# travellers materialise at; the lounge terminal and the crossroads return leg
# route TO this node. directionality: arrival (register-able, never a
# departure). Its keyword `terminus` is the typeable handle for `teleport
# terminus`; the board DISPLAYS the covering Locality name ("Terminus").
# No advanceMode → the FastTravelMixin default `manual` applies.
class: /system/tpa/thing/TpaTerminal
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  seatIn: /world/terminus/terminal/location/arrival-gate
  shortDescription: a Teleport Authority terminal
  keywords: [terminus, arrival]
  directionality: arrival
  status: operational
  # ── the mana leg (TPA reform W6) ──
  # A CITY gate runs on the line: cheap mana, and an arming floor it
  # never approaches because the line refills faster than anything
  # drains it. `standbyWatts: 0` — a gate somebody is feeding
  # continuously has no absence to bill for.
  mainsRef: /world/terminus/terminal/thing/mana-main
  capacityTau: 4000
  armingFloorTau: 200
  standbyWatts: 0
