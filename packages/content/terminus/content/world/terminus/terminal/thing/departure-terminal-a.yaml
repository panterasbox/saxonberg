# Terminus — Departure Gate A's terminal (operational). The one working
# departure: a free return leg to the lounge (fee 0) and the paid line out to
# the newbie-wilds crossroads (fee 15 — demo split: TPA 3 / city 12). Its two
# routes satisfy D4 (lounge free + paid destination both reachable from A).
class: /system/tpa/thing/TpaTerminal
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  seatIn: /world/terminus/terminal/location/departure-gate-a
  shortDescription: a Teleport Authority terminal
  keywords: [gate-a]
  directionality: departure
  status: operational
  # ── the mana leg (TPA reform W6) ──
  # A CITY gate runs on the line: cheap mana, and an arming floor it
  # never approaches because the line refills faster than anything
  # drains it. `standbyWatts: 0` — a gate somebody is feeding
  # continuously has no absence to bill for.
  mainsRef: /world/terminus/terminal/thing/mana-main
  capacityTau: 4000
  armingFloorTau: 200
  standbyWatts: 0
  routes:
    - to: /world/lounge/thing/terminal
      fee: 0
    - to: /world/newbie-wilds/crossroads/terminal
      fee: 15
    # Out to the suburb. Cheap on purpose: living in Hinkley Hills and
    # working in Terminus has to be an ordinary arrangement, not a
    # penalty, or nobody takes a lot.
    - to: /world/terminus/hinkley-hills/thing/tpa
      fee: 5
