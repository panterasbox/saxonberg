# The channel (underwater D25) — the deep water along the withies at the
# estuary mouth, where the Greywater's tide runs in and out of the river.
# A place that IS the water: three meters over the mud at mean water, more
# at the flood. What floats here when the tide turns ends up on the
# strandline.
class: /system/water/location/RiverPlace
data:
  shortDescription: channel
  keywords: [channel, tide, water, "deep water"]
  register: definite
  _address: terminus/city/wharfside/channel
  _biomePath: /stuff/idea/biome/outdoor/open-water
  details:
    channel:
      keywords: [channel, tide, water, "deep water"]
      description: |
        Gray water, opaque past an arm's length, running hard between the withies.
  longDescription: |
    You are in the channel, the withies leaning past at arm's length. The water is gray and cold and it pulls — upriver on the flood, out toward the bar on the ebb.
  coords:
    x: 3
    y: 1
    z: 0
  # ⭐ The Kestrel's mouth (the river build, D37): the last of the river,
  # tidal — the flood runs up it and the ebb runs out — and the place the
  # line hands anything drifting down to the sea into. A ship passes the
  # bar beyond it in prose; nothing drifts out of it on its own.
  water: { of: "kestrel:estuary", depthM: 3, feature: channel }
  river: { course: kestrel, at: estuary-0.3, span: 0.3, name: channel, ends: { upstream: handoff, downstream: end } }
  current: inherit
  exits:
    south:
      destination: /world/terminus/estuary/estuary-mouth
      media: [water]
      # A swim out over the bar, short; every corridor edge carries a budget.
      edgeMinutes: 2
