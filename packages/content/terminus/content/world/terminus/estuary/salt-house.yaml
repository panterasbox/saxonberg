# ⭐ The salt house — the FAST way to get salt, and the fuel is the price.
#
# A long shed off the towpath with a brine hearth down the middle of it. You
# bring brine, you bring fuel, you boil it down in an afternoon. ⚠ The fuel is
# what the charcoal burner and the smelter also want, so the choice between
# this and the pans outside is a real one with no dominant option: patience is
# free and slow, fuel is fast and contested.
#
# ⚠ **No salter and no business here.** Salt ships as a GOOD in this build,
# not as a trade — a salter, the gabelle and the salt tax are
# `mining-slate`'s and `institutions-slate`'s. What stands here is the
# apparatus, open to anybody who brings brine.
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: salt house
  keywords: [salt, "salt house", salthouse, shed, hearth]
  register: definite
  alternateNames: [house, shed]
  _address: terminus/city/wharfside/salt-house
  _biomePath: /stuff/idea/biome/indoor/baseline
  # ⭐⭐ **No authored ambient, because this shed has two real causes and
  # neither of them is a number.** It authored 900 lumens — "indoors, one
  # lamp's worth" — which is an authored EFFECT on a room that is not
  # open to the sky, and `lint:light-sources` refused it on the merge
  # (envelope S2: every room's light has a named source).
  #
  # The causes are both already here and both already in the prose: the
  # shed is **open at the far end**, so daylight spills the one hop
  # through the northern exit at full strength; and the **brine hearth**
  # in `props:` is a fire, which lights the place while it is burning.
  # So it is bright enough to work in by day, and after dark it is lit
  # by exactly the fire whose fuel this room is about — which is a
  # better sentence than the number was.
  longDescription: |
    A low shed the length of four carts, open at the far end, with a fire-bed running most of the way down it and a rack of iron bars over the fire. The roof timbers are white with salt and the air tastes of it.

    Somebody's tally is scratched into the doorpost in fives.
  coords:
    x: 1
    y: 1
    z: 0
  props:
    - /trade/quarrying/thing/brine-hearth
    - /trade/quarrying/thing/salt-pan
  exits:
    north:
      destination: /world/terminus/estuary/lower-towpath
      edgeMinutes: 1
  details:
    tally:
      keywords: [tally, marks, doorpost, scratches, fives]
      description: |
        Gate-and-bar fives cut into the oak with a knife, hundreds of them, in different hands and different depths. Nobody is keeping the count any more and nobody has rubbed it out either.
