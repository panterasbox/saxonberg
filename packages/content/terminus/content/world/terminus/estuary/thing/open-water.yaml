# ⭐ The deeps — **what makes the water exits swimmable**, and the first
# `Swimmable` row in the realm.
#
# `swim` shipped with the locomotion build and `SwimmableMixin` beside
# it; `biped.yaml` has listed `swim` among a person's modes the whole
# time, six exits here and at the wharf already carry
# `media: [ground, water]`, and nothing in the game composed the mixin.
# The verb was reachable by nobody for three builds, because the only
# composition of it anywhere was a test that built its own host.
#
# ⚠ A THING standing in the reach, not a property of the room: the
# enablement walk looks in the actor's container and its CONTENTS for a
# host (`LocomotionLogic.findEnablementHost`), which is the ladder's
# shape exactly. Water in the reach is what makes swimming possible here,
# and a reach with none is a reach you walk the towpath along.
#
# ⚠⚠ The keywords deliberately avoid the tide's (`water`, `sea`,
# `channel`, `brine`) and the river edge's (`river`, `bank`): three water
# objects stand in these rooms and each answers to its own name. The
# tide is what you FILL a salt pan from, the edge is what you FISH, and
# this is what you SWIM in.
class: /platform/thing/OpenWater
data:
  shortDescription: deep water
  keywords: [deeps, "deep water", "open water"]
  register: definite
  longDescription: |
    Past the shelving mud the bottom drops away and the colour changes with it — brown going to a flat pewter that tells you nothing about how far down it is. The surface moves in long slow shapes that are not waves.
  # ⭐ `['*']` is safe, not lax: the gate order is body plan → posture →
  # the exit's own MEDIA gate → enablement. A dry exit in this same room
  # is refused before any enablement host is looked for, so the axis list
  # would only matter for water that served some directions and not
  # others. None does.
  axes: ['*']
  # Anybody may. What it COSTS is the body's business, at the swim mode's
  # own `costMultiplier` — the same division of labour as the climb.
  difficulty: null
  fixedInPlace: true
  mass: 100000
