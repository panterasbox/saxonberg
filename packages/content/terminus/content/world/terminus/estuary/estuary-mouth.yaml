# The estuary mouth — the end of the water lane, and the edge of the
# realm's map.
#
# The export road HAS an end a barge can be at, so "carry it downriver"
# is a thing you can do rather than a direction you can face.
#
# ⭐ And since the maritime build it is also a LANDING: the bar is the
# Greywater's linear passage across the mouth, and whatever lies at the
# bar is reached `aboard` from here. The sea is still not content in the
# room sense — nothing is ever inside the Greywater; its places are its
# nodes, and this room is the content behind one of them.
class: /platform/location/SingletonCartesianLocation
data:
  shortDescription: mouth of the estuary
  keywords: [mouth, estuary]
  register: definite
  alternateNames: [estuary, saltings, marsh, water]
  _address: terminus/city/wharfside/estuary-mouth
  _biomePath: /stuff/idea/biome/outdoor/baseline
  longDescription: |
    The banks give up. The river spreads into a mile of saltings and mud and channels that move between one season and the next, and the made path ends at a post with a lamp bracket on it and no lamp.

    A deep channel keeps to the northern side and is marked, after a fashion, by withies pushed into the mud, out to the bar. Beyond that there is grey water and a great deal of sky. East, a strand of pale sand runs under a headland.
  coords:
    x: 3
    y: 0
    z: 0
  # ⭐⭐ The saltings, furnished: the tide you fill from and two pans on the
  # brick beds. ⚠ `props:` — fixtures of the place, not things somebody left.
  #
  # ⭐ TWO pans, deliberately: one is an apparatus and two is an industry, and
  # a player who fills one on a dry week and one on a wet one has the whole
  # lesson side by side without anybody explaining it.
  props:
    - /world/terminus/estuary/thing/tide
    - /trade/quarrying/thing/salt-pan
    - /trade/quarrying/thing/salt-pan
  exits:
    west:
      destination: /world/terminus/estuary/reach
      media: [ground, water]
      edgeMinutes: 4
    east:
      destination: /world/terminus/estuary/strand
      media: [ground]
      edgeMinutes: 2
    # ⭐ The way aboard whatever lies at the bar (maritime D19) — a ship
    # that has sailed is not alongside, and this says so.
    aboard:
      kind: /platform/idea/exits/aboard
      destination: /world/terminus/hesper/deck
      edgeMinutes: 1
  details:
    withies:
      keywords: [withies, withy, marks, channel, sticks]
      description: |
        Willow rods pushed into the mud along the edge of the deep water, leaning with the last tide. Somebody replaces them. There is no authority that says who, and there never has been.
    saltings:
      keywords: [saltings, marsh, mud, flats, samphire]
      description: |
        Grey-green and cut to pieces by creeks, dry twice a day and not the rest of the time. Nothing crosses it that does not know it, and knowing it is a trade of its own that this realm has not troubled to name.
    post:
      keywords: [post, lamp, bracket, pole]
      description: |
        Oak, set in a stone base, with an iron bracket at head height shaped to take a lamp. There is no lamp. There has not been one for long enough that the bracket has rusted shut.
