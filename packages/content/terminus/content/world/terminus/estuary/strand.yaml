# The strand — a sandy shore on land, beside a water small enough to see
# across. ⭐ You are ON LAND here: the water is a thing beside you, and
# `swim east` takes you into it — admitted because still water stands
# here, as a ladder stands at a shaft.
class: /platform/location/SingletonCartesianLocation
data:
  shortDescription: strand
  keywords: [strand, beach, sand, shore]
  register: definite
  _address: terminus/city/wharfside/strand
  _biomePath: /stuff/idea/biome/outdoor/baseline
  longDescription: |
    A crescent of pale sand in the lee of the headland, with the pool lying green and still across from it. The far side is a short swim off; you could throw a stone onto it.
  coords:
    x: 4
    y: 0
    z: 0
  props:
    - /world/terminus/estuary/thing/still-water
  exits:
    west:
      destination: /world/terminus/estuary/estuary-mouth
      media: [ground]
    east:
      destination: /world/terminus/estuary/pool
      media: [water]
    north:
      destination: /world/terminus/estuary/headland
      media: [ground]
