# The lower towpath — the working end of Wharfside, where things are
# loaded rather than looked at.
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: the lower towpath
  primaryKeyword: towpath
  alternateNames: [path, wharf, quay, bank]
  _address: terminus/city/wharfside/lower-towpath
  _biomePath: /stuff/idea/biome/outdoor/baseline
  ambientIntensity: 590
  ambientColorTemperature: 5800
  longDescription: |
    Below the confluence the Kestrel goes wide and slow and the city finally does something useful with it. A stone quay runs along the bank, low enough to work a barge over and high enough to stay out of the spring, with rings set into it at intervals and a crane frame at the near end with no rope on it.

    The water here is deep enough that you cannot see the bottom, which is not true anywhere upstream.
  coords:
    x: 1
    y: 0
    z: 0
  exits:
    west:
      destination: /world/terminus/wharfside/bank
      media: [ground, water]
      edgeMinutes: 3
    east:
      destination: /world/terminus/estuary/reach
      media: [ground, water]
      edgeMinutes: 4
  # ⭐ The Terminus depot stands here, on the quay, where the water lane
  # and the wheeled road both reach. A depot is the INTERFACE — where a
  # lane touches the local economy — and the place it belongs is where
  # two lanes meet, which is what makes this room rather than the market
  # square the right ground for it.
  #
  # ⚠ The counter, the shed and the two businesses are the HAULAGE
  # trade's rows; only the PLACE is Terminus's. Trade = mechanism,
  # locality = expression.
  props:
    - /trade/haulage/thing/depot-counter
    - /trade/haulage/thing/warehouse
    - /trade/haulage/thing/rate-board
    # ⭐ The depot's own board. A depot is where a lane touches the local
    # economy, so it is also where somebody looking for a haul goes to
    # find one — and where a hauler at the far end asks what wants
    # moving BACK (`jobs --origin here`, the backhaul).
    - /trade/haulage/thing/works-board
  cast:
    - /trade/haulage/agent/warehouseman
    - /trade/haulage/agent/dispatcher

  details:
    rings:
      keywords: [rings, ring, mooring, iron]
      description: |
        Iron, set into the stone at two-fathom intervals, worn bright on their upper curve and rusted solid underneath. The spacing tells you what length of craft this quay was cut for.
    crane:
      keywords: [crane, frame, jib, gantry]
      description: |
        A timber A-frame with an iron sheave at the head and no rope through it. Somebody took the rope. The frame is sound and would work again tomorrow.
    board:
      keywords: [board, rates, tariff, prices]
      description: |
        A slate-framed board behind the counter with the carrier's card behind glass — what they charge, by road, by weight, by what it is. Anybody can stand here and read it, which is the point of hanging it up. Last season's card is pinned underneath.
    depot:
      keywords: [depot, counter, shed, office, warehouse]
      description: |
        A timber goods shed open at both ends with a plank floor at cart-bed height, and beside it a counter under an awning with a brass rail worn through in two places. A chalked board above the counter lists what is going where. Half of it has been rubbed out and rewritten since this morning, which is either efficiency or chaos and nobody who works here will say which.
    water:
      keywords: [water, river, kestrel, deep]
      description: |
        Brown, opaque, and moving without any surface to speak of. You cannot see the bottom. Upstream of the confluence you can see the bottom everywhere, which is the whole reason a boat stops there and starts here.
