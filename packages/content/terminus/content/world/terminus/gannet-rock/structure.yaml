# The light on Gannet Rock — a Structure whose position never changes.
#
# ⭐ At sea its range is COMPUTED from its height (curvature binds; nothing
# is in the way), so a craft raises it at a distance thirty metres decide.
# A landmark — featured when it is in view — and a FIXED subject, so a
# bearing taken on it fixes the reckoning (maritime R8). Nothing fixes
# anything by being seen.
class: /platform/idea/Structure
data:
  name: the light on Gannet Rock
  extent: /world/terminus/gannet-rock
  entrance: /world/terminus/gannet-rock/landing
  shortDescription: light on Gannet Rock
  register: definite
  keywords: [light, lighthouse, gannet, rock]
  longDescription: >-
    A white tower on a black rock, a lantern on top, the rock itself white
    with birds.
  landmark: true
  heightM: 30
  # ⭐ No position of its own (maritime review, 2026-10-13): a light on a
  # rock is where its rock is — the Greywater's `gannet-rock` node, whose
  # landing is in this extent. The sea finds it as a landmark there.
