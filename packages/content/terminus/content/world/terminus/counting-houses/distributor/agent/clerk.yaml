# Tam Ferrier — the cash-and-carry clerk. The rostered pair of hands on the
# counter (position `clerk`); with the counter self-service + instant, she
# is a voice and a ledger rather than a gate. Does NOT consign — the hands
# do; she tallies what comes in and reads the asks off the board.
class: /platform/agent/Cast
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  # ⭐ What this person has on (envelope W1). Until this build no NPC
  # row in the tree could author clothing at all, so every authored
  # person in the realm was naked — invisible only because every
  # interior was 21 °C by decree. A counting house.
  wears:
    - /stuff/thing/clothes/student-shirt
    - /stuff/thing/clothes/student-trousers
    - /stuff/thing/clothes/canvas-shoes
    - /stuff/thing/clothes/blazer
  name: Tam Ferrier
  keywords: [clerk, tam, ferrier, brisk, stub, chalk]
  pronouns: she
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  alternateNames: [tam, ferrier]
  shortDescription: brisk clerk with a stub of chalk
  register: indefinite
  longDescription: |
    A wiry woman in a leather apron with a stub of chalk behind one ear and a tally-book chained to her belt. She counts a delivery once, fast, and is never wrong; the chalkboard of asks above the counter is in her hand, and so is the price of everything on it.
  dispositions:
    - { disposition: diligence, valence: 65 }
    - { disposition: composure, valence: 50 }
  # ── the dossier ─────────────────────────────────────────────────
  # Evidence, never values: each entry below expands into the same rows a
  # lived history would have written, marked `claim`. Seeded once at
  # postRegister and skipped if any claim already exists, so a reclone or
  # a reboot cannot mint a second history.
  # ⚠ A best-guess pass, explicitly provisional — the considered version
  # is a content pass of its own before go-live.
  archetype: freight-clerk
  competence:
    - { discipline: business-administration, asserting: competent }
    - { discipline: appraisal, asserting: novice }
  behaviors:
    # ⭐⭐ Somebody who is not the player buys bread, every morning.
    #
    # The grain chain shipped a grower, a miller and a baker and NOBODY
    # WHO NEEDED BREAD — 32 brains and not one of them ate, so the whole
    # chain ended in a shop and the only demand in the world was a player
    # choosing to be hungry.
    #
    # ⚠ Wired on an EXISTING person rather than a new one on purpose: the
    # demand should come from people already in the city, doing their
    # jobs, whose outfits bank so they have a purse of their own.
    #
    # ⭐ The purse chooses the loaf. Nothing here says what this person
    # can afford — the brain compares one balance to the counter's
    # prices, and two people on two wage rates buy different bread on the
    # same morning with nothing anywhere labelling either of them.
    - brain: /lib/behavior/eats
      trigger: cadence:90s
      config:
        counter: /world/terminus/market/thing/bread-counter
        fromHour: 6
        toHour: 10
        spendFraction: 0.25
    - brain: /lib/behavior/introduces
      trigger: arrival
    - brain: /lib/behavior/greets
      trigger: arrival
      config:
        lines:
          - "\"Trade only, mind — but if you're buying for a house, the board's the board.\" Tam taps the chalk on the counter."
          - "\"Everything on the shelf came in on consignment. You want to know whose, look at the label.\""
    - brain: /lib/behavior/idles
      trigger: cadence:23s
      config:
        pool:
          - { kind: free, value: "chalks a fresh ask on the board and rubs out an old one with her thumb." }
          - { kind: free, value: "counts a case of bottles by running a finger down the necks." }
          - { kind: say, value: "Mind the dray." }
