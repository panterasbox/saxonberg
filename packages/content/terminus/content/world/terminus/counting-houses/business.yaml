# The Goodkin branch Business — a bank is a Business whose product is banking
# (the budget.yaml precedent). Its own operating account (bank-banks-with-
# itself: held at its own branch via ensureVenueAccount), staff on a roster (=
# the branch's hours), a P&L. No local proprietor — corpo-owned, the corpo is
# the parent above; Wenna and Halloran are both salaried employees (the roster
# settles their wages at each shift boundary from the branch account).
#
# operatingLocations points at the BankCounter fixture, so
# EmploymentApi.ensureOperatorAt(<counter>) stands this up lazily (fee income +
# wages share the one account keyed on this Business path) and the Attendant /
# banking layers resolve the branch here.
#
# The banking affiliation (corpoKey: goodkin) lives on the BankCounter fixture,
# NOT here — a Business has no corpoKey (the map convention).
class: /platform/idea/Business
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  # ⭐ GOODKIN's board hires Goodkin's tellers — not the city.
  #
  # The city owns the district this counter stands in
  # (`/world/terminus/counting-houses` is the `terminus` group's), so the
  # committee over the GROUND would have been the wrong appointer, and
  # `entity` cannot name a corpo (that kind matches the principal's own
  # templatePath, and a Corpo is a mark, not an actor). The branch shipped
  # unauthored for exactly that reason.
  #
  # Giving each corpo its own `/corpo/<key>` branch and board group closes
  # it with no new authority kind: the committee here is Goodkin's, over
  # Goodkin's own ground, and the municipality satisfies it no more than a
  # stranger does.
  appointingAuthority:
    kind: committee
    parcel: /corpo/goodkin
  # The branch sits INSIDE the company — the first content consumer of
  # organization parentage. `organizationChainOf` walks it.
  parentOrganization: /corpo/goodkin
  positions:
    - key: teller
      label: working the Goodkin counter
      wageRate: 5
      confers: []
    - key: officer
      label: hosting the Goodkin Circle
      wageRate: 6
      confers: []
  rosterSlots:
    - positionKey: teller
      assignee: /world/terminus/counting-houses/agent/teller
      schedule:
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [8, 18] }
    - positionKey: officer
      assignee: /world/terminus/counting-houses/agent/officer
      schedule:
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [8, 18] }
  # The bank banks at itself — Goodkin's own operating account is
  # custodied at Goodkin (the legitimate self-custody: the custodian IS
  # a bank).
  banksAt: goodkin
  operatingLocations:
    - /world/terminus/counting-houses/bank-counter
