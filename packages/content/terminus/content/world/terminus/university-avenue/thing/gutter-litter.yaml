# A takeable scrap of gutter litter — a real Thing, loose on the stone by the
# bin. Generic object (Visible.shortDescription, never Named); pick it up,
# read it, drop it in the bin. Its readable face is a Detailed sub-feature.
class: /platform/thing/Thing
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: crumpled ticket stub
  keywords: [stub, crumpled, ticket]
  register: indefinite
  longDescription: |
    A crumpled Teleport Authority ticket stub, dropped just short of the bin. The fare and the destination are half-torn away; someone arrived, and didn't look back at what it cost them.
