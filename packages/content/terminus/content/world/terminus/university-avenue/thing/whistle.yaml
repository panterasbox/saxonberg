# Gus's brass pea whistle — `/world/terminus/university-avenue/thing/Whistle` (Audible + Wearable + Detailed).
# Worn on the neck slot; equipped at standup by Gus.equipLoadout. He blows a
# fixed clean ~110 dB flourish "to keep it sharp," for no one — the blow-model
# (breath/skill) is banked for the future player whistle. Generic object:
# Visible.shortDescription, never Named.
class: /world/terminus/university-avenue/thing/Whistle
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a brass pea whistle
  primaryKeyword: whistle
  keywords: [whistle, brass, pea, cord]
  longDescription: |
    A brass referee's pea whistle on a boot-lace cord, worn at the neck and gone soft-gold with handling. The mouthpiece is smoothed where his lip meets it. He blows it clean and sharp now and then, at nothing, to keep it sharp.
  slotClaims:
    "/stuff/idea/species/BodyPlan/biped": [neck]
  details:
    pea:
      keywords: [pea, cork, ball]
      description: A little cork pea rattles inside the barrel — the honest cause of the rough trill, worn round and pale from a lifetime of clean blasts.
