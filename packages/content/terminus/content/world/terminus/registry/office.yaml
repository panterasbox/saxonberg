# The Terminus Registry — the public counter. The whole city government a
# visitor can actually see: one rented room, one counter, one registrar
# who is also, by necessity, the acting Magistrate. Prose is the bulk
# (room-spec three tiers); the clerk is the one full carve, stood up by
# `props`. Cross-zone exit pair with the terminal's arrival gate,
# declared explicitly on both sides (the gate lists `east`→here).
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: the Terminus Registry
  primaryKeyword: registry
  _address: terminus/city/civic/registry
  longDescription: |
    A narrow annex off the station frontage, rented by the city and not yet grown into: one long counter of dark wood, a wall of ledger shelves still mostly empty, and a brass plate by the door — REGISTRY OF THE CITY OF TERMINUS — polished brighter than anything else in the room. Behind the counter a second desk bears a smaller, sterner plate: MAGISTRATE. It is the same desk turned around.

    Whatever the city knows about itself is written down here: leases and titles, convictions and pardons, the slow paperwork of a government still convincing the city it exists. The window looks west onto the arrival gate's stream of travellers, every one of them somebody's future paperwork.
  coords:
    x: 0
    y: 0
    z: 0
  cast:
    - /world/terminus/registry/clerk
    # The deed desk — the `title` verb's venue predicate (residences P6).
    - /world/terminus/registry/desk
  exits:
    west:
      destination: /world/terminus/terminal/location/arrival-gate
  details:
    counter:
      keywords: [counter, wood, ledgers, shelves]
      description: |
        A long counter worn smooth at exactly one spot — the registrar's elbow. The ledger shelves behind it hold the city's whole written memory, which is not yet much, and gains a page a day.
    plate:
      keywords: [plate, plates, brass, sign, magistrate]
      description: |
        Two brass plates: REGISTRY OF THE CITY OF TERMINUS by the door, bright with polishing, and MAGISTRATE on the turned-around desk behind the counter — the young administration's whole judiciary, sharing an elbow with its whole records office.
    window:
      keywords: [window, gate, travellers]
      description: |
        A tall window onto the arrival gate. Travellers resolve out of the between all day long; the registrar has learned to tell at a glance which ones will end up in the ledgers.
