# Gannet Rock — the landing at the foot of the light, fifteen miles out.
# Ordinary rooms in an ordinary zone; the rock's place on the sea is its
# expanse node's, and the light is a Structure with a fixed position.
class: /platform/idea/place/CartesianZone
data:
  name: Gannet Rock
  # Covered by a Locality, so a walk here files claims on your map
  # (navigation card review — a zone with no address wrote nothing).
  address: terminus/gannet-rock
  cellSize: 10.0
  # The rock stands in the sea, not on the city's 35 m: its light's top is
  # the 30 m the sea already sights by (geography D12).
  elevation: 0
  # ⭐ A rock at sea looks out on its sea (geography D5): the Greywater's
  # craft are read from the landing and from the gallery above it.
  horizon:
    reach: [/stuff/idea/WaterExpanse/greywater]
