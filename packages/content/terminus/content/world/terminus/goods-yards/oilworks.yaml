# The Oil Works — a fuel-trade producer's premises IN THE CITY (economic
# bootstrap D6): the floor, the stock, the outfit and its hand sit under the
# `goods-yards` district, where the committee that holds the ground is liable
# when the outfit fails. The MECHANISM — the lamp-oil material and the cask —
# stays with the fuel trade (`/trade/fuel`); these rows name it by path.
# ⭐ This is the PRODUCER the street-lighting market was missing: it makes lamp
# oil (spawned floor stock) and consigns casks to the cash-and-carry,
# where a town's public-works department buys them. A sub-zone of its own so
# the floor keeps its authored coords; the district zone is its parent.
#
# ⭐ The retort in the corner is REAL since the fire build: the chamber
# fires, and what leaves the charge goes to a condenser. Lamp oil off the
# light fraction is the distiller's deferred cuts rung (heads, hearts,
# tails over a `FractionSchedule`) and is named there — so this row's old
# *"the crafted route is a later build"* is retired rather than restated.
