# the oil works' stock — it names its floor product (lamp-oil casks) as a
# line and the reset sweep makes it up to par. No prices (nothing is sold
# here — the hand carries the casks to the cash-and-carry and consigns them).
class: /trade/shopkeeping/thing/Stock
data:
  shortDescription: "oil works stock"
  keywords: [stock, casks, oil, pallet]
  register: definite
  longDescription: "Rows of iron-hooped casks on their sides in a rack, and the sharp clean smell of the still."
  # A heavy oak cask-rack (states a material so it carries mass — lint:mass;
  # the older Stock rows predate the gate and are its ceiling).
  _materialPath: /stuff/idea/material/wood/oak
  discipline: scrum
  attendDurationMs: 0
  staffingPolicy: self-service
  serverPositionKeys: []
  businessPath: /world/terminus/goods-yards/oilworks/idea/outfit
  # ⭐ The producer names its lines (the scan sweep's review, 2026-10-15):
  # the reset sweep makes each one up to par here. The goods say nothing
  # about where they are made.
  stockLines:
    - { itemTemplatePath: /trade/fuel/thing/lamp-oil-cask, par: 4 }
  prices: {}
