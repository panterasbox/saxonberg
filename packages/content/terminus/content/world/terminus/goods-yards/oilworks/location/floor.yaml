# the oil works' floor — the yard: the outfit's Stock (the cask rows' home
# `container:` — the sweep stands them at target here) and the hand whose
# `consigns` beat carries them to the cash-and-carry. It has a DOOR onto the
# goods yards so a hauler can reach what the hand crated. An ordinary location,
# not a FurnishableRoom (that class is the furnishing archetypes' base); the
# floor's durability lives on its persistable fixtures (the Stock), and the
# consigned casks ride those, respawning each boot.
class: /platform/location/SingletonCartesianLocation
data:
  # ⚠ `coords:` is the MEMBERSHIP operation — the only way an authored row
  # joins its zone (the oilworks sub-zone beside it).
  coords:
    x: 0
    y: 0
    z: 0
  shortDescription: "oil works floor"
  keywords: [floor, oil, works, still]
  register: definite
  longDescription: |
    A flagged floor dark with spilled oil, a squat retort standing cold in the corner with a copper coil bent over into its receiver, and racks of casks waiting for the cart.

    Newer than any of it: a riveted iron tower twice the height of a man against the end wall, with a firebox under it and four taps coming off it at four heights, each with a tin label painted by hand. Through the doorway behind it, out in the scorched gravel, there is a pipe on three legs with a bell on top.
  exits:
    # The back door onto the goods yards — a hauler comes in this way to
    # collect what the hand crated, and the hand walks out this way to the
    # cash-and-carry and back.
    southeast:
      destination: /world/terminus/goods-yards/yard
      media: [ground]
      edgeMinutes: 2
  props:
    - /trade/haulage/thing/works-board
    - /world/terminus/goods-yards/oilworks/thing/stock
    # ⭐ The retort the prose has described since the oil works shipped,
    # standing cold in the corner. It was prose and a promise ("the
    # crafted route is a later build"); it is an object now, with its
    # condenser, and it works.
    - /trade/fuel/thing/retort
    - /trade/fuel/thing/condenser
    # ⭐⭐ **The column, and it stands HERE rather than at the wellhead** —
    # which is a fact about freight and the same one that puts a limekiln
    # at a quarry and a saltern at a brine spring, read the other way
    # round. Crude is heavy and worth little; four of its five fractions
    # have buyers in a town and none has a buyer on a hillside. So the
    # barrel travels and the column does not, and the oil works is where
    # the barrel is going.
    #
    # ⚠ It is `/trade/distilling/thing/Still` — the same class, a bigger
    # pot and a hotter fire. What makes it a refinery rather than a still
    # is its SCHEDULE (`separation: fractions`), which is where the
    # difference belongs.
    - /trade/fuel/thing/refinery
    # The cheap answer to the fraction nobody buys, and the conspicuous
    # one: it can be seen from the far side of the valley.
    - /trade/fuel/thing/flare
    # ⭐⭐ **Fuel, in reach of the fire.** The fire build made a burner's
    # fuel a BED somebody fills — before it, a `%` Reserve the row
    # authored once meant a forge arrived pre-fuelled and could never be
    # fed again. The consequence is systemic and this is its content
    # half: **every room with a fire somebody is expected to light needs
    # fuel they can pick up.** Nine rooms did not.
    #
    # ⚠ Bounded props, never a faucet (the fuel yard's own four baskets
    # are the precedent): a starting condition, not a supply. What
    # restocks it is the trade that makes it.
    - { template: /trade/quarrying/thing/coal, count: 4 }
    - { template: /trade/fuel/thing/charcoal, count: 2 }
  cast:
    - /world/terminus/goods-yards/oilworks/agent/hand
