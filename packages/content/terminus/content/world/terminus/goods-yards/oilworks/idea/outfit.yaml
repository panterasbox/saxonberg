# the oil works — an OUTFIT: a Business + a Stock its floor product (lamp-oil
# casks) spawns into + a hand with the `consigns` brain (the shape every
# producer annex repeats). The hand's `hand` position `purchases`, so at hire
# it is dealt the house card and its `wallet use house` / `consign` trade AS
# this business — each resale of a cask at the cash-and-carry splits to this
# operating account. ⭐ Appointed by the Ministry of Trade (matching who holds
# `/trade/fuel`): the fuel trade's producer answers to the fuel trade's office.
class: /platform/idea/Business
data:
  name: "the oil works"
  appointingAuthority:
    kind: office
    office: minister-of-trade
  positions:
    - key: hand
      noun: hand
      label: running the oil works' floor
      wageRate: 3
      purchases: true
  rosterSlots:
    - positionKey: hand
      assignee: /world/terminus/goods-yards/oilworks/agent/hand
      schedule:
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [6, 18] }
  banksAt: goodkin
  operatingLocations:
    - /world/terminus/goods-yards/oilworks/location/floor
    - /world/terminus/goods-yards/oilworks/thing/stock
