# Veshko Distilling — the corpo's OPERATING Business (Veshko the organization
# is capital; this is the yard that trades). `parentOrganization` is the
# chart it hangs off; its `hand` position purchases, so the hand consigns AS
# Veshko Distilling onto the cash-and-carry and each sale lands here.
class: /platform/idea/Business
data:
  name: "Veshko's yard"
  parentOrganization: /corpo/veshko
  appointingAuthority:
    kind: committee
    parcel: /corpo/veshko
  # (sugar D8) The distiller's seat fulfils; with no rule the resolver
  # declines, so the house says who comes over.
  call: rota
  positions:
    - key: hand
      noun: hand
      label: running Veshko's yard
      wageRate: 4
      purchases: true
    # ⭐ (sugar D8) The distiller — the yard's rum is MADE here now, from
    # the Sugar House's molasses, instead of conjured onto the pallet.
    - key: distiller
      noun: distiller
      label: running Veshko's pot still
      wageRate: 5
      headcount: 1
      fulfills: [distilling, fermenting]
      purchases: true
  rosterSlots:
    - positionKey: distiller
      assignee: /world/terminus/goods-yards/veshko/agent/distiller
      schedule:
        - { days: [0, 1, 2, 3, 4, 5], hours: [6, 18] }
    - positionKey: hand
      assignee: /world/terminus/goods-yards/veshko/agent/hand
      schedule:
        # ⭐ Real hours (envelope S8). This authored `[0, 24]` — a house
        # staffed around the clock — which was never true of it and made
        # the night indistinguishable from the day. The `shifts` brain
        # parks off-shift cast in the venue's Offstage, so the street
        # genuinely empties.
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [6, 18] }
  banksAt: goodkin
  operatingLocations:
    - /world/terminus/goods-yards/veshko/location/distillery
    - /world/terminus/goods-yards/veshko/thing/stock
