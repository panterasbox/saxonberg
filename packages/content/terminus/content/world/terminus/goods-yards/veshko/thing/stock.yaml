# Veshko's stock — it names the yard's floor product as lines, each made
# up to par by the reset sweep.
class: /trade/shopkeeping/thing/Stock
data:
  shortDescription: Veshko's stock
  keywords: [stock, pallet, cases, "veshko's", veshko]
  register: proper
  longDescription: Pallets of Volk shrink-wrapped by the hundred, and the unbranded cases behind them.
  discipline: scrum
  attendDurationMs: 0
  staffingPolicy: self-service
  serverPositionKeys: []
  businessPath: /world/terminus/goods-yards/veshko/idea/outfit
  # ⭐ The producer names its lines (the scan sweep's review, 2026-10-15):
  # the reset sweep makes each one up to par here. The goods say nothing
  # about where they are made.
  stockLines:
    - { itemTemplatePath: /trade/distilling/thing/gin, par: 18 }
    # ⭐ (sugar D8) The rum lines import NOTHING now (`par: 0`): the yard's
    # rum comes off its own still, from the Sugar House's molasses, and the
    # shelf holds only what the distiller has made.
    - { itemTemplatePath: /trade/distilling/thing/rum-dark, par: 0 }
    - { itemTemplatePath: /trade/distilling/thing/rum-light, par: 0 }
    - { itemTemplatePath: /trade/distilling/thing/tequila, par: 12 }
    - { itemTemplatePath: /trade/distilling/thing/vodka, par: 18 }
    - { itemTemplatePath: /trade/distilling/thing/whiskey, par: 18 }
    - { itemTemplatePath: /world/terminus/goods-yards/veshko/thing/volk, par: 24 }
  prices: {}
