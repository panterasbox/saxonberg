# the brewery outfit — an OUTFIT: a Business + a Stock its floor product spawns into +
# a hand with the `consigns` brain (the distilling pack's trio, the shape
# every producer annex repeats). The hand's `hand` position `purchases`, so
# at hire it is dealt the house card and its `wallet use house` / `consign`
# trade AS this business — each resale at the cash-and-carry splits to this
# operating account. The annex names the host (the counter); the host
# names nobody.
class: /platform/idea/Business
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: "the brewing outfit"
  appointingAuthority:
    kind: office
    office: prime-minister
  positions:
    - key: hand
      noun: hand
      label: running the brewery outfit's floor
      wageRate: 3
      fulfills: [fermenting]
      purchases: true
  rosterSlots:
    - positionKey: hand
      assignee: /world/terminus/goods-yards/brewing/agent/hand
      schedule:
        # ⭐ Real hours (envelope S8). This authored `[0, 24]` — a house
        # staffed around the clock — which was never true of it and made
        # the night indistinguishable from the day. The `shifts` brain
        # parks off-shift cast in the venue's Offstage, so the street
        # genuinely empties.
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [6, 18] }
  banksAt: goodkin
  operatingLocations:
    - /world/terminus/goods-yards/brewing/location/floor
    - /world/terminus/goods-yards/brewing/location/cold-store
    - /world/terminus/goods-yards/brewing/thing/stock
