# The goods yards — the back of the working city, where every trade
# floor opens onto the same piece of ground.
#
# ⭐ It is the reason the producer floors have doors at all, and the
# doors are the reason a hauler can do the job the hands post. Nothing
# is made here; everything passes through.
class: /platform/location/SingletonCartesianLocation
data:
  shortDescription: goods yards
  keywords: [yards, goods]
  register: definite
  alternateNames: [yard, goods, backs, loading]
  _address: terminus/city/wharfside/goods-yards
  _biomePath: /stuff/idea/biome/outdoor/baseline
  ambientIntensity: 520
  ambientColorTemperature: 5600
  # The cobbles, as a row — the gutter is a detail of them (see the row).
  adornments:
    - template: /world/terminus/goods-yards/thing/yard-paving
      slot: floor
  longDescription: |
    A long cobbled strip behind the working city with doors down both sides and a gutter running the length of it. Every trade on this side of Terminus has a back door here, and every one of them is a different height off the ground because they were all built by different people who were not talking to each other.

    Barrows stand where they were left. There is a smell of six industries at once, and a permanent argument about whose pallets those are.
  coords:
    x: 0
    y: 0
    z: 0
  exits:
    east:
      destination: /world/terminus/wharfside/bank
      media: [ground]
      edgeMinutes: 3
    # ⚠ Each of these has its far half authored in the trade's own pack.
    # Neither pack reaches into the other's files.
    northwest:
      destination: /world/terminus/goods-yards/bottling/location/floor
      media: [ground]
      edgeMinutes: 2
    north:
      destination: /world/terminus/goods-yards/pantry/location/floor
      media: [ground]
      edgeMinutes: 2
    northeast:
      destination: /world/terminus/goods-yards/crowsfoot/location/floor
      media: [ground]
      edgeMinutes: 2
    southeast:
      destination: /world/terminus/goods-yards/hollis/location/floor
      media: [ground]
      edgeMinutes: 2
    south:
      destination: /world/terminus/goods-yards/veshko/location/distillery
      media: [ground]
      edgeMinutes: 2
    southwest:
      destination: /world/terminus/goods-yards/farm/location/yard
      media: [ground]
      edgeMinutes: 4
  # ⭐ The carrier's people wait here, because this is where the work is.
  # The rows are the haulage TRADE's; only the place is Terminus's.
  cast:
    - /trade/haulage/agent/carter
  props:
    - /system/transport/thing/wagon
    # ⭐ The yards' board. Every trade on this side of the city posts on
    # its own floor; this is where a hauler stands to see all of it at
    # once, which is what an intermediary is FOR.
    - /trade/haulage/thing/works-board
    # ⭐⭐ The second assay bench — ROWS AND NOTHING ELSE. Ore arrives
    # here by wagon, so a second opinion without walking a day back to
    # Rejection is worth paying for, and it costs more because it is.
    # Nobody stands at it: you get the furnace, not the eye.
    - /world/terminus/goods-yards/thing/city-assay-bench
    # ⭐⭐ The generic anvil — 200 kg, no `capabilities:`, and
    # `encumbrance.md:286` ships it as THE lift-gate exemplar: the load
    # that is plainly beyond a person and plainly within a cart. It stood
    # nowhere, so the exemplar was a paragraph about an object nobody
    # could try to pick up.
    #
    # ⭐ Here beside the wagon, deliberately: a load that wants a cart
    # standing next to the cart is the encumbrance doc's own pairing, and
    # a hauler's yard is where heavy things are between places.
    #
    # ⚠ It confers NOTHING and declares no capability, so `repair`'s
    # `capability.anvil` is unaffected — that gate is satisfied by the
    # SMITHING anvil propped at the Rejection smelter, which is a
    # different object with a different job.
    - /stuff/thing/gear/anvil
    # ⭐ A brazier — `fire.md`'s *"least of the three: it heats what is
    # immediately around it and little else, and it is the one you can
    # carry into a room that has no chimney."* A loading yard is exactly
    # that room, and men standing around a basket of coals between wagons
    # is what the object is for.
    #
    # ⚠ Propped and not SOLD, which the reachability sweep learned the
    # hard way: a `Hearth` is not chattel-stampable, and a shop good has
    # to be, because `Stock` stamps title on the sale. The sweep's rule
    # (*if a player would plausibly own one it is stock*) had to meet a
    # mechanism it did not know about, and the store's own standup test
    # is what said so.
    - /stuff/thing/brazier
  details:
    doors:
      keywords: [doors, door, backs, entrances]
      description: |
        Six of them, no two alike: a roller shutter, a pair of timber leaves with a wicket cut in one, a loading bay with a lip you could break an ankle on, and three that are just doors. Each has something chalked beside it that only the people who work behind it can read.
    barrows:
      keywords: [barrows, barrow, carts, handcarts, pallets]
      description: |
        A dozen of them along the wall, most empty, one loaded and roped and evidently waiting for somebody who has not come. Nobody owns the ones by the gutter; everybody owns the ones by the doors.
    # ⭐ The `gutter` detail MOVED to the paving row
    # (`thing/yard-paving.yaml`, ground build). A gutter is a feature of the
    # GROUND, not of the space above it. `look gutter` is unchanged — a
    # room's fixtures are in the `reachable` scope.
