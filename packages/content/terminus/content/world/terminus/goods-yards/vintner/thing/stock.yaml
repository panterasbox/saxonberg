# the vintner outfit's stock — the Stock the floor product spawns INTO (every floor
# row's `container:`). No `stockLines` (the spawn sweep is the faucet, never
# a reset), no prices (nothing is sold here — the hand carries it to the
# cash-and-carry and consigns it).
class: /trade/shopkeeping/thing/Stock
data:
  shortDescription: "vintner stock"
  keywords: [stock, pallet, cases, vintner]
  register: definite
  longDescription: "Cases of corked bottles on a cool stone floor, straw between the necks."
  discipline: scrum
  attendDurationMs: 0
  staffingPolicy: self-service
  serverPositionKeys: []
  businessPath: /world/terminus/goods-yards/vintner/idea/outfit
  # ⭐ The producer names its lines (the scan sweep's review, 2026-10-15):
  # the reset sweep makes each one up to par here. The goods say nothing
  # about where they are made.
  stockLines:
    - { itemTemplatePath: /trade/winemaking/thing/wine-bottle, par: 10 }
  prices: {}
