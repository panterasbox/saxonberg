# Hollis Bottling — the corpo's operating Business: a bottling floor that
# DISTILS NOTHING. Hollis private-labels Veshko's liquid (the Kirkland
# fact): Old Hollis is Veshko's whiskey, Hollis Cane is Veshko's rum, and
# the private-label fact is each row's `interiorMaterial` pointer, legible
# on `look`.
class: /platform/idea/Business
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: "the Hollis bottling floor"
  parentOrganization: /corpo/hollis
  appointingAuthority:
    kind: committee
    parcel: /corpo/hollis
  positions:
    - key: hand
      noun: hand
      label: running Hollis's bottling floor
      wageRate: 3
      purchases: true
  rosterSlots:
    - positionKey: hand
      assignee: /world/terminus/goods-yards/hollis/agent/hand
      schedule:
        # ⭐ Real hours (envelope S8). This authored `[0, 24]` — a house
        # staffed around the clock — which was never true of it and made
        # the night indistinguishable from the day. The `shifts` brain
        # parks off-shift cast in the venue's Offstage, so the street
        # genuinely empties.
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [6, 18] }
  banksAt: goodkin
  operatingLocations:
    - /world/terminus/goods-yards/hollis/location/floor
    - /world/terminus/goods-yards/hollis/thing/stock
