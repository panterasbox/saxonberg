# Wren Ashby — the crowsfoot outfit's hand. Holds the outfit's `hand` position
# (`purchases: true`), so at hire the roster tick deals the house card; the
# `consigns` brain then drives the literal verbs — `get`, `wallet use
# house`, `consign … --ask` — carrying the floor stock to the
# cash-and-carry counter and consigning it AS the outfit. The annex names
# the host: the counter path is this config's, never the trade's.
class: /platform/agent/Cast
extends: /stuff/agent/costume/student
data:
  # ⭐ What this person has on comes from the parent row
  # (`/stuff/agent/costume/student`). Until the envelope build no
  # NPC row could author clothing at all — every authored person in
  # the realm was naked, invisible only because every interior was
  # 21 °C by decree.
  name: Wren Ashby
  keywords: [hand, wren, ashby, lean, crowsfoot, apron]
  pronouns: they
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  alternateNames: [wren, ashby]
  shortDescription: lean hand in a Crowsfoot apron
  register: indefinite
  longDescription: |
    A lean, quick person in an ink-stained apron with a crow's foot burned into the bib, carrying a single case as if it were the only one in the world — which, most mornings, it is.
  dispositions:
    - { disposition: diligence, valence: 70 }
    - { disposition: sociability, valence: -40 }
  # ── the dossier ─────────────────────────────────────────────────
  # Evidence, never values: each entry below expands into the same rows a
  # lived history would have written, marked `claim`. Seeded once at
  # onCreate and skipped if any claim already exists, so a reclone or
  # a reboot cannot mint a second history.
  # ⚠ A best-guess pass, explicitly provisional — the considered version
  # is a content pass of its own before go-live.
  archetype: hand
  competence:
    # ⭐ The bands are what the STILL BOOK asks for, not decoration.
    # `distil`/`compound-gin`/`brandy`/`grappa` are all STANDARD, and only
    # `proficient` licenses standard work — at `novice` this yard's own
    # hand could not run this yard's own still, and the refusal arrived
    # with the seat still reading as staffed. `fermenting` was absent
    # altogether, so the easy `wash-mash` refused too and there was
    # nothing for the still to take. (lint:dossiers rule 6.)
    - { discipline: distilling, asserting: proficient }
    - { discipline: fermenting, asserting: competent }
  behaviors:
    # The producing beat (fermentation W6): mash bought malt off the
    # still book, ferment the wash, RUN THE STILL when a back finishes
    # (351 K — the still is its own furnace), compound the gin, and
    # consign spirit AND gin — the neutral spirit is the intermediate
    # good the vintner's fortification buys (the B2B leg). The consigns
    # beat below keeps carrying the FAUCET's cases until the W8
    # switchover.
    - brain: /lib/behavior/cellars
      trigger: candidate
      config:
        home: /world/terminus/goods-yards/crowsfoot/location/floor
        counterRoom: /trade/distribution/location/cash-and-carry
        crushes: [wash-mash]
        buys:
          - { keyword: malt, count: 2 }
          - { keyword: juniper, count: 1 }
        inputKeyword: malt
        inputMin: 1
        vesselCategory: spirit-bottle
        vesselKeyword: bottle
        # ⚠ Retuned by logistics D11: a CRATE, not six loose goods. The

        # carriage is per consignment, so a bigger crate is the same haul

        # and the loop closes in fewer trips.

        batch: 12
        buyEvery: 5
        # The still leg — the hand makes the CUT, with the read it has.
        # No `recipe:` and no `runs:`: a still does not have one output,
        # which is why `distil` retired for four fraction schedules, and
        # a run is not a recipe.
        #
        # What the hand tunes is its CAUTION. `stepL` is how big a pour
        # it takes between sniffs, and the schedule's boundaries do not
        # move for it — so a bold hand overshoots the hearts and a
        # careful one wastes a little. Combined with its `distilling`
        # band, which blurs where it thinks it is, that is the entire
        # difference between this hand's whiskey and a novice's.
        #
        # The hand may NOT read the schedule's true boundary: it goes
        # through `readFraction(hand)`, the same banded read a player
        # gets. A brain reading the real number would cut perfectly every
        # time and the competence model would be decoration.
        distills:
          chargeKeyword: vat
          igniteKeyword: still
          slopKeyword: slop
          vesselKeyword: bottle
          stepL: 0.4
          # The two caution dials, calibrated against the wash schedule
          # on this house's sixty-litre pot, where the hearts run from
          # 0.03 to 0.18 of the charge:
          #
          #   startAfter 1 — throw away one 0.4 L draw after the nose
          #     first calls the hearts. A proficient nose is about 0.3 L
          #     early on this pot, so one draw covers it.
          #   takeUpTo 0.16 — stop at 9.6 L of 60, leaving the last of
          #     the hearts (they end at 10.8 L) in the pot rather than
          #     risking the tails.
          #
          # Both cost yield and both are the point: a hand that cut to
          # the last drop would ruin the bottle on its final pour,
          # because a top-up is weakest-link on grade.
          startAfter: 1
          takeUpTo: 0.16
          compounds: [compound-gin]
        asks:
          spirit: 9
          "house gin": 12
          gin: 12
          grappa: 11
          brandy: 14
    - brain: /trade/shopkeeping/behavior/consigns
      trigger: candidate
      config:
        stock: /world/terminus/goods-yards/crowsfoot/thing/stock
        shelf: /world/terminus/counting-houses/distributor/thing/counter
        # ⚠⚠ `board`, `crate` and `carriage` USED to sit here — the
        # posting version of this beat, from before the hand could
        # walk. `consigns` reads none of them, so they were three keys
        # that looked like configuration and were configuration of
        # nothing. Removed rather than left: a dead key in a row is the
        # quietest lie a content tree can tell.
        #
        # ⚠ Six a beat: the smallest floor, and a walk to the counter and
        # back is the same walk whatever the hand is carrying.
        batch: 6
        ask:
          spirit:crowsfoot-gin: 40
          # The specialties: a small house's real position. Dearer than
          # the corpo's rail, and the menu cannot do without them.
          spirit:bitters: 14
          spirit:orange-liqueur: 22
          spirit:bitter-liqueur: 24
          spirit:aperitivo: 20
    - brain: /lib/behavior/greets
      trigger: arrival
      config:
        lines:
          - "Help you?"
          - "Mind the barrels by the door."
          - "If you're after the counter, it's not here."
    - brain: /lib/behavior/idles
      trigger: candidate
      config:
        pool:
          - { kind: free, value: "squares a case on the pallet and chalks a tally on its side." }
          - { kind: free, value: "checks a wax seal with a thumbnail." }
