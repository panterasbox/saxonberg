# The crowsfoot outfit — The small place across town that makes Crowsfoot Gin — independent, carried by no corpo.
# An OUTFIT: a Business + a Stock its floor product spawns into + a hand
# with the `consigns` brain. The hand's `hand` position `purchases`, so at
# hire it is dealt the house card (EmploymentLogic, libations 3d) and its
# `wallet use house` / `consign` trade AS this business — each resale at
# the cash-and-carry splits to this operating account.
class: /platform/idea/Business
data:
  name: "Crowsfoot"
  appointingAuthority:
    kind: office
    office: prime-minister
  # Who comes over: `rota` — the least-recently-called able hand. No
  # relational leg, because a floor has no regulars and should not pretend
  # to. See docs/subsystems/employment.md.
  call: rota
  positions:
    - key: hand
      noun: hand
      label: running the Crowsfoot outfit's floor
      wageRate: 3
      # ⭐ `malting` added by the whiskey-styles build. The floor has had
      # a malting floor and a kiln on it since the predecessor shipped,
      # and NOBODY SEATED HERE FULFILLED THE TRADE — so `lint:menu-staff`
      # was keeping `steep-barley` and `kiln-malt` off the still book,
      # which in turn left the shipped wire drive asserting two lines the
      # book does not offer. The capability has to exist on the seat
      # before the board may advertise it.
      fulfills: [distilling, fermenting, malting]
      purchases: true
  rosterSlots:
    - positionKey: hand
      assignee: /world/terminus/goods-yards/crowsfoot/agent/hand
      schedule:
        # ⭐ Real hours (envelope S8). This authored `[0, 24]` — a house
        # staffed around the clock — which was never true of it and made
        # the night indistinguishable from the day. The `shifts` brain
        # parks off-shift cast in the venue's Offstage, so the street
        # genuinely empties.
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [6, 18] }
  banksAt: goodkin
  operatingLocations:
    - /world/terminus/goods-yards/crowsfoot/location/floor
    - /world/terminus/goods-yards/crowsfoot/thing/stock
