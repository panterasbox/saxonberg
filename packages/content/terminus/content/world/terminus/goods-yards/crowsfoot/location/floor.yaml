# The crowsfoot outfit's floor — a `warehouse` instance: the racking, the
# outfit's Stock (the floor rows' home `container:` — the sweep stands them
# at target here) and the hand whose `consigns` beat carries them to the
# cash-and-carry. No exits: the hand teleports (the `shifts` shape); a walk
# is the locomotion slate's.
# An ordinary location, not a FurnishableRoom: that class is the
# FURNISHING archetypes' base. A trade floor's durability lives on its
# persistable fixtures (the Stock, the racking, the counter) — the
# consigned goods and their listings ride those, never the room; the
# `populates` set below is the placement and respawns each boot.
class: /platform/location/SingletonCartesianLocation
data:
  # ⚠ `coords:` is the MEMBERSHIP operation — `setCoords` is the only way
  # an authored row joins a zone, so without it this floor was in no grid
  # and inherited nothing from one. See the zone row beside it.
  coords:
    x: 0
    y: 0
    z: 0
  shortDescription: Crowsfoot outfit's floor
  keywords: [floor, yard, warehouse, crowsfoot, "outfit's", outfit]
  register: definite
  longDescription: |
    A small, tidy yard, and a working one now: the copper still gleams over its firebox, the scarred tun steams by the standpipe, two wash vats stand crusted at the tide line, and the still book hangs on its chain. Cases and empty square bottles queue on the pallet.
  # ⭐ No ambient of its own: this room is LIT BY SPILL from
  # the yard, through a doorway that stands open. The light walk
  # already carries daylight one hop at full strength, so the room is
  # bright by day and DARK at night — which is the whole point, and it
  # costs no authored number at all.
  # A working still-house: the wash's happy middle.
  _temperature: 289
  # It displaces its own air while the backs work (P11).
  reserves:
    air:
      capacityValue: 100
      currentValue: 100
      unit: "%"
  exits:
    # ⭐ The back door onto the goods yards — the one room the D11
    # switchover cost. The hand does not travel; a HAULER comes in this
    # way to collect what the hand crated and posted about.
    southwest:
      destination: /world/terminus/goods-yards/yard
      media: [ground]
      edgeMinutes: 2
  props:
    # ⭐ The works board, ON the floor — and it is for PEOPLE.
    #
    # ⚠ It shipped with a different reason: the hand was going to post
    # what wanted moving instead of travelling. The hand WALKS instead
    # (D11's literal reading, once the floor had a door), so nothing on
    # this board is posted by an NPC. It is where the outfit's own
    # proprietor posts carriage, and it is what a hauler standing here
    # reads — including `jobs --origin here`, the backhaul.
    - /trade/haulage/thing/works-board
    - /trade/distilling/thing/racking
    - /world/terminus/goods-yards/crowsfoot/thing/stock
    - /trade/distilling/thing/still
    - /trade/distilling/thing/mash-tun
    - /trade/distilling/thing/standpipe
    - /trade/distilling/thing/still-book
    - /trade/distilling/thing/vat
    - /trade/distilling/thing/vat
    # ⭐ The run's three vessels, and the floor is incomplete without
    # them: the foreshots have to go somewhere that is not the spirit
    # (the slop bucket), the hearts have to go somewhere (the cask), and
    # the wash bucket was already here for the mash.
    - /trade/distilling/thing/slop-bucket
    - /trade/distilling/thing/cask
    - /trade/distilling/thing/wash-bucket
    # ⭐⭐ The floor maltings. A distillery that malts its own barley is
    # historically the ordinary case rather than the exotic one — most
    # Scotch houses had a floor and a kiln on site until the maltsters
    # centralised — and it is what closes the vertical: the barley a
    # player grew becomes the malt their own mash wants, on this floor,
    # with no sack bought from anybody.
    #
    # ⛔⛔ These three lines BROKE THE BOOT for two drive runs, and the
    # cause was one missing line in the REPO ROOT's `package.json`. The
    # shipped pack set is `contentDepsOf(deploymentRoot/package.json)`
    # (`PackLogic.packNamesFromDeployment`), and a pack absent from it is
    # never discovered — so `StagedMixin.applyProps` found no template
    # here and `BootstrapManager` died cloning the floor. Adding the pack
    # as a dependency of TERMINUS, which is what names these rows, only
    # affects install ORDER (`dependsOnOf`); it does not ship the pack.
    #
    # ⭐ Nothing but a boot could see it: the rows are all correct on
    # disk, so the suite passed and `lint:census` clause (b) passed. The
    # wire harness's own `packs:` declaration is the one check in the
    # repo that asserts a pack actually INSTALLED.
    - /trade/malting/thing/malting-floor
    - /trade/malting/thing/malt-kiln
    - /trade/malting/thing/malt-sack
    # ⭐⭐ The quern — and it is the link the vertical was MISSING.
    #
    # ⛔ Malt has to be ground to grist before the mash can have it, and
    # until 2026-10-05 no mill in the realm could make grist: both mill
    # rows pinned one product material and it was wheat flour, so a malt
    # sack ground anywhere came out as flour nothing asks for. Every
    # grain of grist in the world came off the distributor's counter, and
    # the predecessor's live drive stopped dead at *"There isn't enough
    # grist."* The fix is the mill's `products:` table; this row is what
    # puts the act where the malt is.
    #
    # ⚠ A quern is the BOTTOM rung and that is deliberate: 0.25 kg a
    # game-minute, both hands on the handle, no toll and no control band.
    # A house that grinds its own malt pays in time; the reason to walk a
    # sack to a water mill is that the mill is faster, and the reason not
    # to is the multure. Neither is authored — both fall out of the rows.
    - /trade/milling/thing/quern
  cast:
    - /world/terminus/goods-yards/crowsfoot/agent/hand
