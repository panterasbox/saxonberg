# The Crowsfoot outfit's stock — the Stock the floor product spawns INTO (every crowsfoot row's
# `container:`). No `stockLines` (the spawn sweep is the faucet, never a
# reset), no prices (nothing is sold here — the hand carries it to the
# cash-and-carry and consigns it). Composes the shelf mixin like every
# Stock, unused here.
class: /trade/shopkeeping/thing/Stock
data:
  shortDescription: crowsfoot stock
  keywords: [stock, cases, pallet, bottles, crowsfoot]
  register: definite
  longDescription: A pallet of cased bottles waiting for the dray — the Crowsfoot outfit's run, stacked by the door.
  discipline: scrum
  attendDurationMs: 0
  staffingPolicy: self-service
  serverPositionKeys: []
  businessPath: /world/terminus/goods-yards/crowsfoot/idea/outfit
  # ⭐ The producer names its lines (the scan sweep's review, 2026-10-15):
  # the reset sweep makes each one up to par here. The goods say nothing
  # about where they are made.
  stockLines:
    - { itemTemplatePath: /trade/distilling/thing/aperitivo, par: 12 }
    - { itemTemplatePath: /trade/distilling/thing/bitter-liqueur, par: 12 }
    - { itemTemplatePath: /trade/distilling/thing/bitters, par: 12 }
    - { itemTemplatePath: /trade/distilling/thing/crowsfoot-gin, par: 3 }
    - { itemTemplatePath: /trade/distilling/thing/empty-spirit-bottle, par: 10 }
    - { itemTemplatePath: /trade/distilling/thing/orange-liqueur, par: 12 }
  prices: {}
