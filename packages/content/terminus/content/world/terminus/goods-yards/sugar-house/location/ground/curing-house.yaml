# The curing house — ⭐ a PersistentLocale (sugar D20): loaves set in
# their cones over days while the molasses drains into the pots below;
# a restart must not lose a draining cone (W2).
class: /platform/location/PersistentLocale
data:
  coords: { x: 0, y: 1, z: 0 }
  shortDescription: "curing house"
  keywords: [house, "curing house", curing]
  register: definite
  _biomePath: /stuff/idea/biome/indoor/baseline
  enclosure: { material: /stuff/idea/material/ceramic/brick, thicknessM: 0.23 }
  roof: { material: /stuff/idea/material/rock/slate, thicknessM: 0.01 }
  longDescription: |
    A long dim room racked from end to end with stands, made to hold clay cones point-down over pots. It smells of molasses, and the floor under the racks is dark with it. The boiling floor is back through the door south.
  props:
    - { template: /trade/sugar/thing/cone, count: 3 }
    - { template: /trade/sugar/thing/curing-pot, count: 3 }
    - /trade/sugar/thing/sugar-nips
    # Wet clay for the loaves' bases (sugar W4).
    - { template: /trade/quarrying/thing/clay, count: 4 }
