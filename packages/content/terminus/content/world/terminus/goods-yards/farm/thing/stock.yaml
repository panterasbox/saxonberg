# the farm's stock — the Stock the floor product spawns INTO (every floor
# row's `container:`). No `stockLines` (the spawn sweep is the faucet, never
# a reset), no prices (nothing is sold here — the hand carries it to the
# cash-and-carry and consigns it).
class: /trade/shopkeeping/thing/Stock
data:
  shortDescription: "farm's stock"
  keywords: [stock, pallet, cases, "farm's", farm]
  register: definite
  longDescription: "Crates stacked under a wet sack, the smell of citrus and cut mint."
  discipline: scrum
  attendDurationMs: 0
  staffingPolicy: self-service
  serverPositionKeys: []
  businessPath: /world/terminus/goods-yards/farm/idea/outfit
  # ⭐ The producer names its lines (the scan sweep's review, 2026-10-15):
  # the reset sweep makes each one up to par here. The goods say nothing
  # about where they are made.
  stockLines:
    - { itemTemplatePath: /trade/farming/thing/crate-of-cherries, par: 4 }
    - { itemTemplatePath: /trade/farming/thing/crate-of-cranberries, par: 4 }
    - { itemTemplatePath: /trade/farming/thing/crate-of-grapefruits, par: 4 }
    - { itemTemplatePath: /trade/farming/thing/crate-of-grapes, par: 4 }
    - { itemTemplatePath: /trade/farming/thing/crate-of-juniper, par: 3 }
    - { itemTemplatePath: /trade/farming/thing/crate-of-lemons, par: 4 }
    - { itemTemplatePath: /trade/farming/thing/crate-of-limes, par: 6 }
    - { itemTemplatePath: /trade/farming/thing/crate-of-mint, par: 4 }
    - { itemTemplatePath: /trade/farming/thing/crate-of-olives, par: 4 }
    - { itemTemplatePath: /trade/farming/thing/crate-of-oranges, par: 4 }
  prices: {}
