# The bakery — the Business entity behind the counter.
class: /platform/idea/Business
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  appointingAuthority:
    kind: entity
    path: /world/terminus/market/agent/baker
  positions:
    - key: baker
      noun: baker
      label: at the oven
      wageRate: 4
      fulfills: [baking]
  rosterSlots:
    - positionKey: baker
      assignee: /world/terminus/market/agent/baker
      schedule:
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [0, 24] }
  banksAt: goodkin
  operatingLocations:
    - /world/terminus/market/bakery
    # ⚠⚠ The COUNTER, too. A sale settles against the business that
    # operates the STOCK's own path (`BuyController.settleSale` →
    # `ensureOperatorAt(stock.getTemplatePath())`) — the general store
    # and the market stalls both list their counter here — and with only
    # the room listed, every `buy loaf` at this bakery answered
    # "insufficient-funds" whatever the buyer held. Nobody had ever bought
    # a loaf: the grain-chain drive accepted "it sells OR it says why".
    # Found by the nutrition-and-fitness drive.
    - /world/terminus/market/thing/bread-counter
