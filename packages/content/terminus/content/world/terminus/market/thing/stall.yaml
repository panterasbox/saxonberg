# A RENTED stall — the seed every player's stall is minted from (economic
# bootstrap D15). Never placed as itself: `stall rent` clones it keyed to
# the PITCH it stands on
# (`/world/terminus/market/thing/stall/world/terminus/market/stalls/3`,
# the square's fixture row as the prefix) so two stalls on one square are
# two counters, two houses, two accounts.
#
# ⭐⭐ Keyed on the pitch, not the renter. A key is relative to the thing
# that MANAGES it, and the square's fixture manages pitches — so the
# counter's substance is *which spot on the square this is*, and **who
# rents it** lives on the house's `appointingAuthority`, where it
# belongs. Keying on the renter read as *the stall of whoever that is*,
# let a square hand out unbounded stalls, and put the counter in a
# population the `(scope, key)` uniqueness invariant could not scan.
# A brokerage counter that takes goods on supplier TERMS: no lines,
# nothing cloned to par, every good on it somebody's until sold.
class: /trade/shopkeeping/thing/Stock
data:
  shortDescription: rented stall
  keywords: [stall, counter, trestle]
  register: indefinite
  longDescription: |
    A trestle under canvas, its boards still pale — rented by the week, chalked with whatever its keeper has to sell.
  discipline: scrum
  attendDurationMs: 0
  staffingPolicy: self-service
  serverPositionKeys: []
