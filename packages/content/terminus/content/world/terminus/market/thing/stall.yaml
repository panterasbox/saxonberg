# A RENTED stall — the seed every player's stall is minted from (economic
# bootstrap D15). Never placed as itself: `stall rent` clones it with the
# renter's identity (`/world/terminus/market/thing/stall/<their key>`) so
# two stalls on one square are two counters, two houses, two accounts.
# A brokerage counter that takes goods on supplier TERMS: no lines,
# nothing cloned to par, every good on it somebody's until sold.
class: /platform/thing/Stock
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: rented stall
  keywords: [stall, counter, trestle]
  register: indefinite
  longDescription: |
    A trestle under canvas, its boards still pale — rented by the week, chalked with whatever its keeper has to sell.
  discipline: scrum
  attendDurationMs: 0
  staffingPolicy: self-service
  serverPositionKeys: []
  businessPath: ""
  purchasing: terms
  stockLines: []
  prices: {}
