# The vestibule — the door off the square, the slate, the attendant's desk.
class: /platform/location/PersistentCartesianLocation
data:
  coords: { x: 0, y: 0, z: 0 }
  # ⭐ Daylight through the high windows (the light-sources rule).
  ambientSource: sky
  ambientOpening: windows
  shortDescription: bathhouse vestibule
  keywords: [vestibule, bathhouse, entrance, hall]
  register: definite
  longDescription: |
    A warm tiled hall that smells of steam and soap, with a bench along one wall for boots and a slate by the inner door with the prices on it. Warm damp air comes through from the baths beyond; a second door, propped open, gives onto the thump of a gymnasium.
  exits:
    south:
      destination: /world/terminus/market/square
      media: [ground]
      edgeMinutes: 1
    north:
      destination: /world/terminus/market/bathhouse/location/baths
      media: [ground]
      edgeMinutes: 1
    east:
      destination: /world/terminus/market/bathhouse/location/gym
      media: [ground]
      edgeMinutes: 1
  props:
    - /world/terminus/market/bathhouse/thing/tariff
  cast:
    - /world/terminus/market/bathhouse/agent/attendant
  details:
    windows:
      keywords: [windows, window]
      description: High small windows, misted on the inside, letting in a grey daylight.
