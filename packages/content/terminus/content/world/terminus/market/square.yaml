# The market square — where grown produce changes hands LOOSE (D4: no
# crates; a lime on the stall was picked by somebody). One square, one
# stall fixture, a municipal operator business: a farmer consigns at
# their own ask, a keeper (or anyone hungry) buys, the split pays the
# consignor and the market's commission.
#
# An ordinary Room (the shop-floor shape): the stall is `props`
# (a fresh clone each boot), and durability lives where it belongs — on
# the STALL, whose own persistable record carries the consigned goods
# and listings (the general store's consignment-shelf pattern).
#
# Its own zone (`/world/terminus/market`), but addressed under the
# counting-houses Locality — it opens off that street, so no new address
# node is minted (the slim-roster discipline, the general-store
# precedent).
#
# NORTHEAST back up the lane to the avenue block (cross-zone, both sides
# explicit — the block declares SOUTHWEST here).
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  # ⭐⭐ The town lights this street (envelope W5) — a PROPERTY of the
  # street, not objects on it. NOTHING IS MINTED: nobody binds a street
  # lamp, and one identical fuelled object per street would be forty-one
  # fuel reserves reconciling to produce the same number. Whether the
  # lamps are burning right now is DERIVED — the service is funded, it is
  # after dusk, therefore they burn.
  # The square is lit SECOND: if the money runs short it is the square that goes dark, and that order was written down in advance.
  publicLighting:
    flux: 400
    colorTemperature: 2200
    detail: lamps
    seniority: 2
  shortDescription: farmers market square
  keywords: [square, farmers, market]
  register: definite
  alternateNames: [market, "farmers market", stalls]
  _biomePath: /stuff/idea/biome/outdoor/baseline
  _address: terminus/city/counting-houses/market-square
  # ⭐⭐ Rung 2: three words, no floor row. The square's prose says
  # *"a cobbled square"*, and this is all it takes to make that true —
  # granite, dressed, and the derivation does the rest (sky-exposed ⇒ on
  # grade ⇒ `set-paving`). ⚠ **Same inputs as the goods yards' paving, so
  # the same answer**, and neither room chose it: that is AC 17, and the
  # reason the kind is derived rather than authored.
  floor:
    material: /stuff/idea/material/rock/granite
    worked: true
    # `onGrade` said out loud rather than left to derive. The derivation
    # agrees — this room is sky-exposed — so this documents intent rather
    # than working around anything, exactly as the crossing's and the goods
    # yards' own floor rows already do. ⚠ It was added while the drive was
    # reading `slab` here, which turned out to be the biome roster never
    # being warmed (`BiomeCatalogue`, fixed in this build); the line is kept
    # because a street IS on grade and a reader should not have to derive it.
    onGrade: true
  longDescription: |
    A cobbled square opening off a side lane of the counting-houses, strung with bunting somebody rehangs every season and nobody remembers hanging first. Trestle stalls stand in a rough ring under canvas, crates-turned-tables stacked with whatever came in this morning; the chalkboard over the long produce stall lists growers' asks in a dozen hands. It smells of bruised mint and orange peel, and argues pleasantly with itself from open to close.
  coords:
    x: 0
    y: 0
    z: 0
  exits:
    northeast:
      destination: /world/terminus/counting-houses/avenue-block
    # ⭐ South to the water. Terminus is built on a confluence and until
    # this build there was nowhere in it you could stand and see one.
    south:
      destination: /world/terminus/wharfside/bank
    # ⭐ West to the bakery — the first of the four the general store
    # fragments into (`settlement-model.md`'s specialization gradient).
    # `west` was free.
    west:
      destination: /world/terminus/market/bakery
  props:
    - /world/terminus/market/stalls
    # ⭐ The fish stall — a second consignment counter (fishing D11),
    # kept by the fishmonger on the market's roster.
    - /world/terminus/market/thing/fish-stall
  cast:
    - /world/terminus/market/agent/fishmonger
  details:
    lamps:
      keywords: [lamps, lamp, standards, lighting]
      description: |
        Fluted iron standards at the corners, each with a glass head on a cross-bar and a lamplighter's notch worn into the post at shoulder height.
    bunting:
      keywords: [bunting, canvas, awnings]
      description: |
        Faded triangles of cloth on twine, sun-bleached to shades that were probably once corporate colors. Nobody claims them; everybody re-hangs them.
    chalkboard:
      keywords: [chalkboard, board, asks, prices]
      description: |
        The growers' board: names and asks in chalk, a dozen hands, some crossed out with the day's luck. The stall settles each sale to the grower named on it.
