  longDescription: |
    A small walled bed behind the infirmary, laid out in damp grey soil and cold stone. Greywort stands hooded in the wet corner; wardmoss spreads over a north-facing stone; a pollarded willow leans by the wall. An earthenware pot of water waits on a bench for steeping.
