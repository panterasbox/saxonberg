# Aldis Verrow — the infirmary's physician, and the reason the door is
# open between seven and seven.
#
# ⭐ She now PRACTISES (recovery D9): the `nurses` brain triages the room
# on a cadence and dresses a wound (from the ward's real, finite bandage
# supply) or sits with the worst patient — through the same body primitives
# a player uses, deterministically, no roll. What is still deferred is the
# graded DIAGNOSIS (`treat … for`): she never guesses a condition, which is
# medic-judgment's build. `order treatment` remains the kernel-orchestrated
# paid path beside her.
class: /platform/agent/Cast
extends: /stuff/agent/costume/student
data:
  # ⭐ What this person has on comes from the parent row
  # (`/stuff/agent/costume/student`). Until the envelope build no
  # NPC row could author clothing at all — every authored person in
  # the realm was naked, invisible only because every interior was
  # 21 °C by decree.
  # ⭐ The base three come from the parent; this row adds what is
  # different about THIS person.
  costume:
    - /stuff/thing/clothes/white-coat
  name: Aldis Verrow
  keywords: [physician, aldis, verrow, spare, unhurried]
  pronouns: she
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  alternateNames: [aldis, verrow, doctor, medic]
  shortDescription: spare, unhurried physician
  register: indefinite
  longDescription: |
    A spare woman in her fifties with her sleeves turned back to the elbow and her hair pinned out of the way, entirely unhurried in a manner that is plainly a decision rather than a temperament. She looks at a wound the way a mason looks at a wall — for how it was made, and what it will want.
  dispositions:
    - { disposition: diligence, valence: 70 }
    - { disposition: sociability, valence: 25 }
  archetype: physician
  competence:
    - { discipline: medicine, asserting: proficient }
  behaviors:
    - brain: /lib/behavior/shifts
    - { brain: /trade/medicine/behavior/nurses, cadenceMs: 20000 }
