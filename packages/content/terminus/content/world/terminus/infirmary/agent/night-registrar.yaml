# The night registrar — a role, not a name (an Extra). Runs the same
# `banks` brain as the day registrar but QUIET (blood build D14): she
# never shouts a shortage at 3 a.m. (no room `say`), though the floor
# still gets served and the ticker still gets the notice.
class: /platform/agent/Extra
extends: /stuff/agent/costume/student
data:
  costume:
    - /stuff/thing/clothes/white-coat
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  shortDescription: night registrar
  keywords: [registrar, night, night-registrar]
  register: indefinite
  longDescription: |
    The night hand at the window — a quiet figure behind the bars, a lamp
    turned low, who sees to what comes in after dark and says little.
  dispositions:
    - { disposition: diligence, valence: 55 }
    - { disposition: sociability, valence: -30 }
  behaviors:
    - brain: /trade/medicine/behavior/banks
      trigger: candidate
      config:
        window: /world/terminus/infirmary/thing/blood-window
        quiet: true
    # ⭐ The night keeper knows the Decree too (W6 drive finding: the day
    # registrar is off-shift at night, so without this the window's history
    # is untellable after dark).
    - brain: /lib/behavior/tree-dialogue
      trigger: engage
      config:
        entry:
          - node: decree
        nodes:
          decree:
            beat: >-
              The night keeper sets down her lamp. "We keep the name.
              Goodkin hasn't run this window since the Decree — they kept
              the collecting and the carting, where the money was, and left
              us the giving away. The sign's theirs. The blood's yours."
            choices:
              - { line: "So Goodkin runs the blood bank?", to: correction }
              - { line: "Thanks.", to: end }
          correction:
            beat: >-
              "Goodkin runs the carts. The window is ours. The name over the
              door is a ghost."
            choices:
              - { line: "Understood.", to: end }
          end:
            beat: '"Mind how you go."'
