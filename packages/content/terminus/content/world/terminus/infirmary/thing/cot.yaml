# A cot — a rest surface, so lying on one is worth something (metabolism
# recovers by posture × restQuality on its own reconcile clock). ⭐ It is
# the shipped `Chair` class: the posture-bearing slot is authored per row,
# which is exactly why a bed needs no class of its own and why a cot needs
# none either.
#
# ⭐⭐ **Two rest numbers, and they mean different things (recovery build).**
# `restQuality` is how good a night's SLEEP it is (stamina); `convalescence`
# is how fast a WOUND knits on it (`Vitals.convalescenceFactor`). A clinic
# cot mends wounds faster than a home four-poster (`convalescence: 2.0` →
# lying gives `k = 1.0 × 1.5 × 2.0 = 3.0`) without being a better night's
# sleep than one (`restQuality 1.5` < a four-poster's 2.0). Before this the
# cot's `restQuality` was 0.7 — worse for recovery than open ground, the
# inversion the build set out to fix.
class: /platform/thing/Chair
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: low cot
  keywords: [cot, bed, bunk, low]
  register: indefinite
  longDescription: |
    A low wooden cot with a straw tick and a folded grey blanket at its foot, the frame rubbed pale where hands have gripped it.
  slots:
    - name: surface
      accepts: PosturedMixin
      capacity: 1
      # ⚠ The posture vocabulary is `lie`/`sit` (the shipped bed fixture's
      # tokens), not `lying`/`sitting`, which named no posture and left the
      # cot un-liable — the convalescence demo depends on lying on it.
      postures: [lie, sit]
  restQuality: 1.5
  convalescence: 2.0
