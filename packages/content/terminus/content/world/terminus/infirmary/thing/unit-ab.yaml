# A Goodkin unit of type ab blood on the collection floor (blood build
# D13). Extends the trade's base unit (the collection floor names it as a
# line), and adds the `_brandKey` that marks it a product of Goodkin
# Bloodworks — so the upstream's units carry the corpo mark, while a player's donated bag is
# unbranded (the gift is legibly not the corpo's).
class: /trade/medicine/thing/BloodUnit
extends: /trade/medicine/thing/unit/ab
data:
  censusKey: blood:ab
  donorKey: /world/terminus/infirmary/idea/bloodworks
  _brandKey: goodkin-bloodworks
