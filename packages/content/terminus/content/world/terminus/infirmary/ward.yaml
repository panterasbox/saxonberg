# The infirmary ward. One room off the Counting-House Row block
# (SOUTHWEST back to the street; the block declares NORTHEAST in here —
# cross-zone cardinal exit, both sides explicit), on the same walk as the
# store and the bank.
class: /platform/location/SingletonCartesianLocation
data:
  shortDescription: infirmary
  keywords: [infirmary]
  register: definite
  alternateNames: [ward, clinic, surgery]
  _address: terminus/city/counting-houses/infirmary
  longDescription: |
    A low white room that smells of lye and boiled linen. Two cots stand along the far wall under a window with the shutters folded back; between them a scrubbed deal table holds a basin, a jug, and a roll of clean cloth. A tall cabinet by the door is stacked with folded dressings, and beside it a slate lists what the house does and what the house charges, in a small square hand that has written it many times. There is a chair by the near cot, angled for sitting with somebody. Set into the inner wall is a low barred blood window, cold air sighing off the fridge behind it; over it hangs a dead Goodkin sign, GOODKIN BLOODWORKS in grey unlit tubes, and a door east leads back to the collection room.
  coords:
    x: 0
    y: 0
    z: 0
  exits:
    southwest:
      destination: /world/terminus/counting-houses/avenue-block
    # ⭐ The physic garden (clinical-medicine D10) — where the infirmary
    # grows its simples; harvest and steep the drug supply.
    north:
      destination: /world/terminus/infirmary/garden
    # ⭐ The collection room (blood build D13) — Goodkin's kept upstream,
    # where the units are drawn and the runner carries from.
    east:
      destination: /world/terminus/infirmary/collection
  adornments:
    # ⭐ The ghost sign (blood build D12): a DEAD Goodkin neon over the
    # window — the Paramount Decree made literal. Zero light.
    - { template: /world/terminus/infirmary/thing/goodkin-sign, slot: sign:goodkin }
    # ⭐ A lit wall sconce so the clinic (and its blood window) can be SEEN
    # after dark — the ward is daylit by day and would be pitch black at
    # night otherwise.
    - { template: /world/terminus/infirmary/thing/ward-lamp, slot: lamp:ward }
  props:
    - /world/terminus/infirmary/thing/tariff
    # ⭐ The blood window (blood build D2) — the registrar's counter, a
    # priced board that is also the bank register reading the fridge.
    - /world/terminus/infirmary/thing/blood-window
    - /world/terminus/infirmary/thing/cot
    - /world/terminus/infirmary/thing/dressing-cabinet
    # ⭐ Cold storage (cold-storage build): a powered blood fridge on the
    # avenue feeder keeps the ward's blood bags cold for weeks, with a colder
    # freezer compartment that makes ice; a carried cooler walks a unit to a
    # hunt off the grid.
    - /world/terminus/infirmary/thing/blood-fridge
    - /stuff/thing/vessel/cooler
    # ⭐ The trade's instruments (recovery build) — the splint backs `set`,
    # the surgeon's kit backs `operate`, and a vial of antivenin backs
    # `dose`. Kept here so the ward can actually treat every wound, not
    # just dress the ones a bandage reaches. Rows are trade-medicine's
    # (terminus now depends on it).
    - /trade/medicine/thing/splint
    - /trade/medicine/thing/surgical-kit
    - /trade/medicine/thing/antivenin-vial
    # ⭐ The basin is REAL water now (recovery build) — it affords `scrub`
    # (clean hands between patients), `rinse` and `cool`. The prose already
    # names a basin; this makes it a working water source.
    - /stuff/thing/fixture/basin
    # The clinic's dressing supply — real bandages the nurse's brain dresses
    # wounds with, and that RUN OUT (each is spent by one dressing).
    - /world/terminus/infirmary/thing/bandage-1
    - /world/terminus/infirmary/thing/bandage-2
    - /world/terminus/infirmary/thing/bandage-3
    # ⭐ The clinical-medicine kit (blood + operations + drugs): the
    # syringe backs bleed/transfuse/test, the suture kit backs suture, the
    # pad backs prescribe, the bags hold blood + saline, and a vial of
    # grey-draught is the clinic's anaesthetic stock.
    # ⚠ An instrument affords its verb to whoever CARRIES it (the
    # `environment` bucket flows up the containment chain), so the ward
    # keeps two of the shared ones — the doctor and the nurse each take a
    # set, and a player finds one to pick up.
    - { template: /trade/medicine/thing/syringe, count: 2 }
    - /trade/medicine/thing/suture-kit
    - { template: /trade/medicine/thing/prescription-pad, count: 2 }
    - /trade/medicine/thing/surgical-kit
    - /trade/medicine/thing/blood-bag
    - /trade/medicine/thing/blood-bag
    - /trade/medicine/thing/saline-bag
    - /trade/medicine/thing/grey-draught-vial
  cast:
    - /world/terminus/infirmary/agent/physician
    - /world/terminus/infirmary/agent/nurse
    # ⭐ The blood window's registrars (blood build D11) — spawned here;
    # their roster stations them at the ward where the window stands.
    - /world/terminus/infirmary/agent/registrar
    - /world/terminus/infirmary/agent/night-registrar
