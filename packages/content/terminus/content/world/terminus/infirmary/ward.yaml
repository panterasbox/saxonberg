# The infirmary ward. One room off the Counting-House Row block
# (SOUTHWEST back to the street; the block declares NORTHEAST in here —
# cross-zone cardinal exit, both sides explicit), on the same walk as the
# store and the bank.
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: infirmary
  keywords: [infirmary]
  register: definite
  alternateNames: [ward, clinic, surgery]
  _address: terminus/city/counting-houses/infirmary
  longDescription: |
    A low white room that smells of lye and boiled linen. Two cots stand along the far wall under a window with the shutters folded back; between them a scrubbed deal table holds a basin, a jug, and a roll of clean cloth. A tall cabinet by the door is stacked with folded dressings, and beside it a slate lists what the house does and what the house charges, in a small square hand that has written it many times. There is a chair by the near cot, angled for sitting with somebody.
  coords:
    x: 0
    y: 0
    z: 0
  exits:
    southwest:
      destination: /world/terminus/counting-houses/avenue-block
  props:
    - /world/terminus/infirmary/thing/tariff
    - /world/terminus/infirmary/thing/cot
    - /world/terminus/infirmary/thing/dressing-cabinet
    # ⭐ The trade's instruments (recovery build) — the splint backs `set`,
    # the surgeon's kit backs `operate`, and a vial of antivenin backs
    # `dose`. Kept here so the ward can actually treat every wound, not
    # just dress the ones a bandage reaches. Rows are trade-medicine's
    # (terminus now depends on it).
    - /trade/medicine/thing/splint
    - /trade/medicine/thing/surgical-kit
    - /trade/medicine/thing/antivenin-vial
    # ⭐ The basin is REAL water now (recovery build) — it affords `scrub`
    # (clean hands between patients), `rinse` and `cool`. The prose already
    # names a basin; this makes it a working water source.
    - /stuff/thing/fixture/basin
    # The clinic's dressing supply — real bandages the nurse's brain dresses
    # wounds with, and that RUN OUT (each is spent by one dressing).
    - /world/terminus/infirmary/thing/bandage-1
    - /world/terminus/infirmary/thing/bandage-2
    - /world/terminus/infirmary/thing/bandage-3
  cast:
    - /world/terminus/infirmary/agent/physician
