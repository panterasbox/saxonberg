# The Ostrander as ONE thing — her Structure (river D18, D28, D29).
#
# ⭐ Her position is on the Kestrel's line: km from the mouth, m from river
# left. Her course is a direction and a landing, and the passage the river
# worked out when it was set rides with it — so she goes on steaming with
# nobody aboard, and across a restart.
#
# She draws sixteen inches light (0.4 m) — a sternwheeler floats on a heavy
# dew — the riffles below the woodyard carry half a metre in a wet month;
# and more laden; in a dry August the
# channel at Hob's Bend has less than that. She burns cordwood from the
# bunker on her deck.
#
# She starts lying at the city quay.
