# The Ostrander's company — the house whose roster mans her (river D36):
# the master who has her, the engineer who keeps her fire, a deckhand who
# handles her lines and her lead.
class: /platform/idea/Business
data:
  name: "the Ostrander's company"
  # ⭐ Whoever her register names her managing owner appoints her master
  # (harbors P12): her entry in the city's register (`read register` at the
  # harbor office) says who owns her, by shares.
  appointingAuthority:
    kind: register
    ship: /world/terminus/ostrander/structure
  positions:
    - key: master
      noun: master
      label: in the wheelhouse
      wageRate: 5
      headcount: 1
    - key: engineer
      noun: engineer
      label: at the firebox
      wageRate: 4
      headcount: 1
    - key: deckhand
      noun: deckhand
      label: on deck
      wageRate: 2
      headcount: 2
  rosterSlots: []
  startsShiftOnHire: true
  banksAt: goodkin
  operatingLocations:
    - /world/terminus/ostrander/deck
