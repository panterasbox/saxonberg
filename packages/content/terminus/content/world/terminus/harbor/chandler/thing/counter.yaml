# The chandler's counter — the caulker's kit, mooring line,
# oakum and pitch. ⭐ Priced against the shipped wage (grain): the
# harbor works pays 4 an hour; a kit is about three hours' (the general
# store's householder's kit is 9 — a caulker's irons cost a little more),
# a mooring line five (thirty meters of wrist-thick hemp; the ropewalk's
# fifty of lighter rope is 25 at the walk, and the chandler takes his cut).
