# Corrigan as ONE thing — her Structure (harbors A2, one of the line's
# two regulars). Thirty-five meters drawing 3.6 m — the bar refuses her at low water and takes her at high (P10); too long for what is left of the Town Quay with the Hesper and the Kittiwake alongside it.
#
# She starts in the roads, the anchorage outside the bar, waiting for water: drawing 3.6 m she crosses only on the flood. Her
# voyages are not automated (no sailing brain this build): her master — the
# NPC her company rosters, or whoever is appointed to the seat — lays her
# course from the helm.
