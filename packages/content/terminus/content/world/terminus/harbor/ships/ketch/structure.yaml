# Kittiwake as ONE thing — her Structure (harbors A2, one of the line's
# two regulars). A ketch of twenty meters drawing 1.8 m — the bar takes her at all but the bottom of a spring ebb.
#
# She starts lying off the bar, unmoored, waiting on the office: one hail and one course bring her in. Her
# voyages are not automated (no sailing brain this build): her master — the
# NPC her company rosters, or whoever is appointed to the seat — lays her
# course from the helm.
