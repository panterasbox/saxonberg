# The boat shed (harbors B2, P17) — Pell's yard, where the smack is sold.
# ⭐ Off its hull book (review 1): the two smacks on the stocks, each sold
# once — `buy smack`, name her as she is entered in the city's register,
# and she is brought round to the yard's quay with her gangway locked and
# the key in your hand.
class: /platform/location/Locale
data:
  shortDescription: boat shed
  keywords: [shed, "boat shed", yard, "pell's yard"]
  register: definite
  _address: terminus/city/harbor/yard/shed
  _biomePath: /stuff/idea/biome/indoor/baseline
  longDescription: |
    A long open-fronted shed of tarred boards with two smacks' hulls on the stocks inside it, side by side, half planked, their ribs showing pale where the planking stops. Steam drifts from a box along one wall where a plank is being softened to bend, and the floor is deep in shavings.

    A hull book lies open on a trestle by the door. The quay is north.
  coords: { x: -2, y: -1, z: 0 }
  enclosure: { material: /stuff/idea/material/wood/pine, thicknessM: 0.03 }
  roof: { material: /stuff/idea/material/wood/pine, thicknessM: 0.03 }
  props:
    - /world/terminus/harbor/yard/thing/hull-book
  cast:
    - /world/terminus/harbor/yard/agent/shipwright
  details:
    hull:
      keywords: [hull, stocks, smack, ribs, frames]
      description: |
        Two smacks in frame on the near stocks and the far, their keels and stems up and their ribs bent in, the planking carried halfway up their sides. When they are finished they will be somebody's, and their names will be in the register at the harbor office.
    steam-box:
      keywords: [steam, box, "steam box", plank]
      description: |
        A long wooden box fed by a kettle on a brazier, a plank inside it going soft enough to bend round a hull.
  exits:
    north:
      destination: /world/terminus/harbor/yard/quay
      media: [ground]
