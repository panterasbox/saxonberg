# The yard's quay (harbors B2, P17) — the fitting-out berth below the boat
# shed, where a smack the yard sells is lying when her buyer first sees her.
# ⭐ A HarborQuay of the Port of Terminus' own book (P7, lens 6): a ship left
# here owes dues like any other, from the day she is sold — a yard that
# berthed her free would undercut the harbor.
class: /system/transport/location/HarborQuay
data:
  shortDescription: yard quay
  keywords: [quay, "yard quay", "fitting-out berth", berth, yard]
  register: definite
  _address: terminus/city/harbor/yard
  _biomePath: /stuff/idea/biome/outdoor/baseline
  longDescription: |
    A short timber quay at the upstream end of the harbor, its planks sticky with pitch and littered with shavings, where the yard brings a new boat alongside to fit her out. Two bollards stand at its edge and a sheer-legs leans over the water, rigged and idle.

    The boat shed opens to the south; the Fish Quay is east along the staging.
  coords: { x: -2, y: 0, z: 0 }
  harbor: /world/terminus/harbor/idea/harbor
  props:
    - { template: /platform/thing/bollard, count: 2 }
  # ⭐ On the Kestrel's left bank above the Fish Quay (estuary-0.6) and below
  # the reach's span (it runs down to 0.7).
  frameSite: { frame: /stuff/idea/Watercourse/kestrel, cite: "estuary-0.65,left", span: 0.02, name: yard }
  waters:
    river: "kestrel:estuary-0.65"
  details:
    river:
      keywords: [river, water, estuary, kestrel, tide]
      description: |
        The tide slops among the piles under the quay, carrying shavings out with the ebb and back again with the flood.
    sheer-legs:
      keywords: [sheer-legs, sheers, legs, tackle]
      description: |
        Two spars lashed at the head with a tackle hanging from them, for stepping a mast into a hull or lifting an engine out of one.
  exits:
    east:
      destination: /world/terminus/harbor/fish-quay
      media: [ground]
    south:
      destination: /world/terminus/harbor/yard/shed
      media: [ground]
