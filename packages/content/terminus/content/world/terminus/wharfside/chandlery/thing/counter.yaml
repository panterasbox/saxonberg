# The chandler's counter — ⭐ the only shop front in the district.
#
# Two lines, priced apart, and the gap is the trade: a tallow candle is
# what people buy and a beeswax one is what people buy for a reason. The
# chandler makes a living on the first and a margin on the second.
#
# ⚠ `par` mints fresh clones on the sweep, which makes this a faucet —
# deliberately, and the honest kind: a shop that never runs out is a
# simplification everybody can see. The KNACKER is the source node that
# can run dry.
class: /trade/shopkeeping/thing/Stock
data:
  shortDescription: chandler's counter
  keywords: [counter, candles, tray, shelf, till]
  register: definite
  longDescription: |
    A scrubbed counter with a tray of single candles on it and bundles of ten tied with string behind. A rush-light holder stands on the end with a stub in it, lit, which is both a demonstration and the shop's only lamp.
  # ⚠ `lint:mass` again: eighteen shipped `Stock` rows already state
  # neither, and the ratchet is what stops a nineteenth. A scrubbed deal
  # counter is deal and it weighs what a counter weighs.
  _materialPath: /stuff/idea/material/wood/pine
  mass: 60
  discipline: scrum
  attendDurationMs: 0
  staffingPolicy: self-service
  serverPositionKeys: [chandler]
  businessPath: /world/terminus/wharfside/chandlery/idea/outfit
  stockLines:
    - { itemTemplatePath: /trade/chandlery/thing/candle, par: 12 }
    # ⭐ Wick by the length — a lantern's WEAR part (assembly AC 13). It
    # burns down and is trimmed to nothing, and a new one is seated in the
    # burner (`fit wick to lantern`). Who sells wick is who sells candles.
    - { itemTemplatePath: /trade/chandlery/thing/wick, par: 10 }
    # ⭐ (cleanliness D24) The chandler makes soap beside the candles — the
    # same fat, the other half of the trade — and sells the lye and the
    # glycerin it gives, and brimstone for the bleacher, and ash for the
    # lye-maker with no hearth of her own.
    - { itemTemplatePath: /trade/chandlery/thing/soap-bar, par: 6 }
    - { itemTemplatePath: /trade/chandlery/thing/soft-soap-jar, par: 4 }
    - { itemTemplatePath: /trade/chandlery/thing/lye-flask, par: 4 }
    # ⭐ (ceramics W6, D28) The empty pots a soap-maker's customers bring
    # back or buy to carry soft soap and lye home in — the Delight pottery's
    # jar and flask, local first, imported dearer when her shelf is bare.
    # ⚠ Beside the filled lines, not instead of them: the soft soap and the
    # lye are the chandler's product, and the jar is only the pot it goes in.
    - { itemTemplatePath: /trade/ceramics/thing/jar, par: 2, from: { supplier: /world/terminus/hearts-delight/brickfield/idea/pottery, importBackstop: 1.5 } }
    - { itemTemplatePath: /trade/ceramics/thing/flask, par: 2, from: { supplier: /world/terminus/hearts-delight/brickfield/idea/pottery, importBackstop: 1.5 } }
    - { itemTemplatePath: /trade/chandlery/thing/glycerin-jar, par: 2 }
    - { itemTemplatePath: /trade/quarrying/thing/sulfur, par: 4 }
    - { itemTemplatePath: /trade/fuel/thing/wood-ash, par: 4 }
  prices:
    # ⚠ ONE row and ONE price, because there is one candle row — what a
    # candle is made of is per-instance, so the counter cannot price the
    # two kinds apart. ⭐ That is a real limit of the Stock shape and it
    # is recorded rather than worked around: the prose above does the
    # pricing work the counter cannot, and the day `Stock` can key a
    # price on an instance's material this becomes two lines.
    /trade/chandlery/thing/candle: 2
    # Cheaper than a candle: it is a hand of tape, and it lasts longer.
    /trade/chandlery/thing/wick: 1
    /trade/chandlery/thing/soap-bar: 3
    /trade/chandlery/thing/soft-soap-jar: 2
    /trade/chandlery/thing/lye-flask: 2
    /trade/ceramics/thing/jar: 3
    /trade/ceramics/thing/flask: 2
    /trade/chandlery/thing/glycerin-jar: 4
    /trade/quarrying/thing/sulfur: 2
    /trade/fuel/thing/wood-ash: 1
