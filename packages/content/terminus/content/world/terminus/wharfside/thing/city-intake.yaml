# The city intake — where Terminus drinks.
#
# ⭐ It sits on `kestrel:confluence`, and so does the outfall a hundred
# paces downstream. The whole counterplay ladder is visible from one
# room: this intake could be moved upstream (free), the water it
# delivers can be boiled (per use), or the conduit could be given a
# treatment factor (capital). The build ships it UNTREATED on purpose —
# treatment is what a town decides to buy, not what it wakes up with.
#
# Gravity-fed: the river at 30 m, the city at 35... which is FIVE METRES
# THE WRONG WAY. Terminus is flat, its river is below it, and the pump
# on this intake runs forever. That is not a flaw in the content; it is
# the reason a water tower and an aqueduct are both worth building, and
# `analyze water the intake` will tell you the kilowatts.
# ⭐ LIVE (water-supply D30): a cut or a switch-off is somebody's act on the
# city's works, so the main keeps its own record across an unload.
class: /system/water/thing/PersistentConduit
data:
  shortDescription: city intake
  keywords: [intake, mouth, screen, pillar, waterworks, city]
  register: definite
  longDescription: |
    A screened mouth of riveted iron on a stone pillar out in the current, with a plank walkway to it and a housing on the bank where the pump lives.
  conduitKey: terminus-intake
  direction: supply
  reachRef: kestrel:confluence
  # ⭐ Where on the line it sits (the river build, D3) — the node above
  # keeps the works' index; this is its own place on the river.
  at: "kestrel:confluence+0.05,left"
  # ⚠ RUNNING — `Switchable` defaults off, and an intake that is off draws
  # nothing for the city (the outfall's twin finding, the fishing drive).
  on: true
  # ⭐ The CITY's districts (water-supply D23), not every locality under the
  # realm root: Hinkley drinks from its own tank, the Delight from its
  # river, Rejection from its wells. A plumber's service run completes only
  # where one of these is the premises (the first is where the head is
  # surveyed from).
  extents:
    - /world/terminus/market
    - /world/terminus/terminal
    - /world/terminus/counting-houses
    - /world/terminus/general-store
    - /world/terminus/registry
    - /world/terminus/university-avenue
    - /world/terminus/mayfield-row
    - /world/terminus/realty
    - /world/terminus/wharfside
    - /world/terminus/goods-yards
    - /world/terminus/infirmary
    - /world/terminus/eternal
    - /world/terminus/hearthworks
  capacityM3S: 1.2
  # ⭐ What the city actually draws (water-supply D5/D6) — the district rate,
  # never a sum over taps. A shortage is this over what the river, the main
  # and the pump carry, and it is shared by RANK: the public outlets first,
  # then the trades, then the houses (Vitruvius's order, off each premises'
  # land use).
  demandM3S: 0.4
  shares: priority
  treatmentFactor: 0
  ownerRef: "group:terminus"
  fixedInPlace: true
  # ⭐⭐ Its pump is a THING now (the pump build) — the engine in the
  # housing, on the Wharfside line, switchable, and the reason a tap uphill
  # runs or does not. It used to be a Detail that drew nothing.
  props:
    - /world/terminus/wharfside/thing/intake-pump
  details:
    screen:
      keywords: [screen, mouth, grate, grille]
      description: |
        A riveted iron grille across the mouth, coarse enough to pass a fish and fine enough to stop a log. Somebody rakes it. You can tell because of what is piled beside it.
    walkway:
      keywords: [walkway, planks, plank, gangway]
      description: |
        Four planks and a handrail out to the pillar, bouncing underfoot. In spring the water comes up over them and nobody goes out.
    pillar:
      keywords: [pillar, footing, stone, pier]
      description: |
        Cut stone set into the riverbed, with a hundred years of waterline on it in bands. The highest band is well above your head.
