# The Wharfside dyehouse — a Business, and a SERVICE rather than a
# producer.
#
# ⚠ `dyer` at wage 5 — the same as the mill's weaver and above its
# spinner. Skilled, and the trade's whole product is fastness and
# repeatability, which is knowledge rather than throughput.
class: /platform/idea/Business
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: "the Wharfside dyehouse"
  appointingAuthority:
    kind: office
    office: prime-minister
  positions:
    - key: dyer
      noun: dyer
      label: at the vats
      wageRate: 5
      purchases: true
  rosterSlots:
    - positionKey: dyer
      assignee: /world/terminus/wharfside/dyehouse/agent/dyer
      schedule:
        # ⭐ Real hours (envelope S8). This authored `[0, 24]` — a house
        # staffed around the clock — which was never true of it and made
        # the night indistinguishable from the day. The `shifts` brain
        # parks off-shift cast in the venue's Offstage, so the street
        # genuinely empties.
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [6, 18] }
  banksAt: goodkin
  operatingLocations:
    - /world/terminus/wharfside/dyehouse/location/floor
    - /world/terminus/wharfside/dyehouse/thing/counter
