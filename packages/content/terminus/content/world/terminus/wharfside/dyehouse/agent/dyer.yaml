# Ilva Marrow — at the vats, and the keeper of the woad.
#
# ⭐ She feeds the vat bran and lime on a schedule she has not needed to
# write down in eleven years, which is the whole of what this trade's
# competence is: not a brighter colour, but the same colour twice and a
# vat that is still alive next spring.
class: /platform/agent/Cast
extends: /stuff/agent/costume/student
data:
  # ⭐ What this person has on comes from the parent row
  # (`/stuff/agent/costume/student`). Until the envelope build no
  # NPC row could author clothing at all — every authored person in
  # the realm was naked, invisible only because every interior was
  # 21 °C by decree.
  name: Ilva Marrow
  keywords: [dyer, ilva, marrow, hands, blue, wrist, will, come, clean]
  pronouns: she
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  alternateNames: ["ilva", "marrow"]
  shortDescription: "dyer whose hands are blue to the wrist and will not come clean"
  register: indefinite
  longDescription: |
    Blue to the wrist, permanently, and she has stopped apologising for it. She can tell you what is wrong with a vat by leaning over it, and she will not tell you how.
  dispositions:
    - { disposition: diligence, valence: 75 }
