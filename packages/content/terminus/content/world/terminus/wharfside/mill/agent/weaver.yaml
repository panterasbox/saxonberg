# Adren Coll — at the loom, on 5, and the one who takes the cloth out.
#
# The `consigns` brain carries bolts to the general store's counter and
# consigns them AS the mill: `purchases: true` on the weaver position
# means the house card is dealt at hire, so each sale splits to the
# mill's operating account.
class: /platform/agent/Cast
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  # ⭐ What this person has on (envelope W1). Until this build no NPC
  # row in the tree could author clothing at all, so every authored
  # person in the realm was naked — invisible only because every
  # interior was 21 °C by decree. A mill floor.
  wears:
    - /stuff/thing/clothes/student-shirt
    - /stuff/thing/clothes/student-trousers
    - /stuff/thing/clothes/canvas-shoes
  name: Adren Coll
  keywords: [weaver, adren, coll, shuttle, one, hand, tally, other]
  pronouns: he
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  alternateNames: ["adren", "coll"]
  shortDescription: "weaver with a shuttle in one hand and a tally in the other"
  register: indefinite
  longDescription: |
    Broad across the shoulders from the beater and deaf in one ear from the loom. He keeps a chalked tally on the frame of how many bolts are owed to how many spinners, and he is never wrong about it.
  dispositions:
    - { disposition: diligence, valence: 65 }
  # ── the dossier ─────────────────────────────────────────────────
  # ⚠ `lint:dossiers` (identity-ledgers). See the spinner beside him.
  archetype: hand
  competence:
    - { discipline: textiles, asserting: competent }
  behaviors:
    - brain: /trade/shopkeeping/behavior/consigns
      trigger: cadence:120s
      config:
        stock: /world/terminus/wharfside/mill/thing/stock
        shelf: /world/terminus/general-store/counter
        batch: 2
        ask:
          cloth:linen: 40
