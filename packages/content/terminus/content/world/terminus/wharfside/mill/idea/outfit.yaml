# The Wharfside mill — a Business, and ⚠⚠ **read the wage column.**
#
#   spinner 3 · weaver 5
#
# **The bottleneck job is the worst-paid one.** That is the
# uncomfortable historical fact, and it is precisely WHY mechanising
# spinning was both so profitable and so socially disruptive: the step
# that took the most labour was the step done by the people with the
# least standing.
#
# ⚠ **Do not "fix" it upward for fairness.** The wage table teaches the
# same lesson as the throughput bench and the price ladder, from a third
# independent direction, and flattening it deletes the lesson rather
# than the injustice.
#
# ⭐ No `AttendancePoint`. The mill produces and consigns; cloth reaches
# players in the general store, where they already shop.
class: /platform/idea/Business
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: "the Wharfside mill"
  appointingAuthority:
    kind: office
    office: prime-minister
  positions:
    - key: spinner
      noun: spinner
      label: at the wheel
      wageRate: 3
      purchases: false
    - key: weaver
      noun: weaver
      label: at the loom
      wageRate: 5
      purchases: true
  rosterSlots:
    - positionKey: spinner
      assignee: /world/terminus/wharfside/mill/agent/spinner
      schedule:
        # ⭐ Real hours (envelope S8). This authored `[0, 24]` — a house
        # staffed around the clock — which was never true of it and made
        # the night indistinguishable from the day. The `shifts` brain
        # parks off-shift cast in the venue's Offstage, so the street
        # genuinely empties.
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [6, 18] }
    - positionKey: weaver
      assignee: /world/terminus/wharfside/mill/agent/weaver
      schedule:
        # ⭐ Real hours (envelope S8). This authored `[0, 24]` — a house
        # staffed around the clock — which was never true of it and made
        # the night indistinguishable from the day. The `shifts` brain
        # parks off-shift cast in the venue's Offstage, so the street
        # genuinely empties.
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [6, 18] }
  banksAt: goodkin
  operatingLocations:
    - /world/terminus/wharfside/mill/location/floor
    - /world/terminus/wharfside/mill/thing/stock
