# The bank at the confluence — where Terminus finally meets its river.
#
# Two objects stand here and the whole watershed argument is in the
# distance between them: the city's INTAKE, upstream, and its OUTFALL,
# downstream. Which is which is not a label — it is where they are.
class: /platform/location/Quay
data:
  # ⭐⭐ The town lights this street (envelope W5) — a PROPERTY of the
  # street, not objects on it. NOTHING IS MINTED: nobody binds a street
  # lamp, and one identical fuelled object per street would be forty-one
  # fuel reserves reconciling to produce the same number. Whether the
  # lamps are burning right now is DERIVED — the service is funded, it is
  # after dusk, therefore they burn.
  # The city lights the bank — a wharf at night without it is a drowning.
  publicLighting:
    flux: 300
    colorTemperature: 2200
    detail: lamps
    seniority: 1
  shortDescription: bank at the confluence
  keywords: [bank, confluence]
  register: definite
  alternateNames: [wharfside, waterfront, riverside]
  _address: terminus/city/wharfside
  _biomePath: /stuff/idea/biome/outdoor/baseline
  ambientIntensity: 600
  ambientColorTemperature: 5800
  longDescription: |
    The Kestrel comes down out of the gorge and the Delight comes in from the south, and they meet here in a wide brown sheet of water that the city has turned its back on for a hundred years. There is a stone embankment, a set of steps going down into the river, and a smell.

    Upstream, on a stone footing set out into the current, stands the intake — a screened mouth on a pillar, with a walkway to it. A hundred paces downstream, past the steps, a brick arch in the embankment discharges the other end of the same city, continuously.

    You can see both from here without turning your head. That is the whole argument.

    Overhead, a line of brick arches carries the Cold Fell conduit in across the warehouse roofs and sets it down at a squat stone house on the quay, which is turning a wheel on the last of its fall. The city drinks from a different watershed than the one it is standing in, and it went to this much trouble to say so. A barge lies alongside with its hold open.
  coords:
    x: 0
    y: 0
    z: 0
  exits:
    north:
      destination: /world/terminus/market/square
    west:
      destination: /world/terminus/valley-road/towpath
      edgeMinutes: 4
    # ⭐ The two roads out of the city that the logistics build authored.
    # SOUTH is the Delight road — the wagon's road, up the farming valley
    # to the crossroads. EAST is the estuary — the export road, and the
    # one stretch of the realm a barge can work.
    south:
      destination: /world/terminus/delight-road/ford
      media: [ground]
      edgeMinutes: 6
    east:
      destination: /world/terminus/estuary/lower-towpath
      media: [ground, water]
      edgeMinutes: 3
    # ⭐ The way aboard the Ostrander when she lies at the quay (the river
    # build) — a steamer that has sailed is not alongside, and this says so.
    aboard:
      kind: /platform/idea/exits/aboard
      destination: /world/terminus/ostrander/deck
      edgeMinutes: 1
    # ⭐ The goods yards behind the working city — the one room D11's
    # switchover cost, and the way a hauler reaches every trade floor in
    # Terminus without any of their hands ever leaving their own floor.
    # ⭐ The tinker's yard (repair D15), behind the warehouses — his round
    # starts and ends here; the yard declares `bank` back.
    tinkers:
      destination: /world/terminus/wharfside/tinker/location/yard
      media: [ground]
      edgeMinutes: 1
    northwest:
      destination: /world/terminus/goods-yards/yard
      media: [ground]
      edgeMinutes: 3
    # ⚠ The textile chain sited SOUTHEAST and SOUTHWEST, not south/east:
    # the logistics build took those two for the Delight road and the
    # estuary, and a road out of the city beats a trade floor for the
    # cardinal. The siting ARGUMENT is unchanged and is the point —
    # retting wants standing water and stank badly enough to be banned
    # upstream of towns, a bleaching green wants open ground and sun, and
    # a dyeing yard (urine was the classic woad vat) wants water and room
    # to hang cloth. ⚠⚠ **The textile chain IS the nuisance-trade
    # chain** — retting ponds, dyehouses, and the tannery that is Stage
    # C's and stank worst — so it belongs downwind and downstream of the
    # market, which is exactly where these two corners are. That is a
    # coherent industrial identity rather than three coincidences, and it
    # is what makes siting a real decision.
    #
    # ⭐ They carry `media`/`edgeMinutes` like every other edge here: a
    # trade floor the lane graph cannot see is a floor no hauler can be
    # routed to, and the whole point of the logistics build is that goods
    # move because somebody carried them.
    southeast:
      destination: /world/terminus/wharfside/mill/location/floor
      media: [ground]
      edgeMinutes: 5
    southwest:
      destination: /world/terminus/wharfside/dyehouse/location/floor
      media: [ground]
      edgeMinutes: 5
    # ⭐⭐ **The three noxious trades, and they are DOWNSTREAM.** The
    # carcass chain's premises: a knacker, a tannery and a chandlery, in
    # that order along the bank, because each one's product is the next
    # one's feedstock — the knacker's hides go to the tannery and his
    # suet goes to the chandlery, and the whole arrangement is forty feet
    # end to end.
    #
    # ⚠⚠ **DOWN, past the outfall**, not up. The header above already
    # names the textile chain as the nuisance-trade chain and puts it
    # downwind and downstream of the market; the tannery is the one that
    # stank worst and it goes furthest out. A tanyard upstream of a city's
    # intake is a thing a real municipality would hang somebody for.
    #
    # ⚠ The effluent that argument is built on is an UNPRICED
    # EXTERNALITY: the siting is honest and nothing downstream costs
    # anybody anything yet. Recorded at the tannery zone and in the
    # plan's deferred list rather than papered over.
    #
    # ⭐⭐ **ONE exit off the bank, and the three CHAIN**, which is better
    # geography than three spokes: the knacker is the gate, his hides go
    # on down to the tannery and his suet goes back up to the chandlery,
    # and the whole arrangement is a few minutes end to end. A player
    # walks the supply chain in the order the supply chain runs.
    #
    # ⚠ And it is `down`, because the four diagonals are taken (the
    # logistics build's two roads and the textile chain's two floors) and
    # because the bank genuinely drops to the water here. The remaining
    # cardinal was `northeast` and the chandlery has it — pointing back
    # toward the market, which is where its customers are.
    #
    # ⭐ `media`/`edgeMinutes` like every other edge: a floor the lane
    # graph cannot see is a floor no hauler can be routed to, and a
    # knacker who cannot be reached by a cart is a knacker with no trade.
    down:
      destination: /world/terminus/wharfside/knackers/location/yard
      media: [ground]
      edgeMinutes: 7
    # ⭐ Into the river itself (underwater D23). The bank is a QUAY —
    # beside the water, never in it — and the water you go down into is
    # the basin below it: `swim` (or `dive`, `jump`) goes in — in the
    # hard-hat suit too, which sinks you; the quay steps are the way back
    # OUT (`climb up` from the water). `down` stays the knacker's.
    # ⭐ Into the river itself — the stream past the foot of the steps
    # (the river build): `swim` from the quay goes here, into the current.
    river:
      destination: /world/terminus/wharfside/water/location/stream
      media: [water, vertical]
    # The still basin beside it, where the dive shop works.
    basin:
      destination: /world/terminus/wharfside/water/location/basin
      media: [water, vertical]
    # ⭐ Morrow's dive shop, a tarred shed on the quay (underwater C5).
    divers:
      destination: /world/terminus/wharfside/diving/location/shop
      media: [ground]
      edgeMinutes: 1
    # ⭐ The lavoir (cleanliness D27) — the town's washing place, on soft
    # fell water. A NAMED exit: every compass point off the bank is a road
    # or a trade floor already, and the lavoir is somewhere you go IN to.
    lavoir:
      destination: /world/terminus/wharfside/lavoir/location/lavoir
      media: [ground]
      edgeMinutes: 1
  props:
    - /world/terminus/wharfside/thing/city-intake
    - /world/terminus/wharfside/thing/city-outfall
    # ⭐⭐ The Cold Fell aqueduct and the house on its last drop — and
    # until the reachability sweep NEITHER STOOD ANYWHERE. Both rows
    # shipped with the water build, the `Feeder/terminus-main` row names
    # the house as its `source:` (the ControlStructure whose
    # `isGenerating()` powers the whole feeder tree), and the terminus
    # content tree mentioned the aqueduct in not one location row. So the
    # city grid cited a building that was not there, and
    # `watershed.test.ts` built the conduit from its FILE rather than
    # from the world.
    #
    # ⚠ This is the case that forced arm R's faucet/citation split: being
    # NAMED by a field is not reachability — the field has to MINT or
    # PLACE. `source:` reads the house live and places nothing.
    #
    # ⭐ They go on the bank because this is where the conduit arrives:
    # 1115 m of head spent between the cascade and 35 m at the city, and
    # the house is the weir on the last drop that takes the energy out of
    # water that was going past anyway.
    #
    # ⚠⚠ And the room's `aqueduct` DETAIL is gone (the pump build): it
    # predated these two standing here, and a detail wins the binding — so
    # `analyze water aqueduct` read the BANK ("carries no water anywhere")
    # and `look aqueduct` read a sentence with nothing behind it. Two
    # copies of one object, and the one that was not real won. The
    # aqueduct and its house carry their own prose.
    - /world/terminus/wharfside/thing/cold-fell-aqueduct
    - /world/terminus/wharfside/thing/aqueduct-house
    # ⭐ A barge at the city's working wharf. The estuary mouth's own prose
    # says a barge can be there and nothing put one anywhere; the general
    # store's rig lines say in terms that *"a boat in a general store is
    # silly, and the depot at Wharfside is where those belong."* This is
    # that place.
    - /system/transport/thing/barge
    # ⭐ The steps down into the river (underwater D23) — a thing you
    # climb, standing in both rooms. The old `steps` detail is gone: a
    # detail wins the binding, and `climb steps` would have read the words
    # instead of the stone.
    - /world/terminus/wharfside/water/thing/quay-steps
    # ⭐ The heaving line at the head of the steps (underwater C1).
    - /world/terminus/wharfside/water/thing/heaving-line
    # ⭐ The bell hoist over the basin (underwater C2).
    - /world/terminus/wharfside/water/thing/bell-hoist
    # ⭐ The dive shop's air pump on the quay, and the harbor works'
    # board (underwater C3/C4).
    - /trade/diving/thing/air-pump
    - /world/terminus/wharfside/thing/harbor-board
  cast:
    - /world/terminus/wharfside/agent/fisher
    - /world/terminus/wharfside/agent/pilot
    # ⭐ The dive shop's quay crew: the tender holds a diver's line, the
    # pump hand works the air pump (underwater C3–C5).
    - /world/terminus/wharfside/diving/agent/tender
    - /world/terminus/wharfside/diving/agent/pump-hand
  details:
    lamps:
      keywords: [lamps, lamp, standards, lighting]
      description: |
        Squat iron bollards along the edge of the quay, each capped with a thick glass lens — low enough not to blind a bargeman, bright enough to show him where the water starts.
    line:
      keywords: [line, lines, wire, wires, cable, cables, feeder, overhead, grid]
      description: |
        The city main leaves the Wharfside generation here, feeder cables lifting off the works onto cross-arms and running east up the quay — the head of the line the whole grid hangs from.
    river:
      keywords: [river, kestrel, water, confluence]
      description: |
        Brown, wide and moving faster than it looks. In spring it comes up the steps and over the third one; in August you can see the gravel out in the middle of it. Everything anybody upstream has done to it is in here somewhere, thinned out.
    arch:
      keywords: [arch, brick, discharge]
      description: |
        A brick arch a man could stand up in, running steadily whatever the weather. Nobody built it to be looked at.
  # ⭐ WHICH water the `river` feature is (maritime revision 3): `look
  # river` gives the bank's own words, then the Kestrel's read; `fish`,
  # `fill … from river`, `analyze water` act on it here. The city's
  # Locality declares no reach, so this is what makes the bank fishable.
  # ⚠ `delight` is not a keyword of the feature — the Delight is a second
  # water at the confluence, and a bank citing it is a later decision.
  waters:
    river: kestrel:confluence+0.1
  # ⭐ Where the quay stands on the Kestrel's line (the river build, D8):
  # the left bank, from the steps two hundred meters down past the outfall.
  bank: { course: kestrel, at: confluence+0.1, side: left, span: 0.2, name: quay }
