# The intake's screen, under the river (underwater D17, D23) — the city
# intake's underwater face, at the mouth beside the basin's dark band.
# The harbour works send a diver down to look at it; `inspect screen` is
# the job.
class: /system/water/thing/WorksFace
extends: /system/water/thing/works-face
data:
  shortDescription: intake screen
  keywords: [screen, bars, grate, intake]
  longDescription: >-
    Iron bars a hand's breadth apart across the square mouth of the city
    intake, the pipe going on behind them into the dark toward the pump.
  works: /world/terminus/wharfside/thing/city-intake
