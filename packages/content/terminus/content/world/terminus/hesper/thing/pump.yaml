# The Hesper's pump well — the well by the mainmast where her
# bilge gathers, with her bilge pump set in it. `pump well` works the
# brake and the water goes over the side; `measure bilge` with the
# sounding rod says how much is in her and whether it is rising.
#
# ⭐ Her hull weathers on the house's clock (her warren's shell): sound, she
# is tight; let her seams go and she weeps, and this is how it goes out
# again. `maintain` with a caulker's kit makes her tight.
class: /platform/thing/BilgeWell
data:
  shortDescription: pump well
  keywords: [well, "pump well", "bilge well", bilge]
  register: definite
  longDescription: |
    A boarded well beside the mainmast going down to her bottom timbers, with an elm pump barrel stepped into it and a long iron brake across the top. The sea comes in a little all the time; this is how it goes out again.
  _materialPath: /stuff/idea/material/wood/elm
  mass: 80
  props:
    - /stuff/thing/bilge-pump
