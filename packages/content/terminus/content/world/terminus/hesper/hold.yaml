# The Hesper's hold — below the deck. A `Compartment` like every ship's
# room (harbors B1): it keeps its own record, so what is left in it is
# still there after a restart, and it is a member of her warren.
class: /platform/location/Compartment
data:
  shortDescription: hold
  keywords: [hold, below]
  register: definite
  # ⭐ Below decks: no sky, so nothing on the horizon is seen from here
  # (maritime R4) — the watch is kept on deck.
  _biomePath: /stuff/idea/biome/indoor/baseline
  longDescription: |
    Dim and close under the deck beams, smelling of bilge and tar. A chart locker is built against the bulkhead, its door hooked open, and a lantern hangs from a beam.
  coords:
    x: 0
    y: 0
    z: -1
  adornments:
    - { template: /world/terminus/hesper/thing/hold-lamp, slot: lamp:hold }
  props:
    - /world/terminus/hesper/thing/chart
    - /world/terminus/hesper/thing/old-chart
    # ⭐ Her charter book (harbors P23): `charter` here makes you her master.
    - /world/terminus/hesper/thing/charter-book
  exits:
    up:
      destination: /world/terminus/hesper/deck
