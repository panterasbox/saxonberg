# The general store — the shop floor. One room off the counting-houses avenue
# block (SOUTH back to the street; the avenue block declares NORTH back here),
# on the new-player path between the Terminus arrival gate and the university
# crossing. The counter (Stock), the consignment shelf, and the cast (clerk +
# keeper) are `props` (fresh clones each boot). Indoor room, no biome.
#
# Its own zone (`/world/terminus/general-store`), but addressed under the
# counting-houses Locality (`counting-houses/general-store`) — it sits on that
# street, so no new address node is minted (the slim-roster discipline).
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: general store
  keywords: [store, general]
  register: definite
  alternateNames: [shop, store, general]
  _address: terminus/city/counting-houses/general-store
  longDescription: |
    A cramped, well-loved general store, every inch of it earning its keep. Shelves climb the walls stacked with the plain gear of getting by underground; a plank counter runs the length of one side with a chalk price slate above it, and by the door a tall consignment shelf holds the odds and ends other delvers have left to be sold on. It smells of tar and lamp oil and old paper. A doorway south lets back out onto the avenue.
  coords:
    x: 0
    y: 0
    z: 0
  exits:
    south:
      destination: /world/terminus/counting-houses/avenue-block
  props:
    - /world/terminus/general-store/counter
    - /world/terminus/general-store/consignment-shelf
    # ⭐⭐ A hearth (envelope W4) — the fire that heats WHERE YOU STAND,
    # as against a forge or an oven, which heat what you put in them.
    # A shop with a street door that opens all day is the room that
    # most obviously needs one, and it gives the realm one place a
    # player can walk into, light a fire, and feel the room change.
    #
    # ⚠ NOT the cookhouse, which was the first choice and was wrong:
    # its oven row already claims the keyword `hearth` (its prose calls
    # it "a clay hearth"), so a second hearth there made `light hearth`
    # AMBIGUOUS. The drive found it as a session that stopped answering
    # — a disambiguation prompt nobody replied to, wearing the costume
    # of a deadlock. A player would have hit exactly the same thing.
    - /stuff/thing/Hearth
  cast:
    - /world/terminus/general-store/agent/clerk
    - /world/terminus/general-store/agent/keeper
