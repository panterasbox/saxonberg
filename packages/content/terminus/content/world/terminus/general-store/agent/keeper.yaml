# Odell Marrow — the general store's keeper (the Business proprietor). On the
# roster in the unwaged `keeper` seat (the proprietor draws no wage) so the
# house card is dealt to her and her `stocks` beat trades as the house; an old
# hand who's outfitted three generations of delvers and buried some of them.
# Dry, fair, unsentimental about money and quietly sentimental about the trade.
class: /platform/agent/Cast
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: Odell Marrow
  keywords: [keeper, odell, marrow, "store's", store, grey-haired]
  pronouns: she
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  alternateNames: [odell, marrow, owner, proprietor]
  shortDescription: store's grey-haired keeper
  register: definite
  longDescription: |
    A small, square woman with iron-grey hair scraped back hard and reading glasses on a cord, watching the floor from a stool by the strongbox. She has sold gear to three generations of delvers and has no illusions left about the trade or the odds; what she has instead is a straight price, an honest weight, and a way of looking at a green arrival's kit that tells them exactly what they've forgotten.
  dispositions:
    - { disposition: diligence, valence: 70 }
    - { disposition: temperance, valence: 55 }
  # ── the dossier ─────────────────────────────────────────────────
  # Evidence, never values: each entry below expands into the same rows a
  # lived history would have written, marked `claim`. Seeded once at
  # postRegister and skipped if any claim already exists, so a reclone or
  # a reboot cannot mint a second history.
  # ⚠ A best-guess pass, explicitly provisional — the considered version
  # is a content pass of its own before go-live.
  archetype: storekeeper
  prologue:
    - "Sold gear to three generations of delvers."
  competence:
    - { discipline: retail-sales, asserting: proficient }
    - { discipline: appraisal, asserting: proficient }
    - { discipline: business-administration, asserting: competent }
  behaviors:
    # ⭐ The keeper STOCKS the counter (economic bootstrap D14): each beat,
    # every supplied line short of par sends her to the cash-and-carry to
    # buy the shortfall on terms as the house — `wallet use house`, `buy
    # limes` — borrowing `bank borrow … --for stock` at Goodkin's window
    # first when the till is short (rung 1, the real-bills rung: the loan
    # buys goods, the goods secure the loan, the sale repays it), then
    # home to `put` them on the counter. Every step the literal verb; a
    # refusal at the window is the ladder working. Runs with nobody
    # online, which is why the shop floor is `boot:`-pinned.
    - brain: /lib/behavior/stocks
      trigger: cadence:90s
      config:
        counter: /world/terminus/general-store/counter
    - brain: /lib/behavior/introduces
      trigger: arrival
    - brain: /lib/behavior/idles
      trigger: cadence:27s
      config:
        pool:
          - { kind: free, value: "totals a column of figures without writing anything down, and nods to herself." }
          - { kind: say, value: "Buy the lantern if you can stretch to it. Cheapest thing in here, measured in the dark." }
          - { kind: free, value: "polishes her reading glasses on her apron and resettles them, missing nothing." }
          - { kind: say, value: "Bring back what you don't use. I'll shelf it and sell it on — better than it rotting in a pack." }
