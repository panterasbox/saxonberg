# The general store as a Business (its own Idea, not a mixin on the room). It
# owns the proprietor edge, the clerk position + roster (= hours), the
# operating location (the counter fixture), and — via its own path — the P&L
# account (buy income + consignment commission − clerk wages). Independent (no
# corpoKey — an independent shop, not a corpo franchise; that's retail S4).
#
# Stands up LAZILY off `operatingLocations` on the first buy/wage query
# (EmploymentApi.ensureOperatorAt) — no manifest entry, no standup hook.
class: /platform/idea/Business
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: "the general store"
  # The keeper owns the shop: an ENTITY authority.
  appointingAuthority:
    kind: entity
    path: /world/terminus/general-store/agent/keeper
  positions:
    - key: clerk
      noun: clerk
      label: working the general-store counter
      wageRate: 5
    # ⭐ The keeper KEEPS the shop (economic bootstrap D14): the
    # `purchases` position her `stocks` beat trades as — dealt the house
    # card at hire, she buys the supplied lines at the cash-and-carry
    # `wallet use house`, borrows at Goodkin's window when short, and
    # shelves what she carries home. Unwaged: the proprietor draws none.
    - key: keeper
      noun: keeper
      label: keeping the general store
      wageRate: 0
      purchases: true
    # ⭐⭐ **The newcomer's seat** (trades-and-labor D16). The demand is
    # real and it is the demand test the authoring rule asks for: Odell
    # KEEPS the shop and STOCKS it — she walks to the cash-and-carry,
    # buys the short lines on terms and carries them home — while Pemby
    # works the counter. The shop's work exceeds its hands, so a hand is
    # honestly wanted.
    #
    # The criterion is two completed gigs: work off a noticeboard, which
    # a newcomer with twenty coin and no trade can do this afternoon. It
    # is a rung, not a wall — and the refusal says which number you are
    # short and by how much.
    #
    # No `purchases` (the house card is the keeper's; a hand does not
    # spend the shop's money) and no `fulfills` (nobody orders anything
    # made at a general store — its goods are bought over the counter).
    - key: hand
      noun: hand
      label: hauling and shelving for the general store
      wageRate: 4
      headcount: 1
      requires:
        gigs: 2
  rosterSlots:
    - positionKey: clerk
      assignee: /world/terminus/general-store/agent/clerk
      schedule:
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [6, 22] }
    - positionKey: keeper
      assignee: /world/terminus/general-store/agent/keeper
      schedule:
        # ⭐ Real hours (envelope S8). This authored `[0, 24]` — a house
        # staffed around the clock — which was never true of it and made
        # the night indistinguishable from the day. The `shifts` brain
        # parks off-shift cast in the venue's Offstage, so the street
        # genuinely empties.
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [6, 20] }
  # Where the store banks (authored custody — Terms/fees follow it).
  banksAt: goodkin
  operatingLocations:
    # ⚠ BOTH the counter fixture and the ROOM it stands in — the
    # cash-and-carry's row is the precedent, and the room is the
    # load-bearing half. A supplier is found by its counter's ROOM
    # (`restocks` → `counterRoomOf` walks the operating locations for one
    # holding a shelf, and a `Stock` fixture's own contents are its
    # goods), so a house that listed only the fixture was unfindable as a
    # supplier: the tailor's cloth order was skipped silently, with no
    # log line, because the bucket was `continue`d before it ever reached
    # `job post`.
    - /world/terminus/general-store/counter
    - /world/terminus/general-store/shop-floor
