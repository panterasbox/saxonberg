# The general-store counter — the Stock fixture. One fixture that holds the
# shelf goods (a Container/Vessel), prices them (PricedOffer — Law 1, worth on
# the offer not the good), attends its customers (Attendant — instant/scrum,
# no wait for the newcomer path), and tops itself back to par on the game-time
# reset sweep (Resettable). It stocks itself to par on standup (postRegister →
# reset). The Business stands up lazily off `operatingLocations` (this path).
#
# Prices are the store's authored stance, calibrated to the shipped anchors
# (stipend 20 / wages 4-6 per game-hour / coinage 1/5/25): a relative ladder a
# fresh arrival on the 20-credit stipend can shop against. The goods are all
# discrete Things (never Globbable) so each carries a chattel stamp on buy.
class: /platform/thing/Stock
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: the general-store counter
  primaryKeyword: counter
  keywords: [counter, shelf, shelves, goods, stock]
  longDescription: |
    A long plank counter worn pale by decades of elbows, and behind it shelves stacked to the ceiling with the honest gear of getting by underground: torches and waterskins, ration packs and a tray of clasp knives, a row of tin lanterns catching the light. Along the back wall, where the ceiling gives them room, stand the furnishings — a bed frame on its end, a pine wardrobe, tables and chairs stacked two deep, and a card of brass sconces hung up like fish. A chalk slate by the till lists the prices in a plain hand. Nothing here is fine; everything here works.
  discipline: scrum
  attendDurationMs: 0
  staffingPolicy: self-service
  serverPositionKeys: [clerk]
  businessPath: /world/terminus/general-store/business
  stockLines:
    - { itemTemplatePath: /world/terminus/general-store/thing/torch, par: 4 }
    - { itemTemplatePath: /world/terminus/general-store/thing/rations, par: 5 }
    - { itemTemplatePath: /world/terminus/general-store/thing/waterskin, par: 3 }
    - { itemTemplatePath: /world/terminus/general-store/thing/clasp-knife, par: 2 }
    - { itemTemplatePath: /world/terminus/general-store/thing/lantern, par: 2 }
    - { itemTemplatePath: /world/terminus/general-store/thing/whetstone, par: 2 }
    - { itemTemplatePath: /world/terminus/general-store/thing/iron-ingot, par: 3 }
    - { itemTemplatePath: /world/terminus/general-store/thing/sewing-kit, par: 2 }
    - { itemTemplatePath: /world/terminus/general-store/thing/sewing-machine, par: 1 }
    # The gardening line. These are ordinary `/obj/` templates, NOT
    # store-local `goods/` ones: `itemTemplatePath` takes any path, and
    # duplicating them here would mean two pots (and two seeds growing the
    # same plant) drifting apart. The existing goods live under `goods/`
    # because they are store-specific, not because the path is required.
    - { itemTemplatePath: /trade/farming/thing/pot/small, par: 3 }
    - { itemTemplatePath: /trade/farming/thing/pot/large, par: 2 }
    - { itemTemplatePath: /stuff/thing/vessel/soil-sack, par: 4 }
    - { itemTemplatePath: /trade/farming/thing/seed/snake-plant, par: 3 }
    # The produce seeds (farming A5) — one packet per bar fruit, so the
    # suburban-garden path (D0) starts here: buy a seed, grow the tree,
    # pick the fruit. Trees are dearer than the herb; all reachable on
    # the stipend.
    - { itemTemplatePath: /trade/farming/thing/seed/lime, par: 2 }
    - { itemTemplatePath: /trade/farming/thing/seed/lemon, par: 2 }
    - { itemTemplatePath: /trade/farming/thing/seed/orange, par: 2 }
    - { itemTemplatePath: /trade/farming/thing/seed/grapefruit, par: 2 }
    - { itemTemplatePath: /trade/farming/thing/seed/cherry, par: 2 }
    - { itemTemplatePath: /trade/farming/thing/seed/olive, par: 2 }
    - { itemTemplatePath: /trade/farming/thing/seed/mint, par: 3 }
    - { itemTemplatePath: /trade/farming/thing/seed/cranberry, par: 2 }
    - { itemTemplatePath: /trade/farming/thing/seed/grape, par: 2 }
    - { itemTemplatePath: /trade/farming/thing/seed/juniper, par: 2 }
    # The homebrew line (fermentation D15/P13): the whole kit on the
    # stipend — carboy, small press, small mash tun, culture jar, and
    # the small pot still, sold openly (D11's fire is the deterrent;
    # excise is the fiction's future). Malt is the distributor's line.
    - { itemTemplatePath: /stuff/thing/vessel/carboy, par: 2 }
    - { itemTemplatePath: /stuff/thing/vessel/culture-jar, par: 2 }
    - { itemTemplatePath: /trade/winemaking/thing/small-press, par: 1 }
    - { itemTemplatePath: /trade/brewing/thing/small-mash-tun, par: 1 }
    - { itemTemplatePath: /trade/distilling/thing/small-still, par: 1 }
    # The furnishings line (residences D7/D11). These cite the GENERIC
    # `/stuff/thing/fixture/` rows — the same reason the gardening line
    # cites the farming pack's pots rather than copying them: one bed row,
    # one armchair row, and a store that stocks what the world already has.
    # Low par on purpose: a shop floor is not a warehouse, and the reset
    # sweep tops it back up.
    - { itemTemplatePath: /stuff/thing/fixture/bed, par: 1 }
    - { itemTemplatePath: /stuff/thing/fixture/wardrobe, par: 1 }
    - { itemTemplatePath: /stuff/thing/fixture/table, par: 2 }
    - { itemTemplatePath: /stuff/thing/fixture/armchair, par: 2 }
    - { itemTemplatePath: /stuff/thing/fixture/sconce-lamp, par: 3 }
    # The householder's kit — the tool `maintain` needs, and the only
    # thing that confers the verb. A cross-pack line (the residence pack
    # ships the substrate's own goods); the same rule as the others —
    # one kit row in the world, and a shop that sells it.
    - { itemTemplatePath: /system/residence/thing/householders-kit, par: 3 }
    # The mana line. A cell is what makes a mana-powered device usable
    # by somebody with no gift at all — the lamp on a dorm wall, the
    # frontier TPA post that has nothing else feeding it. Cross-pack for
    # the same reason as the pots and the kit: one cell row in the
    # world, and a shop that sells it.
    - { itemTemplatePath: /system/arcana/thing/mana-cell, par: 4 }
    - { itemTemplatePath: /system/arcana/thing/mana-lamp, par: 2 }
    # ⭐⭐ The HAULAGE line, and the first row of it is the whole point.
    #
    # A labor market whose smallest job needs capital is not an entry
    # rung. The handcart's template has existed since the encumbrance
    # build and was **placed nowhere and sold nowhere** — the mechanism
    # correct, the enabling data absent, and the failure silent. It is on
    # a shelf now, cheap, so a character with a stipend and no transcript
    # can take a haul gig on the day they arrive.
    #
    # ⚠ You cannot MAKE any of these. The wainwright is a named gap in
    # vocations.md and a stated non-goal of the logistics build, so until
    # somebody builds one the general store is where a rig comes from —
    # and this comment is the record that it is a stand-in rather than a
    # design. The barge and the coach are NOT here: a boat in a general
    # store is silly, and the depot at Wharfside is where those belong.
    - { itemTemplatePath: /stuff/thing/gear/handcart, par: 3 }
    - { itemTemplatePath: /system/transport/thing/sledge, par: 1 }
    - { itemTemplatePath: /system/transport/thing/dray, par: 1 }
    - { itemTemplatePath: /system/transport/thing/wagon, par: 1 }
  prices:
    /world/terminus/general-store/thing/torch: 2
    /world/terminus/general-store/thing/rations: 3
    /world/terminus/general-store/thing/waterskin: 4
    /world/terminus/general-store/thing/clasp-knife: 6
    /world/terminus/general-store/thing/lantern: 10
    /world/terminus/general-store/thing/whetstone: 3
    /world/terminus/general-store/thing/iron-ingot: 5
    /world/terminus/general-store/thing/sewing-kit: 5
    /world/terminus/general-store/thing/sewing-machine: 18
    # Against the shipped ladder (stipend 20; torch 2, rations 3, waterskin
    # 4, clasp-knife 6, lantern 10). The large pot is deliberately a real
    # but reachable purchase — it is the first thing a new player has a
    # REASON to buy, and the reason is legible before the purchase.
    /trade/farming/thing/pot/small: 3
    /trade/farming/thing/pot/large: 8
    /stuff/thing/vessel/soil-sack: 2
    /trade/farming/thing/seed/snake-plant: 5
    /trade/farming/thing/seed/lime: 6
    /trade/farming/thing/seed/lemon: 6
    /trade/farming/thing/seed/orange: 6
    /trade/farming/thing/seed/grapefruit: 6
    /trade/farming/thing/seed/cherry: 6
    /trade/farming/thing/seed/olive: 6
    /trade/farming/thing/seed/mint: 4
    /trade/farming/thing/seed/cranberry: 5
    /trade/farming/thing/seed/grape: 6
    /trade/farming/thing/seed/juniper: 5
    # The homebrew kit: all of it reachable on the stipend across a
    # week's wages (D15) — the still the dearest thing on the shelf.
    /stuff/thing/vessel/carboy: 7
    /stuff/thing/vessel/culture-jar: 4
    /trade/winemaking/thing/small-press: 8
    /trade/brewing/thing/small-mash-tun: 8
    /trade/distilling/thing/small-still: 12
    # Furnishings sit at the TOP of the ladder — a home is the first thing
    # in the game worth saving for. Against the anchors (stipend 20,
    # sewing-machine 18, wages 4-6/hr): a sconce is an evening's wage, a
    # bed is a week of them. The bed is dearest by design; it is also the
    # one that pays back (`restQuality: 2.0` while you are away).
    /stuff/thing/fixture/bed: 45
    /stuff/thing/fixture/wardrobe: 34
    /stuff/thing/fixture/armchair: 26
    /stuff/thing/fixture/table: 22
    /stuff/thing/fixture/sconce-lamp: 12
    # Cheap on purpose: upkeep must never be the thing you cannot afford
    # to do. It wears with use, so the recurring cost is real without the
    # first one being a barrier — a couple of hours' wages.
    /system/residence/thing/householders-kit: 9
    # ⭐ Against the ladder (stipend 20; lantern 10, sconce-lamp 12): a
    # cell is an evening's wage and buys about fifteen level TPA hops, so
    # the mana half of a fare is a real cost a traveller can choose to
    # carry instead of paying. The lamp sits beside the ordinary sconce,
    # a little dearer for never needing oil.
    /system/arcana/thing/mana-cell: 6
    /system/arcana/thing/mana-lamp: 16
    # ⭐⭐ The haulage ladder, and the FIRST NUMBER IS THE DESIGN.
    #
    # A handcart at 8 is inside a 20-credit stipend with change for
    # rations — so band 0 can obtain a rig, take a haul gig and be paid,
    # without borrowing money and without a transcript (AC15a). Everything
    # above it is a real step: the sledge is cheap and horrible, the dray
    # is a working purchase, and the wagon sits above the bed as the
    # dearest thing in the shop — because a wagon is a business and a bed
    # is a home, and those are the two things worth saving for.
    #
    # ⚠ None of these prices is a balance claim. They are a LADDER
    # against the shipped anchors (stipend 20, wages 4-6 per game-hour),
    # and the one that matters is the bottom of it.
    /stuff/thing/gear/handcart: 8
    /system/transport/thing/sledge: 14
    /system/transport/thing/dray: 60
    /system/transport/thing/wagon: 95
