# A punched-tin lantern — a real, carriable light that BURNS FUEL.
#
# ⭐ A `Lamp` (Burner ⊕ LightSource ⊕ Reserved ⊕ Thermal): sold unlit and
# unfilled-of-nothing, `light lantern` sets it going, and it goes out on its
# own when the oil is gone. Until the envelope build it was a `PortableLight`
# — a `Switchable` — which meant it burned forever, and the only reason that
# never mattered is that nowhere in the realm was dark.
class: /platform/thing/Lamp
data:
  shortDescription: punched-tin lantern
  keywords: [lantern, lamp, light, tin, punched-tin]
  register: indefinite
  longDescription: |
    A punched-tin lantern with a little glass door and a hook to hang it by. Lit, it throws a steady patterned light where a torch only gutters. It costs more than a fistful of torches and is worth it the first time you need both hands and still want to see — and unlike a torch you can fill it again.
  # ⚠ `BurnerMixin.lit` defaults TRUE. A lantern on a shop shelf is out.
  lit: false
  # TIN — the body is, and a whole's material is its outside's.
  _materialPath: /stuff/idea/material/element/tin
  # ⭐⭐ What a lantern is MADE OF (assembly D3, AC 11): a tinsmith's
  # soldered body, a glass pane SEATED in its door and a linen wick SEATED
  # in its burner, all by hand. ⭐ The pane is the FACING — crack it and
  # `Lamp.getEmittedFlux` lets out a third of the light, so the room gets
  # darker; seat a new one (`fit pane to lantern`, a pane off the same
  # shelf) and it gets brighter. ⭐ The wick is the WEAR part, and the
  # chandler sells it by the length.
  bill:
    parts:
      - { part: lantern-body, template: /trade/smithing/thing/lantern-body, count: 1, role: structural, material: /stuff/idea/material/element/tin }
      - { part: pane, template: /trade/glass/thing/pane, count: 1, role: facing, material: /stuff/idea/material/glass/glass }
      - { part: wick, template: /trade/chandlery/thing/wick, count: 1, role: wear, material: /stuff/idea/material/textile/linen }
    joints:
      - { key: glazing, method: seated, members: [pane, lantern-body] }
      - { key: wicking, method: seated, members: [wick, lantern-body] }
  # Steady and bright — the reason it costs more than a torch.
  # ⭐⭐ The darkness sweep (fire build). `emittedIntensity` is a CEILING
  # now, not the reading: luminosity is incandescent soot, so a solid-fuel
  # flame at full draught sheds `fire.light.sootyFloor` (0.6) of it and a
  # starved one climbs back toward it. Every burner's authored figure is
  # scaled by 1/0.6 so a well-run fire lights its room exactly as brightly
  # as it did before — and a badly-run one now lights it MORE, which is
  # the lesson. ⚠ No room lit only by a fire has gone dark (AC20).
  emittedIntensity: 367
  emittedColorTemperature: 2700
  # ⭐ The fire build: fuel is a BED (kilograms, by material) that
  # `stoke` fills, and the vessel's size is a POWER rather than a
  # percentage-per-minute of nothing. What it reaches depends on what
  # is in it.
  # ⭐⭐ A lantern is FILLED, not stoked: `Lamp.fuelSlot()` answers with
  # this interior, so `fill lantern from cask` is the act and `stoke
  # lantern` is refused. Sold dry — the oil is a separate purchase, which
  # is the point of selling a lamp in a shop that also sells oil.
  #
  # ⛔ And it had NO TANK, which is the defect the pack suite caught:
  # `fuelSlot()` answers with this interior and returns `null` when there
  # is no interior capacity, so a lantern with neither a bed nor a slot
  # could be neither stoked nor filled — a light that could never be lit,
  # on a shelf, for sale. The four keys below are the safety lamp's
  # shape, which is the one that works.
  interiorBulk: true
  interiorCapacity: 0.5
  interiorMaterial: /stuff/idea/material/bulk/lamp-oil
  # ⭐ Sold DRY — no `interiorAmount`. The oil is a separate purchase,
  # which is the point of selling a lamp in a shop that also sells oil,
  # and the refusal when you light it is the thing that tells you so.
  closure: liquidTight
  maxBurnPowerW: 300
  fuelCapacityKg: 0
