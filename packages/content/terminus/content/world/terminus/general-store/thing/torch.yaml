# A pitch-pine torch — the cheapest carriable light, and it BURNS DOWN.
#
# ⭐ A `Lamp` (Burner ⊕ LightSource ⊕ Reserved ⊕ Thermal): `light torch`
# sets it going and it gutters out when the pitch is gone. Twice a lantern's
# burn rate for a third of its light, which is the whole trade — a torch is
# what you buy when you are not coming back. Until the envelope build it was
# a `Switchable` `PortableLight` and burned forever.
#
# Priced on the store's price-list (Law 1), never here.
class: /platform/thing/Lamp
data:
  shortDescription: pitch-pine torch
  keywords: [torch, brand, light, pitch-pine]
  register: indefinite
  longDescription: |
    A stout length of pitch-pine, one end bound in oil-soaked rag. Struck alight it throws a guttering, ruddy glow good enough to light a dark passage — the cheapest light a delver ever bought, and the one they never regret carrying until it burns down to their hand.
  # ⚠ `BurnerMixin.lit` defaults TRUE. A torch on a shop shelf is out.
  lit: false
  # ⭐⭐ The darkness sweep (fire build). `emittedIntensity` is a CEILING
  # now, not the reading: luminosity is incandescent soot, so a solid-fuel
  # flame at full draught sheds `fire.light.sootyFloor` (0.6) of it and a
  # starved one climbs back toward it. Every burner's authored figure is
  # scaled by 1/0.6 so a well-run fire lights its room exactly as brightly
  # as it did before — and a badly-run one now lights it MORE, which is
  # the lesson. ⚠ No room lit only by a fire has gone dark (AC20).
  emittedIntensity: 133
  emittedColorTemperature: 1900
  # ⭐ The fire build: fuel is a BED (kilograms, by material) that
  # `stoke` fills, and the vessel's size is a POWER rather than a
  # percentage-per-minute of nothing. What it reaches depends on what
  # is in it.
  # ⭐ A torch IS its fuel, so its bed ships charged with half a kilo of
  # pitch pine and there is nothing to refill — when it is gone it is gone,
  # which is the whole difference from a lantern.
  maxBurnPowerW: 1200
  fuelCapacityKg: 1
  fuelBed:
    /stuff/idea/material/wood/pine: 0.5
