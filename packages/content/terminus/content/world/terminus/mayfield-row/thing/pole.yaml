# A utility pole carrying the Terminus main overhead — where a lineman reaches
# the line to `sever` or `splice` it, and where a storm can fell it.
class: /system/energy/thing/LineAccess
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: utility pole
  keywords: [pole, line, standard, utility, wire]
  register: indefinite
  longDescription: >-
    A tarred timber pole carrying the feeder line overhead, a lineman's climbing
    spikes worn into it and the cross-arm bolted across the top.
  mass: 150
  nodeRef: terminus-mayfield:mayfield
  buried: false
