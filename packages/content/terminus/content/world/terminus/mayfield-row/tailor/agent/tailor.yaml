# Vasca Idrin — at the bench, and the one who remembers you.
#
# ⭐ NPC reaction to dress lives HERE, in a brain, in a pack — never as
# a kernel gauge. *Engine measures; subject values.* What the engine
# knows is grade, condition, fit, colour and mark; what Vasca makes of
# them is Vasca's, and another shopkeeper could reasonably make
# something else of the same facts.
class: /platform/agent/Cast
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: Vasca Idrin
  keywords: [tailor, vasca, idrin, pins, down, one, cuff, tape, round, neck]
  pronouns: she
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  alternateNames: ["vasca", "idrin"]
  shortDescription: "tailor with pins down one cuff and a tape round her neck"
  register: indefinite
  longDescription: |
    Pins down one cuff, a tape round her neck, and the particular way of looking at somebody that means she is not looking at their face. She has your measurements written down somewhere, and if she has not, she would like to.
  dispositions:
    - { disposition: diligence, valence: 70 }
  # ── the dossier ─────────────────────────────────────────────────
  # ⚠ Required by `lint:dossiers` since the identity-ledgers build: a
  # Cast row with no dossier is a named person the ledgers cannot
  # attribute anything to. The `archetype:` stamp is the load-bearing
  # half — `deviation = current derived − archetype baseline` is
  # uncomputable without it, and it is unrecoverable later.
  #
  # ⭐ Vasca RUNS the shop, which is what `proprietor` means here; the
  # counter's `serverPositionKeys: [tailor]` is the seat, not the rung.
  # Proficient at the trade and merely competent at cloth itself — she
  # buys her bolts from the mill and says so.
  archetype: proprietor
  competence:
    - { discipline: tailoring, asserting: proficient }
    - { discipline: textiles, asserting: competent }
  behaviors:
    - brain: /trade/tailoring/behavior/tailors
      trigger: cadence:180s
    # ⭐ She ORDERS the shortfall and RECEIVES what a hauler leaves on the
    # bench (logistics D11) — she does not go and get it. Each short par
    # line becomes a carriage bounty on the TERMINAL HALL's board, which
    # is the board a new arrival reads, and makes this shop the realm's
    # second poster.
    - brain: /lib/behavior/restocks
      trigger: cadence:90s
      config:
        # The cutting table is where a bolt lands.
        shelf: /trade/tailoring/thing/cutting-table
        board: /world/terminus/terminal/thing/job-board
        bench: /trade/haulage/thing/receiving-bench
        # ⚠ Goods PLUS carriage: the mill's weaver consigns a bolt onto
        # the general store's counter at 40, so a hauler fronts 40 and is
        # reimbursed on delivery.
        reward: 48
