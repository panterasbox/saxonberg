# The tailor's shop — a Business.
#
# ⚠ `tailor` at wage 6 — the highest of the three trades, and the only
# one above the dyer. What it buys is FIT PRECISION, which is knowledge
# about a specific body rather than throughput.
class: /platform/idea/Business
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: "the tailor's shop"
  appointingAuthority:
    kind: office
    office: prime-minister
  positions:
    # ⭐ **The TRADE seat** (trades-and-labor D16): two places, and the
    # second is open. Unlike the general store's hand, what this one asks
    # for is competence held rather than work finished — *a competent
    # hand at tailoring* — because a shop that pays 6 for fit precision
    # is buying knowledge about a specific body, and a first-day arrival
    # does not have it.
    #
    # ⭐⭐ It is still not a wall: practising LIFTS it, the refusal says
    # which band is asked and which is held, and the discipline is one
    # anybody can take up. That is the difference between a criterion and
    # a gate — a bare COUNT nothing can move is the harshest rule with no
    # author.
    - key: tailor
      noun: tailor
      label: at the bench
      wageRate: 6
      purchases: true
      headcount: 2
      requires:
        discipline: tailoring
        band: competent
  rosterSlots:
    - positionKey: tailor
      assignee: /world/terminus/mayfield-row/tailor/agent/tailor
      schedule:
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [0, 24] }
  # ⭐⭐ **The SECOND house posting to the hall board** (trades-and-labor
  # D16). One line is not a labor market: the acceptance criterion is work
  # at world start **from more than one supplier**, and until this row the
  # cookhouse was the only poster in the realm.
  #
  # ⚠ The supplier is the GENERAL STORE, not the mill — the mill's weaver
  # consigns bolts onto the store's counter at 40, so that is where a
  # hauler actually buys one. The reward is goods plus carriage.
  #
  # ⚠⚠ The category is `textile`, not `cloth`. A par line matches a good
  # by `getCategory()` or a MATERIAL TAG, and linen's tags are
  # `textile · fibre · organic · plant · cellulose · greige · once-living`
  # — there is no `cloth` among them and no class answers `cloth`, so
  # `cloth` counted nothing on the cutting table and nothing delivered to
  # it would ever have satisfied the line either.
  parLines:
    - { category: textile, unit: count, level: 3, supplier: /world/terminus/general-store/business, exemplar: /trade/textiles/thing/bolt }
  banksAt: goodkin
  operatingLocations:
    - /world/terminus/mayfield-row/tailor/location/shop
    - /world/terminus/mayfield-row/tailor/thing/counter
