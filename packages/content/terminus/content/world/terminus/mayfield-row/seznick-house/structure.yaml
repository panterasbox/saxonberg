# ⭐ Seznick House as ONE building (paint build D6): every unit under it
# reads this house's fabric, and Mayfield Row — the street before its door
# — is where it meets the weather, so `look seznick house`, `survey house`
# and `paint house` answer from the pavement. Its walls and roof stay the
# places' own (`lint:envelope`).
class: /platform/idea/Building
data:
  extent: /world/terminus/mayfield-row/seznick-house
  entrance: /world/terminus/mayfield-row/seznick-house/lobby
  shortDescription: Seznick House
  register: definite
  keywords: [seznick, house, building, "seznick house", "lodging house"]
  longDescription: >-
    A narrow brick lodging house of four floors, its sash windows in white
    frames and its front door up two worn steps from the pavement.
  heightM: 13
  # ⭐ White lead in linseed oil on its frames and front (paint D20) — the
  # coat the weather takes first; Walter mends the sills, a painter the coat.
  coats:
    outside:
      - material: /trade/painting/idea/material/linseed-oil
        thicknessM: 0.00003
        state: set
        paint:
          binder: /trade/painting/idea/material/linseed-oil
          pigments:
            - { material: /trade/painting/idea/material/lead-white, share: 1 }
          solidsFraction: 0.8
