# Seznick House — the elastic unit building (residences D3/D10): the
# generic /system/residence/idea/BuildingWarren under a data row. Units mint on
# demand at `f<floor>-u<pos>` (the `u` leaf keeps dorm tooling from
# misreading them), floors stack as they fill (4 to a landing), empty
# units go dormant, and the durable slot set reconstitutes the shape.
# Capacity is the operator's `mayfield.unitCap` dial over the shipped 8.
class: /system/residence/idea/BuildingWarren
data:
  programmePath: /world/terminus/mayfield-row/seznick-house/unit-programme
  corridorTemplate: /world/terminus/mayfield-row/seznick-house/corridor
  lobbyPath: /world/terminus/mayfield-row/seznick-house/lobby
  # Who lets the flats (Walter's agency), the domicile a let stamps, and
  # the branch a unit's leaf hangs off (`…/units/f1-u1`) — the let is the
  # building's own act (`LettingWarren`).
  agencyPath: /world/terminus/mayfield-row/idea/agency
  domicile: terminus/mayfield-row/seznick-house
  unitsBranch: units
  parentExtent: /world/terminus/mayfield-row/seznick-house
  capacityKey: mayfield.unitCap
  defaultCapacity: 8
  plan:
    shape: linear
    frontagesPerNode: 4
    frontageLeaf: u
