# /world/terminus/mayfield-row/seznick-house/place — the ZONE of a
# Seznick House unit's PLAN, and a zone that is COPIED (zone-instancing
# D1): every let unit is a copy of it, minted by the unit programme at the
# unit's extent — a zone of its own, whose rooms take the cells their rows
# author, and which inherits from where the unit stands. Nothing stands in
# this row's own instance: a room joins a copy, never the row.
#
# The unit's front door (`unit-1`, `unit-2` — named for the unit it opens,
# because a landing serving four units cannot spend four compass points on
# them) leads from the corridor's zone into the unit's copy: a way between
# two zones, so it may be named.
#
# ⚠ The filename is load-bearing: a zone row zones the directory that
# shares its name, so this file zones `location/`, where the plan's rows
# are. `pnpm lint:locations` refuses a zone row with nothing under it.
class: /platform/idea/place/MintedZone
data:
  name: Seznick House units
  # Covered by a Locality, so a walk here files claims on your map
  # (navigation card review — a zone with no address wrote nothing).
  address: terminus/mayfield-row/seznick-house
  cellSize: 3.0
  mintedBy: /world/terminus/mayfield-row/seznick-house/unit-programme
