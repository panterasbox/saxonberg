# The Seznick House unit programme (residences D16): one row, one keyed
# instance per leased unit (scope = this row, key = the unit's parcel
# extent `…/units/f<floor>-u<pos>`). EMPTY AT MOVE-IN (D9): the rooms
# are built-ins-only rows; the tenant places owned chattel, and lease
# end evicts it to storage intact. `landlord-shell` (D5): Mayfield
# Holdings owes the shell — the term rent will later pay for — and the
# tenant owes walls-in. The bathroom is the generic archetype row
# directly (it is all built-ins) — a plan row that extends it.
#
# ⭐ Its PLAN is its own (no blueprint row):
# every let unit's rooms, authored as an ordinary place under `location/`
# (its own zone) — the hall you come in by, the main room north of it, the
# bedroom west and the bathroom beyond it. Each unit's rooms are keyed
# `(room row, <unit extent>/<leaf>)`; the plan's rows are never served.
#
# ⭐ It names NO `buildings`: a flat is not a building of its own, it is in
# one — every unit's extent lies under Seznick House's (`structure.yaml`),
# so its rooms read that building's fabric and coat.
class: /system/residence/idea/HoldingWarren
data:
  upkeepTerm: landlord-shell
  extent: /world/terminus/mayfield-row/seznick-house/location
  entrance: /world/terminus/mayfield-row/seznick-house/location/hall
