# The cobbler's last and awl (repair D16) — the instrument a mend of
# leather is paced by (`mending`). Bolted to the bench; you work at it.
class: /platform/thing/MendingTool
data:
  shortDescription: last and awl
  keywords: [last, awl, "last and awl", bench]
  register: indefinite
