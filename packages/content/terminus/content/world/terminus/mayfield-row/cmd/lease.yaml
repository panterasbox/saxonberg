verbs: [lease]
category: civics
controller: /world/terminus/mayfield-row/idea/cmd/LeaseController
description: "Lease a Seznick House unit to a player"
help: |
  Mint and lease a Seznick House unit to the named player. The unit takes
  the lowest free slot (floors open as they fill), is titled under the
  building's parcel, leased to the player, keyed fresh, and comes EMPTY —
  built-ins only; the tenant furnishes it with owned goods.

  Authorized for the letting agency's staff (Walter fronts this in the
  world) or a member of the building's committee — a seat, never a
  credential. The ascent gate reads the condition of what the
  player already holds.
examples:
  - cmd: lease alice
    note: Lease Alice the next free unit
args:
  - name: player
    type: object
    required: true
    scope: "online"
    requires: class:Agent
