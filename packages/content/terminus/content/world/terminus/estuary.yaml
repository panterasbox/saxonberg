# The estuary — Terminus's export road, and the realm's one water lane.
#
# ⭐ **The towpath and the reach are the SAME GROUND, read by two lanes.**
# Every exit here admits `ground` and `water`, so the walking lane and the
# barge lane induce over the same edges — which is exactly why edge
# duration lives on the exit and not on the lane: two lanes share the
# ground, and the number belongs to the ground.
#
# ⚠ The contrast with the Delight road is the point (D18 / AC15h): three
# rooms, SHORT edges, continuous incident — a walk you take rather than
# one you endure — against four rooms and long edges on the same total
# budget. Same duration, completely different road.
#
# Below the confluence, so a barge gets up it. The gorge above Terminus
# is *"steep enough that no boat has ever been up it"* — the water build
# decided that, not this one.
# ⚠ Its rooms author NO ambient light (maritime drive finding): an
# authored `ambientIntensity` REPLACES the sky's noon flux rather than
# calibrating it, and the 600–700 lumens these rows carried, spread over a
# 20-metre cell, read under two lux — the estuary was too dark to describe
# at noon. With nothing authored, each room follows the sky over its own
# floor area, as an outdoor room should.
class: /platform/idea/location/CartesianZone
data:
  name: The Estuary
  cellSize: 20.0
  # ⭐ The horizon from here (maritime R3) names the ZONE the terminal
  # stands in; whether its clock tower is in view is derived (open sky,
  # its height against the zones' size). Described once, on the tower.
  horizon:
    - /world/terminus/terminal
