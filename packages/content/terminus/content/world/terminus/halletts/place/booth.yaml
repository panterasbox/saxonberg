# Hallett's front-window booth (stream arrival D20) — the broadcast desk in
# the glass, off the University Avenue crossing the arrival gate opens on, so
# a newcomer passes the window. A broadcaster at the desk has `program` and
# `rodney` with no app (`BroadcastDesk`, through `peers`); the on-air sign in
# the window is lit exactly while somebody in here is on the air
# (`OnAirSign`, derived — never a flag).
#
# ⭐ Its light has two named sources: spill through the door by day (the
# light walk carries daylight one hop), and the booth lamp, so it reads at
# night. The sign is a third while it is lit.
class: /platform/place/Hall
data:
  coords: { x: 0, y: 0, z: 0 }
  shortDescription: "Hallett's booth"
  keywords: [booth, halletts, "hallett's", studio, window]
  register: proper
  _address: terminus/city/university-avenue/halletts
  # Brick under slate, like its neighbors.
  enclosure: { material: /stuff/idea/material/ceramic/brick, thicknessM: 0.23 }
  roof: { material: /stuff/idea/material/rock/slate, thicknessM: 0.01 }
  longDescription: |
    A narrow booth built into the front window of an old storefront, so that whoever sits at the desk sits in full view of the avenue. HALLETT'S is lettered backwards across the glass in chipped gold, and beneath it, newer and smaller, home of Pantera's Box. A broad desk faces the window with a microphone on a swing arm; behind it, under a dust sheet, stands the shape of an upright piano. The walls are hung with framed photographs of crowds pressed against this same glass.
  details:
    glass:
      keywords: [glass, lettering, letters, gold]
      description: |
        Old gold leaf, read from the street the right way round: HALLETT'S. Below it, in plainer paint, someone has added home of Pantera's Box.
    piano:
      keywords: [piano, sheet, "dust sheet", upright]
      description: |
        An upright piano under a grey dust sheet, its shape unmistakable. June Hallett played it in this window, the photographs say; nobody has lifted the sheet in years.
    photographs:
      keywords: [photographs, photos, pictures, crowds, frames]
      description: |
        The crowded years: faces packed three deep against the window, a woman at the piano laughing over her shoulder at them, the same gold letters reversed across every picture.
  exits:
    avenue:
      destination: /world/terminus/university-avenue/place/crossing
      edgeMinutes: 1
      # One door, two sides — the avenue's way in.
      door: /world/terminus/halletts/thing/booth-door
  adornments:
    - { template: /world/terminus/halletts/thing/booth-lamp, slot: lamp:booth }
    - { template: /world/terminus/halletts/thing/on-air-sign, slot: sign:window }
  props:
    - /world/terminus/halletts/thing/broadcast-desk
