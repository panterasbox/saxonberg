id: terminus
version: 0.1.0
root: /world/terminus
description: >-
  Terminus — the core city locality, homed whole out of the transitional
  world-seed (residences D18): University Avenue, the terminal,
  Counting-House Row, the general store, the Registry, Mayfield Row and
  the city budget, content and parked TS together. saxonberg-lounge stays
  a dependency for ONE reason — the departure terminal's route names
  /world/lounge/thing/terminal; the two corpo edges carry the
  counting-houses affiliations.

  University Avenue is the city street the university gate opens onto —
  it runs from the terminal mouth past the campus wall down to the
  Counting-Houses, and every room on it is somewhere a traveller passes
  through. It first shipped under /world/terminus/eternal because it shared a path
  root with the campus; the path is now what the world already said.
  Behind the gate is Eternal University's, and it is a different pack.
requires:
  groups:
    - name: terminus
      purpose: the Terminus municipality
    # The landlord — the group that HOLDS Seznick House. Players only
    # (economic bootstrap D8): Walter used to be enrolled here, and an
    # NPC on a committee is doctrine 2 broken. He is staff of the
    # `mayfield-row/idea/agency` Organization now; this group is empty at
    # boot and falls to the founder until the Compact seats it.
    - name: mayfield-holdings
      purpose: the landlord of Seznick House
  title:
    # ⭐ The REALM root (economic bootstrap D5): Terminus the realm holds
    # every piece of 1.0 content — the city's districts below, and the
    # localities that re-rooted under it (rejection, eternal, hearthworks,
    # hearts-delight, hinkley-hills). The title tree IS the situs tree:
    # a player's estate escheats UP it, so every district names this as
    # its parent. The realm committee and the city committee are one
    # group until the Compact subdivides — deliberately.
    # ⚠ The realm root declares a powerBand (so its city children inherit one
    # for lint:power-posture) but NO feeder: a feeder citation here would be
    # inherited by every locality under the realm — HD, Hinkley, Rejection —
    # which do NOT draw from the Terminus main. Each city district cites its own.
    - { extent: /world/terminus, holder: { group: terminus }, landUse: civic, powerBand: commercial }
    # The Terminus municipality's ground.
    - { extent: /world/terminus/terminal,        parentParcel: /world/terminus, holder: { group: terminus }, landUse: civic, feeder: terminus-main:crossing }
    - { extent: /world/terminus/counting-houses, parentParcel: /world/terminus, holder: { group: terminus }, landUse: commercial, feeder: terminus-main:avenue }
    - { extent: /world/terminus/general-store,   parentParcel: /world/terminus, holder: { group: terminus }, landUse: commercial, feeder: terminus-main:avenue }
    # The farmers market — the produce square off the counting-houses.
    - { extent: /world/terminus/market,          parentParcel: /world/terminus, holder: { group: terminus }, landUse: commercial, feeder: terminus-main:square }
    - { extent: /world/terminus/registry,        parentParcel: /world/terminus, holder: { group: terminus }, landUse: civic, feeder: terminus-main:avenue }
    # University Avenue — the city street the campus gate fronts. Civic
    # like every other public street the municipality keeps.
    - { extent: /world/terminus/university-avenue, parentParcel: /world/terminus, holder: { group: terminus }, landUse: civic, feeder: terminus-main:crossing }
    # Mayfield Row (residences D9): the municipality holds the street;
    # the private landlord holds the building the units subdivide under.
    - { extent: /world/terminus/mayfield-row, parentParcel: /world/terminus, holder: { group: terminus }, landUse: residential, powerBand: domestic, feeder: terminus-mayfield:mayfield }
    - { extent: /world/terminus/mayfield-row/seznick-house, parentParcel: /world/terminus/mayfield-row, holder: { group: mayfield-holdings }, landUse: residential, powerBand: domestic, feeder: terminus-mayfield:mayfield }
    # The land agents' shopfront (residences D14). Commercial, and the
    # municipality's like the rest of the built city — the office SELLS
    # ground, it does not own the ground it sells.
    - { extent: /world/terminus/realty, parentParcel: /world/terminus, holder: { group: terminus }, landUse: commercial, feeder: terminus-main:avenue }
    # ⭐ The two corridors (logistics D18/D20): a road corridor is
    # SUBDIVIDED AS ITS OWN PARCEL, so the road across somebody's flats
    # is the road's ground and not theirs — which is what makes
    # toll-versus-obstruction resolvable when the contested-road build
    # lands. **No seventh land use was needed**: the closed six already
    # carry it.
    #
    # `civic` — "offices, parks and THE COMMONS" — is the public highway.
    # The estuary towpath is the city's own working waterfront and is
    # kept by the municipality like any other street.
    - { extent: /world/terminus/estuary, parentParcel: /world/terminus, holder: { group: terminus }, landUse: civic, powerBand: off-grid }
    # ⚠ `wild` — "unserviced ground: PASSAGE and gathering only" — is the
    # Delight road, which crosses ground nobody's municipality maintains.
    # The civic/wild split IS the toll-versus-obstruction distinction
    # already: a gate on ground you hold is legitimate, a barricade on
    # the commons is not. No mechanic, no new entry, decided.
    - { extent: /world/terminus/delight-road, parentParcel: /world/terminus, holder: { group: terminus }, landUse: wild }
    # ⭐ The orphans, claimed (economic bootstrap, retrofit step 3): these
    # four resolved to the platform's `/world` — the executive — which is
    # exactly what doctrine 1 exists to prevent. Wharfside is the
    # workshop district (the mill and the dyehouse); the goods yards hold
    # the producers' floors; the infirmary and the necropolis are the
    # city's civic ground.
    - { extent: /world/terminus/wharfside,   parentParcel: /world/terminus, holder: { group: terminus }, landUse: industrial, powerBand: industrial, feeder: terminus-main:bank }
    - { extent: /world/terminus/goods-yards, parentParcel: /world/terminus, holder: { group: terminus }, landUse: industrial, powerBand: industrial, feeder: terminus-main:bank }
    # ⭐⭐ **The three noxious trades, each titled as its own parcel inside
    # the industrial district.** `landUse: industrial` is the honest word
    # — `settlement-model`'s own test is *what LEAVES* — and the three of
    # them are the realm's first LULU cluster shipped on purpose: a
    # knacker, a tannery and a chandlery, chained so each one's product is
    # the next one's feedstock.
    #
    # ⚠ `powerBand: off-grid` on the tannery and the knacker, and it is
    # not an oversight. Both run on a fire and a pit; neither has anything
    # to plug in, and the estuary and the necropolis are already authored
    # the same way. The chandlery takes `industrial` with its neighbours
    # because it has a shop front and will want a lamp over the counter
    # the day anybody wires one.
    - { extent: /world/terminus/wharfside/knackers,  parentParcel: /world/terminus/wharfside, holder: { group: terminus }, landUse: industrial, powerBand: off-grid }
    - { extent: /world/terminus/wharfside/tannery,   parentParcel: /world/terminus/wharfside, holder: { group: terminus }, landUse: industrial, powerBand: off-grid }
    - { extent: /world/terminus/wharfside/chandlery, parentParcel: /world/terminus/wharfside, holder: { group: terminus }, landUse: industrial, powerBand: industrial, feeder: terminus-main:bank }
    - { extent: /world/terminus/infirmary,   parentParcel: /world/terminus, holder: { group: terminus }, landUse: civic, feeder: terminus-main:avenue }
    - { extent: /world/terminus/necropolis,  parentParcel: /world/terminus, holder: { group: terminus }, landUse: civic, powerBand: off-grid }
boot:
  # ⭐⭐ The Hesper (maritime D10): a craft under way must ADVANCE with
  # nobody aboard and re-arm its voyage after a restart, so she is stood
  # up at boot, not when somebody first walks onto her deck. ⚠ Her dinghy
  # is NOT listed: it is a prop on her deck (a singleton row), and booting
  # it too would clone it twice.
  - { template: /world/terminus/hesper/structure, role: producer, reason: "the Hesper — a ship under way advances and re-arms her voyage with nobody aboard" }
  - { template: /world/terminus/hesper/idea/outfit, role: producer, reason: "the Hesper's company — the lookout seat is read off its live roster, and an advertised opening needs a live house" }
  - { template: /world/terminus/mayfield-row/seznick-house/building, role: producer, reason: warms the unit caches from the durable slot set and installs the lobby stair at postRegister }
  - { template: /world/terminus/mayfield-row/idea/agency, role: producer, reason: "Mayfield Holdings — the letting agency; lease/unlease ask whether the actor holds its agent position, read off the authored roster" }
  # ⚠ Moved here with the room from `trade-distilling`: a showroom on the
  # avenue is a PLACE, so the locality holds it. Everything IN it is
  # still the distilling trade's — the racking, the counter, the clerk.
  - { template: /world/terminus/counting-houses/cash-and-carry, role: producer, reason: "the distributor's counter must be resident for the trades' hands to consign onto it and for the boot spawn sweep to have a census" }
  # ⭐ The one chartered bank (economic bootstrap D19): the window presents
  # its paper, `bank borrow` resolves it as the lender, and `appoint … at`
  # its chart needs it resident — a business stood up lazily is a business
  # nobody can be appointed to until somebody trades at it.
  - { template: /world/terminus/counting-houses/business, role: producer, reason: "Goodkin's chartered business — the lender every `bank borrow` at the hall resolves, and the chart the Registrar's committee appoints to" }
  # ⭐ The trade premises' producers (economic bootstrap D6): a floor's
  # Stock is the home container its trade's rows spawn into, and an
  # outfit's hand runs its brain over a live Business. Moved here WITH the
  # rows — a `boot:` entry belongs to the pack that ships the template.
  - { template: /world/terminus/wharfside/mill/location/floor, role: producer, reason: "the mill floor — its Stock is the home container bolts spawn into, and its weaver runs the consigns brain" }
  - { template: /world/terminus/wharfside/mill/idea/outfit, role: producer, reason: "the weaver's `purchases` position is materialized over a live business; the consigns beat trades as it" }
  - { template: /world/terminus/wharfside/dyehouse/location/floor, role: producer, reason: "the dyehouse floor — its counter is the attendance point customers queue at" }
  - { template: /world/terminus/wharfside/dyehouse/idea/outfit, role: producer, reason: "the dyer's position is materialized over a live business" }
  # ⭐⭐ **The three carcass-chain premises, and the reason each needs TWO
  # entries is the one `lint:openings` holds.** A business advertises into
  # a ROOM; the derived help-wanted sign reads LIVE businesses only (a
  # `look` may not stand a house up), and a room nothing has reached is a
  # room the sign cannot be read in. Both halves, or the vacancy is
  # invisible — which is the shape that cost the campus farm a build.
  #
  # ⚠ All three roster EMPTY on purpose: the premises exist, the work is
  # there, and nobody is doing it. That is the content.
  - { template: /world/terminus/wharfside/knackers/location/yard, role: producer, reason: "the knacker's yard — the room the knacker vacancy is advertised in, and where a carcass arrives off the works-board" }
  - { template: /world/terminus/wharfside/knackers/idea/outfit, role: producer, reason: "the knacker's vacant seat — requires butchery at novice, and the refusal is only readable off a live business" }
  - { template: /world/terminus/wharfside/tannery/location/yard, role: producer, reason: "the tanyard — its pits are the premises, and a prop nothing warms is a pit that is not there" }
  - { template: /world/terminus/wharfside/tannery/idea/outfit, role: producer, reason: "the tanner's vacant seat — requires leatherwork at novice, the one Discipline this build mints" }
  - { template: /world/terminus/wharfside/chandlery/location/floor, role: producer, reason: "the chandlery floor — its counter is the only shop front in the district, and the dip-pot is the trade" }
  - { template: /world/terminus/wharfside/chandlery/idea/outfit, role: producer, reason: "the chandler's vacant seat — the ONE of the three with no requirement at all, and the one a new player can actually take" }
  - { template: /world/terminus/goods-yards/crowsfoot/location/floor, role: producer, reason: "the Crowsfoot outfit's yard — same shape as the floor's, one small-batch label" }
  - { template: /world/terminus/goods-yards/veshko/location/distillery, role: producer, reason: "Veshko's yard — its Stock is the home container the Volk and unbranded rows spawn into (the zone's stocks: sets the counts), and its hand runs the consigns brain" }
  - { template: /world/terminus/goods-yards/hollis/location/floor, role: producer, reason: "Hollis's bottling floor — its Stock is the home container the private-label rows spawn into, and its hand runs the consigns brain" }
  - { template: /world/terminus/goods-yards/crowsfoot/idea/outfit, role: producer, reason: "the Crowsfoot hand's `purchases` position likewise" }
  - { template: /world/terminus/goods-yards/veshko/idea/outfit, role: producer, reason: "Veshko Distilling (parentOrganization /corpo/veshko) — the hand's purchases position is materialized over a live business; the consigns beat trades as it" }
  - { template: /world/terminus/goods-yards/hollis/idea/outfit, role: producer, reason: "Hollis Bottling (parentOrganization /corpo/hollis) — likewise" }
  # ⭐ The oil works (energy build). The floor warms the Stock the lamp-oil
  # casks spawn into — WITHOUT it, a cask's `container` resolution is the first
  # thing to stand the Stock up, mid-spawn, and the reentrant populate trips the
  # clone-tree cycle guard (lamp-oil-cask → lamp-oil-cask). Found by the live
  # boot; the wire drive and the unit tests never stood the Stock up this way.
  - { template: /world/terminus/goods-yards/oilworks/location/floor, role: producer, reason: "the oil works' floor — its Stock is the home container the lamp-oil casks spawn into, and its hand runs the consigns brain" }
  - { template: /world/terminus/goods-yards/oilworks/idea/outfit, role: producer, reason: "the hand's `purchases` position is materialized over a live business; the consigns beat trades as it" }
  - { template: /world/terminus/goods-yards/bottling/location/floor, role: producer, reason: "the outfit's yard — its Stock is the home container the mixers and ice spawn into, and its hand runs the consigns brain" }
  - { template: /world/terminus/goods-yards/bottling/idea/outfit, role: producer, reason: "the hand's `purchases` position is materialized over a live business; the consigns beat trades as it" }
  - { template: /world/terminus/goods-yards/pantry/location/floor, role: producer, reason: "the pantry outfit's storeroom — its Stock is the home container the sacks spawn into, and its hand runs the consigns brain" }
  - { template: /world/terminus/goods-yards/pantry/idea/outfit, role: producer, reason: "the hand's `purchases` position is materialized over a live business; the consigns beat trades as it" }
  - { template: /world/terminus/goods-yards/brewing/location/floor, role: producer, reason: "the outfit's yard — its Stock is the home container the floor kegs spawn into, and its hand runs the consigns brain" }
  - { template: /world/terminus/goods-yards/brewing/idea/outfit, role: producer, reason: "the hand's `purchases` position is materialized by the roster tick over a live business; the consigns beat trades as it" }
  - { template: /world/terminus/goods-yards/brewing/location/cold-store, role: producer, reason: "the lager line lives here — the cold vats, the cold culture, and the cellars beat that kegs it" }
  - { template: /world/terminus/goods-yards/farm/location/yard, role: producer, reason: "the farm — its Stock is the home container the crates spawn into, and its hand runs the consigns brain" }
  - { template: /world/terminus/goods-yards/farm/idea/outfit, role: producer, reason: "the hand's `purchases` position is materialized over a live business; the consigns beat trades as it" }
  - { template: /world/terminus/goods-yards/vintner/location/floor, role: producer, reason: "the outfit's yard — its Stock is the home container the floor bottles spawn into, and its hand runs the consigns brain" }
  - { template: /world/terminus/goods-yards/vintner/idea/outfit, role: producer, reason: "the hand's `purchases` position is materialized over a live business; the consigns beat trades as it" }
  - { template: /world/terminus/mayfield-row/tailor/location/shop, role: producer, reason: "the shop floor — its counter is the appointment point, and the measurement book lives on it" }
  - { template: /world/terminus/mayfield-row/tailor/idea/outfit, role: producer, reason: "the tailor's position is materialized over a live business" }
  - { template: /world/terminus/counting-houses/distributor/idea/business, role: producer, reason: "the distributor's Business must be live so its clerk is rostered before the first buy" }
  # ⭐ The general store as a PRODUCER (economic bootstrap D14): its keeper
  # runs the `stocks` beat — buying the supplied lines at the cash-and-carry
  # on terms, borrowing at the window when short, shelving what she carries
  # home — with nobody online. A brain on an unspawned NPC never fires, and
  # a business stood up lazily deals no house card until somebody trades.
  - { template: /world/terminus/general-store/shop-floor, role: producer, reason: "the general store's floor — its keeper runs the stocks beat over the counter, and the counter is where the supplied lines land" }
  - { template: /world/terminus/general-store/business, role: producer, reason: "the keeper's `purchases` seat is materialized over a live business; the stocks beat trades as it" }
  # ⭐ The Gazette (economic bootstrap D20): its editor stands on the avenue
  # block and prints the price index once an edition window, as the
  # paper, with nobody online — the room carries her, the organization
  # carries her seat.
  - { template: /world/terminus/counting-houses/avenue-block, role: producer, reason: "the avenue block — the Gazette's editor stands here and runs the prints beat" }
  - { template: /world/terminus/gazette, role: producer, reason: "the Gazette's roster puts its editor in the seat that may publish as it" }
  # ⭐ The blood economy (blood build W5): the ward carries the window
  # fixture + the registrar cast; the collection room's cold case is the
  # producer floor the unit rows spawn into (the sweep needs a live census)
  # and carries the runner + donor cast; the two Businesses must be live so
  # the registrar's seat resolves, the banks brain reads par, and the
  # runner's employment resolves — a brain on an unspawned NPC never fires.
  - { template: /world/terminus/infirmary/ward, role: producer, reason: "the ward carries the blood window fixture and the registrar cast whose banks brain runs the floor/summons/notice" }
  - { template: /world/terminus/infirmary/collection, role: producer, reason: "the collection room's cold case is the home container the blood unit rows spawn into (the zone's stocks: sets the counts), and it carries the runner + donor cast" }
  - { template: /world/terminus/infirmary/idea/window, role: producer, reason: "the blood window's Business must be live so the registrar's seat resolves, collect attributes to it, and banks reads its par" }
  - { template: /world/terminus/infirmary/idea/bloodworks, role: producer, reason: "Goodkin Bloodworks (parentOrganization /corpo/goodkin) — the runner's employment is materialized over a live business" }
