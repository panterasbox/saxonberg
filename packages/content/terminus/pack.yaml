id: terminus
version: 0.1.0
root: /world/terminus
description: >-
  Terminus — the core city locality, homed whole out of the transitional
  world-seed (residences D18): University Avenue, the terminal,
  Counting-House Row, the general store, the Registry, Mayfield Row and
  the city budget, content and parked TS together. saxonberg-lounge stays
  a dependency for ONE reason — the departure terminal's route names
  /world/lounge/thing/terminal; the two corpo edges carry the
  counting-houses affiliations.

  University Avenue is the city street the university gate opens onto —
  it runs from the terminal mouth past the campus wall down to the
  Counting-Houses, and every room on it is somewhere a traveller passes
  through. It first shipped under /world/terminus/eternal because it shared a path
  root with the campus; the path is now what the world already said.
  Behind the gate is Eternal University's, and it is a different pack.
requires:
  groups:
    - name: terminus
      purpose: the Terminus municipality
    # The landlord's staff — Walter's membership is CONFERRED here by
    # the owner (the Katie pattern; never self-enrolled). His row sits
    # under the pack's own seznick-house claim, per the NPC-only fence.
    - name: mayfield-holdings
      purpose: the Mayfield Holdings letting staff
      members:
        - { id: /world/terminus/mayfield-row/agent/walter, role: member }
  title:
    # ⭐ The REALM root (economic bootstrap D5): Terminus the realm holds
    # every piece of 1.0 content — the city's districts below, and the
    # localities that re-rooted under it (rejection, eternal, hearthworks,
    # hearts-delight, hinkley-hills). The title tree IS the situs tree:
    # a player's estate escheats UP it, so every district names this as
    # its parent. The realm committee and the city committee are one
    # group until the Compact subdivides — deliberately.
    - { extent: /world/terminus, holder: { group: terminus }, landUse: civic }
    # The Terminus municipality's ground.
    - { extent: /world/terminus/terminal,        parentParcel: /world/terminus, holder: { group: terminus }, landUse: civic }
    - { extent: /world/terminus/counting-houses, parentParcel: /world/terminus, holder: { group: terminus }, landUse: commercial }
    - { extent: /world/terminus/general-store,   parentParcel: /world/terminus, holder: { group: terminus }, landUse: commercial }
    # The farmers market — the produce square off the counting-houses.
    - { extent: /world/terminus/market,          parentParcel: /world/terminus, holder: { group: terminus }, landUse: commercial }
    - { extent: /world/terminus/registry,        parentParcel: /world/terminus, holder: { group: terminus }, landUse: civic }
    # University Avenue — the city street the campus gate fronts. Civic
    # like every other public street the municipality keeps.
    - { extent: /world/terminus/university-avenue, parentParcel: /world/terminus, holder: { group: terminus }, landUse: civic }
    # Mayfield Row (residences D9): the municipality holds the street;
    # the private landlord holds the building the units subdivide under.
    - { extent: /world/terminus/mayfield-row, parentParcel: /world/terminus, holder: { group: terminus }, landUse: residential }
    - { extent: /world/terminus/mayfield-row/seznick-house, parentParcel: /world/terminus/mayfield-row, holder: { group: mayfield-holdings }, landUse: residential }
    # The land agents' shopfront (residences D14). Commercial, and the
    # municipality's like the rest of the built city — the office SELLS
    # ground, it does not own the ground it sells.
    - { extent: /world/terminus/realty, parentParcel: /world/terminus, holder: { group: terminus }, landUse: commercial }
    # ⭐ The two corridors (logistics D18/D20): a road corridor is
    # SUBDIVIDED AS ITS OWN PARCEL, so the road across somebody's flats
    # is the road's ground and not theirs — which is what makes
    # toll-versus-obstruction resolvable when the contested-road build
    # lands. **No seventh land use was needed**: the closed six already
    # carry it.
    #
    # `civic` — "offices, parks and THE COMMONS" — is the public highway.
    # The estuary towpath is the city's own working waterfront and is
    # kept by the municipality like any other street.
    - { extent: /world/terminus/estuary, parentParcel: /world/terminus, holder: { group: terminus }, landUse: civic }
    # ⚠ `wild` — "unserviced ground: PASSAGE and gathering only" — is the
    # Delight road, which crosses ground nobody's municipality maintains.
    # The civic/wild split IS the toll-versus-obstruction distinction
    # already: a gate on ground you hold is legitimate, a barricade on
    # the commons is not. No mechanic, no new entry, decided.
    - { extent: /world/terminus/delight-road, parentParcel: /world/terminus, holder: { group: terminus }, landUse: wild }
    # ⭐ The orphans, claimed (economic bootstrap, retrofit step 3): these
    # four resolved to the platform's `/world` — the executive — which is
    # exactly what doctrine 1 exists to prevent. Wharfside is the
    # workshop district (the mill and the dyehouse); the goods yards hold
    # the producers' floors; the infirmary and the necropolis are the
    # city's civic ground.
    - { extent: /world/terminus/wharfside,   parentParcel: /world/terminus, holder: { group: terminus }, landUse: industrial }
    - { extent: /world/terminus/goods-yards, parentParcel: /world/terminus, holder: { group: terminus }, landUse: industrial }
    - { extent: /world/terminus/infirmary,   parentParcel: /world/terminus, holder: { group: terminus }, landUse: civic }
    - { extent: /world/terminus/necropolis,  parentParcel: /world/terminus, holder: { group: terminus }, landUse: civic }
boot:
  - { template: /world/terminus/mayfield-row/seznick-house/building, role: producer, reason: warms the unit caches from the durable slot set and installs the lobby stair at postRegister }
  # ⚠ Moved here with the room from `trade-distilling`: a showroom on the
  # avenue is a PLACE, so the locality holds it. Everything IN it is
  # still the distilling trade's — the racking, the counter, the clerk.
  - { template: /world/terminus/counting-houses/cash-and-carry, role: producer, reason: "the distributor's counter must be resident for the trades' hands to consign onto it and for the boot spawn sweep to have a census" }
  # ⭐ The trade premises' producers (economic bootstrap D6): a floor's
  # Stock is the home container its trade's rows spawn into, and an
  # outfit's hand runs its brain over a live Business. Moved here WITH the
  # rows — a `boot:` entry belongs to the pack that ships the template.
  - { template: /world/terminus/wharfside/mill/location/floor, role: producer, reason: "the mill floor — its Stock is the home container bolts spawn into, and its weaver runs the consigns brain" }
  - { template: /world/terminus/wharfside/mill/idea/outfit, role: producer, reason: "the weaver's `purchases` position is materialized over a live business; the consigns beat trades as it" }
  - { template: /world/terminus/wharfside/dyehouse/location/floor, role: producer, reason: "the dyehouse floor — its counter is the attendance point customers queue at" }
  - { template: /world/terminus/wharfside/dyehouse/idea/outfit, role: producer, reason: "the dyer's position is materialized over a live business" }
  - { template: /world/terminus/goods-yards/crowsfoot/location/floor, role: producer, reason: "the Crowsfoot outfit's yard — same shape as the floor's, one small-batch label" }
  - { template: /world/terminus/goods-yards/veshko/location/distillery, role: producer, reason: "Veshko's yard — its Stock is the home container the Volk and unbranded rows spawn into (the zone's stocks: sets the counts), and its hand runs the consigns brain" }
  - { template: /world/terminus/goods-yards/hollis/location/floor, role: producer, reason: "Hollis's bottling floor — its Stock is the home container the private-label rows spawn into, and its hand runs the consigns brain" }
  - { template: /world/terminus/goods-yards/crowsfoot/idea/outfit, role: producer, reason: "the Crowsfoot hand's `purchases` position likewise" }
  - { template: /world/terminus/goods-yards/veshko/idea/outfit, role: producer, reason: "Veshko Distilling (parentOrganization /corpo/veshko) — the hand's purchases position is materialized over a live business; the consigns beat trades as it" }
  - { template: /world/terminus/goods-yards/hollis/idea/outfit, role: producer, reason: "Hollis Bottling (parentOrganization /corpo/hollis) — likewise" }
  - { template: /world/terminus/goods-yards/bottling/location/floor, role: producer, reason: "the outfit's yard — its Stock is the home container the mixers and ice spawn into, and its hand runs the consigns brain" }
  - { template: /world/terminus/goods-yards/bottling/idea/outfit, role: producer, reason: "the hand's `purchases` position is materialized over a live business; the consigns beat trades as it" }
  - { template: /world/terminus/goods-yards/pantry/location/floor, role: producer, reason: "the pantry outfit's storeroom — its Stock is the home container the sacks spawn into, and its hand runs the consigns brain" }
  - { template: /world/terminus/goods-yards/pantry/idea/outfit, role: producer, reason: "the hand's `purchases` position is materialized over a live business; the consigns beat trades as it" }
  - { template: /world/terminus/goods-yards/brewing/location/floor, role: producer, reason: "the outfit's yard — its Stock is the home container the floor kegs spawn into, and its hand runs the consigns brain" }
  - { template: /world/terminus/goods-yards/brewing/idea/outfit, role: producer, reason: "the hand's `purchases` position is materialized by the roster tick over a live business; the consigns beat trades as it" }
  - { template: /world/terminus/goods-yards/brewing/location/cold-store, role: producer, reason: "the lager line lives here — the cold vats, the cold culture, and the cellars beat that kegs it" }
  - { template: /world/terminus/goods-yards/farm/location/yard, role: producer, reason: "the farm — its Stock is the home container the crates spawn into, and its hand runs the consigns brain" }
  - { template: /world/terminus/goods-yards/farm/idea/outfit, role: producer, reason: "the hand's `purchases` position is materialized over a live business; the consigns beat trades as it" }
  - { template: /world/terminus/goods-yards/vintner/location/floor, role: producer, reason: "the outfit's yard — its Stock is the home container the floor bottles spawn into, and its hand runs the consigns brain" }
  - { template: /world/terminus/goods-yards/vintner/idea/outfit, role: producer, reason: "the hand's `purchases` position is materialized over a live business; the consigns beat trades as it" }
  - { template: /world/terminus/mayfield-row/tailor/location/shop, role: producer, reason: "the shop floor — its counter is the appointment point, and the measurement book lives on it" }
  - { template: /world/terminus/mayfield-row/tailor/idea/outfit, role: producer, reason: "the tailor's position is materialized over a live business" }
  - { template: /world/terminus/counting-houses/distributor/idea/business, role: producer, reason: "the distributor's Business must be live so its clerk is rostered before the first buy" }
