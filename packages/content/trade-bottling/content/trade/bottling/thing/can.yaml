# The can — the EMPTY vessel bottling fills, and the PARENT every canned
# product extends: same class, same capacity, same construction, plus
# the fill (see `can-of-cola.yaml`).
#
# ⭐ A product row used to repeat all of this, because template
# inheritance did not exist and the README had to be the contract. It
# exists now: a product states its fill, its prose and its census line,
# and nothing else.
#
# `closure: sealed` is CONSTRUCTION (gas-tight — it is why fizzy drinks
# come in cans); `open` is STATE. An empty can is an opened can.
class: /platform/thing/Bottle
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: "can"
  keywords: [can, tin, empty]
  register: indefinite
  longDescription: "A 330 mL aluminium can — drawn in one piece, lined, the lid seamed on. It weighs almost nothing."
  # The VESSEL KIND — the tie between this row and every product
  # that is this vessel filled (an emptied one counts and reads as this).
  category: can
  _materialPath: /stuff/idea/material/element/aluminium
  interiorBulk: true
  interiorCapacity: 0.33
  closure: sealed
  open: true
