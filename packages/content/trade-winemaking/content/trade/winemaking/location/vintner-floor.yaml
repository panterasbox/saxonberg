# the vintner outfit's floor — the yard: the outfit's Stock (the floor rows' home
# `container:` — the sweep stands them at target here) and the hand whose
# `consigns` beat carries them to the cash-and-carry. No exits: the hand
# teleports (the `shifts` shape); a walk is the locomotion slate's.
class: /platform/location/FurnishableRoom
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: "the vintner floor"
  primaryKeyword: floor
  keywords: ["floor", "cellar", "vintner"]
  longDescription: |
    A cool cellar floor under a trapdoor: racked cases, a hand-press in the corner (the crush is the distillery build's; the floor stands at target through the sweep until then).
  ambientIntensity: 25
  ambientColorTemperature: 4200
  populates:
    - /trade/winemaking/thing/vintner-stock
    - /trade/winemaking/agent/vintner-hand
