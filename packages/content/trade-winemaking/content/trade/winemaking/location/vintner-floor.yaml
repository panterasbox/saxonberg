# the vintner outfit's floor — the yard: the outfit's Stock (the floor rows' home
# `container:` — the sweep stands them at target here) and the hand whose
# `consigns` beat carries them to the cash-and-carry. No exits: the hand
# teleports (the `shifts` shape); a walk is the locomotion slate's.
# An ordinary location, not a FurnishableRoom: that class is the
# FURNISHING archetypes' base. A trade floor's durability lives on its
# persistable fixtures (the Stock, the racking, the counter) — the
# consigned goods and their listings ride those, never the room; the
# `populates` set below is the placement and respawns each boot.
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: "the vintner floor"
  primaryKeyword: floor
  keywords: ["floor", "cellar", "vintner", "winery"]
  longDescription: |
    A cool cellar under a trapdoor, and a working one: two oak vats stand chalk-tallied against the wall, the basket press drips into its channel, and the cellar book hangs chained to the rail. Racked cases and empty green bottles wait their turn.
  ambientIntensity: 25
  ambientColorTemperature: 4200
  # The cellar IS the cold storage (the hospitality-cellar precedent):
  # 285 K holds the ferment in the happy band and slows a kept culture.
  _temperature: 285
  # A working cellar displaces its own air (P11): the reserve is what
  # the active ferments drain; the trapdoor is the recovery.
  reserves:
    air:
      capacityValue: 100
      currentValue: 100
      unit: "%"
  props:
    - /trade/winemaking/thing/vintner-stock
    - /trade/winemaking/thing/press
    - /trade/winemaking/thing/vat
    - /trade/winemaking/thing/vat
    - /trade/winemaking/thing/cellar-book
  cast:
    - /trade/winemaking/agent/vintner-hand
