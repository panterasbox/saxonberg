# Mead — ⭐⭐ **the spontaneous one**, and that is historically how it was
# made: honey, water, a warm corner and patience.
#
# ⚠ `spontaneousLagDays: 4` is what makes it work without a pitch. The
# shipped `requiresFlora` predicate is satisfied by any of three clauses,
# and this is the third: a must left **OPEN** catches wild yeast out of
# the air after four game days. A pour from a `wine-culture` jar pitches
# it at once; a must sealed from the start never starts at all. Three
# behaviours, one row, no code.
class: /platform/idea/maturation/MaturationProfile
data:
  key: mead
  mechanism: microbial
  inputCategory: honey-must
  stallBelowK: 283
  happyK: 291
  damageAboveK: 301
  killK: 310
  # Slower than grape must — honey is a poor nitrogen source and a mead
  # ferment really does take longer.
  ratePerDay: 0.04
  productMaterial: /trade/winemaking/idea/material/mead
  turnedMaterial: /trade/winemaking/idea/material/wine-vinegar
  turnDays: 3
  leesFraction: 0.04
  leesMaterial: /trade/winemaking/idea/material/wine-lees
  spontaneousLagDays: 4
