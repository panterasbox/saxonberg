# Ilse Marrow — the vintner outfit's hand. Holds the outfit's `hand` position
# (`purchases: true`): dealt the house card at hire, then the `consigns`
# brain drives the literal verbs — `get`, `wallet use house`, `consign …
# --ask` — carrying the stock to the cash-and-carry counter and consigning
# it AS the outfit. The counter path is this config's, never the trade's.
class: /platform/agent/Cast
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: Ilse Marrow
  pronouns: they
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  primaryKeyword: hand
  alternateNames: ["ilse", "marrow"]
  shortDescription: "a wiry vintner's hand with purple-stained fingers"
  longDescription: |
    A wiry hand with purple-stained fingers and a habit of holding a bottle up to the light before she cases it.
  dispositions:
    - { disposition: diligence, valence: 60 }
  # ── the dossier ─────────────────────────────────────────────────
  # Evidence, never values: each entry below expands into the same rows a
  # lived history would have written, marked `claim`. Seeded once at
  # postRegister and skipped if any claim already exists, so a reclone or
  # a reboot cannot mint a second history.
  # ⚠ A best-guess pass, explicitly provisional — the considered version
  # is a content pass of its own before go-live.
  archetype: hand
  competence:
    - { discipline: winemaking, asserting: novice }
    - { discipline: fermenting, asserting: novice }
  behaviors:
    # The producing beat (fermentation W4): work the press off the
    # cellar book, tend the vats, bottle and consign the take. The W8
    # switchover retired the floor-bottle faucet: every bottle on the
    # counter is now a batch this beat made.
    - brain: /lib/behavior/cellars
      trigger: cadence:120s
      config:
        home: /trade/winemaking/location/vintner-floor
        counterRoom: /trade/distribution/location/cash-and-carry
        crushes: [crush, white-crush]
        compounds: [dry-vermouth, sweet-vermouth]
        buys:
          - { keyword: grapes, count: 2 }
          - { keyword: spirit, count: 1 }
          - { keyword: juniper, count: 1 }
          - { keyword: sugar, count: 1 }
        inputKeyword: grapes
        inputMin: 6
        batch: 4
        buyEvery: 6
        asks:
          red: 11
          white: 10
          sparkling: 16
          vinegar: 4
          dry-vermouth: 12
          sweet-vermouth: 12
    - brain: /lib/behavior/idles
      trigger: cadence:41s
      config:
        pool:
          - { kind: free, value: "holds a bottle to the lamp and turns it." }
          - { kind: free, value: "straws a case." }
