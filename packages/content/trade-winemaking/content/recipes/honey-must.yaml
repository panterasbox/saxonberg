  kind: bulk
  category: honey
  minGrade: poor
  measureL: 1
- slot: water
  kind: bulk
  category: water
  minGrade: poor
  measureL: 3
toolCapabilities: []
outputApplication: bulk
outputTemplate: /trade/winemaking/thing/must-bucket
