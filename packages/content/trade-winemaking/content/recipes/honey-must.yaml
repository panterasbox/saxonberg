# Honey must — ⭐ dilute honey until the yeast can get at it.
#
# Three parts water to one of honey, which is roughly what a traditional
# mead is. ⚠ No tool: this is a bucket and a stick, and gating it on
# equipment would put a shop between a player and the oldest drink in the
# world.
recipeId: honey-must
name: Honey must
keywords: [must, mead, "honey must"]
