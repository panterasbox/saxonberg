id: trade-winemaking
version: 0.1.0          # reserved; nothing reads/enforces it (non-goal: version machinery)
root: /trade/winemaking
description: >-
  The winemaking trade — a STUB (libations): the wines (red, white,
  sparkling) and the fortified wines (dry and sweet vermouth —
  winemaking's, made with distilling's spirit), the wine-bottle preset
  over the platform Bottle, five floor bottles at target in the vintner
  outfit's stock, the outfit that consigns them onto the cash-and-carry,
  and three pours. The crush and the ferment are the distillery build's.
requires:
  groups:
    - name: winemaking
      purpose: the winemaking trade's own body
      owner: { office: prime-minister }
  title:
    - { extent: /trade/winemaking, holder: { group: winemaking } }
boot:
  - { template: /trade/winemaking/location/vintner-floor, role: producer, reason: "the outfit's yard — its Stock is the home container the floor bottles spawn into, and its hand runs the consigns brain" }
  - { template: /trade/winemaking/idea/vintner-outfit, role: producer, reason: "the hand's `purchases` position is materialized over a live business; the consigns beat trades as it" }
