id: trade-winemaking
version: 0.1.0          # reserved; nothing reads/enforces it (non-goal: version machinery)
root: /trade/winemaking
description: >-
  The winemaking trade — de-stubbed by the fermentation build (W4/W8):
  the WORKING WINERY (285 K cellar with its air reserve, the basket
  press, two vats, conditioning bottles, the cellar book) over the
  kernel transform; the crush recipes with pomace as conservation's
  residue; the wine/must/vinegar/lees materials and the red, white,
  sparkling-conditioning and wine-culture ferment profiles; the
  fortifications (dry and sweet vermouth — made with the distiller's
  BOUGHT spirit, the B2B leg); the wine-bottle vessel faucet (empties
  at target — the floor-bottle faucet is retired, every bottle is a
  batch the cellars beat made); and three pours.
requires:
  groups:
    - name: winemaking
      purpose: the winemaking trade's own body
      owner: { office: prime-minister }
  title:
    - { extent: /trade/winemaking, holder: { group: winemaking } }
boot:
  - { template: /trade/winemaking/location/vintner-floor, role: producer, reason: "the outfit's yard — its Stock is the home container the floor bottles spawn into, and its hand runs the consigns brain" }
  - { template: /trade/winemaking/idea/vintner-outfit, role: producer, reason: "the hand's `purchases` position is materialized over a live business; the consigns beat trades as it" }
