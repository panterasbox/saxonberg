id: trade-tailoring
version: 0.1.0
root: /trade/tailoring
description: >-
  The tailoring trade — cloth into clothes that fit a body. ⭐ `cut` is
  OPTIMISATION UNDER WASTE (a pattern is a 2D solution to a 3D problem
  and cloth is expensive): cut tight for less waste and no room to
  alter, or cut generous and pay for the seam allowance you may want
  later. ⭐⭐ And because `getMass()` moves with metabolism, YOUR CLOTHES
  STOP FITTING WHEN YOUR BODY CHANGES — which turns tailoring from a
  one-time purchase into a recurring service with zero new mechanism.
requires:
  # The trade is placeless (economic bootstrap D6/D7): its mechanism is
  # held by the Ministry of Trade — a seat, never a committee. Its
  # premises, if any, sit in the world under a locality's committee.
  title:
    - { extent: /trade/tailoring, holder: { organization: /compact/trade } }
# The premises' boot entries moved to `terminus` with the rows (economic
# bootstrap D6): a trade is placeless; its floor is the city's.
