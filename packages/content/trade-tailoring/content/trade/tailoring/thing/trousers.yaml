# A pair of linen trousers — what `sew` makes.
#
# ⚠ It authors NO `clo`. Insulation derives from the material's
# conductivity, the form's loft and the mass over the area covered — an
# authored number would silently override the whole thermal model.
class: /platform/thing/equipment/Garment
data:
  shortDescription: pair of linen trousers
  keywords: [trousers, "linen trousers", breeches, linen, pair]
  register: indefinite
  longDescription: |
    Straight-legged and plainly finished, with the seams flat-felled so they will outlast whoever bought them.
  slotClaims:
    "/stuff/idea/species/BodyPlan/biped": [legs]
  _materialPath: /stuff/idea/material/textile/linen
  constructionForm: woven
  gradeBand: fair
  mass: 0.5
  # ⭐ Two side pockets (size and carrying D26): a key, a coin or a matchbox
  # goes in; a mug's 9 cm does not pass a 3.5 cm mouth.
  placements:
    - { member: /platform/placements/pocket, name: left pocket, mouth: { width: 0.12, height: 0.035 }, volumeM3: 0.0006 }
    - { member: /platform/placements/pocket, name: right pocket, mouth: { width: 0.12, height: 0.035 }, volumeM3: 0.0006 }
