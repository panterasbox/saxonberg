# A linen coat — what `sew` makes.
#
# ⚠ It authors NO `clo`. Insulation derives from the material's
# conductivity, the form's loft and the mass over the area covered — an
# authored number would silently override the whole thermal model.
class: /platform/thing/equipment/Garment
data:
  shortDescription: linen coat
  keywords: [coat, linen]
  register: indefinite
  longDescription: |
    A long coat, close-woven and lined at the shoulders. It is the most cloth anybody puts on at one time, which is why it costs what it costs.
  slotClaims:
    "/stuff/idea/species/BodyPlan/biped": [torso]
  _materialPath: /stuff/idea/material/textile/linen
  constructionForm: /platform/fabrics/woven
  gradeBand: fair
  mass: 1.2
  # ⭐ Two outer patch pockets, a buttoned breast pocket (a cork stays in it
  # when you swim; it floats out of an open side pocket) and a covered
  # inner pocket nobody sees into (size and carrying D26).
  placements:
    - { member: /platform/placements/pocket, name: left pocket, mouth: { width: 0.16, height: 0.05 }, volumeM3: 0.0015 }
    - { member: /platform/placements/pocket, name: right pocket, mouth: { width: 0.16, height: 0.05 }, volumeM3: 0.0015 }
    - { member: /platform/placements/pocket, name: breast pocket, mouth: { width: 0.12, height: 0.03 }, volumeM3: 0.0004, closes: true }
    - { member: /platform/placements/pocket, name: inner pocket, mouth: { width: 0.14, height: 0.03 }, volumeM3: 0.0006, covered: true }
