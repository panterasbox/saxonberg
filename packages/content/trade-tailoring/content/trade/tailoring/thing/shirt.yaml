    A shirt made the way shirts are made: four panels, two sleeves, and a collar that took as long as the rest of it put together.
  slotClaims:
    "/stuff/idea/species/BodyPlan/biped": [torso]
  _materialPath: /stuff/idea/material/textile/linen
  constructionForm: woven
  gradeBand: fair
  mass: 0.25
