# The leather jerkin — ⭐ **moved out of `trade-smithing`, where it never
# belonged.**
#
# It is the one soft-goods recipe in the tree, and it had been squatting
# in the smithy because there was nowhere else to put it. There is now:
# cutting and sewing hide is the same act as cutting and sewing cloth,
# which is exactly the roster's claim that leatherwork SHARES THE CODE
# with textiles rather than being a parallel trade.
#
# ⚠⚠⚠ **STILL UNMAKEABLE, and now for a reason that is written down.**
# The material was one blocker and this build fixed it. The other is that
# nothing RESOLVES this recipe: `make` dispatches a recipe SCRIPT rather
# than a catalogue recipe, and `cut` requires `StackableMixin` — a BOLT —
# which a tanned hide is not and must not become (two hides must never
# merge; each is a particular skin off a particular animal with its own
# grade). So a hide has no path to a worn jerkin, and three unit suites
# and sixty-five lint gates are green over it.
#
# ⚠⚠ **A `tailor` verb was added here and then REVERTED**, because it was
# the wrong way to answer that. It shipped out of a drive finding with no
# design pass and no lens pass, into a trade that already had a designed
# act ladder (`cut` · `sew` · `alter`) — and it contradicted a decision
# this trade's own seeding slate had already taken:
# `textiles-slate.md` says *"`trade-tailoring` already holds the
# `leather-jerkin` recipe, correct and unmakeable. **`cut`/`sew` take
# hide the day it exists**"*. A commit message is not a design
# conversation, and shipping a verb to turn an acceptance criterion green
# is the tail wagging the dog.
#
# ⭐ So the open question is the slate's: how does the PATTERN PATH take a
# whole skin rather than a length off a roll? That wants a tailoring
# design session — the hide chain's terminus is the thing it has to
# answer.
#
# ⚠ **It is NOT makeable, and the recipe never changed by one
# character.** This header used to read *"its `{category: hide}` input
# still has NO PRODUCER … this row is here, correct, and unmakeable."*
# Three waves closed it: a butchered carcass gives a skin, a tanpit turns
# the skin into leather, and `leather`'s own tags carry `hide`.
#
# ⚠⚠ **And the slot was quietly WRONG the whole time it was unmakeable.**
# `category: hide` matches a MATERIAL's tag, and the shipped green-hide
# row was made of `leather` — which carries `hide` — so the first hide
# the game ever produced would have been cuttable into a jerkin straight
# off the animal, wet. A green skin is `rawhide` now, which deliberately
# does **not** carry that tag, so the slot means what it always said it
# meant: *tanned hide*. The recipe is unchanged because it was never the
# thing that was wrong.
recipeId: leather-jerkin
name: Leather Jerkin
keywords:
- jerkin
- leather-jerkin
inputSlots:
- slot: hide
  category: hide
  minGrade: fair
  kind: item
  count: 1
toolCapabilities:
