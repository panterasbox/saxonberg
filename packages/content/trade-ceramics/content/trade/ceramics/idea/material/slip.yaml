# Slip — clay stirred into water until it pours like cream. What a handle is
# stuck on with at leather-hard, what a mould is filled with in slip casting
# (ceramics W7 gives it its drain set), and the clay a glaze is suspended in.
class: /platform/idea/material/Material
data:
  name: slip
  keywords: [slip, "clay slip"]
  appearance: thick, creamy liquid clay
  density: 1700
  specificHeat: 3200
  thermalConductivity: 0.8
  electricalConductivity: 1.0e-2
  meltingPoint: 273
  boilingPoint: 373
  waterAbsorptionCapacity: 0
  hardness: 0
  toughness: 0
  laysCoat: false
  edibility: false
  nutrients: []
  toxicity: []
  tags: ["liquid", "slip", "clay"]
  # ⭐⭐ Slip casting (ceramics D24): the drain set with the MOULD as the
  # sink. Poured into a plaster mould, the plaster drinks the slip's water —
  # into its own wetness, so a wet mould drinks slower — and in a couple of
  # hours what stands in the cavity is clay, firm enough to take out:
  # leather-hard, in the cavity's shape. In anything that does not drink, it
  # just sits there as slip.
  drainSetting:
    days: 0.08
    becomes: /stuff/idea/material/earth/clay
    moisture: { unloaded: 0.7, loaded: 0.7 }
    loadRef: 1
    absorbedByMould: true
  composition:
    - { materialPath: /stuff/idea/material/mineral/clay-mineral, fraction: 0.45 }
    - { materialPath: /stuff/idea/material/earth/sand, fraction: 0.10 }
    - { materialPath: /stuff/idea/material/bulk/water, fraction: 0.45 }
  biologicalSource: null
