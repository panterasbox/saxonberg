# A sack of breeze (ceramics S3, S20) — the cinders and fine ash raked out
# of coal fires, bought by the sack from the town's fires and kneaded into
# fat clay to open it: it dries without cracking, and the unburnt coal in
# it burns inside the brick in the clamp. A London stock brick's black
# specks are breeze.
