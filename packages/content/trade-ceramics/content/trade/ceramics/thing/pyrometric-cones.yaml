# Pyrometric cones — a row of little slender clay pyramids set in a wad
# of clay in the kiln's spy-hole (ceramics D31). Each bends at its own
# heat-work, so the potter reads not the temperature but the WORK the ware
# has had. ⭐ The pottery props them (ceramics W6), which is what lets
# `temperature.yaml` carry `handTool: pyrometry`: with cones in reach,
# `analyze temperature kiln` reads finer than the glow.
class: /platform/thing/Tool
data:
  shortDescription: set of pyrometric cones
  keywords: [cones, cone, pyrometric]
  register: indefinite
  longDescription: >-
    Three slender clay cones stood in a wad of clay at a slant, each a
    little different in color — they bend over, one by one, as a kiln
    comes to its heat.
  _materialPath: /stuff/idea/material/ceramic/terracotta
  mass: 0.1
  capabilities: [pyrometry]
  # ⭐ Read by a potter's eye: a competent potter calls the cones by number,
  # a proficient one says what the ware is coming to (`Tooled.getDiscipline`).
  discipline: pottery
