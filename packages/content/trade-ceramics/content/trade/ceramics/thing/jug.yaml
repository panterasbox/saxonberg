# jug — a potter's piece (ceramics W4): thrown green at the wheel, the
# shape's own mint stamps its clay, its mass, its maker and its grade.
class: /trade/ceramics/thing/Ware
data:
  shortDescription: jug
  keywords: [jug, pitcher]
  register: indefinite
  longDescription: >-
    A round-bellied clay jug with a lip for pouring and a seat for a handle.
  interiorBulk: true
  interiorCapacity: 1.7
  _materialPath: /stuff/idea/material/earth/clay
  mass: 1.0
  # ⭐ (ceramics W4) A jug is made of parts: its handle is pulled and fitted
  # with slip at leather-hard (`fit handle to jug`). Thrown, the handle line
  # is EMPTY.
  bill:
    parts:
      - { part: handle, template: /trade/ceramics/thing/handle, count: 1, role: wear }
    joints:
      - { key: handling, method: slip, members: [handle] }
