# Reseda luteola — weld. The YELLOW, and the fastest of the three to
# grow: a weed that pays.
#
# Luteolin lives in the whole above-ground plant, so the harvest is the
# stems and leaves rather than a root — one season rather than madder's
# three, which is exactly why yellow cloth was ordinary and red was not.
# Also a mordant dye: alum brightens it, iron saddens it to olive.
