# Olive — produce's food material; tag `olive` is the recipe category (a garnish slot, a press's item slot, the par sheet).
class: /platform/idea/material/ConsumableMaterial
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: olive
  appearance: "a green olive, brine-wet"
  keywords: ["olive"]
  density: 1050
  thermalConductivity: 0.5
  specificHeat: 3600
  edibility: true
  # ⭐ Spoilage (docs/subsystems/spoilage.md): the microbial growth rate is
  # `μ_max · f_T(T) · f_aw(a_w)`. `spoilActivationEnergy` (J/mol) is how
  # steeply this food answers to warmth; `waterActivity` is how much of its
  # water a microbe can actually use. Under the 0.60 floor nothing grows.
  # The raw fruit off the tree (curing is what a brined olive has had done
  # to it, and that is a different material's job).
  spoilActivationEnergy: 60000
  waterActivity: 0.95
  nutrients: ["water", "fat"]
  toxicity:
    []
  tags: ["solid", "food", "produce", "olive", "fruit"]
  composition: []
  biologicalSource: null
