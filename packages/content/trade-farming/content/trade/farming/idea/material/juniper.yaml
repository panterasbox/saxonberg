# Juniper — produce's food material; tag `juniper` is the recipe category
# (the gin still's item slot, when a distilling build learns it).
class: /platform/idea/material/ConsumableMaterial
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: juniper
  appearance: "a blue-black juniper berry"
  keywords: ["juniper"]
  density: 800
  thermalConductivity: 0.5
  specificHeat: 3600
  edibility: true
  # ⭐ Spoilage (docs/subsystems/spoilage.md): the microbial growth rate is
  # `μ_max · f_T(T) · f_aw(a_w)`. `spoilActivationEnergy` (J/mol) is how
  # steeply this food answers to warmth; `waterActivity` is how much of its
  # water a microbe can actually use. Under the 0.60 floor nothing grows.
  # Dried berries, under the growth floor — which is why a gin house buys
  # them by the sack and thinks nothing of it.
  spoilActivationEnergy: 50000
  waterActivity: 0.45
  nutrients: ["water"]
  toxicity:
    []
  tags: ["solid", "food", "produce", "juniper", "berry", "berries"]
  composition: []
  biologicalSource: null
