# Orange — produce's food material; tag `orange` is the recipe category (a garnish slot, a press's item slot, the par sheet).
class: /platform/idea/material/ConsumableMaterial
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: orange
  keywords: [orange]
  appearance: "a thick-skinned orange"
  density: 940
  thermalConductivity: 0.5
  specificHeat: 3600
  edibility: true
  # ⭐ The basic tastes (closed five-word set). Nothing authors what a
  # DISH tastes like — `taste` derives that from what went in, projected
  # through the taster's own palate. See docs/subsystems/crafting.md.
  tastes: [sweet, sour]
  # ⭐ Spoilage (docs/subsystems/spoilage.md): the microbial growth rate is
  # `μ_max · f_T(T) · f_aw(a_w)`. `spoilActivationEnergy` (J/mol) is how
  # steeply this food answers to warmth; `waterActivity` is how much of its
  # water a microbe can actually use. Under the 0.60 floor nothing grows.
  spoilActivationEnergy: 65000
  waterActivity: 0.98
  # ⭐ The years clock. `vitamin-c` is a routing tag the body's
  # `vitamin-c` reserve fills (nutrition-and-fitness W4); the amounts are
  # mg per kg (the bran/flour convention — 530 mg/kg is 53 mg per 100 g,
  # the real figure). One orange portion restores about a third of the
  # store, which is what clears scurvy. The label derives from these.
  nutrients: ["water", "sugar", "vitamin-c"]
  nutrientAmounts: {water: 870000, sugar: 90000, vitamin-c: 530}
  toxicity:
    []
  tags: ["solid", "food", "produce", "orange", "fruit", "citrus"]
  composition: []
  biologicalSource: null
