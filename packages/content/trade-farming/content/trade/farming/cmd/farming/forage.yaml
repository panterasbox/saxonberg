verbs: [forage]
controller: /trade/farming/idea/cmd/farming/ForageController
description: "Gather what grows wild on rough ground"
help: |
  Work along the edge of the rough, turning over the leaf litter.

  ⭐ Wild forage is immediate, needs no capital and yields little per
  acre. Farming is the opposite on all three. So rough ground pays you
  while you are clearing it — and pays less every time you clear a bit
  more, because the forage IS the wild.

  That is the decision our ancestors actually faced: can you afford to
  stop gathering long enough to start growing? Nobody will tell you. The
  numbers will.

  ⚠ Ground that has gone back — a field somebody stopped maintaining — has
  gone back to being forageable, which is part of why buying a derelict
  holding cheap works.

  Picked-over ground comes back. Over-gathering costs you today and
  nothing next month.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: detail
    type: string
    required: false
