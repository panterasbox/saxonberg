verbs: [plough, plow]
controller: /trade/farming/idea/cmd/farming/PloughController
description: "Turn ground over with a plough"
help: |
  Set the share in and open a furrow.

  ⭐⭐ **By hand it is punishing; with an ox it is work.** Draught power
  is body mass — a man is about seventy kilos and an ox about seven
  hundred, so an ox is worth about ten of you, and nobody wrote that ratio
  down: it is what the two animals weigh.

  That is what makes an ox a real investment rather than an upgrade. ⚠ And
  an ox eats whether or not it works, which is the honest economics of
  the thing: you are buying a depreciating asset that consumes.

  Any beast big enough to pull, standing in the field with you while you
  have a plough in your hands, is in the traces. A hen is not.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  # ⭐ WHICH TOOL, declared rather than hunted for. The default asks
  # `[capability.ploughing]` — *the thing that can do this job* — rather than
  # `[mixin.ToolMixin]`, which would resolve any tool at all and then
  # fail this verb's own check. That atom is what let this stop being a
  # walk (see `lint:instrument-args`).
  - name: tool
    type: object
    required: false
    prepositions: [with, using]
    # ⚠ `me:i` — IN HAND first, as the controller walked before the default
    # was declared. ⭐ Then a plough standing in the field (cover build): a
    # plough is a beam and a share heavier than a body carries, and it is
    # left at the headland of the field it works — it is the one tool that
    # is used where it lies.
    default: "me:i:[capability.ploughing],reachable:[capability.ploughing]"
    scope: ["reachable"]
    requires: [ToolMixin]
  - name: detail
    type: string
    required: false
