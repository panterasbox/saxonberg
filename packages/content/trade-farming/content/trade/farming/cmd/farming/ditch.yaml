verbs: [ditch]
controller: /trade/farming/idea/cmd/farming/DitchController
description: "Cut a drain along the fall of the ground"
help: |
  Open a line along the fall of the field and throw the spoil to the high
  side, so the water has somewhere to go.

  ⭐ You are not changing the soil — you cannot; the texture of a field is
  the earth it is made of. You are changing where the water goes, which
  is a different job with a different answer.

  ⚠ Heavy wet ground is far dearer to drain than light wet ground,
  because the two things that make ground hard to drain compound. Ground
  that sheds its own water wants no ditch at all, and says so.

  Needs a spade.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  # ⭐ WHICH TOOL, declared rather than hunted for. The default asks
  # `[capability.digging]` — *the thing that can do this job* — rather than
  # `[mixin.ToolMixin]`, which would resolve any tool at all and then
  # fail this verb's own check. That atom is what let this stop being a
  # walk (see `lint:instrument-args`).
  - name: tool
    type: object
    required: false
    prepositions: [with, using]
    default: "reachable:[capability.digging]"
    scope: ["reachable"]
    requires: [ToolMixin]
  - name: detail
    type: string
    required: false
