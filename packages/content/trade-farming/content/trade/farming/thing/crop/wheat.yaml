# A sack of wheat — the head of the grain chain. Everything the miller
# and the baker do starts here.
class: /platform/thing/Crop
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: sack of wheat
  keywords: [wheat, corn, crop, sack]
  register: indefinite
  longDescription: |
    Threshed wheat, hard amber grain that rattles when the sack is moved, with the dust of the flail still on it.
  # ⚠⚠ `_materialPath`, not `material:`. The Hydrator writes only the
  # fields a class's `fieldMeta` names, and `material` is not one — so
  # 49 rows across eight packs authored a material that never landed,
  # silently. This sack was "not grain" at the mill; a loaf had no
  # material to eat. Found by the grain-chain wire flow.
  _materialPath: /stuff/idea/material/food/wheat-grain
  mass: 25
