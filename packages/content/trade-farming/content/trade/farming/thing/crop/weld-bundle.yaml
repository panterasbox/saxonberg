# Weld — the whole plant, cut and dried. The cheap yellow.
#
# One season rather than madder's three, which is exactly why yellow
# cloth was ordinary and red was not.
class: /platform/thing/Crop
data:
  shortDescription: bundle of dried weld
  keywords: [weld, bundle, dyestuff, rocket, dried]
  register: indefinite
  longDescription: |
    A tied armful of spindly stems gone straw-coloured, the seed pods still on. It looks exactly like a weed somebody could not be bothered to pull, and it is.
  _materialPath: /trade/farming/idea/material/weld
  # ⭐ `steep` it in a vat of water and the bath IS the dyestuff — the only
  # way a dye bath is ever charged (silk W4: no crop was Steepable, so no
  # bath in the game could be).
  steepsInto: /trade/farming/idea/material/weld
  mass: 0.5
