# A scythe — the instrument of the hay meadow, and the reason `mow` is a
# real act rather than a button.
#
# ⚠ The `mowing` capability is its own, not `cutting`: a knife cuts and a
# scythe mows, and the two are not interchangeable at either end. An open
# vocabulary, so a later sickle, reaper or mower answers the same string.
class: /platform/thing/Tool
data:
  keywords: [scythe, snath]
  shortDescription: scythe
  register: indefinite
  longDescription: >-
    A long curved blade on a snath bent to fit somebody who is not you,
    with two grips pegged along it. The edge is bright for a hand's width
    back and black beyond that; it wants peening as often as it wants
    sharpening.
  mass: 3.4
  # ⭐ It reaps grain as well as mowing grass — a scythe cuts a wider
  # swath than a sickle (cover build D3), and the same string answers
  # whichever verb asks.
  capabilities: ["mowing", "reaping"]
  swathM2: 60
  # ⭐ An EDGE (repair D3): the form word is what makes it honable —
  # `sharpen` reaches it loose, and through the whole it is fitted in.
  constructionForm: bladed
  _materialPath: /stuff/idea/material/element/iron
