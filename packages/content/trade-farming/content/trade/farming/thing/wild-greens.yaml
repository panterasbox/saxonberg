# Wild greens — what rough ground pays you while you are clearing it.
#
# ⭐ Deliberately modest. Wild forage is immediate, needs no capital and
# yields little per acre; farming is the opposite on all three, and the
# whole of D61 is the player noticing that for themselves rather than
# being told it. A handful of this is a meal's worth of nothing much.
class: /platform/thing/Provision
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a handful of wild greens
  primaryKeyword: greens
  keywords: [greens, wild-greens, leaves, forage]
  longDescription: >-
    Nettle tops, fat hen, a little sorrel and something with a bitter
    stem. Somebody who knew what they were doing gathered this; somebody
    who did not would have gathered nothing, or worse.
  _materialPath: /stuff/idea/material/food/root-vegetable
  mass: 0.3
