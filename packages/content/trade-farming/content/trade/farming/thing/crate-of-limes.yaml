# A crate of limes — the floor unit: a `Crate` (Circulating + Populates +
# an OPEN Container) the sweep stands at target in the farm's stock, holding
# 12 limes minted on hydration. The bar's par line counts the limes
# inside; the crate is what the hand consigns and the keeper buys.
# ⭐ EXTENDS the empty crate — the slats, the register and the standard
# `Crate` class come from there; this row states what is IN it.
#
# ⚠ Note `keywords:` is restated rather than inherited, on purpose: the
# parent's list carries `empty`, which is exactly what a crate of limes
# is not. `replace` is the default rule and it is the right one here.
class: /platform/thing/Crate
extends: /trade/farming/thing/crate
data:
  shortDescription: crate of limes
  keywords: [limes, crate, lime, produce]
  register: indefinite
  longDescription: A slatted wooden crate of limes, the grower's stencil on the side.
  censusKey: produce:lime
  # ⭐ Six, not four (economic bootstrap W7): the lime is the one crate a
  # SECOND shop stocks — the general store keeps three on its counter,
  # bought through the cash-and-carry — so the floor stands deeper than
  # the bar's crate alone would need. Limes are the market-maker's line.
  regionTarget: 6
  materialTags: [produce, lime]
  container: /world/terminus/goods-yards/farm/thing/stock
  props:
    - { template: /trade/farming/thing/lime, count: 12 }
