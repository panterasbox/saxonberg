# A crate of cherries — the floor unit: a `Crate` (Circulating + Populates +
# an OPEN Container) the sweep stands at target in the farm's stock, holding
# 12 cherries minted on hydration. The bar's par line counts the cherries
# inside; the crate is what the hand consigns and the keeper buys.
# ⭐ EXTENDS the empty crate — the slats, the register and the standard
# `Crate` class come from there; this row states what is IN it.
#
# ⚠ Note `keywords:` is restated rather than inherited, on purpose: the
# parent's list carries `empty`, which is exactly what a crate of limes
# is not. `replace` is the default rule and it is the right one here.
class: /platform/thing/Crate
extends: /trade/farming/thing/crate
data:
  shortDescription: crate of cherries
  keywords: [cherries, crate, cherry, produce]
  register: indefinite
  longDescription: A slatted wooden crate of cherries, the grower's stencil on the side.
  censusKey: produce:cherry
  regionTarget: 4
  materialTags: [produce, cherry]
  container: /world/terminus/goods-yards/farm/thing/stock
  props:
    - { template: /trade/farming/thing/cherry, count: 12 }
