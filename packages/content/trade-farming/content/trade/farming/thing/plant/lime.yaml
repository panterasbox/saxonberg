# A lime tree — a fruiting plant on the CYCLE (D1/D2):
# A dwarf orchard tree: its mature roots fit a deep garden bed (the
# suburban-garden invariant, D0), and a bed shared with anything else
# stalls it — an orchard tree wants its ground to itself.
# No moisture reserve — the water lives in the ground (see peace-lily).
class: /platform/thing/Plant
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a lime tree
  primaryKeyword: "lime tree"
  keywords: ["lime tree", lime, tree, citrus, plant]
  longDescription: |
    A glossy-leaved lime tree, no taller than a person, its branches wired low the way orchard stock is trained.
  _speciesPath: /stuff/idea/species/plantae/tracheophyta/magnoliopsida/sapindales/rutaceae/citrus/latifolia
  material: /stuff/idea/material/tissue/plant-tissue
  lifecycleState: alive
  seedTemplatePath: /trade/farming/thing/seed/lime
  harvestTemplatePath: /trade/farming/thing/lime
  nutrientDraw: 10
  profile:
    moistureHappyAt: 0.3
    moistureWiltAt: 0.05
    litresPerGameDay: 0.3
    luxHappyAt: 100
    luxDarkAt: 10
    rootDemand:
      seedling: 0.5
      young: 2
      established: 6
      mature: 10
    daysToStage:
      young: 40
      established: 120
      mature: 240
    # The fruit cycle (D1/D2): the PAIR is the polycarp marker.
    fruitSetCount: 12
    fruitFillDays: 25
