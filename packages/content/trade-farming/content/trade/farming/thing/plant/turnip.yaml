# Turnips — ⭐⭐ winter fodder, and the term that makes the four-course
# need NO FALLOW YEAR.
#
# They are FOLDED: sheep penned on the turnip field eat them where they
# stand and manure as they go, which is literally the graze row applied
# to a root crop and needs no new mechanism at all.
