  seedTemplatePath: /trade/farming/thing/seed/clover
  harvestTemplatePath: /trade/farming/thing/crop/clover
  nutrientDraw: 0
  profile:
    moistureHappyAt: 0.3
    moistureWiltAt: 0.05
    litresPerGameDay: 0.14
    luxHappyAt: 200
    luxDarkAt: 20
    coldStopK: 278
    warmHappyK: 289
