# Clover — ⭐⭐ and its `nutrientDraw` is ZERO, which is the whole of
# D15 in one authored number.
#
# It does not take nitrogen out of the ground because it takes it out of
# the AIR. That one field, set to nothing, is why the legume rotation is
# derivable from the ledger rather than granted as a bonus.
