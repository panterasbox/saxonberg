# Barley in the ground — the arable half of the four-course, and ⭐ the
# crop that finally stands behind malt.
#
# ⚠ It authors `coldStopK`, which every crop in this build does and no
# houseplant does: an outdoor cereal stops in winter because it is cold,
# and the same plant under glass does not. Winter is not a mode.
class: /platform/thing/Plant
data:
  shortDescription: stand of barley
  keywords: [barley, crop, stand]
  register: indefinite
  longDescription: |
    Barley standing in the ear, the awns catching the light, and the whole field going over together when the wind crosses it.
  _speciesPath: /stuff/idea/species/plantae/tracheophyta/liliopsida/poales/poaceae/hordeum/vulgare
  _materialPath: /stuff/idea/material/tissue/plant-tissue
  lifecycleState: alive
  seedTemplatePath: /trade/farming/thing/seed/barley
  harvestTemplatePath: /trade/farming/thing/crop/barley
  nutrientDraw: 18
  # ⭐ Cut with a sickle or a scythe (cover build D3); bare hands cut a
  # little.
  harvestTool: reaping
  profile:
    moistureHappyAt: 0.3
    moistureWiltAt: 0.05
    litresPerGameDay: 0.14
    luxHappyAt: 200
    luxDarkAt: 20
    coldStopK: 278
    warmHappyK: 289
    rootDemand: { seedling: 0.2, young: 1.0, established: 2.0, mature: 3.0 }
    daysToStage: { young: 16, established: 50, mature: 100 }
    # ⭐ The field crop is two numbers (cover build D2): the seed rate a
    # broadcast sowing spends, and the yield-to-seed ratio every agrarian
    # history quotes. A third of a field's seed sows a third of it, and
    # yields a third.
    seedRateKgPerM2: 0.016
    yieldRatio: 7
