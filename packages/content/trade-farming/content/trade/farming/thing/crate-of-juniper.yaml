# A crate of juniper berries — the compounder's botanical (fermentation
# W6: the distiller buys juniper at the distributor; gin is spirit +
# juniper, and the chain from the bush to the martini is real).
# ⭐ EXTENDS the empty crate — the slats, the register and the standard
# `Crate` class come from there; this row states what is IN it.
#
# ⚠ Note `keywords:` is restated rather than inherited, on purpose: the
# parent's list carries `empty`, which is exactly what a crate of limes
# is not. `replace` is the default rule and it is the right one here.
class: /platform/thing/Crate
extends: /trade/farming/thing/crate
data:
  shortDescription: crate of juniper berries
  keywords: [juniper, crate, berries, produce]
  register: indefinite
  longDescription: A small slatted crate of blue-black juniper berries, resin-sharp.
  censusKey: produce:juniper
  regionTarget: 3
  materialTags: [produce, juniper]
  container: /world/terminus/goods-yards/farm/thing/stock
  props:
    - { template: /trade/farming/thing/juniper-berries, count: 6 }
