# A packet of flax seed. The same discrete-Thing shape every shipped seed
# uses — it names the plant it grows into and carries no variation of
# its own.
class: /platform/thing/Seed
data:
  shortDescription: packet of flax seed
  keywords: [seed, seeds, packet, "flax seed", flax, linseed]
  register: indefinite
  longDescription: |
    Tiny hard brown seeds, slippery between the fingers and shining like they have been oiled — because they have.
  growsIntoPath: /trade/farming/thing/plant/flax
  # ⭐ What the seed IS (paint D19): an oilseed — the stones press linseed
  # oil out of it (`mill flax seed`).
  _materialPath: /trade/farming/idea/material/flax-seed
  _speciesPath: /stuff/idea/species/plantae/tracheophyta/magnoliopsida/malpighiales/linaceae/linum/usitatissimum
