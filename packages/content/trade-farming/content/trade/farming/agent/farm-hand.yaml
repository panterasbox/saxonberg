# Wen Hartley — the farm outfit's hand. Holds the outfit's `hand` position
# (`purchases: true`): dealt the house card at hire, then the `consigns`
# brain drives the literal verbs — `get`, `wallet use house`, `consign …
# --ask` — carrying the stock to the cash-and-carry counter and consigning
# it AS the outfit. The counter path is this config's, never the trade's.
class: /platform/agent/NPC
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: Wen Hartley
  pronouns: they
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  primaryKeyword: hand
  alternateNames: ["wen", "hartley"]
  shortDescription: "a sun-browned market hand with a knife on a string"
  longDescription: |
    A sun-browned hand with a paring knife on a string round their neck, who tastes one of everything before it goes out.
  dispositions:
    - { disposition: diligence, valence: 60 }
  behaviors:
    - brain: /lib/behavior/consigns
      trigger: cadence:4m
      config:
        stock: /trade/farming/thing/farm-stock
        shelf: /trade/distribution/thing/counter
        # ⭐ The board this floor posts to, and what the house will pay to
        # have one crate moved. ⚠ The CARRIAGE is the whole price — the
        # goods are already the house's, and the hauler is being paid to
        # move them, not to buy them. That is why this leg needs no
        # capital at all and is the labor market's FIRST RUNG.
        board: /trade/haulage/thing/works-board
        crate: /trade/haulage/thing/supply-crate
        carriage: 6
        # ⚠ Retuned by logistics D11: a CRATE, not six loose goods. The

        # carriage is per consignment, so a bigger crate is the same haul

        # and the loop closes in fewer trips.

        batch: 12
        ask:
          produce:lime: 6
          produce:lemon: 6
          produce:orange: 5
          produce:grapefruit: 5
          produce:mint: 5
          produce:cherry: 5
          produce:olive: 5
          produce:cranberry: 5
          produce:grape: 5
          produce:juniper: 5
    - brain: /lib/behavior/idles
      trigger: cadence:41s
      config:
        pool:
          - { kind: free, value: "halves a lime and sniffs it." }
          - { kind: free, value: "wets the sacking down again." }
