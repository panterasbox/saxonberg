# the farm — the yard: the outfit's Stock (the floor rows' home
# `container:` — the sweep stands them at target here) and the hand whose
# `consigns` beat carries them to the cash-and-carry. ⭐ It has a DOOR now (logistics D11): a hauler has to be able to
# reach the crate the hand posts about. The hand never uses it.
# An ordinary location, not a FurnishableRoom: that class is the
# FURNISHING archetypes' base. A trade floor's durability lives on its
# persistable fixtures (the Stock, the racking, the counter) — the
# consigned goods and their listings ride those, never the room; the
# `populates` set below is the placement and respawns each boot.
#
# ⚠⚠ **It authors no `coords`, and that is a FIX.** The block was inert
# `{0,0,0}` here — a `SingletonCartesianLocation` in a directory with no
# `CartesianZone` over it — and `setCoords` throws without one. The
# packing floor is a standalone room reached by a cross-zone exit, in no
# grid; a zone over `/trade/farming/location` would be the wrong shape
# for a single room. Same defect as `trade-distilling`'s cash-and-carry,
# and the same fix. Found by booting the metal-chain build against a real
# database.
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  # ⚠ `coords:` is the MEMBERSHIP operation — `setCoords` is the only way
  # an authored row joins a zone, so without it this floor was in no grid
  # and inherited nothing from one. See the zone row beside it.
  coords:
    x: 0
    y: 0
    z: 0
  shortDescription: "the farm"
  primaryKeyword: floor
  keywords: ["floor", "shed", "packing"]
  longDescription: |
    A packing shed open on one side: trestles, a scale, crates under wet sacking (the growing is the smallholding's; the floor stands at target through the sweep until a grower supplies it).
  ambientIntensity: 25
  ambientColorTemperature: 4200
  exits:
    # ⭐ The back door onto the goods yards — the one room the D11
    # switchover cost. The hand does not travel; a HAULER comes in this
    # way to collect what the hand crated and posted about.
    northeast:
      destination: /world/terminus/goods-yards/yard
      media: [ground]
      edgeMinutes: 4
  props:
    # ⭐ The works board, ON the floor. The hand posts what wants moving
    # without stepping outside — which is what makes D11's resolution
    # literal: neither NPC ever leaves its own floor again.
    - /trade/haulage/thing/works-board
    - /trade/farming/thing/farm-stock
  cast:
    - /trade/farming/agent/farm-hand
