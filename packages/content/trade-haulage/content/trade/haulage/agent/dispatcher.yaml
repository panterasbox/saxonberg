# The dispatcher — keeps the book, and knows where everything is without
# looking at it.
class: /platform/agent/Cast
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sensitivus
  lifecycleState: alive
  keywords: [dispatcher, clerk, book]
  shortDescription: dispatcher
  register: definite
  longDescription: >-
    A small, unhurried man with a pencil behind each ear and a ledger
    open on a slope-desk that he does not appear to consult. He knows
    what is on the road, what is in the shed, and what is late, and he
    tells you the third one first.
  # ── the dossier ─────────────────────────────────────────────────
  # Evidence, never values: each entry below expands into the same rows a
  # lived history would have written, marked `claim`. Seeded once at
  # postRegister and skipped if any claim already exists, so a reclone or
  # a reboot cannot mint a second history.
  # ⚠ A best-guess pass, explicitly provisional — the considered version
  # is a content pass of its own before go-live.
  archetype: dispatcher
  prologue:
    - "Has kept the road in his head long enough that the ledger is a formality."
  competence:
    - { discipline: teamstering, asserting: competent }
    - { discipline: business-administration, asserting: proficient }
  dispositions:
    - { disposition: composure, valence: 60 }
    - { disposition: diligence, valence: 70 }
  behaviors:
    - brain: /lib/behavior/idles
      trigger: cadence:44s
      config:
        pool:
          - { kind: free, value: "rules a line under something and does not write anything under it." }
          - { kind: free, value: "says, \"Anything that is not on the paper did not happen. That is not me being difficult.\"" }
          - { kind: free, value: "looks out at the weather, then back at the book, and changes a number." }
          - { kind: free, value: "says, \"Ore down, manufactures up, and nobody wants to go back empty. That is the whole trade.\"" }
