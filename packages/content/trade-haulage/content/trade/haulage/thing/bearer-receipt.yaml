# ⭐ The bearer receipt — a document of title that is a Thing you can be
# robbed of.
#
# The whole asymmetry of the design is in this file existing while the
# registered form ships as nothing at all: a registered receipt is a row
# naming a person and cannot be taken; this is a slip of paper, and
# whoever has it may claim the goods. Same document, two custody models,
# and the reason a merchant would prefer one is exactly that one of them
# can be lost.
class: /trade/haulage/thing/BearerReceipt
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a warehouse receipt
  primaryKeyword: receipt
  keywords: [receipt, docket, slip, warrant]
  longDescription: |
    A printed slip with the depot's mark at the head, a bay number, a line of description in a clerk's hand, and — where a name would go on a registered one — nothing at all. Whoever is holding this is who the goods belong to, as far as the shed is concerned.
  mass: 0.005
