# The warehouse — the bailee's shed.
#
# ⭐ A store (storage-and-ice W3): it holds a consignment LIVE, on a
# receipt filed under the depot's branch, and gives it back to whoever
# holds the receipt at the depot book — `withdraw crate` — while the
# warehouseman is on shift. Capacity, when a row wants one, is mass.
class: /trade/haulage/thing/Warehouse
data:
  shortDescription: goods shed
  keywords: [shed, warehouse, store, goods]
  register: definite
  longDescription: |
    A long timber shed open at both ends, with a raised plank floor at cart-bed height and a chalked grid on the boards dividing it into bays. Most of the bays have something in them and every one of those has a docket nailed to the post beside it.
  baileePath: /trade/haulage/idea/depot-business
  # Who can take a deposit or pay one out: the depot's warehouseman.
  keeperPositions: [warehouseman]
  # ⭐ BEARER paper (paper D8): the depot's receipt is a sheet the keeper
  # hands over the counter, and the goods go to whoever presents it — sell
  # the receipt and you have sold the crate. The depositor without the paper
  # is refused; a settled receipt is answered so; a hand copy presents
  # nothing (the keeper checks the book).
  terms: { allowancePct: 10, feeMinorPerKg: 0, bearer: true }
  receiptPaper: /platform/thing/sheet
