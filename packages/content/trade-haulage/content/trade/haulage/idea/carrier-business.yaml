# ⭐⭐ The carrier — and it is a BUSINESS, not a background process.
#
# `EngagedMixin` is on `Character`, so every moving vehicle in this
# realm has somebody driving it. Background freight therefore runs on
# a payroll: wages are a real cost line, and industrial action against a
# carrier stops something. That is the consequence of *no ghost
# logistics*, and it is wanted.
#
# ⭐ It is also the **reserve supply**, which is the load-bearing
# economics of the whole labor market: the carter covers what nobody
# took, so **a player cannot charge more than the NPC costs and need not
# accept less**. The market-maker of last resort.
# ⭐ Its OWN class, and the only thing it adds is that it files paper:
# a settled gig it posted means somebody carried something somewhere.
# See `CarrierBusiness` — ordinary inheritance over the `@hook`, in place
# of the global bus event this used to need.
class: /trade/haulage/idea/CarrierBusiness
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  appointingAuthority:
    kind: entity
    path: /trade/haulage/agent/dispatcher
  positions:
    - key: dispatcher
      noun: dispatcher
      label: keeping the book
      wageRate: 6
    - key: carter
      noun: carter
      label: on the road
      wageRate: 5
  rosterSlots:
    - positionKey: dispatcher
      assignee: /trade/haulage/agent/dispatcher
      schedule:
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [6, 20] }
    - positionKey: carter
      assignee: /trade/haulage/agent/carter
      schedule:
        # ⭐ Real hours (envelope S8). This authored `[0, 24]` — a house
        # staffed around the clock — which was never true of it and made
        # the night indistinguishable from the day. The `shifts` brain
        # parks off-shift cast in the venue's Offstage, so the street
        # genuinely empties.
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [5, 19] }
  banksAt: goodkin
  operatingLocations:
    - /world/terminus/estuary/lower-towpath
