# hooped — a dry cooper's cask — tight enough to keep flour in. Hoops driven down over a SET of staves (a joint
# spans a set: one hoop holds thirty staves, assembly D16). Knocked off,
# most of the staves come back and many of the hoops do not survive the
# driving. ⭐ The three cooper's joints differ by how tight the hoops are
# driven — which is what decides what the vessel can hold.
