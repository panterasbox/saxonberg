verbs: [muddle]
controller: /trade/hospitality/idea/cmd/crafting/MuddleController
description: "Muddle the solids in a build in progress"
help: |
  Press the mint, the sugar, the citrus in the vessel you're building in
  — `muddle` (or `muddle shaker`). You need a muddler in reach. It
  records the build as muddled and takes a moment.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: vessel
    type: object
    required: false
    scope: "reachable"
    # ⭐ Bare `muddle` works the build you are at — DECLARED, so the binder
    # resolves it (held first) instead of the controller walking for it
    # (`lint:instrument-args`).
    default: "reachable:[mixin.ManualBuildMixin]"
    requires: ManualBuildMixin
  # ⭐ WHICH MUDDLER — DECLARED, not hunted for (`lint:instrument-args`).
  # Bare, the binder hands over every reachable thing offering
  # `muddler` and the controller takes the best-rated.
  - name: muddler
    type: objects
    required: false
    prepositions: [with, using]
    default: "reachable:[capability.muddler]"
    scope: ["reachable"]
    requires: [ToolMixin]
