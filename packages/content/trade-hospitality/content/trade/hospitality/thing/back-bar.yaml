# The back-bar — a Surfaced fixture behind the bar. The working bottles and
# bar tools rest ON it (placed via the bar's `props: { onto }` entries),
# so they're visible "on the back-bar" and reachable, but render under it
# rather than as loose items among the room's occupants.
class: /trade/hospitality/thing/BarStation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: back-bar
  keywords: [rail, back-bar, backbar, shelf]
  register: definite
  longDescription: A long mirrored back-bar, its rail worn smooth, ranked with bottles.
  # ⚠ NOT `bar` — that is the counter you sit at (and the room). This is
  # the shelf behind it: `back-bar`, `shelf`, and `rail` (the word the
  # whole build uses for it).
