# The glass rack — the pool's home: an open container (never sealed) the
# gather walk descends into, so a clean glass in the rack is claimable.
# `props:` mints the venue's glassware once; from then on the pool
# CYCLES (claim → serve → bus → wash → rack) and a broken glass is a
# shortfall on the stock sheet, bought like anything else.
class: /trade/hospitality/thing/GlassRack
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: glass rack
  keywords: [rack, glass-rack, glassware, glasses, glass]
  register: indefinite
  longDescription: An overhead rack of glassware, stems hooked in rows, catching the light.
  mass: 15
  props:
    - { template: /trade/hospitality/thing/coupe, count: 12 }
    - { template: /trade/hospitality/thing/rocks, count: 8 }
    - { template: /trade/hospitality/thing/highball, count: 12 }
    - { template: /trade/hospitality/thing/collins, count: 4 }
    - { template: /trade/hospitality/thing/pint, count: 6 }
    - { template: /trade/hospitality/thing/wine, count: 6 }
    - { template: /trade/hospitality/thing/flute, count: 4 }
    - { template: /trade/hospitality/thing/mug, count: 4 }
    - { template: /trade/hospitality/thing/copper-mug, count: 4 }
    - { template: /trade/hospitality/thing/juice-bottle, count: 4 }
