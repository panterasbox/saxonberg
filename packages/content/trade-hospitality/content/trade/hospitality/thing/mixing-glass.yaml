# A mixing glass — a tool offering the `mixing-glass` capability (stirred drinks).
class: /platform/thing/CocktailShaker
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a mixing glass
  longDescription: A heavy mixing glass and a long bar spoon.
  keywords: [mixing-glass, mixing, glass, spoon]
  capabilities:
    # Stirring chills less than shaking, dilutes less, and keeps the
    # drink clear — the whole reason a martini is stirred.
    - {
        kind: mixing-glass,
        verbs: [platform/cmd/crafting/pour.yaml, platform/cmd/crafting/stir.yaml, trade/hospitality/cmd/crafting/strain.yaml, trade/hospitality/cmd/crafting/garnish.yaml, trade/hospitality/cmd/crafting/serve.yaml, trade/hospitality/cmd/crafting/mix.yaml],
        technique: { name: stirred, chillK: 6, dilutionL: 0.01, priority: 2 },
      }
  condition: 1
