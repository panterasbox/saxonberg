# a muddler — a bar tool offering the `muddler` capability (a ToolItem; the
# capability table decides which verbs it affords).
class: /platform/thing/ToolItem
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a muddler
  longDescription: A thick hardwood muddler, its end stained green with mint.
  primaryKeyword: muddler
  keywords: [muddler]
  capabilities:
    # Muddling neither chills nor dilutes — it is a preparation, so it
    # loses to a finishing instrument (a mojito is muddled, then built).
    - {
        kind: muddler,
        verbs: [trade/hospitality/cmd/crafting/muddle.yaml],
        technique: { name: muddled, priority: 1 },
      }
  _materialPath: /stuff/idea/material/element/iron
  mass: 0.2
