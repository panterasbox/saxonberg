# The tip jar — a visible container on the bar that holds Coin. Patrons drop
# cash tips in (`tip`); the on-shift bartender scoops it out (`collect`).
# Off the books by construction (physical coin, no account). Starts empty and
# fills as patrons tip — inspectable, so you can watch it fill. Populated onto
# the bar's rail by the Bar seed's `populates` list.
class: /platform/thing/TipJar
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a tip jar
  longDescription: >
    A wide-mouthed glass jar by the register, a curl of masking tape on the
    side reading "TIPS" in three different hands. It catches the neon and
    whatever the night's been generous enough to leave.
  keywords: [jar, tips, tip, tip-jar]
