# The `bar` bundle — what a bar-room is furnished with, as a FurnishableRoom
# row a venue instances or EXTENDS: a venue with its own class — Dave's
# Bar — names this row as its parent and states only what differs. Every station the menu exposes, and
# NO bottles: the rail is stocked by ORDERING (the keeper's `restocks`
# beat posts a carriage bounty and clears the receiving bench onto the
# rail — logistics D11; she stopped travelling to the supplier), never by
# `populates` magic.
# An ordinary location, not a FurnishableRoom: that class is the
# FURNISHING archetypes' base. A trade floor's durability lives on its
# persistable fixtures (the Stock, the racking, the counter) — the
# consigned goods and their listings ride those, never the room; the
# `populates` set below is the placement and respawns each boot.
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  # ⚠ `coords:` is the MEMBERSHIP operation — `setCoords` is the only way
  # an authored row joins a zone, so without it this floor was in no grid
  # and inherited nothing from one. See the zone row beside it.
  coords:
    x: 0
    y: 0
    z: 0
  # ⚠⚠ These were `name:` and `description:` — keys the class declares
  # NEITHER of, so the Hydrator has been discarding both in silence
  # since the row shipped. Nobody noticed because a bar is always
  # instanced by a venue that describes itself.
  #
  # ⭐ It stopped being harmless the day this row became a PARENT: a junk
  # key on a parent reaches every descendant, and Dave's Bar started
  # inheriting two of them. That is the whole argument for
  # `lint:instanceable` invariant 12, made by the first row to extend
  # anything.
  shortDescription: bar
  register: indefinite
  keywords: [taproom, bar, barroom]
  longDescription: |
    A narrow room with a long bar down one side, stools along it, the back-bar mirrored and lit from beneath. A brass tap handle stands over its drip tray; the ice bin and the well sit under the lip where the bartender works.
  props:
    # The back-bar and the well: the Surfaced shelves the working bottles
    # rest ON once bought (`put gin on back-bar`). Listed before their
    # `onto` items.
    - /trade/hospitality/thing/back-bar
    - /trade/hospitality/thing/well
    - { template: /trade/hospitality/thing/shaker, onto: /trade/hospitality/thing/well }
    - { template: /trade/hospitality/thing/mixing-glass, onto: /trade/hospitality/thing/well }
    - { template: /trade/hospitality/thing/muddler, onto: /trade/hospitality/thing/well }
    - { template: /trade/hospitality/thing/bar-spoon, onto: /trade/hospitality/thing/well }
    - { template: /trade/hospitality/thing/strainer, onto: /trade/hospitality/thing/well }
    - { template: /trade/hospitality/thing/juicer, onto: /trade/hospitality/thing/well }
    # ⭐ `as: tablet` is the entry's IDENTITY — the line a child row
    # replaces when a venue runs its own tablet, rather than appending
    # a second one to the back-bar.
    - { template: /trade/hospitality/thing/house-tablet, as: tablet, onto: /trade/hospitality/thing/back-bar }
    - { template: /trade/hospitality/thing/tip-jar, onto: /trade/hospitality/thing/back-bar }
    # The stations.
    - /trade/hospitality/thing/tap
    - /trade/hospitality/thing/ice-bin
    - /trade/hospitality/thing/water-tap
    - /trade/hospitality/thing/basin
    - /trade/hospitality/thing/glass-rack
    # Seating.
    - { template: /trade/hospitality/thing/stool, count: 6 }
