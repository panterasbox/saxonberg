id: trade-distilling
version: 0.1.0          # reserved; nothing reads/enforces it (non-goal: version machinery)
root: /trade/distilling
description: >-
  The distilling trade — the second CAPABILITY pack (libations). What
  turning a wash into a spirit introduces, cut at the trade's PROCESS and
  never at a substance: the spirit materials (gin, vodka, whiskey, the two
  rums, tequila, the liqueurs, aperitivo, bitters), the stock vessel every
  floor product is a row over (`SpiritBottle`), the still (the distillery
  build's tool, waiting), the `distilling` discipline its recipes will
  derive. (The cash-and-carry moved OUT to the
  `distribution` pack — fermentation D10: a distributor is distribution
  infrastructure, and while it lived here every sibling trade depended
  on distilling for exactly that one path.) Nothing here is
  `props`-magic: the floor product stands
  at target through the spawn sweep (the sanctioned faucet), and a
  producer's own outfit consigns it onto the distributor's counter with
  the `consigns` brain. The two corpo-owned producers live HERE too —
  Veshko's yard (the `location/veshko-yard` locality, the zone that authors `stocks:`) and Hollis's
  bottling floor (the flat `hollis-*` rows) — because a bottle of Volk is a product of
  the distilling PROCESS; the corpo pack supplies the capital and the
  mark, and each yard's `parentOrganization` points up at it. The trade
  names nobody downstream; every producer names distribution's counter.
requires:
  groups:
    - name: distilling
      purpose: the distilling trade's own body
      owner: { office: prime-minister }
  title:
    - { extent: /trade/distilling, holder: { group: distilling } }
boot:
  # The producers' floors: nothing else ever instantiates a producer's yard, and
  # the hands that run the consigns brain must be resident for the beat to
  # fire (a room populates its cast).
  - { template: /trade/distilling/location/crowsfoot-floor, role: producer, reason: "the Crowsfoot outfit's yard — same shape as the floor's, one small-batch label" }
  - { template: /trade/distilling/location/veshko-yard/location/distillery, role: producer, reason: "Veshko's yard — its Stock is the home container the Volk and unbranded rows spawn into (the zone's stocks: sets the counts), and its hand runs the consigns brain" }
  - { template: /trade/distilling/location/hollis-floor, role: producer, reason: "Hollis's bottling floor — its Stock is the home container the private-label rows spawn into, and its hand runs the consigns brain" }
  # The businesses: the roster tick materializes the hands'
  # purchasing positions (and deals each its house card) only over a LIVE
  # business — a lazily stood-up one would leave the first beat trading as
  # nobody.
  - { template: /trade/distilling/idea/crowsfoot-outfit, role: producer, reason: "the Crowsfoot hand's `purchases` position likewise" }
  - { template: /trade/distilling/location/veshko-yard/idea/outfit, role: producer, reason: "Veshko Distilling (parentOrganization /corpo/veshko) — the hand's purchases position is materialized over a live business; the consigns beat trades as it" }
  - { template: /trade/distilling/idea/hollis-outfit, role: producer, reason: "Hollis Bottling (parentOrganization /corpo/hollis) — likewise" }
