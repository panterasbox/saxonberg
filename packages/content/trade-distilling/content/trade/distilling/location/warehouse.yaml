# The `warehouse` bundle — the exemplar a producer's floor is cut from: the
# racking, and a roller door that leads nowhere until a locality gives it
# a dock. A corpo's distillery or a stub's yard is a room of this shape
# with its own stock + hand in `props` (template inheritance does not
# exist — the bundle is copied by listing, not extended).
# An ordinary location, not a FurnishableRoom: that class is the
# FURNISHING archetypes' base. A trade floor's durability lives on its
# persistable fixtures (the Stock, the racking, the counter) — the
# consigned goods and their listings ride those, never the room; the
# `populates` set below is the placement and respawns each boot.
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  # ⭐ Daylight reaches this room through a real opening, and the
  # opening is named so the claim is something a player can walk up
  # to and look at. The room follows the sun: bright at noon, dark
  # at night unless somebody lights something.
  ambientSource: sky
  ambientOpening: lights
  # ⚠ `coords:` is the MEMBERSHIP operation — `setCoords` is the only way
  # an authored row joins a zone, so without it this floor was in no grid
  # and inherited nothing from one. See the zone row beside it.
  coords:
    x: 2
    y: 0
    z: 0
  shortDescription: warehouse
  keywords: [warehouse, store, depot]
  register: indefinite
  longDescription: |
    A bare warehouse floor under a corrugated roof, racking down one wall and a roller door down the other, the concrete stained in rings where casks once stood.
  ambientIntensity: 25
  ambientColorTemperature: 4200
  props:
    - /trade/distilling/thing/racking
  details:
    lights:
      keywords: [lights, glass, light]
      description: |
        A row of roof lights along the ridge, grimy with years, dropping pale squares onto the casks below.
