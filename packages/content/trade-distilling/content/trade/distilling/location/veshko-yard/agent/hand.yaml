# Petra Volkova — Veshko Distilling's hand. Dealt the house card at hire; the
# `consigns` brain carries the yard's product to the cash-and-carry counter
# and lists it AS Veshko Distilling. The annex names the host.
class: /platform/agent/NPC
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: Petra Volkova
  pronouns: she
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  primaryKeyword: hand
  alternateNames: [petra, volkova]
  shortDescription: a brisk yard hand in a Veshko-grey coat
  longDescription: |
    A brisk, square woman in a grey company coat with the Veshko mark on the breast, who moves pallets like she is being timed. She probably is.
  dispositions:
    - { disposition: diligence, valence: 80 }
  behaviors:
    - brain: /lib/behavior/consigns
      trigger: cadence:4m
      config:
        stock: /trade/distilling/location/veshko-yard/thing/stock
        shelf: /trade/distribution/thing/counter
        # ⭐ The board this floor posts to, and what the house will pay to
        # have one crate moved. ⚠ The CARRIAGE is the whole price — the
        # goods are already the house's, and the hauler is being paid to
        # move them, not to buy them. That is why this leg needs no
        # capital at all and is the labor market's FIRST RUNG.
        board: /trade/haulage/thing/works-board
        crate: /trade/haulage/thing/supply-crate
        carriage: 10
        # ⚠ Retuned by logistics D11: a CRATE, not six loose goods. The

        # carriage is per consignment, so a bigger crate is the same haul

        # and the loop closes in fewer trips.

        batch: 12
        ask:
          # Volk carries the mark and a premium over the same liquid
          # unbranded — the whole Kirkland lesson in two numbers.
          spirit:volk: 9
          spirit:gin: 7
          spirit:vodka: 6
          spirit:whiskey: 7
          spirit:rum-light: 7
          spirit:rum-dark: 8
          spirit:tequila: 8
    - brain: /lib/behavior/idles
      trigger: cadence:43s
      config:
        pool:
          - { kind: free, value: "checks a pallet count against a clipboard." }
          - { kind: free, value: "straightens a case so the mark faces out." }
