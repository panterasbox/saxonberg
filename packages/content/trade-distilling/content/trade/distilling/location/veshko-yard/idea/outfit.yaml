# Veshko Distilling — the corpo's OPERATING Business (Veshko the organization
# is capital; this is the yard that trades). `parentOrganization` is the
# chart it hangs off; its `hand` position purchases, so the hand consigns AS
# Veshko Distilling onto the cash-and-carry and each sale lands here.
class: /platform/idea/Business
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: "Veshko's yard"
  parentOrganization: /corpo/veshko
  appointingAuthority:
    kind: committee
    parcel: /corpo/veshko
  positions:
    - key: hand
      label: running Veshko's yard
      wageRate: 4
      confers: []
      purchases: true
  rosterSlots:
    - positionKey: hand
      assignee: /trade/distilling/location/veshko-yard/agent/hand
      schedule:
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [0, 24] }
  banksAt: goodkin
  operatingLocations:
    - /trade/distilling/location/veshko-yard/location/distillery
    - /trade/distilling/location/veshko-yard/thing/stock
