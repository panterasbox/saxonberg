# The crowsfoot outfit's floor — a `warehouse` instance: the racking, the
# outfit's Stock (the floor rows' home `container:` — the sweep stands them
# at target here) and the hand whose `consigns` beat carries them to the
# cash-and-carry. No exits: the hand teleports (the `shifts` shape); a walk
# is the locomotion slate's.
# An ordinary location, not a FurnishableRoom: that class is the
# FURNISHING archetypes' base. A trade floor's durability lives on its
# persistable fixtures (the Stock, the racking, the counter) — the
# consigned goods and their listings ride those, never the room; the
# `populates` set below is the placement and respawns each boot.
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  # ⚠ `coords:` is the MEMBERSHIP operation — `setCoords` is the only way
  # an authored row joins a zone, so without it this floor was in no grid
  # and inherited nothing from one. See the zone row beside it.
  coords:
    x: 0
    y: 0
    z: 0
  shortDescription: the Crowsfoot outfit's floor
  primaryKeyword: floor
  keywords: [floor, yard, warehouse, crowsfoot]
  longDescription: |
    A small, tidy yard, and a working one now: the copper still gleams over its firebox, the scarred tun steams by the standpipe, two wash vats stand crusted at the tide line, and the still book hangs on its chain. Cases and empty square bottles queue on the pallet.
  ambientIntensity: 25
  ambientColorTemperature: 4200
  # A working still-house: the wash's happy middle.
  _temperature: 289
  # It displaces its own air while the backs work (P11).
  reserves:
    air:
      capacityValue: 100
      currentValue: 100
      unit: "%"
  exits:
    # ⭐ The back door onto the goods yards — the one room the D11
    # switchover cost. The hand does not travel; a HAULER comes in this
    # way to collect what the hand crated and posted about.
    southwest:
      destination: /world/terminus/goods-yards/yard
      media: [ground]
      edgeMinutes: 2
  props:
    # ⭐ The works board, ON the floor — and it is for PEOPLE.
    #
    # ⚠ It shipped with a different reason: the hand was going to post
    # what wanted moving instead of travelling. The hand WALKS instead
    # (D11's literal reading, once the floor had a door), so nothing on
    # this board is posted by an NPC. It is where the outfit's own
    # proprietor posts carriage, and it is what a hauler standing here
    # reads — including `jobs --origin here`, the backhaul.
    - /trade/haulage/thing/works-board
    - /trade/distilling/thing/racking
    - /trade/distilling/thing/crowsfoot-stock
    - /trade/distilling/thing/still
    - /trade/distilling/thing/mash-tun
    - /trade/distilling/thing/standpipe
    - /trade/distilling/thing/still-book
    - /trade/distilling/thing/vat
    - /trade/distilling/thing/vat
  cast:
    - /trade/distilling/agent/crowsfoot-hand
