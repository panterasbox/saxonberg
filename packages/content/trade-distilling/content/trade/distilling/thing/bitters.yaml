# A SPECIALTY — the botanicals a big distillery does not bother with and
# a small house lives on. Crowsfoot makes it, alongside its gin.
#
# ⭐ This is what gives the independent a real position: a negroni needs
# bitter liqueur, a spritz needs aperitivo, an old-fashioned needs
# bitters. The bar cannot serve its menu without dealing with the little
# place across town, however much cheaper the corpo's rail is.
#
# Crowsfoot's Stock names it as a line and makes it up to par;
# its hand carries the case to the cash-and-carry and consigns it AS Crowsfoot.
