# ⭐⭐ The whiskey cask — where new-make becomes whiskey, and the
# distilling trade's own row of the VAT family.
#
# The brewing pack already ships a `cask` for conditioning ale, and this
# is the same object doing the other thing an oak barrel has always done:
# the profile at `/trade/distilling/idea/maturation/whiskey-aging` keys on
# `new-make` and turns it into `whiskey` over about forty-five game-days,
# `sealedOnly` — so it only works once you have bunged it (`close cask`).
#
# ⭐ The grade is the CUT's, not the cask's: `MaturingMixin` caps a
# batch's band at the band the fill carried in, so no amount of waiting
# turns a bad cut into good whiskey. Nor does the dose change — methanol
# does not age out, and the payload survives the material swap. Time
# improves whiskey; it does not absolve a distiller.
#
# ⚠ `liquidTight`, not `sealed`, for the brewing cask's reason: oak
# breathes.
#
# ⭐⭐ **`imparts:` — what the wood GIVES, added by the styles build.**
# The oak lactones and a little vanillin off the lignin, written into the
# contents in step with the conversion, so a dram out of this cask reads
# *clearly of oak, faintly of vanilla* and one out of the charred cask
# next to it reads of vanilla and char instead. Two casks, one spirit,
# two whiskies — and a second wood is a row, not code.
#
# ⚠ The prose said *"A charred oak cask"* while this is the PLAIN one and
# the char lived nowhere at all. Fixed here: this row is a plain cask and
# `charred-cask.yaml` is the toasted one, which is the difference the
# `imparts` figures now actually express.
class: /platform/thing/Vat
data:
  shortDescription: "whiskey cask"
  keywords: [cask, barrel, oak, whiskey, empty]
  register: indefinite
  longDescription: >-
    A plain oak cask on a low stillage, hooped in black iron, the
    bung-hole sitting up and the head stencilled with a date nobody has
    filled in. The staves are pale inside, raised but never fired.
  category: cask
  _materialPath: /stuff/idea/material/wood/oak
  mass: 40
  interiorBulk: true
  interiorCapacity: 25
  closure: liquidTight
  open: true
  # Calibrated against the aroma thresholds, not picked: oak's is
  # 0.07 mg/L, so 25 reads *clearly*; vanilla's is 0.1, so 3 reads
  # *faintly*. The plain cask is a wood note with a hint behind it.
  imparts:
    - { type: oak, amount: 25 }
    - { type: vanilla, amount: 3 }
