# ⭐⭐ A nosing glass — **the instrument a distiller actually reads with**,
# the way you read a spirit properly.
#
# ⭐ An open cask scents the room it stands in, and you can taste anything in
# reach, but a glass is how you read a spirit properly: you pour a dram, which
# is exactly how it is done in the trade.
#
# A tulip: narrow at the lip so the volatiles gather. Small, because you
# are reading it rather than drinking it — and because a distiller nosing
# a cask at hearts strength does not want 0.4 L of it.
class: /platform/thing/ServingVessel
data:
  shortDescription: nosing glass
  keywords: [nosing-glass, nosing, glass, copita, dram]
  register: indefinite
  longDescription: >-
    A small stemmed tulip of thin glass, narrow at the lip so whatever is
    in it gathers in the neck. There is a water-mark ground into the side
    at barely a mouthful.
  category: nosing
  mass: 0.2
  interiorBulk: true
  interiorCapacity: 0.05
