# The small pot still — the kit's run (D15), sold openly: D11's fire is
# the honest deterrent, and excise is the fiction's future, not a
# mechanic. The Still class is its own furnace, so `ignite` and 351 K
# work at a kitchen hearth's scale.
class: /trade/distilling/thing/Still
data:
  shortDescription: small pot still
  keywords: [still, "pot still", alembic, small, pot]
  register: indefinite
  longDescription: A knee-high copper alembic with a coiled worm, bright with polishing.
  # ⭐ A still ships COLD, and now says so. `BurnerMixin.lit` defaults
  # TRUE, so this row shipped "lit" against its own prose ("the firebox
  # swept and ready", "bright with polishing") and against its own class
  # docstring ("lit with `ignite`"). Nothing observable depended on it —
  # the row carries no fuel reserve, and every consumer of `isLit()` also
  # asks `fuelRemaining() > 0` — which is exactly why it went unnoticed
  # for the whole of the distilling build's life. Found by
  # `lint:light-sources` clause (g), 2026-09-24.
  lit: false
  mass: 14
  # The kit's pot: a twelve-litre charge, so a little over two litres of
  # hearts. Enough to learn on and not enough to supply a bar.
  interiorBulk: true
  interiorCapacity: 12
  closure: liquidTight
  # ⚠ `burnTemperatureK: 358` and NOT the 800 K default. The pot's working
  # heat is a little over ethanol's boiling point and a long way under
  # spirit's autoignition at 636 K; the default would have landed every
  # bottle at eight hundred Kelvin, which is a fire rather than a run.
  # ⭐⭐ **The fuel reserve, without which none of this exists.** `FireLogic`
  # refuses to ignite a burner whose `fuelRemaining()` is zero (reason
  # `not-flammable`), and `reachableHeatForImpl` counts only burners that
  # are lit AND fuelled — so a still with no reserve could not be lit, and
  # 351 K was never in reach. Three recipes named this tool and declined
  # `insufficient-heat` for the whole life of the pack, invisibly, because
  # the counter's spirit came off the faucet rows instead.
  #
  # ⚠ No refuel verb exists for ANY burner in the game (the drain is
  # `Burner.ts`'s and nothing puts fuel back). A still burns its authored
  # reserve down once, which at this rate is a long working day. Recorded
  # as a finding, not fixed here — it belongs to the fire/energy slate.
  burnTemperatureK: 358
  bellowsMultiplier: 1
  # ⭐ The fire build: fuel is a BED (kilograms, by material) that
  # `stoke` fills, and the vessel's size is a POWER rather than a
  # percentage-per-minute of nothing. What it reaches depends on what
  # is in it.
  # The same, a quarter the size: a parlour still you stoke by the handful.
  maxBurnPowerW: 4000
  fuelCapacityKg: 12
