# The generic floor bottle of whiskey — the distributor's own house
# product (the "small outfit" consignor's, until the distillery build
# makes it). A `SpiritBottle` row: `censusKey` + `regionTarget` make it a
# floor product the spawn sweep stands at target, and its home
# `container:` is the floor outfit's Stock — the ONLY faucet. The hand
# carries it to the cash-and-carry counter and consigns it as the outfit.
class: /trade/distilling/thing/SpiritBottle
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a bottle of whiskey
  longDescription: A squat bottle of amber whiskey under a plain label.
  primaryKeyword: whiskey
  keywords: [whiskey, bottle, spirit]
  category: spirit-bottle
  interiorBulk: true
  interiorCapacity: 0.75
  interiorMaterial: /trade/distilling/idea/material/whiskey
  interiorAmount: 0.75
  gradeBand: fair
  censusKey: spirit:whiskey
  regionTarget: 12
  materialTags: [spirit, whiskey]
  container: /trade/distilling/thing/floor-stock
