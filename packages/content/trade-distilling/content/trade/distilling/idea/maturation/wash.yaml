# The wash ferment — rough, fast, wild (a still-house does not chase
# wild character out; the still leaves it behind).
#
# ⚠⚠ `inputCategory: distillers-wort` and NOT `wash`. The product
# material's own `wash` tag is the FRACTION SCHEDULE's `inputCategory`,
# and a material tag may only belong to one matcher of a given kind: a
# profile keyed on `wash` would re-key every vessel that so much as
# received the finished wash, and the still would try to ferment its own
# charge.
#
# ⛔ `foreshotCharacter` lived here for one build as INERT authored prose
# — the seam the deferred cuts rung was supposed to read. The cuts rung
# shipped and the character belongs PER FRACTION, on the schedule at
# `/trade/distilling/idea/fractionation/wash`, because there is more than
# one of them and they are not all poison.
class: /platform/idea/maturation/MaturationProfile
data:
  key: wash
  mechanism: microbial
  inputCategory: distillers-wort
  stallBelowK: 283
  happyK: 290
  damageAboveK: 303
  killK: 310
  ratePerDay: 0.3
  productMaterial: /trade/distilling/idea/material/wash
  turnDays: 6
