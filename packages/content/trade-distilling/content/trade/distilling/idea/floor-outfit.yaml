# The floor outfit — The trade's own small outfit — the producer of record for the generic floor bottles until the distillery build gives the floor a still.
# An OUTFIT: a Business + a Stock its floor product spawns into + a hand
# with the `consigns` brain. The hand's `hand` position `purchases`, so at
# hire it is dealt the house card (EmploymentLogic, libations 3d) and its
# `wallet use house` / `consign` trade AS this business — each resale at
# the cash-and-carry splits to this operating account.
class: /platform/idea/Business
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: "the floor outfit"
  appointingAuthority:
    kind: office
    office: prime-minister
  positions:
    - key: hand
      label: running the floor outfit's floor
      wageRate: 3
      confers: []
      purchases: true
  rosterSlots:
    - positionKey: hand
      assignee: /trade/distilling/agent/floor-hand
      schedule:
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [0, 24] }
  banksAt: goodkin
  operatingLocations:
    - /trade/distilling/location/floor
    - /trade/distilling/thing/floor-stock
