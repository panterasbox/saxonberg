# Whiskey — a spirit input. The category tag(s) are what a recipe
# input slot matches (whiskey); the brand is the ROW's
# (`_brandKey`), never the material's. Distilling's, by the generic drain
# rule: the trade whose PROCESS makes it ships it.
class: /platform/idea/material/ConsumableMaterial
data:
  name: whiskey
  keywords: [whiskey]
  appearance: an amber, grain-sweet whiskey
  density: 940
  thermalConductivity: 0.17
  specificHeat: 2400
  edibility: true
  # ⚠ Was 19, against `neutral-spirit`'s 45 and `wash`'s 8 — a
  # forty-per-cent spirit at half the dose of an eight-per-cent wash,
  # which made whiskey the safest drink in the house. 40 is the honest
  # figure beside its neighbours.
  toxicity:
    - { type: alcohol, amount: 40 }
  # ⭐⭐ `malt-whisky` — the slot constraint that makes a blend require
  # both lines. `grain-whisky.yaml` carries `whiskey` but NOT this, so
  # `vat-whisky`'s malt slot will not accept grain spirit and a blender
  # cannot fake a blend out of the cheap half alone. The shared tag is
  # the MARKET; the distinct one is the process.
  tags: [liquid, beverage, drinkable, alcoholic, spirit, whiskey, malt-whisky]
  composition: []
  biologicalSource: null
  # Flammable (P10): the combustion substrate reads these off the
  # material — a spilled, ignited spirit burns.
  autoignitionTemperature: 640
  heatOfCombustion: 24
