# Grain whisky — ⭐ matured grain spirit. Legally whisky, and the Lounge's
# par line takes it.
#
# ⚠⚠ It carries `whiskey` and NOT `malt-whisky`, and that pair of
# decisions is the whole economics of blending:
#
#   - `whiskey` means the bar will buy it and the sour will take it, so a
#     grain house has a market without a malt house's costs;
#   - the absence of `malt-whisky` means the vatting recipe's malt slot
#     will not accept it, so a blend genuinely requires both lines and
#     cannot be faked from the cheap one alone.
#
# The sour's `minGrade: fair` is what stops that being a free lunch: a
# thin spirit badly made is still refused.
