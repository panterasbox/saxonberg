# Stillage — what is left in the pot when the run is over. The spirit is
# gone out of it; what remains is hot, sour, protein-rich liquor that a
# still-house has always sold back to whoever keeps cattle.
#
# ⭐ The `feed` and `compost` tags are the point: the residue of a run is
# not waste, it is somebody else's input. The `spent-grain` row is the
# MASH's residue and this is the RUN's — two different by-products from
# two different steps, and both have a buyer.
