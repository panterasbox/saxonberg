# Orrin Vale — the floor outfit's hand. Holds the outfit's `hand` position
# (`purchases: true`), so at hire the roster tick deals the house card; the
# `consigns` brain then drives the literal verbs — `get`, `wallet use
# house`, `consign … --ask` — carrying the floor stock to the
# cash-and-carry counter and consigning it AS the outfit. The annex names
# the host: the counter path is this config's, never the trade's.
class: /platform/agent/NPC
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: Orrin Vale
  pronouns: he
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  primaryKeyword: hand
  alternateNames: [orrin, vale]
  shortDescription: a stooped floor hand with a dray-cart
  longDescription: |
    A stooped, heavy-shouldered man who has carried cases for thirty years and lifts them like loaves. He counts under his breath and never wastes a trip.
  dispositions:
    - { disposition: diligence, valence: 70 }
    - { disposition: sociability, valence: -40 }
  behaviors:
    - brain: /lib/behavior/consigns
      trigger: cadence:90s
      config:
        stock: /trade/distilling/thing/floor-stock
        shelf: /trade/distilling/thing/counter
        batch: 6
        ask:
          spirit:gin: 14
          spirit:vodka: 13
          spirit:whiskey: 16
          spirit:rum-light: 13
          spirit:rum-dark: 15
          spirit:tequila: 17
          spirit:orange-liqueur: 18
          spirit:bitter-liqueur: 18
          spirit:aperitivo: 15
          spirit:bitters: 9
    - brain: /lib/behavior/idles
      trigger: cadence:37s
      config:
        pool:
          - { kind: free, value: "squares a case on the pallet and chalks a tally on its side." }
          - { kind: free, value: "checks a wax seal with a thumbnail." }
