# Wren Ashby — the crowsfoot outfit's hand. Holds the outfit's `hand` position
# (`purchases: true`), so at hire the roster tick deals the house card; the
# `consigns` brain then drives the literal verbs — `get`, `wallet use
# house`, `consign … --ask` — carrying the floor stock to the
# cash-and-carry counter and consigning it AS the outfit. The annex names
# the host: the counter path is this config's, never the trade's.
class: /platform/agent/NPC
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: Wren Ashby
  pronouns: they
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  primaryKeyword: hand
  alternateNames: [wren, ashby]
  shortDescription: a lean hand in a Crowsfoot apron
  longDescription: |
    A lean, quick person in an ink-stained apron with a crow's foot burned into the bib, carrying a single case as if it were the only one in the world — which, most mornings, it is.
  dispositions:
    - { disposition: diligence, valence: 70 }
    - { disposition: sociability, valence: -40 }
  behaviors:
    - brain: /lib/behavior/consigns
      trigger: cadence:90s
      config:
        stock: /trade/distilling/thing/crowsfoot-stock
        shelf: /trade/distilling/thing/counter
        batch: 6
        ask:
          spirit:crowsfoot-gin: 40
          # The specialties: a small house's real position. Dearer than
          # the corpo's rail, and the menu cannot do without them.
          spirit:bitters: 14
          spirit:orange-liqueur: 22
          spirit:bitter-liqueur: 24
          spirit:aperitivo: 20
    - brain: /lib/behavior/idles
      trigger: cadence:37s
      config:
        pool:
          - { kind: free, value: "squares a case on the pallet and chalks a tally on its side." }
          - { kind: free, value: "checks a wax seal with a thumbnail." }
