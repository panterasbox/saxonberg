# ⭐⭐ **The mash wants GRIST, not whole malt** (the grain chain, D16).
#
# Whole malt does not mash. The husk has to be cracked for the water to
# reach the starch, and until this build there was no grinding step
# anywhere in the tree — both this trade and the distiller were quietly
# drawing milled malt out of nothing. `wash-mash.yaml`'s own comment has
# called its input *"the distiller's grist"* since the day it shipped.
#
# ⚠ Existing play is untouched: the distribution counter stocks a grist
# sack beside the malt sack, so a brewer who has never heard of a mill
# buys grist at a markup and carries on. Milling your own is cheaper —
# which is the whole of what the retrofit adds.
# Wash mash — bought malt and liquor to the still-house's rough wort
# (fermentation W6; the brewer's shape, the distiller's grist).
recipeId: wash-mash
name: Wash mash
keywords: [wash-mash]
discipline: fermenting
difficulty: easy
inputSlots:
- slot: malt
  category: grist
  minGrade: poor
  measureL: 4
- slot: water
  category: water
  minGrade: poor
  measureL: 16
toolCapabilities: [mash-tun]
outputApplication: bulk
outputTemplate: /trade/distilling/thing/wash-bucket
outputMaterial: /trade/distilling/idea/material/distillers-wort
outputAppearance: rough grey-amber wort
outputResidue:
  template: /trade/distilling/thing/spent-grain
  count: 1
