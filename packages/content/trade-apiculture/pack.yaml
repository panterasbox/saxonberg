id: trade-apiculture
version: 0.1.0
root: /trade/apiculture
description: >-
  The apiculture trade — ⭐⭐ **the first RGO whose reservoir is somebody
  else's land.** A colony is the organism: not a herd of insects you draft
  one from, but a single living thing with a strength, a queen, stores and
  a temper, kept in a box whose walls decide how much honey a winter costs.
  What it eats is the bloom within an hour's flight of where it stands, so
  two keepers on one valley find each other out with no ledger telling
  them — and what it leaves behind is a fruit set on trees it does not own.
  ⭐ **It ships ONE verb.** `rob` takes capped comb, because taking honey
  is not milking and the refusal is the season's. Everything else is the
  platform's: you `open` a hive, `put` a nucleus or a super in it, `split`
  a strong colony, `handle` it to read it, `ignite` a smoker, and `make`
  honey out of comb two different ways. The choice the trade exists to
  force is the last one — how much you leave them.
requires:
  # The mechanism is the trade's; the apiaries are the realm's. Held by
  # the Ministry of Trade, like every other placeless trade.
  title:
    - { extent: /trade/apiculture, holder: { organization: /compact/trade } }

# ⭐⭐ **The honeybee has to be RESIDENT, and the drive is how we learned.**
#
# `ProducingMixin.taps()` is a SYNCHRONOUS read of the host's species —
# `getSpecies()` is `StuffApi.findByTemplatePath(_speciesPath)`, and a
# species nothing stood up answers `null`. So a hive with bees in it had
# no taps, and `rob` declined `no-such-tap`: *"the hive does not give
# that"*, about the one product the trade exists for.
#
# ⚠⚠ The plan's reachability table said *"species rows warm by path
# infix"*. They do not — that is how MATERIALS warm
# (`MaterialCatalogue`), and there is no `SpeciesCatalogue`. What is
# eager at boot is declared by the pack that ships the row, and this
# pack shipped none. ⭐ It is the **boot** link of the five, failing
# closed and silent, for the fourth recorded time in this codebase.
boot:
  - { template: /stuff/idea/species/animalia/arthropoda/insecta/hymenoptera/apidae/apis/mellifera, role: sync-read, reason: "ProducingMixin.taps() resolves the colony's species synchronously — an inert species row is a hive with no honey tap" }
