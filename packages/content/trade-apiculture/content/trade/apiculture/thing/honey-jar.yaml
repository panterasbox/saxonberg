# A jar of honey — ⭐ and it is a `Vat`, which is the honest choice.
#
# Bulk honey needs something that holds liquid, SEALS, and matures: honey
# left open ferments by itself (AC 15), and a sealed jar keeps forever.
# That is one object and one mechanism, and the jar's lid is the whole of
# the difference.
class: /platform/thing/Vat
data:
  keywords: [jar, honey, pot]
  shortDescription: jar of honey
  register: indefinite
  longDescription: >-
    A squat glazed jar with a waxed cloth over the mouth, tied down at the
    neck.
  _materialPath: /stuff/idea/material/ceramic/earthenware
  interiorCapacity: 1
  mass: 0.8
  open: false
  # ⭐ (ceramics S1, M6) A fused lead glaze — glossy, and (M7) it gives
  # lead to anything acid kept in it, which nothing about it says.
  coats:
    inside:
      - { material: /stuff/idea/material/glaze/lead, thicknessM: 0.0003, state: fused }
    outside:
      - { material: /stuff/idea/material/glaze/lead, thicknessM: 0.0003, state: fused }
