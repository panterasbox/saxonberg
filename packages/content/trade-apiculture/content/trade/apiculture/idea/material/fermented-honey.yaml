# Fermented honey — ⭐⭐ **the spoilage and the product are the same
# event**, and this row is the spoilage end of it.
#
# Honey left open takes up damp, its water activity climbs off the floor,
# and the wild yeasts that were in it all along start working. It is not
# poisonous and it is not mead: it is honey that fizzed, which is a real
# thing that happens to badly stored honey and a real disappointment.
#
# ⚠ Deliberately worse than mead rather than the same: what distinguishes
# the product from the defect is that somebody meant it.
