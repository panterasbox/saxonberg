# The honeybee — ⭐ and the colony is the herdbook with the individual
# end amputated (D34).
#
# You never draft a bee. A hive is a population with a strength, stores
# and a queen, on a piece of ground — which is exactly the herd record
# minus the promotion act, and that VALIDATES the primitive: if the
# aggregate stands alone it is a real thing rather than a compression
# trick.
#
# ⚠⚠ **The file moved into `trade-apiculture`; the template path did
# NOT.** The row it needs to name — `yieldRow: /trade/apiculture/thing/comb`
# — is the apiculture pack's, and leaving the file in `trade-ranching`
# would point the ranching pack's content at apiculture, which is the
# dependency arrow backwards. The path stays `/stuff/idea/species/…`
# because a honeybee is a fact about the world and belongs in the commons;
# quarrying ships `/stuff/thing/clay-pot` the same way.
class: /platform/idea/species/Species
data:
  binomial: Apis mellifera
  commonNames: ["bee", "honeybee", "bees"]
  _bodyPlanPath: /stuff/idea/species/BodyPlan/sessile
  _parentCladePath: /stuff/idea/species/animalia
  _defaultMaterialPath: /stuff/idea/material/tissue/flesh
  lifecycleStates: ["alive", "dead"]
  sexDeterminationSystem: haplodiploid
  reproductiveMode: sexual
  # ⭐ **The QUEEN's lifespan**, because she is the one individual a
  # colony has. The row said 0–1 days, which is nothing's lifespan; a
  # worker lives about six weeks and is below the resolution anything in
  # this game acts at. Two to five years is the queen, and the colony's
  # own continuity is the population record, not a lifespan.
  lifespanMin: 720
  lifespanMax: 1800
  # ⭐ How a colony takes being worked, floor to ceiling. A hive is never
  # as biddable as a dog and never as wild as an unhandled bull: worked
  # regularly and with smoke it settles, and left alone it goes back to
  # being something that comes up at you.
  handlingRange:
    floor: 0.15
    ceiling: 0.9
  # One bee. ⚠ The MASS is the individual's even though the colony is the
  # organism, because mass is what a body plan measures — and nothing in
  # the game weighs a colony by its species.
  adultMass: 0.0001
  # ⭐⭐ **The tap, and the ceiling here is deliberately absurd.** The real
  # ceiling is the HIVE's `combCapacityKg()` — how many boxes are on it —
  # because the constraint on honey is the room you gave them, not
  # anything about the species. So the species authors a window long
  # enough never to bind and the box does the work.
  production:
    - key: honey
      yieldRow: /trade/apiculture/thing/comb
      perGameDay: 0.5
      behaviour: accrue
      windowDays: 400
  circadianBand: diurnal
  diet: herbivore
  longDescription: >-
    A honeybee, furred and unbothered, working over a clover head with
    its back legs already loaded orange.
  nameBankKeys: []
