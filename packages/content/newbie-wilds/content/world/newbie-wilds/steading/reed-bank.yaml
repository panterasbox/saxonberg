# The reed bank — the far side of the steading pond (size and carrying
# W6, drive 16). Reached only by swimming.
# ⭐ A Shore (size and carrying drive, step 16): the only way off the reed
# bank is back across the pond, so `swim` must be sayable here. As a plain
