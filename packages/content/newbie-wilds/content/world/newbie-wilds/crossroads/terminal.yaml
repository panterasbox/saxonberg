# The crossroads terminal — "the Line". The `both`-directional node the Gate A
# paid route lands travellers at (its arrival room is the hub), and the
# departure origin of the FREE return leg back to the Terminus arrival node. A
# single `both` terminal (the lounge precedent) means it cascade-loads as the
# Gate A route target — no manifest entry needed. Floor-registered (Phase 6):
# the FARE, not registration, gates the outbound trip; the return is free.
#
# `surcharge` is the settlement's **arrival toll** — a charge this terminal
# imposes just for arriving here, ADDED on top of the route's own fee (total =
# fee + surcharge). Collected by the frontier operating budget
# (`CrossroadsTerminal.postRegister` stands it up; `businessAt(the hub)`
# resolves it). So Gate A → crossroads costs 15 (Terminus's, by departure) + 2
# (the frontier's, by destination); the free return leg (fee 0, and Terminus
# arrival has no surcharge) stays free.
#
# The frontier settlement's operating budget stands up lazily (derived from its
# own `operatingLocations`, which name THIS terminal) on the first arrival
# surcharge — no bespoke terminal class needed. Keywords `crossroads`/`frontier`
# are the typeable handles for `teleport crossroads` at Gate A; the board
# DISPLAYS the covering Locality name ("The Last Counted Mile") and the ⊙ total
# fare.
class: /system/tpa/thing/TpaTerminal
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  seatIn: /world/newbie-wilds/crossroads/hub
  shortDescription: a Teleport Authority terminal
  keywords: [crossroads, frontier]
  directionality: both
  status: operational
  surcharge: 2
  # ── the mana leg (TPA reform W6) ──
  # ⭐ A FRONTIER post runs on BOUGHT CELLS, which is why it quotes a
  # dearer ride than a city gate for the same hop (AC13) — the operator
  # resells its own supply at its cost basis, and nobody tuned that.
  #
  # It also drains with NOBODY RIDING (`standbyWatts`), which is what
  # gives a cell swap a schedule and gives the Teleport Authority its
  # first real job: somebody walks the frontier line changing cells.
  # Below `armingFloorTau` the gate is not a gate — it goes dark and
  # refuses even a traveller offering their own mana, because there is
  # nothing left for the mana to arrive INTO.
  capacityTau: 1200
  armingFloorTau: 150
  # 5 W against a 1200 τ cell is roughly a game-MONTH of holding the
  # working open with nobody riding — a schedule somebody keeps, not a
  # chore somebody resents.
  standbyWatts: 5
  # A cell in the bay on standup — the Authority put one in, and the
  # standing draw is already eating it. Somebody has to come back.
  # ⓘ Not `props:`: props seed CONTENTS, and a bay is occupancy. The
  # terminal seats this itself on `postRegister`, once, and only into an
  # empty bay — so a restart restores the captured occupant rather than
  # minting a second cell.
  bornWithCell: /system/arcana/thing/mana-cell
  routes:
    - to: /world/terminus/terminal/thing/arrival-terminal
      fee: 0
