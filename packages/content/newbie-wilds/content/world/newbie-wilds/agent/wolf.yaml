# A wolfshead — the combat-demonstrator beast, one of the "all wolfshead,
# all DEAD OR ALIVE" bounties named on the crossroads board. A generic
# creature (no proper name — Visible.shortDescription per the NamedMixin
# rule), brain-driven in combat by the session's default combat brain (no
# Interactive → auto brain-driven); the species' natural attacks (bite and
# worry) let it strike back unarmed. A lethal cull: no consent, no blame. Idles with a low growl until something gives it a reason.
class: /platform/agent/Extra
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  _speciesPath: /stuff/idea/species/wolf
  lifecycleState: alive
  shortDescription: rangy grey wolf
  keywords: [wolf, rangy, grey]
  register: indefinite
  longDescription: >-
    A rangy grey wolf, all wire and hunger, hackles up and head low. Its
    eyes track you with a flat, patient interest. Somewhere behind the
    ribs a growl idles like a held breath.
  # ⚠ The legacy `naturalAttackChannel: point` is GONE — the wolf's
  # attacks (bite / worry) are authored on the SPECIES row, which is where
  # a fact about wolves belongs. This row was the last content user of the
  # legacy field.
  behaviors:
    - brain: /lib/behavior/idles
      trigger: cadence:14s
      config:
        pool:
          - { kind: free, value: "growls, low and steady, the sound of a held breath let out slow." }
          - { kind: free, value: "circles a half-step, never taking its eyes off you." }
          - { kind: free, value: "bares its teeth and lets a string of drool fall." }
