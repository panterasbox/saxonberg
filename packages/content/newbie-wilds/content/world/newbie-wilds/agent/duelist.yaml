# The gentleman out of the fog who works with a knife — the Build-2
# consented-duel demonstrator, and the first opponent who is a PERSON, not
# a beast. A sentient human (homo sapiens, `sentient: true`), so winning
# the poise contest only DEFEATS him; the killing stroke is the separate,
# telegraphed, interruptible coup. His standing terms are lethal / to the
# death (the `combat.lethality` posture in `persistentStore`), so a lethal
# challenge is one he has already agreed to — a lawful duel, no crime. The
# same stroke against an unwilling townsperson would be murder; consent is
# the whole moral hinge.
#
# ⭐ **Cast, and still nameless.** The board never gives him a name and
# this row never will — but the identity rung is *name OR the definite
# article*, and the notice bills him singularly among four wolfshead:
# "a gentleman out of the fog who works with a knife". He is one specific
# outlaw, not a type anybody could fill, which is precisely what the
# definite article is for (*the* collier, *the* smelterman, *the*
# gentleman). Being somebody is also what makes murdering him a wrong
# against HIM — the alternative was to invent an institution that fields
# an outlaw, which is a contradiction.
# Brain-driven in combat by the session's default combatant brain; his
# `arms` brain takes the knife off the duelling-stone and wields it.
class: /platform/agent/Cast
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  primaryKeyword: gentleman
  alternateNames:
    - duelist
    - gentleman
    - man
  shortDescription: the gentleman out of the fog
  longDescription: |
    A gentleman, out of the fog and unhurried, dressed a little too well for a wet hollow in the wilds — a long coat gone grey at the hems, gloves, a collar buttoned against the damp. He carries himself with the small, complete stillness of someone who has done this many times and expects to do it many more. When he inclines his head at you it is genuinely courteous, and it is not an apology.

    He works with a knife, they say on the board, and he will not be the one to make it a murder: he fights only those who have agreed to fight him, and he fights them all the way to the end they agreed on. Whether that is a mercy depends entirely on you.
  # Standing combat posture: lethal, to the death — the authored
  # CombatantMixin fields the consent handshake reads. Because his
  # lethality MATCHES a `--lethal` challenge, the terms reconcile silently
  # to a CONSENTED duel (no prompt, no imposed-terms crime marker). NPCs
  # aren't Environments, so they carry posture in fields, not settings.
  standingLethality: lethal
  standingStopCondition: death
  behaviors:
    # Take up the knife on the duelling-stone and keep it in hand.
    - brain: /lib/behavior/arms
      trigger: cadence:2s
    # Ambient menace between bouts.
    - brain: /lib/behavior/idles
      trigger: cadence:19s
      config:
        pool:
          - { kind: free, value: "turns the knife once in his gloved hand, watching the light run down it." }
          - { kind: free, value: "inclines his head, courteous, and says nothing." }
          - { kind: free, value: "waits with the patience of a man who has all the time there is." }
