# Corridor 3 — the PRESSURE-PLATE BLADE span. A concealed plate-and-blade (a
# `subtle` Trap: edge channel, `trip` consequence — a low sweep that takes
# the legs and knocks you prone). `subtle` is the shallow end of the ladder:
# a careful walker notices it, a runner barrels into it — the care-speed
# demonstrator's "run springs what walk avoids" case. It trips; it does not
# block — pick yourself up and the vault is one step north.
class: /platform/location/CartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: the last span before the vault
  primaryKeyword: corridor
  longDescription: |
    The corridor makes its last run here toward a low arch and the dark room beyond. A single flag near the arch sits a shade proud of the rest, and a hair-fine slot runs across the passage at ankle height where the wall has been let out for something to swing.

    North, through the arch, is the vault. South is the way back.
  coords:
    x: 0
    y: 3
    z: 0
  details:
    slot:
      keywords: [slot, blade, plate, flag, arch]
      description: |
        A dark slot no wider than a coin runs wall to wall at ankle height, and a single flag before it sits proud. Tread the flag and the slot answers — a low blade on a short arc, meant to take the legs, not the life.
  exits:
    north:
      destination: /world/newbie-wilds/delve/vault
    south:
      destination: /world/newbie-wilds/delve/corridor-2
  props:
    - /stuff/thing/traps/pressure-blade
