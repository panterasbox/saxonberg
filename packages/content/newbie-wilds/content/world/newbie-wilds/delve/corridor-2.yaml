# Corridor 2 — the SPIKE PIT span. A concealed covered pit (a `hidden` Trap:
# point channel, `drop` consequence to the pit-below, groundTriggered so a
# flier/swimmer clears it). Stepping onto the false floor drops you into the
# pit — but the pit-below has a climb back UP, so a fall wounds and delays,
# it does not trap you: the way on (`north`) is still reachable after you
# climb out (the pit is one-shot — once sprung it stays sprung).
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a span of corridor over a false floor
  primaryKeyword: corridor
  longDescription: |
    The corridor widens a little here and the flagstones give way to a broad, even lid of boards dressed to look like more stone — too even, if you have the eye for it, and it gives the faintest drum-note underfoot.

    North the passage continues past the wide place. South is the trapped span you came through.
  coords:
    x: 0
    y: 2
    z: 0
  details:
    floor:
      keywords: [floor, boards, lid, span]
      description: |
        A wide lid of dressed boards laid flush with the stone and dusted to match it. A careful weight at the edge finds no purchase beneath; a full stride onto the middle finds nothing at all.
  exits:
    north:
      destination: /world/newbie-wilds/delve/corridor-3
    south:
      destination: /world/newbie-wilds/delve/corridor-1
    # The pit itself, as an authored redirect exit (the plan's "model the
    # below as an authored redirect, not geometry"): concealed like the pit
    # it IS, so honest-fog hides it — but authoring it here materializes the
    # pit-below at standup (an exit cascades its destination) so the spike
    # pit's `drop` has a live location to fall into. Its partner `up` is on
    # the pit-below seed.
    down:
      destination: /world/newbie-wilds/delve/pit-below
      concealment: hidden
      hint: the boards give a hollow drum-note — something opens below
  populates:
    - /stuff/thing/traps/spike-pit
