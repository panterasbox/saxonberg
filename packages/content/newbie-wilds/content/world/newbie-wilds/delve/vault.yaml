# The vault — the far room, the destination. Reachable by a PLAINLY-VISIBLE
# exit chain through the corridor (vestibule -> c1 -> c2 -> c3 -> here), so a
# mover with zero awareness reaches it without discovering any secret: the
# traps wound and redirect along the way but never gate. It holds the OBVIOUS
# reward (unconcealed, taken with no search) — the concealed cache back in
# corridor 1 is a bonus, not the prize.
class: /platform/location/CartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: the delve vault
  primaryKeyword: vault
  longDescription: |
    The corridor opens into a squat, dry chamber with a shelf cut into the far wall. Whatever hoard it once held is long gone; a single offering-bowl of dull metal still sits on the shelf, left for whoever made it this far.

    South, the corridor runs back the way you came.
  coords:
    x: 0
    y: 4
    z: 0
  exits:
    south:
      destination: /world/newbie-wilds/delve/corridor-3
  # The obvious reward — unconcealed, no search needed. The prize is the
  # plainly-reachable one; the concealed cache in corridor 1 is pure upside.
  props:
    - /world/newbie-wilds/delve/reward
