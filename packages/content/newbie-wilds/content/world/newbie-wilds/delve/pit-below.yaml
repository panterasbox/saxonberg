# The pit floor — where the corridor-2 spike pit's `drop` lands you. Kept
# RECOVERABLE by design: a single `up` climbs back to corridor 2 (and the pit
# above is now sprung/one-shot, so re-crossing it does not re-drop you). A
# fall wounds and delays; it does not strand — the content-discipline rule
# ("traps redirect but never hard-block") realized as geometry.
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: floor of the pit
  keywords: [pit, floor]
  register: definite
  longDescription: |
    You have come down harder than you meant to. The pit is a stone box a little taller than a man, its floor gritty with old spoil and the odd blackened spike that missed. Above, the ragged hole shows the corridor you dropped from, and a rough scramble of set stones climbs back to it.

    Up is the only way out — the corridor you fell from.
  coords:
    x: 0
    y: 2
    z: -1
  # ⭐⭐ The lime seep. Runoff pools at the bottom of a pit and lime
  # leaches out of the mortar, so this is where a caustic honestly
  # belongs — and it is the one hazard in the delve that is NOT hidden.
  # You can see it perfectly well and it will still take the skin off
  # your feet, which teaches that not all danger is somebody's trap.
  props:
    - /stuff/thing/traps/lime-seep
  exits:
    up:
      destination: /world/newbie-wilds/delve/corridor-2
