# The vault reward — a plain, unconcealed `Thing` on the vault shelf. The
# OBVIOUS prize: reachable and takeable with zero awareness and no search, so
# the concealed cache in corridor 1 is a bonus and not the objective. This is
# the content-discipline invariant made content — the reward that proves no
# critical thing hides behind a perception wall.
class: /platform/thing/Prop
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a dull metal offering bowl
  primaryKeyword: bowl
  longDescription: |
    A shallow bowl of dull grey metal, older than the traps that guard it, left on the vault shelf for whoever crossed the corridor and lived. Plain to see and plain to take.
