id: corpo-vionne
version: 0.2.0          # reserved; nothing reads/enforces it (non-goal: version machinery)
root: /corpo/vionne
description: The vionne corpo — its mark, its brands, and its org chart.
# The corpo's own chart maintains its pack (content-packs wave 3, D8): the
# organization row this pack ships, resident from boot.
maintainers: { organization: /corpo/vionne }
requires:
  groups:
    # ⭐ The corpo's COMMITTEE (economic bootstrap D7; the institutions
    # slate's committee/show split): the concept gets an officer, the
    # instance gets a committee. The Registrar of Corporations owns this
    # group and seats it (the `soul` precedent — the seat adds members
    # with the `group` verb; players only, never by being hired). Empty
    # at boot → the founder, through the Registrar's seat.
    - name: vionne-committee
      purpose: the committee over Vionne — who answers when the corpo fails
      owner: { office: registrar-of-corporations }
  # The committee holds the corpo's branch; the organization is the show.
  # A hired clerk is staff; the showrunner may also play the CEO.
  title:
    - { extent: /corpo/vionne, holder: { group: vionne-committee } }
boot:
  - { template: /corpo/vionne, role: producer, reason: appoint and the chart reads resolve the organization by templatePath }
