id: rejection
version: 0.1.0
root: /world/terminus/rejection
description: >-
  Rejection — a VENUE pack, and the FIRST mining town. The pithead's five
  rooms, the adit and three authored galleries, the two zones, the Ferrow
  deposit row, the four procedural room type rows and their prose banks,
  the claim register, the four businesses that make the chain circulate,
  the fuel yard with its coppice and the smelter beside it, this place's
  own ecology (crickets, delve-rats, the pale grazer, the glowcap that
  lights it), and the functional cast.
  ⭐ It ships NO TypeScript. Every class it names belongs to the four
  trades (mining, fuel, smelting, smithing) or the platform — which is
  what makes "a second mining town is a locality pack over the same
  trades" a fact a reviewer can check by listing the directory rather
  than a claim.
requires:
  groups:
    - name: rejection
      purpose: the Ferrow diggings and the town that works them
      owner: { office: prime-minister }
  title:
    # Under the realm root (economic bootstrap D5): the title tree IS the
    # situs tree, so a dead floor here escheats up to the realm's committee.
    - { extent: /world/terminus/rejection, parentParcel: /world/terminus, holder: { group: rejection } }
    # ⭐ The Kestrel road, subdivided as its own parcel under the town's
    # extent (logistics D18/D20). `wild` — "unserviced ground: PASSAGE
    # and gathering only" — because nothing between the crossroads and
    # the yard gate is maintained by anybody: the revetment is failing in
    # three places and three of the chain stakes are missing, which is
    # what unserviced ground looks like when you stand on it. **No
    # seventh land use.**
    - { extent: /world/terminus/rejection/kestrel-road, parentParcel: /world/terminus/rejection, holder: { group: rejection }, landUse: wild }
    # ⭐ The Hanging Wood (forestry): the town's common wood, held by the
    # settlement's group — *common land* is who holds it. `agricultural`,
    # NOT `wild`: `wild` admits no cultivation and `plant` refuses on any
    # fixed ground in it, which would make planting a standard
    # unreachable; agricultural ("cultivation at scale, livestock and
    # orchards") is the honest word for a worked common, and ISCED 0821
    # forestry sits under 08 agriculture. **No seventh land use.**
    - { extent: /world/terminus/rejection/hanging-wood, parentParcel: /world/terminus/rejection, holder: { group: rejection }, landUse: agricultural }
