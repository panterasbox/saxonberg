# Subterracavia pallida — the pale grazer: a blind, unpigmented cavy that
# eats the glowcap and has been down here long enough to have stopped
# bothering with eyes.
#
# ⭐ It is the ecology's own argument that the glowcap is INFRASTRUCTURE
# rather than decoration: something eats it, which means keeping a
# fixture lit is a small ongoing fight with an animal rather than a line
# item. Cave fauna really do go blind and pale; the invention is only
# which fungus.
