hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  binomial: Subterracavia pallida
  commonNames: ["pale grazer", "grazer"]
  _bodyPlanPath: /stuff/idea/species/BodyPlan/quadruped
  _parentCladePath: /stuff/idea/species/animalia
  _defaultMaterialPath: /stuff/idea/material/tissue/flesh
  vitalProfile:
    coreTemperature: { baseline: 309, survivableMin: 296, survivableMax: 314 }
    heartRate: { baseline: 250, survivableMin: 90, survivableMax: 400 }
    respiratoryRate: { baseline: 70, survivableMin: 25, survivableMax: 150 }
    bloodPressureSystolic: { baseline: 110, survivableMin: 55, survivableMax: 160 }
    bloodPressureDiastolic: { baseline: 70, survivableMin: 35, survivableMax: 110 }
    spo2: { baseline: 96, survivableMin: 52, survivableMax: 100 }
    bloodVolume: { baseline: 0.06, survivableMin: 0.036, survivableMax: 0.06 }
  lifecycleStates: ["alive", "dead"]
  sexDeterminationSystem: xy
  reproductiveMode: sexual
  lifespanMin: 0
  lifespanMax: 6
  circadianBand: cathemeral
  diet: herbivore
  visionProfile:
