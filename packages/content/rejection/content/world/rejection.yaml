# Rejection — the region zone, and ⭐ **the reason it is the region and
# not the mine that carries `deposit:`.**
#
# `Zone.lookupField` walks OUTWARD, so a field declared here is inherited
# by every zone under it. The surface pithead and the workings must
# resolve the SAME orebody — the outcrop, the float and the three-point
# problem are all played above ground, and a deposit declared only on the
# mine zone would leave a prospector standing on the stain with nothing
# to measure.
#
# That inheritance is also what makes a second mine's zone pair a pure
# content copy: two zones, one `deposit:` line on the parent, done.
#
# The name is the town's, and the town is named for what the ground did
# to the people who came here first.
class: /platform/idea/location/CartesianZone
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: Rejection
  cellSize: 10.0
  deposit: /world/rejection/idea/deposit/ferrow
