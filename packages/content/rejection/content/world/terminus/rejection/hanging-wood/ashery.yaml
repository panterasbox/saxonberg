# The Hanging Wood ashery (potash D16) — ⭐ where the wood's waste becomes
# the glasshouse's flux. It stands in the wood because potash is about a
# tenth of the ash's mass: burn where the wood is, leach and boil where the
# ash is, and cart the cake. A lean-to with a hearth and an iron pot on it,
# a hopper, a rain butt and an egg to read the lye by.
#
# ⭐ Persistent: a pot boiling down over hours, a hopper leaching overnight,
# a cake in the pot — a kept place outlives a restart (cleanliness D31).
#
# ⚠ The prose is invariant: it never says how much ash is in anything.
class: /platform/location/PersistentLocale
data:
  shortDescription: ashery
  keywords: [ashery, "ash house", "lean-to", potashery]
  register: definite
  _biomePath: /stuff/idea/biome/outdoor/woodland
  # An open clearing, the canopy cut well back off the smoke.
  ambientIntensity: 4500
  ambientColorTemperature: 5600
  longDescription: |
    A clearing west of the big oaks, grey underfoot for twenty yards in every direction, where the ash has been carried and spilled and trodden in for years. A broad pit ringed with blackened stones takes up the middle of it, and a squat brick kiln stands at the far side. A lean-to of rough boards shelters a hearth with two iron pots on it, crusted white round the lip, and heaps of grey ash kept dry along its back wall, and beside it a tall hopper on legs with a stone channel under its spigot. A tarred rain butt stands under the eaves.

    Everything here smells of wet ash and lye, and there is not a green thing growing within a cart's length of the hearth.
  coords: { x: -1, y: 2, z: 0 }
  cast:
    - /world/terminus/rejection/agent/ash-burner
  exits:
    east:
      destination: /world/terminus/rejection/hanging-wood/oak-clearing
      edgeMinutes: 2
  props:
    # ⭐ The burn (potash D2): a big Burner fed with the wood's waste.
    - /trade/potash/thing/ash-pit
    # ⭐ Its own kiln for the calcining (potash D16), so the ashery and the
    # glasshouse never wait on each other.
    - /stuff/thing/Kiln
    - { template: /trade/forestry/thing/cordwood, as: cordwood-1 }
    - { template: /trade/forestry/thing/cordwood, as: cordwood-2 }
    - { template: /trade/forestry/thing/cordwood, as: cordwood-3 }
    - { template: /trade/forestry/thing/cordwood, as: cordwood-4 }
    - /stuff/thing/Hearth
    # ⭐ Two pots on the one hearth (potash D16): a strong lye and a weak one
    # boiled over the SAME fire is how an ash-burner learns what weak lye
    # costs in wood (AC 5).
    - { template: /trade/potash/thing/iron-pot, as: pot-1, on: /stuff/thing/Hearth }
    - { template: /trade/potash/thing/iron-pot, as: pot-2, on: /stuff/thing/Hearth }
    # The ashery's store of ash, bought in from hearths and kept dry under
    # the lean-to — fresh ash for a second pass of the lye.
    - { template: /trade/fuel/thing/wood-ash, as: ash-1 }
    - { template: /trade/fuel/thing/wood-ash, as: ash-2 }
    - { template: /trade/fuel/thing/wood-ash, as: ash-3 }
    - { template: /trade/fuel/thing/wood-ash, as: ash-4 }
    - { template: /trade/fuel/thing/wood-ash, as: ash-5 }
    - { template: /trade/fuel/thing/wood-ash, as: ash-6 }
    - /trade/chandlery/thing/hopper
    - /trade/potash/thing/rain-butt
    - /trade/potash/thing/test-egg
    # A pail to carry the rain to the hopper and the lye to the pot.
    - /stuff/thing/vessel/pail
    # ⭐ The pit is raked out with a broom — `sweep` is the broom's verb
    # (found by the drive: an ashery with no broom could not be swept).
    - /stuff/thing/gear/broom
    - { template: /trade/chandlery/thing/lye-flask, as: flask-1 }
    - { template: /trade/chandlery/thing/lye-flask, as: flask-2 }
  details:
    ground:
      keywords: [ground, ash, grey, floor]
      description: |
        Grey and soft and packed, with black flecks of char in it. Rain has run it into ridges where the hopper drips.
