# A coppice panel in the Hanging Wood — the hazel cant. The
# yard's row's twin (`/world/terminus/rejection/thing/fuel-yard-panel`): a
# `/trade/forestry/thing/Panel`, one row one panel, restored from its own
# record; propped by a Wood room, so it is ALSO a nested keyed host in
# the room's container slice and restores by the same `singleton()`.
#
# ⚠⚠ The same arithmetic as the yard's — six stools × eight lengths a
# game year = 48 lengths = six burns = twelve baskets = SIX SMELTS per
# panel per game year — and the same rule: this is not a number to raise
# when somebody runs out. Three panels in the realm make eighteen smelts
# a year, and one working smelter wants more than that.
#
# Eight slots, six stools: the two free are where an acorn goes. In a
# Wood a planted standard is recorded on the ROOM's stand — who, what,
# which game day — and read back by `look`.
class: /trade/forestry/thing/Panel
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: panel of coppiced hazel
  keywords: [panel, coppice, hazel, stools, cant]
  register: indefinite
  longDescription: |
    A block of hazel stools set out in rough rows, all cut to the same knuckle in the same year and all standing at the same height because of it. The ground between them is a litter of old chips and last season's tops.
  _materialPath: /stuff/idea/material/wood/hazel
  mass: 2400
  fixedGround: true
  landRequirementM2: 120
  interiorBulk: true
  interiorCapacity: 180
  # ⚠ The EARTH — the bulk soil the roots go into (the root ceiling), a
  # different axis from the reserves below (what the earth holds). The
  # shipped coppice panel authored the capacity and no amount, so `plant`
  # answered *"has no soil in it. Pour some in first."* — found by
  # planting an acorn in a browser. A panel is ground: it ships full.
  interiorMaterial: /stuff/idea/material/bulk/potting-soil
  interiorAmount: 180
  reserves:
    moisture:
      capacityValue: 90
      currentValue: 90
      unit: "L"
      theme: cultivation
      floorEffect: wilting
    nitrogen:
      capacityValue: 100
      currentValue: 100
      unit: "%"
      theme: cultivation
      floorEffect: spent
  staticSlots:
    - name: plant
      accepts: SlottableMixin
      capacity: 8
      userFacingDetail: planting
  props:
    - /trade/forestry/thing/hazel-stool
    - /trade/forestry/thing/hazel-stool
    - /trade/forestry/thing/hazel-stool
    - /trade/forestry/thing/hazel-stool
    - /trade/forestry/thing/hazel-stool
    - /trade/forestry/thing/hazel-stool
  details:
    planting:
      keywords: [ground, litter, chips, stools, rows]
      description: |
        Old chips and rotted tops underfoot, and the stools standing out of it in rows a cart could just get between.
