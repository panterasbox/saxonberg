# ⭐ The man on the fringe — and, like the co-op's hewer, he is not
# colour.
#
# **Supply must not be a function of concurrency.** The iron rung is only
# an economy if iron ore is at the counter on a night when nobody is
# logged in, and this is the hand that puts it there. He runs the shipped
# `delves` beat, unmodified, on his own claim.
#
# ⚠ He is not privileged. Every act in the beat is a forced LITERAL verb:
# bad ground refuses him, a worked-out face refuses him, and the only
# reason he gets iron and the co-op's man gets copper is that he is
# standing eighty-six metres further along the strike.
#
# ⭐ He asks SIX where the co-op asks nine, and that is the fringe's whole
# economics in one number: his ore is richer by formula (goethite is
# 0.6285 iron against malachite's 0.5748 copper) and nobody is taking a
# cut of it, so he can undercut the co-op and still eat. A player who
# stakes the ground next to his is walking into a market that already has
# a price in it.
class: /platform/agent/Extra
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sensitivus
  lifecycleState: alive
  keywords: [hewer, independent, prospector, fringe]
  shortDescription: hewer on the fringe
  register: indefinite
  longDescription: >-
    Older than the men at the pithead and burnt browner, working his own
    cut with no hurry in him at all. His hands and his cuffs are the same
    rust colour as the rock. He looks up when you arrive, decides you are
    not the recorder, and goes back to it.
  props:
    - /trade/mining/thing/pick
    - /world/terminus/rejection/thing/glowcap-jar
  behaviors:
    - brain: /trade/mining/behavior/delves
      trigger: cadence:90s
      config:
        home: /world/terminus/rejection/location/fringe-claim
        shelf: /world/terminus/rejection/thing/assay-counter
        ask: 6
        batch: 3
