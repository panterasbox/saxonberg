# The outfitter's counter at the put-in (the river build): what drives a
# boat, what holds and lines her, and the instruments that tell you what the
# river is doing. ⚠ The boats are not on it: a boat is a vessel, and a
# counter cannot hold one (the drive found the whole cascade through the
# pass failing on it) — they lie on the shingle, the outfitter's own.
#
# ⭐ Harbors review 1: a boat is still never ON the counter, but she is
# SOLD over it — an ordinary good that is already there. The house's boats
# lie on the shingle (the landing's `props:`); the counter prices them with
# no stock line, and a sale transfers her title and leaves her where she
# lies, her bow line in her. Finite: nothing restocks them (a boatwright is
# a later build's). Priced against the outfitter's own wage (4 an hour, ~56
# a shift): a rowboat about three days' wages, a canoe about two. The
# shed LETS its own boats by the day too, but a let is not a sale: that is
# the hire book's (`hire-book.yaml`).
class: /trade/shopkeeping/thing/Stock
data:
  shortDescription: boat-shed counter
  keywords: [counter, shed, till]
  register: definite
  longDescription: |
    A plank across two barrels in the mouth of the shed, with a price list chalked on the door behind it and paddles racked on the wall.
  _materialPath: /stuff/idea/material/wood/pine
  mass: 40
  discipline: scrum
  attendDurationMs: 0
  staffingPolicy: self-service
  serverPositionKeys: [keeper]
  businessPath: /world/terminus/rejection/put-in/idea/outfit
  stockLines:
    - { itemTemplatePath: /system/transport/thing/propulsion/paddle, par: 4 }
    - { itemTemplatePath: /system/transport/thing/propulsion/pole, par: 2 }
    - { itemTemplatePath: /system/transport/thing/killick, par: 2 }
    - { itemTemplatePath: /platform/thing/bow-line, par: 3 }
    - { itemTemplatePath: /system/water/thing/current-log, par: 2 }
    - { itemTemplatePath: /stuff/thing/instrument/thermometer, par: 2 }
  prices:
    /system/transport/thing/propulsion/paddle: 4
    /system/transport/thing/propulsion/pole: 5
    /system/transport/thing/killick: 3
    /platform/thing/bow-line: 2
    /system/water/thing/current-log: 5
    /stuff/thing/instrument/thermometer: 6
    /system/transport/thing/rowboat: 160
    /system/transport/thing/canoe: 110
