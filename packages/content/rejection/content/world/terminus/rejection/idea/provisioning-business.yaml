# The provisioning shed — buys tools and timber in, sells them on.
class: /platform/idea/Business
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  appointingAuthority:
    kind: entity
    path: /world/terminus/rejection/agent/storekeeper
  positions:
    - key: storekeeper
      noun: storekeeper
      label: minding the stores
      wageRate: 4
  rosterSlots:
    - positionKey: storekeeper
      assignee: /world/terminus/rejection/agent/storekeeper
      schedule:
        # ⭐ Real hours (envelope S8). This authored `[0, 24]` — a house
        # staffed around the clock — which was never true of it and made
        # the night indistinguishable from the day. The `shifts` brain
        # parks off-shift cast in the venue's Offstage, so the street
        # genuinely empties.
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [6, 18] }
  banksAt: goodkin
  operatingLocations:
    - /world/terminus/rejection/location/provisioning
