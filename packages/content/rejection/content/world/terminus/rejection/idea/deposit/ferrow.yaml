# ⭐⭐ The Ferrow orebody — **and it is a PLACE, not a trade fact.**
#
# `trade-mining` ships the `Deposit` CLASS and no ore. A deposit is a
# thing about somewhere, so it belongs to the venue, and a second mining
# town writes its own numbers here and touches no code at all.
#
# ## What is authored and what is not
#
# Everything below is STRUCTURE: the stratigraphy, the water table, the
# lode's plane, the grade bands, the depletion lean, the feature pins.
# The per-cell detail — is there ore in THIS ten metres of rock, and how
# much — is computed from position and stored nowhere, seeded from this
# locality's own address. ⚠ There is no seed field here on purpose:
# rename the mine and its ore moves, and no author manages a magic
# number.
#
# ## The numbers, in METRES
#
# ⚠ Metres, not grid cells. A deposit is a fact about the rock, and the
# rock does not know what cell size somebody chose for the workings cut
# through it; `Working.metresOf` is the single conversion and reads the
# zone's `cellSize` (10 m here).
#
# **The water table at −45 m is the whole of Stage A's scope boundary.**
# An adit drains by gravity, and the oxide cap is physically located above
# that line — so geology, engineering, the tech ladder and the economics
# all put the cut in one place and the scope needs no defending.
class: /system/ground/idea/Deposit
data:
  name: ferrow
  # Slate over granite. ⭐ The band is not decoration: a heading in slate
  # costs about half what the same heading costs in granite, because
  # carve cost is `hardness × volume` and the two rows genuinely differ.
  # A miner who learns to keep above −60 m is learning real economics.
  stratigraphy:
    - { toZ: -60, host: /stuff/idea/material/rock/slate }
    - { toZ: -400, host: /stuff/idea/material/rock/granite }
  waterTable: -45
  # The lode: one plane, striking 041 and dipping 62 to the southeast,
  # twelve metres thick, running 180 m along strike and 90 m down dip
  # from a point 20 m below the yard.
  #
  # ⭐ `strike` and `dip` ARE theta and phi. That is why the survey can
  # solve the body from three points, and why a player doing it is doing
  # real geometry rather than opening a chest.
  lode:
    through: [0, 0, -20]
    strike: 41
    dip: 62
    thickness: 12
    strikeExtent: 180
    dipExtent: 90
    gangue: /stuff/idea/material/mineral/quartz
    # ⭐ The disseminated margin. The wall rock around a real orebody is
    # weakly mineralized, and fifteen metres of taper is what makes a
    # heading that misses come back THIN rather than empty — thin tells
    # you which way to turn, and empty tells you nothing. ⚠ Widening
    # `thickness` instead would have made the miss free.
    halo: 15
  # ⭐⭐ **The body is zoned on TWO axes, and they are orthogonal facts.**
  #
  # DOWN — supergene zonation: rain weathered the top of the lode into an
  # oxide cap and left the sulfides below the water table. That is the
  # `toZ` axis, and it is the one that has always been here.
  #
  # ALONG — magmatic zonation: the metals dropped out of one fluid at
  # different distances from its source, so the body has a COPPER HEART
  # and an IRON-RICH DISTAL FRINGE. That is the `alongFrom`/`alongTo`
  # window, measured in metres of |distance along strike| from the lode's
  # `through` point, and symmetric — a body is lean at both ends, so both
  # ends of this strike are fringe.
  #
  # ⭐ Which is why iron is a walk and not a shaft. The fringe outcrops
  # at the surface seventy-five metres out along the strike, ABOVE the
  # water table, OUTSIDE the old men's depletion box — so the whole iron
  # rung is reachable without the co-op's adit, without a pump, and
  # without anybody's permission. *Iron is the metal you can get on your
  # own* is a fact about this geology, not a rule somebody wrote.
  #
  # ⚠ The chalcopyrite and siderite bands are authored and Stage A CANNOT
  # REACH THEM: a sulfide wants roasting before reduction, a carbonate
  # sits under the water table, and the ground both are in wants a pump.
  # They are here so the survey's honest inference — *"it keeps going
  # down, if it holds"* — has a real referent rather than a promise in
  # the prose. The grades are higher, which is exactly the pull a later
  # stage needs.
  zones:
    # The heart: copper, oxide over sulfide, out to 75 m along strike.
    - { toZ: -45, mineral: /stuff/idea/material/mineral/malachite, meanGrade: 0.07, spread: 0.05, alongTo: 75 }
    - { toZ: -400, mineral: /stuff/idea/material/mineral/chalcopyrite, meanGrade: 0.11, spread: 0.04, alongTo: 75 }
    # The fringe: iron, gossan over carbonate, from 75 m out to the ends.
    # ⭐ Richer than the copper it grades out of — goethite is 0.6285
    # iron by formula against malachite's 0.5748 copper, and the cap is
    # what the rain left behind after it took the rock away.
    - { toZ: -45, mineral: /stuff/idea/material/mineral/goethite, meanGrade: 0.12, spread: 0.05, alongFrom: 75 }
    - { toZ: -400, mineral: /stuff/idea/material/mineral/siderite, meanGrade: 0.10, spread: 0.04, alongFrom: 75 }
  # ⭐ The old men's workings. Everything within reach of the adit has
  # been picked over once already — the lean SCALES the computed grade
  # rather than replacing it, so the ground under the yard is still the
  # same ground, just poorer than it was. It is also why a prospector who
  # walks further does better, which is the whole economics of a played-
  # out cap in one authored box.
  depletion:
    - from: [-60, -60, -30]
      to: [60, 60, 0]
      scale: 0.55
      reason: "the old men had this ground first, and they were not stupid"
  # ⭐⭐⭐ **The gas in the measures, and the venue is making a claim about
  # its own geology by authoring it.**
  #
  # Firedamp is methane adsorbed in coal measures, and Ferrow is an IRON
  # mine — so this says *there is coal in this hill under the iron*,
  # which is both common in reality and this locality's own decision. ⚠ A
  # second mine authors none, and a quarry's ground answers `null`: the
  # gas is a property of the rock, not a hazard somebody placed.
  #
  # `belowZ: -20` is where the measures start, and the number is chosen
  # against the WORKINGS rather than in the abstract: the authored
  # timbered drift sits at −10 m, so the gas is exactly ONE level below
  # the deepest room anybody is handed. ⭐ That makes the lesson a
  # decision a player can reach in a session — sink one shaft and you are
  # in it — while keeping the adit and the drift safe, which is what
  # makes going down mean anything. A band at −30 would have been equally
  # honest geology and unreachable in practice, which is the same as not
  # shipping it.
  #
  # `strength: 0.14`
  # means dead air at depth fills to ~14 % firedamp — well above the 5 %
  # that burns, and ⭐ **well below the share that would stop a canary
  # singing**, which is the whole design: the bird is honest and the bird
  # is answering a different question.
  gas:
    material: /stuff/idea/material/gas/firedamp
    belowZ: -20
    strength: 0.14
  features:
    # ⚠ An authored PIN, and it is indistinguishable downstream from a
    # computed cell — the spine invariant. This one is the mouth of the
    # natural chamber (R6): breaking into it lands you in a zone with its
    # own geometry, because a cavern was not cut and a cubic grid
    # misrepresents it.
    pins:
      "-30,-10,-10":
        feature: hush-mouth
        mineral: /stuff/idea/material/mineral/malachite
        grade: 0.24
    # Seeded pockets: vugs, crystal-lined and worth stopping for. The
    # roll is `roll01(seed, cell)`, so the pocket was ALWAYS there and
    # nothing rolls to decide what your pick did.
    seeded:
      - { feature: vug, chance: 0.04, inLodeOnly: true }
      - { feature: seep, chance: 0.06 }
  # ⭐⭐⭐ **The fluid bodies under this hill, and this is the venue
  # making a second claim about its own geology.**
  #
  # A lode is a plane you cut; a fluid body is a trap you tap, and they
  # share no field. Each one here is a FOLD: a crest, an axis, two
  # half-extents and the vertical closure under the crest. The fluid leg
  # is DERIVED from that — it is the full closure directly over the crest
  # and nothing at all at the rim — which is why the structural survey is
  # worth paying for instead of decorative: bore at the rim of a charged
  # trap and you find a metre of it, bore at the crest and you find the
  # column.
  #
  # ⚠⚠ **`charge: true` here is a PIN, and it is deliberate.** The first
  # bore in a new country must not be a coin toss, or the trade teaches
  # nothing but variance on the way in. The dry structure arrives in
  # Stage C, pinned false, on ground that reads just as well — so the
  # lesson lands when the player has the instruments to be sure they read
  # it right, and cannot blame the survey.
  #
  # ⭐ The axis runs 041, the same as the lode's strike, and that is not
  # a coincidence anybody should have to take on faith: one episode of
  # folding made both. A hill with structures at right angles to its own
  # grain would be an authoring tell.
  fluids:
    # The salt leg. The crest is under the flat at (6,1) — sixty metres
    # east, ten north of the yard — and the trap's rim passes under the
    # spring at (3,5), which is exactly why there is a spring there: a
    # trap leaks at its edge, and what reaches daylight is what the
    # ground failed to keep.
    #
    # `headAtm0: 0` — ⭐ **it does not come up by itself**, which is the
    # ordinary and honest case. Brine at a hundred and ten metres has to
    # be lifted, and that is what the bailer is for and what the pump is
    # eventually for.
    - key: salt-leg
      fluid: /stuff/idea/material/bulk/salt-water
      trap:
        crest: [60, 10, -110]
        strike: 41
        alongExtent: 140
        acrossExtent: 50
        closureM: 40
      charge: true
      headAtm0: 0
      # Pinned rather than derived from the geometry: this is Stage A's
      # whole supply, and a well life measured in weeks of boiling is a
      # decision about pacing rather than about reservoir engineering.
      # ⚠ Recharge is ZERO. The leg is a boom with an end in it.
      capacityL: 240000
    # ⭐⭐⭐ The gas cap — and the venue is making the SAME claim it
    # already made with `gas:` above, from the other side.
    #
    # `gas:` says the measures under this hill give off firedamp into a
    # heading you cut. This says there is a closed structure holding a
    # cap of it that a bore can tap. Both are *there is coal in this hill
    # under the iron*, which is common in reality and this locality's own
    # decision — and the two are different FACTS about it: one is a
    # hazard in a working, the other is a reservoir with a wellhead on
    # it. ⚠ A second mine authors neither.
    #
    # ⭐ `headAtm0: 4` — **this one comes up by itself**, which is the
    # whole difference between Stage A and Stage B. Brine has to be
    # lifted a bucket at a time; a gas cap drives its own fluid to the
    # surface and you `fill` from the wellhead like a tap — until it
    # does not, and the gauge is the only thing that tells you.
    #
    # ⚠ And the capacity is SMALL. A gas cap is a cap: the pressure is
    # what makes it feel generous and the volume is what makes it end,
    # which is the decline curve the whole trade is about, arriving
    # inside one session instead of over a month.
    - key: gas-cap
      fluid: /stuff/idea/material/gas/firedamp
      trap:
        crest: [120, 60, -165]
        strike: 41
        alongExtent: 90
        acrossExtent: 40
        closureM: 20
      charge: true
      headAtm0: 4
      capacityL: 9000
