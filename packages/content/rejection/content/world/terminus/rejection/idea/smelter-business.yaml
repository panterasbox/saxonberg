# ⭐⭐ The smelter — and it is the piece that closes the loop **without
# minting a single credit.**
#
# It buys ore AND charcoal, and it buys them out of revenue from ingots.
# `ferrow-delving.md` §9 funded an off-take buyer through CB *lending* and
# flagged that it needed the deferred banking lending tier. **That
# dependency is gone**: the seam existed only because smelting was the v1
# abstraction boundary, and this build removed the boundary by building
# the trade.
#
# So conservation is satisfied without argument: **no new money is minted
# anywhere in this build.** The mine makes new MATTER; the CB remains the
# only mint; wear is the matter sink.
class: /platform/idea/Business
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  appointingAuthority:
    kind: entity
    path: /world/terminus/rejection/agent/smelterman
  positions:
    - key: smelterman
      noun: smelterman
      label: holding the furnace at heat
      wageRate: 6
    - key: buyer
      noun: buyer
      label: weighing ore at the shed
      wageRate: 5
    # ⭐⭐ The ASSAYER — and this seat cost the build almost nothing,
    # which is the finding.
    #
    # The plan expected to add the shed to a house's
    # `operatingLocations` and cast a new body into a small room. Neither
    # was needed: **this** business already operates the assay shed and
    # already rosters the buyer there — a broad woman with a jeweller's
    # glass on a cord, `geology: competent` in her dossier, who "weighs
    # everything twice and writes down the second figure". The person who
    # runs an assay for you was standing at the bench the whole time.
    #
    # ⚠ So what was missing was a POSITION, not a person and not a
    # place. A seat whose `operatingLocations` never named the bench's
    # room would have been a position that could never be on shift there
    # — closed and silent, and the staffed arm would have read as
    # unstaffed forever.
    - key: assayer
      noun: assayer
      label: running the muffle at the assay bench
      wageRate: 6
  rosterSlots:
    - positionKey: smelterman
      assignee: /world/terminus/rejection/agent/smelterman
      schedule:
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [0, 24] }
    - positionKey: buyer
      assignee: /world/terminus/rejection/agent/buyer
      schedule:
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [0, 24] }
    # The buyer holds both seats. She is one woman in one shed and the
    # two acts are the same afternoon's work — weigh the ore, run the
    # cupel, chalk the figure.
    - positionKey: assayer
      assignee: /world/terminus/rejection/agent/buyer
      schedule:
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [0, 24] }
  banksAt: goodkin
  operatingLocations:
    - /world/terminus/rejection/location/smelter
    - /world/terminus/rejection/location/assay-shed
