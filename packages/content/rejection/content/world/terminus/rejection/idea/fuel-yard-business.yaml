# ⭐ The fuel yard — works its OWN coppice and sells charcoal. It buys
# nothing, which is what makes it the one business in the chain with no
# upstream: the wood is a renewable crop on a seven-year rotation and the
# only input is labour.
#
# ⚠ Its stand is also the MINE's timber supply. Two consumers, one supply
# — the wood contest, and the reason this is a business rather than a prop.
class: /platform/idea/Business
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  appointingAuthority:
    kind: entity
    path: /world/terminus/rejection/agent/collier
  positions:
    - key: collier
      noun: collier
      label: watching the clamp
      wageRate: 5
  rosterSlots:
    - positionKey: collier
      assignee: /world/terminus/rejection/agent/collier
      schedule:
        # ⭐ Real hours (envelope S8). This authored `[0, 24]` — a house
        # staffed around the clock — which was never true of it and made
        # the night indistinguishable from the day. The `shifts` brain
        # parks off-shift cast in the venue's Offstage, so the street
        # genuinely empties.
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [6, 18] }
  banksAt: goodkin
  operatingLocations:
    - /world/terminus/rejection/location/fuel-yard
