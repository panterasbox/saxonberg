# U2 · The Timbered Drift — the tutorial face, on SAFE ground.
#
# ⭐ Everything a miner does is available here and none of it can hurt
# you: the seam is soft, the sets are sound, the air is good because the
# adit is two rooms away. `hew`, `shore` and `drive` are all learnable in
# a room where the consequences of getting them wrong are visible and
# survivable — which is what a tutorial face IS, historically and here.
class: /trade/mining/location/AuthoredWorking
data:
  shortDescription: timbered drift
  keywords: [drift, "timbered drift", timbered]
  register: definite
  oreRow: /world/terminus/rejection/thing/copper-ore
  longDescription: |
    A level way west, close-timbered the whole length — legs and caps set every four feet, the wood old and grey and sound. At the far end the face has been worked square and there is green in it, a hand's breadth of it running away into the rock at an angle.

    A cart stands under the face with its handles down. Sets of new timber are stacked along the wall where somebody left them ready.
  coords: { x: -1, y: -1, z: -1 }
  exits:
    east:
      destination: /world/terminus/rejection/ferrow/cage-bottom
    west:
      destination: /world/terminus/rejection/ferrow/winze-head
  props:
    - /world/terminus/rejection/thing/glowcap-fixture
    - /trade/mining/thing/timber-set
    # ⭐⭐⭐ **The safety lamp, at the lamp station.** The drift is the last
    # room before the deep headings, which is exactly where a lamp house
    # belongs — historically you drew your lamp on the way in and gave it
    # back on the way out.
    #
    # ⚠ It is the one remedy for the one hazard the bird cannot report.
    # Firedamp is breathable at the fractions that will kill you by
    # burning, so the canary sings right through it; the tell is a flame,
    # and the lamp that can show it to you safely is this one. Without
    # this prop the hazard would ship with no counter but *do not go in
    # there*, which is not a mechanic.
    #
    # ⭐ It ships UNLIT and there is one. It is not sold anywhere this
    # build; a lamp room with a rack of them is the mining trade's.
    - /trade/mining/thing/safety-lamp
  # ⭐ The archetype's `haulage` and `air` slots, BOUND — and both are
  # `presence` needs, so what satisfies them is simply a thing of that
  # kind standing here. The bird's silence is the only free reading of
  # the one hazard that can kill you; the pony is why ore moves on
  # something other than your back.
  cast:
    - /world/terminus/rejection/agent/hewer
    - /trade/mining/agent/canary
    - /trade/mining/agent/pit-pony
