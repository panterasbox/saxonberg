# ⭐⭐ The glazier's hut's west window — the GAME'S FIRST AUTHORED WINDOW,
# and the first that does something. It is a WAY between the hut and the
# sunlit hillside (boundary build): both rooms name it as `door:` on the
# exit that faces the other, so daylight comes through it into the hut,
# `look west` sees the hillside, and nobody climbs through. Glaze a
# coloured pane into it (`glaze pane in window`) and the light it lets in
# takes that colour — the W0 Colour-on-Light seam. Open, clear until
# glazed.
class: /platform/thing/Window
data:
  shortDescription: west window
  keywords: [window, "west window", light]
  register: definite
  longDescription: >-
    A plain window in the west wall, looking up the hillside. The
    light that comes through it is whatever the day is — until there is
    coloured glass in it.
  _materialPath: /stuff/idea/material/glass/glass
  mass: 3
  baseTransmissivity: 0.9
  open: true
