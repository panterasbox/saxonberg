# The provisioning counter — ⭐ where money LEAVES, and where the light
# dependency is taught before the descent rather than after it.
#
# It stocks itself to par on the reset sweep, so a mine that has been quiet
# for a week still has picks and timber in it when somebody arrives.
# Prices are SEEDED starter figures against the shipped anchors (stipend
# 20, wages 4–6 per game-hour): ⚠ pricing is PARKED for this build — no
# discovery, no market. Solvency tuning is a balance question against a
# running game, not a requirement of this one.
class: /trade/shopkeeping/thing/Stock
data:
  shortDescription: provisioning counter
  keywords: [counter, till, stores, goods, provisioning]
  register: definite
  longDescription: |
    A plank counter worn hollow in two places where hands go, a till with no lock on it, and a slate of prices rubbed out and rewritten more times than it has been read. Behind it: the tool wall, the timber stack, and a rank of stoppered jars with a soft green light in them.
  discipline: scrum
  attendDurationMs: 0
  staffingPolicy: self-service
  serverPositionKeys: [storekeeper]
  businessPath: /world/terminus/rejection/idea/provisioning-business
  stockLines:
    - { itemTemplatePath: /trade/mining/thing/pick, par: 3 }
    - { itemTemplatePath: /trade/mining/thing/pinch-bar, par: 3 }
    - { itemTemplatePath: /trade/mining/thing/shovel, par: 3 }
    - { itemTemplatePath: /trade/mining/thing/timber-set, par: 8 }
    - { itemTemplatePath: /trade/mining/thing/compass, par: 1 }
    - { itemTemplatePath: /world/terminus/rejection/thing/glowcap-jar, par: 6 }
    # ⭐ The sugaring kit, added by the taps build. The valley has no
    # supplier of its own, so the kit comes from town — the apiculture
    # lesson applied: a new trade's instruments go on the shelf people
    # already buy from, not on a bespoke one.
    - { itemTemplatePath: /trade/forestry/thing/auger, par: 2 }
    - { itemTemplatePath: /trade/forestry/thing/spile, par: 12 }
    - { itemTemplatePath: /stuff/thing/vessel/pail, par: 4 }
    # ⭐⭐ The drilling kit, added by the drilling build, and on the
    # SAME SHELF for the same reason the sugaring kit is: a new trade's
    # instruments go where people already buy, not on a bespoke counter.
    # ⚠ No derrick here — a ton and a half of timber frame is not a
    # thing you walk out of a shop with. The derrick is `make`'d from
    # timber at the site, and the timber is already on this slate.
    - { itemTemplatePath: /trade/drilling/thing/bailer, par: 2 }
    - { itemTemplatePath: /trade/drilling/thing/liner, par: 10 }
    # The pan and the hearth the brine ends up in. ⭐ Both are
    # QUARRYING's rows and neither needed a line of code: the brine
    # meets the pan by TAG, which is what makes salt one good with three
    # cost structures rather than three goods.
    - { itemTemplatePath: /trade/quarrying/thing/salt-pan, par: 2 }
  # ⚠ The field is `prices:` — a path→figure MAP, not an `offers:` list.
  # It was authored as a list first and every `buy` answered *"isn't for
  # sale"*: a `Stock` with stock lines and no prices holds the goods and
  # prices none of them, which is a shop with an empty slate. Found by
  # driving.
  #
  # Seeded starter figures against the shipped ladder (stipend 20; wages
  # 4–6 per game-hour). ⚠ Pricing is PARKED — no discovery, no market —
  # and solvency tuning is a balance question against a running game.
  prices:
    /trade/mining/thing/pick: 26
    /trade/mining/thing/pinch-bar: 14
    /trade/mining/thing/shovel: 12
    /trade/mining/thing/timber-set: 6
    /trade/mining/thing/compass: 60
    # ⭐ The number the whole light lesson rests on: a jar is CHEAP, and it
    # dies in a month. A small recurring cost rather than a gate — which
    # is what makes losing your light disabling rather than ruinous.
    /world/terminus/rejection/thing/glowcap-jar: 4
    # ⭐⭐ The spile is the cheapest thing on the slate and it is
    # CONSUMED by setting a tap — twelve of them is a season. That is
    # what makes over-tapping a decision with a price on it rather than
    # a free action, and it is the only recurring cost in the trade
    # besides the fuel.
    /trade/forestry/thing/auger: 18
    /trade/forestry/thing/spile: 1
    /stuff/thing/vessel/pail: 5
    # ⭐ The bailer is cheap and the LINER is the recurring cost of going
    # deep — ten of them is a hundred metres of wet ground, and that is
    # what makes stopping above the water table a real temptation rather
    # than a mistake nobody would make.
    /trade/drilling/thing/bailer: 9
    /trade/drilling/thing/liner: 3
    /trade/quarrying/thing/salt-pan: 16
