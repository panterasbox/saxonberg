# P5 · The Dry — recovery, and the social beat.
#
# The changing shack: benches, a stove, water, food. It is where reserve,
# thermal and metabolism all get their turn, and it is the room where two
# miners who have never spoken end up talking because there is nowhere
# else to sit while your clothes steam.
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: dry
  keywords: [dry, "the dry", shack, canteen]
  register: definite
  # Daylight, authored against THIS room's cell: lux = lumens / cellSize²,
  # and at Rejection's 10 m cells `dim` needs 500 lm, `lit` 2000, `bright`
  # 6000 — an interior with the door open and a lamp. No row here authored a value before the forestry build,
  # ⭐ No ambient of its own: this room is LIT BY SPILL from
  # the pithead yard, through a doorway that stands open. The light walk
  # already carries daylight one hop at full strength, so the room is
  # bright by day and DARK at night — which is the whole point, and it
  # costs no authored number at all.
  longDescription: |
    Long benches down both walls, hooks above them, and a stove in the middle that somebody keeps going. Clothes hang steaming over it in a rank. There is a water butt by the door with a dipper on a string, and a shelf of tin plates.

    It smells of wet wool, coal smoke and other people. After eight hours in the drift it is the best room in the world.
  coords: { x: -1, y: 1, z: 0 }
  exits:
    southeast:
      destination: /world/terminus/rejection/location/pithead-yard
