# F3 · The Fringe Claim — the independent's ground, and the first iron.
#
# ⭐⭐ **Where the body changes its mind.** Eighty-six metres out along
# the strike, past the edge of the old men's box, the stain stops being
# green and starts being rust — because the metals dropped out of one
# fluid at different distances from its source and this is where copper
# gave way to iron. The deposit's `alongFrom: 75` window is the fact;
# this room is standing in it.
#
# ⚠ **It is staked, and not by the co-op.** Block 2 in the register
# belongs to a one-man outfit who walked out here when nobody else
# thought it was worth the boots. A player who tries to stake it is told
# so, walks another forty metres, and stakes ground of their own — which
# is the claims layer teaching first-come by being first-come rather than
# by explaining itself.
#
# ⭐ A SURFACE working: it affords `hew` and declines `drive` (*"cut and
# finished"*), which is right — you do not drive a heading in the open
# air. And it is three exits from the yard, so the air reads good for
# free: there is no roof on it.
class: /trade/mining/location/AuthoredWorking
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: staked ground on the fringe
  keywords: [claim, "fringe claim", ground, staked, fringe, outcrop]
  register: definite
  # Daylight, authored against THIS room's cell: lux = lumens / cellSize²,
  # and at Rejection's 10 m cells `dim` needs 500 lm, `lit` 2000, `bright`
  # 6000 — open fell. No row here authored a value before the forestry build,
  # and every object read "something".
  ambientIntensity: 8000
  ambientColorTemperature: 5800
  oreRow: /world/terminus/rejection/thing/iron-ore
  longDescription: |
    The band of stain has changed colour. It came up the hill green and it goes on from here the colour of a wet roof in autumn — rust-brown, standing a little proud of the slate around it because whatever it is has weathered harder than the country rock.

    Four posts stand at the corners of a block of it, squared up with a line, each with a board nailed to it and a number burned in. Somebody has been working the middle of the block with a pick, neatly, a small pile of broken rock beside the cut and a coat folded on top of it.
  coords: { x: 5, y: 7, z: 0 }
  exits:
    southwest:
      destination: /world/terminus/rejection/location/old-workings
      edgeMinutes: 4
    northeast:
      destination: /world/terminus/rejection/location/far-fringe
      edgeMinutes: 5
  cast:
    - /world/terminus/rejection/agent/independent
