# P1 · The Pithead Yard — the hub, and where you arrive.
#
# ⭐ **The road landed.** This shipped with arrival by TPA and no exit
# crossing the locality boundary in either direction — the comment here
# said *"the walked valley road can land later"* — and the logistics
# build is later: `north` goes out to the yard gate, and from there over
# the pass to the valley crossroads and down the Delight to Terminus, on
# foot, with no wizard flag anywhere.
#
# ⭐ The OUTCROP is here, and it is the reason the surface zone carries
# the deposit: `measure strike` works standing in the yard, on the green
# stain running out from under the spoil.
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  _biomePath: /stuff/idea/biome/outdoor/baseline
  shortDescription: pithead yard
  keywords: [yard, pithead]
  register: definite
  # Daylight, authored against THIS room's cell: lux = lumens / cellSize²,
  # and at Rejection's 10 m cells `dim` needs 500 lm, `lit` 2000, `bright`
  # 6000 — open hill under the sun. No row here authored a value before the forestry build,
  # ⭐ Sky-lit by DERIVATION now: the row names an outdoor
  # biome and the light follows the sun, the moon and the cloud.
  # A pithead yard is OUTDOORS. It authored 8000 lumens and no biome at all, so the realm did not know — and gave it no weather either.
  longDescription: |
    A flat of trodden mud and grey spoil, walled on three sides by the slope it was cut out of. Ore carts stand where they were left. A cable drum, a winch house with its door off, and a rail line that runs twenty yards and stops.

    On the low side, where the spoil has been shifted, the country rock comes up green — a band of it, brighter than anything else here, running away up the hillside and under the buildings.
  coords: { x: 0, y: 0, z: 0 }
  exits:
    north:
      destination: /world/terminus/rejection/location/claims-office
    east:
      destination: /world/terminus/rejection/location/assay-shed
    west:
      destination: /world/terminus/rejection/location/provisioning
    northwest:
      destination: /world/terminus/rejection/location/the-dry
    south:
      destination: /world/terminus/rejection/location/adit
    northeast:
      destination: /world/terminus/rejection/location/fuel-yard
    # The goods entrance: the yard's road-side door onto the Kestrel road.
    # ⚠ `southwest` rather than `north`: the yard already opens north onto
    # the claims office, and a second exit on the same direction is a
    # duplicate key the installer cannot parse.
    southwest:
      destination: /world/terminus/rejection/kestrel-road/yard-gate
      media: [ground]
      edgeMinutes: 3
  props:
    # ⭐ The tram that makes the rails a lane you can travel. The prose
    # above has always said "a rail line that runs twenty yards and
    # stops"; this is the box that runs on it, and `/stuff/idea/Lane/
    # ferrow-tram` is the twenty yards.
    - /system/transport/thing/ore-tram
    # ⭐ The board. The mine could not hire anybody until it had one, and
    # the guard contract the consequence build added is exactly the job a
    # mine has and a station does not.
    - /world/terminus/rejection/thing/pithead-board
  details:
    outcrop:
      keywords: [outcrop, stain, green, band, rock, malachite]
      description: |
        Green as verdigris on a church roof, in a band about a pace wide where the spoil has been cleared off it. It runs uphill and out of sight. Somebody has been at one end of it with a hammer.
