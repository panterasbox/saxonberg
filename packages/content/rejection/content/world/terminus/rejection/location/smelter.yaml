# The smelter — ⭐ where the chain becomes metal, and the last room in it.
#
# The furnace, the tongs, and the heap of slag that is the honest record
# of how much of a rock is not ore. A bar comes out of here, goes to a
# smith, comes back as a pick head, and gets swung at the ground it came
# out of — with a real sink at the end, because picks wear out.
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: smelter
  keywords: [smelter, furnace, works]
  register: definite
  # Daylight, authored against THIS room's cell: lux = lumens / cellSize²,
  # and at Rejection's 10 m cells `dim` needs 500 lm, `lit` 2000, `bright`
  # 6000 — open hill under the sun. No row here authored a value before the forestry build,
  # ⭐ No ambient of its own: this room is LIT BY SPILL from
  # the fuel yard, through a doorway that stands open. The light walk
  # already carries daylight one hop at full strength, so the room is
  # bright by day and DARK at night — which is the whole point, and it
  # costs no authored number at all.
  longDescription: |
    A stone shaft taller than a man under an open-sided roof, a bellows lashed to its flank and a bed of sand raked flat in front of it for the pour. The slag heap outside the door is bigger than the building and glitters black-green where it has broken.

    Everything here is either very hot or covered in something that used to be.
  coords: { x: 2, y: 1, z: 0 }
  exits:
    west:
      destination: /world/terminus/rejection/location/fuel-yard
  props:
    - /trade/smelting/thing/furnace
    - /trade/mining/thing/tongs
    - /trade/smelting/thing/slag
    # ⭐ The bloomery's own hammer. A bloom comes out of that shaft as a
    # spongy, slag-shot mass and is NOT a bar until it has been beaten
    # into one — the string-hearth stood beside the furnace for exactly
    # that reason, and a bloomery without a consolidation station is a
    # process with no second half. ⚠ Until this row landed, the only
    # anvil in the world was in the Hearthworks smithy, on an island
    # with no inbound exit and no travel node: mining's own twelve
    # `[striking, anvil]` tool recipes had never been makeable anywhere
    # a miner could reach. Hearthworks stays the teaching smithy; this
    # is the works' own.
    - /trade/smithing/thing/anvil
    - /stuff/thing/gear/smiths-hammer
  cast:
    - /world/terminus/rejection/agent/smelterman
