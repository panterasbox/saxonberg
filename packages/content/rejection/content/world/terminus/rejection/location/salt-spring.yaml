# ⭐ The Spring Hollow — the free evidence, and the first thing a
# prospector in this country sees.
#
# ⚠⚠ The ground under this room is the trap's RIM. A bore here reaches
# the salt leg and finds about a metre of it, because the beds have
# almost nothing left under them this far out from the crest. That is
# not a trap laid for the player: `measure structure` says so, from this
# very room, before anybody has spent a penny — *you are out on the edge
# of it* — and names the bearing and distance to the top.
#
# The whole lesson of the trade is in the geometry of these two rooms:
# the place the ground tells you about is not the place to dig.
class: /platform/location/SingletonCartesianLocation
data:
  _biomePath: /stuff/idea/biome/outdoor/baseline
  shortDescription: spring hollow
  keywords: [hollow, spring, "spring hollow", salt]
  register: definite
  longDescription: |
    A fold in the hill where the slope flattens before it climbs again, and the grass in it is the wrong colour — pale, then grey, then gone altogether around a pool the size of a hat.

    Sheep have been here. So has somebody with a cart: there are two ruts coming in from the west and none going out, which means whatever they came for they carried.

    East and down, the hill opens into a long bare flat with nothing growing on it at all.
  coords: { x: 3, y: 5, z: 0 }
  props:
    - /world/terminus/rejection/thing/salt-spring
  exits:
    west:
      destination: /world/terminus/rejection/location/hillside
      edgeMinutes: 4
    southeast:
      destination: /world/terminus/rejection/location/salt-flat
      edgeMinutes: 3
