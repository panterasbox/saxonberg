# The glazier's hut — the COLD shop, in town by the customer (the cold
# bench sites where the hot shop cannot: no fire, no fuel, just the two
# cutting tools and a bench). Blown blanks come down from the glasshouse
# to be scored, snapped, grozed and glazed into finished ware here.
#
# ⭐ It authors NO ambient light of its own: it is lit through its west
# window off the sunlit hillside and through its doorway off the fuel yard.
# That is the whole reason it can show the stained-glass effect — the
# light in here IS the light that came through the glass.
#
# ⭐ Boundary build (2026-11): the hut moved to (1,2) so its doorway (south,
# to the fuel yard) and its window (west, onto the hillside) each join
# adjacent cells through a shared face. The window is a WAY with a pane in
# it — `look west` sees the hillside, `go west` is refused. The old south
# window had nothing to be a way onto (the doorway took south), and glass
# set in a wall with no place behind it is construction, not a boundary;
# it was retired rather than kept as a pane no system reads.
# ⭐ Persistent (cleanliness D31): a kept place — its floor, its fire,
# what is curing on its shelves — outlives a restart.
class: /platform/location/PersistentHall
data:
  shortDescription: glazier's hut
  keywords: [hut, glazier, "glazier's hut", bench, shop]
  register: definite
  _biomePath: /stuff/idea/biome/indoor/baseline
  coords: { x: 1, y: 2, z: 0 }
  longDescription: |
    A low timber hut with a workbench down one side, a doorway onto the fuel yard and a window in the west wall looking up the hillside. A scribing wheel and a pair of grozing pliers lie on the bench, and offcuts of glass catch the light in the corners.

    Whatever colour the day is outside, it is a different colour in here, through the glass.
  props:
    - /trade/glass/thing/scribing-wheel
    - /trade/glass/thing/grozing-pliers
  exits:
    south:
      destination: /world/terminus/rejection/location/fuel-yard
      edgeMinutes: 1
    # The west window — a way you look through and cannot take. The same
    # window row is the hillside's `east`: one pane, two sides.
    west:
      destination: /world/terminus/rejection/location/hillside
      door: /world/terminus/rejection/thing/hut-window-west
