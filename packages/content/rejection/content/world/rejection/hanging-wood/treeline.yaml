# The treeline — the ride's end above the hillside, where the hill goes
# into trees. ⚠ NOT a Wood: the edge, scrub and the view. Nothing stands
# here worth the axe, and saying so with a class is honest — a player
# standing here has no `fell`, and that is the first thing the wood
# teaches about itself.
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: treeline above the yard
  keywords: [treeline, edge, scrub, trees, wood, "hanging wood"]
  register: definite
  _biomePath: /stuff/idea/biome/outdoor/woodland
  # Lit — the edge of the canopy, half sky.
  ambientIntensity: 5000
  ambientColorTemperature: 5800
  longDescription: |
    The tussock gives out and the hill goes up into trees — hazel and thorn first, in a scrub you could push through anywhere, and behind it the real wood, oak and ash, standing up the slope in the shade of itself. A ride goes in, wide enough for a sledge, worn to bare earth by everything that has come down it.

    Behind and below, the yard: a turfed dome the height of a man with thin blue smoke coming off it, and the whole flat of Rejection beyond.
  coords: { x: 0, y: 0, z: 0 }
  exits:
    south:
      destination: /world/rejection/location/hillside
      edgeMinutes: 4
    north:
      destination: /world/rejection/hanging-wood/ride
      edgeMinutes: 2
  details:
    smoke:
      keywords: [smoke, yard, clamp, below, dome]
      description: |
        Thin and blue and steady, out of a dozen holes in the turf. Somebody is awake down there.
    scrub:
      keywords: [scrub, hazel, thorn, edge]
      description: |
        Hazel and blackthorn, all of an age, the edge of a wood that was cut back once and has been coming back since.
