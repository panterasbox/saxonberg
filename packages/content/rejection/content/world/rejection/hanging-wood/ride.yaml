# The ride — the main ride under the canopy, edged with standards. A
# STAND (`/trade/forestry/location/Wood`): the room is ground, the soil
# is its own, and what stands on it is the `mix:` below until the first
# capture, and the record ever after.
#
# ⚠ The prose is authored and INVARIANT and never states a number the
# stand holds — the stand's own reading is appended to it by `look`.
# When this clearing is felled to nothing the paragraph below is
# byte-for-byte what it was; only the appended line changes. An
# authored wood is always a wood.
#
# ⚠ `mix:` is inert after the first capture (the record wins) — tune it
# on a live world and nothing changes until the DB is dropped, exactly
# as a `props:` edit never reaches a booted world.
class: /trade/forestry/location/Wood
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: main ride
  keywords: [ride, wood, "hanging wood", path, canopy]
  register: definite
  woodName: the Hanging Wood
  areaM2: 100
  _biomePath: /stuff/idea/biome/outdoor/woodland
  # Dim — under the canopy. 1500 lm over 100 m² is 15 lux.
  ambientIntensity: 1500
  ambientColorTemperature: 5600
  longDescription: |
    The ride runs up the slope under the trees, bare earth in the middle and leaf-litter to either side, the canopy closed overhead so that the light comes down green and in pieces. Standards stand along both edges of it, oak and ash, big enough that two men could not link hands round the biggest, and between them the hazel comes up in the gaps.

    It is quiet in the way a wood is quiet, which is to say full of small sounds.
  coords: { x: 0, y: 1, z: 0 }
  mix:
    - speciesPath: /stuff/idea/species/plantae/tracheophyta/magnoliopsida/fagales/fagaceae/quercus/robur
      name: oak
      woodMaterialPath: /stuff/idea/material/wood/oak
      seedPath: /trade/forestry/thing/seed/acorn
      standing: 8
      capacity: 10
      incrementPerYear: 1
    - speciesPath: /stuff/idea/species/plantae/tracheophyta/magnoliopsida/lamiales/oleaceae/fraxinus/excelsior
      name: ash
      woodMaterialPath: /stuff/idea/material/wood/ash
      seedPath: /trade/forestry/thing/seed/ash-key
      standing: 4
      capacity: 6
      incrementPerYear: 1
  exits:
    south:
      destination: /world/rejection/hanging-wood/treeline
      edgeMinutes: 2
    north:
      destination: /world/rejection/hanging-wood/oak-clearing
      edgeMinutes: 3
    west:
      destination: /world/rejection/hanging-wood/hazel-cant
      edgeMinutes: 2
  details:
    litter:
      keywords: [litter, "leaf-litter", leaves, ground, earth]
      description: |
        Last year's leaves and the year's before, gone to a brown mat that gives underfoot, and the bare ride worn through it down the middle.
    birdsong:
      keywords: [birdsong, birds, sounds, quiet]
      description: |
        High up and everywhere, and nothing you can see.
    canopy:
      keywords: [canopy, overhead, light, green]
      description: |
        Closed, mostly. The light that gets through comes down green and moves.
