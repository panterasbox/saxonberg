# The provisioning counter — ⭐ where money LEAVES, and where the light
# dependency is taught before the descent rather than after it.
#
# It stocks itself to par on the reset sweep, so a mine that has been quiet
# for a week still has picks and timber in it when somebody arrives.
# Prices are SEEDED starter figures against the shipped anchors (stipend
# 20, wages 4–6 per game-hour): ⚠ pricing is PARKED for this build — no
# discovery, no market. Solvency tuning is a balance question against a
# running game, not a requirement of this one.
class: /platform/thing/Stock
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: the provisioning counter
  primaryKeyword: counter
  keywords: [counter, till, stores, goods]
  longDescription: |
    A plank counter worn hollow in two places where hands go, a till with no lock on it, and a slate of prices rubbed out and rewritten more times than it has been read. Behind it: the tool wall, the timber stack, and a rank of stoppered jars with a soft green light in them.
  discipline: scrum
  attendDurationMs: 0
  staffingPolicy: self-service
  serverPositionKeys: [storekeeper]
  businessPath: /world/rejection/idea/provisioning-business
  stockLines:
    - { itemTemplatePath: /trade/mining/thing/pick, par: 3 }
    - { itemTemplatePath: /trade/mining/thing/pinch-bar, par: 3 }
    - { itemTemplatePath: /trade/mining/thing/shovel, par: 3 }
    - { itemTemplatePath: /trade/mining/thing/timber-set, par: 8 }
    - { itemTemplatePath: /trade/mining/thing/compass, par: 1 }
    - { itemTemplatePath: /world/rejection/thing/glowcap-jar, par: 6 }
  offers:
    - { itemTemplatePath: /trade/mining/thing/pick, price: 26 }
    - { itemTemplatePath: /trade/mining/thing/pinch-bar, price: 14 }
    - { itemTemplatePath: /trade/mining/thing/shovel, price: 12 }
    - { itemTemplatePath: /trade/mining/thing/timber-set, price: 6 }
    - { itemTemplatePath: /trade/mining/thing/compass, price: 60 }
    # ⭐ The number the whole light lesson rests on: a jar is cheap, and
    # it dies in a month. That is a small recurring cost rather than a
    # gate, which is what makes losing your light disabling rather than
    # ruinous.
    - { itemTemplatePath: /world/rejection/thing/glowcap-jar, price: 4 }
