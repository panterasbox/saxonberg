# The collier — the fuel yard's one hand, and the person who has not had a
# full night's sleep in a decade.
class: /platform/agent/Cast
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sensitivus
  lifecycleState: alive
  primaryKeyword: collier
  keywords: [collier, burner]
  shortDescription: the collier
  longDescription: >-
    Black to the elbow and grey in the face, with a long iron bar she uses
    to stop and open vents and which she is never more than an arm's
    length from. She listens to the clamp more than she looks at it.
  # ── the dossier ─────────────────────────────────────────────────
  # Evidence, never values: each entry below expands into the same rows a
  # lived history would have written, marked `claim`. Seeded once at
  # postRegister and skipped if any claim already exists, so a reclone or
  # a reboot cannot mint a second history.
  # ⚠ A best-guess pass, explicitly provisional — the considered version
  # is a content pass of its own before go-live.
  archetype: collier
  prologue:
    # From the row's own header — not invented for the dossier.
    - "Has not had a full night's sleep in a decade; the clamp does not keep hours."
  competence:
    - { discipline: colliery, asserting: expert }
  dispositions:
    - { disposition: patience, valence: 70 }
    - { disposition: diligence, valence: 75 }
  behaviors:
    - brain: /lib/behavior/idles
      trigger: cadence:38s
      config:
        pool:
          - { kind: free, value: "puts an ear to the turf, moves three feet along, and does it again." }
          - { kind: free, value: "stops a vent with a sod, then thinks better of it and opens it a finger." }
          - { kind: free, value: "says, \"Too much air and you get ash. Too little and you get firewood. There is no third mistake.\"" }
