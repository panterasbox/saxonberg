# The storekeeper at Provisioning — where money leaves, and where the
# light dependency gets taught out loud.
class: /platform/agent/Cast
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sensitivus
  lifecycleState: alive
  primaryKeyword: storekeeper
  keywords: [storekeeper, keeper, shopkeeper]
  shortDescription: the storekeeper
  longDescription: >-
    A small, cheerful, entirely unsentimental person who has sold the same
    six things to the same kind of people for twenty years and has never
    once been surprised.
  # ── the dossier ─────────────────────────────────────────────────
  # Evidence, never values: each entry below expands into the same rows a
  # lived history would have written, marked `claim`. Seeded once at
  # postRegister and skipped if any claim already exists, so a reclone or
  # a reboot cannot mint a second history.
  # ⚠ A best-guess pass, explicitly provisional — the considered version
  # is a content pass of its own before go-live.
  archetype: storekeeper
  prologue:
    - "Sold the same six things to the same kind of people for twenty years."
  competence:
    - { discipline: retail-sales, asserting: competent }
    - { discipline: business-administration, asserting: novice }
  dispositions:
    - { disposition: sociability, valence: 50 }
    - { disposition: compassion, valence: -40 }
    - { disposition: composure, valence: 70 }
  behaviors:
    - brain: /lib/behavior/idles
      trigger: cadence:35s
      config:
        pool:
          - { kind: free, value: "turns a jar of glowcap so the good side faces out." }
          - { kind: free, value: "asks, without looking up, \"Got a light on you?\"" }
          - { kind: free, value: "re-hangs a pick on the wall by its eye." }
