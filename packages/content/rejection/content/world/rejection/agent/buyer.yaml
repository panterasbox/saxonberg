# The ore buyer at the assay shed — the smelter's man, and ⭐ where money
# ENTERS the venue. He buys out of the smelter's ingot revenue, which is
# ordinary circulation: there is no endowment and no lending tier behind
# him, because this build removed the need for one by building the trade.
class: /platform/agent/Cast
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sensitivus
  lifecycleState: alive
  primaryKeyword: buyer
  keywords: [buyer, assayer]
  shortDescription: the ore buyer
  longDescription: >-
    A broad woman in a leather apron with a jeweller's glass on a cord and
    green under her nails that will not come off. She weighs everything
    twice and writes down the second figure.
  # ── the dossier ─────────────────────────────────────────────────
  # Evidence, never values: each entry below expands into the same rows a
  # lived history would have written, marked `claim`. Seeded once at
  # postRegister and skipped if any claim already exists, so a reclone or
  # a reboot cannot mint a second history.
  # ⚠ A best-guess pass, explicitly provisional — the considered version
  # is a content pass of its own before go-live.
  archetype: ore-buyer
  competence:
    - { discipline: appraisal, asserting: proficient }
    - { discipline: retail-sales, asserting: competent }
    - { discipline: geology, asserting: competent }
  dispositions:
    - { disposition: diligence, valence: 70 }
    - { disposition: trust, valence: -40 }
  behaviors:
    - brain: /lib/behavior/idles
      trigger: cadence:45s
      config:
        pool:
          - { kind: free, value: "tips a sample bin and lets the light run across the break." }
          - { kind: free, value: "chalks a figure on a slate, considers it, and does not change it." }
          - { kind: free, value: "says, \"The scale does not argue and neither do I.\"" }
