# F2 · The Old Workings — the played-out ground, and the lesson in it.
#
# ⭐⭐ **The depletion box, standing up as a place.** Everything within
# reach of the adit was picked over by men who were not stupid, and this
# is what that looks like on the surface: scrapes, spoil, and a stain
# that is still green and still not worth stooping for. The deposit's
# `scale: 0.55` is the number; this room is the number's face.
#
# ⚠ Its lesson is a NEGATIVE one and it is meant to be. A prospector who
# stops here and works it has learned nothing; a prospector who reads the
# thinness, keeps walking and finds the colour change at seventy-five
# metres has learned the entire economics of a worked cap.
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: old workings on the outcrop
  keywords: [workings, "old workings", scrapes, spoil, diggings]
  register: definite
  # Daylight, authored against THIS room's cell: lux = lumens / cellSize²,
  # and at Rejection's 10 m cells `dim` needs 500 lm, `lit` 2000, `bright`
  # 6000 — open hill under the sun. No row here authored a value before the forestry build,
  # and every object read "something".
  ambientIntensity: 8000
  ambientColorTemperature: 5800
  longDescription: |
    A quarter-acre of hillside that has been turned over and left. Shallow scrapes follow the band of stain, each one a few feet deep and none of them going anywhere, with the spoil thrown out downhill and grassed over. Somebody built a wall out of the bigger pieces and then stopped building it.

    The green is still in the rock. There is just not very much of it, and there never was after the first pass.
  coords: { x: 2, y: 4, z: 0 }
  exits:
    southwest:
      destination: /world/rejection/location/hillside
      edgeMinutes: 3
    northeast:
      destination: /world/rejection/location/fringe-claim
      edgeMinutes: 4
