# A spear — ⭐ a smith's forged head on a woodworker's shaft, WEDGED: the
# socket driven down the taper until it bites. Run by `fit spear`.
#
# ⭐⭐ It was one bar at the anvil (`forge spear`) until the assembly
# build, which made the head the smith's part (`forge spear-head`) and
# the spear what you fit it to. The whole was never an anvil product —
# a spear is a stick with a point on it, and the stick is most of it.
# Its head is still the best weapon per pound of iron anybody ever made.
