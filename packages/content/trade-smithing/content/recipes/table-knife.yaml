# The table knife — the smithing ladder's cutlery rung, and a near-copy of
# `belt-knife` on purpose: same one ferrous item, same anvil and striking
# tools, a gentler heat and an easier grade because serviceware is not a
# blade. ⭐ It exists so the demand a dinner table creates has a maker: one
# table wakes three trades, and this is the smith's share of it.
recipeId: table-knife
name: Table Knife
keywords:
- table-knife
- cutlery
# ⭐⭐ The stock slot asks for `forgeable`, and that one tag is the whole
# rule: **an anvil recipe takes stock an anvil can work.** `ferrous`
# would admit a pig of cast iron, which shatters under a hammer;
# `metal` would admit a pig AND a bloom, which is a quarter glass.
# Hot iron, steel and copper are what an anvil actually works, and they
# are what carries the tag.
inputSlots:
- slot: stock
  category: forgeable
  minGrade: fair
  kind: item
  count: 1
toolCapabilities:
- striking
- anvil
outputTemplate: /stuff/thing/cutlery/table-knife
outputMaterial: ''
outputApplication: tangible
requiresHeatK: 1300
difficulty: easy
discipline: smithing
