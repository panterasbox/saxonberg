# ⭐ Raised from its parts (repair D17): a sword is a blade, a guard, a
# grip and a pommel, the tang peened over the pommel. The forging is the
# blade's own recipe now (`sword-blade`, the old signature); this is the
# hilting — `fit sword` with the four parts in reach, cold (the peen is
# a hammer's work, gated by the joint), like every fitted arm.
recipeId: sword
name: Arming Sword
keywords: [sword, arming-sword]
inputSlots:
  # ⭐ A blade taken out of an old hilt comes back a band worse in an
  # unpractised hand — and must still be re-hiltable (the heirloom).
  - { slot: blade, category: metal, minGrade: poor, kind: item, count: 1 }
  - { slot: guard, category: metal, minGrade: poor, kind: item, count: 1 }
  - { slot: grip, category: wood, minGrade: poor, kind: item, count: 1 }
  - { slot: pommel, category: metal, minGrade: poor, kind: item, count: 1 }
toolCapabilities: []
outputTemplate: /stuff/thing/arms/sword
outputMaterial: ''
outputApplication: tangible
difficulty: standard
discipline: smithing
