# A faced shield — ⭐ three boards edge to edge, a hide face GLUED over
# them, and an iron boss RIVETED through the middle. Run by `fit shield`.
# The smith makes the boss and the rivets; the boards are a sawyer's and
# the face a tanner's. It was three bars at the anvil until the assembly
# build, which made the boards a slot at last: a shield is mostly wood,
# and the metal is the part a smith makes.
#
# The face is first so it is what the finished shield is made of — the
# outer surface is what an edge, a flame or a splash of lye meets first.
# The `hide-face` slot is the bill's FACING part (not required by
# `lint:bills`) and it is here because a bare-boarded shield splits.
recipeId: shield
name: Faced Shield
keywords: [shield]
inputSlots:
  - { slot: hide-face, category: leather, minGrade: poor, kind: item, count: 1 }
  - { slot: shield-board, category: wood, minGrade: poor, kind: item, count: 3 }
  - { slot: boss, category: metal, minGrade: poor, kind: item, count: 1 }
  - { slot: rivet, category: metal, minGrade: poor, kind: item, count: 4 }
toolCapabilities: [striking]
outputTemplate: /stuff/thing/arms/shield
outputMaterial: ''
outputApplication: tangible
difficulty: standard
discipline: smithing
