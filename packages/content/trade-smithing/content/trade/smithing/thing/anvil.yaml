# The smithy anvil — the `anvil` capability fixture: too heavy to walk
# off with (a fixture by encumbrance, not by flag — 60 kg sits past a
# normal biped's strain ceiling). The recipe gate is emergent
# reachability: hammer + anvil + heat, wherever they are. The `anvil`
# capability entry alone confers the smithing verb surface (the
# capability table — a tool variant is pure seed data).
class: /platform/thing/ToolItem
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: the smithy anvil
  primaryKeyword: anvil
  keywords: [anvil, stump]
  longDescription: |
    A smithy anvil on a scarred oak stump, its face bright where ten thousand blows have polished it.
  capabilities: [anvil]
  _materialPath: /stuff/idea/material/element/iron
  mass: 60
