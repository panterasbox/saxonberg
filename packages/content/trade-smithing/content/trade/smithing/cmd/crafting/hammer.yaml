verbs: [hammer]
controller: /trade/smithing/idea/cmd/crafting/HammerController
description: "Hammer a heated workpiece at the anvil (the forming step)"
help: |
  Do the forming work — `hammer ingot` (or bare `hammer`). Needs a
  striking hammer and an anvil in reach, and a workpiece that has taken
  some heat. Finish with `quench`. Takes a moment and rings the yard.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  # ⚠⚠ Was `DurableMixin`, and NOTHING you can hammer composes it —
  # `Ingot`, `Bloom` and `Casting` are all
  # `AlloyedMixin(…MeltableMixin(ThermalMixin(Thing)))` with no wear
  # axis, because raw stock does not wear out; a made thing does. So
  # every explicit form was refused with *"{} doesn't wear out"*,
  # including `hammer ingot` — the example three lines up in this file's
  # own help. Only bare `hammer` worked, because that route goes through
  # `findBuildVessel` instead of this gate. Found by driving it in a
  # browser.
  #
  # ⭐ `AlloyedMixin` is the honest gate: what you hammer is METAL STOCK,
  # and that is exactly the set the mixin marks. It also lets a pig of
  # cast iron REACH the controller, which is the only way a player ever
  # hears why cast iron cannot be forged.
  - name: target
    type: object
    required: false
    scope: "reachable"
    # ⭐ Bare `hammer` works the piece you are at — DECLARED, so the binder
    # resolves it instead of the controller walking for it
    # (`lint:instrument-args`).
    default: "reachable:[mixin.ManualBuildMixin]"
    # (⚠ Both branches found the `DurableMixin` gate the same week: one
    # by driving it in a browser, one by declaring this default — the
    # walk it replaces was the only reason the verb ever ran.)
    requires: AlloyedMixin
  # ⭐ WHICH STRIKER — DECLARED, not hunted for (`lint:instrument-args`).
  # Bare, the binder hands over every reachable thing offering
  # `striking` and the controller takes the best-rated (a requirement, never
  # a pacer).
  - name: striker
    type: objects
    required: false
    prepositions: [with, using]
    default: "reachable:[capability.striking]"
    scope: ["reachable"]
    requires: [ToolMixin]
  # ⭐ WHICH ANVIL — DECLARED, not hunted for (`lint:instrument-args`).
  # Bare, the binder hands over every reachable thing offering
  # `anvil` and the controller takes the best-rated (the anvil paces the
  # work).
  - name: anvil
    type: objects
    required: false
    prepositions: [on, at, against]
    default: "reachable:[capability.anvil]"
    scope: ["reachable"]
    requires: [ToolMixin]
