verbs: [quench]
controller: /trade/smithing/idea/cmd/crafting/QuenchController
description: "Quench the workpiece — the smithing finish"
help: |
  Finish the forging — `quench` (or `quench ingot`). The work is matched
  to a recipe and the formed, maker's-marked good comes out of the tub;
  an off-spec build still yields a worked lump. Your first faithful
  by-hand forging of a recipe teaches you it (then `forge <item>` works).
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: target
    type: object
    required: false
    scope: "reachable"
    # ⭐ Bare `quench` works the build you are at — DECLARED, so the binder
    # resolves it (held first) instead of the controller walking for it
    # (`lint:instrument-args`).
    default: "reachable:[mixin.ManualBuildMixin]"
    requires: ManualBuildMixin
  # ⭐ WHICH ANVIL — DECLARED, not hunted for (`lint:instrument-args`).
  # Bare, the binder hands over every reachable thing offering
  # `anvil` and the controller takes the best-rated (the anvil paces the
  # work).
  - name: anvil
    type: objects
    required: false
    prepositions: [on, at, against]
    default: "reachable:[capability.anvil]"
    scope: ["reachable"]
    requires: [ToolMixin]
