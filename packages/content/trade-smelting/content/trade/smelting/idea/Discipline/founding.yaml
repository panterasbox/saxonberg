# Founding — ⭐ the discipline of the CAST (ceramics D29): ramming a mould
# round a pattern, cutting a riser, reading the melt's colour and the sand's
# dryness before the pour, and pouring hot enough that a thin shape fills.
# Smelting gets the metal out of the rock; founding gives it a shape.
#
# Credited by the pour into a mould that names it (the shipped mould
# credit): a flask, the bell pit. Nothing is rolled — a misrun, a porous
# casting and a blown mould are the physics of a pour made too cool, without
# a riser, or into wet sand, and the competence is knowing that in advance.
#
# ISCED-F 2013 **0715 — mechanics and metal trades**, the smelter's own.
