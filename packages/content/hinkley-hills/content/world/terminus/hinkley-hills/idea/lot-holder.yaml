# Hinkley Hills' lot holder — the PROVISIONING half, reworked through
# its own designed swap seam (residences wave 5): a sold lot stands up
# a keyed multi-room HOUSE through the programme row, and the lane
# grows by the plat plan (D13) — segment 1 IS the authored lane;
# reaches beyond it are minted road-segment clones that stand as
# frontage sells; Hinkley Court branches off segment 2.
class: /residence/idea/PlatWarren
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  # The holding programme every sold lot is a keyed instance of (D16).
  programmePath: /world/terminus/hinkley-hills/idea/house-programme
  # The minted road reach ("stakes and grass") for plan nodes past the
  # authored lane.
  roadTemplate: /world/terminus/hinkley-hills/lots/road-segment
  # The subdivision's parcel extent — the durable slot set's parent;
  # read at boot to re-hang a gate for every lot that already sold.
  parentExtent: /world/terminus/hinkley-hills
  # D10: the operator's capacity dial over the shipped default.
  capacityKey: hinkley-hills.lotCap
  defaultCapacity: 40
  # D13: the branched plan — 4 frontages per reach; lane:1 is the made
  # road (authored); the court hangs off the lane's second reach. 9
  # lane reaches + the court = exactly the shipped 40-lot capacity.
  plan:
    shape: branched
    roads:
      - key: lane
        segments: 9
        frontagesPerSegment: 4
        authored:
          "1": /world/terminus/hinkley-hills/location/lane
      - key: hinkley-court
        segments: 1
        frontagesPerSegment: 4
        branchesFrom: { road: lane, segment: 2 }
