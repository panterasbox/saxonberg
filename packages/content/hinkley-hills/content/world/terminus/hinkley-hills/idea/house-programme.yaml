# The Hinkley house programme — the holding-as-a-warren-one-level-down
# (residences D16): ONE row, one keyed instance per sold lot
# (`scope = this row, key = the lot's parcel extent`). `owner-all` (D5): a
# Hinkley owner owes the whole shell.
#
# ⭐ Its PLAN is its own (harbors review 3; 2026-11-03 — no blueprint row):
# the house every sold lot gets, authored as an ordinary place under
# `house/` — the yard you come in by (with its garden west), the house door
# north of it (a keyed door, LOCKED to the lot's keyway: the key `title
# buy` hands the buyer), the hall, the kitchen east, the living room west,
# the bedroom north and the bathroom beyond it. Each lot's rooms are keyed
# instances of those REAL rows (D17), `(room row, <lot extent>/<leaf>)`;
# the plan's rows themselves are never served.
#
# `buildings`: the house's rooms lie under `house/indoors/`, the extent of
# its one building; the yard and the garden lie under no building's, so
# they are open ground.
#
# `footprintM2`: the ground the house and yard stand on that the garden
# does not — the lot's workable area less this is the garden's open ground
# (tracts build D27).
class: /system/residence/idea/HoldingWarren
data:
  upkeepTerm: owner-all
  extent: /world/terminus/hinkley-hills/house
  entrance: /world/terminus/hinkley-hills/house/yard
  footprintM2: 220
  buildings:
    - /world/terminus/hinkley-hills/idea/house-building
