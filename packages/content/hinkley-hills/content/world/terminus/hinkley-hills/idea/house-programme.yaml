# The Hinkley house programme — the holding-as-a-warren-one-level-down
# (residences D16): ONE row, one keyed instance per sold lot
# (`scope = this row, key = the lot's parcel extent`). The floorplan is
# the initial mint — every room a keyed instance of a REAL row (D17);
# the yard is the entry (reached by the ungated lane gate), and the
# house door north of it is LOCKED to the lot's keyway (the key `title
# buy` hands the buyer). `owner-all` (D5): a Hinkley owner owes the
# whole shell.
class: /system/residence/idea/HoldingWarren
data:
  upkeepTerm: owner-all
  floorplan:
    - leaf: yard
      room: /world/terminus/hinkley-hills/lots/yard
      entry: true
      # ⭐ Footprints (tracts build D27): the ground each room stands on.
      # What the lot leaves is the garden's open ground.
      footprintM2: 100
      exits:
        - { to: hall, direction: north, opposite: south, locked: true }
        - { to: garden, direction: west, opposite: east }
    - leaf: hall
      room: /world/terminus/hinkley-hills/lots/hall
      footprintM2: 30
      exits:
        - { to: kitchen, direction: east, opposite: west }
        - { to: living, direction: west, opposite: east }
        - { to: bedroom, direction: north, opposite: south }
    - leaf: kitchen
      room: /world/terminus/hinkley-hills/lots/kitchen
      # The scullery's 8 m² are the kitchen's old back end (water-supply W4).
      footprintM2: 17
      exits:
        - { to: scullery, direction: east, opposite: west }
    # ⭐ The scullery (water-supply W4): unheated, its pipe bare on the wall
    # — the room a frost night gets into first.
    - leaf: scullery
      room: /world/terminus/hinkley-hills/lots/scullery
      footprintM2: 8
    - leaf: living
      room: /stuff/location/room/living
      footprintM2: 30
    - leaf: bedroom
      room: /stuff/location/room/bedroom
      footprintM2: 25
      exits:
        - { to: bathroom, direction: east, opposite: west }
    - leaf: bathroom
      room: /world/terminus/hinkley-hills/lots/bathroom
      footprintM2: 10
    # ⭐ The garden — the lot's open ground, a TRACT of the layout (tracts
    # build W4). Zoned residential: it takes beds, not fields.
    - leaf: garden
      room: /world/terminus/hinkley-hills/lots/garden
      share: 1
