# The yard behind the house on lot-1 — the KEYED entry room of every
# Hinkley holding (residences D16/D17): cloned per lot by the lot's
# HoldingWarren and keyed `(this row, <lotExtent>/yard)`, so title and
# durable state share one identity and `templatePath` always resolves to
# THIS row. It lives under the `lots` zone (P8): a clone's zone resolves
# from the ROW's ancestry, and the yard is reached by the lane's
# non-cardinal `lot-N` gate — admissible only across the zone boundary.
#
# THE HOUSE IS REAL NOW (the residences build): behind the kitchen door
# in the north wall is the hall, keyed to the buyer's lock — the
# programme's floorplan (`house-programme.yaml`) wires it. The garden
# bed below stays build-3's (cultivation).
#
# `populates:` lays the bed down once, on first provisioning, through the
# born-with path — after which the yard's own record carries it and the
# specs sit unused (never double-seeded).
# `/lib/location/FurnishableRoom`, and NOT a CartesianLocation — the
# minted-identity decision forces this and it took a live drive to see.
# A lot's room is cloned per lot at its own identity path, so it cannot
# be a member of the district's shared grid: N lots would sit on ONE
# coordinate, and `CartesianLocation.addExit` (rightly) refuses a
# non-cardinal `lot-1` exit between two rooms in the same zone. A yard is
# reached through a gate, not by a grid step.
#
# FurnishableRoom is the furnishing build's venue-generic persistable
# room and has everything this needs: it IS a persistence host (this
# room's contents are the owner's), it composes Populates, and it is not
# singleton-shaped. It authors no `air` reserve, which is exactly what
# "outdoors" means to FireLogic.
class: /platform/location/FurnishableRoom
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: the yard behind the house
  primaryKeyword: yard
  alternateNames: [garden, back, plot]
  _biomePath: /stuff/idea/biome/outdoor/baseline
  # Full open sky — the whole point of being out here. A carrot wants 120
  # lux to be unlimited by light; a windowsill gives 30.
  ambientIntensity: 600
  ambientColorTemperature: 5800
  longDescription: |
    Grass, a wire fence, and the back of the house — a white weatherboard wall with two windows and a step down from the kitchen door. The ground falls away west just enough to catch the afternoon.

    Somebody dug a bed here and framed it in boards, and then either ran out of time or ran out of reasons. It is good soil under the grass; the rest of the lot is still lot.
  # NO authored exits: the programme wires the locked house door (north)
  # and the way back out the gate (south) per holding — an authored edge
  # here would point every keyed clone at one shared room.
  populates:
    - /trade/farming/thing/bed/garden
    - /world/terminus/hinkley-hills/thing/standpipe
    # The can is not decoration — `water` is a TOOL-conferred verb
    # (ToolCapability `watering`, placement `carried`), so a yard with a
    # bed and a standpipe and no can is ground you cannot actually work.
    # Born-with, so it lands once on first provisioning and is then the
    # owner's, recorded in their own yard's snapshot.
    - /stuff/thing/vessel/watering-can
  details:
    house:
      keywords: [house, wall, weatherboard, windows, door, kitchen, step]
      description: |
        Low, white, and older than the survey — the farmhouse shape every lot out here gets. Two windows onto the yard, a kitchen door with a worn step in the north wall, and a gutter that wants clearing. The door is kept locked; your key fits your own.
    fence:
      keywords: [fence, wire, boundary]
      description: |
        Four strands of wire on split posts, straight enough. It marks the lot rather than defends it — everything past it is grass nobody owns yet.
    grass:
      keywords: [grass, lot, ground, slope]
      description: |
        Rough pasture grass gone to seed, knee-high where it has not been walked. Underneath it the soil is dark and deep; this was a paddock before it was a subdivision, and it has not forgotten.
