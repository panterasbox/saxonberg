# /world/terminus/hinkley-hills/lots — the ZONE the sold lots live in.
#
# ⭐ It no longer exists for the reason it was built for. A grid admits a
# NON-CARDINAL exit only across a zone boundary, and the gate into a lot
# used to be directioned by the lot leaf (`lot-1`) — not a direction at
# all — so this zone was what made the edge legal. Gates are CARDINAL
# now: a road runs along one axis and leaves the other six planar points
# free, so a lot faces north or southwest and the ring assigns which.
# The boundary is no longer load-bearing for that.
#
# It stays for the OTHER reason, which was always the better one: a lot
# is not a grid cell of the street (N lots cannot share one coordinate),
# and a yard that fell back into the district's zone would be measured by
# the district's grid.
#
# One authored zone here puts every lot's minted room on the far side of
# that boundary, with NO per-lot template row — a minted identity has no
# row in `domain`, and `ZoneApi.resolveZoneForPath` walks template
# ancestry in Mongo, so a per-lot zone could not have been minted anyway.
#
# A CartesianZone rather than a FolderZone for the same reason: only a
# SpatialZone can be a room's zone (`resolveZoneForPath` skips folders),
# so a FolderZone here would be walked straight past and every yard would
# land back in the district's zone — which is the failure this fixes.
# `cellSize` is inert today: the rooms in here are FurnishableRooms, not
# CartesianLocations, so nothing reads the grid. It is set to the
# district's 6 m so that it does not lie if one ever does.
#
# Ownership is NOT here. Each lot's title is a row in the gated `parcels`
# collection, keyed on its extent under this branch.
class: /platform/idea/location/CartesianZone
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: Hinkley Hills lots
  cellSize: 6.0
