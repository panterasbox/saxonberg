# /world/terminus/hinkley-hills/lots — the ZONE the sold lots live in.
#
# ⭐ Every sold lot's house is a zone of its own (zone-instancing): a copy
# of the house plan's zone (`house.yaml`) minted at the lot's extent
# (`lots/lot-N`), so its rooms take their cells on the copy's own grid and
# never on this one. This zone is what the copies are FILED under: a
# copy's fields walk where it stands, so a house reads this zone, then the
# district's — the lot's government, its weather, its sky.
#
# Gates are CARDINAL: a road runs along one axis and leaves the other six
# planar points free, so a lot faces north or southwest and the ring
# assigns which. The gate leads from the lane's zone into the lot's copy.
#
# A CartesianZone rather than a FolderZone: the enclosing walk reads any
# zone, and a SpatialZone here keeps the lots measured by the district's
# 6 m cell should anything read it.
#
# Ownership is NOT here. Each lot's title is a row in the gated `parcels`
# collection, keyed on its extent under this branch.
class: /platform/idea/location/CartesianZone
data:
  name: Hinkley Hills lots
  cellSize: 6.0
