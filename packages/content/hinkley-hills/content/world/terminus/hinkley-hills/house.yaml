# /world/terminus/hinkley-hills/house — the ZONE of the Hinkley house
# PLAN, and a zone that is COPIED (zone-instancing D1): every sold lot's
# house is a copy of it, minted by the house programme under the lot's
# extent (`/world/terminus/hinkley-hills/lots/lot-N`) — a zone of its own,
# with its own grid, whose rooms take the cells their rows author and
# which inherits from the lot it stands on (its government, its weather).
# Nothing stands in this row's own instance: a room joins a copy, never the
# row.
class: /platform/idea/place/MintedZone
data:
  name: the Hinkley house
  # Covered by a Locality, so a walk here files claims on your map
  # (navigation card review — a zone with no address wrote nothing).
  address: terminus/hinkley-hills
  cellSize: 6.0
  mintedBy: /world/terminus/hinkley-hills/idea/house-programme
