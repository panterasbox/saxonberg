id: corpo-veshko
version: 0.3.0          # reserved; nothing reads/enforces it (non-goal: version machinery)
root: /corpo/veshko
description: >-
  The veshko corpo — its mark, its brands, and its org chart. CAPITAL and
  the MARK, nothing else: Veshko's distillery yard (the operating
  Business, its stock, its hand, the floor bottles) is a PRODUCT of the
  distilling trade and lives in `trade-distilling` as an outfit whose
  `parentOrganization` points here. Veshko MAKES — in the trade pack.
maintainers: { organization: /corpo/veshko }
requires:
  groups:
    # ⭐ The corpo's COMMITTEE (economic bootstrap D7; the institutions
    # slate's committee/show split): the concept gets an officer, the
    # instance gets a committee. The Registrar of Corporations owns this
    # group and seats it (the `soul` precedent — the seat adds members
    # with the `group` verb; players only, never by being hired). Empty
    # at boot → the founder, through the Registrar's seat.
    - name: veshko-committee
      purpose: the committee over Veshko — who answers when the corpo fails
      owner: { office: registrar-of-corporations }
  # The committee holds the corpo's branch; the organization is the show.
  # A hired clerk is staff; the showrunner may also play the CEO.
  title:
    - { extent: /corpo/veshko, holder: { group: veshko-committee } }
boot:
  - { template: /corpo/veshko, role: producer, reason: appoint and the chart reads resolve the organization by templatePath }
