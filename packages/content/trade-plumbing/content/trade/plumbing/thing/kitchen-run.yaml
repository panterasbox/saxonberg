# An UNLAID run (water-supply D10) — the pipe a kitchen never got. Its
# lengths are recorded empty, so a plumber lays it by `fit`ting lead pipe to
# it: two lengths, one wiped joint. An incomplete run delivers nothing; the
# kitchen's tap reads `unplumbed` until the last length is wiped home.
class: /platform/thing/PipeRun
data:
  shortDescription: unfinished pipe run
  keywords: [run, "pipe run", plumbing, pipes]
  register: definite
  longDescription: >-
    A channel chased into the plaster and a hole bored through the floor
    where a pipe is meant to come up to the sink. Brackets wait along the
    wall with nothing in them.
  _materialPath: /stuff/idea/material/element/lead
  runKind: room
  unlaid: true
  mass: 20
  lengthM: 6
  bill:
    parts:
      - { part: pipe, template: /trade/plumbing/thing/lead-pipe, count: 2, role: structural, plural: lengths }
    joints:
      - { key: wiping, method: wiped, members: [pipe] }
