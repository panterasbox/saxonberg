# ⭐⭐ A salt pan — **the patient source, and the one that goes backwards.**
#
# A shallow leaded pan on the saltings. You fill it from the tide or the
# spring and the sun does the rest, which takes weeks and is at the
# weather's mercy: a dry windy spell concentrates it and **a wet one puts
# the water back**. That setback is the only one in the maturation
# substrate that is not a failure.
#
# ⭐⭐ (ceramics S17, W8) **And the salt SETS in it.** When the brine holds
# more salt than a liter of it can (the `solubility` on sea water's row),
# the excess crystallizes — kept in the pan as one crop that grows while
# the sun is still working the brine — and when the pan is done the liquor
# left is bittern, which runs off into the tub the pan stands on. Salt
# crystals in the pan, bittern beneath: the shape of a saltern.
#
# ⚠ A `SaltPan` (`MaturingMixin` over the kernel `Mould`): the mold keeps
# the crop and drains the bittern; the maturation takes the water. Neither
# kernel class is both, and a second saltern anywhere is this row again.
#
# ⭐ `closure: liquidTight` — closure is whether liquid stays IN, and a pan
# with no lid holds brine (`open` is a SIEVE: the brine ran to the floor).
# The pan stands open to the sky because nothing covers it.
class: /trade/quarrying/thing/SaltPan
data:
  shortDescription: salt pan
  keywords: [pan, "salt pan", saltpan, saltern, lead]
  register: indefinite
  longDescription: >-
    A wide shallow pan of sheet lead on a low brick bed, hardly deeper than
    your hand, with a white crust standing in the corners where it never quite
    empties and a lip at one end over the tub below.
  # The VESSEL KIND — the tie between this row and every product that is this
  # vessel filled.
  category: pan
  _materialPath: /stuff/idea/material/element/lead
  interiorBulk: true
  interiorCapacity: 40
  closure: liquidTight
  # ⭐ The shape the salt sets in: the crop is kept in the pan until it is
  # raked out (`get crystals from pan`), and the pan is used again.
  castTemplate: /stuff/thing/salt-crystals
  reusable: true
  mass: 90
