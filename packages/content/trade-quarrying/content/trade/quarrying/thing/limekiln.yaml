# ⭐⭐ The limekiln — **a ROW, not a class.**
#
# You burn lime where you dig the stone, because the rock is heavy and the
# lime is light. That is the whole reason limekilns stand at quarries, and it
# is why this row is placed by the pit's `props:`.
#
# ⚠ **No trade subclass anywhere.** The difference between baking bread and
# calcining limestone stops being a class name and becomes temperature doing
# real work: 1500 K against an oven's 500. That is lens 1 paying out — a
# player who understands that lime wants a far hotter fire than bread can
# predict which chamber will do which job without reading anything.
class: /platform/thing/Oven
data:
  shortDescription: limekiln
  keywords: [limekiln, kiln, lime, furnace]
  register: definite
  longDescription: >-
    A squat stone bottle built into the spoil bank, its throat open at the top
    and a drawing arch at the bottom. The inside of the throat is burnt to a
    hard white glaze.
  # Hot. A lime burn wants ~1170 K at the stone and this holds well above it,
  # which is what makes the bellows a refinement rather than a requirement.
  burnTemperatureK: 1500
  bellowsMultiplier: 1.15
  lit: false
  mass: 4000
  # ⭐⭐ The darkness sweep (fire build). `emittedIntensity` is a CEILING
  # now, not the reading: luminosity is incandescent soot, so a solid-fuel
  # flame at full draught sheds `fire.light.sootyFloor` (0.6) of it and a
  # starved one climbs back toward it. Every burner's authored figure is
  # scaled by 1/0.6 so a well-run fire lights its room exactly as brightly
  # as it did before — and a badly-run one now lights it MORE, which is
  # the lesson. ⚠ No room lit only by a fire has gone dark (AC20).
  emittedIntensity: 133
  emittedColorTemperature: 1900
  # ⭐ The fire build: fuel is a BED (kilograms, by material) that
  # `stoke` fills, and the vessel's size is a POWER rather than a
  # percentage-per-minute of nothing. What it reaches depends on what
  # is in it.
  # 30 kW: calcining limestone is the hottest ordinary fire in the realm
  # and wants charcoal or coal to reach its 1500 K ceiling at all.
  maxBurnPowerW: 30000
  fuelCapacityKg: 200
