# Native sulfur — ⭐ a nodule from the Hill Quarry's caprock (rubber
# build, D13.4): the yellow crust a salt dome wears, between the coal and
# the rock salt. Won by `dig` with no code — the band's `wins` names it.
#
# ⚠ A `Firewood` (coal's shape — the cleanliness build's ask): sulfur
# burns, so a stove takes it; and it is the agent of the rubber cure. A
# nodule is a few tens of grams — a cure wants a few parts in a hundred,
# so the charge is weighed by counting nodules against the rubber.
class: /platform/thing/Firewood
data:
  keywords: [sulfur, sulphur, brimstone, nodule, "sulfur nodule"]
  shortDescription: nodule of sulfur
  register: indefinite
  longDescription: >-
    A crumbly nodule of bright yellow crystals, glittering where it broke.
    It smells faintly of struck matches.
  _materialPath: /stuff/idea/material/mineral/sulfur
  mass: 0.05
