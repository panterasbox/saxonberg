# ⭐ The brine hearth — **the fast source, and the fuel is what somebody else
# wanted.**
#
# You set a pan of brine over a fire and boil it down in an afternoon instead
# of waiting a month for the sun. So salt's three sources are three genuinely
# different cost structures — capital and labour at a rock-salt face, patience
# on the saltings, **fuel** here — and where a person lives decides which one
# they use. The fuel competition was already designed as part of the wood
# contest: the charcoal burner and the smelter want the same cordwood.
#
# ⚠⚠ **An `Oven` row, and that is not laziness — it is the whole mechanism.**
# `Oven` already composes `ContainerMixin`, so the pan goes **in** the hearth,
# and `ThermalMixin.heatSourceK()` already reads a thing's container for a lit
# furnace. So the brine in the pan reads the fire's temperature with no new
# class, no new coupling and no new verb: `Evaporation` caps its heat term at
# 373 K, which is why a hotter hearth boils faster and never faster than
# boiling.
#
# ⭐ 450 K is deliberately modest — hot enough to boil hard, nowhere near a
# kiln. A brine hearth cannot burn lime, and saying so costs one number.
class: /platform/thing/Oven
data:
  shortDescription: brine hearth
  keywords: [hearth, "brine hearth", fire, furnace]
  register: definite
  longDescription: >-
    A long low fire-bed of brick with iron bars across it, built to take a pan
    the length of it. The brick above the bars is burnt white.
  burnTemperatureK: 450
  bellowsMultiplier: 1
  lit: false
  mass: 1800
  # ⭐⭐ The darkness sweep (fire build). `emittedIntensity` is a CEILING
  # now, not the reading: luminosity is incandescent soot, so a solid-fuel
  # flame at full draught sheds `fire.light.sootyFloor` (0.6) of it and a
  # starved one climbs back toward it. Every burner's authored figure is
  # scaled by 1/0.6 so a well-run fire lights its room exactly as brightly
  # as it did before — and a badly-run one now lights it MORE, which is
  # the lesson. ⚠ No room lit only by a fire has gone dark (AC20).
  emittedIntensity: 67
  emittedColorTemperature: 1800
  # ⭐ The fire build: fuel is a BED (kilograms, by material) that
  # `stoke` fills, and the vessel's size is a POWER rather than a
  # percentage-per-minute of nothing. What it reaches depends on what
  # is in it.
  # A long open pan boiled hard — the saltern's one piece of plant.
  maxBurnPowerW: 15000
  fuelCapacityKg: 100
  # ⭐⭐⭐ **One key, and it is what lets a hearth run on a bore's gas.**
  #
  # An `Oven` is already a `Placing` host; what this says is that things
  # may stand ON this one. `Oven.fuelSlot()` then reads whatever is
  # placed on it, and a SEALED vessel holding something that burns is its
  # fuel tank — so a bladder of firedamp off a wellhead feeds the hearth
  # and the cordwood stays unbought. While a tank is coupled `stoke`
  # refuses in words: *the fire is on the pipe; take the bladder off to
  # burn wood.*
  #
  # ⚠ Nothing else changes. A hearth with nothing on it burns its bed
  # exactly as it did, and a pail of water standing on it is not fuel —
  # which is the reason the hook is on `Oven` and not on `Firebox`, where
  # a retort's placed items are its PRODUCTS and the hook would have
  # needed a guard.
  placements: [on]
