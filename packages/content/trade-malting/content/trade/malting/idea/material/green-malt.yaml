# ⭐ Green malt — the floor's finished bed, and the most perishable thing
# in the chain.
#
# The corns have chitted, the rootlets have knitted the bed into a mat and
# the acrospire has run the length of the grain: the starch is converted
# and the enzymes are at their peak. And it is still ALIVE and still wet,
# so it keeps for hours rather than months — which is the whole reason the
# kiln exists and the whole reason a maltster cannot stop halfway and go
# home.
#
# ⚠ `waterActivity` far above the 0.60 growth floor, against kilned
# malt's 0.45. The difference between those two numbers is the trade.
class: /platform/idea/material/ConsumableMaterial
