# ⭐⭐⭐ Kilning over PEAT — and this is the build's whole argument in one
# row.
#
# The ordinary kiln (`kiln-malt`) dries the bed and stops the conversion.
# This one does the same job over a turf fire, and the smoke goes into the
# barley. Everything downstream follows from that and nothing else has to
# be authored:
#
#   - the phenols survive the mash and the ferment (a concentration rides
#     the matter through every pour, every recipe and every grind);
#   - they come over the still LATE, because phenols are high-boiling
#     (`FractionSpec.aromaticCarry` — 0 in the foreshots, 2.5× in the
#     hearts, 6× in the tails);
#   - ⭐⭐ **so the right cut moves.** A peated wash and a clean one do not
#     want the same cut: take the hearts short and you have thrown away
#     the character you spent a day of turf on; run them long to keep it
#     and you are taking tails into the spirit. That is a decision at the
#     CUT that a decision at the KILN changed, which is the thing the
#     predecessor build could not say about any of its six rungs.
#
# ⚠⚠ **Two fires in the fiction, one in the model.** The kiln's own `%`
# fuel reserve supplies the HEAT; the turf in this slot supplies the
# FLAVOUR, and `imparts` is where it is declared. Nothing in the engine
# knows what a burner is burning — `BurnerMixin`'s fuel is a bare
# percentage and `reachableHeatForImpl` returns a temperature, never a
# source — so a fuel-aware burner that *derives* the smoke is the
# fire/energy slate's job. What keeps this honest meanwhile is that the
# player watches four turves be consumed: the fact is derivable at the
# bench even though the mechanism is declared.
#
# ⭐ The heat band is `kiln-malt`'s, unchanged and for the same reason:
# above ~350 K the enzymes the floor spent five days making are
# destroyed. A peat fire is a COOL, smoky, smouldering fire, which is
# precisely why it works for this and why the band is not relaxed.
recipeId: kiln-malt-peated
name: Kiln malt over peat
keywords: ["kiln peated", "peated", "kiln-malt-peated"]
discipline: malting
difficulty: standard
inputSlots:
- slot: green
  category: green-malt
  minGrade: poor
  measureL: 20
# ⚠ `category: peat` reads the MATERIAL's tags, and `peat.yaml` did not
# carry its own name until this build added it — the slot would have
# matched nothing and failed closed and silent.
- slot: fuel
  kind: item
  category: peat
  minGrade: poor
  count: 4
requiresHeatK: 330
maxHeatK: 360
outputApplication: bulk
outputTemplate: /trade/malting/thing/malt-sack
outputMaterial: /stuff/idea/material/food/malt
# ⭐ The same `malt` MATERIAL as the clean kiln, deliberately. Peating is
# not a different kind of thing — it is the same malt carrying a
# concentration, which is why it blends when you vat and why "lightly" and
# "heavily" peated are a continuum rather than two rows. 30 mg/L of
# phenol is a firmly peated Islay-style malt; the trade really does
# measure it in ppm.
imparts:
- type: smoke
  amount: 30
# ⭐ And it LOOKS different, which is the one thing a sack can tell you —
# a sack is not a glass, so `smell sack` says nothing, by design.
outputAppearance: dark, smoke-reeking malt
