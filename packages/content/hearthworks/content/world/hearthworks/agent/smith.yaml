# Berta — the Hearthworks smith: a Crafter (MakerMixin gated by her
# rostered position; on shift she fulfills `order` at the smithy). Human.
class: /platform/agent/Crafter
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: Berta
  pronouns: she
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  primaryKeyword: berta
  alternateNames:
    - smith
    - blacksmith
  shortDescription: Berta the smith
  longDescription: |
    A broad-shouldered woman in a scorched leather apron, forearms like
    cable, a squint that measures your knife hand before it measures you.
    She works while she talks and stops working for nobody.
  dispositions:
    - { disposition: boldness, valence: 40 }
    - { disposition: humility, valence: 30 }
  # ── the dossier ─────────────────────────────────────────────────
  # Evidence, never values: each entry below expands into the same rows a
  # lived history would have written, marked `claim`. Seeded once at
  # postRegister and skipped if any claim already exists, so a reclone or
  # a reboot cannot mint a second history.
  # ⚠ A best-guess pass, explicitly provisional — the considered version
  # is a content pass of its own before go-live.
  archetype: smith
  competence:
    - { discipline: smithing, asserting: expert }
    - { discipline: appraisal, asserting: competent }
  renown:
    - { asserting: nascent }
  behaviors:
    - brain: /lib/behavior/introduces
      trigger: arrival
    # Presence follows the roster: on shift at the post, off shift in the
    # venue's offstage room (the lounge's precedent — one Offstage, two venues).
    - brain: /lib/behavior/shifts
      trigger: cadence:30s
      config:
        behindBar: /world/hearthworks/location/smithy
        offstage: /world/hearthworks/location/offstage
    - brain: /lib/behavior/idles
      trigger: cadence:20s
      config:
        pool:
          - { kind: free, value: "dresses a coal bed with the rake, not looking up." }
          - { kind: free, value: "taps a cooling piece twice and listens to the ring." }
          - { kind: free, value: "wipes her hands on the apron, leaving them no cleaner." }
