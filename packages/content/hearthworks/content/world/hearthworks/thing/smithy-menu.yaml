# The smithy's board — the offer (a CommerceMenu venue subclass). Its
# presence lights the smithing verb surface (`menu`/`order`/`forge` + the
# by-hand and maintenance verbs as they land). Prices are the smith's
# willingness, calibrated to the store's ladder (a knife the store sells
# at 6 is 15 bespoke — provenance carries worth).
class: /platform/thing/Menu
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: chalked slate of smith-work
  keywords: [slate, board, menu, price-board, chalked, smith-work]
  register: indefinite
  longDescription: |
    A slate board chalked with the smith's standing offers, prices in a firm hand.
  offeredRecipes: [fire-poker, cook-pot, smiths-hammer, belt-knife, leather-jerkin, barbell]
  prices:
    fire-poker: 4
    cook-pot: 8
    smiths-hammer: 12
    belt-knife: 15
    leather-jerkin: 18
    # ⭐ The barbell — two bars of stock, the smith's answer to a body
    # that has outgrown the world's load (nutrition-and-fitness D26).
    # Priced on the smith's own slate: the distributor cannot point at
    # smithing (a pack cycle through cooking), and the maker's counter
    # is the honest one anyway.
    barbell: 14
