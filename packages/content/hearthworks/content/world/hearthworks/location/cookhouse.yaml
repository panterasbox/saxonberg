# The cookhouse — the Hearthworks' cooking venue: a hearth (an Oven-class
# furnace at gentle cooking heat), a cook pot, a pantry chest (the
# open-container gather path — flip the lid, cook), the kitchen board,
# and the cook. Order a meal, or make it yourself with their tools — the
# DIY floor.
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a cookhouse
  primaryKeyword: cookhouse
  longDescription: |
    A low cookhouse warm with woodsmoke, a clay hearth glowing along one wall and a scrubbed table down the middle. A pantry chest stands against the wall, and the smell of stew never quite leaves the rafters.
  coords:
    x: 2
    y: 0
    z: 0
  props:
    - /stuff/thing/Oven
    - /trade/cooking/thing/cook-pot
    # ⭐ The water butt is load-bearing, not scenery: a wet recipe declares
    # `medium: water` and must MATCH an input carrying the water tag, so a
    # cookhouse without a water source cannot boil a stew.
    - /stuff/thing/fixture/water-butt
    - /world/hearthworks/thing/kitchen-menu
    - /world/hearthworks/thing/pantry-chest
    # Working stock out on the table (the DIY floor's hand-reach; the
    # chest holds the dear cuts the gather walk reaches for a craft —
    # hand-retrieval from containers isn't a shipped verb yet).
    - /stuff/thing/items/root-vegetables
    - /stuff/thing/items/root-vegetables
    - /stuff/thing/items/stew-meat
    # ⭐ Empty dinnerware — and it is now load-bearing for BOTH paths. A
    # served meal is CLAIMED from this pool, not cloned into existence, so
    # a cookhouse with no clean crockery serves out of the pot. One of
    # each kind the roster names, twice over, so a second order while the
    # first is still on the table has somewhere to go.
    - /stuff/thing/items/plated-dish
    - /stuff/thing/items/plated-dish
    - /stuff/thing/items/bowl
    - /stuff/thing/items/bowl
    - /stuff/thing/items/platter
    # Cutlery. ⚠ Never a gate: `eat` uses one when there is one and says
    # so, and eats with your fingers when there is not. It is here because
    # a cookhouse that serves stew and hands you nothing to eat it with is
    # a worse lie than one that does.
    - /stuff/thing/cutlery/horn-spoon
    - /stuff/thing/cutlery/horn-spoon
    - /stuff/thing/cutlery/table-knife
  cast:
    - /world/hearthworks/agent/cook
