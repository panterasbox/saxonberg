# The smithy — the working venue the forge demonstrator grew into: the
# bellows-fed forge (melt stays physics — smelting is the phase engine,
# never a recipe), an anvil + hammer + workbench (the `striking`/`anvil`/
# `mending` capability kit), ingot + hide stock, the smith, and her slate
# of offers. Order it made, or make it yourself with their tools — the
# DIY floor. Recipes own FORMING (ingot → blade), gated on reachable
# heat: `forge knife` at a cold forge is a diegetic decline.
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  # ⭐ Daylight reaches this room through a real opening, and the
  # opening is named so the claim is something a player can walk up
  # to and look at. The room follows the sun: bright at noon, dark
  # at night unless somebody lights something.
  ambientSource: sky
  ambientOpening: window
  # ⭐ What this place is BUILT OF (envelope build). A CAUSE, never an
  # effect: you cannot author "well-insulated" here — you name a
  # material the world already carries real numbers for, and the
  # physics decides how fast the place loses its heat.
  # A smithy is built heavy and thick, because a forge lives in it. ⚠ It
  # is still not WARM: a forge heats what you put in it, never the room
  # (thermal.md's rule, kept by composition — `Forge` does not compose
  # `SpaceHeatingMixin`). The mass is why it does not swing.
  fabric:
    material: /stuff/idea/material/rock/granite
    thicknessM: 0.45
  shortDescription: smithy
  keywords: [smithy]
  register: indefinite
  longDescription: |
    A soot-blackened smithy, an anvil squat on its stump and a great stone forge banked along the wall. A leather bellows hangs ready at its side, a workbench under racked stock along the other wall, and a slate of chalked prices by the door.
  # ⚠⚠ **An interior with no authored ambient and nothing lit inside it
  # is PITCH BLACK, and only its contents go nameless.** Every `Location`
  # composes `AmbientLitMixin`, whose `ambientIntensity` defaults to 0;
  # `VisionModality.signalAt` then sums only what is actually emitting,
  # so an unlit room falls under the band `canSee` needs for a figure and
  # `RecognitionLogic.obscured()` renders every object as "something".
  # The room's own prose still reads normally, which is what makes it so
  # quiet a failure.
  #
  # ⭐ The trap this closes is circular: the cookhouse's only light was
  # the hearth, and the hearth is UNLIT until somebody lights it — so a
  # cook walked into a dark room whose one fix was an object they could
  # not see to name. A banked fire, a lamp on a hook, an open shed side:
  # every one of these rooms has a reason to be dim rather than blind,
  # and the shipped kitchen archetype (35 lux) and a dozen Terminus rooms
  # already author exactly this.
  # Here: forge-light and a high window: enough to judge steel by.
  ambientIntensity: 40
  ambientColorTemperature: 3000
  coords:
    x: 1
    y: 0
    z: 0
  adornments:
    - /world/terminus/hearthworks/thing/forge-floor
  props:
    - /stuff/thing/Forge
    - /trade/smithing/thing/iron-ingot
    - /trade/smithing/thing/spare-ingot
    - /trade/smithing/thing/anvil
    - /trade/smithing/thing/workbench
    - /stuff/thing/gear/smiths-hammer
    - /stuff/thing/items/hide-stock
    - /trade/smithing/thing/whetstone
    # ⭐ The mending slate — one `props:` line, and the smithy sells
    # repairs. That is the second-instance test passing.
    - /world/terminus/hearthworks/thing/smithy-tariff
    - /world/terminus/hearthworks/thing/smithy-menu
  cast:
    - /world/terminus/hearthworks/agent/smith
  details:
    window:
      keywords: [window, glass, light]
      description: |
        A long shuttered opening above the bellows, thrown wide while the forge is working — a smith needs to see the colour of the iron.
