# The woodshed — the SPREAD + wet-resist demonstrator. A stack of dry oak logs
# and one rain-soaked log. Light one (`ignite log`); the presence-gated fire
# tick spreads it to the dry neighbours over a few beats, but the wet log
# resists until it dries. Placed declaratively via `props:`.
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  # ⭐ Daylight reaches this room through a real opening, and the
  # opening is named so the claim is something a player can walk up
  # to and look at. The room follows the sun: bright at noon, dark
  # at night unless somebody lights something.
  ambientSource: sky
  ambientOpening: gaps
  # ⭐ What this place is BUILT OF (envelope build). A CAUSE, never an
  # effect: you cannot author "well-insulated" here — you name a
  # material the world already carries real numbers for, and the
  # physics decides how fast the place loses its heat.
  # A woodshed is BOARDS. Oak at 0.17 W/(m·K) over 50 mm is a tenth of
  # granite's loss, so it warms fast off a small fire and goes cold fast
  # too — which is the honest trade a timber building makes.
  enclosure:
    material: /stuff/idea/material/wood/oak
    thicknessM: 0.05
  shortDescription: timber woodshed
  keywords: [woodshed, timber]
  register: indefinite
  longDescription: |
    An open-fronted woodshed, its racks stacked with split oak seasoning for the winter. One log near the eaves is dark and swollen with rain.
  # ⚠⚠ **An interior with no authored ambient and nothing lit inside it
  # is PITCH BLACK, and only its contents go nameless.** Every `Location`
  # composes `AmbientLitMixin`, whose `ambientIntensity` defaults to 0;
  # `VisionModality.signalAt` then sums only what is actually emitting,
  # so an unlit room falls under the band `canSee` needs for a figure and
  # `RecognitionLogic.obscured()` renders every object as "something".
  # The room's own prose still reads normally, which is what makes it so
  # quiet a failure.
  #
  # ⭐ The trap this closes is circular: the cookhouse's only light was
  # the hearth, and the hearth is UNLIT until somebody lights it — so a
  # cook walked into a dark room whose one fix was an object they could
  # not see to name. A banked fire, a lamp on a hook, an open shed side:
  # every one of these rooms has a reason to be dim rather than blind,
  # and the shipped kitchen archetype (35 lux) and a dozen Terminus rooms
  # already author exactly this.
  # Here: daylight through the open side of the shed.
  ambientIntensity: 45
  ambientColorTemperature: 5000
  coords:
    x: 0
    y: 0
    z: 0
  props:
    - /stuff/thing/items/dry-log
    - /stuff/thing/items/dry-log
    - /stuff/thing/items/wet-log
  details:
    gaps:
      keywords: [gaps, glass, light]
      description: |
        The boards are laid with a finger of daylight between each one, which is what keeps the wood dry and the shed usable.
