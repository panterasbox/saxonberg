# Odo — the Hearthworks cook. On shift in the house's `fulfills` cook
# seat, standing in the cookhouse, he is who an `order` there is served
# by. Human.
class: /platform/agent/Cast
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  # ⭐ What this person has on (envelope W1). Until this build no NPC
  # row in the tree could author clothing at all, so every authored
  # person in the realm was naked — invisible only because every
  # interior was 21 °C by decree. A hot kitchen; no coat.
  wears:
    - /stuff/thing/clothes/student-shirt
    - /stuff/thing/clothes/student-trousers
    - /stuff/thing/clothes/canvas-shoes
  name: Odo
  keywords: [odo, cook]
  pronouns: he
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  alternateNames:
    - cook
  shortDescription: Odo the cook
  register: proper
  longDescription: |
    A round, unhurried man with a wooden spoon tucked behind one ear like
    a pencil. He tastes everything twice and trusts nothing he hasn't
    stirred himself.
  dispositions:
    - { disposition: humility, valence: 50 }
    - { disposition: boldness, valence: -20 }
  # ── the dossier ─────────────────────────────────────────────────
  # Evidence, never values: each entry below expands into the same rows a
  # lived history would have written, marked `claim`. Seeded once at
  # postRegister and skipped if any claim already exists, so a reclone or
  # a reboot cannot mint a second history.
  # ⚠ A best-guess pass, explicitly provisional — the considered version
  # is a content pass of its own before go-live.
  archetype: cook
  competence:
    - { discipline: cooking, asserting: proficient }
    - { discipline: recipe-knowledge, asserting: competent }
  behaviors:
    - brain: /lib/behavior/introduces
      trigger: arrival
    # Presence follows the roster: on shift at the post, off shift in the
    # venue's offstage room (the lounge's precedent — one Offstage, two venues).
    - brain: /lib/behavior/shifts
      trigger: cadence:30s
      config:
        behindBar: /world/terminus/hearthworks/location/cookhouse
        offstage: /world/terminus/hearthworks/location/offstage
    # ⭐ He ORDERS the shortfall and RECEIVES what a hauler leaves on the
    # bench — he does not go and get it (logistics D11). Each short par
    # line becomes a carriage bounty on the TERMINAL HALL's noticeboard,
    # which is where a new arrival actually stands.
    #
    # ⚠ The cadence is 90 s, not the bar's 15 m: this board is the one a
    # newcomer reads in their first session, and an empty board is a
    # labor market that does not exist yet. It still orders no faster
    # than the road can answer — the carter's beat is 4 m and the gig
    # window is six game-hours.
    - brain: /lib/behavior/restocks
      trigger: cadence:90s
      config:
        # The scrubbed table down the middle: where receipts land.
        shelf: /stuff/thing/fixture/table
        board: /world/terminus/terminal/thing/job-board
        bench: /trade/haulage/thing/receiving-bench
        reward: 30
    - brain: /lib/behavior/idles
      trigger: cadence:20s
      config:
        pool:
          - { kind: free, value: "lifts the pot lid, sniffs, and nods to himself." }
          - { kind: free, value: "feeds a split log into the hearth." }
          - { kind: free, value: "tastes from the spoon and frowns thoughtfully." }
