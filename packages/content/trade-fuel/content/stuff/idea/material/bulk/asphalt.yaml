# Asphalt — what is left in the bottom of the column when everything
# that will come over has come over.
#
# ⭐ The residue, and the schedule names it as one: a column that gave up
# everything it held would not be a column. It is tar: it will not pour
# cold, it will not burn usefully, and the one thing it is unarguably
# good for is roads — which is a later build's business and a fine
# reason for this row to exist now, holding the bottom of the barrel.
