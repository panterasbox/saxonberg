# ⭐⭐ **A coppice panel — the fuel trade's standing capital, and the one
# thing that makes charcoal a CROP rather than a prop.**
#
# ⚠⚠ **Why this row exists at all.** `hazel-stool` has shipped since the
# fuel trade landed: a mature `Plant` carrying
# `harvestTemplatePath: cordwood`, propped loose on the fuel yard's
# floor. But **`harvest` is contributed by `CultivableMixin`, not by
# `Plant`** — so a stool standing on the ground affords nothing, and
# `harvest stool` answered *"I don't understand 'harvest'."* to every
# player and every brain. The crop shipped, the verb shipped, and
# nothing connected them: the fourth dead-affordance of this build's
# reckoning, found by charring in a browser. A panel is ground, so the
# stools in it can be cut.
#
# ⭐ **It is a `GardenBed` with a bigger number and no new engine**, per
# the forestry slate's own guardrail — *"reuse the growth model; a stand
# is a density decision, not a new engine."* Nothing here anticipates
# silviculture: no rotation machinery, no conversion, no second wood
# species. Those are the forestry build's, and this row must not grow
# them.
#
# ⚠⚠ **The size is deliberately MEAN, and that is the lesson.** Six
# stools at eight lengths a set is the realm's whole charcoal rate, and
# a single working smelter eats it. That is not a number to raise when
# somebody runs out: the rate-limiting step of pre-industrial ironmaking
# was FUEL, not ore — charcoal iron was bounded by woodland, ironworks
# ate forests across Europe, and that constraint is precisely why coke
# happened in 1709. A coppice that comfortably supplies everybody would
# teach the opposite of the true thing. The forestry slate says it
# outright: *"no regrowth timer that outruns demand"* and *"do not
# prevent deforestation — the whole arc depends on it being possible."*
#
# ⭐ So running out is CORRECT, and the choice it forces is the point:
# the baskets are shared, and taking the last one has a victim.
class: /platform/thing/GardenBed
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: panel of coppiced hazel
  keywords: [panel, coppice, hazel, stand, stools, cant]
  register: indefinite
  longDescription: |
    A block of hazel stools set out in rough rows, all cut to the same knuckle in the same year and all standing at the same height because of it. The ground between them is a litter of old chips and last season's tops. This is the panel that is ready; the one beyond it was cut and is still in rods.
  _materialPath: /stuff/idea/material/wood/oak
  # Ground, not a frame: the panel IS the plot, so the mass is the earth
  # it stands on and nobody is carrying it anywhere. Same doctrine as the
  # bed — can't-budge is emergent from mass, never a type flag.
  mass: 2400
  fixedGround: true
  # A working panel in a coppice rotation, not a garden: call it 120 m²
  # of a cant, which is what six stools at proper spacing actually take.
  landRequirementM2: 120
  interiorBulk: true
  interiorCapacity: 180
  # Rain-fed woodland ground, and deep: a coppice is not watered by
  # anybody and its nitrogen comes back as leaf litter. The reserves are
  # generous because the LIMIT here is meant to be the rotation, not
  # husbandry — a player who runs the panel dry has cut it too hard, and
  # that is the finding, not a watering chore.
  reserves:
    moisture:
      capacityValue: 90
      currentValue: 90
      unit: "L"
      theme: cultivation
      floorEffect: wilting
    nitrogen:
      capacityValue: 100
      currentValue: 100
      unit: "%"
      theme: cultivation
      floorEffect: spent
  staticSlots:
    - name: plant
      accepts: SlottableMixin
      # ⚠ SIX, and see the note above before changing it. This number is
      # the realm's charcoal rate and therefore its iron ceiling.
      capacity: 6
      userFacingDetail: planting
  # ⭐ The stools arrive through the ground's OWN `props:`, which
  # `CultivableMixin.applyProps` seats into the plant slots — the starter
  # pot's shipped shape (`trade/farming/thing/pot/starter`), and the only
  # authoring route that needs no code. They are authored already grown,
  # which the stool row's own `daysToStage` is what makes honest: a
  # seven-year rotation means nobody alive planted these.
  props:
    - /trade/fuel/thing/hazel-stool
    - /trade/fuel/thing/hazel-stool
    - /trade/fuel/thing/hazel-stool
    - /trade/fuel/thing/hazel-stool
    - /trade/fuel/thing/hazel-stool
    - /trade/fuel/thing/hazel-stool
  details:
    planting:
      keywords: [ground, litter, chips, stools, rows]
      description: |
        Old chips and rotted tops underfoot, and the stools standing out of it in rows a cart could just get between.
