# Ash — ⭐ the OTHER failure, and the total one. A clamp that took too
# much air burns its charge all the way through and leaves nothing at all.
# You can lose an entire burn, and this is what losing it looks like.
class: /trade/fuel/thing/Ash
data:
  shortDescription: drift of pale ash
  keywords: [ash, ashes, drift, pale, "drift of pale ash"]
  register: indefinite
  longDescription: >-
    Fine pale ash, still warm, lifting in any draught. A week's cutting
    and three days' watching, gone up the chimney of a hole in the ground.
  _materialPath: /stuff/idea/material/organic/ash
  gradeBand: fair
  # ⭐ Its grade IS its strength (potash D1): a raked heap's composition is
  # written by the burner that made it, and re-grades it. This default is
  # an oak hearth's — a share of 0.15 of the ash is alkali.
  gradedByStrength: true
  alloying:
    - materialPath: /stuff/idea/material/mineral/potash
      fraction: 0.15
  mass: 0.6
