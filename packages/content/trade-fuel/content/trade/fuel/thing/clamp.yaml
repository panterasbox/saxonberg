# A charcoal clamp — a heap of cordwood stacked around a chimney, turfed
# over and fired.
#
# ⭐ Its ONE dial is `draught`. What a burn comes out as is not on this
# row any more (ceramics ruling A): the cordwood's own material chars below
# the flaming dial, catches above it, and gets only to brands if the heap
# runs too cool.
class: /trade/fuel/thing/CharcoalPit
data:
  shortDescription: turfed charcoal clamp
  keywords: [clamp, pit, heap, kiln, turfed, charcoal]
  register: indefinite
  longDescription: >-
    A dome of stacked cordwood the height of a man, packed round a
    chimney of poles and sealed under turf and earth. A dozen vents are
    stopped with sods; where it is burning, thin blue smoke comes out of
    them and nothing else does.
  mass: 1800
  interiorBulk: false
  # ⭐ 0.45 → completeness ≈ 0.53, below `fire.air.flamingCompleteness`
  # (0.6): the heap is STARVED, so the wood chars and never catches. Open
  # it past ≈ 0.51 and a flame can burn in it — the lost burn.
  draught: 0.45
  # ⭐ A charring heap, not a forge: ~720 K at the vents' ceiling, which the
  # starved fire holds at ≈ 635 K (held = ceiling × (0.75 + 0.25 ×
  # completeness)). Hazel chars through in about two and a half days there;
  # at draught 0.3 the heap runs ~30 K cooler and three days only reach
  # brands.
  burnTemperatureK: 720
  bellowsMultiplier: 1.0
  lit: false
  # ⭐ The fire build: fuel is a BED (kilograms, by material) that
  # `stoke` fills, and the vessel's size is a POWER rather than a
  # percentage-per-minute of nothing. What it reaches depends on what
  # is in it.
  # ⚠⚠ 2 kW against a four-tonne bed, and the ratio is deliberate: a
  # clamp is a fire that must NOT burn its own charge — it cooks the
  # volatiles out of it over three days. Low power keeps the heat and the
  # charge distinct in practice, which is what the charring band assumes.
  maxBurnPowerW: 2000
  fuelCapacityKg: 4000
  # ⭐ The heap's own firing wood, laid down the chimney when it was built:
  # what `char` lights (ceramics ruling A — the clamp is lit now, where it
  # used to be a timer). Enough for two burns; after that the collier
  # stokes dry wood down the chimney before the next.
  fuelBed:
    /stuff/idea/material/wood/hazel: 40
