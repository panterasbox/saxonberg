id: trade-fuel
version: 0.1.0
root: /trade/fuel
description: >-
  The fuel trade — the coppice, the burn and the charcoal. A managed
  stand over the shipped growth model, the clamp that chars it, and the
  single act (char) that runs the burn as a watched engagement over game
  time. ⭐ Airflow is the decision and the burn can be LOST: too much air
  and the charge goes to ash, too little and you draw half-burnt brands.
  Charcoal is what makes the smelt reach copper's melting point, and the
  same stand cuts the timber the mine shores with — two consumers, one
  supply. ⭐ It also makes LAMP OIL: the material a street lamp burns,
  carried in casks, the good that answers the street-lighting market
  (the producer is a Terminus goods-yards oil works). ⭐ And since the fire
  build it RETORTS: a brick chamber beside the clamp that keeps what the
  clamp vents — wood tar from a wood charge, and from coal the three
  products a gasworks lived on (coke, coal tar, coal gas). Lamp oil off
  the light fraction is the distiller's deferred cuts rung.
requires:
  # The trade is placeless (economic bootstrap D6/D7): its mechanism is
  # held by the Ministry of Trade — a seat, never a committee. Its
  # premises, if any, sit in the world under a locality's committee.
  title:
    - { extent: /trade/fuel, holder: { organization: /compact/trade } }
