  keywords: [approach, lane, testbed]
  register: definite
  _biomePath: /stuff/idea/biome/outdoor/baseline
  longDescription: |
    A short lane running north to the plaza. A hut stands to the west and a yard opens to the east. To the south a low door leads into the works.
  coords: { x: 0, y: -1, z: 0 }
  exits:
    north:
      destination: /world/testbed/location/plaza
    west:
      destination: /world/testbed/location/hut
    east:
      destination: /world/testbed/location/yard
