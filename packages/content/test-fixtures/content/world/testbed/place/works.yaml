# The works — a forge room with a basin, entered by a low door
# (test-world-lifecycle D2; the Hearthworks smithy is the exemplar). Lit by a
# lamp. The basin draws on the cistern, which the testbed's title cites as
# its water source. ⚠ TEST-ONLY.
class: /platform/place/Hall
data:
  shortDescription: testbed works
  keywords: [works, forge, testbed]
  register: definite
  enclosure: { material: /stuff/idea/material/rock/granite, thicknessM: 0.45 }
  roof: { material: /stuff/idea/material/rock/slate, thicknessM: 0.02 }
  longDescription: |
    A stone workroom with a forge against one wall, a basin on the other and a cistern in the corner. A lamp hangs from a beam. A low door leads north to the approach.
  coords: { x: 0, y: -2, z: 0 }
  exits:
    north:
      destination: /world/testbed/place/approach
      media: [ground]
      opening: { width: 0.9, height: 1.4 }
  props:
    - /world/testbed/thing/forge
    - /world/testbed/thing/basin
    - /world/testbed/thing/cistern
    - /world/testbed/thing/lamp
