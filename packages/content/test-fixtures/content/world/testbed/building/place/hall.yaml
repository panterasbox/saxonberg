# The hall — the testbed's lit venue (test-world-lifecycle D2). The venue
# Business operates here; the host is on its roster around the clock. A
# shelf of three like notebooks, a staff tablet and three chairs. The double
# doors to the plaza stand open. A bank of lockers keeps what is checked
# into it while the hall itself restages (persistence-model W1). ⚠ TEST-ONLY.
class: /platform/place/Hall
data:
  shortDescription: testbed hall
  keywords: [hall, venue, testbed]
  register: definite
  enclosure: { material: /stuff/idea/material/ceramic/brick, thicknessM: 0.35 }
  roof: { material: /stuff/idea/material/rock/slate, thicknessM: 0.02 }
  longDescription: |
    A plain hall, lit by a lamp. Three chairs stand about, a shelf runs along one wall and a tablet rests beside it. Double doors open south onto the plaza.
  coords: { x: 0, y: 1, z: 0 }
  exits:
    south:
      destination: /world/testbed/place/plaza
      door: /world/testbed/thing/hall-doors
  props:
    - { template: /world/testbed/thing/hall-shelf, as: shelf }
    - { template: /platform/thing/book, count: 3, on: shelf }
    - /world/testbed/thing/tablet
    - { template: /world/testbed/thing/chair, count: 3 }
    - /world/testbed/thing/lamp
    - { template: /world/testbed/thing/lockers, as: lockers }
  cast:
    - /world/testbed/agent/host
