# A diving helmet (underwater C3, D27) — the copper hard hat of a standard
# dress, bolted to the corselet, its air fed down a hose from a pump on
# the surface. It holds about a minute's breathing: when the pump stops,
# that minute is what you have.
class: /platform/thing/AirTank
data:
  shortDescription: diving helmet
  keywords: [helmet, "diving helmet", "hard hat", copper]
  register: indefinite
  longDescription: >-
    A heavy copper helmet with three thick glass ports, a non-return valve
    where the hose screws on, and an exhaust valve you bump with your
    chin. It is very heavy out of the water.
  _materialPath: /stuff/idea/material/element/copper
  mass: 15
  interiorBulk: true
  interiorMaterial: /stuff/idea/material/bulk/air
  interiorCapacity: 30
  closure: sealed
  interiorAmount: 30
  slotClaims:
    "/stuff/idea/species/BodyPlan/biped": [head]
