# A painter (the river build, D24) — the line on a small boat's bow. Throw
# its end to somebody on the bank and they can walk her up past water too
# quick to paddle: the boat comes along beside them as they go (lining).
# ⭐ A ROPE (cordage D3, re-classed in place — the owner): a lifeline in all
# but length, because a rope's use is where its ends are tied.
class: /platform/thing/Rope
