# ⭐ Make something fast to a load (underwater C5): the free end of a
# lifeline, so the tender can pull it up; or an air bag, so its air lifts
# what no diver can.
verbs: [lash]
controller: /trade/diving/idea/cmd/diving/LashController
description: "Lash a line's end or an air bag to something heavy"
help: |
  `lash end to <thing>` makes the end of a lifeline you are holding fast
  to something beside you, so whoever holds the line can `pull` it up.
  `lash bag to <thing>` lashes an air bag or a sealed air barrel to it:
  if the air lifts more than the load weighs in the water, the two rise
  together to the top. A line alone brings up only what a pair of arms
  can; anything heavier wants air under it first.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: gear
    type: object
    required: true
    scope: "inventory"
    requires: any
  - name: load
    type: object
    required: true
    scope: "reachable"
    requires: any
    prepositions: [to]
    greedy: true
