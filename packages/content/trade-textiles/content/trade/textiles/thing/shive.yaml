# Shive — the woody boon knocked out of the stem.
#
# ⭐ The other byproduct: fuel and litter. It is most of what a flax
# stem weighs, which is the honest arithmetic of the whole preparation
# stage — you throw away the majority of what you grew, and the
# minority is worth more than the crop.
class: /trade/textiles/thing/TextileStock
