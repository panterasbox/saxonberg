# A bowstring — ⭐⭐⭐ a WEAR part (assembly AC 13): linen line laid up in
# a long twist, waxed, and served at the middle and the loops where the
# arrow and the nocks bear on it. It frays at the nocking point and
# parts, and an archer carries a spare and restrings by hand in the
# field. A stringmaker who makes nothing else sells to every archer in
# the realm; the bow's bill names this row.
