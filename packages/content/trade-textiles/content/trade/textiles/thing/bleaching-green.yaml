# The bleaching green — an acre of grass kept for whitening linen.
#
# ⭐ Retting's shape applied to WEATHER. Lay it out; sun, dew and lye do
# it over months; take it in when it is white. Zero verbs, and a real
# weather consumer.
#
# ⭐⭐ It is LAND DEDICATED TO A PURPOSE, which is what a bleaching green
# actually was — and the reason chlorine bleaching turning greens back
# into farmland is one of the best land-economics stories the subject
# has. That door is open; nothing here closes it.
class: /trade/textiles/thing/BleachingGreen
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: bleaching green
  keywords: [green, sward, bleaching, grass]
  register: indefinite
  longDescription: |
    A close-cropped acre pegged out in long pale strips, weighted at the corners against the wind. Somebody walks it twice a day with a watering can, which is the entire technology.
  # ⚠ NO `_materialPath`, and `lint:perishable` is why. It was
  # `tissue/plant-tissue`, which ROTS — so an acre of turf was a
  # perishable object on a class that cannot spoil, which does not throw:
  # it silently never spoils, and the row would have sat there lying
  # about itself forever. A bleaching green is LAND, and the shipped
  # precedent for land is `GardenBed`, whose row declares no material at
  # all. Nothing reads this object's own material — `scutch` reads what
  # is IN the slot, not what the green is made of.
  mass: 50
