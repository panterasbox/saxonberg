# Bleached linen — the same fibre, whitened.
#
# ⭐ Sun-bleaching is retting's shape applied to WEATHER: you lay it out
# and the world does it, over days, with no verb at all. Sun, dew and
# lye, and the only thing anybody does is wait and turn it.
#
# ⚠ It is a distinct MATERIAL rather than a flag, for the same reason
# linen and flax-straw are: what changes is what the substance IS to
# every downstream reader — including the dyer, for whom white ground is
# the difference between a colour and a muddy version of it.
#
# ⚠⚠ It is still CELLULOSE, so bleaching buys a white ground and buys
# nothing whatever against the mordant problem. A bleached linen still
# needs its tannin.
class: /platform/idea/material/Material
hydratorClass: /platform/idea/persistence/PersistentHydrator
