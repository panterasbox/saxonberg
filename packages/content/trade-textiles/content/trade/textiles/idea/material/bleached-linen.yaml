  name: bleached linen
  appearance: bright bleached linen
  keywords: [bleached, white, "bleached linen"]
  density: 1500
  thermalConductivity: 0.05
  # ⚠ A shade weaker than greige: the lye and the months take something.
  hardness: 5
  toughness: 2
  specificHeat: 1360
  electricalConductivity: 1.0e-11
  waterAbsorptionCapacity: 20
  edibility: false
