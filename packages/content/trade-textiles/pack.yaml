id: trade-textiles
version: 0.1.0
root: /trade/textiles
description: >-
  The textile trade — straw into cloth. ⭐ The chain's entry point is the
  FIBRE, not the pit: `spin` takes a fibre material and where it came
  from is upstream, so wool, cotton and one day a synthetic plug in
  without this pack changing a line. Preparation is a stage and retting
  is flax's instance of it; finishing is a stage and bleaching is
  linen's. Three verbs, three decisions — how hard to work it, how fine
  to spin it, how close to weave it — and ⭐⭐ spinning is the
  bottleneck, which is a lesson rather than a tuning accident.
requires:
  groups:
    - name: textiles
      purpose: the textile trade's own body
      owner: { office: prime-minister }
  title:
    - { extent: /trade/textiles, holder: { group: textiles } }
boot:
  # ⚠ A venue whose floor holds a `Stock` and whose cast runs a
  # `consigns` beat has to be EAGER: lazily-cloned rooms mean the
  # weaver never starts carrying bolts to the store and the trade
  # produces into a room nobody has opened. `trade-farming` records the
  # same pair for the same reason.
  - { template: /trade/textiles/location/mill, role: producer, reason: "the mill floor — its Stock is the home container bolts spawn into, and its weaver runs the consigns brain" }
  - { template: /trade/textiles/idea/mill, role: producer, reason: "the weaver's `purchases` position is materialized over a live business; the consigns beat trades as it" }
