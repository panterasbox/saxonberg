# Crustacean — a shore crab's plan: a carapace, eight legs and two claws,
# and gills that work in air for a while. It walks and it swims.
#
# ⭐ `breathableMedia: [water, air]` is what makes a crab a crab and not a
# fish: a pot lifted onto the bank holds crabs that are still alive an
# hour later, and a bowl is not the only place one can be kept. The
# shore crab is the `bait` role of the fishery and the one species here
# that will not drown in your hand.
class: /platform/idea/species/BodyPlan
data:
  name: crustacean
  slots: []
  locomotionModes:
    - walk
    - swim
  defaultLocomotionMode: walk
  breathableMedia: [water, air]
  respires: true
  sensoryPorts:
    - { modality: vision, count: 2, position: frontal }
    - { modality: touch, count: 1, position: circumferential }
  bodyParts:
    - key: body.torso
      parent: null
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/bone, share: 0.3886 }
        - { tissuePath: /stuff/idea/material/tissue/flesh, share: 0.3883 }
    - key: body.claw.left
      parent: body.torso
      severable: true
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/bone, share: 0.0485 }
        - { tissuePath: /stuff/idea/material/tissue/muscle, share: 0.0485 }
    - key: body.claw.right
      parent: body.torso
      severable: true
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/bone, share: 0.0485 }
        - { tissuePath: /stuff/idea/material/tissue/muscle, share: 0.0485 }
    - key: body.torso.heart
      parent: body.torso
      governs: [heartRate]
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/muscle, share: 0.0097 }
    - key: body.torso.gills
      parent: body.torso
      governs: [respiratoryRate]
      tissues:
        - { tissuePath: /stuff/idea/material/tissue/flesh, share: 0.0194 }
