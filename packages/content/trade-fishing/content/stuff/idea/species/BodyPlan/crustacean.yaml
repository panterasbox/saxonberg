# Crustacean — a shore crab's plan: a carapace, eight legs and two claws,
# and gills that work in air for a while. It walks and it swims.
#
# ⭐ Gills that work in air for a while are what make a crab a crab and not
# a fish: water fully, air at nine-tenths (underwater D21 — breathing is a
# RATE). A pot lifted onto the bank holds crabs that are still alive hours
# later, and a bowl is not the only place one can be kept — but a crab
# left on a hot quay for days is not. The shore crab is the `bait` role of
# the fishery and the one species here that will not drown in your hand.
class: /platform/idea/species/BodyPlan
data:
  name: crustacean
  slots: []
  defaultLocomotionMode: walk
  breathing:
    - { medium: water, apparatus: gills, intake: 1 }
    - { medium: air, apparatus: gills, intake: 0.9 }
  respires: true
  sensoryPorts:
    - { modality: vision, count: 2, position: frontal }
    - { modality: touch, count: 1, position: circumferential }
  # ⭐ Composed from body modules (organism-biology D1): each entry names
  # a module document, the absolute key of each instance (`as`) and the
  # part it hangs from (`at`). The expansion reproduces the keys and the
  # tissue shares this plan always had.
  modules:
    - { module: /trade/fishing/body-modules/torso-crustacean, as: [body.torso] }
    - { module: /trade/fishing/body-modules/claw-crustacean, as: [body.claw.left, body.claw.right], at: body.torso }
