# A keepnet — the trap that draws nothing (B8). A long net bag on a
# hoop, laid in the water beside you; what you land goes in it and
# LIVES, because a laid trap with an interior is full of the water it
# lies in and respiration reads the vessel a body is inside. `haul` it
# and take them home — or open it and let them go. Keep or kill is
# yours now, not the clock's.
