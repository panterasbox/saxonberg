# A float rod — a quill float on a fine horsehair line, a small hook
# (B8). The bait hangs where the float sets it: at the SURFACE, in front
# of the mullet and whatever else comes up. Fine line shows the bait
# well (`showing: 1.3`) and parts easily (`breakStrain: 0.4`): the
# rig for the shoal, not for the sturgeon. The small hook takes small
# fish a bigger one would miss.
