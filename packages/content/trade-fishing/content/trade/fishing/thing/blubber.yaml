# Blubber (organism-biology D13) — the whale's coat of fat, flensed off in
# blanket pieces: what a whale gives first, and what renders to oil.
class: /platform/thing/Cut
data:
  shortDescription: blanket piece of blubber
  keywords: [blubber, blanket, "blanket piece", piece, fat]
  register: indefinite
  longDescription: A thick slab of pale, rubbery fat with the black skin still on one side of it, oozing at the cut.
  _materialPath: /trade/fishing/idea/material/blubber
  # ⭐ One piece of it, kg (organism-biology D5): a whale comes off in
  # pieces, never one ten-tonne lot — and at FLENSING scale, never a
  # thousand hand-sized ones: the drive's grown whale made ~1,000 objects
  # at 40 kg a strip and stalled the world (B38).
  # A blanket piece is what the tackle hoists: about a ton.
  portionKg: 1000
  tissues:
    - /trade/fishing/idea/material/blubber
  cutting: boneless
  difficulty: easy
  mass: 20
