verbs: [haul]
controller: /trade/fishing/idea/cmd/fishing/HaulController
description: "Haul a set pot or net"
help: |
  `haul pot` brings a set pot or net out of the water with whatever the
  water put in it. Nothing tells you what was luck. (`lift` is what you
  do to a bar.)
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  # ⭐ WHICH TRAP — the one in the water beside you.
  - name: trap
    type: object
    required: false
    default: "here:[capability.trapping]"
    scope: ["reachable"]
    requires: [ToolMixin]
