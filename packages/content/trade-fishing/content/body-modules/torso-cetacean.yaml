# torso-cetacean — a whale's body (organism-biology D13): great lungs that
# hold a dive, a heart, the dark meat, and ⭐ the blubber as the
# integument's UNDER layer — the coat a whale keeps warm in, which is what
# comes off a whale first and renders to oil.
parts:
- key: ''
  senses: [{modality: touch}]
  tissues:
  - {tissue: /stuff/idea/material/tissue/bone, weight: 0.06}
  - {tissue: /stuff/idea/material/tissue/muscle, weight: 0.3}
  - {tissue: /stuff/idea/material/tissue/intestine, weight: 0.03}
- key: heart
  parent: ''
  governs: [heartRate, circulation]
  tissues:
  - {tissue: /stuff/idea/material/tissue/muscle, weight: 0.004}
- key: lungs
  parent: ''
  governs: [respiratoryRate, respiration]
  breathes: [{medium: air, apparatus: lungs, intake: 1, volumeL: 6}]
  tissues:
  - {tissue: /stuff/idea/material/tissue/flesh, weight: 0.01}
- key: liver
  parent: ''
  governs: [clearance]
  tissues:
  - {tissue: /stuff/idea/material/tissue/flesh, weight: 0.01}
- key: kidney.left
  parent: ''
  sustains: [filtration]
  tissues:
  - {tissue: /stuff/idea/material/tissue/kidney, weight: 0.002}
- key: kidney.right
  parent: ''
  sustains: [filtration]
  tissues:
  - {tissue: /stuff/idea/material/tissue/kidney, weight: 0.002}
integument:
  skin: {material: /stuff/idea/material/tissue/skin, weight: 0.01, form: skin}
  under: {material: /trade/fishing/idea/material/blubber, weight: 0.2, depthM: 0.2}
comesOffAs:
- {tissue: /trade/fishing/idea/material/blubber, cut: /trade/fishing/thing/blubber}
- {tissue: /stuff/idea/material/tissue/muscle, cut: /trade/fishing/thing/whale-meat}
- {tissue: /stuff/idea/material/tissue/flesh, cut: /stuff/thing/items/offal}
