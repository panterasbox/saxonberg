# torso-crustacean — a body module (organism-biology D1): a subtree of parts with
# relative keys ('' is the instance's own key) and tissue weights.
# ⭐ W5: comesOffAs — what each material of this module leaves a carcass as.
parts:
- key: ''
  tissues:
  - {tissue: /stuff/idea/material/tissue/chitin, weight: 0.3886}
  - {tissue: /stuff/idea/material/tissue/flesh, weight: 0.3883}
  gait: [walk, swim]
- key: heart
  parent: ''
  governs: [heartRate]
  tissues:
  - {tissue: /stuff/idea/material/tissue/muscle, weight: 0.0097}
- key: gills
  parent: ''
  governs: [respiratoryRate]
  tissues:
  - {tissue: /stuff/idea/material/tissue/flesh, weight: 0.0194}
integument:
  skin: {material: /stuff/idea/material/tissue/chitin, form: plate}
comesOffAs:
- {tissue: /stuff/idea/material/tissue/flesh, cut: /stuff/thing/items/offal}
- {tissue: /stuff/idea/material/tissue/chitin, cut: /trade/fishing/thing/carapace}
