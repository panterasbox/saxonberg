# fasttravel — the TPA network's own dials, shipped by the pack that owns
# the network (the `settings` kind: merge-missing — a key the app_settings
# singleton lacks is merged in; a value the operator changed via `config` is
# never touched).
#
# ⓘ The three `AppSettingKeys` CONSTANTS stay in the kernel — that is the
# house pattern, not residue: the water pack's own dials live there too and
# the pack imports them. A key NAME is shared vocabulary, so a typo fails;
# the VALUES stay authored here.
#
# ⚠ `fasttravel.bornWithNodes` is deliberately NOT here — which of a realm's
# stops every traveller is born knowing is realm content, and lives in
# `world-seed`.
settings:
  # Fast-travel — the TPA network fee (a flat base + a percentage) levied on
  # every PAID ride into the TPA operating budget (both budgets recirculate;
  # the sink lever is a deferred CB drain, not accumulation). The base
  # guarantees a non-zero fee on any paid ride: min(fee, base + floor(fee ×
  # rate)). Read try/catch → 0-fallback like banking.salesTaxRate.
  - key: fasttravel.networkFeeRate
    value: "0.15"

  - key: fasttravel.networkFeeBase
    value: "1"

  # Fast-travel — the Teleport Authority Business (the network fee accrues
  # to its operating account, custodied at its authored banksAt).
  #
  # ⚠ RESEED HAZARD: the `settings` kind is MERGE-MISSING, so an existing
  # world keeps pointing at the retired `/world/terminus/...` row until an
  # operator edits this key by hand (`config set fasttravel.tpaBusinessPath
  # /system/tpa/idea/teleport-authority`). A fresh DB is correct
  # automatically. Same shape as fasttravel.md's existing R1 reseed note.
  - key: fasttravel.tpaBusinessPath
    value: /system/tpa/idea/teleport-authority

  # ⭐ What a gate charges per τ it supplies — NOT authored per
  # terminal. The rate derives from where the gate's mana came from,
  # because the operator resells its own supply at its cost basis. A
  # line-fed city gate is cheap; a frontier post running on bought
  # cells is dear, and the traveller can see which is which by looking
  # at the terminal. Two otherwise-identical gates therefore quote
  # DIFFERENT prices for the same ride, and neither number was tuned.
  #
  # ⭐ Derived from the shipped ladder, not chosen: a cell is 6 credits
  # for 600 τ, so cell mana costs the operator exactly **0.01 per τ**,
  # and that is what a cell-fed gate charges. The line is a fifth of
  # that — the city buys in bulk.
  #
  # The consequence is legible without a gauge: on a LEVEL hop (the
  # 40 τ survey floor) both rates round to a single credit and the mana
  # is a rounding error on the fare. On a real CLIMB the `mgh` term
  # dominates, the two gates visibly diverge, and the traveller can see
  # WHY by looking at what is feeding each one. Nobody tuned that.
  - key: tpa.manaRate.mains
    value: "0.002"

  - key: tpa.manaRate.cell
    value: "0.01"

  # The traveller's standing preference for whose mana pays a ride —
  # `terminal` (the default: put it on the meter) or `self` (channel
  # your own). Overridden per ride by `--channel` / `--meter`.
  - key: tpa.power
    value: terminal
