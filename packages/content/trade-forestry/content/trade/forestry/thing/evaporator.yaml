# An evaporator — ⭐ the brine hearth with a roof over it, which is what
# a sugarhouse arch is.
#
# A long open-sided fire-bed built to take a pan the length of it, fed
# with cordwood and run hard: the trade's one piece of plant, and the
# reason sugaring is a PLACE rather than a thing you do in a kitchen.
#
# ⭐⭐ `burnTemperatureK: 470` (the sugar build, D1/D2 — it was 390 while
# an `evaporative` maturation profile did the boiling and the arch had to
# sit between the profile's bands). The boil is the kernel's plateau now:
# the sap's boiling point climbs as it thickens, from 100 °C to the
# strike's ~122 °C, so the fire has to be hotter than the thickest stage
# it is meant to reach. What ruins a pan is the same as ever and has
# nothing to do with the fire's setting: leaving it on until it has
# boiled past what you wanted.
#
# ⭐ It burns WOOD, and the wood comes out of the same stand the sap
# does — which is the first time in the game a trade's fuel and its
# feedstock are the same acre. Nothing enforces that; it is just where
# the arch is.
class: /platform/thing/Oven
data:
  shortDescription: sugaring arch
  keywords: [evaporator, arch, hearth, fire, "sugaring arch"]
  register: definite
  longDescription: >-
    A long low arch of fieldstone and brick, open at both ends and roofed
    with brash against the rain, with iron bars across the top set to
    take a pan the length of it. The stone above the bars is burnt white
    and the ground either side is beaten flat and black with ash.
  burnTemperatureK: 470
  bellowsMultiplier: 1
  lit: false
  mass: 1600
  # ⭐ The fire build: fuel is a BED (kilograms, by material) that
  # `stoke` fills, and the vessel's size is a POWER rather than a
  # percentage-per-minute of nothing. What it reaches depends on what
  # is in it.
  # 12 kW and a long bed: an arch is built to boil forty gallons down,
  # which is why it takes cordwood by the armful.
  maxBurnPowerW: 12000
  # Half of it reaches the pan — an open arch loses the rest up the stack.
  heatTransferFraction: 0.5
  fuelCapacityKg: 80
