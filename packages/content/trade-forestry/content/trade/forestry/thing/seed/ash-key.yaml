# An ash key — the winged seed of the ash; what a felled ash drops. Plant
# it in a panel and it grows into `/trade/forestry/thing/plant/ash-standard`.
class: /platform/thing/Seed
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: ash key
  keywords: [key, "ash key", seed, ash, keys]
  register: indefinite
  longDescription: |
    A bunch of ash keys, the papery wings still on them.
  growsIntoPath: /trade/forestry/thing/plant/ash-standard
  _speciesPath: /stuff/idea/species/plantae/tracheophyta/magnoliopsida/lamiales/oleaceae/fraxinus/excelsior
