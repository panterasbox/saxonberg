# A billhook — the coppicer's tool. It ships with the FORESTRY trade
# because the coppice is forestry's: the stool row names `cutting` as its
# harvest tool, and this is what offers it. It will take a stool off at
# the ankle and it will not take an oak — `fell` asks for `felling`.
class: /platform/thing/Tool
data:
  keywords: [billhook, bill, hook, heavy, "heavy billhook"]
  shortDescription: heavy billhook
  register: indefinite
  longDescription: >-
    A curved blade on a short handle, ground on the inside of the hook.
    One stroke takes a stool of hazel off at the ankle.
  mass: 1.1
  capabilities: ["cutting"]
  # A bladed tool — the edge is its blade's (the bill below), and the
  # whole reads as one (`analyze response billhook`).
  constructionForm: bladed
  epoch: medieval
  _materialPath: /stuff/idea/material/element/iron
  # ⭐ A blade wedged into a handle (repair D17): the edge is the blade's,
  # so `sharpen billhook` hones the blade, and a split handle is a new
  # handle, not a new hook.
  bill:
    parts:
      - { part: blade, template: /trade/smithing/thing/billhook-blade, count: 1, role: structural, material: /stuff/idea/material/element/iron, form: bladed }
      - { part: handle, template: /trade/carpentry/thing/handle, count: 1, role: structural, material: /stuff/idea/material/wood/ash }
    joints:
      - { key: hafting, method: wedged, members: [blade, handle] }

