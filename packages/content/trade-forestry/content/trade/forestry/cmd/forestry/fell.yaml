verbs: [fell]
controller: /trade/forestry/idea/cmd/forestry/FellController
description: "Fell a standard with an axe, or cross-cut a felled one"
help: |
  `fell oak` takes an oak down out of the stand you are standing in. It
  is work: it takes game time, it costs endurance, and it needs a felling
  axe — a billhook will take a stool off at the ankle and it will not
  take an oak. `fell` alone takes whatever stands here thickest.

  What comes down is the whole tree: a bole on the ground, far too much
  for any one back, logs off the crown beside it, and a seed in your
  hand. `fell bole` cross-cuts the trunk, one length of green timber at
  a time, until there is nothing left of it but the butt and the brash.

  A planted standard is felled where it stands (`fell sapling`); a
  young one comes away whole and carryable. A stand runs out — the
  wood says so in its own words — and only the years and the planting
  put it back.
examples:
  - cmd: fell oak
    note: Take a standard oak down out of the stand here
  - cmd: fell
    note: Fell whatever stands here thickest
  - cmd: fell bole
    note: Cross-cut a length of timber off a felled trunk
  - cmd: fell ash with axe
    note: Name the instrument
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  # ⚠ POLYMORPHIC, so `requires: any` — DECLARED, and it gates nothing
  # (the `boil.yaml` shape, and `lint:arg-kinds`' own word for it).
  # Three things can stand in this slot and they share no mixin: a bole
  # on the floor (cross-cut), a planted standard in a panel (felled
  # where it stands), or a bare species word that binds NOTHING, because
  # the stand is the ROOM and a room is not a bindable target — `fell
  # oak` lands as `{ stuff: null, raw: 'oak' }` and the controller reads
  # `raw` as the species against the room's stand. Naming a mixin would
  # refuse two of the three at the binder; an alternation deletes a
  # check. The controller narrows and refuses in its own words.
  - name: target
    type: object
    required: false
    scope: [reachable]
    requires: any
  # ⭐ WHICH AXE — DECLARED, not hunted for (`lint:instrument-args`).
  # Bare, the binder hands over the first reachable thing offering
  # `felling`; a billhook bound by name refuses in words.
  - name: axe
    type: object
    required: false
    prepositions: [with, using]
    default: "reachable:[capability.felling]"
    scope: ["reachable"]
    requires: [ToolMixin]
