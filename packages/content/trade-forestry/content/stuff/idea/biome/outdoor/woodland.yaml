# Outdoor woodland — under the canopy. Ships with the FORESTRY trade at
# the commons path (the base library's biome directory is a curated
# demonstrative set, pinned by its roster test; a trade ships the biome
# it stands under, as it ships the species it fells). Extends
# outdoor/baseline (the meadow's sibling): sky-exposed, so rain reaches the ground and the
# panels' soil (`SoilMixin`'s rain edge is gated on `isSkyExposed`; a
# canopy that DELAYS it is the light tail's), still air, damp, and the
# sound and smell of a wood. Light is not the biome's — each room says
# its own daylight against its own cell.
class: /platform/idea/SkyExposedBiome
extends: /stuff/idea/biome/outdoor/baseline
data:
  name: woodland
  _defaultHumidity: { value: 70, unit: "%" }
  _defaultWind: { value: 2, unit: "m/s" }
  _ambientSoundMml: "<markup>birdsong high up, and the small sounds of leaf-litter</markup>"
  _ambientSmellMml: "<markup>leaf-mould, damp bark and green wood</markup>"
