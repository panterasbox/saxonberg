# Salix alba — the white willow. Grows with its feet in the river,
# pollards and coppices freely, and its wood is the lightest and one of
# the toughest here — the bat, the basket, the withy. Dioecious. In the
# vocabulary for the wood it yields; a riverbank is where it belongs.
