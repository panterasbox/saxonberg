# Taxus baccata — the yew. The longbow's wood and nothing else's; the
# churchyard tree; two thousand years old and still setting arils.
# Dioecious. ⚠ Every part but the aril is poisonous (taxine) — that is a
# fact for the physiology build and the ranching pack's browse, not for
# the wood. In the vocabulary for the wood it yields.
