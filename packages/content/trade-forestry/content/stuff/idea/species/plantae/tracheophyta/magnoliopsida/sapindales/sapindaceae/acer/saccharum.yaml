# Acer saccharum — the sugar maple, and the climate slate's first
# consumer.
#
# A real sugar maple runs on FREEZE–THAW. Nights below freezing draw the
# sap down and build negative pressure; days above freezing push it back
# up; the cycle is literally driven by ice forming and melting in the
# xylem, and it is why sugaring is a few weeks in late winter and not a
# season.
#
# ⭐ Since the climate build that is what this row says: a `freeze-thaw`
# window, open on a game day whose AIR crossed freezing both ways at the
# tree's own place — latitude, elevation and all. So a maple low in a warm
# valley runs only in a hard cold snap, and one up a fell runs every
# spring. (Before the climate build the realm's floor was ~276 K and no
# freeze-thaw could fire ONCE, so the row carried a daylength band and a
# warmth term instead. That compromise is gone, and nothing in the kernel
# changed to remove it but the climate — `TapWindowSpec` was declared as
# data for exactly this.)
#
# ⚠ GRAIN, not law: no daylength band. The freeze-thaw IS the sugaring
# season, so a warm spell in November runs a maple too (it does). A sugar
# build that wants only the spring run adds `daylightFrom`/`daylightTo` and
# `rising: true`, which the kind still accepts.
class: /platform/idea/species/Species
data:
  binomial: Acer saccharum
  commonNames: ["maple", "sugar maple", "hard maple"]
  _bodyPlanPath: /stuff/idea/species/BodyPlan/sessile
  _parentCladePath: /stuff/idea/species/plantae
  _defaultMaterialPath: /stuff/idea/material/tissue/plant-tissue
  lifecycleStates: ["alive", "dead"]
  sexDeterminationSystem: monoecious
  reproductiveMode: sexual
  lifespanMin: 0
  lifespanMax: 300
  circadianBand: aperiodic
  diet: photosynthesis
  production:
    # ⭐ Less sap per spile than birch and far sweeter — which is the
    # whole economic difference between the two, and it lands entirely in
    # the maturation profiles' `productFraction` (maple 4%, birch 2%).
    # Two litres a game day a spile, boiled at twice the yield.
    - key: sap
      yieldRow: /stuff/idea/material/food/maple-sap
      perGameDay: 2
      behaviour: accrue
      windowDays: 4
      yieldShape: volume
      window:
        kind: freeze-thaw
  longDescription: >-
    A broad-crowned maple with grey furrowed bark and big five-lobed
    leaves that go the colour of a fire in autumn.
