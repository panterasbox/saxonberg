# Pinus sylvestris — the Scots pine. The one softwood in the vocabulary:
# straight, fast, resinous; the plank, the mast, the pit prop, and the
# kindling that lights a beech fire. Evergreen — the forestry slate's
# leaf-habit axis (`coldStopK`) is where that becomes a number. In the
# vocabulary for the wood it yields (the garden bed is made of it); no
# venue stands it yet.
class: /platform/idea/species/Species
data:
  binomial: Pinus sylvestris
  commonNames: ["pine", "Scots pine"]
  # ⭐ GUM (paint D17): cut a face through the bark with a blade, set a cup,
  # and through warm weather the oleoresin bleeds into it — a slow,
  # summer-long run. It is cut in a still to turpentine and rosin.
  production:
    - key: gum
      yieldRow: /trade/forestry/idea/material/pine-gum
      perGameDay: 0.04
      behaviour: accrue
      windowDays: 12
      yieldShape: volume
      instrument: cutting
      window:
        kind: weather
        daylightFrom: 0
        daylightTo: 1
        minK: 288
        maxK: 320
  _bodyPlanPath: /stuff/idea/species/BodyPlan/sessile
  _parentCladePath: /stuff/idea/species/plantae
  # The LIVING organism's material; the wood is the material row's fact
  # (`/stuff/idea/material/wood/pine` → `biologicalSource` → this row).
  _defaultMaterialPath: /stuff/idea/material/tissue/plant-tissue
  lifecycleStates: ["alive", "dead"]
  sexDeterminationSystem: monoecious
  reproductiveMode: sexual
  lifespanMin: 0
  lifespanMax: 300
  circadianBand: aperiodic
  diet: photosynthesis
