# Maple sap — ⭐ **almost water, and that is the whole economy.**
#
# Two per cent sugar for birch and four for maple: a pail of sap is a
# spoonful of syrup, which is why sugaring is a BOILING trade and not a
# gathering one. Every number downstream — the pan, the fuel, the hours
# — follows from that ratio being this bad, and it is the real ratio.
#
# ⚠ It SOURS, fast. `waterActivity` 0.99 and a modest activation energy:
# raw sap is sugar-water at ambient temperature and is a culture medium
# within a day or two. That is the true reason a sugarer boils the same
# day they tap, and it is modelled rather than asserted.
#
# ⭐ In the COMMONS rather than under `/trade/forestry`, for the milk
# argument: a birch gives sap whether or not anybody is sugaring. The
# SYRUP is the trade's, because somebody has to make it.
class: /platform/idea/material/ConsumableMaterial
data:
  name: maple sap
  keywords: [maple-sap, sap, maple]
  appearance: clear and thin, with the barest sweetness
  density: 1010
  specificHeat: 4100
  thermalConductivity: 0.58
  electricalConductivity: 0.3
  waterAbsorptionCapacity: 0
  hardness: 0
  toughness: 0
  edibility: true
  tastes: [sweet]
  spoilActivationEnergy: 55000
  waterActivity: 0.99
  nutrients: ["sugar", "water"]
  nutrientAmounts: { sugar: 40000, water: 970000 }
  toxicity: []
  tags: ["liquid", "food", "sap", "maple-sap", "perishable", "once-living"]
  composition: []
  biologicalSource:
    speciesPath: /stuff/idea/species/plantae/tracheophyta/magnoliopsida/sapindales/sapindaceae/acer/saccharum
    tissueType: sap
  # ⭐⭐ The boil-down (sugar D1) — the same mechanism as the sugar
  # house's copper, from much further down. A litre carries 25 g of sugar;
  # the kernel's plateau boils the water off, the boil climbs as it
  # thickens, and the arrows say what it becomes: syrup at two-thirds
  # sugar, and pushed on to the strike, maple sugar's massecuite.
  boilingPoint: 373
  latentHeatOfVaporization: 2260000
  solidsKgPerL: 0.025
  boilingPointElevation:
    - [0, 0]
    - [0.5, 1.5]
    - [0.7, 5]
    - [0.8, 10]
    - [0.85, 14]
    - [0.9, 22]
    - [0.95, 32]
    - [0.98, 50]
    - [0.99, 60]
    - [1, 70]
  concentratesTo:
    - { fromW: 0.66, becomes: /trade/forestry/idea/material/maple-syrup }
    - { fromW: 0.9, becomes: /trade/forestry/idea/material/maple-strike }
