# A felling axe — ⭐ a smith's forged head on a woodworker's helve,
# WEDGED: the by-hand joint, no heat, no anvil, no competence. Run by
# `fit felling-axe`.
#
# ⭐⭐ It used to be forged whole at the anvil from a bar and a haft, under
# MINING's discipline — the one recipe in the realm that made a woodman's
# tool out of a miner's skill. The head is the smith's part now (`forge
# axe-head`), the helve the woodworker's (`carve axe-haft`), and hanging
# one on the other is carpentry: the same rung, and the same Discipline,
# as the froe beside it. Not silviculture — that is knowing the wood
# standing, not the tool that takes it down.
