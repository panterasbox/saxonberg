# Veiling draught — the potion exemplar, and the proof of D4.
#
# A potion is a LIQUID that carries a working, so the mixin rides the
# MATERIAL rather than the flask. Everything a potion needs then falls
# out of the bulk substrate for free: decant it into another vial and it
# is still a potion (the substance moved); pour half away and you have
# half; spill it and it is gone; water it down and the dose goes with
# it. None of that is potion machinery — it is bulk machinery, and a
# potion simply IS a liquid.
#
# It carries the shipped `veil` working rather than a bespoke one, on
# purpose: an item is a new TRIGGER, never a new mechanism, and the
# whole point of wave 1 is that one authored spell serves both doors.
# Drinking this and casting veil produce the same effect from the same
# definition, with nothing duplicated.
#
# It also demonstrates D12's term-bought sustained effect: `veil` carries
# its own 1800-second lifetime, and a consumable can only ever buy a
# BOUNDED term of assertion — it pays once and is gone, so there is
# nothing left to renew the hold. That is why long-lived sustained
# effects are forged as rings and not bottled.
#
# Dose response is `graded`: half a flask veils you for half as long,
# because a graded modifier scales in DURATION. Real dose-response, and
# the reason magnitudes are authored per reference dose.
class: /obj/material/PotionMaterial
hydratorClass: /obj/persistence/PersistentHydrator
data:
  name: veiling draught
  # ⚠ NO `appearance:`, deliberately. A potion's look is DERIVED from
  # (class, generation) — see D26 — so authoring one here would be dead
  # data at best and a second, competing source of truth at worst. It
  # would also reserve those words against the descriptor banks, which
  # is how the disjointness lint caught the first draft of this file.
  keywords: [draught, potion, philtre]
  density: 1020
  thermalConductivity: 0.6
  specificHeat: 4100
  edibility: true
  nutrients: [water]
  tags: [liquid, drinkable, arcane]
  composition: []
  biologicalSource: null
  # ── the arcane half: which cell, whose making, how well it delivers ──
  carriedSpellPath: /obj/magic/Spell/veil
  deliveryEfficiency: 1
  # ── the potion half: how it gets in, and what a partial dose means ──
  route: oral
  dose:
    response: graded
    referenceLitres: 0.25
  # ── identification (D24/D26) ──
  # Identity rides the MATERIAL, so one identification covers every
  # flask of this draught.
  descriptorClass: potion
  identifiedName: a veiling draught
  # ⚠ NOT self-identifying. The features blur and the name slides off —
  # to WATCHERS. The drinker feels almost nothing, which is exactly the
  # case where you want to have bought a scroll instead. Contrast the
  # wand of firebolt, which announces itself.
  selfIdentifying: false
