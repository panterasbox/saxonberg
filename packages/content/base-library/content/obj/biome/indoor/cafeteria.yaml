# Indoor cafeteria — demonstrative leaf for the indoor sub-tree.
# Extends indoor/baseline; serves as the parent for scenario C's
# `cafeteria-atrium`, which sits next to it and explicitly extends
# it (showcasing path-decoupled inheritance).
class: /obj/Biome
hydratorClass: /obj/persistence/PersistentHydrator
data:
  name: cafeteria
  _extendsBiomePath: /obj/biome/indoor/baseline
  _ambientSoundMml: "<markup>a steady roar of voices and clattering trays</markup>"
  _ambientSmellMml: "<markup>warm bread, gravy, and coffee</markup>"
