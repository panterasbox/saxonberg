# Water — a flat bulk Material (appearance + keywords only). The
# presumed solvent for the demo's other liquids; modelled only as deep
# as the bulk substrate reads (appearance + keywords). Real formula /
# molar mass are a capacity, not a mandate — left unset until a consumer
# (chemistry, electrolysis) actually needs them.
class: /lib/material/Material
hydratorClass: /lib/persistence/PersistentHydrator
data:
  name: water
  appearance: clear water
  keywords: [water]
  density: 1000
  thermalConductivity: 0.6
  specificHeat: 4186
  # Electrical conductivity (S/m) — fresh/tap water is a poor conductor
  # (~0.01, dissolved-mineral dependent); salt water is ~500× higher.
  electricalConductivity: 0.01
  edibility: true
  nutrients: [water]
  toxicity: []
  tags: [liquid, beverage, drinkable]
  composition: []
  biologicalSource: null
