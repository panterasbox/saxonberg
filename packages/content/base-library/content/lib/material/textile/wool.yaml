# Wool — animal-fibre textile. Low conductivity (it traps air): the
# insulating cloth a warm garment is woven from. Its low
# thermalConductivity is why a wool layer authors meaningful `clo`.
class: /lib/material/Material
hydratorClass: /lib/persistence/PersistentHydrator
data:
  name: wool
  appearance: thick woven wool
  keywords: [wool]
  density: 1310
  thermalConductivity: 0.04
  # Mechanical response (materials-response): MPa / MJ·m⁻³, marshalled.
  hardness: 3
  toughness: 4
  specificHeat: 1360
  # Electrical conductivity (S/m) — dry wool insulates (~1×10⁻¹¹).
  electricalConductivity: 1.0e-11
  # Water absorbency (0..1, weather Wave 2): thirsty wool soaks and holds water — stays wet for a long time.
  absorbency: 0.9
  edibility: false
  nutrients: []
  toxicity: []
  tags: ["textile", "fibre", "organic", "insulating", "once-living"]
  composition: []
  chemistry: null
  biologicalSource: null
