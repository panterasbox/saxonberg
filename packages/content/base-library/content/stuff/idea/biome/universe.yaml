# /stuff/idea/biome/universe — the root of the biome inheritance hierarchy.
# `extends: null` (omitted). Every other biome's
# `extends` chain bottoms out here; `BiomeApi.getRootBiome()`
# returns this template. All six `_defaultX` fields are mandatory
# at boot — the chain's terminal step (step 6) consults this biome.
# `_defaultWind` is calm (0 m/s) by default; windy biomes override.
#
# ⭐ `_defaultTemperature` is NOT the temperature under the sky. Since the
# climate build a sky-exposed place whose chain falls through to here
# reads the DERIVED climate at its latitude, elevation, continentality
# and offset (BiomeLogic's temperature trace, `source: climate`), and an
# enclosed room drifts toward that same derived outside. This 295 K is
# the temperature of a place that is neither under the sky nor authored
# — an unbiomed interior, Offstage — and the chain's step 6 still
# requires it.
class: /platform/idea/Biome
data:
  name: universe
  _defaultTemperature: { value: 295, unit: K }
  _defaultPressure:    { value: 101325, unit: Pa }
  _defaultHumidity:    { value: 50, unit: "%" }
  _defaultWind:        { value: 0, unit: "m/s" }
  _defaultGravity:     { value: 9.81, unit: "m/s²" }
  # ⭐ (sugar D12, the-world slate) A third of Earth's radius, so the
  # world is a third as far to cross — the chart re-derives from it (20
  # nautical miles to the degree) and the horizon closes in by √⅓. Gravity
  # stays 9.81 above: the heavy-world postulate (a dense core) keeps a
  # person's weight what it is.
  _planetRadiusM: 2124000
  _defaultAtmosphere:  air
