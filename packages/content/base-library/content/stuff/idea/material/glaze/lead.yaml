# Lead glaze — litharge fluxing silica: it melts low and flows glossy, which
# is why every country potter used it, and it gives lead to whatever acid is
# kept against it (ceramics M7). An import line at Rejection's store; no ore
# here wins it. It shrinks more than an earthenware body on cooling, so on
# terracotta and earthenware it crazes.
#
# ⭐ A coat is not a piece: its fuse reads this row's first kinetics change —
# `rate.referenceK` fuses a wet coat, `scorchAboveK` runs it. The rung
# names the glaze itself, so the spec stays valid and changes nothing.
class: /platform/idea/material/Material
data:
  name: lead glaze
  keywords: [glaze, lead]
  appearance: a glossy, honey-amber lead glaze
  density: 2500
  specificHeat: 840
  thermalConductivity: 1.0
  electricalConductivity: 1.0e-9
  waterAbsorptionCapacity: 0
  hardness: 55
  toughness: 3
  thermalExpansion: 7.0e-6
  laysCoat: true
  coatWord: glazed
  kinetics:
    - key: fuse
      rate: { referenceK: 1250, zK: 30, fullDoseS: 1800 }
      scorchAboveK: 1400
      scorched: /stuff/idea/material/glaze/lead
      ladder:
        - { atDegree: 1, becomes: /stuff/idea/material/glaze/lead }
  # ⭐⭐ Lead leaches from the inside face into acid contents (ceramics M7),
  # and nothing you can see, smell or taste says so.
  leaches:
    - { toxin: lead-poisoning, mgPerLPerDay: 4 }
  edibility: false
  nutrients: []
  toxicity: []
  tags: ["glaze", "mineral", "vitreous"]
  composition: []
  biologicalSource: null
