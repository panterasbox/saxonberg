# Terracotta — clay fired just past the point of no return: porous,
# orange-red, soft enough to scratch with a nail. ⭐ What a clay lump BECOMES
# in a kiln (ceramics M1) — the first rung of `earth/clay`'s heat history,
# not a recipe's output. A flower pot, a plant pot, a common brick.
#
# It weeps: the pores that make it light let water through, so an unglazed
# jar sweats and keeps its water cool. Read by the porosity the heat-work
# gave it (W1).
