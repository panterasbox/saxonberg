# Clinker — clay fired past what it can bear: glassy, warped, bloated in
# places, and nearly impervious. The over-burnt brick from a clamp's fire
# channels, which is the worst brick for a wall and (roads-slate § 4) the
# best for a road: the Dutch *klinker*. ⭐ A common clay's `scorched`
# outcome — a peak too hot for the body (ceramics M1).
class: /platform/idea/material/Material
