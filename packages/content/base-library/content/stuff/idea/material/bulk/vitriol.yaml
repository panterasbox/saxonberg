# ⭐ Vitriol — the corrosion channel's second agent, and its first LIQUID.
#
# Oil of vitriol: what an alchemist distils and what will strip the skin
# from a hand and the temper from a blade. Where quicklime is the dry
# industrial caustic a medieval world has lying about, vitriol is the
# wet one an alchemist keeps in a stoppered flask — which is exactly what
# the magic-expansion needs: a caustic that pours, splashes and conjures.
#
# ⭐⭐ **Its `corrosiveTo` eats METAL as well as flesh** — the deliberate
# contrast with lime, which spares metal entirely. That single difference
# is the whole "acid eats the breastplate AND burns the arm under it"
# interop case: a steel layer is armour against lime and NO armour against
# vitriol, and the covering fold reads exactly that off this one list.
class: /platform/idea/material/Material
data:
  name: vitriol
  keywords: [vitriol, acid]
  appearance: oily, faintly fuming acid
  description: >-
    A dense, oily liquid that fumes where the air is damp. It eats what it
    touches — cloth, hide, skin, and even iron, given time — and the
    eating does not stop until it is washed away.
  density: 1840
  thermalConductivity: 0.4
  specificHeat: 1380
  tags: [liquid, caustic, acid]
  # ⭐ The strongest acid in the world (review R2-B4): what a glazed face
  # leaches by. A lead glaze gives lead into vitriol faster than into
  # vinegar (0.9) — `lint:acidity` holds every `acid` row to a number.
  acidity: 1
  # ⭐ What it washes as (cleanliness B50): the wash reads this row,
  # loaded with the material — never a search of cleansers by tag.
  cleanser: /platform/idea/Cleanser/vitriol
  # ⭐ (rubber build) No coarse `organic`: rubber and ebonite ARE organic,
  # and acid does not eat them — so the list names what it really attacks.
  # `once-living` is the biological-origin tag every caught row carries;
  # every shipped corrosion outcome is unchanged except the elastomers'.
  corrosiveTo: [metal, tissue, leather, textile, once-living]
  composition: []
  biologicalSource: null
