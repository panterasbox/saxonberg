# Coal tar — ⭐⭐ **the most historically loaded substance in this pack.**
#
# It was the waste of the gasworks: a filthy by-product the works paid to
# get rid of, poured into rivers by the thousands of gallons. Then
# somebody fractionated it, and out came benzene, phenol, aniline, the
# first synthetic dyes, the first antiseptics, and — through the dye
# industry's chemists — organic chemistry itself as a discipline.
#
# ⭐ That is why the retort FEEDS the knowledge ladder rather than waiting
# on it: coal tar is the feedstock the laws were theorised FROM. A player
# makes it by a medieval act (cook coal in a pot) and what it unlocks is
# the industrial epoch.
#
# ⚠ Nothing refines it yet. The cuts rung — heads, hearts, tails over a
# `FractionSchedule` — is the distiller's, and refining coal tar is the
# same mechanism with a different feedstock. Said here so the gap is a
# recorded seam and not a silence.
