# Salt water — seawater / brine. The dissolved ions make it a far better
# conductor than fresh water (~5 S/m, ~500×), the cheap teachable for why
# the flooded cell is lethal. ⭐ And it is not water you can drink
# (underwater D29 seam 4): it carries more salt than a body can shed, so
# drinking it makes you thirstier — the `salt` toxin's condition draws on
# hydration — and enough of it makes you ill.
class: /platform/idea/material/Material
data:
  name: salt water
  keywords: [water, brine, "salt water", saltwater, seawater, salt]
  appearance: clear brine
  density: 1025
  thermalConductivity: 0.6
  specificHeat: 3990
  # Electrical conductivity (S/m) — seawater, ~5 (dissolved-ion driven;
  # ~500× fresh water). The reason a shorted pool is deadly.
  electricalConductivity: 5
  edibility: false
  nutrients: []
  # ~35 g of salt a liter: the toxin dose per liter drunk.
  toxicity:
    - { type: salt, amount: 35 }
  # ⭐ How acid it is, 0..1 (ceramics M7) — what draws lead from a glaze.
  acidity: 0.05
  tags: [liquid, brine, conductive]
  # ⭐⭐ Crystallizing (ceramics S17). Sea water carries about 35 g of salt
  # a liter; a liter of brine holds about 316 g of it at freezing and only
  # 329 g at the boil — salt barely cares about heat, which is why salt is
  # made by taking the WATER away (the pan in the sun, the hearth) and never
  # by cooling. Past saturation the excess sets as crystals; the liquor left
  # when the pan is done is bittern, and it runs off below.
  solidsKgPerL: 0.035
  solubility: [[273, 0.316], [293, 0.317], [373, 0.329]]
  crystallizesTo:
    product: /stuff/idea/material/food/salt
    residue: /stuff/idea/material/bulk/bittern
  composition: []
  biologicalSource: null
