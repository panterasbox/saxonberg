# Salt water — seawater / brine. The dissolved ions make it a far better
# conductor than fresh water (~5 S/m, ~500×), the cheap teachable for why
# the flooded cell is lethal. ⭐ And it is not water you can drink
# (underwater D29 seam 4): it carries more salt than a body can shed, so
# drinking it makes you thirstier — the `salt` toxin's condition draws on
# hydration — and enough of it makes you ill.
class: /platform/idea/material/Material
data:
  name: salt water
  keywords: [water, brine, "salt water", saltwater, seawater, salt]
  appearance: clear brine
  density: 1025
  thermalConductivity: 0.6
  specificHeat: 3990
  # Electrical conductivity (S/m) — seawater, ~5 (dissolved-ion driven;
  # ~500× fresh water). The reason a shorted pool is deadly.
  electricalConductivity: 5
  edibility: false
  nutrients: []
  # ~35 g of salt a litre: the toxin dose per litre drunk.
  toxicity:
    - { type: salt, amount: 35 }
  tags: [liquid, brine, conductive]
  composition: []
  biologicalSource: null
