# Air — a flat bulk Material for the carried-air supply (the scuba tank).
# Modelled only as deep as the bulk substrate + respiration tap read:
# the interior bulk of an air tank is this material, and the respiration
# driver taps a worn tank whose interior material name is in the body's
# breathable set (`air`). Not breathable-as-food; a gas.
class: /platform/idea/material/Material
data:
  name: air
  keywords: [air]
  appearance: compressed air
  density: 1.225
  # ⭐ Air is a gas because it boils at 79 K, not because a tag says so.
  # `requiredClosureFor` compares a material's boiling point against the
  # standard ambient, which is how phase stays a consequence of the
  # material and where you are rather than an authored field.
  boilingPoint: 79
  # Electrical conductivity (S/m) — dry air is a near-perfect insulator
  # (~1×10⁻¹⁴); breakdown/arcing is out of v1 scope.
  electricalConductivity: 1.0e-14
  edibility: false
  nutrients: []
  toxicity: []
  tags: [gas, breathable]
  composition: []
  biologicalSource: null
