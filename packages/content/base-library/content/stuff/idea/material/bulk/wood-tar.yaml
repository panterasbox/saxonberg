# Wood tar — ⭐ what a clamp throws away and a retort keeps.
#
# Cook wood in a closed chamber and the carbon stays behind as charcoal
# while everything else leaves: a black, sticky, resinous liquid that has
# been the sealant of every wooden boat and rope in history. ⚠ The clamp
# has been making this and venting it for the whole life of the pack —
# that is what the smoke coming out of a charcoal burn IS.
#
# ⭐ `purifiedByBoiling` is the shipped arrow between two authored
# materials, so boiling tar down to pitch needs no new mechanism and no
# verb of its own: hold the tar at its boil for a minute (set it on a
# fire — `heat`, or its alias `boil`) and the phase engine swaps it. The
# word *purified* is a stretch (you are driving off the light fraction,
# not cleaning it) — recorded as a seam rather than worked around.
# ⭐ The latent heat is what makes the boil a PLATEAU (the light fraction
# — turpentine and its kin, ~300 kJ/kg): without one, the phase engine
# flashes a liquid to vapour the instant it reaches its boiling point and
# there would be no tar left to become pitch. The volume does reduce
# while it boils, which is what boiling tar down IS.
class: /platform/idea/material/Material
data:
  name: wood tar
  keywords: [tar, "wood tar", stockholm]
  appearance: a black, sticky, resinous liquid
  density: 1100
  specificHeat: 1800
  thermalConductivity: 0.17
  boilingPoint: 520
  latentHeatOfVaporization: 300000
  heatOfCombustion: 36
  autoignitionTemperature: 680
  purifiedByBoiling: /stuff/idea/material/bulk/pitch
  edibility: false
  nutrients: []
  toxicity: []
  tags: [bulk, organic, flammable, tar, once-living, waterproofing]
  # ⭐ A coat (cordage D13′): dipped hot, it sets on the face as it cools, and
  # keeps the water out of what it coats — a tarred rope does not rot.
  laysCoat: true
  coatWord: tarred
  composition: []
  biologicalSource: null
