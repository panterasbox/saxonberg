# Saltpeter liquor — ⭐ a strong hot liquor of saltpeter, the row that sets
# by COOLING (ceramics S17).
#
# Boiled down from a niter bed's leachings, it holds about 0.9 kg of
# saltpeter a liter — clear at the boil, where a liter holds over a
# kilogram, and far past what it can keep at room heat (under 0.3 kg). Let
# it cool in a tub and the excess sets as needles; what is left is still a
# saturated liquor of the same stuff, which goes back to the next boil
# (`residue` names the liquor itself).
#
# ⚠ The curve is approximate — kg per liter of SOLUTION, from the textbook
# grams-per-100-g-of-water table. Its SHAPE is the lesson: steep where
# salt's is flat.
