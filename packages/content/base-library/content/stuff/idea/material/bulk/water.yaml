# Water — a flat bulk Material (appearance + keywords only). The
# presumed solvent for the demo's other liquids; modelled only as deep
# as the bulk substrate reads (appearance + keywords). Real formula /
# molar mass are a capacity, not a mandate — left unset until a consumer
# (chemistry, electrolysis) actually needs them.
class: /platform/idea/material/Material
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: water
  appearance: clear water
  keywords: [water]
  density: 1000
  thermalConductivity: 0.6
  specificHeat: 4186
  # Electrical conductivity (S/m) — fresh/tap water is a poor conductor
  # (~0.01, dissolved-mineral dependent); salt water is ~500× higher.
  electricalConductivity: 0.01
  # Phase change (thermal): freezes at 273 K, boils at 373 K; the latent
  # heats are the reserve-clamp plateaus (fusion 334 kJ/kg, vaporization
  # 2.26 MJ/kg). Unlocks ice → water → steam for free.
  meltingPoint: 273
  latentHeatOfFusion: 334000
  boilingPoint: 373
  latentHeatOfVaporization: 2260000
  edibility: true
  nutrients: [water]
  toxicity: []
  # ⭐ `water` is the IDENTITY tag — what engine logic asks for when it
  # needs water (rinsing at a basin, the archetype's water-source slot).
  # It is authored here because identity lives on the Material, never on
  # a keyword: see docs/antipatterns.md § Keywords Where You Mean
  # Identity. `salt-water` deliberately does NOT carry it — brine is not
  # rinse water, and the check that wants "any liquid" should ask for
  # `liquid`.
  tags: [liquid, water, beverage, drinkable]
  composition: []
  biologicalSource: null
