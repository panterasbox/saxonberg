# Clay mineral — kaolinite and illite, the plate-shaped silicates that make a
# clay a CLAY: wet, they slide over each other on a film of water, which is
# plasticity; fired, they fuse. ⭐ A clay is a COMPOSITION (ceramics M3) and
# this is the constituent its plasticity is read from — a fat clay is rich in
# it, a lean one is mostly sand. A commons row because base-library's own
# `earth/clay` names it (R4).
class: /platform/idea/material/Material
data:
  name: clay mineral
  keywords: [kaolinite, illite, "clay mineral"]
  appearance: fine, greasy white-grey clay substance
  density: 2600
  specificHeat: 900
  thermalConductivity: 1.2
  electricalConductivity: 1.0e-4
  waterAbsorptionCapacity: 40
  hardness: 3
  toughness: 1
  edibility: false
  nutrients: []
  toxicity: []
  tags: ["mineral", "silicate", "clay-mineral", "plastic"]
  composition: []
  biologicalSource: null
