# Uranium — U, atomic number 92. Naturally-occurring radioactive
# actinide. Predominantly uranium-238 in natural abundance (~99.27%);
# this template models that majority isotope's behavior. Half-life
# 4.468 billion years (≈ Earth's age), alpha-emitting, decays into
# thorium-234. The decay product cross-reference is left null in v1
# until thorium content is authored — content extends by adding
# `/stuff/idea/material/element/thorium` and pointing this template's
# `_decayProductPath` at it.
#
# This template is the demonstration of `RadioactivityMixin` — only
# materials whose nuclei genuinely undergo spontaneous decay are a
# `RadioactiveMetal` (a toxic elemental metal that also decays); other
# elements are `ElementalMetal`, `ToxicMetal` or `NonMetal`.
class: /platform/idea/material/RadioactiveMetal
data:
  name: uranium
  keywords: [uranium]
  density: 19050
  specificHeat: 116
  thermalConductivity: 27
  tags: ["element", "metal", "actinide", "radioactive", "heavy"]
  symbol: U
  atomicNumber: 92
  molarMass: 238.029
  halfLife: 4.468e9
  decayMode: alpha
