# Carbon — C, atomic number 6. Non-metallic element underlying all
# organic chemistry. v1's carbon is the generic stand-in: density and
# hardness vary wildly between allotropes (graphite vs diamond), so
# the values here are mid-range. Allotrope-specific carbon
# (`/stuff/idea/material/element/carbon-graphite`, `.../carbon-diamond`) is a
# content extension when content needs the distinction.
class: /platform/idea/material/NonMetal
data:
  name: carbon
  keywords: [carbon]
  density: 2200
  specificHeat: 710
  thermalConductivity: 130
  # ⚠ Mechanical response (materials-response): MPa / MJ·m⁻³. Unauthored
  # until this build, and carbon is now a constituent something asks
  # about (`Alloyed.getEffectiveComposition`). Mid-range between the
  # allotropes and deliberately BRITTLE — graphite crumbles, diamond
  # shatters, and neither of them bends.
  hardness: 50
  toughness: 5
  tags: ["element", "non-metal", "organic-base"]
  symbol: C
  atomicNumber: 6
  molarMass: 12.011
