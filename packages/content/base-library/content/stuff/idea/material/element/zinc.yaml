# Zinc — Zn, atomic number 30. A bluish-white metal that is brittle cold
# and malleable warm, and boils at a temperature a copper smelter passes on
# the way up — which is why brass was made by cementation for centuries:
# zinc ore and copper heated together under charcoal, the zinc vapor
# soaking into the copper before it could get away. Here for what it does
# in BRASS (ceramics W7): a third part of it turns copper gold-coloured and
# harder, and lowers the melt by a hundred and fifty degrees.
