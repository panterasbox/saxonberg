# Rubberized cloth — woven cloth faced with a skin of rubber: the
# mackintosh's cloth, the waterproof cover, the gas bladder's skin.
#
# ⚠ It carries RUBBER's tags (organic · elastomer · insulating · polymer),
# NOT linen's `cellulose`/`once-living` — the rubber face is what anything
# touching it meets, so vitriol and the cleanser do not eat it. And its
# water absorption is rubber's: it takes in nothing (the wet law reads it
# impermeable), which is why rain runs off it.
