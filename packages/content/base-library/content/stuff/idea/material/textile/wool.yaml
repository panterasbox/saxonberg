# Wool — animal-fibre textile. Low conductivity (it traps air): the
# insulating cloth a warm garment is woven from. Its low
# thermalConductivity is why a wool layer authors meaningful `clo`.
class: /platform/idea/material/Material
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: wool
  # ⚠ A material must not assert a CONSTRUCTION — `woven` is a form a
  # garment carries, not something wool IS. Wool is also felted, knitted
  # and fulled, and the row said none of those were possible.
  appearance: soft springy wool
  keywords: [wool]
  density: 1310
  thermalConductivity: 0.04
  # Mechanical response (materials-response): MPa / MJ·m⁻³, marshalled.
  hardness: 3
  toughness: 4
  specificHeat: 1360
  # Electrical conductivity (S/m) — dry wool insulates (~1×10⁻¹¹).
  electricalConductivity: 1.0e-11
  # Water absorption capacity (% of dry mass, ASTM D570): wool holds ~a third of its weight in water.
  waterAbsorptionCapacity: 33
  edibility: false
  nutrients: []
  toxicity: []
  # ⚠ `protein` is load-bearing, not decoration: a protein fibre takes a
  # metal mordant DIRECTLY, where cellulose needs a tannin pre-mordant
  # first. It is why wool was the coloured cloth and linen was not.
  tags: ["textile", "fibre", "organic", "protein", "insulating", "once-living"]
  composition: []
  chemistry: null
  biologicalSource: null
