# Wool — animal-fibre textile. Low conductivity (it traps air): the
# insulating cloth a warm garment is woven from. Its low
# thermalConductivity is why a wool layer authors meaningful `clo`.
class: /platform/idea/material/Material
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: wool
  appearance: thick woven wool
  keywords: [wool]
  density: 1310
  thermalConductivity: 0.04
  # Mechanical response (materials-response): MPa / MJ·m⁻³, marshalled.
  hardness: 3
  toughness: 4
  specificHeat: 1360
  # Electrical conductivity (S/m) — dry wool insulates (~1×10⁻¹¹).
  electricalConductivity: 1.0e-11
  # Water absorption capacity (% of dry mass, ASTM D570): wool holds ~a third of its weight in water.
  waterAbsorptionCapacity: 33
  edibility: false
  nutrients: []
  toxicity: []
  tags: ["textile", "fibre", "organic", "insulating", "once-living"]
  composition: []
  chemistry: null
  # ⭐⭐ It came off a SHEEP, and it says so. This row shipped with
  # `biologicalSource: null` and a scutching controller deliberately
  # written so that naming a flax row in it would have been *the one line
  # that stops wool* — the faucet the farmstead build exists to close.
  biologicalSource:
    speciesPath: /stuff/idea/species/animalia/chordata/mammalia/artiodactyla/bovidae/ovis/aries
    tissueType: fleece
