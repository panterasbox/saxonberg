# Maple — hard, close-grained, and it takes a surface nothing else does.
#
# Dense and very hard for a broadleaf (near oak, harder than beech) with
# a grain so fine it finishes glassy — a butcher's block, a plane body, a
# floor, the back of an instrument. It has no decay resistance worth the
# name, so like birch it is an indoor wood.
#
# Which substrate reads which number: `density` → the mass a bole and a
# length of timber are minted at; `hardness` / `toughness` →
# materials-response; `waterAbsorptionCapacity` → wetness;
# `autoignitionTemperature` + `heatOfCombustion` → the fire driver;
# `thermalConductivity` / `specificHeat` → thermal.
#
# ⚠ As with birch, the wood is not the point of the tree: the sap is
# (`/stuff/idea/material/food/maple-sap`), and that is the species row's.
class: /platform/idea/material/Material
data:
  name: maple
  keywords: [maple]
  density: 705
  specificHeat: 1900
  thermalConductivity: 0.16
  electricalConductivity: 1.0e-4
  waterAbsorptionCapacity: 35
  autoignitionTemperature: 560
  heatOfCombustion: 17.5
  # ⭐ What burning it leaves in the grate (cleanliness D24) — the
  # lye-maker's ash.
  ashFraction: 0.01
  # ⭐ The share of that ash which is alkali (potash D1) — what a lye
  # leaches out of it. Grain: an author's numbers, broadleaves strong,
  # conifers weak.
  alkaliShare: 0.15
  hardness: 45
  toughness: 70
  edibility: false
  nutrients: ["cellulose"]
  toxicity: []
  tags: ["wood", "mixture", "organic", "flammable", "once-living"]
  composition: []
  # ⭐ Seasoning (assembly D2): game-days for a 25 mm board to dry in
  # good air, and how much it shrinks getting there — what makes work
  # done green move. Grain: an author's numbers.
  seasoningDays: 300
  greenShrinkage: 0.09
  # How cleanly it opens along its grain under a froe (plan D17) — close and wavy-grained — a turner's wood, not a cleaver's.
  cleavability: 0.45
  biologicalSource:
    speciesPath: /stuff/idea/species/plantae/tracheophyta/magnoliopsida/sapindales/sapindaceae/acer/saccharum
    tissueType: wood
