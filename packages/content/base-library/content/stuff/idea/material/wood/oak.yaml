# Oak — dense hardwood. Flammable, opaque, organic. Standard wood
# for tool handles, doors, and furniture.
#
# Composition is biological: cellulose (~45%), lignin (~25%), water
# (~10%), with hemicelluloses, extractives, and ash making up the
# rest. v1 leaves `composition` empty pending compound templates
# (`/stuff/idea/material/compound/cellulose`, `.../lignin`); the `wood` and
# `mixture` tags carry the gist meanwhile. `biologicalSource` names the
# tree (the forestry trade's Quercus robur); the species row names its
# LIVING material (plant tissue) — the wood is what is left when it is
# felled, and `density` is what a bole is minted at.
class: /platform/idea/material/Wood
data:
  # ⭐ Decomposition: what breaks it down in its surroundings (progress per game year at a driver of 1).
  degradation: { rot: { perYear: 0.02 }, mold: { perYear: 0.04 } }
  smells: [{ aroma: /base-library/aromas/oak, strength: 2 }]
  burning: [{ aroma: /base-library/aromas/smoke/wood-smoke, strength: 300 }]
  name: oak
  keywords: [oak]
  density: 750
  specificHeat: 2000
  thermalConductivity: 0.17
  # Electrical conductivity (S/m) — dry wood is a poor conductor (~1×10⁻⁴).
  electricalConductivity: 1.0e-4
  # Water absorption capacity (% of dry mass, ASTM D570): wood at its fibre-saturation point.
  waterAbsorptionCapacity: 28
  # Fire (combustion driver): wood ignites at ~570 K and releases ~16 MJ/kg.
  # Wood chars rather than melts — no melting/boiling point.
  autoignitionTemperature: 570
  heatOfCombustion: 16
  # ⭐ What burning it leaves in the grate (cleanliness D24) — the
  # lye-maker's ash.
  ashFraction: 0.01
  # ⭐ The share of that ash which is alkali (potash D1) — what a lye
  # leaches out of it. Grain: an author's numbers, broadleaves strong,
  # conifers weak.
  alkaliShare: 0.15
  # ⚠⚠ Mechanical response (materials-response): MPa / MJ·m⁻³. Oak
  # authored NEITHER until this build, and it is the oak WASTER's
  # material — the practice sword the combat gym benches bruises with.
  # Once material height enters delivery, an unauthored waster delivers
  # at the floor on every channel, and `waster-spar.test.ts` asserts its
  # blows still raise contusions. Soft (it is wood) but genuinely tough:
  # a hardwood bends and splinters where a casting shatters, which is
  # the whole reason a waster is made of it.
  hardness: 40
  toughness: 60
  # ⭐ (faces.md § The wall's exchange — the charred coat) Three figures oak had never authored, now
  # that a charred-oak row inherits them: it grows about 5 × 10⁻⁶ per kelvin
  # along the grain, keeps about 60 % of its strength wet (green timber
  # against seasoned), and gives about 1 % before it breaks.
  thermalExpansion: 0.000005
  wetStrength: 0.6
  elasticity: 1
  # ⭐ `absorbent` (matter-model-overlaps D11): an unglazed oak wall soaks
  # up a share of what it holds and gives it back to the next fill — the
  # cask that held whiskey makes water taste of whiskey.
  tags: ["wood", "mixture", "organic", "flammable", "once-living", "absorbent"]
  # ⭐⭐ What an oak wall GIVES a liquid it holds (Extraction, D11), mg/L at
  # full give over `faces.wallGiveDays`: the lactones and a little vanillin
  # off the lignin. It was the plain cask's figures; it is the wood's now,
  # so every oak thing that holds a liquid gives oak — a cask, a hopper's
  # lye, a pail. Calibrated against the thresholds: oak 0.07 mg/L, so 25
  # reads clearly; vanilla 0.1, so 3 reads faintly.
  imparts:
    - { type: /base-library/aromas/oak, amount: 25 }
    - { type: /base-library/aromas/vanilla, amount: 3 }
  # ⭐ Seasoning (assembly D2): game-days for a 25 mm board to dry in
  # good air, and how much it shrinks getting there — what makes work
  # done green move. Grain: an author's numbers.
  seasoningDays: 365
  greenShrinkage: 0.1
  # How cleanly it opens along its grain under a froe (plan D17) — the stave and the shingle: straight, and it opens the whole length.
  cleavability: 0.9
  biologicalSource:
    speciesPath: /stuff/idea/species/plantae/tracheophyta/magnoliopsida/fagales/fagaceae/quercus/robur
    tissueType: wood
  # ⭐⭐ Charcoal is this wood's transition (ceramics ruling A): held hot
  # where a flame CANNOT burn — a turfed clamp, a shut retort, below
  # `fire.air.flamingCompleteness` — it cooks its volatiles out and keeps a
  # quarter of its mass as carbon. Starved too far (too cool) it only gets
  # to brands; given air it catches and burns to ash instead. One rule.
  kinetics:
    - key: char
      rate: { referenceK: 650, zK: 40, fullDoseS: 90000 }
      massRetained: 0.25
      requiresStarvedAir: true
      volatiles:
        - { material: /stuff/idea/material/bulk/wood-tar, litresPerKg: 0.08 }
      ladder:
        - { atDegree: 0.08, becomes: /stuff/idea/material/organic/half-burnt-wood, describes: half-burnt }
        - { atDegree: 0.8, becomes: /stuff/idea/material/organic/charcoal, describes: charred }
      discipline: colliery
