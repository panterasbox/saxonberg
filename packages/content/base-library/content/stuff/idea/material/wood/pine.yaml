# Pine — light, soft, resinous. Lights first and burns hottest.
#
# The numbers that make it so: the LOWEST `autoignitionTemperature` of
# the eight and the HIGHEST `heatOfCombustion` — the resin. A pine
# kindles a fire that a beech then holds. Soft (`hardness` 22: it marks
# under a fingernail, and a pine floor shows every chair), low toughness,
# and straight-grained (`cleavability` 0.8 — it splits straight and
# easily: the plank, the mast, the pit prop),
# and cheap, because a conifer is straight and fast. The one softwood in
# the vocabulary, and the garden bed is made of it.
#
# Which substrate reads which number: `density` → the mass a bole and a
# length of timber are minted at (forestry's `fell`); `hardness` /
# `toughness` → materials-response (a haft, a waster, a bow);
# `waterAbsorptionCapacity` → wetness; `autoignitionTemperature` +
# `heatOfCombustion` → the fire driver (a log in a hearth, a charge in a
# clamp); `thermalConductivity` / `specificHeat` → thermal.
# `biologicalSource` names the tree; the species row names its LIVING
# material (plant tissue) — the wood is what is left when it is felled.
class: /platform/idea/material/Material
data:
  name: pine
  keywords: [pine, deal, softwood]
  density: 510
  specificHeat: 2000
  thermalConductivity: 0.12
  electricalConductivity: 1.0e-4
  waterAbsorptionCapacity: 35
  autoignitionTemperature: 540
  heatOfCombustion: 18
  # ⭐ What burning it leaves in the grate (cleanliness D24) — the
  # lye-maker's ash.
  ashFraction: 0.005
  hardness: 22
  toughness: 30
  edibility: false
  nutrients: ["cellulose"]
  toxicity: []
  tags: ["wood", "mixture", "organic", "flammable", "once-living"]
  composition: []
  chemistry: null
  # ⭐ Seasoning (assembly D2): game-days for a 25 mm board to dry in
  # good air, and how much it shrinks getting there — what makes work
  # done green move. Grain: an author's numbers.
  seasoningDays: 180
  greenShrinkage: 0.07
  # How cleanly it opens along its grain under a froe (plan D17) — straight and soft — the plank, the mast, the pit prop.
  cleavability: 0.8
  biologicalSource:
    speciesPath: /stuff/idea/species/plantae/tracheophyta/pinopsida/pinales/pinaceae/pinus/sylvestris
    tissueType: wood
  # ⭐⭐ Charcoal is this wood's transition (ceramics ruling A): held hot
  # where a flame CANNOT burn — a turfed clamp, a shut retort, below
  # `fire.air.flamingCompleteness` — it cooks its volatiles out and keeps a
  # quarter of its mass as carbon. Starved too far (too cool) it only gets
  # to brands; given air it catches and burns to ash instead. One rule.
  heatTransitions:
    - key: char
      referenceK: 650
      zK: 40
      fullDoseS: 90000
      massRetained: 0.25
      requiresStarvedAir: true
      volatiles:
        - { material: /stuff/idea/material/bulk/wood-tar, litresPerKg: 0.08 }
      ladder:
        - { atDegree: 0.08, becomes: /stuff/idea/material/organic/half-burnt-wood, describes: half-burnt }
        - { atDegree: 0.8, becomes: /stuff/idea/material/organic/charcoal, describes: charred }
      discipline: colliery
