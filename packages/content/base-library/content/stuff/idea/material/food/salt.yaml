# Salt — ⭐⭐ **moved to the COMMONS by the extraction build, and the move is
# the argument.**
#
# It lived in `trade-cooking` because cooking was the only trade that had one.
# Then quarrying gave it three honest sources — a rock-salt face you cut,
# pans the sun works, brine you boil — and **salt exists whether or not
# anybody cooks**, which is the rule fishing stated for a trout. A material a
# quarry wins cannot belong to the kitchen that happens to buy it.
#
# ⚠ A template-path rename ⇒ **drop the dev DB**. No migration, ever.
#
# Salt — the pantry's (base-library has only salt-WATER). Tag `salt`: the rim of a margarita.
class: /platform/idea/material/ConsumableMaterial
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: salt
  keywords: [salt]
  appearance: "coarse white salt"
  density: 2160
  thermalConductivity: 0.6
  specificHeat: 880
  edibility: true
  # ⭐ The basic tastes (closed five-word set). Nothing authors what a
  # DISH tastes like — `taste` derives that from what went in, projected
  # through the taster's own palate. See docs/subsystems/crafting.md.
  # ⭐ The ur-taste, and the one every cook reaches for first.
  tastes: [salty]
  # ⭐ Spoilage (docs/subsystems/spoilage.md): the microbial growth rate is
  # `μ_max · f_T(T) · f_aw(a_w)`. `spoilActivationEnergy` (J/mol) is how
  # steeply this food answers to warmth; `waterActivity` is how much of its
  # water a microbe can actually use. Under the 0.60 floor nothing grows.
  # ⭐ Salt is the ur-preservative and it is one number: a_w 0.15, far under
  # the 0.60 growth floor. It does not keep because it is salt; it keeps
  # because there is no available water in it — and that is exactly why
  # salting other food works too.
  spoilActivationEnergy: 60000
  waterActivity: 0.15
  toxicity:
    []
  tags: ["solid", "food", "salt", "seasoning"]
  composition: []
  biologicalSource: null
