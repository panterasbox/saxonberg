# Malt — barley steeped, sprouted and kiln-dried: the brewer's and the
# distiller's fermentable starch. A SHARED input whose owning trade
# does not exist yet, so it lives in the commons (the salt/coffee
# direction of travel — fermentation D10): when a malting trade earns
# its pack (the vocations demand test), the material moves out with it.
# The mash recipes match the `malt` tag; the sack that carries it at
# the distributor is `/trade/distribution/thing/malt-sack`.
class: /platform/idea/material/ConsumableMaterial
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: malt
  appearance: pale malted barley, dusty and sweet-smelling
  keywords: [malt, "malted barley", grain]
  density: 600
  thermalConductivity: 0.4
  specificHeat: 1800
  edibility: true
  # ⭐ The basic tastes (closed five-word set). Nothing authors what a
  # DISH tastes like — `taste` derives that from what went in, projected
  # through the taster's own palate. See docs/subsystems/crafting.md.
  tastes: [sweet]
  # ⭐ Spoilage (docs/subsystems/spoilage.md): the microbial growth rate is
  # `μ_max · f_T(T) · f_aw(a_w)`. `spoilActivationEnergy` (J/mol) is how
  # steeply this food answers to warmth; `waterActivity` is how much of its
  # water a microbe can actually use. Under the 0.60 floor nothing grows.
  # Kilned grain sits FAR under the growth floor (0.60): malt keeps for a
  # year in a dry sack, and the reason is the drying, not a keeping flag.
  spoilActivationEnergy: 50000
  waterActivity: 0.45
  nutrients: [carb, sugar]
  nutrientAmounts:
    carb: 14000
    sugar: 80
  tags: [solid, food, grain, malt]
  composition: []
  biologicalSource: null
