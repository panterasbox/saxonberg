# A trail ration — wholesome preserved field food (the sound counterpart to
# `spoiled-ration`): edible, carbohydrate-dense for satiation, no toxin
# burden. Eating a ration routes its carbs to satiation via the digestion
# pool. The per-serving amount is declared here; the metabolism rates live on
# the driver, not the food.
class: /platform/idea/material/ConsumableMaterial
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: trail ration
  appearance: dense, plain, keeping food — biscuit and dried meat
  keywords: [ration, food, trail, rations]
  density: 850
  thermalConductivity: 0.3
  specificHeat: 2500
  edibility: true
  # ⭐ The basic tastes (closed five-word set). Nothing authors what a
  # DISH tastes like — `taste` derives that from what went in, projected
  # through the taster's own palate. See docs/subsystems/crafting.md.
  # Salt is what preserved it, and salt is what you taste.
  tastes: [salty]
  # ⭐ Spoilage (docs/subsystems/spoilage.md): the microbial growth rate is
  # `μ_max · f_T(T) · f_aw(a_w)`. `spoilActivationEnergy` (J/mol) is how
  # steeply this food answers to warmth; `waterActivity` is how much of its
  # water a microbe can actually use. Under the 0.60 floor nothing grows.
  # ⭐ A ration is preserved food sitting JUST over the growth floor —
  # hard-dried and salted down to a_w ≈ 0.64, so it spoils perhaps a
  # tenth as fast as fresh meat. That margin is the whole craft of
  # provisioning, and it is one number.
  spoilActivationEnergy: 55000
  waterActivity: 0.64
  nutrients: [carb]
  nutrientAmounts:
    carb: 40000
  tags: [food, preserved]
  composition: []
  biologicalSource: null
