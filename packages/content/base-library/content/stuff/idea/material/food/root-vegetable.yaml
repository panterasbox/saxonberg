# A root vegetable — raw cooking stock (turnip, carrot, whatever the
# pantry has). Edible raw in a pinch; its worth is what a pot makes of
# it. The cooking branch's staple input, matched by the `vegetable` tag.
class: /platform/idea/material/ConsumableMaterial
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: root vegetable
  appearance: knobbly root vegetables, earth still on them
  keywords: [vegetable, root, roots, turnip, veg]
  density: 700
  thermalConductivity: 0.5
  specificHeat: 3500
  edibility: true
  # ⭐ The basic tastes (closed five-word set). Nothing authors what a
  # DISH tastes like — `taste` derives that from what went in, projected
  # through the taster's own palate. See docs/subsystems/crafting.md.
  # Roots sweeten as they cook; raw they barely read at all.
  tastes: [sweet]
  # ⭐ Spoilage (docs/subsystems/spoilage.md): the microbial growth rate is
  # `μ_max · f_T(T) · f_aw(a_w)`. `spoilActivationEnergy` (J/mol) is how
  # steeply this food answers to warmth; `waterActivity` is how much of its
  # water a microbe can actually use. Under the 0.60 floor nothing grows.
  # Roots keep better than meat — a lower activation energy means a
  # flatter answer to warmth, which is why a cellar works for turnips.
  spoilActivationEnergy: 60000
  waterActivity: 0.97
  nutrients: [carb]
  nutrientAmounts:
    carb: 17000
  tags: [food, vegetable, raw]
  composition: []
  biologicalSource: null
