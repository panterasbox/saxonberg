# ⭐ Offal — the organ meat every butchered carcass has always produced
# and nothing has ever yielded. The word appeared only in a controller's
# comment and its help text; there was no row and no material.
#
# ⚠ It spoils FASTER than muscle, which is the honest fact and also the
# one that makes it interesting: offal is what you feed an animal today
# because it will not keep until tomorrow. A higher activation energy
# means it answers more steeply to warmth.
class: /platform/idea/material/Flesh
data:
  smells: [{ aroma: /base-library/aromas/offal, strength: 300 }]
  name: offal
  keywords: [offal, organ, liver, lights, pluck]
  appearance: dark wet offal
  density: 1060
  thermalConductivity: 0.47
  specificHeat: 3300
  tastes: [{ type: umami, amount: 3 }, { type: bitter, amount: 0.02 }]
  # Faster than muscle: more available water, more enzyme, less structure.
  spoilActivationEnergy: 92000
  waterActivity: 0.99
  nutrients: [protein]
  nutrientAmounts:
    protein: 21000
  tags: [food, meat, offal, raw]
