# Stew meat — butcher's cuts for the pot. Edible (you could choke it
# down raw) but meant to be cooked; the cooking branch's protein input,
# matched by the `meat` tag.
class: /platform/idea/material/ConsumableMaterial
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: stew meat
  appearance: dark trimmed cuts of stew meat
  keywords: [meat, cut, cuts]
  density: 1050
  thermalConductivity: 0.45
  specificHeat: 3200
  edibility: true
  # ⭐ The basic tastes (closed five-word set). Nothing authors what a
  # DISH tastes like — `taste` derives that from what went in, projected
  # through the taster's own palate. See docs/subsystems/crafting.md.
  # Meat is the umami one — that is what a stock is FOR.
  tastes: [umami]
  # ⭐ Spoilage (docs/subsystems/spoilage.md): the microbial growth rate is
  # `μ_max · f_T(T) · f_aw(a_w)`. `spoilActivationEnergy` (J/mol) is how
  # steeply this food answers to warmth; `waterActivity` is how much of its
  # water a microbe can actually use. Under the 0.60 floor nothing grows.
  # Raw meat: the fastest-spoiling thing in the library. a_w ≈ 0.99 —
  # nothing is bound, everything is available.
  spoilActivationEnergy: 80000
  waterActivity: 0.99
  nutrients: [protein]
  nutrientAmounts:
    protein: 26000
  tags: [food, meat, raw]
  composition: []
  biologicalSource: null
