# A spoiled ration — edible (you CAN eat it) but carrying a ptomaine
# dose. The food declares only the per-serving amount; the rate params
# (absorption / clearance / band map) live on the ptomaine Condition
# seed. Eating it routes the carbs to satiation AND the ptomaine dose
# into the digestion pool, which absorbs into the burden over time —
# leaving a window to `vomit` it before it absorbs.
class: /platform/idea/material/ConsumableMaterial
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: spoiled ration
  appearance: a greying, sour-smelling ration
  keywords: [ration, food, spoiled]
  density: 900
  thermalConductivity: 0.3
  specificHeat: 2500
  edibility: true
  # ⭐ The basic tastes (closed five-word set). Nothing authors what a
  # DISH tastes like — `taste` derives that from what went in, projected
  # through the taster's own palate. See docs/subsystems/crafting.md.
  # The sour is the spoilage. It is not a warning label — it is what the bacteria made.
  tastes: [salty, sour]
  # ⭐ Spoilage (docs/subsystems/spoilage.md): the microbial growth rate is
  # `μ_max · f_T(T) · f_aw(a_w)`. `spoilActivationEnergy` (J/mol) is how
  # steeply this food answers to warmth; `waterActivity` is how much of its
  # water a microbe can actually use. Under the 0.60 floor nothing grows.
  # It is already off, and it keeps going: the authored ptomaine dose above
  # is the head start, and the gauge adds what grows from here.
  spoilActivationEnergy: 80000
  waterActivity: 0.95
  nutrients: [carb]
  nutrientAmounts:
    carb: 30000
  toxicity:
    - { type: ptomaine, amount: 700 }
  tags: [food, spoiled]
  composition: []
  biologicalSource: null
