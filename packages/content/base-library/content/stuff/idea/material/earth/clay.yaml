# Clay — fine-grained plastic earth. The subsoil a ditch cuts into, the
# puddled floor of a byre, and (fired) the parent of everything in
# `ceramic/`.
#
# ⚠ Not the same row as `ceramic/ceramic`, which is FIRED clay and a
# different material with different numbers. This one is the ground; that
# one is the mug. The two share the keyword `clay` because both honestly
# answer to it.
class: /platform/idea/material/Material
data:
  name: clay
  keywords: [clay, earth]
  appearance: grey-brown clay
  # Bulk density of a compacted clay soil (kg/m^3).
  density: 1700
  thermalConductivity: 1.1
  specificHeat: 920
  # Dry clay is near-inert; it is the WATER in it that conducts, and that
  # rides the surface puddle.
  electricalConductivity: 1.0e-3
  # Holds water and will not give it up — which is why a clay floor goes
  # to mire and stays there.
  waterAbsorptionCapacity: 45
  hardness: 5
  toughness: 2
  edibility: false
  nutrients: []
  toxicity: []
  # ⭐ `clay` added by the extraction build, so a second clay answers to
  # the word. The other four tags are what the ground build authored.
  tags: ["earth", "solid", "soil", "plastic", "clay"]
  # ⭐ A clay is a COMPOSITION (ceramics M3): its plasticity, its drying
  # cracks, the colour it fires and how much heat it stands all derive from
  # what is in it. A common red-burning subsoil clay: half clay mineral, a
  # third sand, a little iron (it fires red), a little lime and organic
  # matter. A lump's own `makeup` records what was kneaded in after.
  composition:
    - { materialPath: /stuff/idea/material/mineral/clay-mineral, fraction: 0.55 }
    - { materialPath: /stuff/idea/material/earth/sand, fraction: 0.30 }
    - { materialPath: /stuff/idea/material/mineral/goethite, fraction: 0.06 }
    - { materialPath: /stuff/idea/material/rock/limestone, fraction: 0.03 }
    - { materialPath: /stuff/idea/material/organic/peat, fraction: 0.06 }
  # ⭐⭐ What heat does to it (ceramics M1) — firing is ONE rule. A piece of
  # clay in a kiln, a clamp or a house fire banks heat-work, and these say
  # what that makes of it. There is no recipe and no "fire-pot" row: the
  # same lump comes out as itself, its body changed.
  #
  # ⚠ Three transitions, each with its own reference heat, not one ladder:
  # heat-work in a ceramic body is STEEP in temperature (an Orton cone
  # bends about 20 K lower for a ten-times-longer soak), so time cannot
  # carry a terracotta firing to stoneware. Each body is a temperature
  # band, and holding longer finishes the band you are in.
  #
  # A starved (reducing) firing takes each rung's twin. Past 1560 K a common
  # clay bloats and glasses into clinker — the clamp's fire-channel brick.
  heatTransitions:
    - key: terracotta
      referenceK: 1200
      zK: 30
      fullDoseS: 7200
      # The organics and the bound water burn off — about a twelfth.
      massRetained: 0.92
      discipline: pottery
      ladder:
        - atDegree: 1
          becomes: /stuff/idea/material/ceramic/terracotta
          reducing: /stuff/idea/material/ceramic/terracotta-reduced
    - key: earthenware
      referenceK: 1330
      zK: 30
      fullDoseS: 7200
      discipline: pottery
      ladder:
        - atDegree: 1
          becomes: /stuff/idea/material/ceramic/earthenware
          reducing: /stuff/idea/material/ceramic/earthenware-reduced
    - key: stoneware
      referenceK: 1480
      zK: 30
      fullDoseS: 7200
      scorchAboveK: 1560
      scorched: /stuff/idea/material/ceramic/clinker
      discipline: pottery
      ladder:
        - atDegree: 1
          becomes: /stuff/idea/material/ceramic/stoneware
          reducing: /stuff/idea/material/ceramic/stoneware-reduced
  biologicalSource: null
