# Limestone — sedimentary carbonate rock, and ⭐ **the flux the metal chain
# shipped without.**
#
# Two products out of one rock, and one of them needs a fire: straight into
# a smelt it takes the gangue off as a running slag, and held hot it
# calcines to quicklime (its `kinetics` below). That is the whole of why a limekiln stands at a
# quarry — the rock is heavy and the lime is light, so you burn it where you
# dig it.
#
# ⚠ The `flux` tag is what the smelt reads, and it is a TAG rather than a
# row check so a pack that ships dolomite or fluorspar works with no edit.
class: /platform/idea/material/Material
data:
  name: limestone
  keywords: [limestone, lime, stone]
  appearance: pale grey limestone
  density: 2550
  specificHeat: 840
  thermalConductivity: 1.3
  electricalConductivity: 1.0e-5
  # More porous than granite — it takes frost, which is why it weathers.
  waterAbsorptionCapacity: 2.0
  # Softer than granite and easier to win, which is most of its economics.
  hardness: 120
  toughness: 20
  edibility: false
  nutrients: []
  toxicity: []
  # ⭐ `smelting-flux`, not bare `flux` (potash D13): the smelter's word
  # names the melt it serves. Bare `flux` is the glassmaker's — the potash
  # family — and a lime kiln burns limestone as a `carbonate`.
  tags: ["rock", "sedimentary", "carbonate", "smelting-flux"]
  composition: []
  # ⭐⭐ Burning lime is ONE rule (ceramics M1): a lump of this held hot
  # gives up its carbon dioxide and becomes quicklime, keeping 56 % of its
  # mass — in a limekiln, a pottery kiln or a burning barn alike. Fired
  # short it comes out burnt to the skin and raw at the heart, and weighs
  # in between. No recipe, no "burn-lime" row.
  kinetics:
    - key: calcine
      rate: { referenceK: 1170, zK: 60, fullDoseS: 3600 }
      massRetained: 0.56
      discipline: quarrying
      ladder:
        - atDegree: 1
          becomes: /stuff/idea/material/caustic/quicklime
  chemistry: null
  biologicalSource: null
