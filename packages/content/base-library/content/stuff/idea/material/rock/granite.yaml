# Granite — coarse-grained igneous rock. Heavy, hard, electrically
# inert. The default stone for walls and statuary.
#
# Geologically a mixture of quartz (SiO2), feldspar
# (KAlSi3O8/NaAlSi3O8), and mica plus minor accessories. v1 leaves
# `composition` empty pending mineral templates — content extends by
# adding `/stuff/idea/material/mineral/quartz`, `.../feldspar`, `.../mica` and
# populating composition entries here. The `igneous` tag carries the
# rock-cycle classification meanwhile.
class: /platform/idea/material/Material
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: granite
  density: 2750
  specificHeat: 790
  thermalConductivity: 2.9
  # Electrical conductivity (S/m) — dry granite is near-inert (~1×10⁻⁵);
  # a dry stone floor does not ground you.
  electricalConductivity: 1.0e-5
  # Water absorption capacity (% of dry mass, ASTM D570): dense stone, near-nil porosity.
  waterAbsorptionCapacity: 0.3
  # Mechanical response (materials-response): MPa. Authored here because
  # carve cost cannot be priced until rock carries what metal already
  # does — a granite heading is roughly twice a slate one.
  hardness: 200
  toughness: 35
  edibility: false
  nutrients: []
  toxicity: []
  tags: ["rock", "igneous", "mixture", "crystalline", "felsic"]
  composition: []
  chemistry: null
  biologicalSource: null
