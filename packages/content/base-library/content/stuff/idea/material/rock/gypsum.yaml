# Gypsum — calcium sulphate, a soft white rock you can scratch with a nail,
# laid down where an old sea dried. ⭐ Burnt gently it becomes PLASTER, and
# plaster mixed with water sets again in any shape it is poured into: the
# mould-maker's material (ceramics W7 gives it that transition). A commons
# row (ceramics R4 — gypsum has ONE home): the quarry's lump row names it,
# and the hill's band stamps it.
class: /platform/idea/material/Material
data:
  name: gypsum
  keywords: [gypsum, alabaster, selenite]
  appearance: soft, white, faintly glittering gypsum
  density: 2300
  specificHeat: 1090
  thermalConductivity: 0.5
  electricalConductivity: 1.0e-6
  waterAbsorptionCapacity: 3
  hardness: 20
  toughness: 3
  edibility: false
  nutrients: []
  toxicity: []
  tags: ["rock", "mineral", "sedimentary", "sulphate", "gypsum"]
  composition: []
  # ⭐⭐ Burning gypsum is the same ONE rule as burning lime (ceramics M1,
  # W7): held at about 420 K for an hour it gives up three-quarters of its
  # water and is PLASTER, which takes the water back and sets again in any
  # shape it is poured into. A core oven's gentle heat is the right one.
  heatTransitions:
    - key: plaster
      referenceK: 420
      zK: 15
      fullDoseS: 3600
      massRetained: 0.84
      discipline: pottery
      ladder:
        - atDegree: 1
          becomes: /stuff/idea/material/mineral/plaster
  biologicalSource: null
