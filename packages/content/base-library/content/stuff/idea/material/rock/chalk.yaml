data:
  name: chalk
  keywords: [chalk]
  appearance: soft white chalk
  density: 2000
  specificHeat: 880
  thermalConductivity: 0.9
  electricalConductivity: 1.0e-8
  hardness: 3
  toughness: 1
  tags: [rock, mineral, granular, absorbent, chalk]
  # ⭐ A white pigment (paint D19): a weak one in oil, the body of a
