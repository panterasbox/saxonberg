# carbon to come out as flakes of graphite (ceramics S12): grey where it
# breaks, soft enough to file and machine, and it damps a ring — the stove
# plate, the pot, the cannon. Brittle still (the flakes are cracks waiting),
# but nothing like the chilled white.
