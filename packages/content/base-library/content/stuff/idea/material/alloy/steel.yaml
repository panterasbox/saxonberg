# Steel — iron-carbon alloy. Harder than iron, similarly conductive,
# the standard for swords/armor. v1 ships a generic carbon steel
# (~0.2% carbon by weight); higher-carbon steels and alloy steels
# (stainless, tool steel, …) are content extensions.
class: /platform/idea/material/Alloy
data:
  name: steel
  keywords: [steel]
  density: 7850
  specificHeat: 466
  thermalConductivity: 50
  # Electrical conductivity (S/m) — carbon steel, ~6×10⁶ (a fine
  # conductor; the low-resistance series path that betrays plate armor).
  electricalConductivity: 6.0e6
  # ⚠ Phase change. Steel had NO melting point at all, which meant
  # `MeltableMixin.getMeltingPointK()` read 0 and a steel thing could
  # never melt, re-melt or be honestly described as solid — the phase
  # change was one-directional for the one metal the game is mostly made
  # of. 1723 K is the real figure for a low-carbon steel: BELOW pure
  # iron's 1811 K, because that is what carbon does to iron and it is
  # the same fact the whole ladder turns on.
  meltingPoint: 1723
  # ⭐ What this sets as, and what a smelt that ends solid in it makes —
  # a steel bar (controller-liquidity W9: the smelt asks the material, it
  # no longer scans the trade's rows for a `_materialPath` match).
  castTemplate: /trade/smelting/thing/steel-ingot
  latentHeatOfFusion: 270000
  # Mechanical response (materials-response): hard + tough, the
  # standard for swords and armor. MPa / MJ·m⁻³, marshalled.
  hardness: 600
  toughness: 200
  # Size and carrying D4: what a strap, a belt or a rail of it bears hung from.
  tensileStrengthMPa: 400
  tags: ["alloy", "metal", "ferrous", "forgeable", "magnetic"]
  composition:
    - { materialPath: /stuff/idea/material/element/iron, fraction: 0.998 }
    - { materialPath: /stuff/idea/material/element/carbon, fraction: 0.002 }
