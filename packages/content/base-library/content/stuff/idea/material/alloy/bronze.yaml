# Bronze — copper-tin alloy. The pre-ferrous arms-and-armor metal:
# denser than steel, softer, and markedly less tough. A bronze
# breastplate turns an edge less surely than a steel one (same
# construction, lower material height) — the materials-response
# "steel plate > bronze plate" contrast.
class: /platform/idea/material/Material
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: bronze
  density: 8800
  # Water absorption capacity (% of dry mass, ASTM D570): metal wets only as a surface film.
  waterAbsorptionCapacity: 0.2
  specificHeat: 380
  thermalConductivity: 60
  # Mechanical response: softer + less tough than steel (MPa / MJ·m⁻³).
  hardness: 250
  toughness: 90
  edibility: false
  nutrients: []
  toxicity: []
  tags: ["alloy", "metal", "copper", "tin"]
  # ⭐ 88/12 copper–tin, and the fractions SUM TO ONE. It used to name
  # copper alone and leave 12% as nothing, which made every read that
  # walks composition — `analyze chemistry`, `containsElementOf` — quietly
  # wrong about what bronze is. The alloy is the point of both elements:
  # the mixture (hardness 250) is harder than copper and far harder than
  # tin (30). Alloying is not averaging.
  composition:
    - { materialPath: /stuff/idea/material/element/copper, fraction: 0.88 }
    - { materialPath: /stuff/idea/material/element/tin, fraction: 0.12 }
  chemistry: null
  biologicalSource: null
