# Raw rubber — coagulated latex, or the rubber floated off milled
# dandelion root: tacky when warm, stiff when cold, and it creeps under a
# load. Useful as it is for very little; cured with sulfur it becomes the
# most useful material of the age.
#
# ⭐ Raw rubber does not cure by itself: it is milled with sulfur first.
# Put it in the works' mixing tub with sulfur and `knead` the tub — the
# blend is `compounded-rubber`, its sulfur fraction what you weighed in —
# and the cure is a heat transition on THAT row (ceramics M1).
class: /platform/idea/material/Material
data:
  name: raw rubber
  keywords: [rubber, "raw rubber", gum, caoutchouc]
  appearance: tacky, weeping raw rubber, stiff in the cold
  density: 920
