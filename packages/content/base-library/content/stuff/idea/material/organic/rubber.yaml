# Rubber — vulcanized elastomer. The insulator of the roster: a rubber
# sole or glove breaks the path to ground, so a body standing on it (or
# shod in it) takes no current even in a live pool — the counterplay the
# electricity model teaches. Conductivity ~1×10⁻¹³ S/m.
class: /platform/idea/material/Material
data:
  name: rubber
  keywords: [rubber]
  appearance: black vulcanized rubber
  density: 1100
  specificHeat: 2000
  thermalConductivity: 0.16
  # Mechanical response: soft and tough (MPa / MJ·m⁻³).
  hardness: 5
  toughness: 20
  # Electrical conductivity (S/m) — a near-perfect insulator (~1×10⁻¹³);
  # the material that breaks a ground path (rubber boots, an insulating mat).
  electricalConductivity: 1.0e-13
  # Water absorption capacity (% of dry mass, ASTM D570): rubber is essentially non-absorbent.
  waterAbsorptionCapacity: 0.5
  # ⭐ Elasticity (% strain it springs back from, rubber build): the most
  # elastic thing in the realm. A stretch read on a garment, and the
  # packing's long life on a pump, both come from this number.
  elasticity: 500
  # The lump a pour or a cure with no mould comes out as.
  castTemplate: /trade/rubber/thing/rubber-lump
  edibility: false
  nutrients: []
  toxicity: []
  # ⚠ `organic` is kept — rubber IS organic. The corrosives that spare it
  # (vitriol, quicklime) name what they really attack instead (rubber
  # build, D12.4). `polymer` is the honest family tag.
  tags: ["organic", "elastomer", "insulating", "polymer", "synthetic"]
  composition: []
  biologicalSource: null
