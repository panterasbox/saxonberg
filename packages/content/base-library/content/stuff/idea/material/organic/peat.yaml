# Peat — partly decayed bog vegetation, waterlogged for long enough that it
# never finished rotting. The ground of the moor, and (dried) a fuel.
#
# ⭐ Tagged BOTH `organic` and `earth`: it is plant matter, and it is what
# the heath floor is made of. The `earth` tag is what makes the moor read
# as *bare earth* in a dry spell and *waterlogged to mire* in the rain —
# one floor answering differently, which is exactly what the heath row's
# own prose already describes.
#
# ⚠ It does not spoil. Peat is the definitional case of organic matter
# whose decay has ALREADY stalled — anaerobic, acidic, waterlogged — which
# is why bog bodies survive millennia in it. So no freshness fields, and no
# exemption needed: a material is not a `Provision`.
class: /platform/idea/material/Material
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: peat
  keywords: [peat, turf]
  appearance: dark fibrous peat
  # Bulk density of wet in-situ peat (kg/m^3) — mostly water by mass.
  density: 1100
  thermalConductivity: 0.35
  specificHeat: 1900
  # Dry peat is an insulator. Wet peat conducts, and that is the puddle's
  # business, not the material's.
  electricalConductivity: 1.0e-3
  # Holds many times its dry mass in water — the highest in the tree, and
  # the reason a bog is a bog.
  waterAbsorptionCapacity: 300
  hardness: 1
  toughness: 1
  # ⭐⭐ **The fuel column, added by the extraction build.** Dried peat is
  # the fuel of every treeless place there has ever been, and the row
  # shipped without a single combustion field — so a turf would not have
  # lit, and nothing would have said why.
  #
  # ⚠ The ignition point is LOW (peat smoulders), and the wet penalty is
  # what actually stops an as-cut turf catching: `waterAbsorptionCapacity`
  # is 300 %, the highest in the tree, and `CombustibleMixin` reads the
  # matter's own water as a term of the same ΔT formula as rain on a log.
  # An as-cut turf refuses in the shipped words — *"It's too wet to
  # catch."* — and a dried one lights, with no peat-specific branch
  # anywhere.
  autoignitionTemperature: 500
  # MJ/kg, air-dried. Poor stuff next to coal's 28 and charcoal's 30, which
  # is exactly why peat is what you burn when you have nothing else.
  heatOfCombustion: 15
  edibility: false
  nutrients: []
  toxicity: []
  # ⚠ `fuel` and NOT `carbon`: peat in a bloomery is a later question
  # (`metal-chain-slate` owns the energy transition), and the `carbon` tag
  # is what a reduction reads. So a turf heats a hearth and a kiln, and iron
  # still needs charcoal.
  tags: ["organic", "earth", "solid", "fibrous", "fuel"]
  composition: []
  chemistry: null
  biologicalSource: null
