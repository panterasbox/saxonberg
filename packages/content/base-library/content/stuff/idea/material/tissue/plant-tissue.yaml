# Plant tissue — soft cellulose-based. Living plant matter (a leaf,
# a stem); distinct from oak (dead, processed wood). Flammable when
# dry.
class: /platform/idea/material/Material
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: plant-tissue
  density: 600
  specificHeat: 2500
  thermalConductivity: 0.3
  edibility: true
  # ⭐ Spoilage (docs/subsystems/spoilage.md): the microbial growth rate is
  # `μ_max · f_T(T) · f_aw(a_w)`. `spoilActivationEnergy` (J/mol) is how
  # steeply this food answers to warmth; `waterActivity` is how much of its
  # water a microbe can actually use. Under the 0.60 floor nothing grows.
  # Green tissue wilts and rots, a little slower than fruit.
  spoilActivationEnergy: 60000
  waterActivity: 0.95
  nutrients: ["cellulose", "water"]
  toxicity: []
  tags: ["tissue", "plant", "mixture", "organic", "living", "edible"]
  composition: []
  chemistry: null
  biologicalSource: null
