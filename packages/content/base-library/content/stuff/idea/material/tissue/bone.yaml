# Bone — rigid mineralized skeletal tissue, hard and load-bearing.
# `density` (kg/m³) and `thermalConductivity` (W/(m·K)) are Material's
# real Quantity fields, authored bare + marshalled. (The combat
# material-response — `resistance.<type>` — is deferred until the
# mechanism-of-injury system lands and can model it honestly.)
class: /platform/idea/material/HideHorn
data:
  # ⭐ Decomposition: what breaks it down in its surroundings (progress per game year at a driver of 1).
  degradation: { rot: { perYear: 0.01 }, mold: { perYear: 0.02 } }
  smells: [{ aroma: /base-library/aromas/flesh, strength: 30 }]
  name: bone
  keywords: [bone]
  density: 1900
  specificHeat: 1300
  thermalConductivity: 0.32
  # Mechanical response (materials-response): MPa / MJ·m⁻³, marshalled.
  hardness: 100
  toughness: 6
  # `collagen`: boiled in a glue pot, bone gives bone glue (paint D19).
  tags: ["tissue", "animal", "bone", "mineral", "skeletal", "collagen"]
