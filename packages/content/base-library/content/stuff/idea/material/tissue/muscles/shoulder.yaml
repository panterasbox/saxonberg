# shoulder — a muscle that worked hardest of all
#
# ⭐ `work: 0.8` is the whole of it: The hardest-working muscle on a four-legged animal, and the one a yoke rides on.
#
# ⚠ Texture is DERIVED from this, never authored on the cut. A cut claims
# the muscles it is made of and its toughness is their share-weighted
# `work`, so nobody can author a tender shank.
class: /platform/idea/material/Muscle
data:
  name: shoulder
  keywords: [shoulder]
  work: 0.8
  density: 1060
  specificHeat: 3500
  thermalConductivity: 0.4
  hardness: 1
  toughness: 1
  electricalConductivity: 0.2
  waterAbsorptionCapacity: 25
  edibility: true
  tastes: [umami]
  # Spoilage, as `tissue/flesh`: flesh rots, and a cut is a clock as well
  # as a dinner.
  spoilActivationEnergy: 80000
  waterActivity: 0.99
  nutrients: [protein, water, fat]
  nutrientAmounts:
    protein: 26000
  # ⭐ Intramuscular fat as `composition`, not a field — the existing
  # readers (`NutritionLabel`, `BlendLabel`) then derive a belly's fat
  # against a loin's for free.
  composition:
    - { materialPath: /stuff/idea/material/food/animal-fat, fraction: 0.12 }
  # ⭐ `meat` so every shipped `category: meat` recipe slot matches a cut;
  # `raw` for the spoilage seam.
  tags: [tissue, animal, muscle, organic, edible, food, meat, raw]
