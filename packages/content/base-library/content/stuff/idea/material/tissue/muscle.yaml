# Muscle — contractile animal tissue. The per-part substrate a future
# strength reading (force over muscle mass) aggregates. `density` (kg/m³)
# and `thermalConductivity` (W/(m·K)) are Material's real Quantity fields,
# authored bare + marshalled; the thermal value feeds algor-mortis
# cooling when the Thermal capability lands.
class: /platform/idea/material/Material
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: muscle
  density: 1060
  specificHeat: 3500
  thermalConductivity: 0.49
  # Mechanical response (materials-response): MPa / MJ·m⁻³, marshalled.
  hardness: 2
  toughness: 3
  edibility: true
  # ⭐ The basic tastes (closed five-word set). Nothing authors what a
  # DISH tastes like — `taste` derives that from what went in, projected
  # through the taster's own palate. See docs/subsystems/crafting.md.
  tastes: [umami]
  # ⭐ Spoilage (docs/subsystems/spoilage.md): the microbial growth rate is
  # `μ_max · f_T(T) · f_aw(a_w)`. `spoilActivationEnergy` (J/mol) is how
  # steeply this food answers to warmth; `waterActivity` is how much of its
  # water a microbe can actually use. Under the 0.60 floor nothing grows.
  # As flesh — muscle is meat before anybody butchers it.
  spoilActivationEnergy: 80000
  waterActivity: 0.99
  nutrients: ["protein", "water"]
  tags: ["tissue", "animal", "muscle", "organic", "living", "edible"]
