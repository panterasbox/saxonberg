# Fruit flesh — sugary-water plant tissue. The substance an apple is
# made of. Edible by default; the carrying detached tissue is NOT an
# Organism even though its parent tree is.
class: /platform/idea/material/Material
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: fruit-flesh
  density: 870
  specificHeat: 3700
  thermalConductivity: 0.5
  edibility: true
  # ⭐ Spoilage (docs/subsystems/spoilage.md): the microbial growth rate is
  # `μ_max · f_T(T) · f_aw(a_w)`. `spoilActivationEnergy` (J/mol) is how
  # steeply this food answers to warmth; `waterActivity` is how much of its
  # water a microbe can actually use. Under the 0.60 floor nothing grows.
  # Fruit spoils by its own sugars: high a_w, moderate temperature answer.
  spoilActivationEnergy: 65000
  waterActivity: 0.97
  nutrients: ["sugar", "water", "fiber"]
  toxicity: []
  tags: ["tissue", "plant", "fruit", "mixture", "organic", "edible"]
  composition: []
  chemistry: null
  biologicalSource: null
