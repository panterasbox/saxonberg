# Flesh — generic animal tissue. Soft, flammable when dry, edible
# (with carnivore/detrivore caveats; v1 has no DietApi consumer).
# Composition is mostly water, protein (myofibrils, connective
# tissue), and fat. v1 leaves the `composition` cross-refs empty
# pending compound templates; species-specific flesh
# (`Homo sapiens`-flesh, frog-flesh, …) is a content extension that
# populates `biologicalSource`.
class: /platform/idea/material/Material
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: flesh
  density: 1060
  specificHeat: 3500
  thermalConductivity: 0.4
  # Mechanical response (materials-response): MPa / MJ·m⁻³, marshalled.
  hardness: 1
  toughness: 1
  # Electrical conductivity (S/m) — moist tissue conducts (~0.2); the
  # body-resistance model reads this, wet skin drops the path resistance.
  electricalConductivity: 0.2
  # Water absorption capacity (% of dry mass, ASTM D570): skin and flesh hold water.
  waterAbsorptionCapacity: 25
  edibility: true
  # ⭐ Spoilage (docs/subsystems/spoilage.md): the microbial growth rate is
  # `μ_max · f_T(T) · f_aw(a_w)`. `spoilActivationEnergy` (J/mol) is how
  # steeply this food answers to warmth; `waterActivity` is how much of its
  # water a microbe can actually use. Under the 0.60 floor nothing grows.
  # Flesh rots. This is what makes a corpse a clock as well as evidence.
  spoilActivationEnergy: 80000
  waterActivity: 0.99
  nutrients: ["protein", "fat", "water"]
  toxicity: []
  tags: ["tissue", "animal", "mixture", "organic", "living", "edible"]
  composition: []
  chemistry: null
  biologicalSource: null
