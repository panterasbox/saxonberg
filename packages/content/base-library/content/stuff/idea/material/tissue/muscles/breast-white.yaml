# breast-white — work 0.1
#
# ⭐⭐⭐ **This is why white meat is white.** A chicken's breast is the
# flight muscle of a bird that has given up flying, so it carries almost
# no myoglobin and almost no connective tissue. ⚠ Its twin `breast-red`
# is the SAME muscle on a bird that still flies, and the two rows are how
# the law is expressed structurally: the body plan that can fly
# (`avian`) names the red one, the plan that cannot (`fowl`) names this.
# A player who learns why a chicken breast is pale has learned why a
# duck's is not.
#
