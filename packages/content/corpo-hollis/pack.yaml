id: corpo-hollis
version: 0.3.0          # reserved; nothing reads/enforces it (non-goal: version machinery)
root: /corpo/hollis
description: >-
  The hollis corpo — its mark, its brands, and its org chart. CAPITAL and
  the MARK, nothing else: Hollis's bottling floor (a warehouse that distils
  nothing — Old Hollis is Veshko's whiskey, Hollis Cane is Veshko's rum)
  is a PRODUCT of the distilling trade and lives in `trade-distilling` as
  an outfit whose `parentOrganization` points here. Hollis LABELS — in the
  trade pack.
maintainers: { organization: /corpo/hollis }
requires:
  # The organization holds its own branch — which is what makes it the
  # committee over /corpo/hollis (the subsidiaries' appointing authority)
  # — the only extent a corpo pack holds.
  title:
    - { extent: /corpo/hollis }
boot:
  - { template: /corpo/hollis, role: producer, reason: appoint and the chart reads resolve the organization by templatePath }
