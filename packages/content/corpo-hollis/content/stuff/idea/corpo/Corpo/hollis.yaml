data:
  key: hollis
  label: Hollis
  sector: mass retail / fast food / cheap goods
  ethos: The Populist — anti-elitist, "honest value for honest folk," loud cheerful marketing (while being a megacorp).
  aesthetic: bright red-and-yellow, jingles, a wisecracking mascot
  temperament: the everyman, the anti-snob
  description: |
    Hollis is enormous and would like you to forget that, because it is on your side, friend, against the fancy people. The jingle is stuck in your head on purpose.
  rivals:
    - vionne
