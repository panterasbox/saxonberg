# soft, segmented, breathing through spiracles — and ⭐ the silk gland,
# which by the fifth age is a quarter of the worm. The cocoon is spun
# from it: a tray's shell mass reads this share (`RearingMixin`), so a
# breed with a bigger gland spins heavier.
