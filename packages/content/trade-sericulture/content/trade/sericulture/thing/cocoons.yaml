# Cocoons — a stack of them, of one heft. ⭐ Minted by a tray when its worms
# have spun (three stacks: heavy, middling, light), never sold raw by a shop
# that does not rear: a silk house sells them stifled.
#
# Unstifled, they open about ten days after the spin and the moths cut the
# thread on their way out; stifled (held hot enough, long enough) they keep
# for ever and reel.
