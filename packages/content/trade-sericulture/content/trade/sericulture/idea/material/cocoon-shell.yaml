# Cocoon — the shell a silkworm spins about itself: one unbroken filament,
# a kilometre of it, gummed together with sericin.
#
# ⭐ It carries `fibre`, so a pierced cocoon (the thread cut by the moth's
# way out) still SPINS — into spun silk, the lesser yarn — and `gummed`,
# because the gum is still on it. ⚠ Not perishable: the pupa inside is
# killed by stifling or leaves as a moth; neither is food going off on a
# shelf.
