# Milk — ⭐ and it is where dairy becomes a BUSINESS rather than a store
# cupboard.
#
# ⚠ It keeps for hours. That single fact is why every dairying culture
# invented cheese, butter and yoghurt, and it is why milk lands on the
# shipped fermentation substrate rather than in a sack: what you do with
# milk you have to do today.
#
# ⚠ It lives in the COMMONS rather than under `/trade/ranching`, because
# milk is a fact about mammals and not about the trade. A cow gives it
# whether or not anybody is ranching.
#
# ⭐⭐ It SPOILS (dairy D2): `spoilActivationEnergy` 60 kJ/mol at a_w 0.99
# puts the turn at about a game day in a warm room and several days in a
# cool one — derived from the shipped growth dials, pinned by a test. The
# `milk` tag is what every dairy process keys on, so a ewe's or a goat's
# milk is a material row and a tap line, never a new profile; the
# `cow-milk` tag says which animal.
class: /platform/idea/material/Material
