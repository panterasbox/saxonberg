# The farm dog — ⭐⭐ **the exception that proves the automation ladder**
# (D42).
#
# The ladder is *by hand* (attention) → *hired NPC* (wages) → *script*
# (compute), under the rule that **automation maintains your assets and
# cannot maintain your relationships.** The dog is a fourth rung and it
# costs **a relationship** — and it does real economic work, which means
# a poorly bonded dog works badly.
#
# ⭐ So bond acquires an economic consequence **without giving any
# livestock a bond stat**: the slate's divergence survives intact, and
# the pet gets a job. This is the one place pets and livestock touch
# mechanically, and it is why the family is one substrate.
#
# ⚠ And it has THREE jobs, not one: it herds (D41), it guards against
# predators (D50 — a dog in the hen house is why the fox does not come),
# and it keeps deer off the crop. All three are the same animal being
# where it is.
