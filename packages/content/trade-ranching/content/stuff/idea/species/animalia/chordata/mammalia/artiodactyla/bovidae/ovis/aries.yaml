# The sheep — ⭐ and it is here because textiles ships a `wool.yaml` with
# no animal behind it.
#
# ⭐⭐ Its place on D92's commitment ladder is **seasonal**: a flock
# grazes itself, and what it asks of you is lambing and shearing, twice a
# year, hard. That is a genuinely different demand from a dairy cow's
# twice a game day, and a player's own real-life cadence is what decides
# which they can keep.
#
# ⚠ A SHORT-DAY breeder, and that one line is where the calendar becomes
# husbandry: the ewes come into season as the days shorten, so lambing
# lands in late winter — not because anybody authored a date, but because
# the orbit did.
#
# ⚠ The row lives in the COMMONS. A sheep exists whether or not anybody
# ranches; the husbandry is the trade, the animal is a thing in the world.
class: /platform/idea/species/Species
data:
  binomial: Ovis aries
  commonNames: ["sheep", "ewe", "ram", "lamb", "hogget"]
  _bodyPlanPath: /stuff/idea/species/BodyPlan/quadruped
  _parentCladePath: /stuff/idea/species/animalia
  _defaultMaterialPath: /stuff/idea/material/tissue/flesh
  vitalProfile:
    coreTemperature: { baseline: 312, survivableMin: 303, survivableMax: 317 }
    heartRate: { baseline: 75, survivableMin: 40, survivableMax: 200 }
    respiratoryRate: { baseline: 20, survivableMin: 8, survivableMax: 60 }
    bloodPressureSystolic: { baseline: 120, survivableMin: 70, survivableMax: 200 }
    bloodPressureDiastolic: { baseline: 80, survivableMin: 40, survivableMax: 135 }
    spo2: { baseline: 97, survivableMin: 68, survivableMax: 100 }
    bloodVolume: { baseline: 4, survivableMin: 3, survivableMax: 5 }
  lifecycleStates: ["alive", "dead"]
  sexDeterminationSystem: xy
  reproductiveMode: sexual
  lifespanMin: 0
  lifespanMax: 12
  circadianBand: diurnal
  diet: herbivore
  # ⭐ Compressed absolute scale, RATIOS preserved: a ewe is breedable at
  # about half the age a heifer is, which is exactly why sheep improve
  # faster than cattle and why `R = h²·S / L` is learnable here.
  # ⭐ Adult liveweight in kg. A grown ewe of an unimproved hill breed.
  adultMass: 70
  ageCurve: { weanedAt: 30, matureAt: 150, agedAt: 900, senescentAt: 1400 }
  breeding: { daylightFrom: 0, daylightTo: 0.44, gestationDays: 60, litter: 2 }
  production:
    # ⭐⭐ Wool records its YEAR. `continuous` means there is no window
    # to miss and nothing to decide at the act — the feedback law's third
    # row — so what varies is the QUALITY the year put in, and
    # `TapState.worst` carries the worst stretch she lived through onto
    # the fleece's grade band. A break is a weak point wherever it fell,
    # and feeding her up afterwards does not heal it.
    #
    # ⭐ `capUnits: 4` because a fleece that heavy has shed: past it the
    # growth is simply lost and `look` says so. A sheep does not
    # accumulate wool forever, which is what the uncapped row implied.
    - key: wool
      yieldRow: /trade/ranching/thing/fleece
      perGameDay: 0.008
      behaviour: continuous
      windowDays: 0
      capUnits: 4
  # ⭐⭐ **What comes off this animal, and it is the ANIMAL's answer.**
  #
  # Until the carcass-chain build the game had two `butcher` verbs with two
  # yield models: the stockyard's read a hardcoded table of five fractions
  # that was the same for a hen and a bullock, and the kitchen's read this
  # field, which these five rows did not author. So an animal gave
  # different things depending on which verb you typed at it, and neither
  # answer was its own.
  #
  # ⭐ `fraction` is a share of LIVE weight, so size pays off; the shares
  # are roughly the real ones (a carcass dresses out around 60 %, a hide is
  # about 7 %, fat around 5 %, bone most of the rest). `units` is how many
  # pieces that mass arrives in. `conditioned: false` says *this line does
  # not care how fat the beast was* — and it is a real fact: a hide and a
  # skeleton are the size the animal IS, not the shape it is in.
  #
  # ⚠ The missing third is blood and gut contents, which stay unmodelled.
  butcheryYield:
  # ⭐⭐ The joints a sheep is worth naming. ⚠ NO `tenderloin`: a sheep's is
  # a mouthful, and a yield line for it would be a cut nobody would ever
  # ask for twice. The cow names it and the ewe does not — which is the
  # species deciding, not the mechanism.
  - { cut: /trade/cooking/thing/cut-shoulder,  units: 2 }
  - { cut: /trade/cooking/thing/cut-leg,       units: 2 }
  - { cut: /trade/cooking/thing/cut-loin,      units: 2 }
  - { cut: /trade/cooking/thing/cut-rib,       units: 2 }
  - { cut: /trade/cooking/thing/cut-neck,      units: 1 }
  - { cut: /trade/cooking/thing/cut-belly,     units: 2 }
  - { cut: /trade/cooking/thing/cut-shank,     units: 4 }
  - { cut: /stuff/thing/items/offal,         units: 2, fraction: 0.10 }
  - { cut: /trade/ranching/thing/suet,          units: 1, fraction: 0.04 }
  - { cut: /trade/cooking/thing/gut,           units: 1, fraction: 0.02 }
  - { cut: /trade/ranching/thing/hide,          units: 1, fraction: 0.08, conditioned: false }
  - { cut: /trade/ranching/thing/bone,          units: 2, fraction: 0.12, conditioned: false }
  longDescription: >-
    A blocky ewe with a fleece gone yellow at the tips and a startlingly
    level stare. She keeps one eye on you and both feet pointed at the
    gate.
  nameBankKeys: []
