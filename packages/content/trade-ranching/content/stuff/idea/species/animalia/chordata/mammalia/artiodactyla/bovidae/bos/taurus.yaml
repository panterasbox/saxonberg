# Cattle — ⭐ the investment that makes the winter-feed budget bite, and
# the animal the cooking chain has been waiting for.
#
# ⭐⭐ At the demanding end of D92's ladder: a dairy cow wants milking
# twice a GAME day, no exceptions, and dairy being the most demanding
# farming there is happens to be true. That is priced honestly and never
# gated — a player who cannot keep one keeps hens, and is not told they
# are not ranching.
#
# ⚠ Near-ASEASONAL, which is the whole reason it reads differently from
# the sheep: her window is the whole year, so calving is a decision
# rather than a date, and the calendar teaches by CONTRAST between the
# two species rather than by a rule about either.
class: /platform/idea/species/Species
data:
  smells: [{ aroma: /base-library/aromas/animal/cattle, strength: 20 }]
  binomial: Bos taurus
  commonNames: ["cow", "cattle", "beast"]
  # ⭐ What each form is called (organism-biology D8): a word under one sex
  # is that sex's alone; the first word of the most specific form is what
  # the body is called. Read late, so a calf grows into its adult name.
  variants:
    sex:
      female: { commonNames: [cow, heifer], body: { add: [{ module: /trade/ranching/body-modules/udder-cattle, as: [body.torso.udder], at: body.torso }] } }
      male: { commonNames: [bull], handlingRange: { floor: 0.05, ceiling: 0.8 }, body: { add: [{ module: /species-and-names/body-modules/gonads, as: [body.torso.gonads], at: body.torso }] } }
    # ⭐ A male cut young (D8, W7) — derived from the lost part, never
    # authored: a steer, and grown, an ox. Heavier than a bull of his age
    # and steadier in hand, which is why oxen pulled the plough.
    neutered:
      commonNames: [steer, bullock]
      massFactor: 1.15
      biddability: 0.6
      handlingRange: { floor: 0.3, ceiling: 1 }
      stage:
        adult: { commonNames: [ox, oxen] }
        aged: { commonNames: [ox, oxen] }
        senescent: { commonNames: [ox, oxen] }
    stage:
      # ⭐ A calf is not a small cow: a big head and long legs on a short
      # body, scaled on the same modules (renormalized, so the shares
      # still sum to one).
      newborn:
        commonNames: [calf]
        body:
          # ⭐ …and a fourth stomach worth taking: the vell (D5).
          add: [{ module: /trade/ranching/body-modules/abomasum, as: [body.torso.abomasum], at: body.torso }]
          scale: { body.head: 1.6, body.leg.frontLeft: 1.25, body.leg.frontRight: 1.25, body.leg.rearLeft: 1.25, body.leg.rearRight: 1.25 }
  _bodyPlanPath: /stuff/idea/species/BodyPlan/quadruped
  _parentCladePath: /stuff/idea/species/animalia
  _defaultMaterialPath: /stuff/idea/material/tissue/flesh
  vitalProfile:
    coreTemperature: { baseline: 311, survivableMin: 302, survivableMax: 316 }
    heartRate: { baseline: 65, survivableMin: 35, survivableMax: 160 }
    respiratoryRate: { baseline: 26, survivableMin: 10, survivableMax: 70 }
    bloodPressureSystolic: { baseline: 135, survivableMin: 80, survivableMax: 210 }
    bloodPressureDiastolic: { baseline: 85, survivableMin: 45, survivableMax: 140 }
    spo2: { baseline: 97, survivableMin: 68, survivableMax: 100 }
    bloodVolume: { baseline: 40, survivableMin: 30, survivableMax: 48 }
  lifecycleStates: ["alive", "dead"]
  sexDeterminationSystem: xy
  reproductiveMode: sexual
  lifespanMin: 0
  lifespanMax: 22
  circadianBand: diurnal
  diet: herbivore
  # ⚠ Twice the sheep's generation interval, compressed by the same
  # factor. The RATIO is the teachable term and it is exact.
  # ⭐ Adult liveweight in kg. A grown cow in a working dairy-and-draught landrace — not a modern beef animal.
  adultMass: 550
  # ⭐ How it is fed (cover build D9): it grazes the field it stands on,
  # and eats hay from a trough when the grass runs short. What it eats
  # is its size — `0.1 × adultMass^0.75` kilograms of dry matter a day.
  feedingStyle: [graze, trough]
  ageCurve: { weanedAt: 60, matureAt: 300, agedAt: 1800, senescentAt: 2600 }
  breeding: { daylightFrom: 0, daylightTo: 1, gestationDays: 120, litter: 1 }
  # ⭐ The season, on the body (organism-biology D9): a mature female in
  # her species' breeding band is in season, and an entire male in rut —
  # conditions the thermal reconcile carries and relieves, which `breed`
  # and `assess` read. The band is `breeding`'s, never re-authored here.
  phenology:
    # ⭐ A cow (a nanny) is in milk by FRESHENING — an act: the draft brings
    # it on past her rest, drying off ends it. Never the schedule's.
    - { condition: /platform/idea/Condition/reproduction/lactating, trigger: { event: true, sex: female, stage: adult } }
    - { condition: /platform/idea/Condition/reproduction/in-season, trigger: { season: breeding, sex: female, stage: adult } }
    - { condition: /platform/idea/Condition/reproduction/rut, trigger: { season: breeding, sex: male, stage: adult, entire: true } }
  longDescription: >-
    A deep-bodied cow with a hip bone you could hang a hat on, chewing
    steadily and entirely unbothered by you. Nothing on the farm is
    heavier or, when she has a calf at foot, more dangerous.
  nameBanks: []
