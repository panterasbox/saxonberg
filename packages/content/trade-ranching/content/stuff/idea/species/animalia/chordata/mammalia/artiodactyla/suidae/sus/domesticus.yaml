# The pig — ⭐ **the waste converter**, and it is here for a reason that
# is entirely about somebody else's leftovers.
#
# `spent-grain` ships in BOTH trade-brewing and trade-distilling with
# nowhere to go. A pig is where it goes, which is what pigs have always
# been for: the animal that turns what nothing else will eat into meat.
# It is the clearest instance in the build of a byproduct finding its
# consumer rather than a consumer being invented for it.
