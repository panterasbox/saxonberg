# The pig — ⭐ **the waste converter**, and it is here for a reason that
# is entirely about somebody else's leftovers.
#
# `spent-grain` ships in BOTH trade-brewing and trade-distilling with
# nowhere to go. A pig is where it goes, which is what pigs have always
# been for: the animal that turns what nothing else will eat into meat.
# It is the clearest instance in the build of a byproduct finding its
# consumer rather than a consumer being invented for it.
class: /platform/idea/species/Species
data:
  binomial: Sus domesticus
  commonNames: ["pig", "sow", "boar", "hog", "piglet", "swine"]
  _bodyPlanPath: /stuff/idea/species/BodyPlan/quadruped
  _parentCladePath: /stuff/idea/species/animalia
  _defaultMaterialPath: /stuff/idea/material/tissue/flesh
  vitalProfile:
    coreTemperature: { baseline: 312, survivableMin: 303, survivableMax: 317 }
    heartRate: { baseline: 80, survivableMin: 40, survivableMax: 200 }
    respiratoryRate: { baseline: 18, survivableMin: 8, survivableMax: 55 }
    bloodPressureSystolic: { baseline: 125, survivableMin: 75, survivableMax: 200 }
    bloodPressureDiastolic: { baseline: 80, survivableMin: 42, survivableMax: 135 }
    spo2: { baseline: 97, survivableMin: 68, survivableMax: 100 }
    bloodVolume: { baseline: 5, survivableMin: 4, survivableMax: 7 }
  lifecycleStates: ["alive", "dead"]
  sexDeterminationSystem: xy
  reproductiveMode: sexual
  lifespanMin: 0
  lifespanMax: 15
  circadianBand: diurnal
  diet: omnivore
  # ⭐ Adult liveweight in kg. A grown sow; a fattened barrow goes heavier.
  adultMass: 120
  ageCurve: { weanedAt: 20, matureAt: 130, agedAt: 900, senescentAt: 1300 }
  breeding: { daylightFrom: 0, daylightTo: 1, gestationDays: 38, litter: 8 }
  production: []
  # ⭐⭐ **What comes off this animal, and it is the ANIMAL's answer.**
  #
  # Until the carcass-chain build the game had two `butcher` verbs with two
  # yield models: the stockyard's read a hardcoded table of five fractions
  # that was the same for a hen and a bullock, and the kitchen's read this
  # field, which these five rows did not author. So an animal gave
  # different things depending on which verb you typed at it, and neither
  # answer was its own.
  #
  # ⭐ `fraction` is a share of LIVE weight, so size pays off; the shares
  # are roughly the real ones (a carcass dresses out around 60 %, a hide is
  # about 7 %, fat around 5 %, bone most of the rest). `units` is how many
  # pieces that mass arrives in. `conditioned: false` says *this line does
  # not care how fat the beast was* — and it is a real fact: a hide and a
  # skeleton are the size the animal IS, not the shape it is in.
  #
  # ⚠ The missing third is blood and gut contents, which stay unmodelled.
  butcheryYield:
  # ⭐ The pig's shares are its own, and they are why a pig is the animal a
  # poor household keeps: it dresses out at half its live weight, and
  # almost twice the fat of a sheep. Lard is the point as much as the meat.
  - { cut: /stuff/thing/items/stew-meat, units: 12, fraction: 0.50 }
  - { cut: /stuff/thing/items/offal,     units: 3,  fraction: 0.12 }
  - { cut: /trade/ranching/thing/suet,   units: 2,  fraction: 0.08 }
  - { cut: /trade/ranching/thing/hide,   units: 1,  fraction: 0.06, conditioned: false }
  - { cut: /trade/ranching/thing/bone,   units: 2,  fraction: 0.10, conditioned: false }
  longDescription: >-
    A long-backed sow with a straight tail and small clever eyes, working
    the ground over with her snout in a way that is clearly systematic.
  nameBankKeys: []
