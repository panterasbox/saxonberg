verbs: [milk]
controller: /trade/ranching/idea/cmd/ranching/MilkController
description: "Milk a beast out"
help: |
  Settle in against her flank and milk her out.

  ⭐ Twice a GAME day, and that is not a figure of speech: a game day is
  two real hours at the shipped clock, so a dairy cow is the most
  demanding thing on the roster and is meant to be.

  ⚠ Leave her too long and she DRIES OFF for that lactation. A season's
  income gone; the animal fine; the next lactation unaffected. That is a
  slope and not a cliff — but it is a long slope, and it is the price of
  keeping the animal that pays best.

  Dairy being the most demanding farming there is happens to be true.

  ⭐ Bring something to catch it in — `milk the cow into the pail`. A
  pail too small is your own information: she is milked right out either
  way, because holding some back would suppress her rather than save it,
  and what the vessel will not hold goes on the straw.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: target
    type: object
    required: true
    scope: ["reachable"]
    requires: HandlingMixin
  # ⭐⭐ WHAT YOU CATCH IT IN — and whether it is needed at all derives
  # from the tap's `yieldShape` (`volume`), never from a flag here. Milk
  # is litres, so litres have to go somewhere; a count and a mass do not.
  #
  # ⚠ `required: false` because the REFUSAL is the host's: the animal
  # says "you have nothing to catch it in", which teaches what a vessel
  # is for. A binder-level refusal would say nothing at all.
  #
  # ⭐ And the pail is DECLARED with a default rather than hunted for
  # (`lint:instrument-args`): bare, the binder hands over the first thing
  # in your hands that holds liquid; a churn named by name is honoured.
  - name: vessel
    type: object
    required: false
    prepositions: [into, in]
    default: "me:i:[mixin.BulkableMixin]"
    scope: ["inventory", "reachable"]
    requires: VisibleMixin
    validators:
      - /lib/command/validators/mustHaveBulkSlot
