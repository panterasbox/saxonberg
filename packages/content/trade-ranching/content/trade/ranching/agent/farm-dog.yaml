# A farm dog — ⭐ the fourth rung of the automation ladder, and the only
# one that costs a relationship.
#
# ⚠ It composes the same `Livestock` class every other kept animal does,
# and that is deliberate: a dog is not a special case of an animal, it is
# an animal with a job. Its `handling` is what the job runs on, so a dog
# nobody has worked with works badly — which is the bond acquiring an
# economic consequence without any livestock acquiring a bond stat.
class: /trade/ranching/agent/WorkingAnimal
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: rough-coated collie
  keywords: [dog, collie, sheepdog, rough-coated]
  register: indefinite
  longDescription: >-
    A rough-coated collie with one ear up, lying flat with its chin on
    its paws and its eyes on the stock. It has not blinked in a while.
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/carnivora/canidae/canis/familiaris
  lifecycleState: alive
  handling: 0.55
  # ⚠⚠ `cadenceMs:` was never a key `Behaved._parseTrigger` understood —
  # it wants `trigger: cadence:<N>s`. Between that and the class composing
  # no `BehavedMixin`, this dog has been standing in the yard doing
  # nothing since the ranching build shipped, with nothing anywhere to
  # say so. Both halves are fixed now.
  behaviors:
    - brain: /trade/ranching/behavior/herds
      trigger: cadence:300s
      config: {}
    # ⭐ And the collie is a companion as well as a worker: it follows the
    # person it is bonded to, eats what it is given, and makes its own way
    # back to the farm.
    - brain: /lib/behavior/follows
      trigger: departure
    - brain: /lib/behavior/feeds
      trigger: cadence:60s
    - brain: /lib/behavior/homes
      trigger: cadence:90s
