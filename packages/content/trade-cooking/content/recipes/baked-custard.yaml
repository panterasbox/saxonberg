# Baked custard (dairy D15) — eggs beaten into milk and cooked gently
# until it sets. ⭐ The narrowest window in the kitchen: ten kelvin. Under
# it, it does not set; over it, the egg tightens and the milk weeps out —
# CURDLED, which is the doneness band's own word for it (*scorched*) on
# `look`. A custard teaches what a thermometer is for.
#
# ⚠ No sweetener: no sweetener category is invented here — the sugar
# trade owns that vocabulary.
