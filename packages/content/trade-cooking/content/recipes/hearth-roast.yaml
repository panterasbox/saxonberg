# A hearth roast — fair meat, dry, at 450 K. The rung UNDER `fine-roast`
# (fine stock at 500 K): same act, worse stock, gentler fire, and the
# reverse-match picks whichever the work actually supports. The ladder is
# what makes better stock worth buying.
recipeId: hearth-roast
name: Hearth Roast
keywords:
- hearth-roast
- roast
inputSlots:
- slot: meat
  category: meat
  minGrade: fair
  kind: item
  count: 1
toolCapabilities:
- pot
outputTemplate: /stuff/thing/items/platter
outputAppearance: a plain hearth roast, brown outside and honest within
outputApplication: edible
outputPortionL: 0.4
requiresHeatK: 450
# The fire may be fiercer than the working wants — and then the
# outside burns while the middle is still coming. Not a decline: a
# scorched dish is a dish you are holding.
maxHeatK: 500
difficulty: standard
discipline: cooking
# A roast over the fire: dripping fat and soot (cleanliness D6).
soils:
- { kind: grease, amount: 0.15, where: hands }
- { kind: grease, amount: 0.1, where: apron }
- { kind: soot, amount: 0.05, where: hands }
