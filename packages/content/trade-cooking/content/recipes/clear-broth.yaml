# A clear broth — the wet method plus a STRAINER, which is the first time a
# cooking recipe asks for an instrument beyond the pot. Straining is what
# makes it clear; without a sieve you have soup, which is a different thing
# somebody else's recipe makes.
recipeId: clear-broth
name: Clear Broth
keywords:
- broth
- clear-broth
inputSlots:
- slot: water
  category: water
  minGrade: fair
  kind: bulk
  measureL: 0.6
- slot: meat
  category: meat
  minGrade: fair
  kind: item
  count: 1
toolCapabilities:
- pot
- strainer
outputTemplate: /stuff/thing/items/bowl
outputAppearance: a clear amber broth with a slick of fat on top
outputApplication: edible
outputPortionL: 0.4
requiresHeatK: 373
# ⚠ The ceiling IS the boiling point, and that is not inert: the medium
# caps the delivered heat at 373 whatever the fire does, so this says
# **a wet dish cannot scorch while there is water in it** — which is
# true, and is the honest reason boiling is the safe method.
maxHeatK: 373
medium: water
difficulty: standard
discipline: cooking
