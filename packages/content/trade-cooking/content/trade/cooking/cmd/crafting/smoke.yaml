verbs: [smoke]
controller: /trade/cooking/idea/cmd/crafting/SmokeController
description: "Hang a cut in the smoke of a low fire"
help: |
  `smoke <cut>` — hang a cut in the smoke of a banked fire. Needs a fire,
  but a cool one: the point is the smoke and the slow drying, not the
  heat.

  Because the fire stays well under the temperature at which the flora
  dies, smoking preserves without sterilising. A smoked cut keeps — and if
  it was contaminated when it went up, it still is.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: target
    type: object
    required: false
    scope: "reachable"
    # ⭐ `any`, deliberately: what you may preserve is decided by the
    # RECIPE's input slot (a `meat`-tagged material today), not by a mixin
    # named here. A pack that ships a fish or a hide authors the row and
    # this file never learns the word.
    requires: any
    validators:
      - /lib/command/validators/canReach
