verbs: [plate]
controller: /trade/cooking/idea/cmd/crafting/PlateController
description: "Plate a finished build onto a dish (the cooking finish)"
help: |
  Finish the cooking — `plate into dish` (or `plate pot into dish`). The
  build is matched to a recipe and the meal is plated, maker's-marked;
  an off-spec build still yields pot luck. Your first faithful by-hand
  cooking of a recipe teaches you it (then `cook <dish>` works).
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: vessel
    type: object
    required: false
    scope: "reachable"
    # ⭐ Bare `plate` works the build you are at — DECLARED, so the binder
    # resolves it (held first) instead of the controller walking for it
    # (`lint:instrument-args`).
    default: "reachable:[mixin.ManualBuildMixin]"
    requires: ManualBuildMixin
  - name: dish
    type: object
    required: false
    scope: "reachable"
    prepositions: [into, in, onto, on]
    requires: any
