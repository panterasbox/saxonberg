# Rufus Penhallow — the pantry outfit's hand. Holds the outfit's `hand` position
# (`purchases: true`): dealt the house card at hire, then the `consigns`
# brain drives the literal verbs — `get`, `wallet use house`, `consign …
# --ask` — carrying the stock to the cash-and-carry counter and consigning
# it AS the outfit. The counter path is this config's, never the trade's.
class: /platform/agent/Cast
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: Rufus Penhallow
  keywords: [hand, rufus, penhallow, floury, pantry, canvas, coat]
  pronouns: they
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  alternateNames: ["rufus", "penhallow"]
  shortDescription: "floury pantry hand in a canvas coat"
  register: indefinite
  longDescription: |
    A stout hand in a canvas coat dusted white to the elbows, who weighs everything twice.
  dispositions:
    - { disposition: diligence, valence: 60 }
  # ── the dossier ─────────────────────────────────────────────────
  # Evidence, never values: each entry below expands into the same rows a
  # lived history would have written, marked `claim`. Seeded once at
  # postRegister and skipped if any claim already exists, so a reclone or
  # a reboot cannot mint a second history.
  # ⚠ A best-guess pass, explicitly provisional — the considered version
  # is a content pass of its own before go-live.
  archetype: hand
  competence:
    - { discipline: cooking, asserting: novice }
    - { discipline: recipe-knowledge, asserting: novice }
  behaviors:
    # ⭐⭐ Somebody who is not the player buys bread, every morning.
    #
    # The grain chain shipped a grower, a miller and a baker and NOBODY
    # WHO NEEDED BREAD — 32 brains and not one of them ate, so the whole
    # chain ended in a shop and the only demand in the world was a player
    # choosing to be hungry.
    #
    # ⚠ Wired on an EXISTING person rather than a new one on purpose: the
    # demand should come from people already in the city, doing their
    # jobs, whose outfits bank so they have a purse of their own.
    #
    # ⭐ The purse chooses the loaf. Nothing here says what this person
    # can afford — the brain compares one balance to the counter's
    # prices, and two people on two wage rates buy different bread on the
    # same morning with nothing anywhere labelling either of them.
    - brain: /lib/behavior/eats
      trigger: cadence:90s
      config:
        counter: /world/terminus/market/thing/bread-counter
        fromHour: 6
        toHour: 10
        spendFraction: 0.25
    - brain: /lib/behavior/consigns
      trigger: cadence:4m
      config:
        stock: /trade/cooking/thing/pantry-stock
        shelf: /trade/distribution/thing/counter
        # ⚠⚠ `board`, `crate` and `carriage` USED to sit here — the
        # posting version of this beat, from before the hand could
        # walk. `consigns` reads none of them, so they were three keys
        # that looked like configuration and were configuration of
        # nothing. Removed rather than left: a dead key in a row is the
        # quietest lie a content tree can tell.
        #
        # ⚠ Retuned by logistics D11 all the same: twelve a beat, not six
        # loose goods, because a walk to the counter and back is the same
        # walk whatever the hand is carrying.
        batch: 12
        ask:
          pantry:sugar: 8
          pantry:salt: 5
          pantry:coffee: 22
          pantry:syrup: 6
    - brain: /lib/behavior/idles
      trigger: cadence:41s
      config:
        pool:
          - { kind: free, value: "thumps a sack to settle it." }
          - { kind: free, value: "chalks a weight on the door." }
