# Tallow — rendered beef or mutton fat, the medieval kitchen's cooking fat
# and its candle stock. ⭐ The `fat` tag is what makes it a MEDIUM: a
# recipe declaring `medium: fat` matches its fat slot against this tag,
# and the `smokePoint` below is the ceiling that recipe's heat is capped
# at. That is the whole of "you can fry hotter than you can boil".
class: /platform/idea/material/ConsumableMaterial
data:
  name: tallow
  keywords: [suet, tallow, fat, dripping]
  appearance: pale, waxy rendered tallow
  density: 900
  thermalConductivity: 0.17
  specificHeat: 2000
  # Phase change: tallow is solid at room temperature and melts in the pan
  # (beef tallow ≈ 320 K). It has no useful boiling point — long before it
  # would boil it passes its smoke point and breaks down, which is exactly
  # why `medium: fat` reads `smokePoint` and `medium: water` reads
  # `boilingPoint`.
  meltingPoint: 320
  latentHeatOfFusion: 190000
  # ⭐ Beef tallow smokes at about 205 °C (478 K) — the highest ceiling in
  # a medieval kitchen, and the reason a crisp fried cutlet is a tallow
  # dish and not an olive-oil one.
  smokePoint: 478
  # ⭐⭐ 38 MJ/kg — and the FIRE BUILD is why a cooking fat authors one.
  # A candle is a `Burner` whose fuel is ITSELF, and a burner's flame
  # temperature derives from its fuel's heat of combustion. Without this
  # a tallow candle — the cheap light the whole medieval world actually
  # burned, and the reason a chandler is a trade — lights to a flame
  # temperature of zero and sheds nothing. Animal fat is a touch under
  # beeswax's 42 (beeswax is the longer hydrocarbon), which is also why a
  # tallow dip is the poorer light of the two.
  heatOfCombustion: 38
  # Rendered fat keeps: it is nearly anhydrous, far under the 0.60 growth
  # floor. Rendering is a preservation technique, not only a cooking one.
  spoilActivationEnergy: 45000
  waterActivity: 0.2
  edibility: true
  # ⭐ The basic tastes (closed five-word set). Nothing authors what a
  # DISH tastes like — `taste` derives that from what went in, projected
  # through the taster's own palate. See docs/subsystems/crafting.md.
  # Rendered fat carries flavour more than it has one; umami is the nearest honest word.
  tastes: [umami]
  nutrients: [fat]
  nutrientAmounts:
    fat: 90000
  toxicity: []
  # ⭐ `candle-stock` beside `cooking-fat`: rendered tallow is BOTH, and
  # that is the interesting thing about it. A crock of it can be fried in
  # or dipped into, so the chandler and the cook compete for the same
  # commodity — which is why tallow had a price worth arguing about and
  # why the carcass's fat line matters at all.
  tags: [liquid, food, fat, cooking-fat, candle-stock, rendered]
  composition: []
  biologicalSource: null
