# A breast — one muscle off a carcass.
#
# ⚠ `mass` here is a NOMINAL default the mint overwrites: what a cut
# actually weighs is `Σ(its muscles' body share) × the carcass's own
# mass`, so the same row off a ewe and an ox weighs what each animal's
# breast weighs. Nothing authors that number twice.
#
# ⭐ And its TEXTURE is derived from the muscle too — nobody can author a
# tender shank.
class: /platform/thing/Cut
data:
  shortDescription: breast
  keywords: [breast, cut]
  register: indefinite
  longDescription: >-
    The whole pale breast off a bird, close-grained and dry-looking.
  _materialPath: /stuff/idea/material/tissue/muscles/breast-white
  tissues:
    - /stuff/idea/material/tissue/muscles/breast-white
  cutting: boneless
  difficulty: easy
  mass: 1.0
