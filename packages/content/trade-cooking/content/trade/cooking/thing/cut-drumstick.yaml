# A drumstick — one muscle off a carcass.
#
# ⚠ `mass` here is a NOMINAL default the mint overwrites: what a cut
# actually weighs is `Σ(its muscles' body share) × the carcass's own
# mass`, so the same row off a ewe and an ox weighs what each animal's
# drumstick weighs. Nothing authors that number twice.
#
# ⭐ And its TEXTURE is derived from the muscle too — nobody can author a
# tender shank.
class: /platform/thing/Cut
data:
  shortDescription: drumstick
  keywords: [drumstick, cut]
  register: indefinite
  longDescription: >-
    A bird's lower leg, dark meat tight around a single bone.
  _materialPath: /stuff/idea/material/tissue/muscles/shank
  tissues:
    - /stuff/idea/material/tissue/muscles/shank
  cutting: boneless
  difficulty: easy
  mass: 1.0
