# A fruit press — the `juicer` capability at kitchen scale, and the tool
# that makes the OIL. It is the bootstrap of the fat chain: pressing olives
# is the only way a kitchen gets a fat that is not rendered off an animal,
# and the two fats have different smoke points, which is what makes the
# choice between them a real one.
class: /platform/thing/ToolItem
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: a fruit press
  longDescription: A screw press over a slatted oak basket, the spout below it worn smooth and permanently damp.
  primaryKeyword: press
  keywords: [press, fruit-press, juicer]
  capabilities: [juicer]
  _materialPath: /stuff/idea/material/wood/oak
  mass: 12
