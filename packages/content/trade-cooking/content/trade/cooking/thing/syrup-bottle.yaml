# Syrup bottle — the receptacle the simple-syrup recipe FILLS from the pool
# (a `bulk` output claims a clean, empty CraftVessel; nothing is cloned).
# Over `/platform/thing/CraftVessel` because the pool requires Crafted +
# Bulkable — a `Bottle` is a floor vessel, never a claimable output.
class: /platform/thing/ServingVessel
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: syrup bottle
  keywords: [syrup-bottle, bottle, syrup]
  register: indefinite
  longDescription: A squat half-litre bottle with a pouring spout.
  category: syrup-bottle
  interiorBulk: true
  interiorCapacity: 0.5
