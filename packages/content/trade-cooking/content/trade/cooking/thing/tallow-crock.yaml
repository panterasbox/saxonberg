# A tallow crock — the vessel rendering FILLS from the pool (a `bulk`
# output claims a clean, empty CraftVessel; nothing is cloned). Fat sets
# solid in it and is scooped out warm.
class: /platform/thing/CraftVessel
data:
  shortDescription: tallow crock
  keywords: [crock, tallow-crock, tallow]
  register: indefinite
  longDescription: A squat glazed crock with a wooden lid, the inside of it clouded white where the fat has set and been scooped out again.
  category: tallow-crock
  interiorBulk: true
  interiorCapacity: 1
  _materialPath: /stuff/idea/material/ceramic/earthenware
  mass: 1.2
  # ⭐ (ceramics S1, M6) A fused lead glaze — glossy, and (M7) it gives
  # lead to anything acid kept in it, which nothing about it says.
  coats:
    inside:
      - { material: /stuff/idea/material/glaze/lead, thicknessM: 0.0003, state: set }
    outside:
      - { material: /stuff/idea/material/glaze/lead, thicknessM: 0.0003, state: set }
