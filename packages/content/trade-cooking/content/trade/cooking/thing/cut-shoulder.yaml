# A shoulder — one muscle off a carcass.
#
# ⚠ `mass` here is a NOMINAL default the mint overwrites: what a cut
# actually weighs is `Σ(its muscles' body share) × the carcass's own
# mass`, so the same row off a ewe and an ox weighs what each animal's
# shoulder weighs. Nothing authors that number twice.
#
# ⭐ And its TEXTURE is derived from the muscle too — nobody can author a
# tender shank.
class: /platform/thing/Cut
data:
  shortDescription: shoulder
  keywords: [shoulder, joint, cut]
  register: indefinite
  longDescription: >-
    A heavy wedge of a joint with the blade bone still in it, the grain running every which way.
  _materialPath: /stuff/idea/material/tissue/muscles/shoulder
  tissues:
    - /stuff/idea/material/tissue/muscles/shoulder
  cutting: bone-in
  difficulty: standard
  mass: 1.0
