# A neck — one muscle off a carcass.
#
# ⚠ `mass` here is a NOMINAL default the mint overwrites: what a cut
# actually weighs is `Σ(its muscles' body share) × the carcass's own
# mass`, so the same row off a ewe and an ox weighs what each animal's
# neck weighs. Nothing authors that number twice.
#
# ⭐ And its TEXTURE is derived from the muscle too — nobody can author a
# tender shank.
class: /platform/thing/Cut
data:
  shortDescription: neck
  keywords: [neck, cut]
  register: indefinite
  longDescription: >-
    Coarse dark meat off the neck, well marbled and cut from a muscle that never rested.
  _materialPath: /stuff/idea/material/tissue/muscles/neck
  tissues:
    - /stuff/idea/material/tissue/muscles/neck
  cutting: boneless
  difficulty: easy
  mass: 1.0
