# A belly — one muscle off a carcass.
#
# ⚠ `mass` here is a NOMINAL default the mint overwrites: what a cut
# actually weighs is `Σ(its muscles' body share) × the carcass's own
# mass`, so the same row off a ewe and an ox weighs what each animal's
# belly weighs. Nothing authors that number twice.
#
# ⭐ And its TEXTURE is derived from the muscle too — nobody can author a
# tender shank.
class: /platform/thing/Cut
data:
  shortDescription: belly
  keywords: [belly, flank, cut]
  register: indefinite
  longDescription: >-
    A flat slab of layered lean and fat off the wall of the abdomen.
  _materialPath: /stuff/idea/material/tissue/muscles/belly
  tissues:
    - /stuff/idea/material/tissue/muscles/belly
  cutting: boneless
  difficulty: easy
  mass: 1.0
