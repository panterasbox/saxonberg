id: trade-cooking
version: 0.1.0          # reserved; nothing reads/enforces it (non-goal: version machinery)
root: /trade/cooking
description: >-
  The cooking trade — what cooking at a hearth introduces: its
  recipes (toasted-ration, root-mash, fine-roast, hearty-stew, simple-
  syrup). Its stock (cuts, roots, rations) is commons under
  /stuff/thing/items (A16.3), and the Hearthworks cookhouse
  (/world/terminus/hearthworks/location/cookhouse) is the venue that hosts it.
  Libations adds the PANTRY: sugar, salt and coffee as materials, the sack
  preset, three floor sacks at target in the pantry stock, the outfit that
  consigns them onto the cash-and-carry, and the syrup. Content packs wave
  4a; the second pass 4b.
requires:
  # The trade is placeless (economic bootstrap D6/D7): its mechanism is
  # held by the Ministry of Trade — a seat, never a committee. Its
  # premises, if any, sit in the world under a locality's committee.
  title:
    - { extent: /trade/cooking, holder: { organization: /compact/trade } }
