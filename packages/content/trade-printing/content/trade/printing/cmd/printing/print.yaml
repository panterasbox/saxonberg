# ⭐ Run copies off: on the press, a forme's text AS SET;
# on a printer, a document as it stands. Either way the copies are bound to
# an edition and say what it said today. The covenant may keep the
# instrument idle.
verbs: [print]
category: printing
controller: ../../idea/cmd/printing/PrintController
description: "Print copies — a forme on the press, a document on a printer"
help: |
  `print <forme> [n]` on the press pulls n copies of what is set in the
  forme, misprints and all. `print <document> [n] on <printer>` prints a
  document as it stands now. `print <ledger> on <printer>` prints an
  extract of a ledger's page. Paper comes from the press (`put ream in
  press`) or your hands; the press wants printing ink in reach.

  A printed copy keeps what the document said on the day it was printed:
  edit it or withdraw it, and every copy still reads as it did.
examples:
  - cmd: print forme 20
  - cmd: print prices 2 on printer
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  # ⭐ WHAT — a forme or a ledger in reach, or the name of a document you
  # hold (which binds nothing and arrives as the raw word; the printer
  # calls it up). The instrument decides which it prints
  # (`PrintingMixin.printFor` — controller-liquidity W11); the controller
  # no longer splits a count off a greedy string and resolves it itself.
  # A name with a space in it is quoted: `print "price list" 2`.
  - name: what
    type: object
    required: false
    scope: ["reachable"]
    requires: any
  - name: copies
    type: number
    required: false
  # ⭐ WHICH PRESS — it was `on`, a preposition for a name (renamed W11).
  - name: press
    type: objects
    required: false
    prepositions: [on, with]
    default: "reachable:[mixin.ToolMixin]"
    scope: ["here", "peers", "person"]
    requires: [ToolMixin]
