# Rags (paint D15) — squares of old linen for wiping a brush, sold by the
# half-dozen in one stack (a heap is three and more in one stack). ⚠ Oily rags
# dropped in a heap heat themselves and catch: spread them out to dry, or
# put them in water.
# ⭐ The class is the kernel's: painting wipes with rags, the
# paper mill buys them, a shirt tears into them — three trades, no common
# pack ancestor. These are PAINT rags, a row of their own: they do not stack
# with clean ones, and the mill will not buy them.
