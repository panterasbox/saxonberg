  description: >-
    Knowing a binder by how it sets — the oil that wants air and a day, the
    lime that wants air and a week, the tempera that wants a dry room — and a
    pigment by how it covers and how it stands the sun; mixing a paint that
    will lie even; laying a coat thin enough to set and thick enough to last;
    choosing the dry day; and making a glue line that holds.
