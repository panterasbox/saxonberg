# The cash-and-carry — the distributor as a Business. Independent (no
# `parentOrganization`): the trade's showroom, not a corpo's. Two positions:
# `clerk` (the rostered pair of hands on the counter) and `keeper`
# (`purchases: true`, unfilled — a player path: whoever holds it buys for
# the house with `wallet use house`). The Prime Minister's office appoints
# until the trade has a seat of its own. Operates the counter (where `buy`
# settles) and the showroom (where `wallet use house` resolves the house).
class: /platform/idea/Business
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: "the cash-and-carry"
  appointingAuthority:
    kind: office
    office: prime-minister
  positions:
    - key: clerk
      label: working the cash-and-carry counter
      wageRate: 5
      confers: []
    - key: keeper
      label: keeping the cash-and-carry
      wageRate: 0
      confers: []
      purchases: true
  rosterSlots:
    - positionKey: clerk
      assignee: /trade/distribution/agent/clerk
      schedule:
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [6, 22] }
  banksAt: goodkin
  operatingLocations:
    # ⭐ The MECHANISM is distribution's; the ROOM is the locality's.
    # Fermentation cut the distributor out into its own pack (D10) so no
    # producing sibling depends on trade-distilling — that decoupling is
    # kept whole. What moved is only the room: a showroom with a roller
    # door on the Counting-Houses avenue, described in that avenue's own
    # prose, is a PLACE.
    - /trade/distribution/thing/counter
    - /world/terminus/counting-houses/cash-and-carry
