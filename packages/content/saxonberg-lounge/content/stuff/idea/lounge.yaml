# /stuff/idea/lounge — the lounge team's ownership root (a FolderZone). Scopes write
# access for lounge content. Ownership is NOT declared here: it lives in the
# gated `parcels` collection (`/stuff/idea/lounge` → the managed `lounge` group; see
# mud/config/parcels.yaml), never on this editable `domain` zone template —
# the governing security invariant. The retired `ownerGroupName` stamp moved
# to the parcel row.
class: /platform/idea/FolderZone
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: lounge
