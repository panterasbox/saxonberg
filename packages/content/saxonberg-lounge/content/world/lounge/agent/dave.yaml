# Dave — the owner, and the bar's namesake. A nod to the original EotL
# "Dave the Barkeep": a washed-up actor who drifted through odd jobs
# (most notably Bruce Willis impressions) before settling down to open
# his own place. The Bruce Willis bit is kept direct — it's the part
# people actually recognize — while the obscure cancelled-TV-show
# specifics stay buried. He keeps to the back office these days; when he
# does drift out front the old stage habits (a wink, a polished glass,
# that impression) resurface — the "annoying script" as fond homage.
# Human (canon).
class: /platform/agent/Crafter
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: Dave
  pronouns: he
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  primaryKeyword: dave
  alternateNames:
    - barkeep
    - bartender
  shortDescription: Dave the Barkeep
  longDescription: |
    Dave keeps to the back these days and lets the staff run the rail.
    When he does drift out front he can't quite help himself — a glass
    polished that didn't need it, a wink at no one in particular, and, if
    the mood takes him, a startlingly good Bruce Willis impression he
    swears he's retired from. He's got the easy, slightly-too-rehearsed
    charm of a man who did a little acting once, drifted through a lot of
    odd jobs, and finally settled down to open his own bar. Mostly, it
    took.
  # Established character: content (settled), a bold performer, the
  # rehearsed charm — the owner, mostly offstage.
  dispositions:
    - { disposition: ambition, valence: -70 }
    - { disposition: boldness, valence: 70 }
    - { disposition: humility, valence: -70 }
  behaviors:
    # Intrinsic auto-introduce: name themselves to newcomers so patrons
    # learn who they are (the NPC half of the auto-introduce feature).
    - brain: /lib/behavior/introduces
      trigger: arrival
    # Dave is the proprietor, not a rostered assignee — he covers the bar
    # when no rostered bartender is on shift. The `covers` brain begins a
    # transient, unpaid cover that confers MakerMixin, so an `order` still
    # finds a fulfiller. Shift scheduling lives on the Business roster now.
    - brain: /lib/behavior/covers
      trigger: cadence:30s
      config: {}
    # Dave keeps his own house. On a slow cadence he watches the floor:
    # a fight gets the shout, then his hands (subdue the one he believes
    # started it), and — only under real threat — the office taser; a
    # patron who walks in armed gets a warning, then the 86 and the door.
    # Kernel-commons `enforces` brain (any barkeep reuses it); config binds
    # it to this house's geography and records.
    - brain: /lib/behavior/enforces
      trigger: cadence:20s
      config:
        alertness: 5
        shoutLine: "Hey! Break it up — not in my house."
        warnLine: "No steel in my bar. Check it at the rack by the door, or step outside."
        orderLine: "That's it — you're eighty-sixed. Out."
        ejectDirection: south
        officeDirection: north
        officeReturn: south
        taserKeyword: taser
        recordsPath: /world/lounge/records/eighty-six
    - brain: /lib/behavior/idles
      trigger: cadence:15s
      config:
        pool:
          - { kind: free, value: "polishes a glass that didn't need polishing." }
          - { kind: free, value: "winks knowingly at no one in particular." }
          - { kind: free, value: "drops into a gravelly Bruce Willis drawl, then waves it off." }
          - { kind: say, value: "Yippee-ki-yay. Anyway. What'll it be." }
    - brain: /lib/behavior/greets
      trigger: arrival
      config:
        lines:
          - "Welcome to my bar."
          - "What're we drinking?"
          - "Glad you came by, friend."
    # The branching-tree responder — `talk to dave`. Dave is the endgame
    # made flesh: the performer's rehearsed charm up front, the settled
    # institution-keeper underneath. Low humility (-70) keeps the bit
    # front-and-center; the `real` node (high regard) drops it and points
    # at the door north — the inner sanctum he's mostly retired into.
    - brain: /lib/behavior/tree-dialogue
      trigger: engage
      config:
        entry:
          - node: warm
            guard:
              - { fact: regard, op: gte, value: 30 }
          - node: neutral
        nodes:
          warm:
            beat: "Well, look who the cat dragged in. You're alright, you know that? Not everybody gets the real me."
            choices:
              - { line: "What is the real you, Dave?", to: real }
              - { line: "How'd you end up running this place?", to: story }
              - line: "Looking for work?"
                guard:
                  - { fact: "position:/world/lounge/idea/business", op: eq, value: false }
                to: work
              - line: "Yippee-ki-yay, Dave."
                to: warm
                effects:
                  - { verb: regard, delta: 2 }
              - { line: "Just saying hello.", to: done }
          neutral:
            beat: "Dave. My bar. *polishes a glass that didn't need it* What can I do for you?"
            choices:
              - { line: "Do the Bruce Willis.", to: bit }
              - { line: "You own the place?", to: story }
              # The player path to the seat. Shown only to somebody who
              # holds no position here already.
              - line: "Looking for work?"
                guard:
                  - { fact: "position:/world/lounge/idea/business", op: eq, value: false }
                to: work
              - { line: "Just passing through.", to: done }
          # Dave hires — the `dispatch` effect runs `appoint` AS DAVE: he
          # holds the bar's appointing authority (the entity edge in
          # idea/business.yaml), so the validator passes for him and for
          # nobody else. The keeper seat is what `wallet use house` and
          # `house stock` read; `quit` is the way out. No wizard anywhere.
          work:
            beat: >-
              *sets the glass down* I could use a keeper. Somebody to read
              the sheet, walk to the cash-and-carry, buy what we're short
              and put it on the rail. It pays nothing and it's the most
              important job in the building. Want it?
            choices:
              - line: "I'll take it."
                to: hired
                effects:
                  - { verb: dispatch, command: "appoint $player to keeper at /world/lounge/idea/business" }
                  - { verb: regard, delta: 3 }
              - { line: "Not for me, thanks.", to: done }
          hired:
            beat: >-
              Good. Say `wallet use house` and the house account's yours
              to spend — on the bar, mind. `house stock` on the tablet
              shows what we're short. Don't make me regret it.
            choices:
              - { line: "I won't.", to: done }
          bit:
            beat: >-
              *drops into a gravelly drawl* "Yippee-ki-yay." ...Nah. I'm
              retired from all that. Mostly.
            choices:
              - line: "Still got it."
                to: done
                effects:
                  - { verb: regard, delta: 2 }
              - { line: "Heh. Cheers, Dave.", to: done }
          story:
            beat: >-
              Acted a little, drifted a lot, landed here. Stopped chasing
              the next thing and started keeping a thing. Best decision I
              never planned.
            choices:
              - { line: "Sounds like you found it.", to: done }
              - { line: "Lucky place.", to: done }
          real:
            beat: >-
              The real me works in the back these days. You stop pouring,
              eventually — you become the place instead. There's a door
              north most folks never notice. Earn it, and we'll talk
              properly.
            choices:
              - line: "I'd like that, Dave."
                to: done
                effects:
                  - { verb: regard, delta: 3 }
              - { line: "I'll keep it in mind.", to: done }
          done:
            beat: "Take it easy out there."
            terminal: true
