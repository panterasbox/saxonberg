# Dave's office — the earned inner sanctum, one (non-obvious) exit north
# of the bar. NOT the staff bolt-hole (that's Offstage, the shifts brain's
# parking lot); this is Dave's *private* room, the place mastery retires
# into — the endgame you can see the edge of. A plain connected room (the
# duncan-hall CartesianLocation precedent), distinct from the singleton
# Bar so it never inherits the Warren wiring.
#
# The north exit INTO this room is a concealed (`concealment: hidden`)
# secret door on the bar, with an authored `hint`. It stays out of the
# obvious-exits list until a viewer `search`es the bar and DISCOVERS it (a
# sticky per-viewer belief), after which `obviousExitsFor` / the MQL
# scope-walk list it and `go north` works — the search-reveals-hidden
# unlock (concealment-detection Phase 3). The south exit back out is plain
# and visible.
class: /platform/location/Room
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: Dave's office
  primaryKeyword: office
  longDescription: |
    Smaller than you'd think, and quieter — the noise of the bar drops to a rumor the moment you're through the door. A desk worn pale at the edges, an oxblood chair gone soft, a window onto the alley where the neon out front leaks in red and amber. There's a framed playbill on the wall and a row of clipboards hung on nails, and on the desk, within easy reach, a bottle of something a good deal better than what's on the rail. This is where the pouring stops and the keeping begins.

    The bar is back through the door to the south.
  # Examine-on-demand. The clipboards plant the leadership-by-continuity
  # lineage (Augie's dialogue made physical); the playbill is Dave's
  # acting past; the desk carries the deficit ledger the bar runs on.
  details:
    clipboards:
      keywords: [clipboard, clipboards, nail, nails]
      description: |
        A row of clipboards on nails, oldest to newest, each with a name inked on the backing board gone soft with handling: DAVE, then AUGIE, then MARA. The last nail is empty — Mara's is downstairs, in use, because the one that matters is never on the wall. Whoever picks up the next one earns the next nail. Nobody hands it over; you just start counting, and one day it's yours.
    playbill:
      keywords: [playbill, poster, headshot, photo, frame]
      description: |
        A yellowed playbill in a cheap frame — a younger Dave, third-billed, in a production nobody remembers. Tucked into the corner of the glass is a headshot with that same too-easy grin, and scrawled across it in fading ink: "to the only Bruce Willis who ever closed this house — break a leg, kid." He keeps it where only the back room can see it.
    desk:
      keywords: [desk, ledger, books, papers, chair]
      description: |
        The desk is a working one — a green ledger open to a column of red, the bar's honest deficit laid out in Dave's blocky hand, and beside it a photograph of the whole staff caught mid-laugh on some long-gone closing night. He runs the place at a loss on purpose and the books say so plainly. The chair still holds the shape of him.
    bottle:
      keywords: [bottle, drink, glass, good, stuff]
      description: |
        The good stuff — no corpo mark, no label at all, just a hand-blown bottle and two glasses kept clean. It doesn't go on the rail and it isn't for sale. It comes down for old friends and for whoever's earned the back room, which amounts to the same thing in here.
  # One-way declared (bidirectional: false) so it does NOT auto-install a
  # second `north` on the bar that would collide with the bar's own
  # hidden north. The pair is wired explicitly: bar -> hidden north ->
  # office, office -> plain south -> bar.
  exits:
    south:
      destination: /world/lounge/location/bar
      bidirectional: false
