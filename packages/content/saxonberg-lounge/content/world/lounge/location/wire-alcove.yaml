# The wire alcove — a quiet singleton side-room holding a public
# wardrobe (the sandbox's door; docs/subsystems/sandbox.md). Content
# for the crossing's smoke path and the E2E suite: tests pin their
# spawn here (`startLocation: /world/lounge/location/wire-alcove`) so an
# ordinary avatar stands next to a door with zero provisioning — which
# is also the honest player story: character creation IS the circle
# grant, and any wardrobe anywhere opens onto your own circle until a
# host links it. Deliberately unwired into the lounge Warren's exit
# graph (reachable by spawn/goto only), so the alcove never perturbs
# the lounge's elastic budding.
#
# The wardrobe re-clones fresh each boot (populates), so its
# `linkedSandboxPath` starts empty every run — links to the first
# enterer, exactly the door's shipped first-enter rule.
class: /platform/location/CartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: the wire alcove
  primaryKeyword: alcove
  longDescription: |
    A hushed nook off the lounge's back corridor, barely wide enough to
    turn around in. Most of it is taken up by a tall lacquered wardrobe
    that doesn't quite seem to touch the wall behind it. A printed card
    tacked beside the doors reads: "STEP IN. YOUR CIRCLE. BUILD
    ANYTHING. WALK OUT — ONLY WHAT YOU SAVED COMES BACK."
  # A lit interior nook. `lit` band (20-60 lux) — enough to read faces
  # by, which is the whole point: at `pitch-black` the vision gate fails
  # and every occupant degrades to "someone", so nobody in the room can
  # be named or addressed.
  #
  # Authored ambient rather than a lamp FIXTURE: a PortableLight is a
  # Thing, so the first passer-by could pocket the room's lighting and
  # leave the alcove dark for everyone after them.
  ambientIntensity: 40
  ambientColorTemperature: 4000
  populates:
    - /platform/thing/sandbox/wardrobe
