# Dave's Bar menu — the offer. References recipe ids; decoupled from the
# maker and the room. Its presence lights up the crafting verb surface.
class: /platform/thing/Menu
data:
  shortDescription: chalkboard menu
  keywords: [board, menu, chalkboard]
  register: indefinite
  longDescription: A chalkboard propped behind the bar, cocktails listed in a tidy hand.
  # The 24 lines of the libations menu (slate Part 9): the hospitality
  # trade's 21 cocktails + coffee, and the pint / glass-of-wine / soft-drink
  # lines each serving trade ships with its stub. Every one consumes real
  # matter off the rail the keeper bought.
  offeredRecipes:
    - /trade/hospitality/recipes/martini
    - /trade/hospitality/recipes/gin-tonic
    - /trade/hospitality/recipes/negroni
    - /trade/hospitality/recipes/tom-collins
    - /trade/hospitality/recipes/gimlet
    - /trade/hospitality/recipes/vodka-soda
    - /trade/hospitality/recipes/moscow-mule
    - /trade/hospitality/recipes/cosmopolitan
    - /trade/hospitality/recipes/screwdriver
    - /trade/hospitality/recipes/old-fashioned
    - /trade/hospitality/recipes/whiskey-sour
    - /trade/hospitality/recipes/manhattan
    - /trade/hospitality/recipes/whiskey-ginger
    - /trade/hospitality/recipes/daiquiri
    - /trade/hospitality/recipes/mojito
    - /trade/hospitality/recipes/dark-and-stormy
    - /trade/hospitality/recipes/cuba-libre
    - /trade/hospitality/recipes/margarita
    - /trade/hospitality/recipes/paloma
    - /trade/hospitality/recipes/aperol-spritz
    - /trade/hospitality/recipes/coffee
    - /trade/brewing/recipes/pint
    - /trade/winemaking/recipes/glass-of-red
    - /trade/winemaking/recipes/glass-of-white
    - /trade/winemaking/recipes/glass-of-sparkling
    - /trade/bottling/recipes/soft-drink
  # Authored flat prices (minor units / credits) — the bartender's
  # willingness. Ordering a priced drink settles a presented Charge from the
  # patron's credential to the bar's account (banking); unpriced drinks are
  # served free. The bar's P&L wants these against cost of goods.
  prices:
    martini: 12
    gin-tonic: 9
    negroni: 12
    tom-collins: 10
    gimlet: 10
    vodka-soda: 8
    moscow-mule: 10
    cosmopolitan: 11
    screwdriver: 8
    old-fashioned: 12
    whiskey-sour: 11
    manhattan: 12
    whiskey-ginger: 9
    daiquiri: 10
    mojito: 11
    dark-and-stormy: 10
    cuba-libre: 8
    margarita: 11
    paloma: 10
    aperol-spritz: 10
    coffee: 3
    pint: 5
