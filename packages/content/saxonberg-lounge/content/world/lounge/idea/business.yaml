# Dave's Bar — the Business entity.
#
# A Business is its own standalone entity, NOT a property of the room: it
# owns the proprietor, the positions, the roster, its account, and the list
# of operating locations. This is what lets the job span locations, the
# proprietor be absent, and the business outlive its proprietor (the
# Dave->Augie->Mara succession the cast implies). The Bar stays a dumb
# Location with zero employment data; the employment engine finds this
# Business by the BusinessMixin marker, never a field on the room.
#
# The house account keys on THIS path (/world/lounge/idea/business), so order
# income (OrderController) and shift wages (the roster tick) settle on one
# account — the deficit P&L reads them together. See
# docs/subsystems/employment.md.
class: /platform/idea/Business
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: "Dave's Bar"
  # Who may fill this business's positions. Dave owns the bar, so the
  # authority is the ENTITY edge — a replaceable pointer, not a group.
  # Checked by EmploymentApi.isProprietorOf; the covers brain reads it too
  # (his own cover shift draws no wage — the settlement skips the
  # proprietor, which reads `getProprietor()`, the entity case of this).
  appointingAuthority:
    kind: entity
    path: /world/lounge/agent/dave
  # The one position v1. `wageRate` is minor units per game-hour on shift
  # (a tuning placeholder — an 8h shift ~ 32, a modest labor line against
  # the deliberately-red P&L). `confers` is the on-shift capability grant:
  # while on shift the holder's gated MakerMixin goes active, so the present
  # bartender fulfills `order`.
  positions:
    - key: bartender
      label: tending bar
      wageRate: 4
      confers: [MakerMixin]
    # The keeper — the seat that BUYS for the house. `purchases: true` is
    # what lets its holder `wallet use house` (the operating account
    # becomes the one they trade as) and run `house stock` / `house par`.
    # Unpaid: Mara keeps the bar on her bartending wage; a player Dave
    # appoints (his "looking for work?" branch) holds it the same way and
    # `quit`s the same way. No wizard anywhere in the loop.
    - key: keeper
      label: keeping the bar
      wageRate: 0
      confers: []
      purchases: true
  # The roster — the single source of truth for who tends and when. The
  # schedules are lifted verbatim from what each NPC's `shifts` brain read
  # before this build (the brain now just reacts to the state this drives).
  # Weekdays are 0-based; hours are a half-open [start, end) window.
  rosterSlots:
    - positionKey: bartender
      assignee: /world/lounge/agent/mara
      schedule:
        - { days: [0, 1, 2, 3, 4], hours: [6, 14] }
    # Mara keeps the bar on the same window she tends it — the par sheet
    # is hers to read (nobody stands in), the wage line stays honest (0).
    - positionKey: keeper
      assignee: /world/lounge/agent/mara
      schedule:
        - { days: [0, 1, 2, 3, 4], hours: [6, 14] }
    - positionKey: bartender
      assignee: /world/lounge/agent/remy
      schedule:
        - { days: [0, 1, 2, 3, 4], hours: [14, 22] }
    - positionKey: bartender
      assignee: /world/lounge/agent/sloane
      schedule:
        # The after-hours close — two windows cover the midnight wrap.
        - { days: [0, 1, 2, 3, 4], hours: [22, 24] }
        - { days: [0, 1, 2, 3, 4], hours: [0, 6] }
    - positionKey: bartender
      assignee: /world/lounge/agent/augie
      schedule:
        - { days: [5, 6], hours: [10, 24] }
  # Where the house banks (an authored fact — Terms/fees follow it).
  # v1: Goodkin, the one real branch; a rival bank is one edit away.
  banksAt: goodkin
  operatingLocations:
    - /world/lounge/location/bar

  # The par manifest — what the house means to keep on hand, and where it
  # buys it. Every line is bought from the one distributor (distribution's cash-and-carry, where every producer outfit consigns). Spirits,
  # liqueurs, vermouths, wine, mixers and syrup in litres; kegs in litres;
  # produce, glassware in count; ice in kilos. A category is a material TAG
  # (a bottle of gin carries `gin`) or a glass row's own `category`. What
  # is ON HAND is never stored — `house stock` and Mara's `restocks` beat
  # derive it from what the reader can see from the rail. Glassware has no
  # supplier yet (nobody sells glasses at the counter): the lines still
  # show breakage as a shortfall.
  # ⚠⚠ **Retuned by the logistics build (D11), as part of the decision
  # rather than left to discovery.**
  #
  # The rail used to be topped up by the keeper walking to the
  # distributor and back inside one beat, with distance free. It is now
  # carried by somebody — a player, or the carrier's carter after the
  # gig's window — and the round trip is measured in game hours rather
  # than in nothing.
  #
  # So every SUPPLIED level is doubled. **A bar that cannot restock
  # because the road is slower than the drinking is a regression, not a
  # lesson**, and the par is the dial that absorbs the road. The glassware
  # lines (which nobody delivers) are untouched.
  #
  # ⭐ It also fixes something the old numbers hid: an order can only be
  # posted while a unit of the line is still on the shelf (`job post`
  # takes an object the poster can reach), so a par that runs to zero
  # between beats can never be re-ordered. Doubling puts every line's
  # ordering point comfortably above empty.
  #
  # ⭐⭐ …and `exemplar:` is what makes that true at literal zero, which
  # is the state a fresh realm boots into: the rail ships EMPTY on
  # purpose, so with nothing to point at the keeper could order nothing
  # and **the bar could never open**. The exemplar names the kind
  # (`job post --of <kind>`), and naming it is the proprietor's job
  # anyway — *which* gin this bar stocks is a decision, not a lookup.
  #
  # ⚠ EIGHT lines below carry no exemplar, and they are the eight whose
  # category no shipped row produces: the two vermouths, the three wines
  # by colour, ale, lager and vinegar. A line with no exemplar keeps the
  # old behaviour (orderable only while a unit is on the shelf), which
  # for these means never — but that was already true, because there is
  # nothing in the realm for an order to deliver. They are a content gap,
  # named here rather than papered over with a wrong path.
  parLines:
    - { category: gin, unit: L, level: 6, supplier: /trade/distribution/idea/business, exemplar: /trade/distilling/thing/gin }
    - { category: vodka, unit: L, level: 6, supplier: /trade/distribution/idea/business, exemplar: /trade/distilling/thing/vodka }
    - { category: whiskey, unit: L, level: 6, supplier: /trade/distribution/idea/business, exemplar: /trade/distilling/thing/whiskey }
    - { category: light-rum, unit: L, level: 3, supplier: /trade/distribution/idea/business, exemplar: /trade/distilling/thing/rum-light }
    - { category: dark-rum, unit: L, level: 3, supplier: /trade/distribution/idea/business, exemplar: /trade/distilling/thing/rum-dark }
    - { category: tequila, unit: L, level: 3, supplier: /trade/distribution/idea/business, exemplar: /trade/distilling/thing/tequila }
    - { category: orange-liqueur, unit: L, level: 1.5, supplier: /trade/distribution/idea/business, exemplar: /trade/distilling/thing/orange-liqueur }
    - { category: bitter-liqueur, unit: L, level: 1.5, supplier: /trade/distribution/idea/business, exemplar: /trade/distilling/thing/bitter-liqueur }
    - { category: aperitivo, unit: L, level: 1.5, supplier: /trade/distribution/idea/business, exemplar: /trade/distilling/thing/aperitivo }
    - { category: bitters, unit: L, level: 0.4, supplier: /trade/distribution/idea/business, exemplar: /trade/distilling/thing/bitters }
    - { category: dry-vermouth, unit: L, level: 1.5, supplier: /trade/distribution/idea/business }
    - { category: sweet-vermouth, unit: L, level: 1.5, supplier: /trade/distribution/idea/business }
    - { category: red, unit: L, level: 3, supplier: /trade/distribution/idea/business }
    - { category: white, unit: L, level: 3, supplier: /trade/distribution/idea/business }
    - { category: sparkling, unit: L, level: 3, supplier: /trade/distribution/idea/business }
    - { category: ale, unit: L, level: 60, supplier: /trade/distribution/idea/business }
    - { category: lager, unit: L, level: 60, supplier: /trade/distribution/idea/business }
    - { category: soda-water, unit: L, level: 6, supplier: /trade/distribution/idea/business, exemplar: /trade/bottling/thing/soda-water }
    - { category: tonic, unit: L, level: 6, supplier: /trade/distribution/idea/business, exemplar: /trade/bottling/thing/tonic }
    - { category: ginger-beer, unit: L, level: 4, supplier: /trade/distribution/idea/business, exemplar: /trade/bottling/thing/ginger-beer }
