id: saxonberg-lounge
version: 0.2.0          # reserved; nothing reads/enforces it (non-goal: version machinery)
# The document root: the retired ScriptSeeder's owner path, so every
# existing dev DB ADOPTS its three rows in place (same path, same owner).
root: /world/lounge
description: >-
  The lounge — its library root (/obj/lounge), its three world scripts
  (msh) and the landing setting; rooms/NPCs are world-seed's until a later
  wave homes them here.
dependsOn: [platform, corpo-goodkin, corpo-vionne]
# The lounge team maintains the lounge.
maintainers: lounge
requires:
  groups:
    - name: lounge
      purpose: the lounge team
  title:
    - { extent: /obj/lounge, holder: { group: lounge } }
    - { extent: /world/lounge, holder: { group: lounge } }
