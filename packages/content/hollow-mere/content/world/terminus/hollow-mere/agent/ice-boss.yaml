class: /platform/agent/Cast
extends: /stuff/agent/costume/student
data:
  name: Hedda
  keywords: [hedda, boss]
  pronouns: she
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  shortDescription: Hedda the ice boss
  register: proper
  longDescription: |
    A big woman in a sheepskin with a spud in her fist, who looks at the ice a long time before she lets anybody out on it.
  archetype: labourer
  competence:
    - { discipline: ice-harvesting, asserting: proficient }
  # Her own scraper and marker (an NPC's `props:`): the boss scrapes the
  # first patch and scores the grid before she lets the crew on.
  props:
    - /trade/ice/thing/scraper
    - /trade/ice/thing/hand-marker
  behaviors:
    - brain: /trade/ice/behavior/bosses
      trigger: candidate
      config: { marginKg: 200, pool: /world/terminus/hollow-mere/location/pool, shore: /world/terminus/hollow-mere/location/shore, out: north, back: south }
