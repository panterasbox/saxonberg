class: /platform/agent/Cast
extends: /stuff/agent/costume/student
data:
  name: Wenna
  keywords: [wenna, keeper]
  pronouns: she
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  shortDescription: Wenna the keeper
  register: proper
  longDescription: |
    A narrow, weathered woman in a sawdust-flecked coat, a pencil behind her ear and the house book never far from her hand. She knows to the hundredweight what is in the house, and says so only when asked.
  archetype: storekeeper
  competence:
    - { discipline: appraisal, asserting: proficient }
  behaviors:
    # ⭐ Off shift, to the company's shed (persistence-model D15 — the house
    # names no offShift, so the hand stays in the story and walks there).
    - brain: /lib/behavior/frequents
      trigger: candidate
      config:
        place: /world/terminus/hollow-mere/shed/location/shed
        visits:
          - { days: [0, 1, 2, 3, 4, 5, 6], hours: [0, 24] }
    - brain: /lib/behavior/introduces
      trigger: arrival
