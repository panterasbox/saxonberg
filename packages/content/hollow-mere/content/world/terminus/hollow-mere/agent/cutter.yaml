class: /platform/agent/Cast
extends: /stuff/agent/costume/student
data:
  name: Bryn
  keywords: [bryn, cutter]
  pronouns: he
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  shortDescription: Bryn the ice cutter
  register: proper
  longDescription: |
    A wiry man in oiled boots with an ice saw over his shoulder, who has been through the ice once and talks about it more than once.
  # ⭐ The saw goes over his shoulder in its sling (size and carrying,
  # finalize): two hands hold the scraper and the marker, and a body places
  # what it carries — a saw nearly as tall as he is has nowhere else to go.
  costume:
    - /trade/ice/thing/saw-sling
  archetype: labourer
  competence:
    - { discipline: ice-harvesting, asserting: competent }
  # His own kit, born in his hands (an NPC's `props:` — the storage-and-ice
  # sweep): the brain forces `scrape` / `groove` / `cut`, and those verbs bind
  # a tool in reach — in hand, or in an open holder on him (the saw in its
  # sling). The shore's kit is the company's for anyone.
  props:
    - /trade/ice/thing/scraper
    - /trade/ice/thing/hand-marker
    - /trade/ice/thing/ice-saw
  behaviors:
    # ⭐ Off shift, to the company's shed (persistence-model D15 — the house
    # names no offShift, so the hand stays in the story and walks there).
    - brain: /lib/behavior/frequents
      trigger: candidate
      config:
        place: /world/terminus/hollow-mere/shed/place/shed
        visits:
          - { days: [0, 1, 2, 3, 4, 5, 6], hours: [0, 24] }
    - brain: /trade/ice/behavior/harvests
      trigger: candidate
      config: { pool: /world/terminus/hollow-mere/place/pool, shore: /world/terminus/hollow-mere/place/shore, out: north, back: south }
