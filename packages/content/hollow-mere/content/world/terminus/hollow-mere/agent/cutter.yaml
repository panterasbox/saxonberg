class: /platform/agent/Cast
extends: /stuff/agent/costume/student
data:
  name: Bryn
  keywords: [bryn, cutter]
  pronouns: he
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  shortDescription: Bryn the ice cutter
  register: proper
  longDescription: |
    A wiry man in oiled boots with an ice saw over his shoulder, who has been through the ice once and talks about it more than once.
  archetype: labourer
  competence:
    - { discipline: ice-harvesting, asserting: competent }
  # His own kit, born in his hands (an NPC's `props:` — the storage-and-ice
  # sweep): the brain forces `scrape` / `mark` / `cut`, and those verbs bind
  # a tool the cutter HOLDS. The shore's kit is the company's for anyone.
  props:
    - /trade/ice/thing/scraper
    - /trade/ice/thing/hand-marker
    - /trade/ice/thing/ice-saw
  behaviors:
    - brain: /trade/ice/behavior/harvests
      trigger: candidate
      config: { pool: /world/terminus/hollow-mere/location/pool, shore: /world/terminus/hollow-mere/location/shore, out: north, back: south }
