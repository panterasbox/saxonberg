class: /platform/location/Street
data:
  shortDescription: mere road
  keywords: [road, track, lane]
  register: definite
  _address: terminus/hollow-mere/road
  _biomePath: /stuff/idea/biome/outdoor/baseline
  ambientIntensity: 30000
  ambientColorTemperature: 5800
  longDescription: |
    A rutted track comes down out of the hills and runs along the foot of a long grey bank before it reaches the water. Sledge runners have cut it as deep as the wheels have. East, a pair of tall windowless sheds stand back to back, the near one with a loading platform along its face; a smaller house hunches by itself to the northwest, and an empty shed of the same build stands to the south. North, the track runs down to the mere.
  coords: { x: 0, y: 0, z: 0 }
