# The wheat at the top end of the upper bench (field population D15) — one
# of the bench's three stands, a thousand square metres sown last autumn
# and well established. Thin and short: the soil runs out up here, and it shows in the wheat.
#
# ⭐ `groundPart: top-end` roots it in that patch's soil: its water, its
# nitrogen, its depth. It ripens on the season, and the farm cuts it.
# ⚠ An `extends:` row, because a `props:` entry carries no overrides
# (cover build B10).
extends: /trade/farming/thing/plant/wheat
data:
  sownAreaM2: 1000
  groundPart: top-end
  growthStage: established
  # Fifty-five good days in — the established mark, so the season ripens
  # it rather than starting it again.
  _maturity: 4752000
  _vigor: 0.45
