# The weathering ground — ⭐ where the brickmaster's clay spends its winter
# (ceramics S2). Dug in autumn and thrown up in long low heaps in the open,
# it lies here through the frosts: every day the air crosses freezing, the
# water in it freezes and thaws and opens the plates, and by spring it is
# mellow. A heap kept in a shed stays raw — so this ground is OPEN, no roof
# and no walls, on purpose.
#
# ⭐ Persistent (AC 22): a heap left here is somebody's winter, and a restart
# that forgot it would put the clay back in the ground.
class: /platform/location/PersistentLocale
data:
  shortDescription: weathering ground
  keywords: [ground, weathering, heaps, field, brickfield, yard]
  register: definite
  _address: terminus/hearts-delight/brickfield
  _biomePath: /stuff/idea/biome/outdoor/baseline
  ambientIntensity: 40000
  ambientColorTemperature: 5800
  # ⭐ The ground IS the clay, trodden and never dressed — it soils you.
  floor:
    material: /world/terminus/hearts-delight/idea/material/alluvial-clay
    worked: false
    onGrade: true
  longDescription: |
    A wide trodden yard of red clay on the flats, rutted by barrows, with long low heaps of dug clay lying in rows across it like graves in a churchyard. The older heaps have slumped and gone pale and crumbly at the edges; the newest are still slick and dark where the spade cut them.

    The pit is down the slope to the south. East, a temper pit and the moulding shed; beyond them the hacks and the smoke of a clamp. The road back to the valley gate goes off northwest.
  coords: { x: 0, y: 0, z: 0 }
  exits:
    northwest:
      destination: /world/terminus/hearts-delight/location/valley-gate
      media: [ground]
      edgeMinutes: 5
    south:
      destination: /world/terminus/hearts-delight/brickfield/location/clay-pit
      media: [ground]
      edgeMinutes: 1
    east:
      destination: /world/terminus/hearts-delight/brickfield/location/temper-pit
      media: [ground]
      edgeMinutes: 1
  cast:
    - /world/terminus/hearts-delight/brickfield/agent/brickmaster
  details:
    rows:
      keywords: [rows, graves, slope]
      description: |
        The heaps are laid out in the order they were dug, so you can read the autumn off them from one end to the other. Nobody tempers a heap until the winter has been at it.
