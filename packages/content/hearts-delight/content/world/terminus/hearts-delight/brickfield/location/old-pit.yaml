      destination: /world/terminus/hearts-delight/brickfield/location/clay-pit
      media: [ground]
      edgeMinutes: 1
  details:
    reeds:
      keywords: [reeds, moorhen, banks]
      description: |
        Reeds have taken the shallow end where the barrow-run used to go down. The banks are steep and slick: whatever was cut here was cut to the last spadeful above the water.
