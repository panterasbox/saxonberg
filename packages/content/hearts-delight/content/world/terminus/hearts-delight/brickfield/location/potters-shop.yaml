  details:
    door:
      keywords: [door, window, light]
      description: |
        A big many-paned window over the wheel, and the door beside it propped open — a potter throws by daylight, and so does she.
    boards:
      keywords: [boards, ware, drying]
      description: |
        Long boards on brackets, the ware on them in the order it was thrown: dark and slick at one end, leather-coloured in the middle, pale and dusty at the far end where it is ready to fire.
