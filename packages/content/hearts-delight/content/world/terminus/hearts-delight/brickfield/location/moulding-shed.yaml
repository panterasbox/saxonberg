  longDescription: |
    A long plank shed open along its south side, its floor beaten clay gritty with sand. Two stout moulding tables stand down the middle, each with its wooden mould, its heap of sand and its strike, and a pallet board beside it for the bricks to go out on.

    A gauging rod hangs on a nail by the door for whoever wants to argue about whether a brick is the statute's. The temper yard is west; the hacks run south; east, up a step, is the potter's shop.
