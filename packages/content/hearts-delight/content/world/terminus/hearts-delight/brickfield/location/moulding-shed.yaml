# The moulding shed — ⭐ where the brick is made (ceramics S4): an open-
# sided shed over the moulders' tables. At a table `shape clay into brick`
# is a day's work — sand the mould, throw the clot, strike it off, turn it
# out — and the moulder's band decides how many come off by evening. The
# MOULD decides the brick; the hand only decides how many.
#
# ⚠ The screw press and the tile and brick moulds (S16) are the moulding
# wave's (W7): it stands its press here when it ships.
#
# ⭐ Persistent: a day's green bricks are a day's work.
