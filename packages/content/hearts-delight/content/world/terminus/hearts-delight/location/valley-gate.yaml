# The valley gate — where the road comes in off the crossroads.
#
# ⚠ The flats are DESCRIBED and not built. The orchards, the drying
# yards and the peach-can tower are the valley's own build; what ships
# here is the one road a grain chain needs and the prose that says the
# rest is there.
class: /platform/location/Street
data:
  # ⭐ The valley lights this way (energy build) — gas lamps on standards,
  # burning the town's oil after dusk. A PROPERTY of the street, nothing
  # minted; whether they burn is derived (funded ∧ dark ∧ oil in the store).
  # Seniority 1: the entrance is the LAST to go dark when the oil runs short.
  publicLighting:
    flux: 300
    colorTemperature: 2200
    detail: lamps
    seniority: 1
  shortDescription: valley gate
  keywords: [gate, valley, road, entrance]
  register: definite
  alternateNames: [entrance, mouth]
  _address: terminus/hearts-delight/valley-gate
  _biomePath: /stuff/idea/biome/outdoor/baseline
  ambientIntensity: 40000
  ambientColorTemperature: 5800
  longDescription: |
    The road drops off the shoulder of the hill and the whole valley opens up at once. Orchard after orchard on the flat ground either side of the river, the trees in dead-straight rows, and the drying yards behind them showing as pale rectangles in all that green. Somewhere down there a tower with a tin roof.

    None of it is yours and none of it is grain. This is fruit country, and it is rich, and it says so.

    A lane climbs away to the west, up onto the dry bench above the flats, where the ground is thinner and the farms are smaller.
  coords: { x: 0, y: 0, z: 0 }
  exits:
    north:
      destination: /world/terminus/delight-road/crossroads
      media: [ground]
      edgeMinutes: 10
    west:
      destination: /world/terminus/hearts-delight/location/bench-lane
      media: [ground]
      edgeMinutes: 9
    east:
      destination: /world/terminus/hearts-delight/public-works/location/yard
      media: [ground]
      edgeMinutes: 1
  details:
    # ⭐ The static detail MQL binds `look lamps` to; PublicLightingMixin
    # appends the live state ("burning, fed from the town's oil store").
    lamps:
      keywords: [lamps, lamp, standards, lighting]
      description: |
        Gaslamp standards along the road — plain iron posts with glass heads on cross-bars, the frontier's version of the city's fluted ironwork, fed from the valley's own oil rather than any wire.
    orchards:
      keywords: [orchards, orchard, trees, fruit, flats]
      description: |
        Apricots mostly, by the shape of them, with peaches further out. The rows run true and the ground under them is bare and worked. Every one of these trees is somebody's pension.
    river:
      keywords: [river, delight, water]
      description: |
        The Delight, running wide and slow across the flats with willows down both banks. It has senior rights over every acre you can see from here, which is why the flats are orchards and the bench is not.
