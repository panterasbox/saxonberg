# The mill house (cleanliness D22) — the stones, under a roof, at the top of
# the wheel shaft. ⭐ ENCLOSED, so the flour the stones throw hangs in the
# air, grind on grind, until somebody sweeps it down — and enough of it,
# with a spark, goes up. Damp the floor and sweep, and it does not.
class: /platform/location/PersistentLocale
data:
  shortDescription: mill house
  keywords: [mill, "mill house", millhouse, stones]
  register: definite
  _address: terminus/hearts-delight/millsite/mill-house
  _biomePath: /stuff/idea/biome/indoor/baseline
  # What it is made of (rubber's construction: walls and roof).
  roof: { material: /stuff/idea/material/rock/slate, thicknessM: 0.01 }
  ambientSource: sky
  ambientOpening: windows
  ambientIntensity: 6000
  ambientColorTemperature: 5000
  enclosure: { material: /stuff/idea/material/wood/oak, thicknessM: 0.05 }
  longDescription: |
    A low timbered room at the top of the wheel shaft, loud with the stones and the water under the floor. Everything in it is dusted white — the beams, the bins, the sacks, the miller — and the air in the light from the little windows is thick with it.
  # ⭐ A small room (4 m a side, 64 m³): the zone's 20 m cell would make
  # it 8,000 m³, and three grinds' dust in that never reaches a nose,
  # never mind a flash. The stones' house is the size a stones' house is.
  extent: 4
  coords: { x: -14, y: -6, z: 4 }
  exits:
    # ⭐ East, back out to the millsite: one zone, so a compass exit (a
    # named `out` throws at hydrate inside a zone — `lint:locations`).
    east:
      destination: /world/terminus/hearts-delight/location/millsite
      media: [ground]
      edgeMinutes: 1
  props:
    - /world/terminus/hearts-delight/thing/mill-stones
    - /trade/milling/thing/toll-bin
    - /stuff/thing/gear/broom
  cast:
    - /world/terminus/hearts-delight/agent/miller
  details:
    windows:
      keywords: [windows, window, light]
      description: |
        Two little windows under the eaves, their glass furred white.
    dust:
      keywords: [dust, flour, haze, air]
      description: |
        Flour dust, hanging in the air and lying on every ledge. A miller who does not sweep is a miller waiting for a spark.
