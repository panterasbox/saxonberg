  details:
    race:
      keywords: [race, leat, channel, tailrace, hatch]
      description: |
        A second race, shallower than the mill's, taken off below the grist mill's tailrace and led along the bank to an undershot wheel. A hatch at its head shuts the water off; when the hatch is down, the frame stops.
    stacks:
      keywords: [stacks, stack, sticks, lean-to, chalk]
      description: |
        Boards stacked flat with thin sticks laid across between every course, so the air can reach both faces of every board. Each stack is chalked with the date it was sawn. ⭐ That is the whole technology of seasoning: air, time, and a roof to keep the rain off. Green wood is cheap; the date on the stack is what you pay for.
    pit:
      keywords: [pit, sawpit, saw-pit]
      description: |
        An old sawpit in the yard, lined with planks, from before there was a wheel. A long two-handled saw still hangs over it. It still works — for two people with an afternoon and a log the frame is not free for.
