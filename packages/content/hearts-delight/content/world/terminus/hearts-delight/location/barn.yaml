# The barn — ⚠ where the FINITE stock lives.
#
# ⭐ A static authored farm is a source NODE, never a faucet. What is in
# here is what there is: eight sacks, consigned to the shelf outside, and
# when they are gone they are gone until somebody sows the bench again.
# The `distribution` counter is a faucet and is honest precisely because
# it admits to being one; this is not, and must not become one.
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: barn
  keywords: [barn, store, threshing]
  register: definite
  _address: terminus/hearts-delight/barn
  _biomePath: /stuff/idea/biome/indoor/baseline
  # ⭐ No ambient of its own: this room is LIT BY SPILL from
  # the farmstead yard, through a doorway that stands open. The light walk
  # already carries daylight one hop at full strength, so the room is
  # bright by day and DARK at night — which is the whole point, and it
  # costs no authored number at all.
  longDescription: |
    Big, dim and dusty, with a threshing floor of beaten earth worn hollow in the middle and light coming in through the gaps in the boards in flat bright bars. Flails on pegs. A winnowing fan.

    Sacks are stacked against the far wall on a pallet of old timber, up off the floor and away from the rats.
  coords: { x: -20, y: 1, z: 7 }
  # ⚠ CARDINAL, and the coords agree with it. `CartesianLocation.addExit`
  # admits a named direction only ACROSS a zone boundary — a grid exit
  # inside one zone must have a known inverse, and `out`/`barn` has none.
  # The barn genuinely stands on the north side of the yard, so the
  # compass point is not a re-spelling: it is where the building is.
  exits:
    south:
      destination: /world/terminus/hearts-delight/location/farmstead-yard
      media: [ground]
      edgeMinutes: 1
  props:
    - /trade/farming/thing/crop/wheat
    - /trade/farming/thing/crop/wheat
    - /trade/farming/thing/crop/wheat
    - /trade/farming/thing/crop/wheat
    - /trade/farming/thing/crop/wheat
    - /trade/farming/thing/crop/wheat
    - /trade/farming/thing/crop/wheat
    - /trade/farming/thing/crop/wheat
