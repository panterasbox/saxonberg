# The creamery's hearth (dairy D6) — a low hearth for warming the vat: set
# the vat on it (`heat vat`) to scald the milk, take it off to cool. ⭐ A
# DAIRY fire, not a bread oven: it holds a gentle heat, which is the dial a
# dairy actually has. Laid and lit, with a day's oak in the bed.
class: /platform/thing/Hearth
data:
  shortDescription: low hearth
  keywords: [hearth, fire, fireplace]
  register: definite
  longDescription: >-
    A low brick hearth with an iron trivet over the fire, set well away
    from the shelves. The bricks are black above it and the trivet is worn
    bright where the vat's feet go.
  lit: true
  burnTemperatureK: 520
  maxBurnPowerW: 4000
  fuelCapacityKg: 30
  fuelBed:
    /stuff/idea/material/wood/oak: 30
  heatOutputW: 1200
  placements: [on]
  _materialPath: /stuff/idea/material/ceramic/ceramic
  mass: 400
