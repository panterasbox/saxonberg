  details:
    windows:
      keywords: [windows, window, light, shutters]
      description: |
        High, north-facing and louvred, so the light comes in and the sun does not.
    trap:
      keywords: [trap, steps, hatch]
      description: |
        A wooden hatch propped open over stone steps. The air coming up them is cold.
