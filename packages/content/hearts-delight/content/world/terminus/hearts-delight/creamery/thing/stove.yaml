# The creamery's stove — a tiled stove against the north wall that the
# co-op keeps in through the cold months (dairy, found by the drive once
# the climate build gave the Delight a winter). ⭐ A SPACE heater, the
# `Hearth` class, deliberately beside the low hearth (an `Oven`, which
# heats only the vat set on it): a curd will not set below 283 K and milk
# will not cream in a cold room, so a winter dairy keeps the room warm.
# In summer nobody needs it lit — and a lit stove in July makes greasy
# butter, which is the player's call to make.
#
# ⚠ Lit with a week's charge (≈ 13 kg of oak a day at 2.5 kW), and it
# goes out when the charge does: `stoke` it, as any fire.
class: /platform/thing/Hearth
data:
  shortDescription: tiled stove
  keywords: [stove, "tiled stove", tiles]
  register: definite
  longDescription: >
    A tall stove faced in green glazed tiles, standing against the north
    wall with its door shut on the fire. The tiles hold the heat and give
    it back slowly; the room is kept just warm enough for milk to work.
  lit: true
  heatOutputW: 2500
  emittedIntensity: 20
  emittedColorTemperature: 1900
  maxBurnPowerW: 6000
  fuelCapacityKg: 100
  fuelBed:
    /stuff/idea/material/wood/oak: 100
  _materialPath: /stuff/idea/material/ceramic/ceramic
  mass: 600
