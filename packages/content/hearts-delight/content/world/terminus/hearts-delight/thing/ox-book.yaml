# ⭐⭐ **The Delight oxen** — a working pair, and the book that says so.
#
# ## Why cattle HERE and not on the bench
#
# ⚠ The flock book argues against cattle on the upper bench in its own
# words: *"thin dry ground is sheep country… a dairy cow asks you twice a
# game day; a flock asks for lambing and shearing, twice a year, hard."*
# Dropping a dairy herd up there would contradict reasoning the soil rows
# produced, so this is not a herd and it is not on the bench.
#
# ⭐ **It is a plough team on the flats**, which is what cattle are for on
# a farm this size. `ox.yaml`'s own docstring already says the economics:
# draught power IS body mass, so an ox is worth about ten people in the
# traces — and it eats whether or not it works, which is the honest cost
# of a depreciating asset that consumes.
#
# ## ⭐⭐⭐ And the beef is what happens when an ox is DONE WORKING
#
# Which is how pre-modern beef actually happened: nobody raised cattle to
# eat, they ate the worn-out ox. So the farm needs no beef herd to put a
# bullock on the block, and the choice of WHEN — another season in the
# traces, or the block while there is still flesh on it — is a real one
# with no right answer.
#
# ⭐ The oxen are also the muscle model's best authored gift, and nobody
# planned it: `ox.yaml` has *"a yoke-worn patch across the shoulders"*,
# written long before any of this. The hardest-working muscle in the game
# is on the animal whose shoulder the row already calls worn — so a
# Delight ox's shoulder is the toughest cut in the valley and its
# tenderloin the prize.
#
# ## Two, because that is what a plough takes
#
# A single ox pulls nothing a farm needs pulling; a yoke is a PAIR. Two is
# not a dial, it is what the implement requires.
class: /trade/ranching/thing/Herdbook
data:
  # ⭐ **"ox register", not "ox book"** — a farmer keeps a flock BOOK, an ox
  # REGISTER and a hen TALLY, because they are three different kinds of
  # record and he never confused them either. The keywords keep
  # `"ox book"` so anybody who types that is still understood.
  #
  # ⚠⚠ The rename is better WRITING and it did **not** fix what it was
  # first reached for. Three herdbooks hang on this shelf now, and
  # `look flock book` raises a disambiguation prompt whichever way they
  # are named: `look`'s target is greedy and its matcher scores loosely
  # across three near-identical records, so narrowing keywords and
  # renaming display names both left the prompt exactly where it was.
  # Measured, twice, with the props removed as the counterfactual.
  #
  # ⭐ And the prompt is CORRECT. Three similar records in one room is a
  # question the game is right to ask, and a player answers it. What it
  # broke was a TEST — the carcass-chain drive's `look flock book` is a
  # loose read, an unanswered foreground prompt poisons a wire session,
  # and twenty-two of its checkpoints went down in one cascade. The fix
  # is in that drive's read, not in this yard. ⚠ The honest summary: the
  # content is right, the engine is right, and the instrument needed to
  # name what it meant.
  shortDescription: ox register
  # ⚠ No bare `book` or `register` — the flock book in this same yard
  # claims both, and three herdbooks on one shelf is a disambiguation
  # prompt waiting to wedge somebody's session. See the hen book's note.
  keywords: [oxbook, "ox register", "ox book", oxen, team]
  register: definite
  longDescription: >-
    A single stiff page sewn into a board cover, hanging by the harness
    pegs. Two animals on it, each with a name, a year and a column of
    seasons worked. The second column is longer than the first.
  mass: 0.3
  herdId: delight-oxen
  herdName: the Delight team
  speciesPath: /stuff/idea/species/animalia/chordata/mammalia/artiodactyla/bovidae/bos/taurus
  tally: 2
  # ⭐ Eight years old: a pair most of the way through a working life,
  # which is what makes the "another season or the block" question live
  # rather than hypothetical.
  foundingMeanAgeDays: 2920
  holderRef: organization:/world/terminus/hearts-delight/idea/farm-business
  # ⚠ The FLATS, not the bench — the ground with the water rights and the
  # ploughing to do. The bench is sheep country and the flock book says
  # why.
  homeExtent: /world/terminus/hearts-delight/location/farmstead-yard
