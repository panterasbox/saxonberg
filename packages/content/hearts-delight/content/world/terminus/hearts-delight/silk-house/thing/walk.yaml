# The walk's ground — a `Panel`, so the trees remember being cut across a
# restart: four mulberries and the kermes oak.
class: /trade/forestry/thing/Panel
data:
  shortDescription: mulberry walk
  keywords: [mulberries, trees, walk, panel]
  register: indefinite
  longDescription: |
    Four mulberries in a short double row and a kermes oak in the corner, the ground between them trodden bare.
  _materialPath: /stuff/idea/material/wood/pine
  mass: 2400
  fixedGround: true
  landRequirementM2: 80
  interiorBulk: true
  interiorCapacity: 160
  interiorMaterial: /stuff/idea/material/bulk/potting-soil
  interiorAmount: 160
  reserves:
    moisture:
      capacityValue: 80
      currentValue: 80
      unit: "L"
      theme: cultivation
      floorEffect: wilting
    nitrogen:
      capacityValue: 100
      currentValue: 100
      unit: "%"
      theme: cultivation
      floorEffect: spent
  staticSlots:
    - name: plant
      accepts: SlottableMixin
      capacity: 6
      userFacingDetail: planting
  props:
    - { template: /world/terminus/hearts-delight/silk-house/thing/walk-mulberry, count: 4 }
    - /trade/farming/thing/plant/kermes-oak
  details:
    planting:
      keywords: [ground, rows]
      description: |
        Bare trodden ground, swept, with the leaf litter raked under the trees.
