  longDescription: |
    The Delight runs wide and shallow over the gravel here, and on its near bank a timber headgate stands across the mouth of a ditch, its board in iron guides with a lifting rack and a chained padlock. Below it, a plank weir with a notched crest spills the river's water over in a smooth sheet, and a painted staff stands up out of the shallows marked in feet and tenths. The ditch runs off west along the foot of the bench.
