# At the headgate (water-supply W6) — where the Delight is taken into the
# ditch. The headgate, the measuring weir below it and the staff gauge
# stand here: the three things a ditch rider reads every morning.
class: /platform/location/Street
data:
  shortDescription: headgate on the Delight
  keywords: [headgate, flats, ditch, river]
  register: definite
