# The upper bench — ⭐⭐ **where the grain grows, and the geography chose
# it, not the build.**
#
# The staged locality bible already had this: *"the upper bench — thin
# soil, JUNIOR rights"* above *"the flats — deep alluvium, SENIOR
# rights."* Cereal is the low-value dryland crop, so it belongs on the
# bench as the poor relation of the fruit. Nothing had to be overridden.
#
# ⚠⚠ And it is **not** the university's teaching farm. That was the first
# placement and it was wrong: the campus field was the only authored
# `Field` in the world, so the commodity crop went there — which is
# convenience wearing an argument's clothes. A pedagogy location's
# purpose is its identity. There are two kinds of farm: the MANAGED one
# that runs the whole framework (the campus is one), and the STATIC
# AUTHORED one whose job is to feed the supply chain. This is the second
# kind.
#
# `areaM2: 4000` — ten times the college's home field, and a tenth as
# good. That is what dryland arable is.
class: /trade/farming/location/Field
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  fieldName: the upper bench
  shortDescription: upper bench
  keywords: [bench, field, ground, corn, wheat]
  register: definite
  _address: terminus/hearts-delight/upper-bench
  longDescription: |
    Four acres of the thinnest ground in the valley, running back from the lane in one long strip to where the hill gets too steep to plough. Stones everywhere. The wheat in it is a good deal shorter than wheat ought to be and there are bare patches up at the top end where the soil runs out altogether.

    From up here you can see the whole of the flats below, green and wet and worth ten times this.
  coords: { x: -20, y: 4, z: 8 }
  _biomePath: /stuff/idea/biome/outdoor/meadow
  # ⚠ 20-metre cells and 4000 m²: lux is lumen over AREA, so the outdoor
  # figure has to be big or every object in the field reads "something".
  ambientIntensity: 40000
  ambientColorTemperature: 5800
  groundSpotX: 9
  groundSpotY: 3
  areaM2: 4000
  # No ley. This ground has never had clover on it and it shows.
  legumeFraction: 0
  exits:
    down:
      destination: /world/hearts-delight/location/farmstead-yard
      media: [ground]
      edgeMinutes: 4
  props:
    - /trade/farming/thing/plant/wheat
    - /trade/farming/thing/plant/wheat
    - /trade/farming/thing/plant/wheat
