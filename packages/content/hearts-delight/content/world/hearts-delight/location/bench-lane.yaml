# The bench lane — the climb out of the fruit country onto the thin
# ground, and ⭐ the geography doing the explaining.
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: bench lane
  keywords: [lane, bench, track, climb]
  register: definite
  _address: terminus/hearts-delight/bench-lane
  _biomePath: /stuff/idea/biome/outdoor/baseline
  ambientIntensity: 40000
  ambientColorTemperature: 5800
  longDescription: |
    A stony lane climbing out of the orchards in three long zigzags. The irrigation ditches stop about a third of the way up — there is a last one, cut and lined and dry, and then nothing above it but what the sky brings.

    ⭐ That line is the whole economy of the valley written on a hillside. Below it, water; above it, not. Below it, fruit worth carting; above it, corn.

    The lane goes on west to a farmstead. Down to the south you can hear water falling — the river goes over a ledge there, and there is a roof beside it.
  coords: { x: -12, y: 0, z: 6 }
  exits:
    east:
      destination: /world/hearts-delight/location/valley-gate
      media: [ground]
      edgeMinutes: 9
    west:
      destination: /world/hearts-delight/location/farmstead-yard
      media: [ground]
      edgeMinutes: 6
    south:
      destination: /world/hearts-delight/location/millsite
      media: [ground]
      edgeMinutes: 5
  details:
    ditch:
      keywords: [ditch, ditches, irrigation, channel, line]
      description: |
        Stone-lined, a foot across, and bone dry. It is the last ditch on this side and it marks the top of the senior rights: everything below it was here first and takes its water first. Nothing above it has any claim at all in a dry year.
