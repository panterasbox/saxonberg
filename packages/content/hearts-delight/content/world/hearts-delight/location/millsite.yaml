# The millsite — ⭐⭐ **at the FALL, which is the only place a mill can
# be**, and the siting is the lesson.
#
# The obvious place for a mill is the biggest water. It is wrong: power
# is `rho*g*dh*Q*eta` and the drop and the flow MULTIPLY, so a great slow
# river across flat country has all the flow in the world and no power
# at all. A mill goes where the water FALLS.
#
# ⚠ And it is not at the Kestrel falls, which was the first siting and
# was wrong for a different reason: those falls sit between the MINE and
# the city, with no grain within a day of them. A grain mill goes where
# the grain is — von Thünen, and the reason every valley in Europe had
# its own mill rather than one big one.
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  shortDescription: millsite
  keywords: [millsite, mill, wheel, weir, fall]
  register: definite
  alternateNames: [millhouse, "mill house"]
  _address: terminus/hearts-delight/millsite
  _biomePath: /stuff/idea/biome/outdoor/baseline
  ambientIntensity: 20000
  ambientColorTemperature: 5400
  longDescription: |
    The Delight comes round a shoulder of rock here and drops — not far, twenty feet at most, but all at once and all the year round. Somebody a long time ago threw a weir across above the drop and cut a race along the bank, and the water goes down the race and onto the wheel instead of over the ledge.

    The mill is built into the slope so the stones sit at the top of the wheel shaft. It is louder inside than you expect and everything in it is dusted white.

    A bin by the stairs, a pair of stones, and the smell of warm flour.
  coords: { x: -13, y: -6, z: 4 }
  exits:
    north:
      destination: /world/hearts-delight/location/bench-lane
      media: [ground]
      edgeMinutes: 5
  props:
    - /world/hearts-delight/thing/millrace
    - /trade/milling/thing/grist-mill
    - /trade/milling/thing/toll-bin
  cast:
    - /world/hearts-delight/agent/miller
  details:
    weir:
      keywords: [weir, dam, race, millrace, ledge, fall]
      description: |
        A low stone weir across the whole river, backing the water up into a wide still pool, with the race taken off the near end. ⭐ The weir is the DROP, built: the river fell here anyway, and the weir is what turns falling into a head you can point at a wheel. It passes everything it takes — nothing is diverted away, nothing is lost downstream. The valley below would notice at once if it were.
    wheel:
      keywords: [wheel, waterwheel]
      description: |
        Overshot, because there is head enough for it — the water comes onto the top of the wheel and its weight does the work rather than its push. Perhaps twelve feet across, elm buckets, turning slow. In August it turns slower.
