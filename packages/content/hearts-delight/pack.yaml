id: hearts-delight
version: 0.1.0
root: /world/terminus/hearts-delight
description: >-
  Heart's Delight — the valley that feeds the city. ⭐ A STATIC AUTHORED
  farm rather than a managed one: it runs no framework, it is content
  whose job is to feed the supply chain, and it is a source NODE rather
  than a faucet — located, so it costs the journey; seasonal, so it costs
  the wait; and finite, so it can run out. The flats grow fruit on deep
  alluvium with senior water rights; the upper bench is thin soil and
  junior rights, which is why it grows the low-value dryland crop and why
  the grain is the poor relation of the peaches. The mill is at the fall,
  because that is where a mill is. ⭐ The valley is GAS-LIT (energy build):
  its ways carry lamp standards fed from a public-works oil store, funded
  by a parish government and refilled from the fuel market — the frontier
  epoch of the same street-lighting service the city runs on the grid.
requires:
  groups:
    - name: hearts-delight
      purpose: the valley's own body
      owner: { office: prime-minister }
  title:
    # Under the realm root (economic bootstrap D5): situs walks up to terminus.
    - extent: /world/terminus/hearts-delight
      parentParcel: /world/terminus
      holder: { group: hearts-delight }
      landUse: agricultural
    # ⭐⭐ **The close is TITLED, and to Quist's business rather than to
    # Quist.** A `player` holder cannot name an NPC, and a `Business`
    # extends `Organization` whose head is the appointing authority — so
    # `AccessApi.can` answers for Quist through his farm, and
    # `ParcelApi.ownerOf(close)` names the farm.
    #
    # ⭐ Why it matters: a beekeeper standing a hive in somebody else's
    # orchard is the build's whole premise, and the premise is only real
    # if the orchard demonstrably belongs to somebody. ⚠ Nothing is
    # GATED on it — `drop` refuses nobody, and the requirements do not
    # ask that it should. The polity's criterion exists and the code
    # enforces nothing, which is the honest arrangement: consent is a
    # thing people can point at, not a thing the engine adjudicates.
    #
    # ⚠ Declared here rather than produced at boot because a manifest
    # claim is the only declarative seam (`PackApi.install` →
    # `ParcelApi.grant`), it reconciles idempotently, and this pack's
    # README forbids code.
    - extent: /world/terminus/hearts-delight/bench-field/location/orchard-close
      parentParcel: /world/terminus/hearts-delight
      holder: { organization: /world/terminus/hearts-delight/idea/farm-business }
      landUse: agricultural
      areaM2: 1200

# ⭐⭐ **What has to be RESIDENT before a player can reach the flock.**
#
# The boot union is the fifth of the five reachability links and the one
# that fails closed and silent. Three entries, each for a reason that has
# already cost this codebase a build:
boot:
  # ⚠ A `props:` edit NEVER reaches a booted world, and a room nothing has
  # touched is a room whose props have not been minted. `draft` is
  # afforded by the flock book, so a flock book nobody has stood up is a
  # flock that does not exist — and the refusal would be `unknown-target`
  # on a book the room's own prose describes.
  - { template: /world/terminus/hearts-delight/thing/flock-book, role: producer, reason: "the flock book affords draft/return — the only way into the twelve head, and a prop nothing warms is a prop that is not there" }
  # ⚠⚠ The OX BOOK and the HEN BOOK, for the identical reason, and the ox
  # book's absence from this list is the omission the reachability sweep
  # found: the flock book was warmed and propped, the ox book was
  # neither, and `draft ox` answered `unknown-target` on a team the
  # yard's own prose describes.
  - { template: /world/terminus/hearts-delight/thing/ox-book, role: producer, reason: "the ox book affords draft/return on the team — the only way into the two head, and the sweep found it warmed by nothing and propped nowhere" }
  - { template: /world/terminus/hearts-delight/thing/hen-book, role: producer, reason: "the hen book affords draft/return on the yard hens, and is the realm's only path to a chicken at all — the egg tap and three authored poultry cuts had no bird" }
  # ⚠⚠ The two SPECIES, synchronously, for the reason the ewe's line below
  # gives: `butcheryYield` and `taps()` are both sync species reads, so an
  # inert row is a team with no carcass and a flock with no eggs. ⭐ The
  # hen's matters twice over now — her yield names `trade-cooking`'s three
  # poultry cuts, and an inert species row would read as no species at
  # all, which is what makes the "you cannot butcher a person" gate fail
  # OPEN across a clade walk.
  - { template: /stuff/idea/species/animalia/chordata/mammalia/artiodactyla/bovidae/bos/taurus, role: sync-read, reason: "the ox's butchery yield is a synchronous species read — an inert row is a worn-out ox that opens onto nothing" }
  - { template: /stuff/idea/species/animalia/chordata/aves/galliformes/phasianidae/gallus/domesticus, role: sync-read, reason: "the hen's egg tap and her three poultry cuts are both synchronous species reads — an inert row is a bird with no eggs and no breast" }
  # ⚠⚠ The SPECIES, synchronously. `ProducingMixin.taps()` is a sync read
  # of the host's species and `getSpecies()` is a `findByTemplatePath` —
  # so a drafted ewe whose species nothing stood up has no wool tap and
  # `shear` declines "the sheep does not give that", about the one product
  # the flock exists for. Apiculture learned this the hard way with the
  # honeybee; this is the same line for the sheep.
  #
  # ⭐ And it is now load-bearing twice: `Species.butcheryYield` is read
  # the same synchronous way, and `SpeciesApi.isSentient` answers FALSE
  # for a species that is not resident — so an inert sheep row would make
  # the "you cannot butcher a person" gate fail OPEN on anything sharing
  # its clade walk.
  - { template: /stuff/idea/species/animalia/chordata/mammalia/artiodactyla/bovidae/ovis/aries, role: sync-read, reason: "the ewe's wool tap and butchery yield are both synchronous species reads — an inert row is a flock with no fleece and no carcass" }
  - { template: /stuff/idea/species/animalia/chordata/mammalia/carnivora/canidae/canis/familiaris, role: sync-read, reason: "the collie's EMPTY butchery yield is what refuses the knife — an inert row reads as no species at all, and the refusal changes to 'you cannot make out what it was'" }
