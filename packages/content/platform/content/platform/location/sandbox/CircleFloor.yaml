# /platform/location/sandbox/CircleFloor — the generic circle entry room (the holodeck
# floor). Every circle's lazily-materialized entry space clones from
# this template inside the circle-scoped root, so the room and its
# return passage are circle-born and die with the discard. Skinnable
# later; deliberately spare prose now — the point of the floor is what
# you build on it. See docs/subsystems/sandbox.md.
class: /platform/location/sandbox/CircleFloor
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: the circle floor
  shortDescription: a bare circle floor
  longDescription: >
    A quiet, evenly lit expanse with no walls worth mentioning — the
    raw floor of your circle. Anything could stand here. Nothing does,
    yet. The way out is simply out.
  # "Evenly lit" has to be true mechanically, not just in the prose: a
  # room with no light reads `pitch-black`, and its occupants stop being
  # recognizable to each other.
  #
  # Ambient rather than a fixture, because the fiction says the light
  # has no source — which is exactly what an ambient value models. A
  # glow OBJECT would also have listed itself in the room's contents and
  # been minted circle-born in every circle, for nothing.
  ambientIntensity: 60
  ambientColorTemperature: 5000
