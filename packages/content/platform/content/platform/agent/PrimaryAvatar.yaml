# /platform/agent/PrimaryAvatar — the ONE authored row every played body
# is cloned from. Mechanically an ordinary template; the lifecycle
# distinction is the class, not this row.
#
# Cloned by `EmbodyController.commit` (char-gen) and
# `Login.enterAsGuest` (a throwaway guest), both of which overlay the
# new character's choices and supply the per-player identity as
# `asIdentityPath`. ⭐ No row is ever written per player: identity is a
# minted path and the state lives in `holder_snapshots` via the
# persistence spine.
#
# ⚠⚠ This row lived at `/platform/agent/Avatar/seed` until 2026-10-01,
# and every part of that was a fossil. A signup used to FORK this
# template into a real per-player row at
# `/platform/agent/Avatar/<playerId>`, so the namespace held rows and
# `seed` was a reserved fake playerId guarding against colliding with a
# real one. The forking method (`Application.createDefaultAvatarTemplate`)
# no longer exists anywhere in the code; `SeederManager` is gone;
# `/platform/agent/Avatar/` holds no rows at all now and is purely the
# identity namespace. The row was parked inside a namespace of
# identities, wearing a fake id to avoid colliding with rows that cannot
# exist — and the comment here still described the whole dead machine as
# current, including "the live doc in Mongo is the source of truth" and
# "edit the doc in Mongo directly", both false.
#
# ⭐ Editing THIS YAML is how you change the defaults. It is content.
#
class: /platform/agent/PrimaryAvatar
data:
  pronouns: they
  # NOTE: `startLocation` is no longer a seed literal. Every avatar-mint
  # site (EmbodyController.commit, Login.mintRandomGuestAvatar — and
  # TestHooks for the wire harness) stamps it at clone time from the
  # `defaultStartLocation` app setting (default the lounge Warren), so an
  # operator can move the new-player spawn in-game without a deploy. The
  # separate `evacuationFallback` app setting (default `/platform/location/void`) is
  # the container-typed evac target in `Container.cleanupOnDestruct`.
  # Race-build defaults: every freshly-created Avatar template forks
  # these values. Existing per-user templates predate this addition;
  # OrganismMixin's getSpecies() returns null and getLifecycleState()
  # returns '' for those, both safe no-ops.
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
