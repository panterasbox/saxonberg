# The shade — what you are between dying and re-embodying.
#
# ⭐ The row states the field's DEFAULT and the clone overlays it: the
# player identity and the species are facts about who died, not about
# what a shade is, so they arrive through `dataOverlay` at hydration
# Phase 1 — which lands before `onCreate`, the ordering the old
# constructor arguments existed to guarantee.
#
# ⭐ The overlay lands because there IS data to apply. Until 2026-10-01
# this row had to name a `hydratorClass` to say so, and a row that forgot
# ran no hydration at all — the overlay discarded in silence.
class: /platform/agent/ShadeAvatar
data:
  playerId: ""
