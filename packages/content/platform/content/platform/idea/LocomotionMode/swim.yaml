# Swim — non-passthrough, enablement-gated. Quieter than walk because
# water muffles. bodyProfile horizontal — tripwires at ankle height
# miss a swimming actor.
class: /platform/idea/LocomotionMode
data:
  name: swim
  speed: 0.5
  noiseLevel: quiet
  bodyProfile: horizontal
  groundContact: none
  requiresBodyPlanMode: [swim]
  requiresPosture: []
  costMultiplier: 2.0
  passthrough: false
  conveyanceMixin: null
  enablementMixin: SwimmableMixin
  medium: water
  # ⭐ This mode's own words for a gate (navigation-server D8): the way's
  # verdict and trying it print the same sentence.
  refusals:
    enablement: "You can't swim that way."
    capability: "This water's too rough for you."
