# Drive — passthrough mode. The driver doesn't traverse on their own;
# the Drivable host engages its vehicularMode for the traversal.
class: /platform/idea/LocomotionMode
data:
  name: drive
  requiresBodyPlanMode: []
  requiresPosture: []
  costMultiplier: 1.0
  passthrough: true
  conveyanceMixin: DrivableMixin
  enablementMixin: null
  medium: null
  # ⭐ This mode's own words for a gate (navigation-server D8): the way's
  # verdict and trying it print the same sentence.
  refusals:
    noConveyance: "You're not driving anything."
