# Fly — non-passthrough, enablement-gated. Faster than walk; airborne
# (groundContact: none) — pressure plates miss a flying actor.
class: /platform/idea/LocomotionMode
data:
  name: fly
  speed: 1.5
  noiseLevel: quiet
  bodyProfile: horizontal
  groundContact: none
  requiresBodyPlanMode: [fly]
  requiresPosture: []
  costMultiplier: 0.7
  passthrough: false
  conveyanceMixin: null
  enablementMixin: FlyableMixin
  medium: air
  # ⭐ This mode's own words for a gate (navigation-server D8): the way's
  # verdict and trying it print the same sentence.
  refusals:
    enablement: "There's no room to fly here."
    capability: "The wind's too strong for you to fly."
