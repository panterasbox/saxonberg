# Climb — non-passthrough, enablement-gated. Engagement persists while
# the destination still composes Climbable (or contains a Climbable);
# otherwise transient.
class: /platform/idea/LocomotionMode
data:
  name: climb
  speed: 0.5
  noiseLevel: normal
  bodyProfile: varied
  groundContact: partial
  requiresBodyPlanMode: [climb]
  requiresPosture: []
  costMultiplier: 2.0
  passthrough: false
  conveyanceMixin: null
  enablementMixin: ClimbableMixin
  medium: vertical
  # ⭐ A ladder wants both hands (size and carrying D20): the mode gate
  # refuses `hands-needed`, naming what you hold.
  hands: 2
