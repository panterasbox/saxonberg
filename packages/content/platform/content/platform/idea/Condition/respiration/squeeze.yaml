# The squeeze — pain in the ears from going down without clearing them
# (underwater D15). The water's weight presses on the eardrum metre by
# metre; `equalize` between bands never hurts, and a trained diver takes
# more before it does. A landed impulse that fades as the pressure eases.
class: /platform/idea/Condition
data:
  name: squeeze
  signature:
    - { kind: expression, bands: 1 }
  progression:
    law: decay
    decayPerSec: 0.0005
  resolution:
    by: rest
  observableSigns: [wincing, hand-to-ear]
  contagion: null
