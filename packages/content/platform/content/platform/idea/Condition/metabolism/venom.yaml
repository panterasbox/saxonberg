# Envenomation — a fast, potent acute poison (a bite / sting). High
# potency, fast absorption (short purge window), moderate clearance.
# Pure poison: the lowest band is already harm. The antidote (antivenin)
# crashes the burden via the ResolutionSpec seam.
class: /platform/idea/Condition
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: envenomation
  # ⭐ A fast poison drives the heart and takes the legs out from
  # under you. Both scale with the burden band, so the antivenin's
  # crash of the burden is felt immediately.
  signature:
    - { kind: vital, sign: heartRate, perHour: 18 }
    - { kind: reserve, reserve: endurance, pctPerHour: -4 }
  progression:
    law: burden
  resolution:
    by: antivenin
  observableSigns: [swelling, pain, weakness]
  contagion: null
  toxinBehavior:
    toxinType: venom
    absorptionRate: 8
    clearanceRate: 0.05
    potency: 2
    bands:
      - { threshold: 3, severity: 1 }
      - { threshold: 8, severity: 2 }
      - { threshold: 15, severity: 3 }
