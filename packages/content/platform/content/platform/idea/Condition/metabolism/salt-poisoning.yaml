# Salt poisoning — what drinking seawater does (underwater D29 seam 4).
# Seawater is saltier than the kidneys can make urine, so every litre
# drunk costs more water to shed than it brought: the first thing it does
# is make you thirstier. Drink enough and the salt itself makes you ill —
# nausea, confusion. The castaway's lesson, derived from the salt.
#
# Taken up from the `salt` toxin a salt-water material carries; cleared
# slowly, and faster with fresh water (the hydration it drains is what
# carries it off).
class: /platform/idea/Condition
data:
  name: salt poisoning
  signature:
    - { kind: reserve, reserve: hydration, pctPerHour: -12 }
    - { kind: expression, bands: 1 }
  progression:
    law: burden
  resolution:
    by: fluid
  observableSigns: [thirsty, nauseous, confused]
  contagion: null
  toxinBehavior:
    toxinType: salt
    absorptionRate: 1
    clearanceRate: 0.03
    potency: 1
    bands:
      - { threshold: 8, severity: 1 }
      - { threshold: 30, severity: 2 }
