# faster than carbon monoxide (it does not bind the blood).
class: /platform/idea/Condition
data:
  name: sulfur-dioxide-poisoning
  signature:
    - { kind: vital, sign: spo2, perHour: -3 }
  progression:
    law: burden
  resolution:
    by: fresh-air
  observableSigns: [coughing, watery-eyed]
  contagion: null
  toxinBehavior:
    toxinType: sulfurDioxide
    absorptionRate: 1
    clearanceRate: 0.2
    potency: 1
    bands:
      - { threshold: 10, severity: 1 }
      - { threshold: 40, severity: 2 }
