# Lead poisoning — wired but its CHRONIC content is deferred (it needs
# the material-leaching pipeline + prodromal staged conditions for
# legibility). v1 ships only a slow clearance + a single acute band; the
# burden socket already handles chronic mechanically (slow clearance +
# small repeated doses accumulate on the same scalar). Pure poison.
class: /platform/idea/Condition
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: lead-poisoning
  # ⭐⭐ The cognitive tax, and it is the honest one: chronic lead
  # poisoning dulls you. `expression` costs a BAND of expressed skill
  # while the burden lasts — it never touches the Transcript, so what
  # you have done stays true and only what you can currently do falls.
  signature:
    - { kind: expression, bands: 1 }
  progression:
    law: burden
  resolution:
    by: chelation
  observableSigns: [pallid, confused, aching]
  contagion: null
  toxinBehavior:
    toxinType: lead
    absorptionRate: 1
    clearanceRate: 0.01
    potency: 1
    bands:
      - { threshold: 5, severity: 1 }
