# Lead poisoning — the slow one. ⭐ (paint D14) Every lead dose in the
# world now arrives: the rows carried the condition's NAME
# (`lead-poisoning`) where metabolism looks up the toxin TYPE (`lead`), so
# every dose was dropped until the paint build. A slow clearance and two
# bands — the painter's colic, which comes on under repeated small doses
# (grinding white lead, painting with it bare-handed), then the acute
# poisoning — on the one burden scalar. Pure poison.
class: /platform/idea/Condition
data:
  name: lead-poisoning
  # ⭐⭐ The cognitive tax, and it is the honest one: chronic lead
  # poisoning dulls you. `expression` costs a BAND of expressed skill
  # while the burden lasts — it never touches the Transcript, so what
  # you have done stays true and only what you can currently do falls.
  signature:
    - { kind: expression, bands: 1 }
  progression:
    law: burden
  resolution:
    by: chelation
  observableSigns: [pallid, confused, aching]
  contagion: null
  toxinBehavior:
    toxinType: lead
    absorptionRate: 1
    clearanceRate: 0.01
    potency: 1
    bands:
      # The painter's colic: the belly cramps, the gums grey, the hands
      # tremble — long before anything is acute.
      - { threshold: 2, severity: 1 }
      - { threshold: 5, severity: 2 }
