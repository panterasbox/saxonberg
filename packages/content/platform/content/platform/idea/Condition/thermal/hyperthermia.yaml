# Hyperthermia — the heat-stress death edge (both strategies). Spawned
# when driven `coreTemperature` crosses above `survivableMax`; lethal on
# dwell. The hot-side mirror of hypothermia — out-drinkable in dry heat,
# but past the wet-bulb ceiling sweat can't shed metabolic heat and the
# core climbs regardless of hydration.
class: /platform/idea/Condition
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: hyperthermia
  # Heat exhaustion: the endurance goes, and so does the water.
  signature:
    - { kind: reserve, reserve: endurance, pctPerHour: -5 }
    - { kind: reserve, reserve: hydration, pctPerHour: -4 }
  progression: null
  resolution:
    by: cooling
  observableSigns: [flushed, sweating, disoriented]
  contagion: null
