# Torpor — the ectotherm cold-consequence: alive but immobile (NOT
# lethal). Spawned when a cold-blooded body's driven `coreTemperature`
# falls below its survivable floor; cleared on rewarming. The
# `requiresConscious` validator reads it to gate exertion verbs, exactly
# as it reads metabolism's `collapse` — alive, immobile, not dead.
class: /platform/idea/Condition
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: torpor
  # ⚠ Torpor is the cold gone far enough to dull the mind — a band of
  # expressed skill, and the endurance with it.
  signature:
    - { kind: expression, bands: 1 }
    - { kind: reserve, reserve: endurance, pctPerHour: -3 }
  progression: null
  resolution:
    by: warmth
  observableSigns: [torpid, motionless, cold-to-the-touch]
  contagion: null
