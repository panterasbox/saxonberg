# A party — the adventuring group Idea. Minted per party with its own
# identity path (`/platform/idea/party/<uuid>`), so the LINEAGE is this
# row and the IDENTITY is the instance's, exactly as an Avatar's is.
class: /platform/idea/Party
# ⚠ No `data:`, so nothing is applied. The minted identity rides
# `asIdentityPath`, which is the clone's channel, not the applier's.
