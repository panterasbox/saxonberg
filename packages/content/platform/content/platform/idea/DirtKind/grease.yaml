# Grease — fat that water alone will not touch. Soap, an alkali or a
# solvent lifts it; a strewn absorbent drinks it up off a floor.
class: /platform/idea/DirtKind
data:
  key: grease
  adjective: greasy
  form: film
  answersTo: [surfactant, alkali-mild, alkali-strong, solvent, absorbent]
  absorbedBy: true
  waterLifts: 0.05
  # What it smells of — ppm per unit of load (B57): a soiled thing's
  # odour is derived from what is on it.
  odour: { identity: rancid fat, ppmPerLoad: 10 }
