# Grease — fat that water alone will not touch. Soap, an alkali or a
# solvent lifts it; a strewn absorbent drinks it up off a floor.
class: /platform/idea/DirtKind
data:
  key: grease
  adjective: greasy
  form: film
  answersTo: [surfactant, alkali-mild, alkali-strong, solvent, absorbent]
  absorbedBy: true
  waterLifts: 0.05
  # What it smells of — OU per unit of load (B57): a soiled thing's
  # odor is derived from what is on it.
  odor: { aroma: /base-library/aromas/rancid-fat, ouPerLoad: 100 }
