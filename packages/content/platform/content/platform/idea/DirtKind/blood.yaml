  key: blood
  adjective: bloodied
  form: stain
  answersTo: [surfactant, alkali-mild, alkali-strong, acid-mild, absorbent, oxidiser-slow, oxidiser]
  setsAboveK: 318
  setAnswersTo: [oxidiser-slow, oxidiser]
  absorbedBy: true
  waterLifts: 0.5
