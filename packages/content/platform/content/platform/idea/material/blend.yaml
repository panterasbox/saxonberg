# The blend — the ONE generic substance every derived drink blend
# points at. Lives in the PLATFORM pack (`/platform/idea/material/blend`)
# because the kernel names it (`CraftingLogic.GENERIC_MIXED_MATERIAL`),
# and a kernel module may never name a trade pack's row (libations 1f).
# It points (the off-spec shaker mint and every reverse-matched
# cocktail): generic liquid physics + the drinkable routing home. The
# blend's actual identity + toxins ride the holder's per-instance
# BulkPayload (macros in = macros out) — per-cocktail material rows are
# the retired anti-pattern (the fixed-vocabulary rule).
class: /platform/idea/material/ConsumableMaterial
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: blend
  appearance: a cloudy, improvised mixed drink
  keywords: [blend, drink, mixed, cocktail]
  density: 950
  thermalConductivity: 0.2
  specificHeat: 2800
  edibility: true
  toxicity:
    - { type: alcohol, amount: 18 }
  tags: [liquid, beverage, drinkable, alcoholic, cocktail]
  composition: []
  biologicalSource: null
