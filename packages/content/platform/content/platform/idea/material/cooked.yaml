# Lives in the PLATFORM pack (`/platform/idea/material/cooked`) because the
# kernel names it (`CraftingLogic.GENERIC_COOKED_MATERIAL`), and a kernel
# module may never name a trade pack's row (libations phase 5).
# Cooked fare — the ONE generic substance every derived cooked blend
# points at (a plated stew, a pot-luck): generic dense-food physics +
# the edible routing home. The blend's actual identity + macros ride the
# holder's per-instance BulkPayload (macros in = macros out) — per-dish
# material rows are the retired anti-pattern (the fixed-vocabulary rule,
# see /platform/idea/material/ConsumableMaterial).
class: /platform/idea/material/ConsumableMaterial
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: cooked fare
  appearance: a portion of plain cooked fare
  keywords: [food, fare, portion]
  density: 1000
  thermalConductivity: 0.5
  specificHeat: 3500
  edibility: true
  # ⭐ Spoilage (docs/subsystems/spoilage.md): the microbial growth rate is
  # `μ_max · f_T(T) · f_aw(a_w)`. `spoilActivationEnergy` (J/mol) is how
  # steeply this food answers to warmth; `waterActivity` is how much of its
  # water a microbe can actually use. Under the 0.60 floor nothing grows.
  # ⚠ **Leftovers are the hazard, and the numbers say so.** Cooking kills
  # what was there, but a cooked dish is warm, wet and nutrient-rich with
  # nothing left to compete — so it regrows FASTER than the raw stock it
  # came from. Highest activation energy in the library: the difference
  # between a cold larder and a warm table is starkest here.
  spoilActivationEnergy: 85000
  waterActivity: 0.98
  nutrients: [carb]
  tags: [food, cooked]
  composition: []
  biologicalSource: null
