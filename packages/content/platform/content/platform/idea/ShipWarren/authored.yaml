# The warren an AUTHORED ship stands (harbors P1, B1): one row IS one ship
# (the Hesper, the Ostrander, the line's regulars), her rooms rows of their
# own under her `extent`. ⭐ It names NO blueprint (harbors review 3): an
# authored ship's own Structure already IS the blueprint-shaped place — her
# rooms under an extent with ordinary ways between them — and unlike a
# blueprint she is served. So it mints nothing and adopts whichever of her
# rooms stand instead, so `which ship is this room?` and `who is aboard?`
# are her warren's answers for every ship, authored or of a kind. Keyed by
# the ship's own row.
class: /platform/idea/ShipWarren
data:
  upkeepTerm: owner-all
