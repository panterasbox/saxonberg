# The warren an AUTHORED ship stands: one row IS one ship
# (the Hesper, the Ostrander, the line's regulars), her rooms rows of their
# own under her `extent`. Keyed by the ship's own row.
#
# ⭐ It names and joins its copies as every ship's warren does
# (zone-instancing D12): a copy of her zone named under its row by her
# serial (`zoneNaming: under-row`), joined to the world by her berth
# (`joins: berth`).
class: /platform/idea/ShipWarren
data:
  zoneNaming: under-row
  joins: berth
