# Glued — hide glue, a fish glue, a pitch. Anybody can smear it on, and
# nobody can take it apart again: the joint is stronger than the wood.
# ⭐ A glue line holds only between FLAT faces (`needsFlat`): a board
# that cupped as it dried seats it short, and no tightening closes that —
# glue a face to a quartered board.
# ⭐⭐ It TAKES glue (paint D11): making the joint draws glue from an open
# vessel in reach, and the glue decides — hide glue is strong and comes
# apart with heat and steam and lets go in the damp; casein holds in the
# damp and never comes apart. The strength and reversibility below are
# the defaults a glue overrides; the line is weak until the glue has set.
class: /platform/idea/Joint
data:
  key: glued
  label: glued
  portability: hand
  instrument: ''
  competence: null
  reversible: never
  strength: 0.7
  structuralRecovery: 0.0
  fastenerRecovery: 0.0
  tightenable: false
  needsFlat: true
  failure: parted
  takes: glue
