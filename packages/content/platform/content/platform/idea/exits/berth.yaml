# The way aboard a ship, named for her (harbors P4) — `go hesper`. A ship
# made fast at a landing installs one on it, and takes it away when she
# casts off; nothing authors one. Her gangway's lock is hers, read by this
# way and by her deck's `ashore` alike.
class: /platform/idea/BerthExit
data:
  # What the way is, as the landing describes it — `{{ ship }}` is her name.
  description: "A gangway runs up to {{ ship }}'s deck."
  messageOut: "{{ mover }} goes aboard."
  messageIn: "{{ mover }} comes aboard."
