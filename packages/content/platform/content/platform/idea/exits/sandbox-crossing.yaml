# exit goes with it.
class: /platform/idea/SandboxCrossingExit
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  messageOut: "{{ mover }} steps through and is gone."
  messageIn: "{{ mover }} steps out of nowhere."
