# The City of Terminus — the WIRED flagship government of the civics
# build: a chartered municipal corporation running commission form (an
# appointed professional administration; no elections yet — nobody in
# this city ever voted for anything). The full structure (Administrator,
# Treasurer, Watch, Works, Almonry) is charter TEXT (terminus-city.md
# §8); this template carries only what is BUILT — the Registry department
# and the Magistrate seat. The treasury is the shipped municipal budget
# Business's account path; departments are Business templatePaths (a
# Business's path IS its durable key).
class: /platform/idea/Government
data:
  key: terminus-city
  name: the City of Terminus
  description: >-
    The municipal corporation of Terminus — a young administration
    chartered by the realm and retrofitted onto a city built by people
    who wanted no governing. Appointed, thin, and working out of rented
    rooms; its Registry keeps the records and its Magistrate keeps the
    peace.
  charter: /civic/terminus-city-charter
  treasury: /world/terminus/budget
  departments:
    - /world/terminus/registry/business
  seats:
    - key: magistrate
      label: Magistrate of Terminus
      department: /world/terminus/registry/business
      positionKey: magistrate
    # ⭐ Public works (energy build): the seat that answers for the city's grid
    # and lamps, on the municipal budget Business. The founder default holds it
    # vacant — the seat EXISTS so the office is a thing the polity can fill;
    # Terminus's electric utility is municipal by default (ownership is the
    # polity's in-world call, deliberately not pre-decided).
    # ⭐⭐ The gauger (assembly D13): the seat whose `measure capacity` is OF
    # RECORD. Anybody may gauge a cask; only this seat's figure is marked on
    # the head and taken by a buyer or the magistrate. A position on the
    # Registry's chart, held by the clerk by default (the founder-default
    # pattern) until somebody is appointed.
    - key: gauger
      label: Gauger of Terminus
      department: /world/terminus/registry/business
      positionKey: gauger
    - key: public-works
      label: Commissioner of Works
      department: /world/terminus/budget
      positionKey: works-foreman
  # ⭐ The city's standard measures (assembly D13, AC 24): the tun its
  # gauger gauges against. A second polity declares its own here.
  standards:
    - { key: cask, value: 25, unit: L }
