# ⭐ It is a row (user's call, 2026-09-25). It was argued as an exception
# on the strength of "backed by nothing, gone at restart" — which is a
# statement about its LIFETIME, and the doctrine is about whether a
# person could author it. Minted per jurisdiction with its own identity
# path; the code is patched on after the clone, because the code is the
# one thing that is never authored here.
