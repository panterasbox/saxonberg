# altitude — a reading channel.
#
# ⭐ Install the pack, get the channel. This row and its class are the
# whole registration story — nothing in a platform view names it.
class: /platform/idea/reading/AltitudeReading
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  channel: altitude
  kind: fact
  scope: [here]
  discipline: awareness
  instrument: altimetry
  instrumentNoun: an altimeter
  eyeCeiling: novice
  improves: >-
    how high you have climbed, and therefore how much further the pass is
  stakes: >-
    a climb you cannot finish before dark
