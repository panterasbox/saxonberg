# gravity — a reading channel.
#
# ⭐ Install the pack, get the channel. This row and its class are the
# whole registration story — nothing in a platform view names it.
class: /platform/idea/reading/GravityReading
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  channel: gravity
  kind: fact
  scope: [here]
  discipline: physics
  instrument: gravimetry
  instrumentNoun: a gravimeter
  eyeCeiling: untrained
  improves: >-
    what a load will weigh and how far a thrown thing carries, somewhere the pull is wrong
  stakes: >-
    a rig loaded for the wrong world
