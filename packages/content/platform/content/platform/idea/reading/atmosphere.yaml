# atmosphere — a reading channel.
#
# ⭐ The damps. A miner tells bad air by the canary and the candle, which
# is a `competent` read and a real skill; the analyser names the medium.
#
# ⭐ Install the pack, get the channel. This row and its class are the
# whole registration story — nothing in a platform view names it.
class: /platform/idea/reading/AtmosphereReading
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  channel: atmosphere
  kind: fact
  scope: [here]
  discipline: awareness
  instrument: gas-analysis
  instrumentNoun: a gas analyzer
  eyeCeiling: competent
  improves: >-
    whether the air here can be breathed, and what is in it if not
  stakes: >-
    the last thing you find out
