# Polearms — the spear and its kin: the specialist's command of a weapon
# whose whole argument is reach. A specialization of melee-combat,
# credited on any exchange delivered with a weapon whose row authors
# `exercises: [polearms]`.
#
# The distinct practice is *keeping the distance you already own* — the
# reach dance the engine already models (a too-short attacker is simply
# out of range and must close before they can answer).
class: /platform/idea/Discipline
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  key: polearms
  channel: skill
  label: Polearms
  iscedf: "1014"
  specializes:
    - melee-combat
  description: >-
    Length held between you and the fight — the spear, the pike, the
    halberd. The polearm fighter's craft is the ground they refuse to
    give up, and their crisis is the moment somebody gets inside it.
