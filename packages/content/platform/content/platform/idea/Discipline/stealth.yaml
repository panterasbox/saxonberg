# Stealth — the practiced art of *not being noticed*: melting into cover,
# holding still in shadow, moving without drawing an eye, and setting a
# snare a passer-by won't spot until it's sprung. The opposed sibling of
# `awareness` — one contest, two competences: stealth grades a hider's
# derived concealment level (`PerceptionApi.hideLevelFor`) and the
# concealment of a player-placed trap, where awareness grades the watcher
# who tries to see through them. Seeded as pure data (the awareness /
# melee-combat precedent); the DisciplineCatalogue harvests every
# /platform/idea/Discipline/* leaf at boot. No `conferrals`: `hide` /
# `arm` are universally afforded — competence only *grades* them.
class: /platform/idea/Discipline
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  key: stealth
  channel: skill
  label: Stealth
  iscedf: "1032"  # ISCED-F 2013 — Security services (protective skills)
  description: >-
    Concealment, quiet movement, and the placing of hidden things —
    disappearing when you'd rather not be seen, and leaving a trap where an
    eye won't fall. A novice hides only where the dark is deep and the cover
    thick; a practised hand finds the stillness and the angle that a sharp
    watcher still walks past. Earned by hiding, by moving unseen, and by
    setting snares that spring.
