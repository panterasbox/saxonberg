# A bow line (the river build, D24) — the line on a small boat's bow (a
# sailor's "painter"; the word is the house painter's in this world — the
# owner, paint build: ask anyone what a painter is). Its row is
# `bow-line` since harbors moved it to the platform. Throw
# its end to somebody on the bank and they can walk her up past water too
# quick to paddle: the boat comes along beside them as they go (lining).
# ⭐ A ROPE (cordage D3, re-classed in place — the owner): a lifeline in all
# but length, because a rope's use is where its ends are tied.
# ⭐ The PLATFORM's (harbors B3, moved from trade-diving): every boat kind
# row props one, and a boat pack may not name a trade it does not depend
# on — the mooring line's move, for the same reason.
class: /platform/thing/Rope
data:
  shortDescription: bow line
  keywords: [line, rope, "bow line", bowline]
  register: indefinite
  longDescription: >-
    Fifteen meters of hemp with an eye spliced in one end, made to go on
    a boat's bow ring and be thrown ashore with the other.
  _materialPath: /stuff/idea/material/textile/hemp
  lengthM: 15
  diameterMm: 12
