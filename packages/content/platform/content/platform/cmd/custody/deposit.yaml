verbs: [deposit]
controller: /platform/idea/cmd/custody/DepositController
description: "Leave goods in a store's keeping, on a receipt"
help: |
  Leave something in a store's keeping — `deposit ice` at an icehouse,
  `deposit crate` at a depot. The keeper takes it in and writes you a
  receipt: what you left, how much, and the terms printed on it (the
  allowance for ordinary shrinkage, and the fee per kilogram you pay when
  you take it back out).

  ⭐ Pooled goods are held IN COMMON. Your block of ice goes onto the
  house's stack with everybody else's of the same grade, and your receipt
  is a claim on that stack, not on that block. If the stack shrinks,
  everyone's claim is paid short in proportion.

  Somebody has to be keeping the book: a deposit needs the keeper on
  shift. Staff of the house on shift deposit on the house's own claim.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: thing
    type: object
    required: true
    scope: [inventory]
    requires: [ContainableMixin]
  # ⭐ The book is the instrument — bound by the view, defaulted to the one
  # in reach.
  - name: book
    type: object
    required: false
    greedy: true
    prepositions: [in, at, with]
    default: "reachable:[mixin.StoreBookMixin]"
    scope: [reachable]
    requires: [StoreBookMixin]
