verbs: [walk]
category: movement
controller: /platform/idea/cmd/movement/WalkController
description: "Walk through a named exit (compass, door, or vessel)."
help: |
  Move on foot through an exit you name. `walk north`, `walk gate`,
  or `walk through the oak door` — same destinations `go` reaches,
  but committed to walking as the mode of travel.

  Walking is the default way most creatures get around, so plain
  `go` usually walks for you. Reach for `walk` when you specifically
  want to walk an exit that could also be climbed, swum, or flown,
  or to be explicit about how you leave.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: target
    type: object
    # ⭐ Ways only: an exit is a candidate in its own
    # right, so the scope names WAYS and the word can only mean one — `go
    # hesper` is the way named for her, never a line from her lying on the
    # quay or the thing in focus. A vessel standing here is entered by its
    # entry-exit (`go carriage`), tried second.
    scope: ["here:exits", "reachable:[class.ExitableVessel]"]
    required: true
    validators:
      - /lib/command/validators/canReach
    requires: any
