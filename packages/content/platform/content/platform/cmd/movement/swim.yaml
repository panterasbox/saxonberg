# ⭐ CONFERRED by the maritime build (D27). Held until then on the
# navigable-water design, which owned the question of how you get into
# water: a small water you can see across is a PLACE, and the water there
# is a thing in the room — `StillWater`, the instrument of swimming as a
# ladder is of climbing — standing in the pool and on the strand you wade
# in from. The six `media: [ground, water]` exits authored in the estuary
# and at the wharf were the evidence somebody wanted this before either
# design; they become swimmable wherever a `StillWater` stands.
#
# ⛔ Never conferred by a `Shore` or a deck: a shore cites a water you are
# not in.
verbs: [swim]
controller: /platform/idea/cmd/movement/SwimController
description: "Swim through a named exit (must be Swimmable-enabled)."
help: |
  Cross water by swimming through an exit that leads into or through
  it — a river, a flooded passage, an open channel. Name the exit
  you want (`swim across`, `swim channel`).

  Only exits marked as swimmable accept this. While you swim, the
  water around you is the medium you're breathing — so an
  air-breather who lingers underwater can run out of air. Surface
  or reach the far side before that becomes a problem.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: target
    type: object
    scope: ["$focus", "reachable"]
    required: true
    validators:
      - /lib/command/validators/canReach
    requires: any
