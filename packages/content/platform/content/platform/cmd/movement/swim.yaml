# ⭐ CONFERRED by the maritime build (D27; reshaped in review, 2026-10-13).
# A small water you can see across is a PLACE — a `Pool` — and the PLACE
# is the water: being in it makes its ways swimmable, and an exit whose
# destination is one (the strand's east) is swimmable INTO it. Every
# place beside a water (`ShoreMixin`) affords the verb, so you are told
# in words where a way cannot be swum; ⛔ a shore or a deck is never
# itself swimmable. (The `StillWater` thing that stood in the pool and on
# the strand is retired: water is not an instrument you set down.)
verbs: [swim]
controller: /platform/idea/cmd/movement/SwimController
description: "Swim through a named exit (must be Swimmable-enabled)."
help: |
  Cross water by swimming through an exit that leads into or through
  it — a river, a flooded passage, an open channel. Name the exit
  you want (`swim across`, `swim channel`).

  You swim where the water is: into a pool from its shore, and
  about the pool once you are in it. You swim at the surface, with
  your head up, so you breathe the air over the water.

  ⭐ `swim` with no way named is *swim here*: let go of what is holding
  you up and lower yourself into the water where you are — off the ice
  at the edge of a hole, say. `stand` gets you back out, if what you
  climb onto will bear you.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: target
    type: object
    scope: ["$focus", "reachable"]
    # ⭐ Optional: with no target the verb is *swim here* (go into the
    # water where you are) — the one shape nothing else claims.
    required: false
    validators:
      - /lib/command/validators/canReach
    requires: any
