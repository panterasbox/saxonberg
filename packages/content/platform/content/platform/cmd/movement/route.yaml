# `route` — ask the way on your OWN map, and be told what it assumes.
#
# ⭐⭐⭐ It plans over YOUR CLAIMS and nothing else. The server's own
# index of the world's shape is not consulted and cannot be: the
# modules this verb plans through are forbidden from importing it
# (`lint:graph-walks`' core check). So a place you have never been to
# is *you do not know the way there* — not a route arriving from
# nowhere — and the answer gets better as you walk, which is the whole
# point of a map that is a record of where you have been.
#
# ⚠ It plans and STOPS. Nothing is started, nothing is spent, and you
# are not moved. Planning a journey and taking one are two different
# acts: this one is free and reversible, and the other costs you the
# walking.
verbs: [route]
controller: /platform/idea/cmd/movement/RouteController
description: "Work out a way somewhere from what you know"
help: |
  `route to <place>` works out a way there from your own map.

  `route to <place> by wagon` (or `by boat`) plans for a conveyance
  instead of your feet. ⭐ The COST you are quoted changes with it, and
  not as decoration: on foot you are told the legs and what is in the
  way, because ordinary walking costs you no game time. A conveyance is
  told MINUTES, because a conveyance actually spends them.

  `route between <a> and <b>` answers what the ways between two places
  you know cost — one pair, and nothing about which order to visit
  them in. Working out the order is yours.

  ⭐ Every plan says what believing it ASSUMES: a way you only saw once
  and never walked, a crossing that is not always passable, a doorway
  you have recorded two different places behind. A plan is a
  hypothesis. The ground has the last word, and you will find out at
  the leg.

  ⚠ If two ways are genuinely incomparable — short over a ford against
  long and sure — you are shown BOTH. Choosing is the point; a router
  that picked for you would be deciding the interesting part.
examples:
  - cmd: route to the bakery
    note: A way there, from what you have walked
  - cmd: route to the quay by wagon
    note: Planned for wheels, and quoted in minutes
  - cmd: route between the market and the bank
    note: What that pair costs, with no order implied
validators:
  - /lib/command/validators/requiresAnimate
args:
  # GREEDY: a place is named in words a player would use ("the dye
  # house"), and a single-token arg would refuse the shape.
  #
  # ⚠⚠ NOT required, and neither is `by`. A required arg with no
  # default fails CLOSED and SILENT at the binder — the player types
  # `route` and nothing happens at all. The controller refuses in
  # words instead.
  - name: destination
    type: string
    required: false
    greedy: true
    prepositions: [to, between]
  # ⚠ An ARG with a preposition, not an option — `route to the quay by
  # wagon` reads the way somebody would say it, and the greedy
  # destination swallows everything up to the next preposition. The
  # `journey ... via <lane>` idiom exactly.
  - name: by
    type: string
    required: false
    prepositions: [by]
