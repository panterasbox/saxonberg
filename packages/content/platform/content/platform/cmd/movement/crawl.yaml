verbs: [crawl]
category: movement
controller: /platform/idea/cmd/movement/CrawlController
description: "Go through an exit on hands and knees."
help: |
  Go through an exit crawling — `crawl north`, `crawl hole`. On hands
  and knees you are low and quiet and slow, low enough for a crawlway a
  stooping body will not pass. What you hold goes through ahead of you,
  pushed along, measured on its own; what you wear goes with you — a
  pack on your back may be what will not fit, and the refusal names it.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: target
    type: object
    # Ways only, like `go` and `sneak`: the word names a way, or a vessel
    # standing here entered by its entry-exit.
    scope: ["me:e:exits", "reachable:[class.ExitableVessel]"]
    required: true
    validators:
      - /lib/command/validators/canReach
    requires: any
