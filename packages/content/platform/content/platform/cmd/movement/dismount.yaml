verbs: [dismount]
controller: /platform/idea/cmd/movement/DismountController
description: "Dismount the creature or vehicle you're currently mounted on"
help: |
  Get down off whatever you're currently riding. No target needed —
  `dismount` knows what you're mounted on and puts you back on your
  own feet where the mount stands.

  Use it when you've arrived and want to walk, or before you mount
  something else. You have to be mounted for it to do anything.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresPosed
  - /lib/command/validators/requiresSlottable
  - /lib/command/validators/requiresMounted
