# `teleport <destination>` — free inside an extent you hold, a travel
# node's ride, or the anchored spell, in that order. The bare board read
# is `teleport.yaml`'s; naming somewhere is what makes it this shape (W7a).
verbs: [teleport]
category: movement
controller: /platform/idea/cmd/movement/TeleportController
description: "Teleport somewhere — free inside your own extent, by a travel network, or by the working."
help: |
  `teleport <somewhere>`: inside an extent you hold authorial authority
  over, it simply moves you. Standing at a travel node, naming a stop
  rides it. Anywhere else, naming a destination casts the working, if
  you have it — and only somewhere you can honestly be said to hold in
  mind. ⭐ One of two shapes of `teleport`: bare `teleport` reads the
  departures board.
examples:
  - cmd: teleport hinkley
    note: Ride a travel network to a stop it serves
validators:
  - /lib/command/validators/requiresAnimate
args:
  # Where to go. A node reads the RAW token as a local stop keyword;
  # free movement resolves it as an MQL target; the anchored spell
  # resolves it through the three anchors.
  #
  # ⚠ `onExcess: error` is deliberate: the default `top` SILENTLY picks
  # a winner, and "which of these did you mean" is the engine admitting
  # you did not hold the place clearly and then arriving anyway.
  # Ambiguity is a FAILED SPECIFICATION, never a disambiguation prompt.
  #
  # ⓘ The scope list is deliberately narrow and contains no `world`.
  # The anchored resolver computes its scopes PER ACTOR, which a static
  # `scope:` cannot express — that is why it is controller-side.
  - name: destination
    type: object
    required: true
    onExcess: error
    scope: ["reachable", "here", "peers"]
    requires: any
options:
  # Whose energy pays, for a network that runs on something. Inert at a
  # node that does not — which is the node answering honestly, not the
  # verb knowing what kind of network it is talking to.
  channel:
    short: c
    type: boolean
    description: "Channel your own reserve into the node for this ride."
  meter:
    short: m
    type: boolean
    description: "Put it on the node's meter, whatever your standing preference says."
