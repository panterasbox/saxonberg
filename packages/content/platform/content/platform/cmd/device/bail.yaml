# bail — ⭐ fill a bucket, lift it, tip it (harbors P21, B5). ONE act with
# two targets that share no trade: a boat taking water, bailed over her side,
# and a bore, bailed up the derrick's rope. Moved here from the drilling pack
# (the ladder's first rung: unify behind an interface) — what one spell IS
# is the target's to say (`BailableMixin`); this view only binds it.
#
# Afforded by what you bail: a boat to whoever sits in her
# (`Boat.commandContributions.inventory`), a wellhead's derrick and the
# driller's bailer to whoever stands at the rig.
verbs: [bail]
controller: /platform/idea/cmd/device/BailController
description: "Bail something out a bucketful at a time — a boat taking water, a bore"
help: |
  `bail` lifts out what stands in something, a bucketful at a time.

  **A boat.** Sitting in a boat that is taking water, `bail` throws it out
  over her side — with your hands, or quicker with a bailer or a bucket.
  A boat that leaks faster than you bail goes down with what is in her;
  stop bailing a holed boat and she fills.

  **A bore.** At a wellhead, the bailer goes down the hole on the
  derrick's rope and comes back with what is standing there. A bit
  swimming in water cuts nothing, so a hole is bailed before it is bored
  deeper — and what comes up at last is the answer to the bet. Bring
  something to put it in (`bail into cask`); a gas wants a sealed vessel,
  shut.
examples:
  - cmd: bail
    note: Bail the boat you are sitting in (or the hole you are standing at)
  - cmd: bail with bailer
    note: Quicker with something to bail with
  - cmd: bail into cask
    note: At a wellhead, a bucketful into a cask you are carrying
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  # ⚠⚠ ARG ORDER: the positional `target` comes FIRST — a greedy arg must
  # be last or followed only by prepositional args, and every
  # prepositional object arg below is greedy (`lint:reachability` arm G).
  - name: target
    type: object
    required: false
    default: "reachable:[mixin.BailableMixin]"
    scope: ["reachable"]
    requires: [BailableMixin]
  - name: tool
    type: object
    required: false
    prepositions: [with, using]
    greedy: true
    default: "reachable:[capability.bailing]"
    scope: ["reachable"]
    requires: [ToolMixin]
  - name: vessel
    type: object
    required: false
    prepositions: [into, in]
    greedy: true
    default: "me:i:[mixin.BulkableMixin]"
    scope: ["inventory", "reachable"]
    requires: VisibleMixin
    validators:
      - /lib/command/validators/mustHaveBulkSlot
