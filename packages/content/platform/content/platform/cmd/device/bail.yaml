# bail — ⭐ fill a bucket, lift it, tip it. The
# BUCKET over any lift source (pump.md family A — no ceiling at any depth):
# a boat taking water, bailed over her side; a ship's bilge well; a village
# well; a bore, bailed up the derrick's rope. No protocol of its own: the
# controller reads the source's `LiftSource` shape (how deep, what it lifts
# into) and the tool (a bailer — or bare hands); a source says only what is
# its own (`bucketRefusal`, `bucketLanded`).
#
# Afforded by what you bail: a boat to whoever sits in her
# (`Boat.commandContributions.inventory`), a wellhead's derrick and the
# driller's bailer to whoever stands at the rig.
verbs: [bail]
category: device
controller: /platform/idea/cmd/device/BailController
description: "Bail something out a bucketful at a time — a boat taking water, a bore"
help: |
  `bail` lifts out what stands in something, a bucketful at a time.

  **A boat.** Sitting in a boat that is taking water, `bail` throws it out
  over her side — with your hands, or quicker with a bailer or a bucket.
  A boat that leaks faster than you bail goes down with what is in her;
  stop bailing a holed boat and she fills.

  **A well, a bore.** The bucket goes down on a rope and comes back with
  what is standing there — the deeper, the longer the trip. At a wellhead
  the bailer goes down the hole on the derrick's rope. A bit
  swimming in water cuts nothing, so a hole is bailed before it is bored
  deeper — and what comes up at last is the answer to the bet. Bring
  something to put it in (`bail into cask`); a gas wants a sealed vessel,
  shut.
examples:
  - cmd: bail
    note: Bail the boat you are sitting in
  - cmd: bail wellhead
    note: Let the bailer down the hole you are standing at
  - cmd: bail with bailer
    note: Quicker with something to bail with
  - cmd: bail into cask
    note: At a wellhead, a bucketful into a cask you are carrying
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  # ⚠⚠ ARG ORDER: the positional `target` comes FIRST — a greedy arg must
  # be last or followed only by prepositional args, and every
  # prepositional object arg below is greedy (`lint:reachability` arm G).
  # ⭐ The LIFT protocol (`LiftSourceMixin`, controllers-are-io D8a): a
  # boat, a well, a ship's bilge well and a wellhead compose it, and with
  # nothing named the controller takes the boat you sit in. `greedy`: `bail village
  # well` is one target (the pump drive's lesson).
  - name: target
    type: object
    required: false
    scope: ["here", "peers", "person"]
    requires: LiftSourceMixin
  - name: tool
    prepositionRequired: true
    type: object
    required: false
    prepositions: [with, using]
    default: "reachable:[capability.bailing]"
    scope: ["reachable"]
    requires: [ToolMixin]
  - name: vessel
    prepositionRequired: true
    type: object
    required: false
    prepositions: [into, in]
    default: "me:i:[mixin.BulkableMixin]"
    scope: ["inventory", "reachable"]
    requires: VisibleMixin
    validators:
      - /lib/command/validators/mustHaveBulkSlot
