verbs: [pump]
controller: /platform/idea/cmd/device/PumpController
description: "Work a pump by hand — a well's handle or a furnace's bellows"
help: |
  Work something by hand that moves a fluid — `pump well`, `pump
  wellhead`, `pump forge`.

  At a well or a wellhead, a spell at the handle raises what stands below
  into the trough, and it is honest work: the deeper the water, the
  harder you pump. A pump's leather packing wears with every spell; when
  it is gone the handle drops with no resistance and nothing comes. Not
  every pump will lift from every depth — some will not draw water up
  past a certain point, and the pump will tell you how far down it is.

  At a furnace, a worked bellows drives the fire far past its banked
  heat; smelting and the hottest smithing work need it. Pump again to
  ease off. A cold or unfuelled furnace just wheezes.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  # ⭐ The pump PROTOCOL, or a source a pump is set in (controllers-are-io
  # D8a): a furnace's bellows, a pump's handle and a diver's air pump
  # compose `PumpableMixin`; a well, a wellhead and a conduit compose
  # `PumpSourceMixin`. The controller narrows on the same two predicates,
  # and every refusal is the thing's own sentence.
  - name: target
    type: object
    required: true
    scope: ["here", "peers", "person"]
    requires: PumpableMixin|PumpSourceMixin
    # ⚠⚠ `greedy` — found by DRIVING it: `pump village well` answered
    # *"That doesn't match any known command shape"*, because without it
    # the two words are two positionals. The target is the whole tail
    # (the `look.yaml` precedent), so nothing else can be swallowed.
    greedy: true
    validators:
      - /lib/command/validators/canReach
