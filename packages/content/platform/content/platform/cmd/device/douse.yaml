verbs: [douse]
category: device
controller: /platform/idea/cmd/device/DouseController
description: "Put out a fire"
help: |
  Put out a fire — douse a burning thing within reach (`douse fire`,
  `douse torch`, `douse candle`). The water soaks it as it goes
  out, so it won't relight until it dries.

  Something that isn't burning is left alone.

  Used where it sits — in hand, in an open holder on you, or within
  reach; a shut holder says `open` it first, a pack on your back says
  take it off.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresEmbodied
args:
  - name: target
    type: object
    required: true
    scope: "reachable"
    updates_focus: extend
    requires: CombustibleMixin|BurnerMixin
    validators:
      - /lib/command/validators/canReach
