verbs: [fire, burn]
controller: /platform/idea/cmd/device/FireController
description: "Hold a loaded chamber at heat, and see what the heat makes of what is in it"
help: |
  `fire the kiln` holds a lit chamber at heat for as long as you tend it.
  `burn the kiln` is the same act — a lime-burner *burns* lime, and the two
  words mean one thing.

  ⭐⭐ **The heat decides, not the verb.** Everything in the chamber banks
  heat-work for as long as it is hot — how hot, and for how long — and
  each thing's own material says what that makes of it. Limestone loses
  its gas and becomes quicklime. Clay becomes terracotta, then
  earthenware, then stoneware. Compounded rubber cures. Fire it short and
  a piece comes out *burnt to the skin, raw at the heart*. Nothing here
  knows the words: a material that heat changes says so on its own row.

  ⚠ **`fire` is not `ignite`.** *Fire the kiln* ambiguously means *light
  it*, which is a different act with its own verb — so the chamber has to
  be lit first, and it says so if it is not.

  ⭐ **`for <how long>` holds it** (`fire the oven for 30 minutes`); without
  it you tend it a minute. `--draught <word>` sets the air first —
  `wide`, `open`, `half`, `low`, `banked`. A starved fire is a reducing
  one: what is in it comes out differently (the blue brick), and wood in
  it chars instead of burning. A charge loaded INTO a mould standing in
  the chamber comes out in the mould's shape.

  Read the heat with `analyze temperature <kiln>` — the colour of the
  glow is a reading anybody can take.
examples:
  - cmd: fire the kiln
    note: Tend it at heat for a minute
  - cmd: fire the limekiln for 2 hours
    note: Hold it long enough for the stone to burn through
  - cmd: fire the kiln --draught low for 6 hours
    note: A starved, reducing firing
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  # ⭐ WHICH CHAMBER, declared rather than hunted for. The mixin atom, not a
  # class: a limekiln, a bread oven, a bottle kiln and a crucible furnace are
  # the same mechanism on different dials, and `smelt.yaml` already binds its
  # furnace exactly this way.
  - name: kiln
    type: object
    required: false
    prepositions: [in, at]
    default: "reachable:[mixin.BurnerMixin]"
    scope: ["reachable"]
    requires: [BurnerMixin]
    validators:
      - /lib/command/validators/canReach
  # ⭐ HOW LONG to hold it — `for 30 minutes`, `for 2 hours` (the world
  # clock's own grammar). Optional: a minute.
  # ⚠ `greedy: true` — "2 hours" is two tokens and one duration.
  - name: hold
    type: string
    required: false
    greedy: true
    prepositions: [for]
# ⭐ The air, set as the firing begins — the draught ladder's words. An
# OPTION, never a positional arg, so it can never swallow the kiln: `fire
# kiln`, `burn kiln` and `fire in retort` bind exactly as before. The
# in-burn adjustment stays the `draught` verb.
options:
  draught:
    type: string
    field: draught
    description: "The air to fire at: wide, open, half, low or banked"
