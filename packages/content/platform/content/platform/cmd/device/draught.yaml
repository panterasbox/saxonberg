# draught — ⭐⭐ the air control, which every fire has.
#
# A damper, a wick, a tuyère, the ash you rake over a hearth: the thing
# that decides how much air a fire draws, and therefore — through ONE
# number — how hot it runs, how completely it burns, how much light it
# sheds and what it puts into the room. Open the vents and a fire gets
# hotter, cleaner and *dimmer*, because luminosity is incandescent soot.
#
# ⭐ `char <n>` in the fuel trade is this same number read by the
# collier's charring band. The trade kept its word and its band; the
# dial turned out to be the kernel's.
verbs: [draught]
controller: /platform/idea/cmd/device/DraughtController
description: "Set how much air a fire draws"
help: |
  Set a fire's air — `draught wide`, `draught half`, `draught low`,
  `draught banked` — or bare `draught` to be told where it stands.

  Name the fire when there is more than one: `draught wide at forge`.

  ⭐ For a figure rather than a word, the fuel trade's own `char <n>`
  sets the same dial on a clamp, which is where a number is worth having
  — the charring band is narrow and a collier works in tenths.

  Wide open, a fire runs as hot and as clean as its fuel allows — and
  shrinks to a pale flame that sheds surprisingly little light. Shut
  down, it cools, smokes, glares yellow and starts filling the room with
  what it is not finishing.

  See also `cover`, which banks a fire in one word.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresEmbodied
# ⭐⭐ **Both shapes, and `fallthrough: true` is the opt-in the schema
# requires for it.** The five settings are SUBCOMMANDS (below); bare
# `draught` and `draught at forge` are the FLAT path, and they are a
# READ — asking where a dial stands is not a mistake.
#
# ⛔ The drive is why this block exists. With the args declared only
# under the subcommands, a bare `draught` bound nothing at all — not
# even its default fire — and the read answered *"There is no fire
# here."* in a room with a lit forge. The set worked and the read did
# not, which is the hardest shape of this failure to see.
fallthrough: true
args: &fire
  - name: fire
    type: object
    required: false
    prepositions: [on, at, in]
    scope: "reachable"
    default: "reachable:[mixin.BurnerMixin]"
    requires: BurnerMixin
    validators:
      - /lib/command/validators/canReach
subcommands:
  # ⭐⭐ **SUBCOMMANDS, and the drive is why.**
  #
  # This was a positional `setting` arg three times over, and it bound
  # NOTHING each time: the binder is type-directed, so a bare WORD is
  # consumed by the object arg (an unresolved selector is still a
  # structural match) and the value never arrives — the verb silently
  # became a read and the draught never moved. ⚠ `char 0.45` works on
  # the identical shape because a NUMBER cannot bind to an object arg and
  # falls through; a word can.
  #
  # ⭐ A closed set of words after a verb is what subcommands ARE
  # (`bank statement`, `house par`), and the matcher binds them rather
  # than the type system guessing. Rung 4 of the verb-collision ladder,
  # applied to argument shape.
  wide:
    description: "Vents wide: as hot and as clean as the fuel allows — and dimmer than you expect"
    args: *fire
  open:
    description: "The same as `wide`"
    args: *fire
  half:
    description: "Halfway: a steady yellow burn"
    args: *fire
  low:
    description: "Choked down: cooler, sootier, and it glares"
    args: *fire
  banked:
    description: "Banked under its own ash — a twentieth of the rate, and it keeps"
    args: *fire
