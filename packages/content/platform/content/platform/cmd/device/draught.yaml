# draught — ⭐⭐ the air control, which every fire has.
#
# A damper, a wick, a tuyère, the ash you rake over a hearth: the thing
# that decides how much air a fire draws, and therefore — through ONE
# number — how hot it runs, how completely it burns, how much light it
# sheds and what it puts into the room. Open the vents and a fire gets
# hotter, cleaner and *dimmer*, because luminosity is incandescent soot.
#
# ⭐ The collier's clamp is worked with this verb too (`draught clamp
# low`); `char <n>` retired into it (controller-liquidity W7b).
verbs: [draught]
category: device
# ⭐⭐ Three shapes, two acts (controller-liquidity W7b, D13 rung 4):
#   draught [at <fire>]            — this view, the READ
#   draught <setting> [at <fire>]  — draught-set.yaml
#   draught <fire> <setting>       — draught-fire.yaml
# The setting is a `values:` slot on the two set shapes (it was five
# subcommands), so `draught forge medium` is refused by the view, naming
# the five words.
controller: /platform/idea/cmd/device/DraughtReadController
description: "Set how much air a fire draws"
help: |
  Set a fire's air — `draught wide`, `draught half`, `draught low`,
  `draught banked` — or bare `draught` to be told where it stands.

  Name the fire when there is more than one: `draught wide at forge`,
  or `draught forge wide`; `draught at forge` tells you where it stands.
  The settings are exactly `wide` (or `open`), `half`, `low` and
  `banked`.

  ⭐ A charcoal clamp's air is this same dial: `draught clamp low`.
  (`char <n>` set it as a figure until controller-liquidity W7b; the
  collier's trade lights the burn and this verb works its vents.)

  Wide open, a fire runs as hot and as clean as its fuel allows — and
  shrinks to a pale flame that sheds surprisingly little light. Shut
  down, it cools, smokes, glares yellow and starts filling the room with
  what it is not finishing.

  See also `cover`, which banks a fire in one word.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresEmbodied
# ⭐⭐ The read's fire needs its PREPOSITION. A bare word after `draught`
# is a setting, and a read shape that took one bound it to the fire —
# the verb silently became a read and the draught never moved (three
# drive runs). `draught low` shape-fails here and binds a set shape.
args:
  - name: fire
    type: object
    required: false
    prepositions: [on, at, in]
    prepositionRequired: true
    scope: ["here", "peers", "person"]
    default: "reachable:[mixin.BurnerMixin]"
    requires: BurnerMixin
    validators:
      - /lib/command/validators/canReach
