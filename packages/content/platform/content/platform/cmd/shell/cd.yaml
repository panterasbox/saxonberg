verbs: [cd]
controller: /platform/idea/cmd/shell/CdController
description: "Change working directory in the content (default) or source tree"
help: |
  Move your working position within a tree, just like a filesystem
  shell. With no path you return to your home directory. Relative
  paths resolve against your current spot; absolute paths (starting
  `/`) jump anywhere.

  `cd` acts on the content tree by default — the authored world of
  templates. Use `-s` to navigate the source tree instead, or set
  `workspace.tree` to change the default. The one-shot `--mirror`
  flag copies your active tree's position over to the other tree so
  both line up. Pass `--mql` to jump to wherever a query resolves.
args:
  - name: path
    type: string
    required: false
options:
  mql:
    type: object
    scope: [reachable]
    description: "MQL expression alternate to <path>"
    requires: any
  content:
    short: c
    type: boolean
    description: "Force the operation to the content tree (overrides workspace.tree)"
  source:
    short: s
    type: boolean
    description: "Force the operation to the source tree (overrides workspace.tree)"
  mirror:
    type: boolean
    description: "Copy the active tree's cwd to the other tree (no path arg)"
