verbs: [recall]
controller: /platform/idea/cmd/shell/RecallController
description: "Search what you were told, and what the world wrote down"
help: |
  `recall` finds the thing you half-remember. It searches three
  corpora and you say which one: your own frames (everything the
  world has told you, as far back as the server keeps), the wiki,
  and the forums.

  ⚠ `search` is a different verb — that one is looking around the
  room with your own eyes. `recall` is reaching for a record.

  Your frames are yours. Nobody else can read them, wizards
  included; there is no form of this verb that names someone else,
  which is why the scope is an argument rather than a target.
examples:
  - cmd: recall anvil
    note: Search your own frames — the default scope
  - cmd: recall --scope wiki smithing
    note: Search the encyclopedia instead
  - cmd: recall --scope forums the tithe
    note: Search forum threads and replies
options:
  scope:
    short: s
    type: string
    field: scope
    description: "Which corpus: frames (default), wiki, or forums"
args:
  - name: terms
    type: string
    required: true
    greedy: true
