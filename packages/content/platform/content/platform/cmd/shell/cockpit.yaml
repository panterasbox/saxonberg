verbs: [cockpit]
controller: /platform/idea/cmd/shell/CockpitController
description: "Steer your cockpit: layout, per-bar input scoping, appearance."
help: |
  The cockpit is your screen — everything about how it is arranged and
  how it reads. Every control lives under this one verb, so there is
  exactly one place to look.

    cockpit                       report everything in effect
    cockpit mode <name>           what you are here to do
    cockpit layout <name>         the card arrangement inside that mode
    cockpit scope <prefix…>       scope a command bar's bare input
    cockpit shelf <sub> …         which figures ride the top bar
    cockpit style <sub> …         appearance: theme, colors, plain mode

  Two axes, and they are different questions. A MODE is the front door
  — chat, explore, watch, build, govern. A LAYOUT is how the cards sit
  inside the mode you are in, and each mode remembers its own.

  Cockpit control is interface, not fiction — so `cockpit` and every
  subcommand under it always reach the interpreter un-prefixed, even
  from a bar you have scoped to a channel. A bar scoped to gossip can
  still steer its own cockpit without the `/` escape.
validators:
  - /lib/command/validators/requiresHasInteractive
examples:
  - cmd: cockpit
    note: Report mode, layout, scope and style in one view
  - cmd: cockpit mode watch
    note: Switch to the watch front door
  - cmd: cockpit layout forum
    note: Open the forum board view
  - cmd: cockpit scope chat gossip
    note: Scope this bar to the gossip channel
  - cmd: cockpit style theme marble
    note: Switch to the Marble (light) ground
subcommands:
  mode:
    controller: /platform/idea/cmd/shell/CockpitModeController
    description: "Switch the cockpit mode (chat | explore | watch | build | govern)."
    help: |
      A mode is a front door — it answers *what am I here to do*.
      `chat` is talking to people, `explore` is living in the world,
      `watch` is a stream (as viewer or broadcaster), `build` is
      making things, and `govern` is the offices and the polity.

      Each mode remembers the arrangement you last used in it, so
      switching to `chat` and back to `explore` puts you where you were.

      A mode changes what your screen is FOR, never what you are
      allowed to do: everything you can run in `explore` you can run in
      every other mode. Bare `cockpit mode` reports the current one.
      Naming an arrangement too — `cockpit mode watch streamer` — goes
      straight to that front door in that arrangement, which is what
      the "Views" menu sends.
    examples:
      - cmd: cockpit mode watch
        note: Switch to the watch front door
      - cmd: cockpit mode watch streamer
        note: Enter watch mode in the streamer arrangement
      - cmd: cockpit mode
        note: Report the current mode and arrangement
    args:
      - name: name
        type: string
        required: false
      - name: arrangement
        type: string
        required: false

  layout:
    controller: /platform/idea/cmd/shell/LayoutController
    description: "Recall, save, list or forget a card arrangement in this mode."
    help: |
      A layout is a named arrangement of cards *inside* the mode you
      are in. Each mode ships at least one, and you can compose and
      name your own — so this is not a fixed menu.

        cockpit layout <name>         switch to an arrangement
        cockpit layout list           what is available here
        cockpit layout save <name>    name the current arrangement
        cockpit layout forget <name>  drop one you saved

      Arrangements belong to a mode. If you ask for one that lives in
      a different mode, you'll be told which mode that is rather than
      being moved there — recalling a layout is not a mode change.

      Your arrangement is remembered per mode: switch to `chat` and
      back to `explore` and you land where you left off. It follows you
      across reconnects and every connection you have open.

      The "Views" menu in the cockpit sends this command for you —
      typing `cockpit layout <name>` and clicking a menu item are the
      same thing.
    examples:
      - cmd: cockpit layout list
        note: List this mode's arrangements, marking the active one
      - cmd: cockpit layout streamer
        note: Switch to the streamer arrangement (in watch mode)
      - cmd: cockpit layout save wide
        note: Name the current arrangement "wide"
      - cmd: cockpit layout forget wide
        note: Drop a saved arrangement
    args:
      - name: name
        type: string
        required: false
      - name: target
        type: string
        required: false

  cli:
    controller: /platform/idea/cmd/shell/CliController
    description: "Prefix a command line: type bare lines as `<prefix> …` until you clear it."
    help: |
      We run a command-line interface and we multiplex it, so you can
      have several command lines open at once. This sets one line's
      prefix, so everything you type there is prefixed for you.
      `cockpit cli --prefix "chat gossip"` puts THIS line on the gossip
      channel — then a bare `hello` dispatches as `chat gossip hello`.
      Run a one-off raw command without clearing the prefix by starting
      it with a slash: `/look`.

      Prefixes are per-line: a layout with several terminals can have
      one line on chat while another stays plain. The line shows its
      prefix inline as you type, so what you see is exactly what
      dispatches.

      The line you typed in is the default. Name another one
      positionally — a UI control does this, because an affordance
      dispatches un-prefixed and has to say which line it means.

      ⚠ Nothing here is a *world* scope. `scope:` in a command spec is
      an MQL search anchor and a sandbox scope is a jurisdiction; this
      is a text prefix on one input, and it used to be called `cockpit
      scope`, which made three unrelated things share a word.
    examples:
      - cmd: cockpit cli --prefix "chat gossip"
        note: Put this command line on the gossip channel
      - cmd: cockpit cli --clear
        note: Clear this line's prefix
      - cmd: cockpit cli stream-chat --prefix chat
        note: Set a named line (used by prefix-setting buttons)
      - cmd: cockpit cli
        note: Report this line's prefix
    options:
      prefix:
        short: p
        type: string
        description: "The prefix to prepend to bare input on this line."
      clear:
        short: c
        type: boolean
        description: "Clear this line's prefix."
    args:
      # Which command line. Defaults to the one you typed in; a UI
      # control names another, because an affordance dispatches
      # un-prefixed and has to say which line it means.
      - name: cli
        type: string
        required: false

  terminal:
    controller: /platform/idea/cmd/shell/CockpitTerminalController
    description: "Show a view or a channel in a terminal."
    help: |
      A terminal is a card: a view of everything you have been told,
      filtered, with its own command line. Every mode has one PRIMARY
      terminal, which cannot be closed; you can open more beside it.

        cockpit terminal <view>            show a view in the primary
        cockpit terminal #<channel>        show a channel in the primary
        cockpit terminal <view> --beside   open it in a new terminal
        cockpit terminal primary <card>    make another terminal primary

      A view is one of your console views (`All`, `Chat`, and the ones
      you saved); a channel is a chat channel by name. Each terminal
      keeps its own input mode (`cockpit cli`) and its own questions —
      a prompt waits on the line that asked it.
    examples:
      - cmd: cockpit terminal "#general"
        note: Show the general channel in the primary terminal
      - cmd: cockpit terminal Chat --beside
        note: Open the chat view in a second terminal
      - cmd: cockpit terminal All
        note: Put the primary back to everything
    options:
      beside:
        short: b
        type: boolean
        description: "Open it in a new terminal beside the primary."
    args:
      - name: target
        type: string
        required: false
      - name: cardId
        type: string
        required: false

  card:
    controller: /platform/idea/cmd/shell/CockpitCardController
    description: "Keep, size, place, tray or close a card."
    help: |
      Every change to which cards are up, and where, is one of these —
      a real command, so it can be scripted, aliased, saved in an
      arrangement and seen by a stream overlay.

        cockpit card list              what is open: size, place, live
        cockpit card pin <card>        keep it (a pinned card stays live)
        cockpit card unpin <card>      let it age out again (= dismiss)
        cockpit card auto <card>       hand the decision back
        cockpit card close <card>      close it now
        cockpit card grow <card>       unit → medium → full
        cockpit card shrink <card>     full → medium → unit
        cockpit card minimize <card>   put it in the tray
        cockpit card restore <card>    take it out of the tray
        cockpit card move <card> <col> <row>
                                       place it there; the column's
                                       cards below shift down
        cockpit card place <card>      place it where it is
        cockpit card unplace <card>    let it flow again

      A placed card stays where you put it and keeps answering; a card
      that just flows through the feed is a snapshot of when you looked.
      Medium and full hold one card each — growing another into the
      slot returns the first to its own size. The room card and the
      primary terminal fill roles and cannot be closed.
    examples:
      - cmd: cockpit card list
        note: List open cards, their size and place
      - cmd: cockpit card grow who
        note: Grow the who card into the medium slot
      - cmd: cockpit card move who 1 0
        note: Place the who card at the top of the second column
    args:
      - name: action
        type: string
        required: false
      - name: cardId
        type: string
        required: false
      - name: col
        type: number
        required: false
      - name: row
        type: number
        required: false

  shelf:
    controller: /platform/idea/cmd/shell/CockpitShelfController
    description: "Choose which figures ride the top bar's widget shelf."
    help: |
      The shelf is the row of figures across your top bar. You choose
      what is on it.

        cockpit shelf list          the whole catalogue, and what is pinned
        cockpit shelf pin <row>     add a figure, at the end
        cockpit shelf unpin <row>   take one off
        cockpit shelf first <row>   move it to the front

      Rows: play, renown, skill, make, coin, status, time, online,
      docket.

      The shelf has an order, and `first` is how you change it. On a
      narrow screen only the head of the shelf rides the bar — the rest
      is one pull-down away — so putting a figure first is how you
      choose what you can see without reaching for it. `first` on a row
      that is not pinned puts it on the shelf, at the front: asking for
      it on your bar is one intention, not two commands.

      Most of them will not be showing you a number. That is not a
      fault — a figure the server cannot stand behind renders as
      hatched, with the reason it is not there, rather than as a
      confident guess. `make` reads at the account level: it sums what
      every character on your account has built, so it is the same
      figure whichever of them you are playing.

      Identity and connection are not on this list. They are not
      widgets — they are the two things that must be true at a glance,
      so they cannot be unpinned.
    examples:
      - cmd: cockpit shelf list
        note: Print the catalogue and what is currently pinned
      - cmd: cockpit shelf unpin coin
        note: Take a row off the shelf
      - cmd: cockpit shelf pin coin
        note: Put it back, at the end
      - cmd: cockpit shelf first coin
        note: Move it to the front (pinning it there if it was off)
    args:
      - name: action
        type: string
        required: false
      - name: row
        type: string
        required: false

  style:
    controller: /platform/idea/cmd/shell/StyleController
    description: "Customize cockpit appearance: theme, per-channel color, plain mode, mention prefs."
    help: |
      Tune how the cockpit looks and reads. `cockpit style` collects
      every visual preference — your overall theme, the color a given
      chat channel shows in, whether your own name gets highlighted,
      and whether output drops to plain unstyled text.

      Each preference has its own form:

        cockpit style show                       print the current overlay
        cockpit style theme <ink|marble|high-contrast>
        cockpit style channel <key> color <value>
        cockpit style channel <key> clear
        cockpit style mention self <on|off>
        cockpit style plain <on|off>
        cockpit style plain channel <key> <on|off>
        cockpit style reset                      wipe the overlay

      Bare `cockpit style` is the same as `cockpit style show`. Use
      `cockpit style reset` to wipe your overlay back to defaults if
      you've tangled things up.
    examples:
      - cmd: cockpit style show
        note: Print every style choice currently in effect
      - cmd: cockpit style theme marble
        note: Switch to the Marble (light) ground
      - cmd: cockpit style channel gossip color blue
        note: Tint the gossip channel blue
      - cmd: cockpit style plain channel gossip on
        note: Drop just the gossip channel to plain text
    args:
      - name: styleSub
        type: string
        required: false
      - name: a
        type: string
        required: false
      - name: b
        type: string
        required: false
      - name: c
        type: string
        required: false
