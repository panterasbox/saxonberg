verbs: [scrub]
controller: /platform/idea/cmd/medical/ScrubController
description: "Wash your hands clean at water"
help: |
  `scrub` washes your hands clean — you need water in reach: a basin, a
  tap, a jug.

  Why it matters: clean hands treat a wound without infecting it, and
  dirty hands can seed a wound-infection that festers days later. Handling
  a bleeding wound dirties your hands, so a careful medic scrubs between
  patients. Hands stay clean for a while, then need doing again.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  # Bare default: every reachable vessel; the controller takes the first
  # holding water — the CONTENTS, which no predicate asks. Mirrors `rinse`.
  - name: water
    type: object
    required: false
    prepositions: [with, in, under, at]
    default: "reachable:[mixin.BulkableMixin]"
    scope: ["reachable"]
    requires: [BulkableMixin]
