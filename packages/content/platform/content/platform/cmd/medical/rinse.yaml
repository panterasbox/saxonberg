verbs: [rinse]
controller: /platform/idea/cmd/medical/RinseController
description: "Wash a caustic off a body before it eats any further"
help: |
  Rinse a caustic burn — `rinse` yourself, or `rinse alice`. You need
  water in reach: a basin, a tap, a water butt.

  ⚠ This is the one wound in the game that is still HAPPENING. Every
  other injury is a record of something that already finished; a caustic
  is the agent still sitting on the skin, and it gets worse every minute
  it stays there. Rinsing does not heal it — what it does is stop it,
  after which it mends like any other burn.

  A bandage will not help, and `treat` will tell you so.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: patient
    type: object
    required: false
    scope: "reachable"
    requires: VitalsMixin
  # Bare, the binder hands over every reachable vessel and the controller
  # takes the first holding water — a question about the CONTENTS, which
  # no predicate can ask (`lint:instrument-args`). Mirrors `wash`.
  - name: water
    type: object
    required: false
    prepositions: [in, under, with]
    default: "reachable:[mixin.BulkableMixin]"
    scope: ["reachable"]
    requires: [BulkableMixin]
