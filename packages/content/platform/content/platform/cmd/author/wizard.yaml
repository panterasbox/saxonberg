verbs: [wizard]
controller: /platform/idea/cmd/author/WizardController
description: "Confer or revoke wizard (code-trust) status (archwizard-only)"
help: |
  Manage who holds wizard status — the capability to AUTHOR TypeScript:
  write a code file into the source tree, type code into `eval`. It
  confers no title and no office; running code, reloading it, reading it
  and naming it from a row are open to anyone who holds the path.

  `wizard grant <player>` adds someone to the `wizards` group; `wizard
  revoke <player>` removes them. This verb is restricted to archwizards —
  the `archwizards` group and the Prime Minister, each of whom is a wizard
  too.
validators:
  - /lib/command/validators/requiresArchwizard
subcommands:
  grant:
    description: "Confer wizard status on a player"
    help: |
      Add a player to the `wizards` group, granting them code trust.
      Name the player after the subcommand.
    examples:
      - cmd: wizard grant alice
        note: Confer wizard status on Alice
    args:
      - name: target
        type: object
        required: true
        scope: "online"
        requires: class:Agent
        onExcess: prompt
  revoke:
    description: "Revoke wizard status from a player"
    help: |
      Remove a player from the `wizards` group, dropping their code
      authoring. They keep every title and seat they hold.
    examples:
      - cmd: wizard revoke alice
        note: Revoke Alice's wizard status
    args:
      - name: target
        type: object
        required: true
        scope: "online"
        requires: class:Agent
        onExcess: prompt
