# ⭐ `player` — and it used to claim `me` as an alias, which collided
# with `social/score.yaml`.
#
# Adjudicated by the ladder at rung 2 plus *do not reserve a name*: `me`
# was an alias on BOTH views and each already had a primary word, so one
# of them was pure surplus. It stays with `score`, because "me" reads as
# *show me* rather than *configure me* — and this view is subcommanded,
# which would have made `me set name …` the shape of a bodily-sounding
# word. A subcommand is something you operate; that is the tell.
verbs: [player]
controller: /platform/idea/cmd/author/PlayerController
description: "Manage your player character settings"
help: |
  Adjust the basics of who your character is. Use the subcommands
  to set your name, choose your pronouns, or review what's
  currently set. ⚠ `me` is NOT an alias for this verb — it belongs to `score`.
validators:
  - /lib/command/validators/requiresAvatar
subcommands:
  name:
    description: "Set your character name"
    help: |
      Set the name others see for your character. Pass a single
      given name, or add a surname as a second word for a fuller
      name.
    examples:
      - cmd: player name Aria Vance
        note: Set a given name and surname
    args:
      - name: name
        type: string
        required: true
      - name: surname
        type: string
        required: false

  pronouns:
    description: "Set your pronouns"
    help: |
      Choose the pronouns the game uses when referring to you in
      its prose. Set them once and they thread through every
      message about your character.
    examples:
      - cmd: player pronouns she/her
        note: Set your pronouns
    args:
      - name: pronouns
        type: string
        required: true

  show:
    description: "Show your current player settings"
    help: |
      Print your character's current settings — name and pronouns —
      so you can check what's set before changing anything.
