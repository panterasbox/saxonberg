verbs: [reload]
controller: /platform/idea/cmd/author/ReloadController
description: "Hot-reload a template or runtime instance, then type-check it"
help: |
  Pull fresh code into a live template or runtime instance without
  restarting the world. Name the target by its path, or use `--mql`
  to pick it out with a query. This is a developer tool and
  requires developer access.

  Reload re-runs the object through the hot-reload state machine, so
  existing instances pick up your latest changes in place.

  The live code never checks types, so after the swap the file is
  type-checked in the background and you are told the verdict a few
  seconds later. The check covers that file only — not the files that
  import it. `--no-check` skips it; `--strict` checks first and
  refuses to swap code with type errors in. `typecheck` checks without
  reloading.
validators:
  - /lib/command/validators/requiresWizard
args:
  - name: target
    type: string
    required: false
options:
  mql:
    type: object
    scope: [reachable]
    description: "MQL expression alternate to <target>"
    requires: any
  no-check:
    type: boolean
    field: noCheck
    description: "Swap only; skip the type-check"
  strict:
    type: boolean
    field: strict
    description: "Type-check first; refuse to reload on type errors"
