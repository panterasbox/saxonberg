verbs: [water]
controller: /platform/idea/cmd/bulk/WaterController
description: "Water a growing plant, or the ground it grows in"
help: |
  Tip water into a plant's soil. You need something holding water — a
  watering can is what this verb comes with, but name any holder with
  `with` or `from` and it will pour from that instead.

  Only as much goes in as the soil can hold; the rest stays in the can.
  Naming the pot works as well as naming the plant. If the soil is
  already wet, watering again does nothing for it — and nothing will
  bring back a plant that has died.

  `pour` is the manual path and still works; `water` is the one that
  knows what a plant is.

  On a field you can water the crop or the ground itself, and you are told
  how many litres went in — a can on a field barely shows. On a field
  divided into patches, say which: `water wheat at the top end`.
examples:
  - cmd: water the lily
    note: Water a plant from whatever water you're carrying
  - cmd: water the pot with the can
    note: Name the source explicitly
  - cmd: water wheat at the top end
    note: On a field divided into patches, name the patch
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresEmbodied
args:
  - name: target
    type: object
    required: true
    scope: "reachable"
    # A plant, a bed or pot, a patch or a field (field population D18).
    requires: [VisibleMixin, GrowingMixin|SoilMixin]
  # ⭐ WHICH PART — `at <patch>` on a divided field (field population D5).
  # Optional: on one-piece ground there is nothing to name, and on a
  # divided field the GROUND refuses the act without it, listing its parts.
  # Greedy so `at the top end` binds whole (an article would otherwise eat
  # a positional); every arg after it is prepositional, so it stops there.
  - name: patch
    type: object
    required: false
    greedy: true
    scope: ["reachable"]
    prepositions: [at]
    requires: SoilMixin
  # ⭐ WHAT WITH — DECLARED, not hunted for (`lint:instrument-args`).
  # Bare, the binder hands over every vessel you are CARRYING and the
  # controller takes the first with water in it — a question about the
  # contents, which no predicate asks. `water the lily with the bucket`
  # names one; a named vessel is taken as named, so "it is empty" can be
  # said about it.
  - name: source
    type: objects
    required: false
    # Named: anything in reach (a can on the floor). Bare: only what you
    # CARRY — the default's seed is `me:i`, not `reachable`.
    scope: ["reachable"]
    prepositions: [with, from]
    default: "me:i:[mixin.BulkableMixin]"
    requires: [BulkableMixin]
