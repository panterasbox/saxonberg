verbs: [eat]
controller: /platform/idea/cmd/bulk/EatController
description: "Eat an edible item, or a meal out of the dish it came in"
help: |
  Eat something. Two shapes, one act:

    eat ration      a whole discrete item — an apple, a loaf, a ration.
                    It is gone afterward.
    eat stew        a portion of a meal out of the dish it was served
                    in. The dish stays; when you have finished it, it
                    is a bowl to wash rather than a bowl that has
                    ceased to exist.

  If a clean spoon, fork or table knife is in reach you use one — and
  dirty it. If none is, you eat with your fingers, which works exactly
  as well; cutlery is never a requirement.

  The target has to be edible, or be holding something edible, so you
  can't eat a rock or a lantern. For liquids, reach for `drink` or
  `sip` instead.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: target
    type: object
    required: true
    scope: "reachable"
    requires: VisibleMixin
    validators:
      - /lib/command/validators/mustBeEdible
