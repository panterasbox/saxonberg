verbs: [smell]
controller: /platform/idea/cmd/perception/SmellController
description: "Smell your surroundings or a specific thing"
help: |
  Take a breath and notice what it carries. With no target,
  `smell` reports the scents of your location — smoke, flowers,
  rot, the salt of the sea. Name a thing to smell it directly.

  `smell at` reads the same as the bare form; the preposition is
  optional. You need a working sense of smell for any of it.
validators:
  - /lib/command/validators/requiresSmell
args:
  - name: target
    type: object
    required: false
    scope: ["$focus", "reachable"]
    updates_focus: extend
    prepositions: [at]
    default: "$focus"
    onExcess: prompt
    requires: any
