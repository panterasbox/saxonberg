verbs: [unhide, reveal]
controller: /platform/idea/cmd/perception/UnhideController
description: "Step back into the open from hiding"
help: |
  `unhide` ends the hidden state you entered with `hide` — you step out
  of cover and are plainly present again to everyone in the room.

  Hiding also breaks on its own when you move carelessly, attack, or
  are found by a `search`; `unhide` is the deliberate way to drop it.
examples:
  - cmd: unhide
    note: Step back into plain sight
