verbs: [query]
category: perception
# ⭐ There is no inventory verb (size-and-carrying W10h, owner ruling
# 2026-11-15): listing a set and choosing how to show it is `query`.
# `i` and `inventory` are default player aliases that run the whole line —
# `alias list` shows it, `alias unset i` removes it.
defaultAliases:
  - name: i
    body: query --ledger me:i
    description: "What you carry, by how near it is to your hand"
  - name: inventory
    body: query --ledger me:i
    description: "What you carry, by how near it is to your hand"
controller: /platform/idea/cmd/perception/QueryController
description: "List whatever a query names — what you carry, the horizon, the people here, all the brass"
help: |
  `look` tells you what ONE thing is like. `query` lists a SET: whatever
  the query names, each thing as it stands to you.

    query ~horizon      what you can see from here, beyond your room —
                       landmarks first, then a handful of the tallest
                       things in view, each with a rough direction
                       (a compass point and rough miles), or "close
                       by" when it stands in your own place; by night
                       only what shows a light. `measure bearing`
                       takes the exact bearing.
    query ~peers        who and what is here with you
    query all brass    every brass thing in reach
    query bob:i        what Bob wears and holds (never his pockets)
    query me:i         everything you have
    query me:~         what you can ask yourself for — the built-in
                       relations (~here, ~peers, ~all …), your contact
                       lists, your groups — each with what it means
    query book:~       what a book (or any holder) keeps that you can ask for

  Options change how the list is SHOWN, never what is in it:

    --ledger   grouped under whoever holds it. Yourself by how near each
               thing is to your hand: IN HAND; READY (your pockets, what
               hangs from your belt and the room left along it, the
               satchel at your side and what is in each); WORN; and
               PACKED away on your back (each pack as how many things and
               how heavy). Then how heavy your load is, in words. Another
               person or a container: worn, held, carried.
    --weight   the weight and bulk of each thing
    --flat     one list, not grouped

  `i` and `inventory` are your aliases for `query --ledger me:i` — type
  `alias list` to see them, `i --weight` or `i --flat` to add an option.

  Narrowing is the query's own, never an option: `me:i:held` (in your
  hands), `me:i:worn`, `me:i:carried` (in hand or hung from you),
  `me:I` (everything, the packs opened), `rucksack:i` (one pack),
  `brass:{2}`, `all coins`, `me:i:[keyword.knife]`. A person shows only
  what you can see of them; a shut container is shut — `open` it first.
  `look in <thing>` is the ledger of one container.
examples:
  - cmd: i
    note: What you carry — in hand, ready, worn, packed — and your load
  - cmd: query --ledger me:I
    note: The same, with the packs on your back opened
  - cmd: query --ledger me:i:worn
    note: Only what you wear
  - cmd: i --weight
    note: The weight and bulk of each thing
  - cmd: query ~horizon
    note: What is in view beyond your room
  - cmd: query all brass
    note: Every brass thing in reach, listed
  - cmd: query --ledger bob:i
    note: What Bob wears and holds, grouped
validators:
  - /lib/command/validators/requiresAnimate
args:
  # ⭐ A SET (maritime revision 2′): any query — a seed (`horizon`,
  # `peers`), the player's own how-many (`all brass`), a holder's things
  # (`bob:i`). Everything it names is listed; nothing is asked.
  - name: set
    type: objects
    required: true
    scope: ["~reachable"]
    requires: any
    # ⭐ `query thing:~` lists what you can ask that thing for (naming
    # overhaul D-B4) — this is the one slot a listing binds.
    lists: relations
options:
  ledger:
    type: boolean
    description: "Group the list under its holder — yourself by tier: in hand, ready, worn, packed"
  weight:
    type: boolean
    description: "The weight and bulk of each thing"
  flat:
    type: boolean
    description: "One list, not grouped"
