verbs: [weigh]
controller: /platform/idea/cmd/perception/WeighController
description: "Weigh a tangible object on a balance"
help: |
  Put a thing on the scale and read its mass. `weigh` needs a
  balance to hand and a tangible target within reach — you can't
  weigh a sound or a beam of light. Use it when an object's heft
  matters and you want a real number, not a guess.

  For a quick sense of how heavy something feels without a
  balance, `feel` may serve; `weigh` is for the precise figure.
args:
  - name: target
    type: object
    required: true
    scope: ["reachable"]
    requires: TangibleMixin
