verbs: [read]
category: perception
controller: /platform/idea/cmd/perception/ReadController
description: "Take in the marks on a written thing and decode them"
help: |
  Reading is two things at once, and they come apart.

  First you have to **perceive** the marks. Ink needs light — a
  scroll in a dark cellar is a blank you cannot make out. Raised or
  incised lettering does not: you can read embossed text with your
  hands, in the pitch dark, which is why an expedition pays for it.

  Then you **decode** what you perceived. Everyone reads the common
  script, so today this is the easy half — but it is a separate
  half, and a spellbook's comprehension floor lives in it.

  Reading a scroll tells you what it says and sets nothing off.
  Saying it aloud is `recite`.

  A book reads at the page it lies open at; `read <book> page <n>` opens
  it at another. A printed sheet reads whatever was printed on it, and
  whoever holds the paper reads it — that is what paper is.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: target
    type: object
    required: true
    # ⭐ One word, or a quoted name (`read "city directory" page 3`) —
    # quoting replaced the greedy arg (controller liquidity).
    scope: ["$focus", "reachable"]
    updates_focus: extend
    requires: [VisibleMixin, ReadableMixin]
    validators:
      - /lib/command/validators/mustNotBeShutAway
  # ⭐ A book reads at a page: `read notebook page 3` opens it
  # there. A positional number reaches the controller raw; it parses.
  - name: page
    prepositionRequired: true
    type: number
    required: false
    prepositions: [page]
