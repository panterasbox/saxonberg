verbs: [measure]
description: "Measure a physical channel at a location"
help: |
  Read a single value off the world. `measure` gives you one
  clean number for a physical channel where you stand — no
  breakdown, no provenance, just the figure. When you want the
  working behind it, reach for `analyze` instead.

  Pick a channel as a subcommand: `light`, `temperature`,
  `pressure`, `humidity`, `gravity`, `atmosphere`, `altitude`,
  `shadow`, `strike`, or `dip`. Some readings need an instrument:
  the sky ones (`altitude`, `shadow`) want a sextant or sundial,
  and the geological ones (`strike`, `dip`) want a surveyor's
  compass or a miner's dial.
subcommands:
  light:
    description: "Measure light intensity at a location (lux)"
    help: |
      Read the light level at a place in lux — one number, no
      source breakdown. Defaults to where you stand if you name
      no location. For the per-source breakdown, use
      `analyze light`.
    examples:
      - cmd: measure light the cellar
        note: Read the light at another place
    controller: /platform/idea/cmd/perception/MeasureLightController
    args:
      - name: location
        type: object
        required: false
        default: "here"
        scope: ["reachable"]
        requires: ContainerMixin
  temperature:
    description: "Measure atmospheric temperature (Kelvin) at your immediate scope"
    help: |
      Read the air temperature around you in Kelvin. Measures your
      immediate surroundings; it doesn't take a location.
    controller: /platform/idea/cmd/perception/MeasureTemperatureController
    args:
      - name: detail
        type: string
        required: false
  pressure:
    description: "Measure atmospheric pressure (Pa) at your immediate scope"
    help: |
      Read the air pressure around you in pascals. Measures your
      immediate surroundings; it doesn't take a location.
    controller: /platform/idea/cmd/perception/MeasurePressureController
    args:
      - name: detail
        type: string
        required: false
  humidity:
    description: "Measure relative humidity (%) at your immediate scope"
    help: |
      Read the relative humidity around you as a percentage.
      Measures your immediate surroundings; it doesn't take a
      location.
    controller: /platform/idea/cmd/perception/MeasureHumidityController
    args:
      - name: detail
        type: string
        required: false
  density:
    controller: /platform/idea/cmd/perception/MeasureDensityController
    description: "Float a hydrometer in a vessel and read its specific gravity"
    help: |
      Needs a hydrometer in hand. A fermenting batch reads back the
      sugar the ferment has not eaten yet — two vats at two
      temperatures, read over days, and the curve is yours.
    args:
      - name: target
        type: object
        required: true
        scope: "reachable"
        requires: BulkableMixin
  gravity:
    description: "Measure gravitational acceleration (m/s²) at your immediate scope"
    help: |
      Read the local gravity around you in metres per second
      squared — handy off-world or anywhere the pull feels wrong.
      Measures your immediate surroundings; it doesn't take a
      location.
    controller: /platform/idea/cmd/perception/MeasureGravityController
    args:
      - name: detail
        type: string
        required: false
  atmosphere:
    description: "Identify the bulk atmosphere medium at your immediate scope"
    help: |
      Name the medium you're standing in — air, water, vacuum, or
      whatever else fills the space. Useful before you trust a
      breath. Measures your immediate surroundings; it doesn't take
      a location.
    controller: /platform/idea/cmd/perception/MeasureAtmosphereController
    args:
      - name: detail
        type: string
        required: false
  altitude:
    description: "Estimate altitude from the barometric delta, or read the angular altitude of the sun/moon with a sextant"
    help: |
      With no argument, estimate how high you are from the drop in
      air pressure. Name a celestial body — the sun or moon — to
      read its angular height above the horizon with a sextant.
    examples:
      - cmd: measure altitude sun
        note: Read the sun's angle with a sextant
    controller: /platform/idea/cmd/perception/MeasureAltitudeController
    args:
      - name: body
        type: string
        required: false
  shadow:
    description: "Read solar elevation/azimuth from your shadow (needs a sundial)"
    help: |
      Read the sun's elevation and bearing off the cast of your
      shadow — an old way to tell the time and direction outdoors.
      Needs a sundial to hand and a sun in the sky.
    controller: /platform/idea/cmd/perception/MeasureShadowController
    args:
      - name: detail
        type: string
        required: false
  # ⚠⚠ The two GEOLOGICAL channels, and their controllers live in the
  # `trade-mining` pack rather than in `platform/idea/cmd/perception/`.
  #
  # `CommandDefinition.resolveController` takes a `/`-leading mud path
  # verbatim, so a platform view may name a pack's controller — and it
  # SHOULD here, under this repo's own rule that nothing content-specific
  # belongs in a core tree. These are content-specific three times over:
  # they gate on a mining instrument, they band by the `geology`
  # Discipline, and they speak mining prose. The alternative — generic
  # kernel controllers over a `lib/zone` geology interface — is a new
  # kernel substrate module and a kernel-named method contract across the
  # pack boundary, for three stanzas whose only consumer is one pack.
  #
  # ⚠ In an install WITHOUT `trade-mining`, these are advertised in
  # `measure`'s help and die on dispatch with a legible `controller-error`
  # note — never a crash. The help text below says what they need, so the
  # failure reads as "you have no instrument" rather than as a bug.
  strike:
    description: "Read the strike of an ore body from its surface trace (needs a surveyor's instrument)"
    help: |
      Take a bearing on the line an orebody makes where it reaches the
      surface. Needs a surveyor's compass or a miner's dial in hand, and
      a deposit under the ground you are standing on.

      One reading is a guess with an error bar on it; three readings from
      three places narrow that bar, and `analyze ground` is what adds
      them up. How tight the bar is depends on your eye — competence buys
      resolution, never a different number.

      ⚠ The surface trace carries strike and NOTHING ELSE. For the other
      half of the plane you have to go underground and read `measure dip`
      off an exposed vein.
    examples:
      - cmd: measure strike
        note: Take a bearing on the outcrop where you stand
    controller: /trade/mining/idea/cmd/perception/MeasureStrikeController
    args:
      - name: detail
        type: string
        required: false
  dip:
    description: "Read how steeply an ore body falls, off an exposed vein (needs a surveyor's instrument)"
    help: |
      Read the angle a seam falls at, off a face where the vein is
      actually showing. Needs a surveyor's compass or a miner's dial.

      ⚠ It cannot be read at the surface, and not because anything forbids
      it: the trace where an orebody meets the ground is a LINE, and a
      line has no fall in it. Dip is why you drive a heading.
    controller: /trade/mining/idea/cmd/perception/MeasureDipController
    args:
      - name: detail
        type: string
        required: false
