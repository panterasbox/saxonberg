# ⭐⭐⭐ `measure <channel>` — ONE view, ONE controller, and the channel is
# a STRING.
#
# This view used to carry a `subcommands:` map: fifteen stanzas, each
# naming a controller, five of them naming a controller in a pack that
# might not be installed. That shape had three costs and two of them
# were silent.
#
#   1. **A pack's channel was advertised in every install.** `measure
#      strike` appeared in this file's help on a server with no mining
#      pack and died on dispatch with `controller-error`.
#   2. **An unknown subcommand STOPS the affordance chain** — so a verb
#      afforded from two places could not fall through to the second.
#   3. **A trade could not add a channel without editing this file.**
#
# Flat-positional fixes all three. The channel is resolved against the
# installed roster (`ReadingCatalogue.warmed`), so an uninstalled channel
# is simply not a channel, and the refusal says so and points at
# `readings`. A trade ships `content/<root>/idea/reading/<x>.yaml` plus a
# class and is done: no platform file changes in either direction.
#
# The shape is `cast <spell> [at <target>]`'s, which is the shipped
# precedent for a token resolved against a catalogue.
verbs: [measure]
description: "Read a channel of the world off an instrument"
help: |
  Read something off an instrument. `measure` is the instrumented
  rung of the reading ladder: it wants a tool that can take the
  reading, and it answers in the units that tool gives.

  `readings` lists every channel this world can tell you about, and
  `readings <channel>` says what knowing it is worth and what it
  costs you not to. `analyze <channel>` is the same fact read with
  your eyes and your training instead.

  ⭐ Competence never decides whether you may read something. It
  decides how NARROW the answer is. An instrument raises the
  ceiling of what your practice can realize, and a fine instrument
  in an untrained hand still reads coarsely.
examples:
  - cmd: measure light
    note: Read the light where you stand
  - cmd: measure temperature the kettle
    note: Read a thing rather than the room
  - cmd: measure strike with the dial
    note: Name the instrument when more than one is in reach
controller: /platform/idea/cmd/perception/MeasureController
args:
  # The fact being read. A plain string, resolved against the installed
  # channel roster — never an enum, because the roster is whatever packs
  # are installed and the kernel keeps no list.
  - name: channel
    type: string
    required: true
  # What is being read, when the channel takes one. Optional: most
  # channels read where you stand, and the Reading's own `scope:` says
  # what a named subject means for it.
  #
  # ⚠⚠ `greedy: true` IS REQUIRED and is not decoration. Without it
  # `measure temperature the kettle` binds `the` and `kettle` as two
  # positionals, answers "too many arguments", falls through the
  # affordance chain and dies as an unknown command shape — with the
  # controller never reached. 45 shipped views already carry it; `look`
  # shipped WITHOUT it, and nobody found out until somebody drove
  # `look at the ground` in a browser. The MQL desugar drops articles,
  # so the whole tail resolves as one query.
  #
  # ⭐ Unresolved text is a PARAMETER, not a failure: `measure elevation
  # moon` binds `stuff: null, raw: 'moon'`, and a channel that reads the
  # place uses the raw word for which body to sight. That is how the
  # sextant's body and a mine face's direction travel with no second arg.
  - name: subject
    type: object
    required: false
    greedy: true
    scope: ["$focus", "reachable"]
    requires: any
  # ⭐ Every tool in reach, plural with a default — the sanctioned shape
  # when one view cannot carry a per-channel `[capability.X]` filter. The
  # Reading narrows the bound list by the capability IT declares, which
  # is a question about the pair that no view predicate can express.
  #
  # Reach, not carry: a bench on the wall and a photometer on the table
  # both count.
  - name: tool
    type: objects
    required: false
    # ⚠⚠ `greedy: true` on the PREPOSITIONAL arg too, and this one was
    # found last. `with the photometer` puts `the` and `photometer` after
    # the preposition, and a non-greedy arg takes one positional — so the
    # leftover word trips "too many arguments" and the whole command dies
    # as an unknown shape. ⭐ The general rule the three fixes add up to:
    # **every object arg a player will put an article in front of needs
    # `greedy`**, wherever it sits in the view.
    greedy: true
    prepositions: [with, using]
    default: "reachable:[mixin.ToolMixin]"
    scope: ["reachable"]
    requires: [ToolMixin]
