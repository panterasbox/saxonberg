# ⭐⭐⭐ `analyze <channel>` — the trained-eye rung of the same ladder
# `measure` instruments. One view, one controller, and the channel is a
# STRING resolved against the installed roster.
#
# See `measure.yaml` for what the retired `subcommands:` map cost. The
# same three reasons apply here, plus a fourth this view suffered on its
# own: `analyze address` and `analyze atmosphere` were engine diagnostics
# wearing a perception verb's clothes. They are `trace address` and
# `trace atmosphere` now (`cmd/system/trace.yaml`) — a free engine read,
# which is what they always were.
verbs: [analyze]
description: "Work a channel of the world out by eye and by training"
# ⚠ `opens_card` is VERB-level in the schema, so declaring `survey` here
# licenses every channel to open it — and only the RECORD channels
# (`ground`, `soil`) ever will. Recorded so a reviewer does not read it
# as a leak: the declaration is the GATE `CardApi.open` is checked
# against, not the push.
opens_card: survey
help: |
  Work something out by looking at it. `analyze` is the free rung of
  the reading ladder — no instrument, no permission, no money — and
  what it costs you is that the answer is only as narrow as your
  training makes it.

  `readings` lists every channel this world can tell you about, and
  `readings <channel>` says what knowing it is worth and what it
  costs you not to. `measure <channel>` is the same fact read off an
  instrument instead.

  ⭐ A vague answer is not a wrong one. An untrained reading is wide
  and TRUE; the figure underneath is the same one an expert reads.
  Nothing here is ever gated on how good you are — where a reading
  is out of reach, it is a ROUTE you are missing, and the refusal
  names it.
examples:
  - cmd: analyze light
    note: What the light here is good for
  - cmd: analyze ground the north face
    note: What your readings add up to
  - cmd: analyze patient the miner
    note: Read a person's condition, in words
controller: /platform/idea/cmd/perception/AnalyzeController
args:
  - name: channel
    type: string
    required: true
  # ⚠⚠ `greedy: true` IS REQUIRED — see `measure.yaml`'s note. Without
  # it `analyze ground the north face` binds three positionals, answers
  # "too many arguments" and dies as an unknown command shape.
  - name: subject
    type: object
    required: false
    greedy: true
    scope: ["$focus", "reachable"]
    requires: any
  # ⭐ The eye rung takes tools too — not to read WITH, but because some
  # channels declare a `handTool:` that lifts what the eye can resolve
  # (a hand lens, a streak plate). The words stay words; what changes is
  # how fine they may get.
  - name: tool
    type: objects
    required: false
    # ⚠⚠ `greedy: true` on the PREPOSITIONAL arg too, and this one was
    # found last. `with the photometer` puts `the` and `photometer` after
    # the preposition, and a non-greedy arg takes one positional — so the
    # leftover word trips "too many arguments" and the whole command dies
    # as an unknown shape. ⭐ The general rule the three fixes add up to:
    # **every object arg a player will put an article in front of needs
    # `greedy`**, wherever it sits in the view.
    greedy: true
    prepositions: [with, using]
    default: "reachable:[mixin.ToolMixin]"
    scope: ["reachable"]
    requires: [ToolMixin]
