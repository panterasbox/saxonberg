verbs: [taste]
controller: /platform/idea/cmd/perception/TasteController
description: "Taste your surroundings or a specific thing"
help: |
  Put it to your tongue. With no target, `taste` reports whatever
  flavor hangs in your immediate surroundings. Name a thing to
  taste it directly — useful for food, drink, and anything you
  want to know more intimately than a look allows.

  `taste at` reads the same as the bare form; the preposition is
  optional. You need a working sense of taste for any of it.
validators:
  - /lib/command/validators/requiresTaste
args:
  - name: target
    type: object
    required: false
    scope: ["$focus", "reachable"]
    updates_focus: extend
    prepositions: [at]
    default: "$focus"
    onExcess: prompt
    requires: any
