verbs: [taste]
controller: /platform/idea/cmd/perception/TasteController
description: "Put a thing to your tongue"
help: |
  Tasting is contact and it has a cost. A small bite or sip really comes
  out of the thing, and whatever it holds reaches you on the same path as
  eating, in a small dose: lye burns, and a poison doses you. `taste` is
  the small mouthful and `eat` is the meal.

  You read each of the five tastes and what reaches your nose from the
  back of your mouth, and how you like it, which is yours and not the
  food's. You need something in reach to taste, and a working sense of
  taste.
validators:
  - /lib/command/validators/requiresTaste
args:
  - name: target
    type: object
    required: false
    scope: ["reachable"]
    updates_focus: extend
    prepositions: [at]
    onExcess: prompt
    requires: any
    validators:
      - /lib/command/validators/mustBeTastable
