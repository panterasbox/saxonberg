verbs: [office]
category: governance
controller: /platform/idea/cmd/governance/OfficeListController
description: "Inspect government offices; the founder hands seats off"
help: |
  The seats of government — a fixed apparatus of named offices, each held
  by a single officeholder. There are eight: the Prime Minister, the three
  House Speakers (Producer / Capital / Consumer), the Governor of the
  Central Bank, the Minister of Finance (the Treasury), the Minister of
  Trade (the trades and the commons) and the Registrar of Corporations
  (the corpos' committees). Offices seat characters, never accounts. Every
  office is held by default by the founder's Compact character (see
  `help compact`) until it is explicitly handed off; vacating a seat
  reverts it to that default.

  `office list` shows the public roster — every office, its branch and
  origin, and the character who holds it; a seat still on the default
  shows its holder marked "(by default — the founder)", or "the founder"
  alone while the founder has no character. The roster is public:
  governance is transparent by constitutional design.

  `office assign <player> <office>` hands a seat to a character and `office
  vacate <office>` reverts it to the default. Those two are restricted to
  the founder (any of the founder's characters) — if you aren't the
  founder, the game won't let you run them.
validators:
  - /lib/command/validators/requiresAnimate
subcommands:
  assign:
    controller: /platform/idea/cmd/governance/OfficeAssignController
    description: "Hand an office to a player (founder-only)"
    help: |
      Set a character as the explicit holder of an office, replacing
      whoever held it. Name the character, then the office (by key or name,
      e.g. `prime-minister`). Only a character that is its account's
      Compact character may be seated — any other is refused, saying so.
      Founder-only.
    validators:
      - /lib/command/validators/requiresFoundingAuthority
    examples:
      - cmd: office assign alice prime-minister
        note: Hand the Prime Minister seat to Alice
    args:
      - name: target
        type: object
        required: true
        scope: ["~peers", "~contacts"]
        requires: class:Agent
        onExcess: prompt
      - name: office
        type: string
        required: true
  vacate:
    controller: /platform/idea/cmd/governance/OfficeVacateController
    description: "Revert an office to the founder (founder-only)"
    help: |
      Clear an office's explicit holder; the seat reverts to the founder
      default (the founder's Compact character). Name the office only — there is no empty state. Founder-only.
    validators:
      - /lib/command/validators/requiresFoundingAuthority
    examples:
      - cmd: office vacate prime-minister
        note: Revert the Prime Minister seat to the founder
    args:
      - name: office
        type: string
        required: true
  list:
    controller: /platform/idea/cmd/governance/OfficeListController
    description: "Show the public roster of offices and holders"
    help: |
      List every office with its branch, origin, and current holder. Public
      — runnable by anyone.
