verbs: [sit]
controller: /platform/idea/cmd/posture/SitController
description: "Sit on something. With no argument, sit on the ground."
help: |
  Take a seat. Bare `sit` sits down where you are, on the ground.
  Name something to sit on it instead — a chair, a bench, the edge
  of a table — provided it can seat someone.

  Sitting is a posture and holds until you change it. Stand up
  again with `stand`, or switch to `lie` or `kneel`.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresPosed
  - /lib/command/validators/requiresSlottable
  - /lib/command/validators/requiresEmbodied
args:
  - name: target
    type: object
    required: true
    default: "ground"
    scope: ["$focus", "reachable"]
    requires: [VisibleMixin, PosturedMixin]
    # `sit on the ground` is the form a person actually types. Without
    # `prepositions`, CommandLogic binds `on` AS the target and the
    # leftover word trips "too many arguments" into shape-fall-through;
    # `greedy` then lets the multi-word tail arrive whole, and the MQL
    # desugar drops the article, so `the ground` reaches the keyword
    # match as `ground`.
    prepositions: [on, at, in, upon]
    greedy: true
