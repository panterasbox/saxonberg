verbs: [inhale]
controller: /platform/idea/cmd/posture/InhaleController
description: "Take a deep breath — fill your lungs before a dive."
help: |
  Fill your lungs. Your breath is a store: a deep one lasts about twice
  as long under water as the breath the water would otherwise catch you
  with, and less the harder you work and the less fit your wind. Cold
  water makes it last a little longer — and costs you half of it on the
  way in.

  Under water there is nothing to breathe, so you cannot take another.
  Breathing fast and deep before you go (`inhale` again and again) does
  not give you more air; it only makes the warning come later — and the
  blackout comes without one.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
