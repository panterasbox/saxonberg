verbs: [exhale]
controller: /platform/idea/cmd/posture/ExhaleController
description: "Breathe all the way out — sink, at the cost ofhelp: |
  Breathe out hard, all the way. The air in your lungs is part of what
  floats you, so with it gone you sink — the way a free diver gets down
  without fighting their own float. It costs you the air: what you were
  holding is spent, and under water there is no more to take.

  `inhale` is the other way: a deep breath fills you, buys you time
  under, and floats you higher. Out of the water, letting your breath
  out does nothing that matters.
 it
  back.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
