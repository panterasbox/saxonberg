verbs: [watch]
category: stream
# ⭐ `off` and `horizon` are this view's subcommands, one controller each;
# the stream forms are two more SHAPES of the verb, each its own view and
# controller (`watch-stream.yaml`, `watch-on.yaml`, controller-liquidity
# W7a), tried when the first word is neither subcommand. There is no bare
# form: `watch` alone names nothing to watch.
description: "Put a livestream's video in the focal embed, or keep a watch on the horizon"
help: |
  Put a livestream's video in the cockpit's focal embed. Name the
  streamer the same three ways as `tune`:

    - a URL:      `watch twitch.tv/shroud`, `watch youtu.be/<id>`,
                  `watch kick.com/xqc`
    - a handle:   `watch shroud --twitch`, `watch mkbhd --youtube`,
                  `watch xqc --kick`
    - a character: `watch alice` (their linked Twitch or Kick channel)

  There is one focal video — a second `watch` swaps it; `watch off`
  clears it.

  `watch horizon` keeps a WATCH instead: you hold your attention on
  what lies beyond your room, and are told what comes into view and
  what drops out of it — nothing else. From a masthead you see further.
  `watch off` (or `cancel`) stands you down. Nobody watching, nobody
  told: the horizon never calls out on its own.

  A SHARED screen — the booth TV — takes `watch <target> on <screen>`:
  whoever may drive it (the remote in hand, the house's seat, or anyone
  in reach, by the screen's pairing) puts the stream up for everyone
  who can see the screen; `watch off on <screen>` darkens it. Walk out
  of the room and the shared embed leaves with you. Watching also follows the stream's chat (Twitch this
  cycle) so the chat card fills in alongside the video.

  Most forms need no setup — a Twitch handle, a Kick slug, a YouTube
  URL / video id / channel id all resolve with no external call, so
  watching works even when the chat relay is unconfigured. A bare
  YouTube `@handle` needs the YouTube reader configured (give a URL /
  video id otherwise).
validators:
  - /lib/command/validators/requiresAnimate
options:
  twitch:
    type: boolean
    field: twitch
    description: "The target is a Twitch handle"
  youtube:
    type: boolean
    field: youtube
    description: "The target is a YouTube handle"
  kick:
    type: boolean
    field: kick
    description: "The target is a Kick channel slug"
subcommands:
  horizon:
    controller: /platform/idea/cmd/stream/WatchHorizonController
    description: "Keep a watch on the horizon — told what comes into view and what drops out of it"
  off:
    controller: /platform/idea/cmd/stream/WatchOffController
    description: "Clear the focal embed (or a shared screen: `watch off on <screen>`)"
    args:
      - name: on
        type: object
        required: false
        scope: "peers"
        prepositions: [on]
        requires: DisplayMixin
