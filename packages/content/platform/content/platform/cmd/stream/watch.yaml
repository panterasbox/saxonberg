verbs: [watch]
controller: /platform/idea/cmd/stream/WatchController
description: "Put a livestream's video in the focal embed (Twitch / YouTube / Kick)"
help: |
  Put a livestream's video in the cockpit's focal embed. Name the
  streamer the same three ways as `tune`:

    - a URL:      `watch twitch.tv/shroud`, `watch youtu.be/<id>`,
                  `watch kick.com/xqc`
    - a handle:   `watch shroud --twitch`, `watch mkbhd --youtube`,
                  `watch xqc --kick`
    - a character: `watch alice` (their linked Twitch or Kick channel)

  There is one focal video — a second `watch` swaps it; `watch off`
  clears it. Watching also follows the stream's chat (Twitch this
  cycle) so the chat card fills in alongside the video.

  Most forms need no setup — a Twitch handle, a Kick slug, a YouTube
  URL / video id / channel id all resolve with no external call, so
  watching works even when the chat relay is unconfigured. A bare
  YouTube `@handle` needs the YouTube reader configured (give a URL /
  video id otherwise).
validators:
  - /lib/command/validators/requiresAnimate
fallthrough: true
options:
  twitch:
    type: boolean
    field: twitch
    description: "The target is a Twitch handle"
  youtube:
    type: boolean
    field: youtube
    description: "The target is a YouTube handle"
  kick:
    type: boolean
    field: kick
    description: "The target is a Kick channel slug"
subcommands:
  off:
    description: "Clear the focal embed"
args:
  - name: target
    type: string
    required: true
