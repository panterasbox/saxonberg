# ⭐ `rodney` drives Rodney, the broadcast overlay (stream arrival D22):
# every subcommand moves Rodney's scenes or OBS, so the verb is named for
# what you are driving. The program it shows is `program`'s — a record any
# broadcaster has, with or without Rodney.
verbs: [rodney]
category: stream
controller: /platform/idea/cmd/stream/RodneyController
opens_card: stream
description: "Drive Rodney, your broadcast overlay: start, live, away for a reason, back, the agenda, the end"
help: |
  Drive Rodney — the overlay your broadcast presents. The stream is yours:
  it lives on your character, survives a server restart, and nothing
  anyone else does moves your overlay.

  Your stream runs a PROGRAM — `program run <name>` puts you in its chair,
  and Rodney shows that program's chat. Without one, `rodney` refuses.

  `rodney` on its own says where your stream is, which program it runs,
  and opens the controls card. A stream moves through five phases:
  offline, starting (the Starting Soon countdown), live (the desktop on
  air), standby (Away, for a reason) and ending (the outro, after which it
  goes offline by itself).

  While you are on air — starting, live or ending — your own client hides
  private messages, and anyone in the room with you can see a broadcast
  reaches them.

  It changes only your overlay, never anything in the world.

  You get this verb from the Broadcast app on a phone you carry (`apps
  install broadcast`), or at a broadcast desk.
examples:
  - cmd: rodney start in 10m
    note: Starting Soon, counting down ten minutes
  - cmd: rodney away bathroom
    note: Away for five minutes, with the reason on screen
  - cmd: rodney away 15m
    note: Away for fifteen minutes (the generic reason)
  - cmd: rodney pin agenda
    note: Hold the agenda panel in the lower third
validators:
  - /lib/command/validators/requiresProgram
fallthrough: true
# Bare `rodney` falls through here → the status line and the controls card.
args:
  - name: rest
    type: string
    required: false
subcommands:
  start:
    controller: /platform/idea/cmd/stream/RodneyStartController
    description: "Starting Soon, optionally counting down (`rodney start in 10m`)"
    help: |
      Put the overlay on the Starting Soon scene, with your agenda. Give a
      time to count down to — `rodney start in 10m`, or just
      `rodney start 10m` — or none for no countdown.
    args:
      - name: duration
        type: string
        required: false
        prepositions: [in]
  live:
    controller: /platform/idea/cmd/stream/RodneyLiveController
    description: "Put the desktop on air"
  away:
    controller: /platform/idea/cmd/stream/RodneyAwayController
    description: "Away for a reason (`rodney away food`, `rodney away privacy 20m`, `rodney away 15m`)"
    help: |
      Drop the overlay to the Away scene with a reason's words and a
      countdown. A reason has a default length (bathroom 5m, food 15m,
      water 3m); give a duration after it to override. A bare duration —
      `rodney away 15m` — is the generic reason.

      ⭐ `privacy` shows no countdown at all, and Away holds no desktop,
      camera or microphone. Off the air, your own screen shows everything
      again.
    args:
      - name: reason
        type: string
        required: true
      - name: duration
        type: string
        required: false
  back:
    controller: /platform/idea/cmd/stream/RodneyLiveController
    description: "Back from Away — the desktop returns to the air"
  end:
    controller: /platform/idea/cmd/stream/RodneyEndController
    description: "The outro; the stream goes offline when it finishes"
  "off":
    controller: /platform/idea/cmd/stream/RodneyOffController
    description: "Offline now"
  segment:
    controller: /platform/idea/cmd/stream/RodneySegmentController
    description: "Set the topic the sidebar shows (`rodney segment the glass trade`)"
    args:
      - name: title
        type: string
        required: true
        greedy: true
  agenda:
    controller: /platform/idea/cmd/stream/RodneyAgendaController
    description: "Set the agenda, items split by commas (`rodney agenda glass, paper, Q&A`), or `rodney agenda clear`"
    args:
      # ⚠ Greedy by design: the whole rest of the line is the list.
      - name: items
        type: string
        required: true
        greedy: true
  next:
    controller: /platform/idea/cmd/stream/RodneyNextController
    description: "Tick the current agenda item and move to the next"
  token:
    controller: /platform/idea/cmd/stream/RodneyTokenController
    description: "Issue (or rotate) your overlay token, shown once; `--control` for the Stream Deck's"
    help: |
      Issue a new token for your overlay's browser source and show it
      once. Issuing again rotates it: the old one stops working. With
      `--control`, issue the Stream Deck's control token instead — it can
      run `rodney …` as you and nothing else.
    options:
      control:
        type: boolean
        field: control
        description: "Issue the Stream Deck's control token instead"
  pin:
    controller: /platform/idea/cmd/stream/RodneyPinController
    description: "Hold one panel in the lower third (`rodney pin agenda`)"
    args:
      - name: panel
        type: string
        required: true
  skip:
    controller: /platform/idea/cmd/stream/RodneySkipController
    description: "Leave one panel out of the lower third's rotation (`rodney skip wiki`)"
    args:
      - name: panel
        type: string
        required: true
  unpin:
    controller: /platform/idea/cmd/stream/RodneyUnpinController
    description: "The lower third rotates as authored again"
