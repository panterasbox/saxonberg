verbs: [tune]
category: stream
# ⭐ One controller per subcommand (controllers-are-io D9); the verb-level
# controller is bare `tune`'s — the list. `tune <target>` and `tune <target>
# <message>` are two more SHAPES of the verb, each its own view and
# controller (`tune-follow.yaml`, `tune-post.yaml`, controller-liquidity
# W7a): a first word that is none of the subcommands below is handed to
# them.
controller: /platform/idea/cmd/stream/TuneListController
description: "Follow a livestream's chat (Twitch / YouTube / Kick) in your console; post (Twitch)"
help: |
  Follow a livestream's chat into your console and read it alongside the
  game. Name the streamer three ways:

    - a URL:      `tune twitch.tv/shroud`, `tune youtu.be/<id>`,
                  `tune kick.com/xqc`
    - a handle:   `tune shroud --twitch`, `tune mkbhd --youtube`,
                  `tune xqc --kick`
    - a character: `tune alice` (their linked Twitch or Kick chat)

  Follow as many as you like; they interleave in the chat card with a
  per-line platform tag. `tune off <target>` stops following one; bare
  `tune` lists what you're following.

  On Twitch you can also POST: `tune shroud --twitch hello` sends
  "hello" to that channel's chat as your own linked Twitch identity (and
  mirrors it here). Posting needs a linked Twitch account with chat
  authorized; you'll be pointed to the authorize flow the first time.
  YouTube and Kick chat are read-only this cycle.

  `watch <target>` is the sibling verb for the focal video embed (and it
  follows the chat too).
validators:
  - /lib/command/validators/requiresAnimate
options:
  twitch:
    type: boolean
    field: twitch
    description: "The target is a Twitch handle"
  youtube:
    type: boolean
    field: youtube
    description: "The target is a YouTube handle"
  kick:
    type: boolean
    field: kick
    description: "The target is a Kick channel slug"
subcommands:
  off:
    controller: /platform/idea/cmd/stream/TuneOffController
    description: "Stop following a channel's chat"
    args:
      - name: target
        type: string
        required: true
  list:
    controller: /platform/idea/cmd/stream/TuneListController
    description: "List channels you're following"
  who:
    controller: /platform/idea/cmd/stream/TuneWhoController
    description: "Who is following a channel"
    args:
      - name: target
        type: string
        required: true
  history:
    controller: /platform/idea/cmd/stream/TuneHistoryController
    description: "Recent messages on a followed channel"
    args:
      - name: target
        type: string
        required: true
