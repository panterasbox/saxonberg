verbs: [stream]
category: stream
controller: /platform/idea/cmd/stream/StreamController
opens_card: stream
description: "Run your stream: start, live, away for a reason, back, the agenda, the end"
help: |
  Run the show your broadcast overlay presents. The stream is yours — it
  lives on your character, survives a server restart, and nothing anyone
  else does moves your overlay.

  `stream` on its own says where your stream is and opens the controls
  card. A stream moves through five phases: offline, starting (the
  Starting Soon countdown), live (the desktop on air), standby (Away, for
  a reason) and ending (the outro, after which it goes offline by
  itself).

  While you are on air — starting, live or ending — your own client hides
  private messages, and anyone in the room with you can see a broadcast
  reaches them.

  This verb is restricted to streamers. It changes only your overlay,
  never anything in the world.
examples:
  - cmd: stream start in 10m
    note: Starting Soon, counting down ten minutes
  - cmd: stream away bathroom
    note: Away for five minutes, with the reason on screen
  - cmd: stream away 15m
    note: Away for fifteen minutes (the generic reason)
validators:
  - /lib/command/validators/requiresStreamer
fallthrough: true
# Bare `stream` falls through here → the status line and the controls card.
args:
  - name: rest
    type: string
    required: false
subcommands:
  start:
    controller: /platform/idea/cmd/stream/StreamStartController
    description: "Starting Soon, optionally counting down (`stream start in 10m`)"
    help: |
      Put the overlay on the Starting Soon scene, with your agenda. Give a
      time to count down to — `stream start in 10m`, or just
      `stream start 10m` — or none for no countdown.
    args:
      - name: duration
        type: string
        required: false
        prepositions: [in]
  live:
    controller: /platform/idea/cmd/stream/StreamLiveController
    description: "Put the desktop on air"
  away:
    controller: /platform/idea/cmd/stream/StreamAwayController
    description: "Away for a reason (`stream away food`, `stream away privacy 20m`, `stream away 15m`)"
    help: |
      Drop the overlay to the Away scene with a reason's words and a
      countdown. A reason has a default length (bathroom 5m, food 15m,
      water 3m); give a duration after it to override. A bare duration —
      `stream away 15m` — is the generic reason.

      ⭐ `privacy` shows no countdown at all, and Away holds no desktop,
      camera or microphone. Off the air, your own screen shows everything
      again.
    args:
      - name: reason
        type: string
        required: true
      - name: duration
        type: string
        required: false
  back:
    controller: /platform/idea/cmd/stream/StreamLiveController
    description: "Back from Away — the desktop returns to the air"
  end:
    controller: /platform/idea/cmd/stream/StreamEndController
    description: "The outro; the stream goes offline when it finishes"
  "off":
    controller: /platform/idea/cmd/stream/StreamOffController
    description: "Offline now"
  segment:
    controller: /platform/idea/cmd/stream/StreamSegmentController
    description: "Set the topic the sidebar shows (`stream segment the glass trade`)"
    args:
      - name: title
        type: string
        required: true
        greedy: true
  agenda:
    controller: /platform/idea/cmd/stream/StreamAgendaController
    description: "Set the agenda, items split by commas (`stream agenda glass, paper, Q&A`), or `stream agenda clear`"
    args:
      # ⚠ Greedy by design: the whole rest of the line is the list.
      - name: items
        type: string
        required: true
        greedy: true
  next:
    controller: /platform/idea/cmd/stream/StreamNextController
    description: "Tick the current agenda item and move to the next"
  rotation:
    description: "Steer the lower third: `stream rotation pin <panel>`, `skip <panel>`, `clear`"
    subcommands:
      pin:
        controller: /platform/idea/cmd/stream/StreamRotationPinController
        description: "Hold one panel in the lower third"
        args:
          - name: panel
            type: string
            required: true
      skip:
        controller: /platform/idea/cmd/stream/StreamRotationSkipController
        description: "Leave one panel out of the rotation"
        args:
          - name: panel
            type: string
            required: true
      clear:
        controller: /platform/idea/cmd/stream/StreamRotationClearController
        description: "The rotation as authored again"
  channel:
    controller: /platform/idea/cmd/stream/StreamChannelController
    description: "Name your chat channel on a service (`stream channel twitch mylogin`)"
    help: |
      Tell the overlay which chat to show: your channel on twitch, youtube
      or kick. Give no handle to clear one.
    args:
      - name: service
        type: string
        required: true
        values: [twitch, youtube, kick]
      - name: handle
        type: string
        required: false
  token:
    controller: /platform/idea/cmd/stream/StreamTokenController
    description: "Issue (or rotate) your overlay token, shown once; `--control` for the Stream Deck's"
    help: |
      Issue a new token for your overlay's browser source and show it
      once. Issuing again rotates it: the old one stops working. With
      `--control`, issue the Stream Deck's control token instead — it can
      run `stream …` as you and nothing else.
    options:
      control:
        type: boolean
        field: control
        description: "Issue the Stream Deck's control token instead"
