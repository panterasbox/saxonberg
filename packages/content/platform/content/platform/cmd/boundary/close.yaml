verbs: [close]
category: boundary
controller: /platform/idea/cmd/boundary/CloseController
description: "Close a door (by direction or by name)"
help: |
  Close anything that can be sealed — a door blocking an exit, a
  chest, a cabinet. Name a direction to close the door on that exit
  (`close south`), or name the thing directly (`close "oak door"`,
  `close chest`).

  The target has to be within reach. If it's already closed, or it
  isn't something that closes at all, the game tells you so and
  nothing happens.

  A pouch, a satchel, a pack, a chest — and a pocket that buttons
  (`open "breast pocket"`). What is shut keeps its contents from sight
  and from hands, and dry; nothing opens itself. In a fight, opening or
  shutting a thing on you is a beat with your guard down.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresEmbodied
args:
  - name: target
    type: object
    required: true
    scope: "reachable"
    updates_focus: extend
    # ⭐ …and a chamber that buttons (`open "breast pocket"` — size and
    # carrying D-W10-12): the binder's `via.region` names it on its host.
    requires: SealableMixin|PlacingMixin
    validators:
      - /lib/command/validators/canReach
