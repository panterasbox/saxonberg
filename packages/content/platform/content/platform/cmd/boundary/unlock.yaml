# ⭐⭐ `unlock` — afforded by `MobileMixin.self`, beside `open`/`close`.
#
# ⚠⚠ Held unafforded by the reachability sweep, and reconciled by the
# lock build — see `lock.yaml`'s header for the two half-models and why
# wiring either one would have shipped a verb that lies.
#
# ⭐ What this verb is FOR, now that it exists: a key-holder already
# walks through a locked door (`Exit.canTraverse` admits whoever
# `opensFor`), so unlocking is never something you do to get in
# yourself — it is how you leave a door open for everyone ELSE. The old
# keyed-exit model had no way to express that at all.
verbs: [unlock]
controller: /platform/idea/cmd/boundary/UnlockController
description: "Unlock a door (by direction or by name)"
help: |
  Unlock anything that can be locked — a door blocking an exit. Name a
  direction to unlock the door on that exit (`unlock north`), or name
  the thing directly (`unlock oak door`).

  The target has to be within reach. If it's already unlocked, or it
  isn't something that locks at all, the game tells you so and nothing
  happens.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresEmbodied
args:
  - name: target
    type: object
    required: true
    scope: "reachable"
    updates_focus: extend
    requires: LockableMixin
    validators:
      - /lib/command/validators/canReach
