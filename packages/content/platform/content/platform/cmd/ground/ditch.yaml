verbs: [ditch]
category: ground
controller: /platform/idea/cmd/ground/DitchController
description: "Cut a drain along the fall of the ground"
help: |
  Open a line along the fall of the ground and throw the spoil to the high
  side, so the water has somewhere to go.

  ⭐ You are not changing the soil — you cannot; the texture of ground is
  the earth it is made of. You are changing where the water goes, which
  is a different job with a different answer.

  ⚠ Heavy wet ground is far dearer to drain than light wet ground,
  because the two things that make ground hard to drain compound. Ground
  that sheds its own water wants no ditch at all, and says so.

  Needs a spade.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  # ⭐ WHICH TOOL, declared rather than hunted for. The default asks
  # `[capability.digging]` — *the thing that can do this job* — rather than
  # `[mixin.ToolMixin]`, which would resolve any tool at all and then
  # fail this verb's own check. That atom is what let this stop being a
  # walk (see `lint:controller-resolution`).
  - name: tool
    type: object
    required: false
    prepositions: [with, using]
    # ⚠ `person` — what you CARRY, used where it sits: held, worn, or in
    # an open pocket or pouch on you (the binder narrows the default by
    # `canReach`; a tool only behind a shut flap or packed on your back is
    # refused, naming `open …` / `remove …`). A tool on the ground is picked
    # up first. (`reachable` for a day widened every hand tool to the room.
    # Naming one still reaches it.)
    default: "~person:[capability.digging]"
    scope: ["~reachable"]
    requires: [ToolMixin]
    validators:
      - /lib/command/validators/canReach
  - name: detail
    type: string
    required: false
