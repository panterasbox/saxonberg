verbs: [give]
category: inventory
controller: /platform/idea/cmd/inventory/GiveController
description: "Give an item from your inventory to another actor"
help: |
  Hand something you're carrying to someone else in the room. Name
  the item, then `to` and whoever should receive it. The item leaves
  your inventory and lands in theirs.

  Both you and the recipient have to be here together, and the
  recipient has to be an actor who can hold things — you can't give
  to scenery.

  What you hand someone goes where THEIR body puts it — a free hand, a
  pocket, a hook on their belt or saddle, a bag they carry; with nowhere
  for it, they set it down at their feet, and everyone sees them do it.
  Nothing is lost. A creature that carries nothing at all (a fish)
  refuses, and you keep it exactly where it was. Tack goes on with
  `put saddle on mule` — handed, a mule just sets it down.
examples:
  - cmd: give coin to the merchant
    note: Hand over a single item
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: item
    type: object
    required: true
    scope: "inventory"
    requires: ContainableMixin
    validators:
      - /lib/command/validators/mustBeInInventory
  - name: recipient
    type: object
    required: true
    scope: "peers"
    prepositions: [to]
    requires: [VisibleMixin, class:Agent]
