# ⭐ Write on a thing (underwater review) — the world's verb for putting
# words on something: a diver's slate, a sheet of paper, a board on a wall.
# Afforded by everything that bears marks (`MarkedMixin`); the surface
# decides whether it takes writing and how the words read (ink needs light
# and runs when wet; a scratch does not). ⛔ Nothing written is private: a
# note to yourself is writing on a thing of your own. (`write` was the
# shell's authoring verb until this review; that is `edit` now.)
verbs: [write]
category: inventory
controller: /platform/idea/cmd/inventory/WriteOnController
description: "Write some words on a thing"
help: |
  `write <words> on <thing>` puts your words on something that takes
  writing — a slate, a sheet of paper, a board — after whatever is there
  already. Anyone who can `read` it reads it: there is no writing only
  you can see. A note to yourself is writing on something of your own.

  What it is written on decides how it lasts and how it is read. Ink
  needs light to read and runs when it gets soaked; a scratch on a slate
  can be felt in the dark and survives the water. Something you carry,
  you write on in your hands; a board on a wall, where it hangs.

  ⭐ `write <words> on <board> with <pot>` letters the words in PAINT: they
  go on as a coat, in the paint's color, readable by anyone, in any
  weather — until the weather takes the coat, and the words with it.

  ⭐ Paper takes INK: hold an ink pot or a charged pen (`with <pen>` names
  one). Unsized paper drinks the ink and the line bleeds — size it first.
  In a book, name the page: `write <words> on <book> page <n>`. A book you
  borrowed you can read, not write in.
examples:
  - cmd: write meet at the anchor on slate
    note: A diver's slate, under the water where nobody can hear you
  - cmd: write ROPEWALK on board with pot
    note: Letter a sign board in paint
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: words
    type: string
    required: true
    greedy: true
  # ⚠ greedy: `on the slate` / `on the harbor board` are more than one
  # token (lint:reachability arm G — an article shape).
  - name: surface
    type: object
    required: true
    prepositions: [on, onto, in]
    scope: ["inventory", "reachable"]
    requires: [MarkedMixin]
  # ⭐ A page of a book: `write … on notebook page 3`. Its
  # preposition stops the greedy surface's lookahead, as `with` does.
  - name: page
    prepositionRequired: true
    type: number
    required: false
    prepositions: [page]
  # ⭐ Paint as the medium (paint build D10): optional; its preposition
  # stops the greedy surface's lookahead (`on board with pot`).
  - name: medium
    prepositionRequired: true
    type: object
    required: false
    prepositions: [with, using]
    scope: ["inventory", "reachable"]
    requires: [BulkableMixin]
