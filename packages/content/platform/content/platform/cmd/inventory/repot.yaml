verbs: [repot, transplant]
controller: /platform/idea/cmd/inventory/RepotController
description: "Move a growing plant into another pot"
help: |
  Shift a plant out of the pot it is in and into another one. The
  destination needs soil in it and an empty planting slot, and it has to
  be big enough for the plant as it stands — a grown plant will not go
  into a small pot, and it will tell you so.

  A plant that has outgrown its pot stops getting bigger and looks rough
  about it. Repotting is the fix, and nothing is lost in the move: it
  keeps its size, its condition and its water. `transplant` is an alias.
examples:
  - cmd: repot the lily into the large pot
    note: Give a root-bound plant more room
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresEmbodied
args:
  - name: plant
    type: object
    required: true
    scope: "reachable"
    requires: [VisibleMixin, GrowingMixin, SlottableMixin, ContainableMixin]
  - name: pot
    type: object
    required: true
    scope: "reachable"
    prepositions: [in, into, to]
    requires: [VisibleMixin, CultivableMixin]
