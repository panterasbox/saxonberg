verbs: [inventory, inv, i]
controller: /platform/idea/cmd/inventory/InventoryController
description: "List what you — or a person, or an open container — hold"
help: |
  Take stock of what something holds — a complete, itemised list.

  With no target, it is you: what you are WEARING, what you are
  HOLDING, and what you are CARRYING. Name a person and you see what
  they wear and hold (never what is in their pockets); name an open
  container and you see everything in it. A shut one is shut.

  `look` tells you what a thing is like, and mentions what you would
  notice there; `inventory` is the full list. `look in <thing>` is the
  same as `inventory <thing>`. Short on typing? `inv` and plain `i`.
examples:
  - cmd: inventory
    note: What you wear, hold and carry
  - cmd: i crate
    note: Everything in the open crate
validators:
  - /lib/command/validators/requiresAnimate
args:
  # The thing whose holdings to list; none is yourself. ⭐ Optional with
  # no default, so a bare `inventory` binds nothing and means you.
  - name: target
    type: object
    required: false
    greedy: true
    scope: ["$focus", "reachable"]
    requires: any
