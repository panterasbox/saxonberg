verbs: [plant, sow]
controller: /platform/idea/cmd/inventory/PlantController
description: "Plant a seed in a pot of soil"
help: |
  Put a seed into a pot and it starts growing. The pot has to have soil
  in it first — pour a sack of potting soil into the pot with `pour`,
  then `plant` the seed. One plant to a pot.

  From then on it lives on its own clock: it drinks, it wants light, and
  its roots want room. `look` at it to see how it's doing, and `water`
  it when the soil goes dry. `sow` is an alias for the same verb.
examples:
  - cmd: plant the seed in the small pot
    note: Start a plant growing
  - cmd: sow lily seed into pot
    note: Same thing, either preposition
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresEmbodied
args:
  - name: seed
    type: object
    required: true
    scope: "reachable"
    requires: [VisibleMixin, PlantableMixin]
  - name: pot
    type: object
    required: true
    scope: "reachable"
    prepositions: [in, into]
    requires: [VisibleMixin, CultivableMixin]
