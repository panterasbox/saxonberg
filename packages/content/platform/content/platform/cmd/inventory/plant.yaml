verbs: [plant, sow]
controller: /platform/idea/cmd/inventory/PlantController
description: "Plant a seed in a pot of soil, or sow a field"
help: |
  Put a seed into a pot and it starts growing. The pot has to have soil
  in it first — pour a sack of potting soil into the pot with `pour`,
  then `plant` the seed. One plant to a pot.

  From then on it lives on its own clock: it drinks, it wants light, and
  its roots want room. `look` at it to see how it's doing, and `water`
  it when the soil goes dry. `sow` is an alias for the same verb.

  On a FIELD you broadcast instead: stand in it and `sow wheat`. Each
  cast covers a stretch of ground and spends the seed in proportion, so
  a sack that would sow a third of the field sows a third of it, and you
  sow again until the seed or the ground runs out. The field must be
  ploughed for the season first, and it must be yours to sow — or you
  must be on shift for whoever works it.

  On a field divided into patches, say which: `sow wheat at the gate end`
  fills that patch, cast by cast, until it is sown edge to edge.
examples:
  - cmd: plant the seed in the small pot
    note: Start a plant growing
  - cmd: sow lily seed into pot
    note: Same thing, either preposition
  - cmd: sow wheat
    note: Broadcast seed over the field you are standing in
  - cmd: sow wheat at the gate end
    note: On a field divided into patches, name the patch
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresEmbodied
args:
  - name: seed
    type: object
    required: true
    scope: "reachable"
    requires: [VisibleMixin, PlantableMixin]
  # ⭐ WHICH PART — `at <patch>` on a divided field (field population D5).
  # Optional: on one-piece ground there is nothing to name, and on a
  # divided field the GROUND refuses the act without it, listing its parts.
  # Greedy so `at the top end` binds whole (an article would otherwise eat
  # a positional); every arg after it is prepositional, so it stops there.
  - name: patch
    type: object
    required: false
    greedy: true
    scope: ["reachable"]
    prepositions: [at]
    requires: SoilMixin
  # Optional: with none named, the seed is broadcast over the ground you
  # stand on (cover build D4). A required arg with no default fails
  # closed and silent, so `required: false` is the whole of that wiring.
  - name: pot
    type: object
    required: false
    scope: "reachable"
    prepositions: [in, into, on, over]
    requires: [VisibleMixin, CultivableMixin|SoilMixin]
