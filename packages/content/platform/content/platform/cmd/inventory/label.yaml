verbs: [label]
controller: /platform/idea/cmd/inventory/LabelController
description: "Write your own name on something"
help: |
  Put your own name on a thing, and it answers to that name from
  then on — to you and to anyone else who looks at it.

  This is the fix for a real problem. What an unidentified thing
  looks like is derived, and the descriptors rotate: a flask you
  *know* is a healing draught will one day come back looking like
  something else entirely. Your label does not rotate. A careful
  stash survives a turnover with your own names intact.

  It is a general annotation, not a potions feature — it serves
  storage, shops, and gifts just as well. `label crate winter
  seed`, `label vial DO NOT DRINK`, `label ring for Mira`.

  ⭐ A label on clothing is a LAUNDRY MARK — `label shirt Hal Bryce` —
  and it says whose a garment is wherever it ends up: at the laundress,
  in a lost-property heap, or on a body nobody can name.

  A labelled item stops stacking with its unlabelled twins. That is
  deliberate: you wrote something on that one on purpose, and
  folding it silently into a pile would throw the note away.

  `label <thing>` with no text clears it.

  ⭐ In a field, `label wheat trial at the gate end` ties your label to
  ONE plant in the stand there and leaves it standing — with no text,
  your own name goes on it. From then on it is a plant of its own: it
  answers to the label (`look trial`, `water trial`), and water or feed
  aimed at it goes into the soil round its roots alone. That pocket of
  ground runs back toward the field around it within a couple of days,
  so a plant you tend daily outgrows its neighbors, and one you forget
  falls back to them.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  # Writing on a thing is a physical act — a shade has no hand to do it
  # with. (The shipped `embodied-tagging` test enforces this for every
  # verb that acts on matter, and caught this one.)
  - /lib/command/validators/requiresEmbodied
args:
  - name: target
    type: object
    required: true
    scope: "reachable"
    requires: LabelledMixin
  - name: text
    type: string
    required: false
    greedy: true
  # ⭐ WHICH PART — `at <patch>` on a divided field (field population D6).
  # Optional and greedy; it bounds the greedy `text` before it.
  - name: patch
    type: object
    required: false
    greedy: true
    scope: ["reachable"]
    prepositions: [at]
    requires: SoilMixin
