verbs: [get, take]
controller: /platform/idea/cmd/inventory/GetController
description: "Pick up objects from your location"
help: |
  Pick something up off the ground or out of the room and move it
  into your inventory. You can only get things that are here with
  you — to take something out of a container or off a surface, name
  it and `get` reaches in. Say where from (`get crock from kiln`) and
  only what is in or on that is taken.

  Name several things at once to grab them in one go. You can't get
  what you're already carrying.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: targets
    type: objects
    required: true
    greedy: true
    scope: "peers"
    requires: [VisibleMixin, ContainableMixin]
    validators:
      - /lib/command/validators/mustBeInLocation
  # ⭐ Where from — `get crock from kiln`. Without it, "from kiln" was
  # two more words for the targets to match, and every such `get` also
  # tried to lift the kiln (the ceramics drives: "an updraft kiln is
  # fixed in place", and `get "plant pot" from kiln` took the potter's
  # stamp and strained at the potter). The targets stop at `from`.
  # Greedy, as the last arg: `from the brick kiln` is one name.
  - name: source
    type: object
    required: false
    greedy: true
    prepositions: [from]
    scope: "peers"
    requires: [VisibleMixin, ContainerMixin|PlacingMixin]
