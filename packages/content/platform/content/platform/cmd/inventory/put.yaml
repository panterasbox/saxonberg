verbs: [put]
category: inventory
controller: /platform/idea/cmd/inventory/PutController
description: "Place an item from your inventory in or on a target"
help: |
  Stow something you're carrying into a container or rest it on a
  surface. Name the item, then `in` to drop it inside a box, bag, or
  chest, or `on` to set it atop a table, shelf, or other surface.

  The target has to be here with you and has to actually accept the
  item — you can't put a thing inside something that isn't a
  container.

  `put <tack> on <animal>` — a pack saddle, a halter, panniers — puts it
  on a beast that cannot dress itself; a person dresses themself (`wear`).

  A thing with several pockets or chambers: when they are alike (two
  side pockets) it puts yours in the first that takes it and tells you
  which; when they differ — one buttons, one is inside under your coat —
  you are asked which, and the ask says how they differ. `look coat`
  shows its pockets and what differs; name one to choose — `put key in
  "inner pocket"`. A shut pocket or pouch is shut: `open` it first.

  What you name is searched on you first, then the room (`scope:
  reachable`). In a fight, putting a thing away costs a beat by where it
  goes — a holster or scabbard is quick, a pocket slower (`help fight
  switch`).
examples:
  - cmd: put coin in the pouch
    note: Tuck an item into a container
  - cmd: put the vase on the table
    note: Rest an item on a surface
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: item
    type: object
    required: true
    # ⭐ Greedy, as `get`/`drop`'s are: a count and a noun (`put 1 clay in
    # tub`) bind together, split at the preposition — without it that line
    # matched no shape of `put` at all (the ceramics drive).
    scope: "~inventory"
    requires: ContainableMixin
    validators:
      - /lib/command/validators/mustBeInInventory
  - name: target
    prepositionRequired: true
    type: object
    required: true
    # ⭐ The nearest thing you perceive (size and carrying D17): your own
    # coat, belt and pack before anything in the room. On `peers` alone,
    # `put key in coat` put the key in the lounge's coat-check rack and
    # `put sword in scabbard` in a scabbard lying on the floor (the drive).
    # ⭐ Then what STANDS in the room, before the room itself: on
    # `reachable` alone the place came first (its surface precedes what
    # stands there), so `put boot-mould in oven` matched the works floor's
    # own `oven` detail and set the mould on the floor (finalize run 16, the
    # rubber drive). `reachable` last still names the place, a door, a way.
    scope: ["~person", "~peers", "~reachable"]
    # ⭐ One word per placement member this verb accepts, plus region
    # zero's. `pnpm -C packages/server lint:placement-words --list` is
    # what tells an author which verbs need a new member's word — a verb
    # that should accept one and silently does not refuses every target
    # at the binder, with nothing logged.
    prepositions: [in, into, on, onto, from]
    requires: [VisibleMixin, ContainerMixin|PlacingMixin]
