# ⭐ Haul on a line (underwater D19) — ONE verb over the `Haulable`
# protocol: a fisher's set pot out of the water, a diver up the column on
# their lifeline, a diving bell down a band on its hoist. The THING
# decides what hauling it means and says why not in its own words. The
# fishing trade's own `haul` view retired into this one (the ladder's
# first rung: unify behind an interface).
verbs: [haul]
controller: /platform/idea/cmd/inventory/HaulController
description: "Haul on a line — a pot out of the water, a diver up, a bell down"
help: |
  `haul pot` brings a set pot or net out of the water with whatever the
  water put in it. `haul line` brings up whoever is on the other end of a
  lifeline — a diver, conscious or not — a band at a time. `haul bell
  down` lowers a diving bell on its hoist; `haul bell up` raises it.

  With nothing named, `haul` takes up the one thing beside you that can
  be hauled. (`lift` is what you do to a bar.)
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  # ⭐ `requires: any` — a pot, a line and a hoist share no mixin; the
  # controller narrows by SHAPE (the `Haulable` protocol).
  - name: target
    type: object
    required: false
    scope: ["reachable"]
    requires: any
  - name: sense
    type: string
    required: false
