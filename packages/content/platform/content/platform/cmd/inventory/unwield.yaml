# The precise act: put ONE held thing up. `unequip` strips the lot.
verbs: [unwield]
category: inventory
controller: /platform/idea/cmd/inventory/UnwieldController
description: "Stop wielding a held item"
help: |
  Put up something you are holding. It goes off your hands by the one
  rule, skipping the hand: a pocket of what you wear, a hook on your
  belt, a pouch or bag you wear, the pack on your back — the first that
  takes it — and you are told where. Nothing takes it → you are told,
  and it stays in your hand: `drop` it, or `put` it somewhere by name.
  In a fight it costs a beat (a reach).

  ⚠ A cursed thing will not let your hand open.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresSlotted
  - /lib/command/validators/requiresEmbodied
args:
  - name: target
    type: object
    required: true
    scope: "inventory"
    requires: WieldableMixin
    validators:
      - /lib/command/validators/mustBeInInventory
