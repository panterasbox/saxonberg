# ⭐ A signal up the line (underwater C1; kernel since cordage D8): one
# tug, all is well; two, haul me up; three, give me more line. Felt by
# whoever holds the other end, through any water, and by nobody else.
verbs: [tug]
controller: /platform/idea/cmd/inventory/TugController
description: "Signal up your line — one tug, two, or three"
help: |
  On the end of a line, `tug line` sends a signal up it to whoever holds
  the other end. The old code: one tug, all is well; two tugs in a row,
  haul me up; three, give me more line. Under the water nobody can hear
  you — the line is how you talk.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  # The END of the line, in your hands — `tug line`.
  - name: line
    type: object
    required: true
    scope: "inventory"
    requires: any
