verbs: [pay]
controller: /platform/idea/cmd/banking/PayController
description: "Pay someone — by cash or from your account"
help: |
  Pay someone by name — `pay bob 25`. By default it clears from your
  payment implant's active account; add `--cash` to hand over coin, or
  `--from <corpo>` to route this one payment from a different account of
  yours without changing your default.

  ⭐ At something that keeps your bills — a harbor office's book — say
  just `pay office`: you pay what it says you owe, each bill to whoever it
  is owed to, and you are told what was paid and what was not. You never
  name the sum there; the book does.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: recipient
    type: object
    required: true
    scope: ["reachable", "online"]
    requires: any
  # ⚠ OPTIONAL since harbors A2: absent is meaningful only at a recipient
  # that keeps your bills (`Payable`); anywhere else the controller asks
  # how much.
  - name: amount
    type: string
    required: false
options:
  cash:
    short: c
    type: boolean
    description: "Pay in physical coin (off-ledger) instead of by credential."
  from:
    short: f
    type: string
    description: "Route from your account at the named corpo/bank (one-off)."
