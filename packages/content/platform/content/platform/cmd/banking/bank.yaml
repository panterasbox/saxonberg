verbs: [bank]
category: banking
controller: /platform/idea/cmd/banking/BankBalanceController
description: "Bank here — balance / statement / open / deposit / withdraw / transfer"
help: |
  Do your banking at the branch you're standing in. Bare `bank` shows your
  balance. `bank statement [count]` lists your recent transactions here with
  a running balance. `bank open` opens an account (recording the branch's
  corpo affiliation); `bank deposit <coins>` and `bank withdraw <amount>`
  move cash across the counter; `bank transfer <amount> to <who>` pays
  another account by name. No account number is ever needed.

  A chartered bank LENDS, at its own posted rate. `bank borrow <amount>`
  asks for inventory finance for the house you keep — secured by the
  goods on your counter, funded at the reserve's window, repaid as a share
  of every inflow to the house's account until it clears, with no due
  date; `bank borrow <amount> --for wages` asks for working capital,
  unsecured, from the bank's own money. Every gate is a number of ledger
  events, and a refusal says which number was not met. `bank book` reads
  the paper: what you owe here, and — for the bank's own people — what
  the bank holds.
  ⭐ A shade banks by READING. `bank`, `bank balance`, `bank statement`
  and `bank book` stay open to the dead — death costs embodied agency,
  never a seat as a person. `deposit`, `withdraw` and `transfer` are
  tagged `requiresEmbodied`: cash across a counter needs hands, and
  "a ghost cannot spend" is the owner's call (2026-10-01). `borrow` is
  deliberately NOT tagged pending its own lens pass — taking on debt is
  not spending, and whether a ghost may is a design question.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
subcommands:
  open:
    controller: /platform/idea/cmd/banking/BankOpenController
    description: "Open an account at this branch"
  balance:
    controller: /platform/idea/cmd/banking/BankBalanceController
    description: "Show your balance here (same as bare `bank`)"
  statement:
    controller: /platform/idea/cmd/banking/BankStatementController
    description: "List your recent transactions here (running balance)"
    args:
      - name: count
        type: string
        required: false
  deposit:
    controller: /platform/idea/cmd/banking/BankDepositController
    description: "Deposit a coin stack into your account"
    validators:
      - /lib/command/validators/requiresEmbodied
    args:
      - name: coins
        type: object
        required: true
        scope: "inventory"
        requires: StackableMixin
  withdraw:
    controller: /platform/idea/cmd/banking/BankWithdrawController
    description: "Withdraw cash from your account (till-bounded)"
    validators:
      - /lib/command/validators/requiresEmbodied
    args:
      - name: amount
        type: string
        required: true
  borrow:
    controller: /platform/idea/cmd/banking/BankBorrowController
    description: "Borrow for the house you keep — inventory finance, or working capital with --for wages"
    args:
      - name: amount
        type: string
        required: true
    options:
      for:
        short: f
        type: string
        description: "What the loan is for: stock (inventory finance, the default) or wages (working capital)."
  book:
    controller: /platform/idea/cmd/banking/BankBookController
    description: "The paper: loans you owe here; what the bank holds, for its own people"
  transfer:
    controller: /platform/idea/cmd/banking/BankTransferController
    description: "Transfer money to someone by name"
    validators:
      - /lib/command/validators/requiresEmbodied
    args:
      - name: amount
        type: string
        required: true
      - name: recipient
        type: object
        required: true
        prepositions: [to]
        scope: ["reachable", "online"]
        requires: any
