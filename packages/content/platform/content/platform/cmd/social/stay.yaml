verbs: [stay]
controller: /platform/idea/cmd/social/StayController
description: "Tell an animal to hold where it is"
help: |
  `stay <animal>` tells it to hold position. It will not follow you out
  of the room and will not wander off home. Call it, or greet it, and it
  is released.

  ⚠ It may simply not do it. Every asked act runs through how biddable
  the species is and how well this animal knows you — and a cat's
  biddability is very low, so a cat will not hold however devoted it is.
  *The word is for the dog; the door is for the cat.* If you need a cat
  to stay somewhere, the honest tool is a closed door.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: target
    type: object
    required: true
    scope: ["reachable"]
    requires: BondedMixin
