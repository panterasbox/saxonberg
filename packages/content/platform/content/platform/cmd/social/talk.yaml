verbs: [talk]
category: social
controller: /platform/idea/cmd/social/TalkController
description: "Approach someone and strike up a conversation"
help: |
  Engage a conversational character. You approach and they speak
  first; you choose your replies from the options offered. The whole
  room overhears both halves of the exchange — but only you see your
  reply choices.

  Not everyone has something to say. Idle scenery folk will brush you
  off. Look someone over (`look`) for a hint that they're ready to
  talk.
examples:
  - cmd: talk to the barkeep
    note: Begin a conversation with the barkeep
validators:
  - /lib/command/validators/requiresAnimate
args:
  - name: target
    type: object
    required: true
    scope: ["$focus", "reachable"]
    prepositions: [to]
    onExcess: prompt
    requires: BehavedMixin
