verbs: [call]
controller: /platform/idea/cmd/social/CallController
description: "Call an animal to you"
help: |
  `call <animal>` asks it to come over. Being called releases a `stay`.

  ⚠ You can only call an animal you can see. Calling through a wall is
  not a thing this verb does — if it has wandered off, it is off, and
  finding it is the point.

  ⚠ An animal that is *attending to something* — a dog watching the
  stock — says so and does not come. That is not disobedience, and it is
  the one refusal that tells you why.

  Everything else is the same answer: it looks at you. It may not know
  you well enough, or it may not be the kind of animal that comes when
  called. You are not told which.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: target
    type: object
    required: true
    scope: ["reachable"]
    requires: BondedMixin
