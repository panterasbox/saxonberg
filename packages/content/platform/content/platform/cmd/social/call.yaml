verbs: [call]
controller: /platform/idea/cmd/social/CallController
description: "Call an animal — a noise, not a command aimed at something"
help: |
  `call` calls out. `call <name>` calls for one animal by name, or by a
  word it answers to.

  ⭐ It is a **sound**. It carries out of the room you are standing in
  and into the ones next to it, fainter, the way a shout does — and
  whatever hears it decides for itself. You are not reaching out and
  picking an animal; you are making a noise, and the dog that can hear
  you comes.

  So it works through an open door and fails through a shut one, and
  calling with no name reaches every animal in earshot that knows you,
  because that is what shouting in a yard does.

  ⚠ An animal that is *attending to something* — a dog watching the
  stock — says so and does not come. That is not disobedience, and it is
  the one refusal that tells you why.

  Everything else is the same answer: it looks at you. It may not know
  you well enough, or it may not be the kind of animal that comes when
  called. You are not told which.

  Compare `stay`, which is a hand signal: that one needs to be *seen*,
  not heard.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: animalName
    type: string
    required: false
