verbs: [score, me]
controller: /platform/idea/cmd/social/ProfileController
description: "Your own identity card and standing."
help: |
  `score` (or `me`) shows your own identity card in full — your name,
  species, origin, aspiration, and story — plus a digest of where you
  stand: your influence (play / make), renown, and most pronounced traits.

  It's the same card others get when they `profile` you, but unredacted
  and with the standing digest. For the detail behind each line, see
  `standing`, `traits`, `competence`, and `chronicle`.
validators:
  - /lib/command/validators/requiresAnimate
