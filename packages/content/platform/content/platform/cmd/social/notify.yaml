verbs: [notify]
category: social
# ⭐ One controller per subcommand (controller-liquidity W7b); the
# verb-level controller is bare `notify`'s — the list. Each act is a word:
# `show`, `set`, `move`, `remove`; the setting flags belong to `set` and the
# reorder flags to `move`.
controller: /platform/idea/cmd/social/NotifyListController
description: "Manage your attention rules — how a group's connect / disconnect / message surfaces, and how they render in a room (keyed on any group ref, ordered by precedence)"
help: |
  Decide whose comings, goings, and messages reach you, and how the
  people in a group render when you look at a room. A rule is keyed on
  any group — a contacts label (`friends`), a managed group
  (`managed:fighter-guild`), or an MQL query — and your rules are an
  ordered list: when someone matches several, the FIRST rule down the
  list wins. Order is precedence, so placing a rule higher makes it
  authoritative.

  Bare `notify` lists your rules. `notify show <ref>` shows one.
  `notify set <ref> --login show …` sets fields. `notify move <ref>
  --above <other>` (or `--below`) reorders. `notify remove <ref>` drops a
  rule (the group falls back to the sensible default tail). Reserved
  labels — `friends`, `foes`, `everyone-else`, `strangers` — ship
  sensible defaults you can edit.

  Field options for `set`: `--login` / `--disconnect` (show|silent — a
  presence frame in your buffer, or nothing), `--message`
  (full|summary|silent), `--render` (name|feature-string|count-only|hidden),
  `--boost` / `--no-boost`, `--color` (a theme palette token, e.g. amber).

  `--login` covers arrivals (a character entering the game or reconnecting
  after a drop); `--disconnect` covers departures (logging out or going
  linkdead). The frame names the specific event; this just decides whether
  it reaches you.
examples:
  - cmd: notify
    note: List your rules, top = highest precedence
  - cmd: notify set friends --login show --message full
    note: Hear your friends arrive, and see their messages in full
  - cmd: notify move managed:fighter-guild --above friends
    note: Make a rule outrank another
validators:
  - /lib/command/validators/requiresAnimate
subcommands:
  show:
    controller: /platform/idea/cmd/social/NotifyShowController
    description: "Show one rule"
    args:
      - name: ref
        type: string
        required: true
  set:
    controller: /platform/idea/cmd/social/NotifySetController
    description: "Set fields on a rule (creating it if you have none for that group)"
    args:
      - name: ref
        type: string
        required: true
    options:
      login:
        type: string
        description: "Arrivals (login / reconnect): show | silent"
      disconnect:
        type: string
        description: "Departures (logout / disconnect): show | silent"
      message:
        type: string
        description: "How a matched message restyles: full | summary | silent"
      render:
        type: string
        description: "How members render in a room: name | feature-string | count-only | hidden"
      color:
        type: string
        description: "Highlight color — a theme palette token (e.g. amber)"
      boost:
        type: boolean
        description: "Boost this group's members in dense room listings"
      no-boost:
        type: boolean
        field: noBoost
        description: "Stop boosting this group's members in dense room listings"
  move:
    controller: /platform/idea/cmd/social/NotifyMoveController
    description: "Reorder a rule — order is precedence"
    args:
      - name: ref
        type: string
        required: true
    options:
      above:
        type: string
        description: "Place this rule above another"
      below:
        type: string
        description: "Place this rule below another"
  remove:
    controller: /platform/idea/cmd/social/NotifyRemoveController
    description: "Drop a rule (the group falls back to the default tail)"
    help: |
      Remove a rule you set. The group it covered falls back to the
      reserved baseline default (so removing your `friends` rule just
      restores the shipped friends behavior, it doesn't forget anyone).
    args:
      - name: ref
        type: string
        required: true
