verbs: [dm]
category: social
controller: /platform/idea/cmd/social/DmController
description: "Send a direct message (dm) to one or more people. Multi-target DMs create an ad-hoc channel under the hood."
help: |
  Send a private message straight to someone, anywhere in the world —
  no need to share a room. Unlike `say`, a `dm` doesn't carry acoustically; it's delivered
  over comms.

  Name more than one recipient and the message becomes a small group
  thread: an ad-hoc channel is spun up under the hood so the whole
  cohort can keep talking. Use `reply` to answer your last inbound
  DM without retyping names.

  A `dm` needs something that reaches past the room — a phone in your
  hand or ready, switched on, with Messages installed. When it can't go,
  it is held, never lost: you're told why and how to fix it, and it
  goes the moment you can send. Messages to you that couldn't arrive
  wait the same way, under "While you were away…".
examples:
  - cmd: dm alice bob the plan is set
    note: Message several people; they share an ad-hoc thread
validators:
  - /lib/command/validators/requiresAnimate
args:
  - name: target
    type: objects
    required: true
    scope: ["~here", "~all"]
    cardinality: { min: 1, max: 10 }
    onShortage: error
    onExcess: error
    requires: class:Agent
  - name: message
    type: string
    required: true
    greedy: true
