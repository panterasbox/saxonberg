verbs: [name]
controller: /platform/idea/cmd/social/NameController
description: "Give an animal a name — or a reforged blade its new one"
help: |
  `name <animal> <name>` names it, and that is the moment everything
  changes.

  ⭐ Before: it is real, it is there, you can feed it and pet it, and the
  world keeps no record of it at all. Its regard for you lives only until
  the server restarts. An unnamed animal is free.

  After: it is yours. It has title, it has a name every passer-by can
  read, it persists, and it comes back as itself. ⚠ And its clock starts
  running while you are away — an owned animal gets hungry and thirsty
  whether or not you are logged in. Naming an animal is taking
  responsibility for it.

  ⚠⚠ **You cannot name an animal that has not chosen you.** It must know
  you well, and it must have followed you home at least once. That second
  part cannot be bought with food. The animal adopts you, not the other
  way round.

  ⭐ A THING may be named too — once, while it bears no name, by the hand
  the thing itself names: the one who MADE it (`name jug Mother's jug` —
  a potter, a smith, a cooper naming their own work), or the one who
  RE-MADE it (a blade that bore a name loses it when it breaks and is
  reforged, and the smith who reforged it may name it again — `name blade
  Dawnbreaker`). Nobody else may, and a thing that bears a name keeps it.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: target
    type: object
    required: true
    scope: ["reachable"]
    # ⭐ Anything: an animal OR a reforged thing — both arms are checked
    # in the controller (an alternation here would delete a check).
    requires: any
  - name: animalName
    type: string
    required: true
