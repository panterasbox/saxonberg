verbs: [fight]
controller: /platform/idea/cmd/combat/FightController
description: "Act inside a fight — read it, throw a gambit, or yield"
help: |
  `fight` is your handle on a fight already under way (start one with
  `attack <target>`). On its own it reads the fray at a glance — your
  poise, condition, flags, and wounds, plus a banded read of your
  opponent. Everything is a band, never a number.

  Gambits are queued intent — they resolve on the next beat and need a
  usable instrument (a wielded weapon or a natural attack) and an
  un-impaired limb:
    `fight strike`  — press the attack
    `fight feint`   — bait a patient defender into over-committing
    `fight advance` — buy a band of distance, inward (`close` is an alias)
    `fight withdraw`— open a band of distance, on ONE threat at a time
    `fight disarm`  — knock your opponent's weapon away
    `fight subdue`  — lock them up
    `fight shove`   — put them on the ground
  `fight feint` is the answer to a steady, armed defender who just parries
  everything: present a false opening and, if they bite it (and don't read
  it — skill sees through a feint), their guard cracks wide for your next
  strike. A reader, or a foe who isn't turtling, isn't fooled.
  Or hold: `fight defend` covers up and recovers your poise (capped by
  your endurance) instead of attacking — the patient defender's game.
  And `fight yield` concedes.
examples:
  - cmd: fight
    note: Read your current fight
  - cmd: fight strike
    note: Ready a strike for the next beat
  - cmd: fight yield
    note: Concede the fight
subcommands:
  status:
    description: "Read your current fight (same as bare `fight`)"
  strike:
    description: "Gambit — press the attack"
  feint:
    description: "Gambit — bait a patient defender into cracking their guard"
  close:
    description: "Step inside a longer weapon's reach (an alias for `advance`)"
  advance:
    description: "Buy one band of distance, inward — contested by a composed reach-holder"
  withdraw:
    description: "Open one band of distance from ONE threat; the room caps how far"
  disarm:
    description: "Gambit — knock your opponent's weapon away"
  subdue:
    description: "Gambit — lock your opponent up"
  shove:
    description: "Gambit — put your opponent on the ground"
  bash:
    description: "Gambit — slam a wielded shield to stagger a foe (shield only)"
  sweep:
    description: "Gambit — a hafted weapon's low sweep that takes the legs (hafted only)"
  entangle:
    description: "Gambit — wrap a whip's lash around a foe to bind them up (whip only)"
  defend:
    description: "Cover up and recover poise instead of attacking"
  break:
    description: "Offer a mutual stand-down — end the fight with no victor"
    help: |
      `fight break` is how you back down without losing. You cover up and
      offer to stop; if your opponent breaks too, the fight ends with no
      victor and no defeat on anyone's record — the difference from
      `yield`, which concedes and marks a loss. Offer while they keep
      swinging and you're just turtling: the olive branch has a cost.
    examples:
      - cmd: fight break
        note: Offer to end the fight then and there
  rush:
    description: "Throw a foe you've locked up out through an exit (subdue first)"
    help: |
      The bum's rush: once you've `subdue`d a foe (locked them up), `fight
      rush <direction>` hauls them to that exit and throws them out. They
      land sprawling in the next room, out of the fight. Any control winner
      can do it — it's how a fight ends with someone shown the door.
    examples:
      - cmd: fight rush south
        note: Throw your grappled foe out the south exit
    args:
      - name: direction
        type: string
        required: true
  switch:
    description: "Switch to a carried weapon — a vulnerable beat (guard down, can't strike)"
    help: |
      Change armament mid-fight. For a few beats your hands are full and
      your guard is down — an opponent who reads it gets a free window — and
      then the new weapon is in your grip. Use it to bring the right tool to
      the range you're at (a dagger once you're inside a spear).
    examples:
      - cmd: fight switch my dagger
        note: Trade your current weapon for a carried one
    args:
      - name: target
        type: object
        required: true
        scope: ["inventory", "reachable"]
        requires: VitalsMixin
  draw:
    description: "Draw a sidearm fast — the answer to being disarmed"
    help: |
      Draw a sheathed sidearm (or a carried backup) in a single fast beat.
      This is the answer to `disarm`: losing your weapon is a tempo setback,
      not the end of the fight.
    examples:
      - cmd: fight draw
        note: Fast-draw a backup after being disarmed
  finish:
    description: "Give the word — order a held killing stroke delivered (captain-only)"
    help: |
      Under a formation that reserves the kill decision for the captain
      (focus-fire, master-apprentice), a downed foe is not finished until
      the captain gives the word. `fight finish` is that word. Withhold it
      and the moment passes — the fallen is spared.
  yield:
    description: "Concede the fight"
validators:
  - /lib/command/validators/requiresEmbodied
