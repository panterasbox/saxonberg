verbs: [fulfill, handoff]
controller: /platform/idea/cmd/work/FulfillController
description: "Log a delivery at the destination — proof the job is done"
help: |
  The handoff: standing at the gig's destination with the delivery made,
  `fulfill` has your implant verify and log the completed work — an
  engine-sealed record that the job was done, right here, right now. The
  payout still happens at the board (`job complete`), but the sealed
  record survives whatever happens to the goods afterward — the recipient
  taking the crate inside is the point of delivering it.

  Bare `fulfill` resolves your single active claim; name an id when you
  hold several (or for an open bounty).
examples:
  - cmd: fulfill
    note: Log your active gig's delivery at the destination
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: id
    type: string
    required: false
