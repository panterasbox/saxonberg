verbs: [job, jobs]
controller: /platform/idea/cmd/work/JobController
description: "Browse, post, claim, and settle gigs on the job board"
help: |
  The job board — posted work with the reward held in escrow: the money
  is locked when the gig goes up, so the stakes are real. Bare `job` (or
  `jobs`) lists what's open on this board.

  Post work with `job post <what has to be true> for <reward>` — either
  `deliver <thing> to <place>` or `supply <n> <kind> to <place>` — funded
  from your own account (or your business's with `--business`). Add
  `--bounty` for an open bounty anyone can turn in (the reward escrows
  immediately); otherwise the gig is exclusive — one courier claims it
  and the escrow locks at claim. A claim lapses back to open if it sits
  too long, so squatting can't block a board.

  `job claim <id>` takes an exclusive gig; `job complete [id]` turns work
  in at the board — the engine checks the state of the world right then
  (or your sealed `fulfill` record), and pays out of escrow on the spot.
  `job abandon [id]` walks away: the escrow reverts, and the issuer
  remembers.

  `jobs --origin here` asks a different question: not what hangs on this
  board, but what wants moving OUT of where you are standing. That is the
  backhaul — a wagon going home empty has done half the work for all the
  cost, and you cannot solve your own: you need somebody else's cargo
  going the other way.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
options:
  origin:
    short: o
    type: string
    description: "List work starting HERE (or at a named place) — the backhaul."
subcommands:
  post:
    description: "Post a piece of work, reward held in escrow"
    help: |
      Post work to this board. The shape is always **what has to be true,
      then what you will pay**:

        job post deliver <thing> to <place> for <reward>
        job post supply <n> <kind> to <place> for <reward>

      ⭐ `deliver` is one named thing arriving somewhere — point at it,
      and if it is marked as yours the gig means THAT one. `supply` is a
      quantity of a KIND arriving somewhere, and how the courier sourced
      it is their business: mined, salvaged, bought or dug out of a
      cupboard all count. That is deliberate — a supply contract you
      could only fill by mining would have no market in it.

      ⚠ Only work the engine can CHECK can be posted, because the reward
      is real money held in escrow from the moment it goes up. "Deliver
      this" and "bring me ten of these" are checkable; "guard my shop"
      and "be nice to Mara" are not, and are refused rather than
      half-supported.

      Name a place by the name it is known by — a town or district — or
      point at something you can reach.
    examples:
      - cmd: job post deliver crate to the bar for 25
        note: One named thing, one destination
      - cmd: job post supply 10 iron-ore to the smelter for 200
        note: Ten of a kind — however the courier comes by them
      - cmd: job post supply 6 gin to the bench for 30 --bounty --business
        note: A bar ordering its rail in, funded by the house
      - cmd: job post deliver crate to the depot for 30 --from the brewing floor
        note: Name where the goods are collected, so a hauler can find the backhaul
    args:
      # ⚠ The condition is a PHRASE, greedy up to `for`, parsed by the
      # controller against the closed template vocabulary. It is not a
      # flag and not a subcommand: `post` is the lifecycle axis (beside
      # `claim`/`complete`/`abandon`) and the condition is what the work
      # IS. A third template adds a phrase form here and nothing else.
      - name: condition
        type: string
        required: true
        greedy: true
      # A string, coerced in the controller (the tip/pay amount precedent
      # — positional args don't coerce type:number).
      - name: reward
        type: string
        required: true
        prepositions: [for]
    options:
      bounty:
        short: b
        type: boolean
        description: "Open bounty: no claim step, anyone may turn it in."
      business:
        type: boolean
        description: "Post as your business (escrow from its account)."
      from:
        short: f
        type: string
        description: "Where the goods are collected (default: where you post)."
      expires:
        short: e
        type: number
        description: "Posting lifetime in game-hours (escrow reverts after)."
  claim:
    description: "Claim an exclusive gig (locks it to you, escrows the reward)"
    args:
      - name: id
        type: string
        required: true
  complete:
    description: "Turn a gig in — the engine verifies, escrow pays out"
    help: |
      Redeem a gig at the board. Verification runs right now against the
      world — or against your sealed `fulfill` record if the state has
      drifted since the handoff. Bare `job complete` resolves your single
      active claim; a bounty must be named by id.
    args:
      - name: id
        type: string
        required: false
  abandon:
    description: "Walk away from a claim (escrow reverts; it's remembered)"
    args:
      - name: id
        type: string
        required: false
