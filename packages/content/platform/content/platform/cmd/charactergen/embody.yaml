verbs: [embody]
controller: /platform/idea/cmd/charactergen/EmbodyController
description: "Take a body — the first embodiment (`reembody` is the shade's). Field-named subcommands: embody <field> <value> (species / sex / name / pronouns / aspiration / confirm). Bare `embody` re-emits the current draft state."
help: |
  Take a body — the first embodiment; `reembody` is the shade's.
  Embodying isn't a fixed sequence of steps — it's a draft you fill in
  field by field, in any order. Each
  `embody <field> <value>` sets one choice and shows you the whole
  draft again: what you've picked, what's still open, and the options
  for each.

  The fields are `species`, `sex`, `name`, `pronouns`, and
  `aspiration`. (Pick a species first — `sex` only appears for
  species that have one, and your species shapes the suggested
  names.) For `name`, type a given name and an optional surname, or
  use `embody name reroll` to get a fresh species-themed suggestion.

  Run bare `embody` any time to re-show the current draft. When every
  required field is filled, `embody confirm` commits the character
  and drops you into the world; if anything is still missing, it
  tells you what's left instead.
args:
  - name: rest
    type: string
    required: false
    greedy: true
