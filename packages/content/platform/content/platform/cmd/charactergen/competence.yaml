verbs: [competence]
controller: /platform/idea/cmd/charactergen/CompetenceController
description: "Read competence — the bands somebody has reached."
help: |
  Competence on the record, as *bands* — never a number. The view lists
  each Discipline with evidence and the band that evidence currently
  warrants (the floor is implicit: Disciplines never practiced simply
  don't appear).

  You learn you've improved the way you would in life — the lock that
  beat you last week now clicks open — not by watching a meter tick.

  With no argument you read your own. Name somebody in reach to read
  theirs: what an authored character can do is a fact about the world,
  and a trained eye is worth seeking out precisely because you can tell
  who has one. ⭐ Asking about another **player** is refused — what
  you can do is yours to show them.
examples:
  - cmd: competence
    note: Your own bands
  - cmd: competence dave
    note: What somebody else is good at
args:
  - name: subject
    type: string
    required: false
    greedy: true
