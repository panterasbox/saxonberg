verbs: [passage]
controller: /platform/idea/cmd/charactergen/PassageController
description: "Leave the between, and take a body again."
help: |
  You are between bodies. `passage` takes you back — you surface
  somewhere ordinary, in a new body, and the world goes on.

  This is the plain way back, and it is always available. It asks
  nothing of you and gives you nothing back: you wake with what a body
  is born with, and whatever you were carrying is still on the one you
  left behind. Somebody has to go and get it, and that somebody can be
  anybody.

  It is not the only way back. Others can offer a passage on their own
  terms — a temple, a clinic, someone who wants a favour — and what
  they ask and what they return is between you and them. This verb is
  the floor beneath all of that: whatever else is or isn't on offer,
  you are never stuck here.
