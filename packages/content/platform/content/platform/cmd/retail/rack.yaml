# rack — a house's check rack, and the book it keeps (controllers-are-io
# W7, D9). The flat `check` and `reclaim` verbs until then; ⚠ the flat
# `reclaim` bound only a consignment shelf, so a checked weapon could not
# be reclaimed through the view at all — `rack reclaim` binds the rack.
verbs: [rack]
category: retail
description: "A rack or locker that holds your things — check / reclaim"
help: |
  A rack or a locker holds things for you, and keeps them. `rack check
  <thing>` hands it over for a ticket, and `rack reclaim <thing>` takes
  it back. It stays yours — no one can buy it off the rack. Some houses do
  not allow arms inside and keep a check rack at the door that takes only
  weapons; when a lease ends, the landlord boxes what you left in the
  house's store, and you reclaim it there the same way.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
subcommands:
  check:
    description: Hand something to a rack or locker to hold
    controller: /platform/idea/cmd/retail/RackCheckController
    help: |
      Hand something to a rack or locker — `rack check knife`. Custody passes
      to its keeper and you get a claim ticket, but the thing stays YOURS: no
      one can buy it off the rack, and you take it back any time with
      `rack reclaim`. A house's check rack at the door takes only weapons (a
      shield is armor, not a weapon); a locker takes anything that fits.
    validators:
    - /lib/command/validators/requiresEmbodied
    args:
    - name: thing
      type: object
      required: true
      scope:
      - inventory
      requires:
      - ChattelMixin
    - name: rack
      type: object
      required: false
      prepositions:
      - from
      default: reachable:[mixin.HeldGoodsMixin] - reachable:[mixin.ConsignmentShelfMixin]
      scope:
      - here
      - peers
      - person
      requires:
      - HeldGoodsMixin
  reclaim:
    description: Take back something you checked
    controller: /platform/idea/cmd/retail/RackReclaimController
    help: |
      Take back something you checked — `rack reclaim knife` — or what a
      landlord boxed for you when your lease ended. It was yours the whole
      time: the keeper only held it. Where more than
      one rack is in reach, say which: `rack reclaim knife from the second
      rack`.
    validators:
    - /lib/command/validators/requiresEmbodied
    args:
    - name: thing
      type: string
      required: true
    - name: rack
      prepositionRequired: true
      type: object
      required: false
      prepositions:
      - from
      default: reachable:[mixin.HeldGoodsMixin] - reachable:[mixin.ConsignmentShelfMixin]
      scope:
      - here
      - peers
      - person
      requires:
      - HeldGoodsMixin
