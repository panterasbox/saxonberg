verbs: [consign]
controller: /platform/idea/cmd/retail/ConsignController
description: "Consign a good you own for sale at a store"
help: |
  Put a good you own up for sale on a store's consignment shelf —
  `consign lantern --ask 12`. Custody passes to the shop, but you still
  own it until it sells; when someone buys it the shop takes a
  commission and the rest lands in your bank account. Take it back any
  time it hasn't sold with `reclaim`.

  ⭐ **A stack goes up ONE UNIT at a time.** Consigning off a stack of
  cloth or candles takes a single unit and leaves the rest in your hands.
  That unit becomes a thing in its own right the moment you list it —
  which is what lets the shelf hold it, the ledger pay you for it, and
  you `reclaim` it unsold. Put another up when it sells.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  # ⭐⭐ The GOOD, bound by the view too — and it used to be a bare string
  # the controller matched against your inventory by hand, which is the
  # binder's own job reimplemented three feet below a comment saying the
  # rack is "bound by the view, not hunted for here".
  #
  # `scope: [inventory]` is what "you must be carrying it" means, said
  # once, declaratively — so the refusal for a thing you do not have is
  # the same `empty-result` every other object arg gives, instead of a
  # bespoke sentence quoting raw input back at you.
  - name: thing
    type: object
    required: true
    scope: [inventory]
    requires: [ChattelMixin]
  # ⭐ The shelf you are listing on — DECLARED, so the binder resolves it like
  # any other object and the controller just reads it. `on` keeps the
  # existing grammar intact while making it addressable when it matters.
  - name: shelf
    type: object
    required: false
    prepositions: [on]
    default: "reachable:[mixin.ConsignmentShelfMixin]"
    scope: [reachable]
    requires: [ConsignmentShelfMixin]
options:
  ask:
    short: a
    type: string
    description: "The asking price, in coin."
