verbs: [consign]
controller: /platform/idea/cmd/retail/ConsignController
description: "Consign a good you own for sale at a store"
help: |
  Put a good you own up for sale on a store's consignment shelf —
  `consign lantern --ask 12`. Custody passes to the shop, but you still
  own it until it sells; when someone buys it the shop takes a
  commission and the rest lands in your bank account. Take it back any
  time it hasn't sold with `reclaim`.

  ⭐ **A stack goes up ONE UNIT at a time.** Consigning off a stack of
  cloth or candles takes a single unit and leaves the rest in your hands.
  That unit becomes a thing in its own right the moment you list it —
  which is what lets the shelf hold it, the ledger pay you for it, and
  you `reclaim` it unsold. Put another up when it sells.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: thing
    type: string
    required: true
options:
  ask:
    short: a
    type: string
    description: "The asking price, in coin."
