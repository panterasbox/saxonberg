verbs: [buy]
category: retail
controller: /platform/idea/cmd/retail/BuyController
description: "Buy something offered for sale here"
help: |
  Buy a good off a store counter — `buy torch`. The clerk rings it up;
  you pay by card or in coin, and the good is yours (owned, not just
  carried). Consigned goods on the shelf are bought the same way.

  A name with a space in it is quoted — `buy "dog loaf"`, `buy "orange
  seed"`, `buy "mana cell"`; one word binds bare (`buy loaf`). Where more
  than one counter is in reach, say which: `buy torch from the second
  counter`.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  # ⭐⭐ A good's name is often a PHRASE (`dog loaf`, `orange seed`, `mana
  # cell`) — and a phrase is QUOTED (controller-liquidity D3): the slot
  # binds one word, `buy "dog loaf"` binds the phrase, and `buy dog loaf`
  # is refused with the quoted line to tap. A leading article folds away
  # (`buy the loaf`). The good is matched by the counter's book, not by
  # MQL, so the slot stays a string.
  - name: thing
    type: string
    required: true
  # ⭐ WHERE you are buying from, DECLARED rather than re-derived. The
  # controller used to hunt for a counter itself; now the binder resolves
  # it like any other object and the controller just reads it.
  #
  # `from` keeps the existing grammar intact — `buy torch` is unchanged —
  # while making the counter addressable when it matters (`buy torch from
  # second counter`), which a controller-side default never was.
  #
  # ⭐ The query is the OFFER protocol (`ForSaleMixin`),
  # not a class: one arg finds a house counter, a standalone consignment
  # shelf, the yard's hull book — anything that has something for sale —
  # and the controller hands the sale to whichever seller here offers the
  # word.
  # `prepositionRequired` — the counter is named only behind `from`, so
  # word two of an unquoted name is left over (and the binder says to
  # quote it) instead of being taken for a counter (controller-liquidity
  # W5).
  - name: counter
    prepositionRequired: true
    type: object
    required: false
    prepositions: [from]
    default: "reachable:[mixin.ForSaleMixin]"
    scope: ["here", "peers", "person"]
    requires: [ForSaleMixin]
