verbs: [check]
controller: /platform/idea/cmd/retail/CheckController
description: "Check a weapon at a house's check rack"
help: |
  Hand a weapon to the house's check rack — `check knife`. Custody passes
  to the house and you get a claim ticket, but the weapon stays YOURS: no
  one can buy it off the rack, and you take it back any time with
  `reclaim`. Only weapons can be checked (a shield is armor, not a
  weapon), and the rack has to be here — you'll find one at the door of a
  house that doesn't allow arms inside.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: thing
    type: string
    required: true
  # ⭐ The rack you are checking — DECLARED, so the binder resolves it like
  # any other object and the controller just reads it. `from` keeps the
  # existing grammar intact while making it addressable when it matters.
  - name: rack
    type: object
    required: false
    prepositions: [from]
    default: "reachable:[mixin.HeldGoodsMixin] - reachable:[mixin.ConsignmentShelfMixin]"
    scope: [reachable]
    requires: [HeldGoodsMixin]
