verbs: [order]
controller: /platform/idea/cmd/retail/OrderController
description: "Order a cocktail from the menu"
help: |
  Order a drink off the menu — `order martini`. Whoever's tending the
  bar makes it and hands it to you. Name a brand with `with` to steer
  the pour: `order martini with bombay`.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: cocktail
    type: string
    required: true
    # Menu names are multi-word — "Old fashioned", "Gin & tonic",
    # "Glass of red". Greedy, stopping at `with` (the brand's
    # preposition) so `order martini with bombay` still splits.
    greedy: true
  - name: brand
    type: string
    required: false
    prepositions: [with]
