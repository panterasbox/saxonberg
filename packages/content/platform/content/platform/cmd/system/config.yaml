verbs: [config]
controller: /platform/idea/cmd/system/ConfigController
description: "View or set the world's settings (the Prime Minister's)"
help: |
  Inspects and changes the game's application-wide settings. Plain
  `config` lists every setting and its current value. `config <key>`
  shows just one. `config <key> <value>` changes it.

  This is the Prime Minister's knob board — it tunes the running world,
  not your personal preferences. A value is a single token with no
  spaces (a path or a scalar). For your own shell settings, use
  `settings` or `var` instead.

  A political dial — a tax, a levy, a capital control — is Tier C and is
  not set here: the listing marks it with its seat, and the seat sets it
  through its own verb (the Minister of Finance's `treasury set`, the
  Governor's `reserve set`), on the record.
examples:
  - cmd: config defaultStartLocation
    note: Show one setting's current value
  - cmd: config defaultStartLocation /world/lounge/location/lounge
    note: Set a setting to a new value
validators:
  - /lib/command/validators/requiresPrimeMinister
args:
  # Both optional: `config` lists, `config <key>` shows, `config <key>
  # <value>` sets. `value` is a single token (a setting value is a path /
  # scalar, no spaces) — it is NOT greedy, because a greedy arg is treated
  # as required and a required arg cannot follow the optional `key`.
  - name: key
    type: string
    required: false
  - name: value
    type: string
    required: false
