verbs: [help]
category: system
defaultAliases: [{name: h}, {name: "?"}]
controller: /platform/idea/cmd/system/HelpController
opens_card: help
description: "Get help: bare lists the verb categories; `help <category>`, `help <verb>`, `help api`, `help search`"
help: |
  Your way into everything the game can do. Plain `help` lists the verb
  categories; `help <category>` lists the verbs in one. `help <verb>` shows
  the full entry for one command — what it does, how to phrase it, and
  examples.

  Naming something that isn't a verb still works: `help bank_ledger`
  shows how the world stores money — what the collection is for, what
  is always true of it, what each of its indexes is there to make
  fast, and what happens to it overnight.

  ⭐ A thing's name with a space in it is QUOTED: `buy "dog loaf"`,
  `look at the "brass lantern"`, `put "egg lot" in tray`. One word binds
  bare (`buy loaf`), and a leading article or count rides along (`eat the
  apple`, `get 2 "mooring line"`). Type a phrase bare and the game hands
  you the quoted line to run. What you SAY is never quoted — `say good
  morning` reads whole.

  `?` and `h` are shortcuts for `help`.
fallthrough: true
args:
  # Bare `help look` → topic='look' (the common case — no `verb` word).
  # Named `topic` so it never collides with the `api` subcommand's
  # `target` field. Unknown first token falls through to bind here.
  - name: topic
    type: string
    required: false
subcommands:
  verb:
    description: "Show help for a verb (no name → list verbs)"
    help: |
      You rarely type `help verb` in full — `help look` reaches the
      same place. Naming no verb falls back to the full command list.
    args:
      - name: name
        type: string
        required: false
  api:
    description: "Show api signatures (Type or Type.member)"
    help: |
      For authors: browse the scripting surface. Name a type to see
      its members, or `Type.member` for one signature.
    examples:
      - cmd: help api ContainmentApi.move
        note: Show one method's signature
    args:
      - name: target
        type: string
        required: false
  search:
    description: "Full-text search across verb help and api docs"
    help: |
      Type a word or two and get every command whose name, summary,
      help text, or examples mention it. The fastest way to find a
      verb when you don't know its name.
    examples:
      - cmd: help search channel
        note: Find every command mentioning "channel"
    args:
      - name: query
        type: string
        required: true
        greedy: true
