verbs: [testharness]
category: system
# ⛔ A TEST-WORLD verb. The view installs everywhere; the command loader
# admits it only when SecurityApi.isTestEnvironment() (the wire runner's
# SAXONBERG_TEST_WORLD=1). In a world somebody plays in there is no such
# verb — not in help, not in the affordances — and `requiresTestWorld`
# keeps the gate in the view's own data too.
testOnly: true
description: "Test-world staging: read and move the clock, pin the weather, stage a ship, a room's gravity, a condition, a body"
help: |
  Scaffolding for drives and staging, in a test world only. Subcommands
  and options, never phrases; a bare subcommand reads.

  `testharness clock` reads game time. `testharness clock-advance <dur>`
  moves it — one token, a number and a unit: 30m, 2h, 1d. A day at most:
  a longer jump is a span step and is refused (it belongs in a .soak.
  wire file — docs/workflow.md § No merge waits on the clock).

  `testharness weather` reads the pin and the weather here.
  `testharness weather-pin <kind>` holds the weather of the Locality you
  stand in (or `--at <place>`) at clear, overcast, rain, storm, fog or
  snow, applied at once; `--alive` lets it still vary. `testharness
  weather-unpin` releases it. A pin persists: whoever pins, unpins.

  `testharness ship <ship path> at node:<path>` puts a ship lying at a
  sea's node (or `at <frame path> <cite>`, a citation on a frame), cast
  off and with no course — the staged twin of sailing her there. Her
  rooms, and everyone in them, go with her. `hull <band>` puts her hull
  in a band (sound, weathered, worn, shabby, dilapidated), `bilge <L>`
  her bilge at so many litres, and `slept <days>` has her lie that long
  unattended — her bilge fills over every band her hull passed through
  (with `hull`, the band she reads after it). `settling` puts her bilge
  up to her deck and lets the water decide: in deep water she begins to
  settle (everyone aboard is told, and has their acts; with nobody aboard
  she goes down at once), at a mud berth she settles onto the bottom.
  Options in any order; an `at <frame> <cite>` goes last.

  `testharness gravity <m/s²>` sets the gravity of the place you stand in
  (or `--at <place>`) — `0` for none, `clear` to inherit again. What is
  no longer pressed into an open container leaves it at once.

  `testharness afflict <name> <condition path> [stage]` puts a resident
  character under a condition: one with a toxin behind it (anaesthesia) is
  dosed to its top band, so it takes them under at once and their hands
  let go.

  `testharness vanish #<id>` takes a thing out of the world wherever it
  is — a wizard reaching into a character's shut pack.

  `testharness species <name> <species path>` stages a resident character
  as a body of another species, its mass re-seeded from it.

  The same rules as the wire harness's routes — one implementation
  (TestHarnessApi) behind both.
examples:
  - cmd: testharness clock-advance 2h
    note: Move world-time two hours (a day at most)
  - cmd: testharness weather-pin rain
    note: Hold rain over the Locality you stand in
  - cmd: testharness weather-unpin --at /world/terminus
    note: Release a pin somewhere else
  - cmd: testharness ship /world/terminus/hesper/structure at node:/stuff/idea/WaterExpanse/greywater/bar
    note: Stage the Hesper lying off the bar
  - cmd: testharness ship /world/terminus/hesper/structure hull worn slept 0.25
    note: Stage her hull worn, six hours' water in her bilge
  - cmd: testharness gravity 0
    note: No gravity in the room you stand in
  - cmd: testharness afflict Mara /platform/idea/Condition/metabolism/anaesthesia
    note: Take Mara under
validators:
  - /lib/command/validators/requiresTestWorld
options:
  at:
    type: string
    field: at
    description: "A place's or Locality's path — the weather subcommands act on its Locality"
  alive:
    type: boolean
    field: alive
    description: "Pin alive (the grammar still varies the deviation) rather than frozen"
# ⭐ One controller per act (controller-liquidity W7a): a bare subcommand
# READS, and the clock's and the weather's acts are their own subcommand
# words — compound names, because this verb is non-diegetic and a command
# is `verb subcommand target`, never deeper (W16; they were nested stanzas).
subcommands:
  clock:
    controller: /platform/idea/cmd/system/TestHarnessClockController
    description: "Read the clock (`clock-advance <dur>` moves it)"
  clock-advance:
    controller: /platform/idea/cmd/system/TestHarnessClockAdvanceController
    description: "Move the clock: one token, a number and a unit (30m, 2h, 1d), a day at most"
    args:
      - name: value
        type: string
        required: false
  weather:
    controller: /platform/idea/cmd/system/TestHarnessWeatherController
    description: "Read the pin and the weather (`weather-pin <kind>` / `weather-unpin` change it)"
  weather-pin:
    controller: /platform/idea/cmd/system/TestHarnessWeatherPinController
    description: "Hold the weather at clear, overcast, rain, storm, fog or snow (`--alive` lets it vary)"
    args:
      - name: value
        type: string
        required: false
  weather-unpin:
    controller: /platform/idea/cmd/system/TestHarnessWeatherUnpinController
    description: "Release the pin"
  ship:
    controller: /platform/idea/cmd/system/TestHarnessShipController
    description: "Stage a ship: `ship <ship> [at node:<path> | at <frame> <cite>] [hull <band>] [bilge <L>] [slept <days>] [flag <government>] [settling]`"
    args:
      - name: op
        type: string
        required: false
      - name: value
        type: string
        required: false
      - name: cite
        type: string
        required: false
        greedy: true
  gravity:
    controller: /platform/idea/cmd/system/TestHarnessGravityController
    description: "Set the gravity here (or `--at`): m/s², 0 for none, `clear` to inherit"
    args:
      - name: value
        type: string
        required: false
  afflict:
    controller: /platform/idea/cmd/system/TestHarnessAfflictController
    description: "Put a resident character under a condition: `afflict <name> <condition path> [stage]`"
    args:
      - name: op
        type: string
        required: false
      - name: value
        type: string
        required: false
      - name: cite
        type: string
        required: false
  species:
    controller: /platform/idea/cmd/system/TestHarnessSpeciesController
    description: "Stage a resident character as another species: `species <name> <species path>`"
    args:
      - name: op
        type: string
        required: false
      - name: value
        type: string
        required: false
  vanish:
    controller: /platform/idea/cmd/system/TestHarnessRemoveController
    description: "Take a thing out of the world by id, wherever it is: `vanish #<id>`"
    args:
      - name: op
        type: string
        required: false
