verbs: [transfer]
controller: /platform/idea/cmd/system/TransferController
description: "Transfer a parcel's title, or a ship's shares, to another player (with their consent)"
help: |
  Hand the title to a parcel you own to another player. Name the parcel by
  its path, then `to` and the player. Because a title carries liability, the
  recipient must accept — you can't push a title onto someone, so they have
  to be online to say yes.

  Title-only: no payment changes hands (selling is a later feature). The
  handoff is recorded permanently in the chain-of-title log, so a parcel's
  former owners stay on the record — a transfer is never a silent overwrite.

  `--group <name>` transfers to a managed GROUP instead of a player — a
  governance act (provisioning a studio cell, chartering shared space).
  A group can't say yes, so there is no consent leg: your authority over
  the parcel is the whole gate, and the chain-of-title records the act.

  ⭐ **A ship's shares.** A ship's title is sixty-four shares in her
  register. To BUY shares, name them, their holder and your price:
  `transfer 16 shares of gull from alice for 40` — Alice is asked, and on
  her yes your money and her shares move together, or nothing moves. To
  GIVE shares you hold, `transfer 16 shares of gull to bob` — Bob must
  accept. Only a holder's shares can change hands, and the register shows
  every owner (`read register` at the harbor office).
examples:
  - cmd: transfer /world/lounge to alice
    note: Offer the lounge title to Alice (she must accept)
  - cmd: transfer 16 shares of gull from alice for 40
    note: Buy 16 of the Gull's shares from Alice for 40 — her yes moves the money and the shares together
  - cmd: transfer 8 shares of gull to bob
    note: Give 8 of your shares in the Gull to Bob (he must accept)
validators:
  - /lib/command/validators/requiresAnimate
args:
  # ⭐ Greedy: a parcel is a path, but shares are a PHRASE (`16 shares of
  # the gull`) — the prepositions below are what it stops at.
  - name: parcel
    type: string
    required: true
    greedy: true
  - name: recipient
    type: object
    required: false
    greedy: true
    scope: "online"
    prepositions: [to]
    requires: class:Agent
  # ⭐ Shares bought (harbors P15): whose shares — a holder, online, who is
  # asked; and the price you pay them.
  - name: holder
    type: object
    required: false
    greedy: true
    scope: "online"
    prepositions: [from]
    requires: class:Agent
  - name: price
    type: string
    required: false
    greedy: true
    prepositions: [for]
options:
  group:
    type: string
    description: "Transfer to a managed GROUP by name (a governance act — no consent leg; the governor's act is the acceptance)"
