verbs: [instruct]
controller: /platform/idea/cmd/system/InstructController
description: "Keep a round going while you are away"
help: |
  ⭐ Standing instructions. `instruct keep milk the cow into the pail`
  and your character keeps doing that — on its own, while you are
  offline — until you tell it to stop.

  The reason this exists: a dairy cow wants taking twice a GAME day,
  and a game day is two real hours. That is the honest cost of the
  animal that pays best, and nobody can be awake for it.

  ⚠ It PRESERVES; it never EARNS. The round is the exact line you
  typed, run as if you had typed it, and what it produces lands in
  your own hands or your own pail. It cannot sell, consign, price or
  bank anything — only the taking verbs can be kept at all, and
  `instruct keep sell the milk` is refused.

  ⚠ And it stays where you left it. The round looks for its target in
  the room your character is standing in, and nowhere else. Leave the
  byre and the round quietly lapses — which is the cost of logging off
  in the wrong place, not a rule to learn.

  Bare `instruct` lists what you have standing. `instruct none` clears
  the lot.
examples:
  - cmd: instruct keep milk the cow into the pail
    note: Keep milking her out, while you are away
  - cmd: instruct keep gather the hen
    note: Keep the eggs coming
  - cmd: instruct
    note: What am I keeping?
  - cmd: instruct none
    note: Stop all of it
validators:
  - /lib/command/validators/requiresAnimate
fallthrough: false
subcommands:
  keep:
    description: "Keep running a command while you are away"
    help: |
      Name the command exactly as you would type it. It has to be one
      of the TAKING verbs — `milk`, `gather`, `rob`, `tap` — and it has
      to name its target, because the round looks for that target in
      the room each time it runs.
    args:
      # ⭐ GREEDY, because the argument IS a command line: "milk the cow
      # into the pail" is one value, not four. The controller resolves
      # its verb against the catalogue and refuses anything whose view
      # does not declare `standing: true`.
      - name: line
        type: string
        required: true
        greedy: true
  none:
    description: "Clear every standing instruction"
    help: |
      Stop all of it. Your character goes back to doing nothing while
      you are away, which is what it did before you asked.
  list:
    description: "Show what you are keeping"
    help: |
      The rounds you have standing, in the order you set them. This is
      what bare `instruct` shows too.
