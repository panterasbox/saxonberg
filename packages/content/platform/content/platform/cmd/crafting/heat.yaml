# ⭐ There is no `boil` (controllers-are-io D8c, 2026-11-06): boiling is
# heating something to its boiling point, and the pot does the rest — the
# liquid holds at the boil (the latent-heat plateau), a material that
# boiling improves turns into what it names once it has been held there a
# minute, and whatever is IN the pot is held at the boil with it (the
# pot's own reconcile). `boil` was a temperature, not an act; it was an
# alias of this verb from 2026-10-19 and is gone, not kept.
verbs: [heat]
controller: /platform/idea/cmd/crafting/HeatController
description: "Work a build in the fire (a manual step, both branches)"
help: |
  Bring the work to the fire — `heat ingot` at the forge, `heat pot` at
  the hearth (or bare `heat` for the build you're working). Latches the
  hottest heat the build has taken; recipes that need heat check it at
  the finish. Needs a lit fire in reach. Takes a moment.

  Anything else that holds heat — a cheese vat, a pail of milk — is set
  on the fire in reach (`heat vat`), and warms there until you take it
  off (`get vat`). A thermometer tells you how far it has come.

  A cloth or a tool — a bandage, a board, a knife — put IN a pot of water
  (`put bandage in pot`) is held at the boil for as long as the pot
  boils, and five minutes of it leaves it DISINFECTED. Washing only makes
  a thing clean; boiling is what kills. Held in the flame instead (`heat
  kit`), an instrument takes a dry heat, which kills the spores boiling
  leaves.

  A pot of water brought to a boil holds there while it boils away, and a
  minute at a rolling boil makes bad water fit to drink — or tar into
  pitch. ⚠ It does not fix everything: a river fouled by a smelter boils
  into hot poison, because heat kills what lives in water and does
  nothing to lead.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: target
    type: object
    required: false
    scope: "reachable"
    # ⭐ Bare `heat` works the build you are at — DECLARED, so the binder
    # resolves it (held first) instead of the controller walking for it
    # (`lint:controller-resolution`).
    default: "reachable:[mixin.ManualBuildMixin]"
    # ⭐ `any`, narrowed by the controller to its two arms: a build vessel
    # takes the heat into its build; any other vessel is SET ON the lit
    # fire in reach (dairy D6). A build vessel and a cold vat share no
    # mixin, so an alternation would delete a check.
    requires: any
