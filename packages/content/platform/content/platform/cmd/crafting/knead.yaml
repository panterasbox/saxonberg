verbs: [knead]
category: crafting
controller: /platform/idea/cmd/crafting/KneadController
description: "Work what is in a trough, a tub or a pot until it comes together"
help: |
  `knead` works what is in a trough, a tub or a pit with both hands until
  it comes together. ⭐ The VESSEL decides what that means:

  - **a baker's trough** develops a dough's gluten — wheat flour's two
    proteins, worked with water, link into the elastic sheet that traps a
    leaven's gas. Barley flour kneads into something edible and flat.
  - **a mixing vessel** (a rubber works' tub, a temper pit, a batch pot,
    a glaze bucket, a paint pot) folds what is in it into one blend, its
    make-up the inputs' by mass. Nothing is a recipe: a little more sulfur
    in the tub is a harder rubber, a little more sand in the clay a leaner
    one.

  ⭐ What is IN the vessel decides the work, never the word: a stiff mass
  (clay, raw rubber) is kneaded, a long heavy job; a slurry, a powder or
  a liquid (a glaze, a paint, a batch of sand and flux) is stirred, a few
  light minutes. Both are `knead`. (`stir` is the drink you are building.)

  ⚠ Both hands are in it. Kneading is work.
examples:
  - cmd: knead
    note: Work whatever you are standing at
  - cmd: knead tub
    note: Mill what is in the mixing tub into one compound
  - cmd: knead pot
    note: Stir the paint pot's oil and pigment into one paint
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: vessel
    type: object
    required: false
    scope: ["reachable"]
    # ⭐ Bare `knead` works the trough or tub you are at — DECLARED, so the
    # binder resolves it (`lint:controller-resolution`). A union of the two
    # shipped kinds of knead vessel (a build vessel, a compounding one).
    default: "reachable:[mixin.ManualBuildMixin],reachable:[mixin.CompoundingMixin]"
    # ⚠ `any`, narrowed by the controller: a knead vessel
    # (`KneadVesselMixin`) is asked for its plan, and anything else the
    # default bound (a shaker) is refused in the controller's own words.
    requires: any
