verbs: [garnish]
controller: /platform/idea/cmd/crafting/GarnishController
description: "Garnish a finished drink (a thing in the glass)"
help: |
  Finish a drink off — `garnish coupe with olive`. The garnish goes into
  the glass and leaves with it. Takes a moment.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: glass
    type: object
    required: true
    scope: "reachable"
    requires: CraftedMixin
  - name: garnish
    type: object
    required: true
    scope: "reachable"
    prepositions: [with]
    requires: any
