verbs: [salvage, scrap]
controller: /platform/idea/cmd/crafting/SalvageController
description: "Break an item down into raw materials (lossy)"
help: |
  Break a thing down for its matter — `salvage knife`. You get back a
  fraction of each constituent material in raw form (metal as castings,
  the rest as scrap); the maker's mark, the grade, and the form are
  destroyed with it. Salvage always loses value — that's the point.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: item
    type: object
    required: true
    scope: "reachable"
    # ⚠ NOT `CraftedMixin`. `CraftingApi.salvage` is "the one generic
    # lossy melt-down" (crafting.md) and refuses only
    # `!isTangible || isOrganism` — it flattens ANY material
    # composition. Declaring `Crafted` here hid salvage on every
    # non-crafted tangible thing the Api would happily break down.
    requires: TangibleMixin
