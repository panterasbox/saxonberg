verbs: [repair, mend]
controller: /platform/idea/cmd/crafting/RepairController
description: "Repair a worn or broken durable good"
help: |
  Restore a worn good — `repair knife`. The cost is material, priced by
  the damage (a broken good costs double): metal work wants a hot forge
  and metal stock in reach; soft goods want a mending kit and same-kind
  stock. Restores fully — gear never obsoletes, it asks for care.
  Repair fixes STRUCTURE; a dull edge just needs `sharpen`.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: item
    type: object
    required: true
    scope: "reachable"
    requires: DurableMixin
  # ⭐ WHICH KIT — DECLARED, not hunted for (`lint:instrument-args`).
  # Mending kit or an anvil both serve; bare, the binder hands over every
  # reachable thing offering either and the controller takes the
  # best-rated, kit before anvil.
  - name: kit
    type: objects
    required: false
    prepositions: [with, at, on]
    default: "reachable:[capability.mending or capability.anvil]"
    scope: ["reachable"]
    requires: [ToolMixin]
