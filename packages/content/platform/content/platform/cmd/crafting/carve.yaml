verbs: [carve]
controller: /platform/idea/cmd/crafting/CarveController
description: "Cut away to a form with an edge — a part from wood, a foot on a pot"
help: |
  `carve haft` shapes a pick haft out of the best piece of wood in reach
  that will do. `carve peg from the blank` names the piece. `carve handle
  with the billhook` names the edge.

  ⭐ What you can carve is every part that is one piece of wood and an
  edge: a haft, a handle, a peg, a dowel, a leg, a rail, a mallet. Say
  `carve` with a word it does not know and it tells you the list.

  Carve from **riven** wood when you can — a blank split off a billet
  with a froe. Riven wood follows the grain the whole length of the
  piece, so a riven haft does not snap where a sawn one would — and a
  part carved from a sawn board IS sawn: the saw cut the fibres, and no
  edge puts them back (`look` at it and read its grain). And carve
  it **seasoned** if you can wait: green wood shrinks as it dries, and a
  haft carved green works loose in its head.

  ⭐ This is where the tool tree starts. A handle you carve and a blade a
  smith forges are a froe (`fit froe`), and the froe rives the next
  blank.

  ⭐ **A leather-hard pot is carved too** — `carve foot on mug` turns a
  foot on it, `carve trim on jug` pares the wall, `carve design on bowl`
  cuts one in. Too soft and it smears; bone-dry and it cracks. The pot
  says which.

  ⭐ **A founder's pattern** — `carve pattern of sword from board for
  bronze` cuts a wooden copy of the sword a shade OVERSIZE, by exactly
  what bronze shrinks as it cools, so a cast from it comes out true. And
  `carve riser on flask` cuts a riser into a rammed sand mould, so the
  last of the metal to freeze has something to feed from.
examples:
  - cmd: carve haft
    note: Shape a pick haft from wood in reach
  - cmd: carve peg from the blank
    note: Name the piece to carve it from
  - cmd: carve handle with the billhook
    note: Name the edge
  - cmd: carve foot on mug
    note: Turn a foot on a leather-hard pot
  - cmd: carve pattern of sword from board for bronze
    note: Cut a founder's pattern, oversize for bronze's shrink
  - cmd: carve riser on flask
    note: Cut a riser into a rammed sand mould
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  # The PART — a word naming a carving recipe, read off `raw`. An object
  # arg so the phrase may be several words (`carve pick haft`) and so an
  # unresolved word binds as `{ stuff: null, raw }` (the `fit`/`measure`
  # rule) — the controller resolves it against the recipe catalogue and
  # refuses naming what CAN be carved. `requires: any` — DECLARED and it
  # gates nothing: a word names no object at all.
  - name: thing
    type: object
    required: false
    greedy: true
    scope: ["reachable"]
    requires: any
  # ⭐ WHAT TO CARVE IT ON — a thing that plans its own carving (a
  # leather-hard pot). `requires: any`: the controller asks it to plan.
  - name: target
    type: object
    required: false
    greedy: true
    prepositions: [on, into]
    scope: ["reachable"]
    requires: any
  # ⭐ (ceramics D23) WHAT A PATTERN IS OF — `carve pattern of sword from
  # board`: the board plans a pattern of the sword's shape. `requires: any`
  # — anything with a shape can be copied.
  - name: of
    type: object
    required: false
    greedy: true
    prepositions: [of]
    scope: ["reachable"]
    requires: any
  # The piece to carve it from, when you want a particular one.
  - name: stock
    type: object
    required: false
    greedy: true
    prepositions: [from, out]
    scope: ["reachable"]
    requires: TangibleMixin
  # ⭐ `for` is declared AFTER `stock`: a greedy arg stops only at a LATER
  # declared preposition, so with `for` first, `carve pattern of sword
  # from board for pewter` (the documented order) bound `stock` = "board
  # for pewter", `for` came up empty, and the pattern was cut for steel
  # (the ceramics drive, run 23).
  # …and the METAL it is cut for — a word, read off `raw` (`for bronze`):
  # the pattern is cut oversize by that metal's shrinkage, so it casts true.
  - name: for
    type: object
    required: false
    greedy: true
    prepositions: [for]
    scope: ["reachable"]
    requires: any
  # ⭐ WHICH EDGE — declared, not hunted for (`lint:instrument-args`).
  - name: knife
    type: object
    required: false
    greedy: true
    prepositions: [with, using]
    default: "reachable:[capability.cutting]"
    scope: ["reachable"]
    requires: [ToolMixin]
