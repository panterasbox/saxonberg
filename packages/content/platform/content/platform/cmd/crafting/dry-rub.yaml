# ⭐ `dry <thing> with <cloth>` — the second shape of `dry`
# (controller-liquidity W7c, D13 rung 4 — the `throw` trio's rule). `with`
# is required, so the shape is disjoint from `dry <thing> [on <rack>]`
# (`dry.yaml`, hanging it up), and each shape has its own controller.
verbs: [dry]
category: crafting
controller: /platform/idea/cmd/crafting/DryRubController
description: "Rub something dry with a cloth"
help: |
  `dry <thing> with <cloth>` — rub it dry: a towel takes the water into
  itself, as much as it has room for (`dry me with towel` after a bath).
  Any cloth will take up some water — a shirt in a pinch; a towel is
  simply good at it. A sodden towel takes up no more: hang it up to dry
  (`dry towel on rack`).
examples:
  - cmd: dry me with towel
    note: Rub yourself down after a bath
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: target
    type: object
    required: true
    # ⭐ What is in hand first — the same reach as hanging it up.
    scope: ["inventory", "reachable"]
    # The controller refuses a thing with no water in it, in its own words.
    requires: any
    validators:
      - /lib/command/validators/canReach
  - name: cloth
    prepositionRequired: true
    type: object
    required: true
    prepositions: [with]
    scope: "reachable"
    # Any wet-able thing will rub something dry; the controller narrows.
    requires: any
    validators:
      - /lib/command/validators/canReach
