verbs: [forge]
controller: /platform/idea/cmd/crafting/ForgeController
description: "Forge an item at the anvil"
help: |
  Forge a metal good in one act — `forge knife`. You're the smith: you
  need the recipe learned by hand first (work it once with `heat` /
  `hammer` / `quench`), a hot forge in reach, the tools, and the stock.
  Steer the stock pick with `with`: `forge knife with iron ingot`.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: item
    type: string
    required: true
  - name: brand
    type: string
    required: false
    prepositions: [with]
