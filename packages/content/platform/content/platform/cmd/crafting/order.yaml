verbs: [order]
controller: /platform/idea/cmd/crafting/OrderController
description: "Order a cocktail from the menu"
help: |
  Order a drink off the menu — `order martini`. Whoever's tending the
  bar makes it and hands it to you. Name a brand with `with` to steer
  the pour: `order martini with bombay`.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: cocktail
    type: string
    required: true
  - name: brand
    type: string
    required: false
    prepositions: [with]
