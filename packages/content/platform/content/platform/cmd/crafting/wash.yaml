verbs: [wash]
category: crafting
controller: /platform/idea/cmd/crafting/WashController
description: "Wash something at water — a glass, a shirt, a floor — or your own hands"
help: |
  Wash a thing at water — `wash apron`, `wash shirt in basin with soap`.
  You need water in reach: a basin, a tap, a tub, a pail, a river.

  ⭐ What comes out depends on three things: the WATER'S HEAT, the TIME
  you give it, and the CLEANSER you use. Mud comes out in water. Grease
  will not — it wants soap or lye. Blood comes out in COLD water; hot
  water sets it, and then only a bleach will shift it. Soap in hard water
  scums and washes worse (washing soda softens it); the water's own look
  says whether it is soft or hard.

  ⚠ Washing can ruin a thing. Boiling felts wool, and felted wool is
  smaller and never stretches back. Hot water shrinks cloth. A harsh
  cleanser can eat the fibre. A colour that is not fast runs into
  everything washed with it. A trained eye can tell what a fibre will
  survive before it goes in; an untrained one finds out after.

  A washed garment comes out WET, and dries by itself — or faster by
  `dry`, on a line in the sun or a rack by the fire.

  Bare `wash` — with no thing named — washes your own HANDS (or your
  gloves, if you are wearing them). Clean hands treat a wound without
  infecting it, and handling a bleeding wound dirties them, so a careful
  medic washes between patients. Hands stay clean until something
  dirties them.

  `wash <thing> --hard` scrubs it: three times as long and much more
  effort, and it shifts what a quick wash leaves — baked-on grease, a
  grimed pane, a stained board, the floor of a busy shop. A scrubbing
  brush in hand or reach scrubs at the full rate; bare hands at half
  (`wash floor --hard using brush with soap`).
examples:
  - cmd: wash shirt in basin with soap
    note: Wash a shirt with soap in the basin
  - cmd: wash
    note: Wash your hands at the water in reach
  - cmd: wash board in basin with soap --hard
    note: Scrub a chopping board with soap
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  # ⭐ OPTIONAL and PLURAL (cleanliness D10). Named, we wash those things —
  # in ONE water, which is what lets an unfast dye bleed from one onto
  # another; bare, we wash your hands. ONE mixin, no alternation: every
  # washable thing composes Soilable (garments, vessels, kit, bandages,
  # floors, panes, lamps, seats).
  #
  # ⭐ HAND-FIRST (`reachable`), not the W2 audit's room-first: what you wash
  # is, in the common case, what you are holding — a glass, a shirt, the
  # knife you just butchered with — and the one world case, the floor, has a
  # word nothing in a hand answers to. Room-first bound the table's knife
  # over the boning knife in hand (food-safety, `wash boning`), and the tie
  # goes to the earlier try (D21).
  - name: target
    type: objects
    required: false
    scope: "reachable"
    requires: SoilableMixin
  # ⭐ WHAT IN — DECLARED, not hunted for (`lint:controller-resolution`). A
  # vessel of water, or the water a shore is beside — `wash shirt in
  # river`. The controller's narrowing (water or brine) is the check, and
  # a frozen water is refused unless there is a hole in it.
  - name: water
    prepositionRequired: true
    type: objects
    required: false
    prepositions: [in, under, at]
    # ⭐ The water answers for itself (`WaterDrawableMixin`, controller-liquidity
    # W7c): a basin, a tap, a tub, a pail, a shore — the read `rinse` makes.
    default: "reachable:[mixin.WaterDrawableMixin]"
    scope: ["reachable"]
    requires: any
  # ⭐ WHAT WITH — a cleanser: anything whose material a Cleanser row's
  # agent tag names (soap, lye, washing soda, fuller's earth, vinegar…).
  # Two may be used at once (`with soap and soda`). A thing that is no
  # cleanser is refused in words.
  - name: cleanser
    prepositionRequired: true
    type: objects
    required: false
    prepositions: [with]
    scope: ["reachable"]
    requires: any
  # ⭐ WHAT WITH — the brush, DECLARED (`lint:controller-resolution`): a
  # scrubbing brush in hand or reach scrubs at the full rate on `--hard`;
  # bare hands at half (`wash floor --hard using brush with soap`). It was
  # `scrub`'s slot until `scrub` became this verb's `--hard` (D8c).
  - name: brush
    prepositionRequired: true
    type: objects
    required: false
    prepositions: [using]
    default: "me:i:[capability.scrubbing],reachable:[capability.scrubbing]"
    scope: ["reachable"]
    requires: [ToolMixin]
options:
  hard:
    type: boolean
    description: "Scrub it — three washes' worth with a brush, half that by hand"
