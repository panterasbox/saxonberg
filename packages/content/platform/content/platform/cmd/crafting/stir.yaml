verbs: [stir]
category: crafting
controller: /platform/idea/cmd/crafting/StirController
description: "Work the drink you're building — the vessel decides how"
help: |
  Work the drink you're building — `stir shaker`. The tool is what knows:
  a shaker shakes it and a mixing glass stirs it, and it records how the
  build was mixed and takes a moment. Name the vessel (`stir mixing glass`)
  or leave it to the one you're building in.

  ⭐ `stir` is the build's alone. A batch pot, a glaze bucket or a paint
  pot is `knead`ed — what is in it decides whether that is a few minutes'
  stirring or a quarter-hour's kneading — and a butter churn is `churn`ed.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: vessel
    type: object
    required: false
    scope: "reachable"
    # ⭐ Bare `stir` works the build you are at — DECLARED, so the binder
    # resolves it (held first) instead of the controller walking for it
    # (`lint:controller-resolution`).
    default: "reachable:[mixin.ManualBuildMixin]"
    # ⭐ One host (controller-liquidity W18): the build vessel plans the
    # working (`ManualBuildMixin.stirPlan`) by the method the vessel names.
    requires: ManualBuildMixin
