verbs: [stir]
category: crafting
controller: /platform/idea/cmd/crafting/StirController
description: "Stir something runny — the drink you're building, a paint, a glaze"
help: |
  `stir` works what is RUNNY. ⭐ What is in the vessel decides:

  - **the drink you're building** — `stir shaker`. The tool is what
    knows: a shaker shakes it and a mixing glass stirs it, and it records
    how the build was mixed and takes a moment.
  - **a runny compound** — a paint pot, a glaze or slip tub, a plaster
    tub, a glass batch pot: a few light minutes fold what is in it into
    one blend, its make-up the inputs' by mass. Nothing is a recipe.

  ⭐ Stiff stuff is kneaded, never stirred: a pot of clay, raw rubber or a
  dough is refused — "too stiff to stir — knead it" (`knead`). And a
  butter churn is `churn`ed.
examples:
  - cmd: stir
    note: Work the drink you are building
  - cmd: stir pot
    note: Stir the paint pot's oil and pigment into one paint
  - cmd: stir "ash tub"
    note: Stir ash, clay and water into an ash glaze
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: vessel
    type: object
    required: false
    scope: "reachable"
    # ⭐ Bare `stir` works the build you are at — DECLARED, so the binder
    # resolves it (held first) instead of the controller walking for it
    # (`lint:controller-resolution`).
    default: "reachable:[mixin.ManualBuildMixin],reachable:[mixin.CompoundingMixin]"
    # ⚠ `any`, narrowed by the controller (W19): two hosts asked by method
    # — a build vessel (`ManualBuildMixin.stirPlan`) and a compounding one
    # (`Compounding.stirPlanFor`, refused when what is in it is stiff).
    requires: any
