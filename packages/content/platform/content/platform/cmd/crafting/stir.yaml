verbs: [stir, shake, churn]
controller: /platform/idea/cmd/crafting/StirController
description: "Stir or shake a build in progress, or churn a charge"
help: |
  Work the drink you're building — `stir` (or `shake`) the shaker. It
  records how the build was mixed and takes a moment. Name the vessel
  (`stir mixing glass`) or leave it to the one you're building in.

  `churn churn` works a butter churn's cream: at the right warmth it
  breaks into butter and buttermilk; too cold and it will not come.

  ⭐ `stir` a mixing vessel — a batch pot, a glaze bucket — and what is in
  it becomes one blend, its make-up the inputs' by mass. No recipe: a
  little more sand is a leaner batch. `knead` is the same act for a
  plastic mass.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: vessel
    type: object
    required: false
    scope: "reachable"
    # ⭐ Bare `stir` works the build you are at — DECLARED, so the binder
    # resolves it (held first) instead of the controller walking for it
    # (`lint:instrument-args`).
    default: "reachable:[mixin.ManualBuildMixin],reachable:[mixin.CompoundingMixin]"
    # ⭐ `any`, narrowed by the controller: a build vessel records the
    # method; a hand-worked vessel (a churn — dairy D5) works its charge.
    requires: any
