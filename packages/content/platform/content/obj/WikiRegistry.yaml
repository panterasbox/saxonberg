# /obj/WikiRegistry — the wiki's state and its one write chokepoint.
#
# Every mutator is gated `FromModule('/obj/command/system/WikiController')`,
# so resolving this singleton by template path yields a reference and a
# SecurityError on the first call. postRegister mints the `wiki-editors`
# group idempotently (the AccessRegistry seeding shape).
