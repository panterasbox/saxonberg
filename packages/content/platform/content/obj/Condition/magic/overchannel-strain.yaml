# Overchannel strain — the casting faculty's over-exertion injury:
# completing a cast whose cost exceeds the pool drives mana to zero and
# afflicts this (stage scaled by the deficit, magic.overchannel.*). While
# present it degrades casting (slower, weaker — read at cast time by
# MagicLogic); it clears by hysteresis when recovery carries the pool
# back past magic.overchannel.clearThreshold (the metabolism cascade's
# clear precedent, run by CasterMixin.reconcileFaculty). An IMPULSE
# consequence of the caster's own act — never suppressible, not dispel
# bait (it carries no magicOrigin; strain is real).
class: /obj/Condition
hydratorClass: /obj/persistence/PersistentHydrator
data:
  name: overchannel-strain
  signature: []
  progression: null
  resolution:
    by: rest
  observableSigns: [drawn, trembling-hands, glassy-eyed]
  contagion: null
