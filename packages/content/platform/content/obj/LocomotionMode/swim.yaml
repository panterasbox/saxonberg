# Swim — non-passthrough, enablement-gated. Quieter than walk because
# water muffles. bodyProfile horizontal — tripwires at ankle height
# miss a swimming actor.
class: /obj/LocomotionMode
hydratorClass: /obj/persistence/PersistentHydrator
data:
  name: swim
  speed: 0.5
  noiseLevel: quiet
  bodyProfile: horizontal
  groundContact: none
  requiresBodyPlanMode: [swim]
  requiresPosture: []
  costMultiplier: 2.0
  passthrough: false
  conveyanceMixin: null
  enablementMixin: SwimmableMixin
  medium: water
