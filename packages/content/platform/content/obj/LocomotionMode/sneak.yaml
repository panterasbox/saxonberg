# Sneak — the careful/quiet end of the care↔speed axis. A ground mode
# that brackets below walk: slower, crouched, and quiet. Any biped/
# quadruped that can walk can sneak (same body-plan requirement); the
# ground medium admits it on every `media: ['ground']` exit with no
# re-authoring. Its detection edge (moving carefully notices more) is
# NOT a field here — it's the `movement.attention.sneak` AppSettings
# dial read by PerceptionLogic (see docs/subsystems/concealment.md).
# The `quiet` noiseLevel is authored-as-data; its observer-side stealth
# use is the reserved stealth consumer.
class: /obj/LocomotionMode
hydratorClass: /obj/persistence/PersistentHydrator
data:
  name: sneak
  speed: 0.5
  noiseLevel: quiet
  bodyProfile: crouched
  groundContact: full
  requiresBodyPlanMode: [walk]
  requiresPosture: []
  costMultiplier: 1.5
  passthrough: false
  conveyanceMixin: null
  enablementMixin: null
  medium: ground
