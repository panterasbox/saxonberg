# Aerial — vehicular mode authored on airships / gliders. Loud,
# fully airborne, fastest in v1.
class: /obj/LocomotionMode
hydratorClass: /obj/persistence/PersistentHydrator
data:
  name: aerial
  speed: 3.0
  noiseLevel: loud
  bodyProfile: varied
  groundContact: none
  requiresBodyPlanMode: []
  requiresPosture: []
  costMultiplier: 0.4
  passthrough: false
  conveyanceMixin: null
  enablementMixin: null
  medium: air
