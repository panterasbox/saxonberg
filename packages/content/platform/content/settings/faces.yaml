# faces — application settings shipped by the platform pack (the `settings`
# kind: merge-missing). ⭐ A good has faces and a face carries coats
# (ceramics M6): these are the dials of what a coat does.
settings:
  # A glaze dipped on is a skin about a third of a millimetre thick.
  - key: faces.dipThicknessM
    value: "0.0003"

  # A coat that shrinks more than its body on cooling is in tension and
  # cracks — crazes. 1.5 × 10⁻⁶ /K of mismatch is where a potter sees it.
  - key: faces.crazeMismatch
    value: "0.0000015"

  # A face this soiled (grease, dust) when a glaze is laid on it, and the
  # glaze crawls back off bare patches at the fuse.
  - key: faces.crawlDirt
    value: "0.3"

  # A fired body at or under this open porosity holds water with no glaze —
  # stoneware does; terracotta weeps.
  - key: faces.holdsWaterBelow
    value: "0.03"

  # A porous inside face keeps a tenth of a fill's aromas and gives them to
  # the next — the crock that remembers the pickles.
  - key: faces.aromaRetained
    value: "0.1"

  # ⭐ A porous body set on or in a vessel runs its water THROUGH into it —
  # the ceramic filter — at this many liters an hour per liter held, per
  # unit of porosity: a filter candle of porous stoneware (≈ 0.12) passes
  # about half its fill in the first hour. A flow, so it is far faster
  # than the weep onto a jar's own outside.
  - key: faces.filterLPerHourPerL
    value: "5"

  # ⭐⭐ One leak (matter-model-overlaps D4): a vessel that, full, would lose
  # more than this share of what it holds in an hour — by its pores, its
  # flaws and its joints together — is not liquid-tight, and a pour into it
  # runs through to the floor. A terracotta jar's weep (≈ 0.003) is under
  # it; a sprung stave (0.4) and a cracked crock (≈ 0.19) are over.
  - key: faces.holdsLiquidBelowSharePerHour
    value: "0.05"

  # ⭐⭐ The ONE hole rule (D4): what an unmended crack or hole lets through
  # is `<kind>LPerHour × √head × scale` L/h — a vessel's head is its
  # liquid's depth and its scale one; a hull's head is her draft and her
  # scale her length. A full ten-litre crock that has cracked loses nearly
  # two litres in its first hour.
  - key: flaws.leak.crackLPerHour
    value: "4"
  # Tuned so the shipped rowboat (4.5 m, 0.25 m draft) takes 0.4 L/s through
  # a hole — under one bucket's 0.5 L/s, so bailing keeps her up — and the
  # Hesper (30 m, 1.2 m) about 5.8 L/s, near the 7.5 she shipped with.
  - key: flaws.leak.holedLPerHour
    value: "640"
  # A leaking vessel down to this many litres has run out: the rest goes,
  # and that moment is the one wake its leak arms (D9).
  - key: flaws.leak.dregsL
    value: "0.05"
