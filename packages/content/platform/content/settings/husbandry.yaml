# husbandry — application settings shipped by the platform pack (the
# `settings` kind: merge-missing — a key the app_settings singleton lacks is
# merged in; a value the operator changed via `config` is never touched).
settings:
  # Husbandry — the growth model's dials (placeholders for a running game).
  # Calibrated against the 12x clock: stressed ~1 real day after the water
  # runs out, dead ~1 real week of total neglect, seedling→mature ~2 real
  # weeks well kept. See docs/subsystems/husbandry.md.
  - key: husbandry.stepSec
    value: "43200"

  - key: husbandry.maxSteps
    value: "2000"

  - key: husbandry.vigorTauSec
    value: "3801600"

  - key: husbandry.goodAt
    value: "0.6"

  - key: husbandry.deathAt
    value: "0.12"

  - key: husbandry.rootFloor
    value: "0.4"

  - key: husbandry.band.thrivingAt
    value: "0.8"

  - key: husbandry.band.healthyAt
    value: "0.55"

  - key: husbandry.band.stressedAt
    value: "0.3"

  - key: husbandry.warmthFactor
    value: "0.03"

  - key: husbandry.warmthReferenceK
    value: "295"

  # Soil nutrient (phase 2) — the fourth limiting factor's ramp. Soil at or
  # above `nutrientHappyAt` is not a constraint; at or below
  # `nutrientSpentAt` it is a total one. A pot authors no nitrogen reserve
  # at all, so a houseplant never sees this axis.
  - key: husbandry.nutrientHappyAt
    value: "0.5"

  - key: husbandry.nutrientSpentAt
    value: "0.05"

  # The harvest grade ladder — floors on the plant's WORST limiting
  # satisfaction over its whole life. `masterful` needs a plant that was
  # never meaningfully short of anything, which is the intended difficulty:
  # one forgotten fortnight costs a band and cannot be nursed back.
  - key: husbandry.grade.fairAt
    value: "0.35"

  - key: husbandry.grade.fineAt
    value: "0.6"

  - key: husbandry.grade.exceptionalAt
    value: "0.8"

  - key: husbandry.grade.masterfulAt
    value: "0.95"
