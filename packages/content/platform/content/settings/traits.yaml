# traits — application settings shipped by the platform pack (the
# `settings` kind: merge-missing — a key the app_settings singleton lacks is
# merged in; a value the operator changed via `config` is never touched).
settings:
  # Traits — the disposition estimator dials (the personality layer). A
  # trait-position is the game-time-decayed signed sum of an axis's
  # valenced acts (clamped -100..+100); its evidence mass drives the
  # form→define→entrench band. Decay is GAME-time (character forms over a
  # lifetime): half-life 180 game-days. `defined`/`entrenched` are mass
  # cutoffs; `pronouncedThreshold` is the |position| an axis must reach to
  # count as a defining trait; `compatibilityScale` divides the raw
  # position dot-product into the regard range. See docs/subsystems/trait.md.
  - key: traits.decayHalfLifeDays
    value: "180"

  - key: traits.definedThreshold
    value: "20"

  - key: traits.entrenchedThreshold
    value: "60"

  - key: traits.pronouncedThreshold
    value: "25"

  - key: traits.compatibilityScale
    value: "100"
