# press — application settings shipped by the platform pack (the
# `settings` kind: merge-missing — a key the app_settings singleton lacks is
# merged in; a value the operator changed via `config` is never touched).
settings:
  # Press (news ticker) — the server-owned ticker semantics. The engine
  # ships the pins-first/recency window + soft-retract/expiry filtering;
  # these are the operator-tunable limits. tickerWindow caps the live
  # window; maxPins caps the pin block held at the top; the length knobs
  # bound an authored headline/body (validated at the `press` verb).
  - key: press.tickerWindow
    value: "30"

  - key: press.maxPins
    value: "3"

  - key: press.headlineMaxLength
    value: "120"

  - key: press.bodyMaxLength
    value: "4000"

  # Which publishers the ANONYMOUS start-screen press room shows — a
  # comma-separated list of organization paths (AppApi.setting returns a
  # string; there is no array type). Placement, not permission: being
  # listed here puts a publisher on the front door and says nothing about
  # who may read a given release. An entry that doesn't resolve is skipped
  # and logged at boot — a typo must not silently empty the page.
  - key: press.frontPage
    value: "/compact/press"
