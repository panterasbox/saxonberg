# weathering — application settings shipped by the platform pack (the
# `settings` kind: merge-missing — an operator's `config` change is never
# touched).
#
# ⭐ The shell clock (`WeatheringMixin`, harbors review 3): a house's
# paint and a ship's seams weather on ONE clock at ONE rate. Game-days
# from sound (1.0) to worn (0.5) — the linear slope's rate, so a full
# slide to dilapidated takes twice this. Reconciled on read; no
# scheduler. (It was `residence.weather.daysToWorn`, a residence pack key
# the kernel read; the clock is the kernel's, so its rate is too.)
settings:
  - key: weathering.daysToWorn
    value: "45"
