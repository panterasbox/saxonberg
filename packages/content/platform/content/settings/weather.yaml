# weather — application settings shipped by the platform pack (the
# `settings` kind: merge-missing — a key the app_settings singleton lacks is
# merged in; a value the operator changed via `config` is never touched).
settings:
  # Weather (Wave 2 light / sky) — cloud dimming on the sync light path +
  # the deterministic sky-read forecast window.
  - key: weather.cloudDimFactor
    value: "0.6"

  - key: weather.skyForecastSegments
    value: "2"

  # The day's temperature swing, in K either side of the day's mean,
  # lagged three hours — heat keeps leaving after the sun stops arriving,
  # which is why dawn is the cold part of the night. The climate
  # expression (settings/climate.yaml) reads it; the season itself is
  # derived from latitude since the climate build, and the old annual
  # cosine (`weather.solarAnnualSwingK`) is retired.
  - key: weather.solarDiurnalSwingK
    value: "4"
