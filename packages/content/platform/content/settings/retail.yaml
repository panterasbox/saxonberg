# retail — application settings shipped by the platform pack (the
# `settings` kind: merge-missing — a key the app_settings singleton lacks is
# merged in; a value the operator changed via `config` is never touched).
settings:
  # Retail — the general store. The per-consignor listing cap guards the
  # shared consignment shelf (anti-grief, the withdrawal-quota sibling); the
  # commission rate is the store's cut of a consignment sale (the remainder
  # settles to the consignor). See docs/subsystems/retail.md.
  # 24: a distributor's counter (the cash-and-carry) carries a case per
  # consigning outfit; the outfit hands consign only up to their headroom
  # (the `consigns` brain), so the cap is a ceiling, never a decline loop.
  - key: retail.consignment.listingCap
    value: "24"

  - key: retail.consignment.commissionRate
    value: "0.15"

  # The stocking rule's elasticity (economic bootstrap D14): a `stocking`
  # line asks base × (1 + e × (1 − onHand/par)) — an empty shelf asks
  # half again, a shelf at par asks base, one over par asks less. The
  # market-maker's ask: an offer, never an oracle.
  - key: retail.stockingElasticity
    value: "0.5"

  # The margin a shop asks over a supplier's price on a terms good it has
  # not priced itself (`house price <thing> <ask>` overrides).
  - key: retail.termsMargin
    value: "0.25"
