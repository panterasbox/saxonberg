# concealment — application settings shipped by the platform pack (the
# `settings` kind: merge-missing — a key the app_settings singleton lacks is
# merged in; a value the operator changed via `config` is never touched).
settings:
  # Concealment — effective-perception a viewer needs to notice a thing at
  # each concealed band (obvious = 0, no key). Monotone increasing. The band
  # names + ordering are code (lib/concealment/ConcealmentLevel.ts); these
  # are the tunable magnitudes. hiddenDefaultLevel = the band a legacy
  # Exit.hidden:true migrates to. See docs/subsystems/concealment.md.
  # ⭐ The band BELOW obvious, and it is NEGATIVE on purpose: a
  # conspicuous thing resolves for a viewer who would miss an ordinary
  # one. ⚠ `perceives` saturates below obvious and always will — an
  # obvious thing already always resolves — so this band earns its keep
  # on the ACTOR side, in the hide floor, not on the target side.
  - key: concealment.level.conspicuous
    value: "-2"

  - key: concealment.level.subtle
    value: "2"

  - key: concealment.level.hidden
    value: "4"

  - key: concealment.level.deep
    value: "7"

  - key: concealment.level.buried
    value: "11"

  - key: concealment.hiddenDefaultLevel
    value: "hidden"

  # Detection — the passive attention a viewer brings without actively
  # searching, and the perception "points" per awareness competence band
  # rank (capacity = rank x capacityPerBand). With the level requirements
  # above (subtle 2, hidden 4, deep 7, buried 11), a rank-1 novice
  # passively notices subtle; searching / higher bands reach the rest.
  - key: concealment.passiveBaseline
    value: "0"

  # Detection — the active-search loop (Phase 3). searchBonus: the attention
  # a broad `search` folds in (rank-0 seeker reaches `hidden`=4).
  # searchDepthBonus: extra for a narrow `search <container>`. searchSeconds:
  # the game-time the search holds the `hands` slot. hintCutoff: a concealed
  # thing within this gap of the viewer's perception surfaces a hint (`hidden`
  # hints a passive floor viewer). examineBonus: the smaller instantaneous
  # `examine` bump. See docs/subsystems/concealment.md.
  - key: concealment.searchBonus
    value: "4"

  - key: concealment.searchDepthBonus
    value: "3"

  - key: concealment.searchSeconds
    value: "4"

  - key: concealment.hintCutoff
    value: "4"

  - key: concealment.examineBonus
    value: "2"
