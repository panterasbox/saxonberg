# kick — application settings shipped by the platform pack (the
# `settings` kind: merge-missing — a key the app_settings singleton lacks is
# merged in; a value the operator changed via `config` is never touched).
settings:
  # Kick relay (read-only, webhook transport) dials. replayWindowSec: the
  # accept window around a delivery's signed timestamp; the dedup ring
  # bounds at-least-once redelivery; resolveCacheTtlMs: slug →
  # broadcaster-id cache. See docs/subsystems/streaming.md.
  - key: kick.replayWindowSec
    value: "300"

  - key: kick.dedupTtlSec
    value: "900"

  - key: kick.dedupMaxSize
    value: "4096"

  - key: kick.resolveCacheTtlMs
    value: "3600000"
