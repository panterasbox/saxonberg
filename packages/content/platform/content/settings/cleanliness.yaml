# cleanliness — the soil bands and the dials of the acts that move dirt.
#
# ⭐ None of these is a clock. Dirt arrives because an act put it there
# and leaves because an act took it away; these only say how much an act
# moves and where the words change.
settings:
  # The load at which a thing reads MARKED, SOILED and FILTHY. A load is a
  # dimensionless amount of dirt at a site (a hand, a garment, a floor):
  # one bare-handed butchering puts about a soiled's worth on the hands.
  - key: cleanliness.band.markedAt
    value: "0.1"
  - key: cleanliness.band.soiledAt
    value: "0.4"
  - key: cleanliness.band.filthyAt
    value: "1"

  # The share of what is on a mover's feet a floor takes at each crossing
  # — and the feet lose. ⭐ Why a shop floor soils with its customers: the
  # mud is brought in, by them, from wherever they walked.
  - key: cleanliness.traffic.trackIn
    value: "0.2"

  # The share of a dirty glove's load that a QUICK removal leaves on the
  # bare hand under it — the doffing problem nurses are trained on.
  # `remove gloves carefully` is slower and leaves none.
  - key: cleanliness.doff.transfer
    value: "0.5"

  # The debris load (crumbs, manure, sweepings) on a floor at which — with
  # open food lying in the room — pests come. Sweep up, and they go.
  - key: cleanliness.pests.debrisAt
    value: "0.4"
