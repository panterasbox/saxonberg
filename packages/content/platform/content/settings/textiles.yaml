# textiles — the clo derivation's reference constants and the two fit /
# wind coefficients.
#
# ⚠ What is NOT here is deliberate. `R_CLO = 0.155 m²·K/W` is the
# definition of the unit; the thermal conductivities of still air
# (0.026) and water (0.6) are facts about the world. None of those is a
# dial and none of them ships as one — an operator who could move them
# could make wool behave like steel. What an operator MAY move is the
# reference body these numbers are stated against, and the weight of the
# two consequences below.
settings:
  # The reference whole-body surface (m²) a garment's covered area is a
  # share of — a biped-ish adult. A garment's own `slotClaims` pick out
  # which parts it covers; this says how big the whole body is.
  - key: textiles.clo.referenceSurfaceM2
    value: "1.8"

  # The share assumed for a garment whose `slotClaims` resolve to no
  # body plan (a fixture, a stock row authored before its plan existed).
  # A fallback, not a default: a real garment always resolves.
  - key: textiles.clo.defaultCoveredFraction
    value: "0.3"

  # The `waterAbsorptionCapacity` (%) at which a soaked material's loft
  # counts as fully flooded. ⭐ This is what decides how far apart wet
  # wool (33%) and wet linen (20%) end up — set it at or below 33 and
  # wool saturates, which flattens the distinction the whole wet model
  # exists to show.
  - key: textiles.clo.absorptionReference
    value: "40"

  # How much of a covered part's insulation an air gap costs at maximum
  # looseness. A garment cut for a bigger body does not hug, and the
  # trapped air it should have held convects away instead.
  - key: textiles.fit.loosenessCloPenalty
    value: "0.35"

  # How much of the wind chill a fully close-woven, DRY outer layer
  # removes. Not all of it: a coat is not a wall, and a hard enough wind
  # still finds you.
  - key: textiles.windproofWeight
    value: "0.9"

  # Extra placement coupling per unit of a worn garment's tightness.
  # Clothes cut for a smaller body BIND, and binding is a real load on a
  # body that has to move in them.
  - key: textiles.fit.tightnessBurden
    value: "0.5"

  # Extra seam wear per unit of tightness, as a multiplier on the
  # EXISTING per-blow decrement. ⚠ A multiplier, never a clock: a
  # garment in a wardrobe does not wear out.
  - key: textiles.fit.tightnessWear
    value: "1.5"

  # The fit distance above which a garment simply will not go on.
  # ⭐ A halfling's coat on a dragonborn fails on a NUMBER rather than a
  # species check, so a heavy human and a light dragonborn shade into
  # each other correctly. Raise it and hand-me-downs get more forgiving;
  # lower it and the tailor gets more business.
  - key: textiles.fit.refuseAbove
    value: "0.35"

  # ── the dye bath ──
  # Fraction of remaining colour a FULLY UNBOUND dye loses per wash. It
  # is scaled by `1 − fastness`, so ⭐ this number IS the failure mode:
  # dye something un-mordanted and the colour does not hold, which is
  # the "something to be bad at" every competence answer needs to be
  # visible against.
  # ⭐ Near-total on purpose: at fastness 0 the colour goes below
  # legibility in ONE wash, so an un-mordanted piece really does wash
  # straight out. Lower it and the failure mode stops being felt.
  - key: textiles.dye.washLoss
    value: "0.95"

  # How much the bond itself weakens per wash. Small on purpose: good
  # work should last, and still eventually need redoing — the craft's
  # value is in the upkeep, not the one-time act.
  - key: textiles.dye.bondLoss
    value: "0.05"

  # Application strength below which a colour stops reading at all and
  # the thing is undyed again. ⭐ Fading is desaturation; this is where
  # desaturation bottoms out.
  - key: textiles.dye.legibleAt
    value: "0.08"
