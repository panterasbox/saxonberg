# water — the water place (underwater build): how deep is wading, how the
# column under a deep water is banded. Shipped by the platform pack (the
# `settings` kind: merge-missing — an operator's `config` change is never
# touched).
settings:
  - key: water.column.wadeM
    value: "1.5"
  - key: water.column.minBandM
    value: "2"
  - key: water.column.darkBandM
    value: "10"
  - key: water.column.maxDarkBands
    value: "5"
