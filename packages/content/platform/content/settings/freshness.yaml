# freshness — application settings shipped by the platform pack (the
# `settings` kind: merge-missing — a key the app_settings singleton lacks is
# merged in; a value the operator changed via `config` is never touched).
settings:
  # Spoilage — the per-object microbial-load gauge (0..1). Growth is
  # logistic from an inoculum, reconcile-on-read over game-time, with the
  # rate μ = μ_max · f_T(T) · f_aw(a_w). The per-material half of that law
  # (activation energy, water activity) is tabulated on the Material, not
  # here. See docs/subsystems/spoilage.md.
  - key: freshness.muMaxPerHour
    value: "0.35"

  - key: freshness.referenceK
    value: "303"

  # 273 K — below freezing the water is ice and growth pauses. A thawed
  # thing resumes where it left off; freezing is not a reset.
  - key: freshness.freezingK
    value: "273"

  # 333 K (60 °C) — the pasteurization floor, where the flora starts dying
  # faster than it grows. This is the temperature cooking has to reach.
  - key: freshness.killK
    value: "333"

  - key: freshness.killRatePerHour
    value: "6"

  # ⭐⭐ The kill is a RATE, not a line you cross, and this is its
  # steepness. 200 kJ/mol is in the real range for thermal death of
  # vegetative bacteria: at 60 °C the base rate halves the population in
  # about seven minutes; at 100 °C the same population is gone in under a
  # second. That is why a sear and a simmer arrive at the same place and a
  # lazy warm-through does not.
  - key: freshness.killActivationEnergy
    value: "200000"

  # 0.60 a_w — the classical floor for microbial growth. Honey, dried
  # salt, sugar and spirits all sit under it, which is why they keep.
  - key: freshness.awFloor
    value: "0.6"

  - key: freshness.awDefault
    value: "0.97"

  - key: freshness.inoculum
    value: "0.002"

  - key: freshness.ambientK
    value: "293"

  - key: freshness.band.taintedAt
    value: "0.25"

  - key: freshness.band.spoiledAt
    value: "0.6"

  - key: freshness.band.rottenAt
    value: "0.85"

  # Nothing under this load carries a dose at all — a barely-turned ration
  # is unpleasant, not poisonous.
  - key: freshness.dose.onsetLoad
    value: "0.3"

  # mg of ptomaine a FULLY rotten serving carries; the curve from the
  # onset to here is superlinear. Compare the authored spoiled-ration row
  # (700 mg), which sits deliberately below a fully rotten dose.
  - key: freshness.dose.scaleMg
    value: "900"

  # ⭐ Light-strike (glass build D8) — a PHOTOCHEMICAL spoilage term, not a
  # microbial one: a `light-sensitive` material (beer) goes off under the
  # light its vessel lets in, fastest in a clear bottle and slowest in a
  # brown one, because photochemistry lives in the blue. Additive on the
  # same gauge, so it bites even on a material with no microbial clock.
  #
  # The rate per hour at the reference illuminance through a fully
  # blue-transparent holder. 30/h drives a clear bottle in full sun from
  # fresh to tainted in minutes — the "light-struck in the sun" fact.
  - key: freshness.lightStrike.ratePerHour
    value: "30"

  # The illuminance (lux) at which that full rate is reached; brighter is
  # clamped to it. 50000 ≈ a clear sky at midday.
  - key: freshness.lightStrike.referenceLux
    value: "50000"
