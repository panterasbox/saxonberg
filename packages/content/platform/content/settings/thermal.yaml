# thermal — application settings shipped by the platform pack (the
# `settings` kind: merge-missing — a key the app_settings singleton lacks is
# merged in; a value the operator changed via `config` is never touched).
settings:
  # Thermal (Wave 2 wet coupling) — a wet body loses heat faster.
  - key: thermal.wetHeatLossFactor
    value: "1.5"

  # ⭐ The water an active swimmer is comfortable in, K (24 °C — a pool's
  # temperature). Colder water pulls a body down by the gap AGAIN (water
  # conducts ~23× better than air): a near-freezing pool reads far colder
  # than near-freezing air, and a summer swim chills nobody (storage-and-ice).
  - key: thermal.waterNeutralK
    value: "297"

  # ⭐ A firing whose dose-weighted burner completeness sat below this was
  # REDUCING (ceramics D3): a clay rung takes its reducing twin — the blue
  # brick, celadon. The clamp's banked draught (≈ 0.53) is reducing.
  - key: thermal.heatWork.reducingBelow
    value: "0.55"
