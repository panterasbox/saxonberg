# cordage — application settings shipped by the platform pack (the
# `settings` kind: merge-missing). ⭐ One rope; its use is where its ends
# are tied (cordage). These are the dials of what a rope holds and how it
# wears. All grain — an author's to change.
settings:
  # A fiber's tenacity follows its material's toughness: hemp (4) gives
  # 100 MPa, flax (3) 75, jute (2) 50 — so a 12 mm hemp rope breaks at
  # about a tonne and a 6 mm one at under 300 kg.
  - key: cordage.tenacityMPaPerToughness
    value: "25"

  # A reef knot is a binding knot: load one end harder than the other — a
  # climber carrying this much — and it spills.
  - key: cordage.unevenLoadKg
    value: "10"

  # What one climb at the rope's full strength takes off it where it goes
  # over the lip; a light climber on a heavy rope takes almost nothing.
  - key: cordage.chafePerUse
    value: "0.06"

  # A plant fiber rots wet. Fully soaked for a game day, an untarred rope
  # loses this share of its strength; a tarred one loses none.
  - key: cordage.rotPerWetDay
    value: "0.03"

  # A rope shorter than this does not reach anyone below a drop.
  - key: cordage.minHangM
    value: "3"

  # A fall caught on a rope jerks it at this many times the climber's
  # weight.
  - key: cordage.fallFactor
    value: "3"
