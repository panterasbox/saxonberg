# detection — application settings shipped by the platform pack (the
# `settings` kind: merge-missing — a key the app_settings singleton lacks is
# merged in; a value the operator changed via `config` is never touched).
settings:
  - key: detection.capacityPerBand
    value: "3"

  # The watched share (organism-biology D11): perception points per unit
  # of the eyes' field beyond a person's 190°, × 360. A cow (330°) adds
  # about +2.3 and spots a `subtle` hide a wolf (250°, +1) misses.
  - key: detection.watchWeight
    value: "6"
