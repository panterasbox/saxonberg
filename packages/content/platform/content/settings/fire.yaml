# fire — application settings shipped by the platform pack (the
# `settings` kind: merge-missing — a key the app_settings singleton lacks is
# merged in; a value the operator changed via `config` is never touched).
settings:
  # Fire (combustion driver) — see docs/subsystems/fire.md. SHAPE (the fire
  # triangle, the energy balance) is code; these are the magnitudes.
  - key: fire.burnRatePerMin
    value: "0.5"

  - key: fire.flameTemperatureK
    value: "1000"

  - key: fire.ignition.waterLatentHeatJPerKg
    value: "2260000"

  - key: fire.ignition.maxManualDryingK
    value: "150"

  - key: fire.tickIntervalSeconds
    value: "30"

  - key: fire.radiantJoulesPerTick
    value: "700000"

  - key: fire.crossBoundaryFraction
    value: "0.4"

  - key: fire.flameTemperatureIncompleteK
    value: "750"

  # ⭐⭐ The oxygen leg, after the fire build: air is DERIVED from the
  # enclosure (openings per hour), not authored as a `%` Reserve on eight
  # rooms — four of which never even composed the mixin to hold it. These
  # are shares of the scope's medium, not percentages of a budget.
  #
  # ⚠⚠ **These are DISPLACEMENT shares, and that is what fixes their
  # magnitude.** The question a fire asks is *how much of what is around
  # me is still air I can draw oxygen out of* — so 0.85 means a fire
  # starves once a sixth of its scope is its own exhaust, which is where
  # a real fire in a real closed room starves.
  #
  # ⭐ A first pass set these near 1 (0.93/0.88) by reasoning from CO2's
  # TOXICITY — dangerous to breathe at 5 % — and that conflates two
  # different hazards. Displacement is about the oxygen left; toxicity is
  # the material's own `toxicity` tag and is what makes smoke dangerous
  # long before it is suffocating. ⛔ And the conflation broke firedamp:
  # at 0.95 a heading holding 14 % methane read as unbreathable, so the
  # canary would have reacted to it — which is the one thing the third
  # damp must NOT do, because its whole design is that the bird is honest
  # and is answering a different question.
  #
  # ⚠ Recorded seam: carbon dioxide genuinely is toxic near 5 %, and it
  # authors no `toxicity` because that would need a `carbonDioxide` toxin
  # type and a `Condition` row behind it to mean anything. So a shut
  # cellar today warns you by displacement rather than by poisoning, a
  # little later than it should. The metabolism tail owns the fix.
  - key: fire.air.completeAirShare
    value: "0.85"

  # Strictly below atmosphere.breathableAirShare (0.76)? No — ABOVE it, and
  # on purpose: a body stops coping at 0.76 and a fire starves at 0.70, so
  # the person in the room is in trouble BEFORE the fire goes out. A fire
  # dying in the dark is not an alarm.
  - key: fire.air.smotherAirShare
    value: "0.70"

  - key: fire.air.achPerOpening
    value: "4"

  - key: fire.air.achInterior
    value: "1"

  - key: fire.air.achLeak
    value: "0.1"

  # Exhaust. A kg of wood burns to about 1.8 kg of carbon dioxide, which is
  # ~950 L at room temperature. ⭐ This is the conservation leg and it is
  # emitted whether the fire is running well or badly — a clean fire is not
  # a harmless one, which is the whole carbon-monoxide-free half of the
  # cellar lesson.
  - key: fire.exhaust.litresPerKg
    value: "950"

  # Soot, on top, and only while combustion is incomplete. ⭐ Luminosity is
  # incandescent soot: this is the same number the light model reads.
  - key: fire.exhaust.smokeLitresPerKg
    value: "300"

  - key: fire.exhaust.smokeMaterial
    value: "/stuff/idea/material/gas/smoke"

  - key: fire.exhaust.carbonDioxideMaterial
    value: "/stuff/idea/material/gas/carbon-dioxide"

  # ── the burner (the fire build): fuel, draught, power, heat, light ──

  # ⭐ The duration term. 1500 W/kg means a 6 kg oak charge in an 8 kW
  # hearth burns at the hearth's rate for most of its life and tails off;
  # a 1 kg stick cannot feed the hearth at all and is gone in minutes.
  - key: fire.power.perKgW
    value: "1500"

  # Flame temperature from the fuel's heat of combustion. At 300 + 65×MJ/kg:
  # oak (16) → 1340 K, peat (15) → 1275, coal (28) → 2120, charcoal (30) →
  # 2250. ⭐ The smelting furnace's 1590 K ceiling is reachable with
  # charcoal and NOT with wood, so its own sentence "this fuel does not
  # burn hot enough" is arithmetic now.
  - key: fire.flame.baseK
    value: "300"

  - key: fire.flame.kPerMJkg
    value: "65"

  # The 1000/750 continuity: a fully starved fire holds three quarters of
  # the temperature it could reach.
  - key: fire.incompleteTemperatureFactor
    value: "0.75"

  # ⭐⭐ Luminosity is incandescent soot. A clean gas flame is dim (0.15 of
  # its vessel's authored ceiling) — that is the mantle problem, arriving
  # by itself. A solid fuel's flame carries particles and stays luminous
  # (0.6) even running well, which is why opening a hearth's vents makes it
  # noticeably dimmer without putting the room in the dark.
  - key: fire.light.cleanFloor
    value: "0.15"

  - key: fire.light.sootyFloor
    value: "0.6"

  - key: fire.light.fullSizeFraction
    value: "0.25"

  # ⭐⭐ Banking. The floor you cannot shut a fire below — 5 % of its
  # draught, so a banked hearth burns at a twentieth of its rate and keeps
  # for twenty times as long. "Bank it and come back" needs no mechanism.
  - key: fire.draught.banked
    value: "0.05"

  - key: fire.burner.defaultMaxPowerW
    value: "8000"

  - key: fire.burner.defaultCapacityKg
    value: "10"

  # A worked flame burns nothing, so its exhaust is priced as if it were
  # burning wood. Conservation needs a figure; this is the honest one.
  - key: fire.workedFlame.mjPerKg
    value: "16"

  # ── the air itself as fuel (firedamp) ──
  #
  # ⭐ 5 % is methane's real lower explosive limit, and Ferrow's measures
  # give off ~14 % into dead air — so a deep, dead-ended heading is
  # genuinely dangerous and the adit is not. ⚠ And both numbers sit well
  # under the share that would stop a canary singing, which is the design:
  # the bird is honest and the bird is answering a different question.
  - key: fire.flammable.ignitesAt
    value: "0.05"

  # The flash, at exactly the explosive limit, scaled by how rich the
  # mixture was. Enough to hurt badly and not reliably enough to kill,
  # which is what a firedamp flash mostly did — into the one HEAT channel,
  # so a wet coat helps and a mail shirt does not.
  - key: fire.flammable.flashEnergy
    value: "90000"

  # ⭐⭐ 1 %, a fifth of the ignition limit: the flame wears its blue cap
  # long before the air will go off. A tell that arrived at the same
  # fraction as the flash would not be a warning, it would be an epitaph.
  - key: fire.flammable.capAt
    value: "0.01"
