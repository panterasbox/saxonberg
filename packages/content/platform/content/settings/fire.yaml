# fire — application settings shipped by the platform pack (the
# `settings` kind: merge-missing — a key the app_settings singleton lacks is
# merged in; a value the operator changed via `config` is never touched).
settings:
  # Fire (combustion driver) — see docs/subsystems/fire.md. SHAPE (the fire
  # triangle, the energy balance) is code; these are the magnitudes.
  - key: fire.burnRatePerMin
    value: "0.5"

  - key: fire.flameTemperatureK
    value: "1000"

  - key: fire.ignition.waterLatentHeatJPerKg
    value: "2260000"

  - key: fire.ignition.maxManualDryingK
    value: "150"

  - key: fire.tickIntervalSeconds
    value: "30"

  - key: fire.radiantJoulesPerTick
    value: "700000"

  - key: fire.crossBoundaryFraction
    value: "0.4"

  - key: fire.flameTemperatureIncompleteK
    value: "750"

  # ⭐⭐ The oxygen leg, after the fire build: air is DERIVED from the
  # enclosure (openings per hour), not authored as a `%` Reserve on eight
  # rooms — four of which never even composed the mixin to hold it. These
  # are shares of the scope's medium, not percentages of a budget.
  #
  # ⚠ Why the numbers are so close to 1. The contents are the fire's actual
  # EXHAUST, not "spent air" — a kg of wood makes about 950 L of carbon
  # dioxide — so the fractions that matter are small: CO2 is dangerous to
  # breathe at 5 % of the air and lethal near 10 %, and a fire is starving
  # well before it is standing in a tenth of its own smoke. Setting these
  # at 0.85/0.70 (where a plan's first guess put them) would mean a room
  # had to be a QUARTER exhaust before anyone noticed, which is both
  # unphysical and so slow the lesson never lands in a session.
  - key: fire.air.completeAirShare
    value: "0.93"

  # Strictly below atmosphere.breathableAirShare (0.95), which is the whole
  # point: a person in a shut room is told the air is going bad BEFORE the
  # fire smothers itself.
  - key: fire.air.smotherAirShare
    value: "0.88"

  - key: fire.air.achPerOpening
    value: "4"

  - key: fire.air.achInterior
    value: "1"

  - key: fire.air.achLeak
    value: "0.1"

  # Exhaust. A kg of wood burns to about 1.8 kg of carbon dioxide, which is
  # ~950 L at room temperature. ⭐ This is the conservation leg and it is
  # emitted whether the fire is running well or badly — a clean fire is not
  # a harmless one, which is the whole carbon-monoxide-free half of the
  # cellar lesson.
  - key: fire.exhaust.litresPerKg
    value: "950"

  # Soot, on top, and only while combustion is incomplete. ⭐ Luminosity is
  # incandescent soot: this is the same number the light model reads.
  - key: fire.exhaust.smokeLitresPerKg
    value: "300"

  - key: fire.exhaust.smokeMaterial
    value: "/stuff/idea/material/gas/smoke"

  - key: fire.exhaust.carbonDioxideMaterial
    value: "/stuff/idea/material/gas/carbon-dioxide"
