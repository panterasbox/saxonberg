# green — application settings shipped by the platform pack (the `settings`
# kind: merge-missing). ⭐ Green ware (ceramics M4): an unfired clay body's
# state is its DRYNESS — 0 just thrown, 1 as dry as the air allows — so
# "bone-dry" means as dry as this air will make it, damp shed or dry loft.
settings:
  # Firm enough to trim, join and stamp.
  - key: green.leatherAt
    value: "0.3"

  # Ready for the kiln — a wetter piece bursts as steam when it is fired.
  - key: green.boneDryAt
    value: "0.85"

  # A soft piece whose wetness rises this much between looks (rain on an
  # open yard) slumps out of its shape. The hack cover is what stops it.
  - key: green.slumpWetting
    value: "0.15"

  # Dried faster than its clay stands: dryness gained per hour × the clay's
  # crack risk (fat clay high, sand and grog low) past this checks it.
  - key: green.crackRate
    value: "0.05"
