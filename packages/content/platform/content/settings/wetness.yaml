# wetness — application settings shipped by the platform pack (the
# `settings` kind: merge-missing — a key the app_settings singleton lacks is
# merged in; a value the operator changed via `config` is never touched).
settings:
  # Wetness (weather Wave 2) — the per-object saturation gauge (0..1).
  # Drainage is reconcile-on-read (presence-frozen); accrual is pushed by
  # rain exposure / immersion. See docs/subsystems/weather.md.
  - key: wetness.evaporationRatePct
    value: "1.25"

  # The reference air for drying: still indoor air at this humidity (and
  # 20 °C) dries a thing at its material's own rate; the air it is really
  # in — humidity deficit, wind, the matter's heat — scales that (B56).
  - key: wetness.referenceHumidityPct
    value: "50"

  # A rub with a cloth takes this share of the water it has room for — never
  # the last film (`Wet.soakUp`, B56).
  - key: wetness.blotTakes
    value: "0.9"

  # A soaked body carries this much water per m² of skin — the film a towel
  # takes (skin area by Meeh's law over the body's mass, B56).
  - key: wetness.skinFilmKgPerM2
    value: "0.2"

  - key: wetness.rainAccrualPerHour
    value: "1.5"

  - key: wetness.immersionSaturation
    value: "1"

  - key: wetness.band.dampAt
    value: "0.15"

  - key: wetness.band.wetAt
    value: "0.45"

  - key: wetness.band.soakedAt
    value: "0.8"

  - key: wetness.absorptionCapacityDefaultPct
    value: "5"
