# stealth — application settings shipped by the platform pack (the
# `settings` kind: merge-missing — a key the app_settings singleton lacks is
# merged in; a value the operator changed via `config` is never touched).
settings:
  # Stealth (hide) — the hider's derived concealment level (the actor-face,
  # the opposed sibling of awareness/detection). score = stealth-rank ×
  # competencePerBand + cover × coverWeight + darkness × lightWeight +
  # stillnessBonus(low posture); mapped to a ConcealmentLevel band by the
  # thresholds below. With competencePerBand=2 and band.hidden=4, a
  # `competent`(rank 2) hider in a lit empty room reaches `hidden`(req 4):
  # a competent-awareness watcher (capacity 6) perceives, a novice (3) does
  # not. A score below band.subtle fails to conceal (obvious). See
  # docs/subsystems/stealth.md.
  - key: stealth.hide.competencePerBand
    value: "2"

  - key: stealth.hide.coverWeight
    value: "1"

  - key: stealth.hide.lightWeight
    value: "1"

  - key: stealth.hide.stillnessBonus
    value: "1"

  # The hide score BELOW which a failed hide bottoms out one band WORSE
  # than obvious. ⭐ The floor is no longer flat: a person in a hi-vis
  # vest who tries to hide is easier to see than one in grey, not merely
  # equally visible.
  - key: stealth.hide.band.conspicuous
    value: "-1"

  # How many concealment band-ranks a fully conspicuous (or fully quiet)
  # worn covering is worth in the hide score. ⭐ Derived from the
  # garment's own colour and weave — a pack authoring a new dye gets
  # concealment behaviour for free, and nobody writes `isCamouflage`.
  # ⚠ ABSOLUTE, not terrain-matched: real camouflage is a relationship
  # to a background and belongs to the search slate.
  - key: stealth.hide.coveringWeight
    value: "1.5"

  - key: stealth.hide.band.subtle
    value: "0"

  - key: stealth.hide.band.hidden
    value: "4"

  - key: stealth.hide.band.deep
    value: "7"

  - key: stealth.hide.band.buried
    value: "10"
