# wiki — application settings shipped by the platform pack (the
# `settings` kind: merge-missing — a key the app_settings singleton lacks is
# merged in; a value the operator changed via `config` is never touched).
settings:
  # ── wiki: the render budget. A page is community-authored input that
  # runs a resolver, so every bound below fails with an inline error
  # rather than a hang. Operator-tunable without a deploy; absent rows
  # fall through to RenderBudget.DEFAULTS. See docs/subsystems/wiki.md.
  - key: wiki.render.snippetDepth
    value: "8"

  - key: wiki.render.maxSnippets
    value: "200"

  - key: wiki.render.maxComponents
    value: "100"

  # ⚠⚠ 5000, raised from 2000 by the base-class narrowing build. The
  # `<composition kind="mixin">` inverse answers *what in this world has
  # this capability* by scanning every template there is (1922 rows over
  # 684 backing classes today), which lands at ~1.2–2.3 s — so the widest
  # mixins sat on the old bound and crossed it intermittently.
  #
  # ⭐ A component that exceeds its budget renders its FAILURE into the
  # page, and to a reader that is indistinguishable from *nothing
  # composes this*. A bound that fires on legitimate work is not a safety
  # rail; it is a source of quiet wrong answers. See the matching note in
  # `RenderBudget.DEFAULTS`.
  - key: wiki.render.componentTimeoutMs
    value: "5000"

  - key: wiki.render.maxOutputChars
    value: "200000"
