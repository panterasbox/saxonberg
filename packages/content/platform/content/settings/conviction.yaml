# conviction — application settings shipped by the platform pack (the
# `settings` kind: merge-missing — a key the app_settings singleton lacks is
# merged in; a value the operator changed via `config` is never touched).
settings:
  # Conviction — the spend half. A held position's weight ramps linearly to
  # full over one build period of unbroken hold (a flip resets it). 7 days
  # real-time, so conviction rewards sustained commitment over a snap vote.
  - key: conviction.buildPeriodSeconds
    value: "604800"
