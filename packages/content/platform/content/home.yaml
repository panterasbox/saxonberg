# /home — per-player namespace root in the template tree.
# Holds player-scoped content: per-player draft templates, named
# eval scripts (--save future landing), home-tier preferences.
# Each player gets a /home/<playerId>/ sub-folder lazily on first
# use; that's a future landing, not v1.
#
# A real Zone seed (not just a path string) is required so the
# folder/leaf invariant accepts any future descendant template
# under /home/...
class: /platform/idea/HomeZone
# ⭐ `wire: true` below reaches the instance because the row HAS data —
# the applier runs on that alone since 2026-10-01. This comment used to
# warn that a missing `hydratorClass` would leave the flag sitting in the
# row, unapplied, so a circle that did not know it was wire would run its
# code GOVERNED instead of quarantined. That failure is structurally gone.
data:
  name: home
  # Wire-classification root (sandbox, Decision O): every descendant of
  # /home inherits wire-ness through the Zone.lookupField walk.
  wire: true
