# from — hanging.
#
# A ham from a meat hook, a coat from a peg, a line of herbs from a
# beam. The whole point of the vocabulary: a player who has learned `on`
# needs no explanation for this, because the relation and the
# preposition are the same thing.
#
# ⭐ `on` is a SECONDARY word here, so `put ham on hook` works at a host
# that only offers `from` — and the response says *hang … from*, which
# is how the world teaches the word without a tutorial. It never steals
# `on`'s own key: a primary always wins its word.
prepositions: [from, on]
encloses: false
# ⭐ Size and carrying D4–D5: a host's `from` member is bounded by its
# LENGTH (each hung thing takes its hanging width) and by the mass its
# material bears — a belt, a rail, a strap, a key ring. And a hung thing is
# clipped or tied: it stays put under water and at zero gravity.
hangs: true
fastens: true
prose: "{{ actor }} hang{{ s }} {{ item }} from {{ host }}."
heading: Hanging from it
