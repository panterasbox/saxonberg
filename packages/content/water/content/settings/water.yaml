# water — the watershed's dials (the `settings` kind: merge-missing — a
# key the app_settings singleton lacks is merged in; a value the operator
# changed via `config` is never touched).
#
# ONE file for the whole build rather than dials scattered across
# weather / husbandry / conduit, because these numbers only make sense
# read against each other: how hard it rains decides how much a bed
# gets, which decides how much a reach carries, which decides whether a
# right binds. See docs/subsystems/watershed.md.
#
# ⚠ Every key here has a seeded literal at its call site — the authored
# `PRECIPITATION_RATES_MM_PER_HOUR` table in the kernel. So the kernel
# rains correctly with this pack absent, and these keys only ever RETUNE
# what already works. A dial that only works when a pack is installed is
# a dial that fails silently.
settings:
  # Precipitation rates, in millimetres of liquid water equivalent per
  # HOUR. These are six-hour SEGMENT AVERAGES, not instantaneous
  # intensities: our weather is piecewise-constant, so a `rain` segment
  # rains for six hours straight. Real moderate rain is ~2.5 mm/h but
  # never for six hours together, so the figures below are the averages
  # that reproduce a plausible annual total under the shipped transition
  # grammar — a wet temperate valley, not a desert and not a rainforest.
  # `WeatherType.test.ts` pins that total.
  - key: water.rate.rain
    value: "0.3"

  # A storm is four times a shower and shares its `rain` descriptor —
  # which is exactly why the rate table keys on the weather TYPE rather
  # than on what falls out of it.
  - key: water.rate.storm
    value: "1.2"

  # Snow's figure is its WATER EQUIVALENT — what melts out of it, not
  # how deep the drift is. It banks rather than running off; the
  # release is the spring rise.
  - key: water.rate.snow
    value: "0.25"

  # ── flow ──────────────────────────────────────────────────────────
  # The fraction of precipitation that reaches a channel rather than
  # evaporating or soaking away. The remainder is simply not modelled —
  # mass conservation at watershed scale is an explicit non-goal: the sky
  # supplies and the sea absorbs, and conservation applies to water in a
  # VESSEL, which is where a player can actually count it.
  - key: water.runoffCoefficient
    value: "0.35"

  # The catchment's response window, in game-days. Flow is the MEAN
  # precipitation over it — which is what gives a river a lagged, damped
  # hydrograph instead of a channel that empties during a dry week and
  # floods the instant it rains. Real catchments store water; this number
  # is how long this one holds it.
  - key: water.baseflowWindowDays
    value: "30"

  # ── snowpack ──────────────────────────────────────────────────────
  # ⭐ The snowpack is the KERNEL's since the climate build
  # (`WeatherApi.snowCoverAt` — the same pack a floor reports lying on
  # it), walked back to the last melt-out (`climate.walkback.*` in the
  # platform's climate settings). The old fixed window is retired.

  # The atmospheric lapse rate. This one number is what makes ALTITUDE
  # the thing that banks snow: the same storm rains on the city and
  # snows on the headwaters, and the headwaters are where the ore is.
  - key: water.snow.lapseRateKPerKm
    value: "6.5"

  # Degree-day melt: millimetres of water-equivalent released per Kelvin
  # above freezing per game-day. The oldest and most robust snowmelt
  # model there is, and the right level of abstraction for a river you
  # look at rather than forecast.
  - key: water.snow.meltMmPerKPerDay
    value: "4"

  # The seasonal temperature table that used to live here is RETIRED
  # (the climate build): a reach reads the realm's one temperature at its
  # course's authored site (`site:` on the Watercourse row) and its node's
  # elevation, so the river and the street beside it agree.

  # ── ice on a still reach (the climate build) ─────────────────────
  # Running water does not freeze over here: at or above this current
  # (m/s) a reach reads `running` (the thin place over the current is the
  # ice trade's to model).
  - key: water.ice.stillWaterMps
    value: "0.1"

  # Stefan's law: a sheet thickens as α·√(freezing degree-days), because
  # its own thickness insulates the water beneath. α for clear (black)
  # ice grown on open water…
  - key: water.ice.growthClear
    value: "0.027"

  # …and for ice grown under snow, which insulates it: slower, white,
  # weaker (the sheet reads `snow-ice` once 30 % of its cold came so).
  - key: water.ice.growthUnderSnow
    value: "0.017"

  # Thaw: metres of sheet lost per kelvin above freezing per day.
  - key: water.ice.meltMPerKd
    value: "0.005"

  # Thawing degree-days over the last five days above which a sheet reads
  # ROTTEN — honeycombed and dark, whatever its thickness.
  - key: water.ice.rotTddK
    value: "10"

  # Gold's formula: a sheet bears σ·h² (kg, h in metres) — a person at
  # 6 cm, a horse at 14, a loaded cart at 20. The ice trade's margins are
  # its own.
  - key: water.ice.bearingKgPerM2
    value: "25000"

  # The walk-back's cap: a sheet that never opened inside the bound
  # (climate.walkback.maxDays) is perennial at this thickness.
  - key: water.ice.perennialMaxM
    value: "2.0"

  # ── navigability ──────────────────────────────────────────────────
  # BOTH conditions hold. A torrent through a gorge is not navigable and
  # neither is a wide trickle, so nobody authors a navigable stretch:
  # a dry August closes one, and curtailing a junior right reopens it.
  - key: water.navigable.minFlowM3S
    value: "3"
  - key: water.navigable.minWidthM
    value: "12"

  # ── the pump, and the turbine ─────────────────────────────────────
  # ⭐ Water and power meet at ONE equation read in two directions:
  # `ρ·g·Δh·Q` is what a falling river generates and what a rising one
  # costs. These two numbers are the only difference between them.
  - key: water.pumpEfficiency
    value: "0.6"
  - key: water.turbineEfficiency
    value: "0.85"

  # The temperature at or below which a line reads `frozen`. Its OWN key
  # rather than a shared freezing point, because a buried main survives
  # an air temperature that freezes a puddle, and the day somebody
  # authors a buried main this is the number they will reach for.
  - key: water.freezeK
    value: "271"

  # ── contamination ─────────────────────────────────────────────────
  # The arriving concentration at or above which a supply reads
  # `fouled`. Measured AFTER the conduit's own treatment factor, so
  # investing in treatment moves the threshold rather than the river —
  # which is the third rung of the counterplay ladder doing its job.
  - key: water.fouledAt
    value: "0.35"

  # ── the reach's water (fishing D22) ──────────────────────────────
  # The chemistry seed where a course row's `water:` block is silent:
  # neutral, moderately hard, lightly fed. Every shipped course authors
  # its own; these are the fallback for a river nobody characterised.
  - key: water.chemistry.pH
    value: "7.2"
  - key: water.chemistry.hardnessDgh
    value: "8"
  - key: water.chemistry.nitrateMgL
    value: "1"

  # ── the fishery (fishing D1/D3/D15) ──────────────────────────────
  # ⭐ The Discipline whose competence band gates the SPECIES read at a
  # shore — a template path, and the one word of a trade the water pack
  # speaks, as a setting so it never has to. When the row it names is
  # not installed the read is physical only, which is honest for a realm
  # with water and no fishing trade.
  - key: water.fishery.readDiscipline
    value: "/trade/fishing/idea/Discipline/fishing"

  # Kilometres of river a reach stands for, for capacity:
  # `round(fit × abundance × reachLengthKm)`. Abundance is authored per
  # species per km; this is the one number that scales every reach.
  # ⭐ ONE kilometre — the stretch you can fish from where you stand, not
  # the whole reach between two nodes: at 3 the confluence held eight
  # hundred fish and no net could empty it in an afternoon (the drive).
  - key: water.fishery.reachLengthKm
    value: "1"

  # Recovery: what has been drawn down decays toward nothing with this
  # half-life in game DAYS. A net empties a reach in an afternoon; the
  # reach recovers over days — this is the days.
  - key: water.fishery.recoveryHalfLifeDays
    value: "2"

  # A species whose level is under this fraction of its capacity reads
  # as fished out.
  - key: water.fishery.read.emptyBelow
    value: "0.1"

  # Salinity, parts per thousand: the sea, the brackish reach one hop
  # above it, and the elevation below which a reach that low reads
  # brackish rather than fresh. Fresh water reads 0.3. ⚠ The one function
  # a tide clock replaces.
  - key: water.fishery.salinity.sea
    value: "33"
  - key: water.fishery.salinity.brackish
    value: "15"
  - key: water.fishery.brackishBelowM
    value: "50"
