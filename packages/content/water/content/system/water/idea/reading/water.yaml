# water — what is in a water, and whether it can be drunk.
#
# ⭐ The pack ships the row and the class; the platform names neither.
class: /system/water/idea/reading/WaterReading
data:
  channel: water
  kind: fact
  scope: [subject]
  discipline: chemistry
  instrument: ""
  # ⭐ The test kit (water-supply D18): whether a water is FIT — fouled,
  # leaded — is the kit's to say, never the eye's. Bare, the read gives
  # the river; with the kit in hand, what is in it.
  handTool: water-test
  eyeCeiling: expert
  improves: >-
    whether this water is safe, and what is wrong with it if not
  stakes: >-
    a village that drinks from the wrong reach
