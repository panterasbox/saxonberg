# /system/water/idea/SeaWarren — the water beside a ship stopped at sea
# (the river build, D30). ONE singleton for the realm: a room is budded only
# where a ship has stopped, keyed by the hail cell she lies in, and reaped
# when empty. Stood up by whatever first asks (a boat launched, somebody
# over the side); no boot step, nothing persisted.
class: /system/water/idea/SeaWarren
# Each place it makes is the one place in a zone of its own: a copy of its
# kind's zone named under the row (`under-row`), joined to a FRAME — the
# river's line, the sea's chart — never kept and never recorded (`frame`;
# zone-instancing D13).
data:
  zoneNaming: under-row
  joins: frame
