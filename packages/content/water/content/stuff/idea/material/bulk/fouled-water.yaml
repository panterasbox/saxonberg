# Fouled water — river water below an outfall, and the thing the
# counterplay ladder is a ladder about.
#
# ⭐ It is a **material**, not a state on a vessel, because a `Material`
# is a shared reference Idea and that is exactly the right shape here:
# one row backs every litre of the stuff in the world, and the way to
# say "this water is different now" is to name a **different material**
# (the closed-material doctrine — materials are a fixed set and blends
# derive).
#
# ## Two fields do all the work, and neither is new machinery
#
# `toxicity` is the SHIPPED metabolism path: a `ToxinTag` on a material
# doses whoever drinks it, clears on the body's own schedule, and needed
# nothing from this build. Water's own row carries `toxicity: []`; this
# one carries a dose.
#
# `purifiedByBoiling` points back at plain water, which is what makes
# `boil` an actual answer rather than a gesture. ⚠ **A persistent
# contaminant would author no counterpart** — boiling a lead-fouled
# river gives you hot lead-fouled river, and that silence is how a
# player learns the difference between organic and persistent
# contamination.
#
# Everything else is water's own row: it is the same substance, dirtier.
class: /platform/idea/material/Material
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: fouled-water
  appearance: brown, cloudy water
  keywords: [water, fouled, dirty]
  density: 1000
  thermalConductivity: 0.6
  specificHeat: 4186
  electricalConductivity: 0.02
  meltingPoint: 273
  latentHeatOfFusion: 334000
  boilingPoint: 373
  latentHeatOfVaporization: 2260000
  edibility: true
  nutrients: [water]
  # The shipped toxin route, keyed on the `dysentery` Condition. It is
  # ORGANIC contamination — which is why boiling answers it, and why the
  # river below the town recovers on its own over a few reaches.
  toxicity:
    - { type: dysentery, amount: 12 }
  # ⭐ Boil it and you have water. Personal, per-use, costing fuel and
  # time every single time — which is precisely why a town eventually
  # buys treatment instead.
  purifiedByBoiling: /stuff/idea/material/bulk/water
  # ⚠ It keeps the `water` IDENTITY tag, unlike `salt-water`, because it
  # genuinely IS water — anything that asks for water will accept it,
  # and the consequence is the dose rather than a refusal. That is the
  # honest model: nothing about fouled water announces itself, which is
  # the entire reason the intake's POSITION is the thing that matters.
  tags: [liquid, water, beverage, drinkable]
  composition: []
  biologicalSource: null
