id: eternal-university
version: 0.1.0
root: /world/terminus/eternal
description: >-
  Eternal University — the CAMPUS locality, homed whole out of the
  transitional world-seed (residences D18): Duncan Hall, the dorm that is
  the residence ladder's first rung. A locality pack's src/ registers
  against its extent, so the class paths (/world/terminus/eternal/…) are unchanged
  by the move.

  ⚠ University Avenue is NOT here, and the boundary is the campus wall.
  The avenue is a TERMINUS street — the city street the campus gate opens
  onto, named after the university the way Lombard Street is named for
  the Lombards — so it ships in the terminus pack at
  /world/terminus/university-avenue. The first cut homed it here because
  it shared the /world/terminus/eternal path root, which is a fact about the
  filesystem rather than about the world; the crossing's own prose
  (travellers spilling out of the Terminus terminal) and the campus's own
  Locality row (`_address: terminus/city/campus` — a district INSIDE the
  city) both said otherwise.

  The gatehouse stub behind the gate went with the avenue deliberately:
  it exists only so the crossing's north exit has a loadable destination,
  so it belongs to the exit that needs it, and it dies when real campus
  content lands here and the exit repoints.
requires:
  groups:
    # The landlord — the group that HOLDS Duncan Hall. Players only
    # (economic bootstrap D8): Katie used to be enrolled here, and an NPC
    # on a committee is doctrine 2 broken. She is staff of the
    # `duncan-hall/idea/college` Organization now; this group is empty at
    # boot and falls to the founder until the Compact seats it.
    - name: duncan-hall
      purpose: the landlord of Duncan Hall
  title:
    # Duncan Hall: the landlord holds the building (so Katie's row is under
    # the pack's own claim) and the dorms wing the leased units subdivide under.
    # Under the realm root (economic bootstrap D5): the campus sits inside
    # the city, so its parcels' parent is the realm's committee.
    - { extent: /world/terminus/eternal/duncan-hall,       parentParcel: /world/terminus, holder: { group: duncan-hall } }
    - { extent: /world/terminus/eternal/duncan-hall/dorms, parentParcel: /world/terminus/eternal/duncan-hall, holder: { group: duncan-hall }, landUse: residential }
    # The campus farm and the home field (economic bootstrap, retrofit
    # step 3): the University's ground, held by its one group today — a
    # `campus` group is a rename the Compact can make.
    - { extent: /world/terminus/eternal/campus-farm,  parentParcel: /world/terminus, holder: { group: duncan-hall }, landUse: agricultural }
    - { extent: /world/terminus/eternal/campus-field, parentParcel: /world/terminus, holder: { group: duncan-hall }, landUse: agricultural }
boot:
  - { template: /world/terminus/eternal/duncan-hall/idea/dorm-warren, role: producer, reason: installs the lobby stair and rebuilds the floor cache at postRegister }
  - { template: /world/terminus/eternal/duncan-hall/idea/college, role: producer, reason: "Duncan Hall's staff — provision/unprovision ask whether the actor holds a position here, read off the authored roster" }
  # ⭐ The farm unit advertises rung ZERO (trades-and-labor D16), and the
  # derived help-wanted sign reads LIVE businesses only — a `look` may not
  # stand a house up. A farm nobody has traded with yet is a farm whose
  # opening nobody can see. `lint:openings` holds the two together.
  - { template: /world/terminus/eternal/campus-farm/idea/farm-unit, role: producer, reason: "the university farm's business — it advertises two labourer places with no prerequisite at all, the lowest rung in the realm" }
  # ⚠ And the yard it operates: a business advertises into a ROOM, and a
  # room nothing has reached yet is a room the sign cannot be read in.
  # Found by driving — `goto` answered `unknown-target` for a yard whose
  # business was pinned and whose ground was not.
  - { template: /world/terminus/eternal/campus-farm/location/yard, role: producer, reason: "the farm yard — the room the labourer opening is advertised in and clocked on at" }
