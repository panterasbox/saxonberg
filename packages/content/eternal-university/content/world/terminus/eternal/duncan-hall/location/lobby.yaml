# Duncan Hall Lobby — landing room for new sessions.
#
# "Duncan Hall" the building is a proper name (NamedMixin on the
# enclosing Zone); "the lobby of Duncan Hall" is a generic-label
# room — shortDescription only, no NamedMixin. The card header
# falls back to displayName which falls back to shortDescription
# for non-Named hosts; the building's identity rides through the
# zone path, not the room's own label.
#
# Sits at grid [0, 1, 0] inside the Duncan Hall zone (y grows north,
# so [0, 1] is one cell north of [0, 0]). The south exit declared
# below is bidirectional by default for cardinals, so the front
# steps get the back-exit "north" automatically via
# Exitable.applyExits.
#
# `props:` seeds the instrument case into the lobby on hydrate. It began
# as two instances to give the inspection card's contents list something
# to render; the reading ladder made it the place a student can actually
# borrow a dial, and the case is the whole family now.
class: /platform/location/SingletonCartesianLocation
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  _address: terminus/city/campus/duncan-hall
  shortDescription: Duncan Hall lobby
  keywords: [lobby, duncan, hall]
  register: proper
  illustration: location/duncan-hall-lobby.png
  longDescription: |
    A long marble counter divides the lobby roughly in half. The far wall is studded with brass mail slots — most empty, a few stuffed with envelopes nobody has come down for. Bulletin boards on either side advertise things that have already happened: a study group two weeks back, a missing textbook from last term.

    The front doors stand open to the south, letting the day's heat in.
  # Daylight through the open front doors plus the counter lamps — the
  # brightest interior in the building. `bright` (60-200 lux).
  ambientIntensity: 80
  ambientColorTemperature: 5500
  coords:
    x: 0
    y: 1
    z: 0
  exits:
    # Doored connection: the front doors are one physical boundary spanning
    # both rooms, so this is authored once with `bidirectional: true` (the door
    # IS the shared "both sides"; its light-boundary anchors are wired once).
    # The steps' back-exit (north, through the same door) is installed from
    # here rather than duplicated on the steps template.
    south:
      destination: /world/terminus/eternal/duncan-hall/location/steps
      door: /world/terminus/eternal/duncan-hall/thing/front-doors
      bidirectional: true
  # ⭐⭐ The instrument case, and it is now the WHOLE family.
  #
  # It was four of them, propped to give the inspection card something to
  # render. The reading ladder made that an availability question rather
  # than a demo: a channel that declares an instrument and has none in
  # the world is a refusal nobody can ever lift, which is the shape
  # `sundial` and `sextant` were in — both classes shipped, both checked
  # by `instanceof`, and NOTHING in the world was ever either, so
  # `measure shadow` and the sun's angle were refused for everybody
  # forever.
  #
  # ⚠ Deliberately NOT the photometer's only home: a lens on a counter in
  # a dorm lobby is where a student borrows one, not where the trade buys
  # one. The tool trade is somebody else's build.
  props:
    - /stuff/thing/instrument/thermometer
    - /stuff/thing/instrument/barometer
    - /stuff/thing/instrument/hygrometer
    - /stuff/thing/instrument/altimeter
    - /stuff/thing/instrument/balance
    - /stuff/thing/instrument/photometer
    - /stuff/thing/instrument/hydrometer
    - /stuff/thing/instrument/gravity-meter
    - /stuff/thing/instrument/gas-analyzer
    - /stuff/thing/instrument/sundial
    - /stuff/thing/instrument/sextant
  cast:
    # Katie, the live-in super — the day-one housing touchpoint. Talk to her
    # to get a room; she fronts provisioning (see her seed + Katie.ts).
    - /world/terminus/eternal/duncan-hall/agent/katie
  details:
    counter:
      keywords: [counter, marble]
      description: |
        The marble counter runs the length of the room. Up close it's veined and slightly chipped along the edge — generations of students leaning on it has worn the polish down to a soft matte.
    slots:
      keywords: [slots, mailslot, mail]
      description: |
        Three rows of brass mail slots. Most have a tarnished number plate; a few have curled paper labels with hand-written names. The envelopes that remain look like they've been forgotten on purpose.
    boards:
      keywords: [boards, bulletin, bulletins]
      description: |
        Two cork bulletin boards flank the doors, layered in flyers and notices. A faded posting for a study group has the dates two weeks gone; another announces a textbook missing since last term.
