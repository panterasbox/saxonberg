# Footlocker — a university-owned dorm fixture (invariant, respawned from
# template), seeded into each DormRoom via its `props:` data. A store surface;
# generic label, no Named. Its tenant-scoped contents are the deferred
# "possession" seam (the apartment's chattel-title); v1 is functional-empty.
class: /world/terminus/eternal/duncan-hall/thing/Footlocker
data:
  shortDescription: footlocker
  keywords: [footlocker]
  register: indefinite
  longDescription: |
    A dented metal footlocker with a hasp for a padlock nobody has supplied yet. It smells faintly of the last person's shoes, and of the wool somebody left folded in it for the winter.
  # ⭐ A warm coat where a new player wakes (the climate build, D18): the
  # winter is real now, and the room OFFERS one — folded in the
  # footlocker, nobody made to wear it. Staged with the footlocker, so
  # every unit's footlocker is born with its own.
  props:
    - /stuff/thing/clothes/greatcoat
