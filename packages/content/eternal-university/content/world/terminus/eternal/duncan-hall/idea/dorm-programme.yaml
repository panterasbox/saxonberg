# The Duncan Hall dorm's residential programme — the DEGENERATE holding
# programme (residences D16/P1). One keyed instance per leased unit
# (scope = this row, key = the unit parcel extent).
#
# ⭐ Its PLAN is its own (harbors review 3; 2026-11-03 — no blueprint row),
# and the degenerate one: the unit IS one room, so the plan's extent and
# entrance are both the shipped dormroom row (a plan's rooms are every
# place at or under its extent). The copy of a one-room plan is keyed by
# the holding's own key — (scope = the dormroom row, key = the unit
# extent, no leaf) — so every existing record shape and the pinned dorm
# suite hold. `buildings`: the room is its one building's extent and
# entrance, so each leased unit keeps its own fabric and coat.
#
# `upkeepTerm: institution-all` — the university owes the shell AND the
# fixtures (the shipped status quo, now readable as a term, D5). No
# front-door change: `DormDoor` stays the unit's edge (P1); the generic
# FrontDoorExit is for the two new rungs.
class: /system/residence/idea/HoldingWarren
data:
  extent: /world/terminus/eternal/duncan-hall/location/dormroom
  entrance: /world/terminus/eternal/duncan-hall/location/dormroom
  buildings:
    - /world/terminus/eternal/duncan-hall/idea/dorm-building
  upkeepTerm: institution-all
  addressBase: terminus/city/campus/duncan-hall
