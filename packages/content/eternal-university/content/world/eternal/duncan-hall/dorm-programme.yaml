# The Duncan Hall dorm's residential programme — the DEGENERATE holding
# programme (residences D16/P1): a one-room floorplan citing the shipped
# dormroom row. One keyed instance per leased unit
# (scope = this row, key = the unit parcel extent); the room keeps its
# pre-programme identity exactly — (scope = the dormroom row,
# key = the unit extent, no leaf) — so every existing record shape and
# the pinned dorm suite hold.
#
# `upkeepTerm: institution-all` — the university owes the shell AND the
# fixtures (the shipped status quo, now readable as a term, D5). No
# front-door change: `DormDoor` stays the unit's edge (P1); the generic
# FrontDoorExit is for the two new rungs.
class: /residence/idea/HoldingProgramme
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  floorplan:
    - room: /world/eternal/duncan-hall/dormroom
      entry: true
  upkeepTerm: institution-all
  addressBase: terminus/city/campus/duncan-hall
