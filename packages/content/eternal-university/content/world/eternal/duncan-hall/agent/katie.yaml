# Katie — Duncan Hall's live-in property manager. The day-one housing
# touchpoint: talk to her and she finds you a room (her clipboard IS the
# dorm manifest — the DormWarren). Fronts provisioning in the world so a
# player never types the raw operator verb.
#
# Housing-intake SLICE — a handful of dialogue nodes, faithful to her sheet's
# texture (the keys, the warmth, the one petty rule, the code-switch flicker).
# The full character (the murder on-ramp, the ambient routine, the boss-mask)
# is the EU narrative build. See
# docs/staging/eternal-university/npcs/property-manager.md.
#
# Her authority is owner-conferred data, not self-claimed code:
#  - agent of the dorms owner → she's a member of the `duncan-hall` group,
#    authored in config/groups.yaml + seeded by GroupSeeder (the authority
#    behind her `dispatch provision $player`).
#  - master ring → `populates`d into her inventory below (npc/master-ring.yaml),
#    a physical master key for every pin-tumbler dorm lock.
class: /world/eternal/duncan-hall/agent/Katie
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: Katie
  pronouns: she
  _speciesPath: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/trollius
  lifecycleState: alive
  primaryKeyword: katie
  # Owner-authored spawn loadout: the super's master ring (a physical master
  # key for every pin-tumbler dorm lock), cloned into her inventory at
  # hydration. Conferred here, not self-issued in her class code.
  populates:
    - /world/eternal/duncan-hall/agent/master-ring
    # The kit is what makes the `maintains` round below possible AT ALL
    # — take it off her and the dorm weathers. An owner-authored loadout,
    # exactly like the master ring: never a self-issued power.
    - /residence/thing/householders-kit
  shortDescription: the live-in super, keys jangling at her belt
  longDescription: |
    Big and solid and never quite still — there's always a light to fix, a
    door that sticks, a ring of keys chiming at her hip like she's part of
    the building's own plumbing. She looks you over the way she looks over
    everything in her hall: taking the full measure, missing nothing. Thirty
    years of tenants' faces are filed away behind those eyes, and their
    parents' names besides. The warmth is real. So, you'll learn, is the
    rule about quiet hours.
  # Established character, seeded as claim evidence at spawn (her sheet's
  # entrenched poles): a deeply caring woman, immovably loyal to the building,
  # who notices everything — and an honest one enforcing an accepted order.
  dispositions:
    - { disposition: compassion, valence: 80 }
    - { disposition: constancy, valence: 75 }
    - { disposition: curiosity, valence: 60 }
    - { disposition: diligence, valence: 80 }
    - { disposition: fairness, valence: -55 }
    - { disposition: honesty, valence: 45 }
  behaviors:
    # The upkeep round. The dorm's term is `institution-all` — the
    # university keeps its rooms, inside and out — and this is the
    # agency that makes that claim true instead of decorative
    # (residences D5). She walks her extent, works over anything that
    # has slipped below sound, and comes back to the desk.
    - brain: /lib/behavior/maintains
      trigger: cadence:17m
      config:
        extent: /world/eternal/duncan-hall/dorms
    # Auto-introduce: she names herself to newcomers (she greets every
    # arrival — it's the whole job).
    - brain: /lib/behavior/introduces
      trigger: arrival
    # The intake conversation. `talk to katie` opens this; the terminal
    # choices DISPATCH the real provisioning verbs AS Katie (bounded by her
    # dorms-agent authority) — the "NPCs do their jobs" seam.
    - brain: /lib/behavior/tree-dialogue
      trigger: engage
      config:
        entry:
          - node: greet
        nodes:
          greet:
            beat: "Well now — a new face. Katie. I keep Duncan Hall: the keys, the boiler, the lot, near enough since before you were born. What is it you need, love?"
            choices:
              - line: "I need a room."
                to: style
                effects:
                  - { verb: regard, delta: 5 }
              - line: "I'm moving out."
                to: movedout
                effects:
                  - { verb: dispatch, command: "unprovision $player" }
              - line: "Just saying hello."
                to: hello
          # The move-in shell commit: picking a style provisions the room WITH
          # that look in one move — the dialogue tree as the menu. Each choice
          # dispatches `provision $player --theme <style>` AS Katie (bounded by
          # her dorms-agent authority).
          style:
            beat: "Right you are. And what's your line of study, love? I dress the room to suit the trade — saves it looking bare your first night, and there's comfort in a room that knows what you're for. Digging, growing things, the sea, trade, mending folk, the service, or the books?"
            choices:
              - line: "Mining."
                to: assigned
                effects:
                  - { verb: dispatch, command: "provision $player --theme miner" }
              - line: "Farming."
                to: assigned
                effects:
                  - { verb: dispatch, command: "provision $player --theme farmer" }
              - line: "The sea — navigation."
                to: assigned
                effects:
                  - { verb: dispatch, command: "provision $player --theme nautical" }
              - line: "Trade."
                to: assigned
                effects:
                  - { verb: dispatch, command: "provision $player --theme merchant" }
              - line: "Medicine."
                to: assigned
                effects:
                  - { verb: dispatch, command: "provision $player --theme medic" }
              - line: "The service."
                to: assigned
                effects:
                  - { verb: dispatch, command: "provision $player --theme military" }
              - line: "The books — scholarship."
                to: assigned
                effects:
                  - { verb: dispatch, command: "provision $player --theme scholar" }
          assigned:
            beat: "Let's have a look at the book... right. You're sorted — up the stairs to your floor, and your door'll open for you and no one else. Changed your mind on the look later, you just redo it from inside. One thing: quiet after ten. That rule I do hold to."
            terminal: true
          movedout:
            beat: "...Off already, then. Well. I'll see the room's put right for the next one. Your door's shut to you now, love — mind how you go."
            terminal: true
          hello:
            beat: "Hah — good. I've a soft spot for the ones who stop to talk; not everyone counts the super a person. My door's the half-open one by the stairs, kettle's on. Go on, then."
            terminal: true
