# The Duncan Hall theme catalogue — the singleton Idea that reads
# `dorm-themes.yaml` (the authored prose bundles, beside the class) and
# applies a theme's overlay across a unit + its come-with fixtures.
#
# ⭐ A SINGLETON rather than a class of statics, because a content pack has
# no Api and no logic singleton: a static on a pack class is callable and
# invisible, which is the one invariant the author surface exists to hold.
# `SingletonMixin` on the class is what makes "one of these" checkable
# rather than conventional; callers reach it with
# `StuffApi.singleton(DormThemes.CATALOGUE_PATH)`.
#
# No `data:` block and therefore no `hydratorClass:` — the catalogue holds
# no authored state of its own; its content is the sibling YAML.
class: /world/eternal/duncan-hall/idea/DormThemes
