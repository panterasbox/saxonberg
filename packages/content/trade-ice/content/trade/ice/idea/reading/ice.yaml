# and reads the thickness, bracketed to your ice-harvesting; `analyze ice`
# is the eye, in words. The patch words: field, scraped, marked, cut, hole.
class: /trade/ice/idea/reading/IceReading
data:
  channel: ice
  kind: fact
  scope: [here]
  discipline: ice-harvesting
  instrument: spudding
  instrumentNoun: a spud
  eyeCeiling: competent
  improves: >-
    whether the ice will bear you, a horse or a loaded sledge, and how big
