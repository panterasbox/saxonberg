# Salt — the pantry's (base-library has only salt-WATER). Tag `salt`: the rim of a margarita.
class: /platform/idea/material/ConsumableMaterial
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: salt
  appearance: "coarse white salt"
  keywords: ["salt"]
  density: 2160
  thermalConductivity: 0.6
  specificHeat: 880
  edibility: true
  # ⭐ Spoilage (docs/subsystems/spoilage.md): the microbial growth rate is
  # `μ_max · f_T(T) · f_aw(a_w)`. `spoilActivationEnergy` (J/mol) is how
  # steeply this food answers to warmth; `waterActivity` is how much of its
  # water a microbe can actually use. Under the 0.60 floor nothing grows.
  # ⭐ Salt is the ur-preservative and it is one number: a_w 0.15, far under
  # the 0.60 growth floor. It does not keep because it is salt; it keeps
  # because there is no available water in it — and that is exactly why
  # salting other food works too.
  spoilActivationEnergy: 60000
  waterActivity: 0.15
  toxicity:
    []
  tags: ["solid", "food", "salt", "seasoning"]
  composition: []
  biologicalSource: null
