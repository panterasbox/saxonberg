# Simple syrup — the syrup recipe's output material (1:1 sugar and water, brought to heat). Tag `syrup`.
class: /platform/idea/material/ConsumableMaterial
hydratorClass: /platform/idea/persistence/PersistentHydrator
data:
  name: simple syrup
  appearance: "clear, viscous simple syrup"
  keywords: ["syrup", "simple-syrup"]
  density: 1300
  thermalConductivity: 0.4
  specificHeat: 3000
  edibility: true
  # ⭐ Spoilage (docs/subsystems/spoilage.md): the microbial growth rate is
  # `μ_max · f_T(T) · f_aw(a_w)`. `spoilActivationEnergy` (J/mol) is how
  # steeply this food answers to warmth; `waterActivity` is how much of its
  # water a microbe can actually use. Under the 0.60 floor nothing grows.
  # Syrup sits above the floor but well down the ramp: months, not days.
  # Cut it with more water and it would spoil like juice.
  spoilActivationEnergy: 40000
  waterActivity: 0.8
  nutrients: ["sugar", "water"]
  toxicity:
    []
  tags: ["liquid", "food", "syrup", "simple-syrup", "sweetener"]
  composition: []
  biologicalSource: null
