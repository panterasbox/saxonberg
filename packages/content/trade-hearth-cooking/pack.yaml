id: trade-hearth-cooking
version: 0.1.0
root: /trade/hearth-cooking
description: >-
  The hearth-cooking trade — what cooking at a hearth introduces: its
  recipes (toasted-ration, root-mash). Its stock (cuts, roots, rations)
  is commons under /obj/items (A16.3), and the Hearthworks cookhouse
  (/world/hearthworks/cookhouse) is the venue that hosts it. The second
  pass (fine-roast, hearty-stew, hospitality) is wave 4b. Content packs
  wave 4a.
dependsOn: [platform, generic-objects]
requires:
  groups:
    - name: hearth-cooking
      purpose: the hearth-cooking trade's own body
      owner: { office: prime-minister }
  title:
    - { extent: /trade/hearth-cooking, holder: { group: hearth-cooking } }
