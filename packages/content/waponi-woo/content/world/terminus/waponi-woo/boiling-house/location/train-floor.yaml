# The train floor — ⭐ a PersistentLocale (sugar D20): a kettle boiling on
# the train is the same kettle after a restart.
class: /platform/location/PersistentLocale
data:
  coords: { x: -1, y: 2, z: 0 }
  shortDescription: "train floor"
  keywords: [floor, "train floor", "boiling house"]
  register: definite
  _biomePath: /stuff/idea/biome/indoor/baseline
  enclosure: { material: /stuff/idea/material/rock/granite, thicknessM: 0.4 }
  roof: { material: /stuff/idea/material/rock/slate, thicknessM: 0.01 }
  longDescription: |
    Hot and loud and full of steam. The Jamaica train runs the length of the floor, four coppers in a row over one long fire, and an older single kettle sits over its own arch by the door, the way they boiled before the train was built. Bagasse is heaped by the stoke-hole and a woodpile is stacked along the wall. The curing house is through the door east; the mill yard is south.
  props:
    - /trade/sugar/thing/jamaica-train
    - /trade/sugar/thing/kettle-arch
    - { template: /trade/sugar/thing/kettle, count: 2 }
    - /stuff/thing/vessel/pail
    - /trade/sugar/thing/hogshead
    - /trade/sugar/thing/curing-pot
    - /stuff/thing/instrument/thermometer
    - { template: /stuff/thing/items/dry-log, count: 10 }
    # ⭐ The boiling house's lime store, beside its woodpile: the boiler
    # tempers from what is in reach and only shops when it is gone. Buying
    # from the estate's OWN counter needs the house to have the money,
    # and an idle estate has none (probed: `insufficient-funds` at every
    # batch) — a house drawing on its own stock is a retail follow-up.
    - { template: /trade/quarrying/thing/quicklime, count: 12 }
  cast:
    - /world/terminus/waponi-woo/agent/boiler
  exits:
    south:
      destination: /world/terminus/waponi-woo/location/mill-yard
      media: [ground]
      edgeMinutes: 1
    east:
      destination: /world/terminus/waponi-woo/boiling-house/location/curing-house
      bidirectional: true
