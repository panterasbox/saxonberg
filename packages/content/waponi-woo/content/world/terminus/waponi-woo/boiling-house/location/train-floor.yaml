# The train floor — ⭐ a PersistentLocale (sugar D20): a kettle boiling on
# the train is the same kettle after a restart.
class: /platform/location/PersistentLocale
data:
  coords: { x: -1, y: 2, z: 0 }
  shortDescription: "train floor"
  keywords: [floor, "train floor", "boiling house"]
  register: definite
  _biomePath: /stuff/idea/biome/indoor/baseline
  enclosure: { material: /stuff/idea/material/rock/granite, thicknessM: 0.4 }
  roof: { material: /stuff/idea/material/rock/slate, thicknessM: 0.01 }
  longDescription: |
    Hot and loud and full of steam. The Jamaica train runs the length of the floor, four coppers in a row over one long fire, and an older single arch stands by the door, the way they boiled before the train was built. A brick cistern is sunk at the head of the floor for the juice to stand in. Bagasse is heaped by the stoke-hole and a woodpile is stacked along the wall. The curing house is through the door east; the mill yard is south.
  props:
    - /trade/sugar/thing/jamaica-train
    - /trade/sugar/thing/kettle-arch
    # ⭐ ONE kettle: a second answered to the same word, so `pour … into
    # kettle` could charge the spare by the door while the pan on the train
    # stood empty (the keyword-collision gap). The juice waits in the
    # cistern and the pan is charged from it.
    - /trade/sugar/thing/kettle
    - /trade/sugar/thing/juice-cistern
    - /stuff/thing/vessel/pail
    # Three hogsheads on three pots: a strike cures four days, so a floor
    # with one cask makes one block in four days whatever the boiler does.
    # A shift's two-hour batches fill all three (drive 13).
    - { template: /trade/sugar/thing/hogshead, count: 3 }
    - { template: /trade/sugar/thing/curing-pot, count: 3 }
    - /stuff/thing/instrument/thermometer
    # A boiling house burned wood by the cord: the train eats ~4.5 kg of oak
    # an hour at full fire, so thirty logs is a shift's three batches and
    # the next. (The historical fuel, the mill's dried bagasse carried to
    # the stoke-hole, is a loop nobody runs yet — a follow-up.)
    - { template: /stuff/thing/items/dry-log, count: 30 }
    # ⭐ The boiling house's lime store, beside its woodpile: the boiler
    # tempers from what is in reach and only shops when it is gone. Buying
    # from the estate's OWN counter needs the house to have the money,
    # and an idle estate has none (probed: `insufficient-funds` at every
    # batch) — a house drawing on its own stock is a retail follow-up.
    - { template: /trade/quarrying/thing/quicklime, count: 12 }
  cast:
    - /world/terminus/waponi-woo/agent/boiler
  exits:
    south:
      destination: /world/terminus/waponi-woo/location/mill-yard
      media: [ground]
      edgeMinutes: 1
    east:
      destination: /world/terminus/waponi-woo/boiling-house/location/curing-house
      bidirectional: true
