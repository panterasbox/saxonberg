# The mill yard — the edge-runner and the juice tubs (sugar W5). Cane is
# brought here and crushed the day it is cut.
class: /platform/location/Locale
data:
  shortDescription: "mill yard"
  keywords: [yard, mill, "mill yard"]
  register: definite
  _biomePath: /stuff/idea/biome/outdoor/baseline
  ambientIntensity: 60000
  ambientColorTemperature: 5800
  longDescription: |
    A beaten yard round a circular stone bed where a great stone wheel rolls on its edge behind a mule, crushing cane. The juice runs off the bed by a channel into a tub that goes up to the boiling house full; the crushed trash is forked out into heaps to dry. The boiling house is north; the track is back east.
  coords: { x: -1, y: 1, z: 0 }
  props:
    - /trade/sugar/thing/edge-runner
    # ⭐ The tubs the juice runs into: a crush needs an EMPTY one in reach
    # (`no-glass` otherwise). The miller pours his tub into the kettle up
    # at the boiling house and brings the same tub back.
    - { template: /trade/sugar/thing/juice-tub, count: 2 }
  cast:
    - /world/terminus/waponi-woo/agent/miller
  exits:
    east:
      destination: /world/terminus/waponi-woo/location/track
      media: [ground]
      edgeMinutes: 2
    north:
      destination: /world/terminus/waponi-woo/boiling-house/location/train-floor
      media: [ground]
      edgeMinutes: 1
