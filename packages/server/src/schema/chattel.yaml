collection: chattel
owner: ChattelRecord
ownerModule: /lib/chattel/ChattelRecord
subsystem: chattel.md
summary: >-
  Per-instance ownership of movable things: one row per owned object.
purpose: |
  Real property has `parcels`; movables have this. A chattel row carries the
  durable `_chattelId` stamped on the instance and the party who owns it, so
  a sword keeps its owner across a drop, a theft and a restart.

  Ownership of a movable is per-INSTANCE, which is why it cannot live on a
  template and cannot be a property of the class.
invariants:
  - >-
    One row per `_chattelId`; the id is stamped durably on the instance.
  - >-
    `chattel_events` is the chain of title behind this row.
  - >-
    REFUSE under the sandbox: a circle may not mint or transfer real
    ownership.
  - >-
    A row with `bound: true` never transfers (aether-devices D10) — the
    starter phone is worthless to anyone but its first owner. The refusal
    is `ChattelLogic.transfer`'s, the one chokepoint every transfer passes.
sandbox: refuse
reset: wipe
# ⭐ No `place` and no `pin` index (persistence-model D9, N8): a good is kept
# by its container, never placed by its owner, and the residency pin rides
# the `holder_snapshots` record (its `pinned` index).
# ⚠ A unique index on `chattelId` would enforce the invariant above rather
# than merely stating it — but a unique index that fails to build takes the
# BOOT down, and that is a decision about existing data rather than a fix
# for this build's regression. Left for its own call.
indexes: []
