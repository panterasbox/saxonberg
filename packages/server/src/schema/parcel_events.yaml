collection: parcel_events
owner: ParcelEvent
ownerModule: /lib/parcel/ParcelEvent
subsystem: parcel.md
summary: >-
  The chain of title — every grant, subdivision and transfer, append-only.
purpose: |
  One row per title event; nothing overwritten. `parcels` is the current
  state, this is how it got there, and the two are separate for the same
  reason a deed registry is separate from a map.

  A dispute about who owns something is answerable here, which is the only
  reason a current-state row can be trusted.

  ⭐ `publish` / `offline` join `subdivide` / `transfer` / `grant`
  (2026-10). Taking content down is one of the louder things a holder
  can do to ground, and a chain of title that recorded a transfer but
  not that would be telling half the story. For those two `from` and
  `to` are both the holder: nothing changed hands, which is the honest
  record.

invariants:
  - >-
    Append-only. A transfer is a new event, never an edit to the old one.
  - >-
    `parcels` is fully derivable from this log.
  - >-
    REFUSE under the sandbox.
sandbox: refuse
reset: wipe
indexes:
  - keys: { extent: 1 }
    why: |
      The lineage readout for one title — the whole chain, in order.
