collection: parcels
owner: ParcelRecord
ownerModule: /lib/parcel/ParcelRecord
subsystem: parcel.md
summary: >-
  The real-property title registry: who holds title to which extent.
purpose: |
  One row per titled extent — the current-state cache over `parcel_events`.
  `ParcelApi.ownerOf` resolves a path to a holder by longest prefix, and
  every content-write authorization in the system bottoms out here.

  ⚠⚠ Stored SEPARATELY from the `content` rows it gates. That is the
  governing security invariant: if title lived beside the thing it governs,
  editing the thing could edit who may edit it.

  A row also carries `reach` — the watercourse reach this ground fronts,
  or `''`. It is what makes a **riparian** water right derivable with no
  record at all (the bank-holders of a reach are the owners of the
  parcels citing it), and it lives here rather than being derived from
  the address tree because a room's content path and its `_address` are
  independent by design. See docs/subsystems/watershed.md.

  ⭐ The electric twins of `reach` (energy build): `feeder` — the grid
  node metering this ground, or `''` for ground no line reaches — and
  `powerBand` — the electric posture this premises declares (`off-grid`
  / `domestic` / `commercial` / `industrial`, or `null` to inherit the
  covering parcel's). A consuming thing asks whether its covering
  parcel's feeder node is energized; it never walks the interior. Same
  reasoning as `reach`: title-gated field data, not derivable content.
  See docs/subsystems/energy.md.

  ⭐⭐ `published` (2026-10) — is the content on this ground ready to be
  walked into? One boolean, defaulting to true, on the record that
  already carries title: readiness is a declaration ABOUT CONTENT ON
  GROUND, and this is the register of who may declare things about
  ground. An author holds title to their extent, so they already hold
  the authority the flag needs.

  One field, two lives. DRAFT is content that has never been live:
  nobody is inside it by construction, so the flag is a WALL and every
  exit into it refuses with a reason. OFFLINE is live content coming
  down, which is a CAMERA: the people inside are moved out to a
  tombstone naming the extent and its holder, and the authors of every
  room that pointed in are told. Both are `published: false`; what
  differs is whether anybody was there, and that is a fact rather than
  a second field.

  ⚠ Denormalised onto each `location_graph` node so `Exit.canTraverse`
  can read it synchronously without resolving a destination. THIS
  RECORD STAYS THE SOURCE OF TRUTH; a flip re-projects the extent.
  See docs/subsystems/location-graph.md.


invariants:
  - >-
    Title is stored apart from the content it gates — never in the same
    collection.
  - >-
    An untitled path resolves to `null`, and every write against it fails
    closed.
  - >-
    Rebuildable from `parcel_events`; the event log is the chain of title.
  - >-
    REFUSE under the sandbox: title is field-real, and a circle may not
    mint it.
sandbox: refuse
reset: wipe
indexes:
  - keys: { extent: 1 }
    why: |
      The coverage-index key and the seed/mutation upsert lookup — the read
      `ownerOf` walks for every authorization decision in the system.
  - keys: { parentParcel: 1 }
    why: |
      The sparse-hierarchy child scan: the subdivisions under one parcel.
