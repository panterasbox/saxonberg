collection: documents
owner: StoredDocument
ownerModule: /lib/document/StoredDocument
subsystem: document-store.md
summary: >-
  The third path-addressed tree: kind-tagged documents, from press releases
  to command views.
purpose: |
  The document store — one row per path, each tagged with a kind. The
  pack-installable kinds are the closed `DocumentKinds` vocabulary: what
  packs AUTHOR (emotes, recipes, archetypes, blueprints, name banks, aromas,
  command views, msh scripts) and what the world FILES at runtime (press
  releases, water rights, maps, herds, fisheries, bodies, bore logs, bills
  of lading, warehouse receipts, instruments, rate cards, editions, ship
  register entries, berth rolls and books). Writes are gated by parcel title
  at the path (`AccessApi.canAtPath`); the `command-view` kind additionally
  needs code-trust.

  ⭐ A document's PATH is its only identity. Every document also carries a
  **catalogue card** (`keys`) its kind derives from its data — the keys it
  can be FOUND by besides its path (a release's `publishedAt`, a typed-word
  kind's `word`) — served by one wildcard index whatever the kind's shape.

  Releases live here rather than in a collection of their own: they are
  owner-scoped content with a place, and nobody queries them across
  jurisdictions.
invariants:
  - >-
    One document per path — enforced by the unique `path` index, and at
    every write (find-or-create).
  - >-
    `keys` is DERIVED from `data` by the kind's declaration on every write
    (`StoredDocument.cardOf`, called by `StoredDocument.save` and by the
    pack installer) and never authored, so it cannot drift from the value
    it repeats.
  - >-
    A pack-installed row's `kind` is a member of the closed `DocumentKinds`
    vocabulary; a runtime-filed kind outside it carries an empty card.
  - >-
    A write is authorized by parcel title over the path; there is no
    author tier.
  - >-
    PASS under the sandbox, with `content`: authored truth, governed by
    title rather than by scope.
sandbox: pass
reset:
  verb: wipe-except
  keep: declared-document-kinds
  because: |
    published press releases — the front door reads them without an account,
    and the gazette design requires bulletins to outlive the night they were
    published; and every DECLARED document kind (emotes, recipes, name
    banks, blueprints, msh scripts, command views) — pack-installed world
    content (the expression / generic-objects / species-and-names / platform
    / saxonberg-lounge packs), reference data not player state; wiping it
    would empty the soul vocabulary at 04:00 until a reboot re-installed it;
    and the RUNTIME-WRITTEN record kinds (water rights, bills of lading,
    warehouse receipts, rate cards, MAPS) — a record of something that
    happened, which nothing may erase because a night went by. ⭐ A map
    is one player's knowledge of one locality, written from what they
    perceived; walk somewhere, let the reset run, and the map still says
    you were there
indexes:
  - keys: { path: 1 }
    unique: true
    why: |
      `path` is the identity — find-or-create, the read by path, and the
      prefix walk (a range over the index, never a scan) all take it.

      Unique since 2026-11 (the path-identity build): two documents at one
      path is the defect the store exists to make impossible. ⚠ A database
      that predates it may hold a non-unique `path_1`; the build then logs
      *NOT built* and continues. Dev databases are dropped, not migrated.
  - keys: { kind: 1 }
    why: |
      `kind` serves the warm-window rebuild that replaced the retired
      `bulletins` scan, and every per-kind installer read.
  - keys: { kind: 1, keys.$**: 1 }
    why: |
      ⭐ The catalogue card — one compound wildcard index serves every key
      every kind declares, whatever its shape: equality (a typed word's
      `keys.word`), a range, and an ORDER (`keys.publishedAt` descending —
      the press, newest first). A wildcard keys each card field natively,
      so a sort is a real index order; an attribute array (`[{k, v}]`)
      would sort by the array's extreme element and read the press in the
      wrong order the moment a release carried a second key. Kind first,
      so every key read is equality on kind.
