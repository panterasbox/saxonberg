collection: chattel_events
owner: ChattelEvent
ownerModule: /lib/chattel/ChattelEvent
subsystem: chattel.md
summary: >-
  The chain of title for movables — stamp, transfer, and every hand it
  passed through.
purpose: |
  The append-only sibling of `chattel`, in the shape `parcel_events` already
  established: the current-state row says who owns it, this says how they
  came to.

  Kept separate so that reading who owns a thing never drags its whole
  history.
invariants:
  - >-
    Append-only.
  - >-
    `chattel` is derivable from this log.
  - >-
    REFUSE under the sandbox.
  - >-
    ⭐ Every row names its act (`actId`, `causeId` — tropes D1) and its
    actor by WHO IS ACTING, keyed by identity path (D4; never the
    labor-plane author, never the shared lineage path). A `transfer` states
    its `basis` — `unrequited` (a gift), `sale` (with the money leg's
    `txId`), `terms` or `restored` — the fact the transferring site holds,
    so the row says gift or sale by itself (D7). `''` on a mint, a release
    or a restamp.
sandbox: refuse
reset: wipe
indexes: []
