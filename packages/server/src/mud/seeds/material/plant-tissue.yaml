# Plant tissue — soft cellulose-based. Living plant matter (a leaf, a
# stem); distinct from oak (dead, processed wood). Flammable when dry.
class: /lib/material/Material
hydratorClass: /lib/persistence/PersistentHydrator
data:
  name: plant-tissue
  density: 600
  hardness: 0.5
  flammability: 0.3
  opacity: 1
  thermalConductivity: 0.2
  electricalConductivity: 1.0e-8
  magneticSusceptibility: 0.0
  edibility: true
  nutrients: ["cellulose", "water"]
  toxicity: []
  damageResistance:
    slash: 0.05
    blunt: 0.1
    pierce: 0.05
