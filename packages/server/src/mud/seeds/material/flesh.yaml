# Flesh — generic animal tissue. Soft, flammable when dry, edible
# (with carnivore/detrivore caveats; v1 has no DietApi consumer).
class: /lib/material/Material
hydratorClass: /lib/persistence/PersistentHydrator
data:
  name: flesh
  density: 1060
  hardness: 0.5
  flammability: 0.2
  opacity: 1
  thermalConductivity: 0.4
  electricalConductivity: 0.5
  magneticSusceptibility: 0.0
  edibility: true
  nutrients: ["protein", "fat", "water"]
  toxicity: []
  damageResistance:
    slash: 0.05
    blunt: 0.1
    pierce: 0.05
