# Oak — dense hardwood. Flammable, opaque, organic. Standard wood
# for tool handles, doors, and furniture.
#
# Composition is biological: cellulose (~45%), lignin (~25%), water
# (~10%), with hemicelluloses, extractives, and ash making up the
# rest. v1 leaves `composition` empty pending compound templates
# (`/material/compound/cellulose`, `.../lignin`); the `wood` and
# `mixture` tags carry the gist meanwhile. `biologicalSource` is null
# until an oak-tree species template is authored.
class: /lib/material/Material
hydratorClass: /lib/persistence/PersistentHydrator
data:
  name: oak
  density: 750
  hardness: 3
  flammability: 0.4
  opacity: 1
  thermalConductivity: 0.17
  electricalConductivity: 1.0e-13
  magneticSusceptibility: 0.0
  edibility: false
  nutrients: ["cellulose"]
  toxicity: []
  damageResistance:
    slash: 0.5
    blunt: 0.4
    pierce: 0.45
  tags: ["wood", "mixture", "organic", "flammable", "once-living"]
  composition: []
  chemistry: null
  biologicalSource: null
