# Narnia — the root Region of the demonstrative addressing tree.
#
# Claims the shortest prefix (`narnia`), so it's the fallback covering
# Locality for anything under it that no more-specific Locality claims.
# Note the divergence: templatePath `/lib/address/narnia` vs claimed
# address `narnia` — the namespace is not the template tree.
class: /lib/address/Locality
hydratorClass: /lib/persistence/PersistentHydrator
data:
  name: Narnia
  _address: narnia
