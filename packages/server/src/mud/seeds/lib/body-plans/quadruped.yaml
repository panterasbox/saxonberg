# Quadruped — four legs, no prehensile hands. Shared by typical
# mammals (dogs, cats, horses) and amphibians (frogs use this too in
# v1; an `amphibian-quadruped` variant lands later if frogs need a
# distinct one). The `back:1` slot accepts any Slottable — saddles
# claim it via Wearable's slot claim, riders occupy it bareback.
class: /lib/species/BodyPlan
hydratorClass: /lib/persistence/PersistentHydrator
data:
  name: quadruped
  slots:
    - { name: head,    accepts: WearableMixin }
    - { name: collar,  accepts: WearableMixin }
    - { name: 'back:1', accepts: SlottableMixin, userFacingDetail: back }
    # Cranial implant slot — parallel to biped. See augmentation
    # subsystem doc; sessile body plans deliberately omit this slot
    # (plants don't get implants in v1).
    - { name: cranial, accepts: SlottableMixin }
  locomotionModes:
    - walk
    - swim
  defaultLocomotionMode: walk
  sensoryPorts:
    - { modality: vision, count: 2, position: frontal }
    - { modality: hearing, count: 2, position: lateral }
    - { modality: smell, count: 1, position: forward }
  # Typed anatomy (Vitals substrate). Four legs, no prehensile hands, so
  # no enablesSlots couplings in v1. Heart / lungs govern their vitals.
  bodyParts:
    - key: body.torso
      parent: null
      tissues:
        - { tissuePath: /lib/material/tissue/bone, mass: 6 }
        - { tissuePath: /lib/material/tissue/muscle, mass: 10 }
        - { tissuePath: /lib/material/tissue/flesh, mass: 12 }
    - key: body.head
      parent: body.torso
      severable: true
      tissues:
        - { tissuePath: /lib/material/tissue/bone, mass: 0.8 }
        - { tissuePath: /lib/material/tissue/flesh, mass: 2 }
    - key: body.leg.frontLeft
      parent: body.torso
      severable: true
      tissues:
        - { tissuePath: /lib/material/tissue/bone, mass: 1 }
        - { tissuePath: /lib/material/tissue/muscle, mass: 2 }
        - { tissuePath: /lib/material/tissue/flesh, mass: 1 }
    - key: body.leg.frontRight
      parent: body.torso
      severable: true
      tissues:
        - { tissuePath: /lib/material/tissue/bone, mass: 1 }
        - { tissuePath: /lib/material/tissue/muscle, mass: 2 }
        - { tissuePath: /lib/material/tissue/flesh, mass: 1 }
    - key: body.leg.rearLeft
      parent: body.torso
      severable: true
      tissues:
        - { tissuePath: /lib/material/tissue/bone, mass: 1.2 }
        - { tissuePath: /lib/material/tissue/muscle, mass: 2.5 }
        - { tissuePath: /lib/material/tissue/flesh, mass: 1 }
    - key: body.leg.rearRight
      parent: body.torso
      severable: true
      tissues:
        - { tissuePath: /lib/material/tissue/bone, mass: 1.2 }
        - { tissuePath: /lib/material/tissue/muscle, mass: 2.5 }
        - { tissuePath: /lib/material/tissue/flesh, mass: 1 }
    - key: body.torso.heart
      parent: body.torso
      governsVital: heartRate
      tissues:
        - { tissuePath: /lib/material/tissue/muscle, mass: 0.1 }
    - key: body.torso.lungs
      parent: body.torso
      governsVital: respiratoryRate
      tissues:
        - { tissuePath: /lib/material/tissue/flesh, mass: 0.5 }
