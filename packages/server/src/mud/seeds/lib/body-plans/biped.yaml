# Biped — two legs, two prehensile hands, upright. Shared by humans,
# dwarves, elves, orcs, halflings. Sensory anatomy: two frontal eyes,
# two lateral ears, one forward nose. Capability variance lives on
# species, not here.
class: /lib/species/BodyPlan
hydratorClass: /lib/persistence/PersistentHydrator
data:
  name: biped
  slots:
    - { name: head,           accepts: WearableMixin }
    - { name: torso,          accepts: WearableMixin }
    - { name: legs,           accepts: WearableMixin }
    - { name: feet,           accepts: WearableMixin }
    - { name: hands,          accepts: WearableMixin }
    - { name: 'finger:left',  accepts: WearableMixin }
    - { name: 'finger:right', accepts: WearableMixin }
    - { name: neck,           accepts: WearableMixin }
    - { name: 'hand:left',    accepts: WieldableMixin }
    - { name: 'hand:right',   accepts: WieldableMixin }
    # Cranial implant slot — accepts SlottableMixin (the broad
    # interface every augment composes). The "implant" semantic
    # lives in the slot's name and the augment's targetSlot field,
    # not in the validator enum. See docs/subsystems/augmentation.md.
    - { name: cranial,        accepts: SlottableMixin }
  locomotionModes:
    - walk
    - climb
    - swim
  defaultLocomotionMode: walk
  sensoryPorts:
    - { modality: vision, count: 2, position: frontal }
    - { modality: hearing, count: 2, position: lateral }
    - { modality: smell, count: 1, position: forward }
  # Typed anatomy (Vitals substrate). Coarse v1 roster: limbs / head /
  # torso + heart / lungs. Tissue masses (kg) are the strength substrate;
  # enablesSlots gates wear/wield; governsVital is the organ→vital
  # coupling. Stable body.* keys are the trauma-site anchor.
  bodyParts:
    - key: body.torso
      parent: null
      tissues:
        - { tissuePath: /lib/material/tissue/bone, mass: 8 }
        - { tissuePath: /lib/material/tissue/muscle, mass: 12 }
        - { tissuePath: /lib/material/tissue/flesh, mass: 20 }
    - key: body.head
      parent: body.torso
      severable: true
      tissues:
        - { tissuePath: /lib/material/tissue/bone, mass: 1 }
        - { tissuePath: /lib/material/tissue/flesh, mass: 4 }
    - key: body.arm.left
      parent: body.torso
      severable: true
      tissues:
        - { tissuePath: /lib/material/tissue/bone, mass: 1.5 }
        - { tissuePath: /lib/material/tissue/muscle, mass: 3 }
        - { tissuePath: /lib/material/tissue/flesh, mass: 1 }
    - key: body.arm.left.hand
      parent: body.arm.left
      severable: true
      enablesSlots: ['hand:left', 'finger:left']
      tissues:
        - { tissuePath: /lib/material/tissue/bone, mass: 0.4 }
        - { tissuePath: /lib/material/tissue/muscle, mass: 0.3 }
        - { tissuePath: /lib/material/tissue/flesh, mass: 0.3 }
    - key: body.arm.right
      parent: body.torso
      severable: true
      tissues:
        - { tissuePath: /lib/material/tissue/bone, mass: 1.5 }
        - { tissuePath: /lib/material/tissue/muscle, mass: 3 }
        - { tissuePath: /lib/material/tissue/flesh, mass: 1 }
    - key: body.arm.right.hand
      parent: body.arm.right
      severable: true
      enablesSlots: ['hand:right', 'finger:right']
      tissues:
        - { tissuePath: /lib/material/tissue/bone, mass: 0.4 }
        - { tissuePath: /lib/material/tissue/muscle, mass: 0.3 }
        - { tissuePath: /lib/material/tissue/flesh, mass: 0.3 }
    - key: body.leg.left
      parent: body.torso
      severable: true
      tissues:
        - { tissuePath: /lib/material/tissue/bone, mass: 4 }
        - { tissuePath: /lib/material/tissue/muscle, mass: 8 }
        - { tissuePath: /lib/material/tissue/flesh, mass: 3 }
    - key: body.leg.left.foot
      parent: body.leg.left
      severable: true
      tissues:
        - { tissuePath: /lib/material/tissue/bone, mass: 0.8 }
        - { tissuePath: /lib/material/tissue/muscle, mass: 0.5 }
        - { tissuePath: /lib/material/tissue/flesh, mass: 0.5 }
    - key: body.leg.right
      parent: body.torso
      severable: true
      tissues:
        - { tissuePath: /lib/material/tissue/bone, mass: 4 }
        - { tissuePath: /lib/material/tissue/muscle, mass: 8 }
        - { tissuePath: /lib/material/tissue/flesh, mass: 3 }
    - key: body.leg.right.foot
      parent: body.leg.right
      severable: true
      tissues:
        - { tissuePath: /lib/material/tissue/bone, mass: 0.8 }
        - { tissuePath: /lib/material/tissue/muscle, mass: 0.5 }
        - { tissuePath: /lib/material/tissue/flesh, mass: 0.5 }
    - key: body.torso.heart
      parent: body.torso
      governsVital: heartRate
      tissues:
        - { tissuePath: /lib/material/tissue/muscle, mass: 0.3 }
    - key: body.torso.lungs
      parent: body.torso
      governsVital: respiratoryRate
      tissues:
        - { tissuePath: /lib/material/tissue/flesh, mass: 1 }
