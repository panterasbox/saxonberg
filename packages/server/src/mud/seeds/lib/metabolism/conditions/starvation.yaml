# Starvation — the floor effect of the `satiation` reserve. Spawned by
# metabolism's reconcile cascade when satiation bottoms out; it accrues
# dwell-time and progresses to the death seam (cause-of-death
# "starvation"). Cleared when satiation recovers above the hysteresis
# band. The lethal timing lives on METABOLIC_DEFAULTS (game-time), not
# here — `progression.intervalMs` is the legibility cadence for a future
# staged-prose pass.
class: /lib/vitals/Condition
hydratorClass: /lib/persistence/PersistentHydrator
data:
  name: starvation
  signature: []
  progression:
    intervalMs: 3600000
  resolution:
    by: food
  observableSigns: [gaunt, hollow-eyed, weak]
  contagion: null
