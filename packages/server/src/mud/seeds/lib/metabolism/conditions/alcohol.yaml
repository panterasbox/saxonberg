# Intoxication — the alcohol exemplar. Keyed by the toxin tag `alcohol`
# so the burden resolves to it directly. The burden STORES ethanol mass
# (grams, the store-raw exception); severity reads the derived BAC
# (`getBAC()`, g/dL) live against the bands below — drunk and acute
# alcohol-poisoning are bands of the ONE axis (the dose makes the
# poison). The only thing distinguishing this from a pure poison is the
# pleasant low rung ("tipsy"). Zero-order (linear) clearance.
class: /lib/vitals/Condition
hydratorClass: /lib/persistence/PersistentHydrator
data:
  name: intoxicated
  signature: []
  progression: null
  resolution:
    by: time
  observableSigns: [flushed, unsteady, slurring]
  contagion: null
  toxinBehavior:
    toxinType: alcohol
    storeRaw: true
    absorptionRate: 0.5
    clearanceRate: 0.12
    potency: 1
    bands:
      - { threshold: 0.03, severity: 1 }
      - { threshold: 0.08, severity: 2 }
      - { threshold: 0.15, severity: 3 }
      - { threshold: 0.25, severity: 4 }
      - { threshold: 0.4, severity: 5 }
