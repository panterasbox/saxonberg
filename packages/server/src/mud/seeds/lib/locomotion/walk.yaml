# Walk — baseline locomotion mode. Default for any biped/quadruped
# with no further author setup. Walk needs no enablement-scope (any
# floor is walk-shaped) and is the fallback for resolveHostMode.
class: /lib/locomotion/LocomotionMode
hydratorClass: /lib/persistence/PersistentHydrator
data:
  name: walk
  speed: 1.0
  noiseLevel: normal
  bodyProfile: upright
  groundContact: full
  requiresBodyPlanMode: [walk]
  requiresPosture: []
  costMultiplier: 1.0
  passthrough: false
  conveyanceMixin: null
  enablementMixin: null
