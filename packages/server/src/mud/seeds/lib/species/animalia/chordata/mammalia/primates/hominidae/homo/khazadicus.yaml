# Homo khazadicus — fantasy dwarf. Same biped anatomy as sapiens; the
# vision profile shifts toward scotopic (better in low light), and the
# lifespan stretches to ~400 years. Recommended pick over Homo elvicus
# for v1 because the visual contrast against sapiens is sharper in
# composition tables.
class: /lib/species/Species
hydratorClass: /lib/persistence/PersistentHydrator
data:
  binomial: Homo khazadicus
  commonNames: ["dwarf"]
  _bodyPlanPath: /lib/body-plans/biped
  _parentCladePath: /lib/species/animalia
  _defaultMaterialPath: /lib/material/tissue/flesh
  lifecycleStates: ["alive", "dead", "undead"]
  sexDeterminationSystem: xy
  reproductiveMode: sexual
  lifespanMin: 0
  lifespanMax: 400
  circadianBand: diurnal
  diet: omnivore
  visionProfile:
    scotopicMin: pitch-black
    photopicMax: bright
    bandShift: -1
  longDescription: >-
    A short, broad-shouldered figure, thick through the chest and
    deep-rooted in stance, with the weathered, stone-patient look of
    someone bred to the dark and the deep.
  nameBankKeys: ["dwarvish"]
