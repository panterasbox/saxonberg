# Uranium — U, atomic number 92. Naturally-occurring radioactive
# actinide. Predominantly uranium-238 in natural abundance (~99.27%);
# this template models that majority isotope's behavior. Half-life
# 4.468 billion years (≈ Earth's age), alpha-emitting, decays into
# thorium-234. The decay product cross-reference is left null in v1
# until thorium content is authored — content extends by adding
# `/lib/material/element/thorium` and pointing this template's
# `_decayProductPath` at it.
#
# This template is the demonstration of `RadioactiveMixin` — only
# materials whose nuclei genuinely undergo spontaneous decay use
# `class: /lib/material/RadioactiveMaterial`. Plain elements stay on
# `class: /lib/material/Material`.
class: /lib/material/RadioactiveMaterial
hydratorClass: /lib/persistence/PersistentHydrator
data:
  name: uranium
  density: 19050
  thermalConductivity: 27
  edibility: false
  nutrients: []
  toxicity: ["radiation", "heavy-metal"]
  tags: ["element", "metal", "actinide", "radioactive", "heavy"]
  composition: []
  symbol: U
  atomicNumber: 92
  molarMass: 238.029
  biologicalSource: null
  halfLife: 4.468e9
  decayMode: alpha
  _decayProductPath: null
