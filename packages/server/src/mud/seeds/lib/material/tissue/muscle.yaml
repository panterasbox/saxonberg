# Muscle — contractile animal tissue. The per-part substrate a future
# strength reading (force over muscle mass) aggregates. Lean seed —
# only the values that matter for the vitals/injury role; the rest of
# Material's physics fields default. (`density` is Material's one
# Quantity field — Quantity<'kg/m³'>, authored bare + marshalled.)
class: /lib/material/Material
hydratorClass: /lib/persistence/PersistentHydrator
data:
  name: muscle
  density: 1060
  hardness: 0.4
  edibility: true
  nutrients: ["protein", "water"]
  savedProps:
    "resistance.slash": 0.05
    "resistance.blunt": 0.15
    "resistance.pierce": 0.05
  tags: ["tissue", "animal", "muscle", "organic", "living", "edible"]
