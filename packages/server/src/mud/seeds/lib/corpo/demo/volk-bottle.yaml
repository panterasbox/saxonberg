# Proof-demo bottle: a branded object that resolves to Veshko via its mark.
# Deliberately NOT Bulkable — booze-as-bulk and the real back-bar are the
# bar build's job. This exists to prove the mark resolves end-to-end.
class: /lib/corpo/BrandedBottle
hydratorClass: /lib/persistence/PersistentHydrator
data:
  shortDescription: a bottle of Volk vodka
  primaryKeyword: bottle
  keywords:
    - volk
    - vodka
  longDescription: |
    A squat, utilitarian bottle of Volk vodka. The label is a grey wordmark and nothing else — no flourish, no promise, just the name and the proof.
  _brandKey: volk
