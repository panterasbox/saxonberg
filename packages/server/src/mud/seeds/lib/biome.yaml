# /lib/biome — the root universe biome. Every other biome inherits
# defaults from here via the chain-walk's templatePath ancestry. No
# Biorealm class; root is just another Biome (per requirements
# decision 1). All five `_defaultX` fields are mandatory at boot —
# `BiomeApi.getRootBiome()` consults this seed for chain step 6.
class: /lib/biome/Biome
hydratorClass: /lib/persistence/PersistentHydrator
data:
  name: universe
  _defaultTemperature: { value: 295, unit: K }
  _defaultPressure:    { value: 101325, unit: Pa }
  _defaultHumidity:    { value: 50, unit: "%" }
  _defaultGravity:     { value: 9.81, unit: "m/s²" }
  _defaultAtmosphere:  air
