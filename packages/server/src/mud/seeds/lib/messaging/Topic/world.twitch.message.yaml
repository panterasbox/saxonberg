data:
  topic: world.twitch.message
  family: world.twitch
  label: Twitch Chat
  description: A message relayed from a bound Twitch channel's chat, or the mirror of a local player's outbound post. A meta/OOC surface — subscription-gated, not implant-gated. Channel attribution rides `meta.channelId`; provenance and the external/external-linked speaker ride the payload.
