# Indoor — climate-controlled baseline. Not sky-exposed. Sub-tiers
# (academic / residential / social / civic / special) refine
# ambient texture; leaves at the deepest level rarely override the
# climate fields.
class: /lib/biome/Biome
hydratorClass: /lib/persistence/PersistentHydrator
data:
  name: indoor
  _defaultTemperature: { value: 294, unit: K }
  _defaultHumidity:    { value: 45, unit: "%" }
  _defaultGravity:     { value: 9.81, unit: "m/s²" }
  _defaultAtmosphere:  air
  _ambientSoundMml: "<markup>a low HVAC hum</markup>"
