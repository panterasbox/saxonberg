# Outdoor meadow — demonstrative leaf for the outdoor sub-tree.
# Extends outdoor/baseline, demonstrating a 3-deep inheritance
# chain (meadow → outdoor/baseline → universe).
class: /lib/biome/SkyExposedBiome
hydratorClass: /lib/persistence/PersistentHydrator
data:
  name: meadow
  _extendsBiomePath: /lib/biome/outdoor/baseline
  # A breezy open meadow — overrides the calm universe default so the
  # wind-chill input is non-zero outdoors (the wind resolve test reads
  # this; the body's effective-ambient resolver consumes it in Phase 2).
  _defaultWind: { value: 8, unit: "m/s" }
  _ambientSoundMml: "<markup>crickets and wind through tall grass</markup>"
  _ambientSmellMml: "<markup>wildflowers and warm hay</markup>"
