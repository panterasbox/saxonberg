# Underground baseline — cave-stable temperature (~12°C), damp, with
# a mineral / earth ambient. NOT sky-exposed. Sub-leaves (tunnel /
# sewer / cave) extend this.
class: /lib/biome/Biome
hydratorClass: /lib/persistence/PersistentHydrator
data:
  name: underground-baseline
  _extendsBiomePath: /lib/biome/universe
  _defaultTemperature: { value: 285, unit: K }
  _defaultHumidity:    { value: 70, unit: "%" }
  _defaultGravity:     { value: 9.81, unit: "m/s²" }
  _defaultAtmosphere:  air
  _ambientSmellMml: "<markup>damp earth and stone</markup>"
