# The Office of the Prime Minister — the executive's communications shop,
# and the `{kind: office}` authority's shipped consumer.
#
# ⭐ STAFF FOLLOWS THE SEAT. The authority is the office, not a person, so
# when the Prime Minister's seat is handed off, so is the power to appoint
# here — with no employment or roster record touched. That is the whole
# reason the appointing authority stopped being a templatePath.
#
# ⚠ It ships unfilled AND with nothing to announce: there is no
# legislature, no bills and no policy yet, so its releases are whatever is
# written in character. Cold start is CONTENT, not mechanism — no NPC
# outlet, no seeded demo release, no synthetic floor.
#
# Realm `world`: unlike the Compact, this is a body inside the fiction.
# Visibility `members`: the executive's default reach is the membership,
# not the open internet. Anything it wants read by an anonymous visitor is
# a deliberate act, and the front-page setting is a separate switch again.
class: /obj/Organization
hydratorClass: /obj/persistence/PersistentHydrator
data:
  appointingAuthority:
    kind: office
    office: prime-minister
  positions:
    - key: communications-director
      label: directing the Prime Minister's communications
      wageRate: 0
      confers: []
    # The nesting consumer: the Press Secretary answers to the
    # Communications Director. Both may publish.
    - key: press-secretary
      label: speaking for the Prime Minister
      wageRate: 0
      confers: []
      reportsTo: communications-director
  rosterSlots: []
  realm: world
  visibility: members
  feedPath: /compact/executive/feed
  publishingPositions:
    - communications-director
    - press-secretary
