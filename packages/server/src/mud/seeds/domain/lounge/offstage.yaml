# off-duty cast. Materialized on demand by shifts (singletonOrClone).
# Players cannot reach it (no Exitable).
class: /domain/lounge/Offstage
hydratorClass: /lib/persistence/PersistentHydrator
data:
  shortDescription: Dave's Bar — Back office
  primaryKeyword: backoffice
  longDescription: |
    A cramped back office that doubles as the staff's bolt-hole: a desk
    buried under receipts, coats on pegs, a punch-clock, and the steady
    hum of the walk-in cooler through the wall. Where the cast are when
    they're not on the floor — and where Dave mostly is, full stop.
