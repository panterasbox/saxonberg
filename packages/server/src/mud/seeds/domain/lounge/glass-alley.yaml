# GlassAlley — the harm-driver demonstrator, one walkable exit (down the
# service stair) off the Terminus Terminal hall. Broken glass on the
# ground: walk in barefoot and it cuts a foot (a laceration through
# ConditionApi.inflict, gated on foot coverage — shoes protect); the bleed
# + limp are then something the medic loop (`assess` → `treat`) has to deal
# with. A couple of bandages are stocked on the ground so the treat loop is
# playable right here. The hazard is the room's own `onEntered` (a one-off
# class, not a reusable mixin). The hall wires the `down` exit in; this
# template declares its own back exit (`up`) so both sides are self-
# describing.
class: /domain/lounge/GlassAlley
hydratorClass: /lib/persistence/PersistentHydrator
data:
  shortDescription: the service alley behind the terminal
  primaryKeyword: alley
  longDescription: |
    A cramped brick throat of an alley behind the station, barely shoulder-wide, that smells of rain and cold iron. The ground is a minefield of broken bottles — green and brown glass ground into the wet concrete, catching the light from the terminal's back door. A dented first-aid tin has been left open against the wall, its contents spilling out. Watch your step; better yet, watch your feet.

    The terminal hall is back up the service steps.
  details:
    glass:
      keywords: [glass, bottle, bottles, shard, shards, floor, ground]
      description: |
        Bottle glass, years of it, smashed and trodden into the concrete until the alley floor glitters like a dark riverbed. Some of the shards stand up on edge, waiting. Nobody's ever swept it; barefoot is a genuinely bad idea.
    tin:
      keywords: [tin, kit, first-aid, box, bandage, bandages]
      description: |
        A battered first-aid tin, lid rusted open, tipped against the wall. A few clean bandages have spilled out onto a folded rag — enough to bind a cut, if you're quick about it.
  exits:
    up:
      destination: /domain/terminus/terminal/hall
      bidirectional: false
  populates:
    - /domain/lounge/bandage
    - /domain/lounge/bandage
