# Dave's Bar — the singleton external-neighbor shell one exit north of
# the lounge host. NOT a Warren member: never cloned, budded, drained,
# or reaped. The Warren wires the back-exit (south, to the host) when it
# designates or migrates the host; the south exit is therefore NOT
# declared here.
#
# SingletonMixin pins it to one instance (the host-fixture wiring resolves
# it via StuffApi.singleton). `populates:` stocks it each boot: the
# crafting fixtures — the back-bar (a Surfaced shelf), the working bottles
# + tools placed ON it (`onto`, so they read "on the back-bar," reachable
# but not loose among the occupants — the back-bar must be listed before
# its `onto` items), and the chalkboard menu — plus the cast. Crafting
# needs no venue flag: the bar "works" because the maker + matter are
# present/reachable here. All cloned fresh (transient runtime).
class: /domain/lounge/Bar
hydratorClass: /lib/persistence/PersistentHydrator
data:
  shortDescription: Dave's Bar
  primaryKeyword: bar
  illustration: location/bar.png
  longDescription: |
    A narrow, warm room that smells of citrus peel and old wood. The bar itself is a single slab of something dark and scarred, lit from beneath so the bottles ranked behind it throw long colored shadows up the wall. Stools wait in a patient row. Behind the taps a chalkboard menu has been wiped and rewritten so many times it's gone soft and grey. Neon signs and brass tap handles wash the far wall in an amber haze — a wall crowded with framed photographs, a chipped mug on a high shelf, and a few curling, signed dollar bills.

    The lounge is back through the doorway to the south.
  # Examine-on-demand (the barfly look-closely layer). The room `look`
  # names these; the stories are latent until pulled (`look at the
  # photos`, `look at the signs`). The corpo legibility surface ties the
  # branded bottles + Remy's gossip to the wall; the photo wall + the
  # mug + the bills carry the bar's attributed, un-fakeable history.
  details:
    signs:
      keywords: [sign, signs, neon, tap, taps, handle, handles, light, lights]
      description: |
        The glow is corporate. Each neon sign and brass tap handle carries a maker's mark, and Dave chose every one — which makes the far wall a map of his politics. A Veshko sign hums beside an Aevex one that's never quite forgiven it; a cheap proud Hollis light buzzes a few feet from the cool Vionne script it's spent years undercutting. Read the wall and you can read the whole avenue's quarrels, lit up in amber and rose.
    photos:
      keywords: [photo, photos, photograph, photographs, wall, picture, pictures, frame, frames]
      description: |
        Decades of regulars, going yellow in their frames. A younger Dave mid-impression, caught with one arm flung wide and the whole room laughing. A broad half-orc — Augie, unmistakably — behind the bar with a clipboard under one arm and a grin like he owns the place, though he never did. Empty stools photographed on purpose, the way you photograph people who aren't coming back.
    mug:
      keywords: [mug, tankard, shelf, brass, plate]
      description: |
        A chipped pewter mug sits alone on a high shelf, a little brass plate screwed beneath it with a name worn past reading. Nobody washes it. Nobody moves it. The bar keeps its own, and this is how it remembers them.
    bills:
      keywords: [bill, bills, dollar, dollars, note, notes, money]
      description: |
        Signed bills tacked up behind the rail, gone soft with smoke and years — first dollars, dares paid off, a couple of IOUs in Dave's own hand that he plainly never meant to collect. Every one is somebody's small story, kept where they can see it kept.
    slab:
      keywords: [slab, counter, woodwork, wood, scar, scars, rings]
      description: |
        Up close the dark slab is a ledger of its own — water rings inside water rings, a constellation of old cigarette burns, initials gouged in by somebody who got told off for it. Sanded smooth, never replaced. A newer bar would have thrown it out years ago; that's rather the point.
    stools:
      keywords: [stool, stools, seat, seats, leather, rail]
      description: |
        Worn leather, each one shaped a little differently by the body that owns it — and on a quiet night one at the end of the rail sits empty on purpose, kept for whichever of the staff is off-shift and drinking here anyway. Where else would they go.
  # The way into Dave's office. Declared `hidden` and `bidirectional:
  # false` (the office declares its own plain south exit back out; the
  # bar->lounge south exit is wired imperatively by the Warren and not
  # declared here). IMPORTANT: `hidden` exits are excluded from BOTH the
  # obvious-exits list AND movement targeting — `canReach` and the MQL
  # exit resolver iterate getObviousExits(), so a hidden exit is not
  # walkable by name (`north` -> "you can't walk that way"). So today
  # the office is a SEALED inner sanctum, reachable by no one — the
  # intended "inaccessible until earned" placeholder. Lighting it up
  # (a regard-gated reveal, a `search`-reveals-hidden mechanic, or just
  # flipping `hidden: false` to make it freely walkable) is the deferred
  # follow-up. Verified live 2026-06-28: `north` is correctly blocked.
  exits:
    north:
      destination: /domain/lounge/office
      hidden: true
      bidirectional: false
    # The service alley out back — the harm-driver demonstrator (broken
    # glass underfoot). Walkable, one-way declared so it installs no
    # colliding inverse (the alley declares its own east exit back here).
    west:
      destination: /domain/lounge/glass-alley
      bidirectional: false
  # The corpo battlefield, lit. Branded neon signs attached as non-
  # portable wall fixtures (AdornableMixin.applyAdornments): each carries
  # a corpo mark and emits light, so rival Veshko (amber) and Aevex
  # (cool blue) literally glow against each other over the back-bar —
  # the fault line the `signs` detail + Remy's gossip describe.
  adornments:
    - { template: /domain/lounge/neon-veshko, slot: sign:veshko }
    - { template: /domain/lounge/neon-aevex, slot: sign:aevex }
  # The crafting fixtures stock the rail; the cast spawns here on
  # hydration too. Each cast member is an NPC template + behavior data;
  # the `shifts` brain sorts them by the game clock — whoever's on shift
  # stays, the rest step out back. The staff are `Crafter`s (MakerMixin
  # NPCs) so the present bartender fulfills an `order`.
  populates:
    - /domain/lounge/back-bar
    - { template: /domain/lounge/gin-bottle, onto: /domain/lounge/back-bar }
    - { template: /domain/lounge/vermouth-bottle, onto: /domain/lounge/back-bar }
    - { template: /domain/lounge/rum-bottle, onto: /domain/lounge/back-bar }
    - { template: /domain/lounge/lime-bottle, onto: /domain/lounge/back-bar }
    - { template: /domain/lounge/shaker, onto: /domain/lounge/back-bar }
    - { template: /domain/lounge/mixing-glass, onto: /domain/lounge/back-bar }
    # Empty serving glasses on the rail — the receptacle a hand build
    # strains into (the served `order` path clones its own; a by-hand
    # build needs a real glass present). Keyword `cocktail` (vs the
    # mixing glass's `mixing`) keeps `strain … into cocktail` unambiguous.
    - { template: /domain/lounge/cocktail-glass, onto: /domain/lounge/back-bar }
    - { template: /domain/lounge/cocktail-glass, onto: /domain/lounge/back-bar }
    # The tip jar on the rail — patrons `tip`, the on-shift bartender
    # `collect`s it (physical coin, off the books).
    - { template: /domain/lounge/tip-jar, onto: /domain/lounge/back-bar }
    - /domain/lounge/bar-menu
    - /domain/lounge/npc/mara
    - /domain/lounge/npc/remy
    - /domain/lounge/npc/sloane
    - /domain/lounge/npc/augie
    - /domain/lounge/npc/dave
