# Dave's Bar — the singleton external-neighbor shell one exit north of
# the lounge host. NOT a Warren member: never cloned, budded, drained,
# or reaped. The Warren wires the back-exit (south, to the host) when it
# designates or migrates the host; the south exit is therefore NOT
# declared here.
#
# SingletonMixin pins it to one instance (the host-fixture wiring resolves
# it via StuffApi.singleton). `populates:` stocks it each boot — Dave, the
# menu, the back-bar (a Surfaced fixture), and the working bottles + tools
# placed ON the back-bar (`onto`), so they read "on the back-bar," visible
# and reachable, not loose among the room's occupants. The back-bar must be
# listed before its `onto` items. All cloned fresh (transient runtime).
# Crafting needs no venue flag: the bar "works" because the maker + matter
# are present/reachable here.
class: /domain/lounge/Bar
hydratorClass: /lib/persistence/PersistentHydrator
data:
  shortDescription: Dave's Bar
  primaryKeyword: bar
  illustration: location/bar.png
  populates:
    - /obj/back-bar
    - { template: /obj/vessel/gin-bottle, onto: /obj/back-bar }
    - { template: /obj/vessel/vermouth-bottle, onto: /obj/back-bar }
    - { template: /obj/vessel/rum-bottle, onto: /obj/back-bar }
    - { template: /obj/vessel/lime-bottle, onto: /obj/back-bar }
    - { template: /obj/tool/shaker, onto: /obj/back-bar }
    - { template: /obj/tool/mixing-glass, onto: /obj/back-bar }
    - /obj/Npc/dave
    - /obj/Menu/bar-menu
  longDescription: |
    A narrow, warm room that smells of citrus peel and old wood. The bar itself is a single slab of something dark and scarred, lit from beneath so the bottles ranked behind it throw long colored shadows up the wall. Stools wait in a patient row. Behind the taps a chalkboard menu has been wiped and rewritten so many times it's gone soft and grey.

    The lounge is back through the doorway to the south.
