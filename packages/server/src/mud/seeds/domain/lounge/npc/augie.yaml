# Augie — the Veteran (weekend cover). Semi-retired; patient, wry,
# generous, a storyteller. Weekends taste different — slower, storied,
# the old guard. The keeper of the bar's history (and its succession).
class: /lib/character/NPC
hydratorClass: /lib/persistence/PersistentHydrator
data:
  name: Augie
  pronouns: he
  _speciesPath: /lib/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  primaryKeyword: augie
  shortDescription: an old, easy-handed bartender
  longDescription: |
    Grey at the temples and slow to hurry, he pours like the bar is an
    old friend's kitchen. There's a story behind every bottle and he'll
    tell you the good ones if you stay long enough.
  behaviors:
    - brain: /lib/behavior/shifts
      trigger: cadence:30s
      config:
        behindBar: /domain/lounge/bar
        railStool: /domain/lounge/bar
        offstage: /domain/lounge/offstage
        schedule:
          - { days: [5, 6], hours: [10, 24], state: on-shift }
    - brain: /lib/behavior/idles
      trigger: cadence:13s
      config:
        pool:
          - { kind: free, value: "polishes a glass and holds it up, satisfied." }
          - { kind: free, value: "hums something old and tuneless." }
          - { kind: say, value: "Now, the fella who used to own this place..." }
    - brain: /lib/behavior/random-chatter
      trigger: cadence:31s
      config:
        lines:
          - "No rush in here, friend."
          - "I ever tell you how Dave got this bar?"
          - "Weekends are for the regulars."
    - brain: /lib/behavior/greets
      trigger: arrival
      config:
        lines:
          - "Well, come on in."
          - "Good to see you. Sit, sit."
