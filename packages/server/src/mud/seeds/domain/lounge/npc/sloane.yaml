# Sloane — the Confessor (night shift, weekdays; wraps past midnight).
# Brooding, perceptive, secretive. Says little, sees everything, keeper
# of the after-hours. Two schedule entries cover the midnight wrap.
class: /lib/character/Crafter
hydratorClass: /lib/persistence/PersistentHydrator
data:
  name: Sloane
  pronouns: they
  _speciesPath: /lib/species/animalia/chordata/mammalia/primates/hominidae/homo/sensitivus
  lifecycleState: alive
  primaryKeyword: sloane
  shortDescription: a still, attentive bartender
  longDescription: |
    Quiet at the dark end of the bar, polishing nothing in particular,
    watching the room over the rim of a glass they never quite drink
    from. There's an uncanny attentiveness to them — one of the
    attuned-born, who seem to read the air itself — so they always seem
    to know who needs another and who just needs someone to listen.
  # Established character: still, watchful, secretive, a keeper of
  # confidences — the Confessor.
  dispositions:
    - { disposition: sociability, valence: -70 }
    - { disposition: composure, valence: 70 }
    - { disposition: honesty, valence: -70 }
    - { disposition: compassion, valence: 70 }
  behaviors:
    - brain: /lib/behavior/shifts
      trigger: cadence:30s
      config:
        behindBar: /domain/lounge/bar
        railStool: /domain/lounge/bar
        offstage: /domain/lounge/offstage
        schedule:
          - { days: [0, 1, 2, 3, 4], hours: [22, 24], state: on-shift }
          - { days: [0, 1, 2, 3, 4], hours: [0, 6], state: on-shift }
    - brain: /lib/behavior/idles
      trigger: cadence:14s
      config:
        pool:
          - { kind: free, value: "wipes the same spot on the bar, slowly." }
          - { kind: free, value: "watches the door without seeming to." }
          - { kind: free, value: "pours a measure with unhurried precision." }
    - brain: /lib/behavior/random-chatter
      trigger: cadence:53s
      config:
        lines:
          - "Rough one?"
          - "We're open a while yet."
          - "..."
    - brain: /lib/behavior/greets
      trigger: arrival
      config:
        lines:
          - "Hey."
          - "Take your time."
    # Trait-aware chatter: Sloane's deep reserve keeps this near-silent.
    - brain: /lib/behavior/converses
      trigger: cadence:19s
      config:
        chatty:
          - "You came back."
        terse:
          - "..."
          - "Mm."
    # The branching-tree responder — `talk to sloane`. Sloane is the
    # Confessor: perceptive (composure +70 unlocks the "what do you see"
    # read), secretive (honesty -70 keeps the confidences), compassionate
    # (+70 — the unload-on-me path). The good stuff opens only with
    # regard; a stranger gets quiet courtesy, not the dark end of the bar.
    - brain: /lib/behavior/tree-dialogue
      trigger: engage
      config:
        entry:
          - node: warm
            guard:
              - { fact: regard, op: gte, value: 20 }
          - node: neutral
        nodes:
          warm:
            beat: "You came back. Sit at the dark end — it's quieter down here. You look like you've had a day."
            choices:
              - { line: "Honestly? It's been a rough one.", to: confess }
              - line: "What do you see, watching all night?"
                guard:
                  - { fact: "trait:composure", op: gte, value: 50 }
                to: watch
              - { line: "Nothing a quiet drink won't fix.", to: done }
          neutral:
            beat: "...Hey. Sloane. Pull up if you like — I don't pry."
            choices:
              - { line: "You always this quiet?", to: quiet }
              - { line: "Something's been on my mind.", to: confess }
              - { line: "Just a drink, thanks.", to: done }
          confess:
            beat: >-
              I'm listening. No charge for that one, and it doesn't leave
              this end of the bar.
            choices:
              - line: "Thanks. I needed that."
                to: done
                effects:
                  - { verb: regard, delta: 3 }
              - { line: "Forget I said anything.", to: done }
          watch:
            beat: >-
              Mostly I see who needs another and who just needs someone to
              not say anything. You're the second kind, tonight.
            choices:
              - line: "You're good at this."
                to: done
                effects:
                  - { verb: regard, delta: 2 }
              - { line: "Spooky, that.", to: done }
          quiet:
            beat: >-
              Quiet keeps the confidences. People tell me things — and I
              keep them. That's the whole job, after midnight.
            choices:
              - { line: "Fair enough.", to: done }
          done:
            beat: "Door's open a while yet. Mind the late hour."
            terminal: true
