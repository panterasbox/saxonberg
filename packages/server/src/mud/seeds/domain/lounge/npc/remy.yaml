# Remy — the Connector (swing shift, weekdays). Gregarious, charming, a
# harmless gossip; the buzz and the rumor-mill. Holds court (more
# chatter) and reacts to what he sees in the room.
class: /lib/character/Crafter
hydratorClass: /lib/persistence/PersistentHydrator
data:
  name: Remy
  pronouns: he
  _speciesPath: /lib/species/animalia/chordata/mammalia/primates/hominidae/homo/infernalis
  lifecycleState: alive
  primaryKeyword: remy
  shortDescription: a grinning, fast-talking tiefling
  longDescription: |
    All motion and warmth, a crooked grin under a neat pair of swept-back
    horns and a tail that punctuates his stories when his hands are busy.
    He works the rail like a stage — a wink here, a refill there, a rumor
    always half-told — and knows everyone's name by the second visit and
    most of their business by the third.
  # Established character: gregarious, bold, a harmless gossip — the
  # Connector. Slate-pinned gregarious.
  dispositions:
    - { disposition: sociability, valence: 70 }
    - { disposition: boldness, valence: 70 }
    - { disposition: honesty, valence: -70 }
  behaviors:
    # Intrinsic auto-introduce: name themselves to newcomers so patrons
    # learn who they are (the NPC half of the auto-introduce feature).
    - brain: /lib/behavior/introduces
      trigger: arrival
    - brain: /lib/behavior/shifts
      trigger: cadence:30s
      config:
        behindBar: /domain/lounge/bar
        railStool: /domain/lounge/bar
        offstage: /domain/lounge/offstage
    - brain: /lib/behavior/idles
      trigger: cadence:9s
      config:
        pool:
          - { kind: free, value: "spins a coaster across the bar and catches it." }
          - { kind: free, value: "leans in, mid-story, eyes bright." }
          - { kind: say, value: "— so anyway, there I was." }
          - { kind: say, value: "You hear about the corpo lot up the avenue?" }
    - brain: /lib/behavior/random-chatter
      trigger: cadence:23s
      config:
        lines:
          - "Good to see a friendly face!"
          - "I'm just saying, you didn't hear it from me."
          - "First round's the important one, that's my philosophy."
    - brain: /lib/behavior/greets
      trigger: arrival
      config:
        lines:
          - "Hey hey — welcome in, friend!"
          - "There they are! Pull up a stool."
          - "Look who it is!"
    - brain: /lib/behavior/reacts
      trigger: emote
      config:
        reactions:
          - { respond: "Ha! That's the spirit." }
          - { respond: "Now you're talking." }
    # Trait-aware chatter: Remy's gregarious sociability keeps this loud.
    - brain: /lib/behavior/converses
      trigger: cadence:17s
      config:
        chatty:
          - "So get this — you'll love this one."
          - "Stick around, it only gets better."
          - "Between us? Big doings up the avenue."
        terse:
          - "Mm. Busy one."
    # The branching-tree responder — `talk to remy`. Remy is the
    # information node: gossip, the corpo buzz up the avenue, and an
    # offer to introduce you around. His dishonesty (-70) unlocks the
    # conspiratorial "you didn't hear it from me" choices; warmth opens
    # with a rumor he's been saving for you.
    - brain: /lib/behavior/tree-dialogue
      trigger: engage
      config:
        entry:
          - node: warm
            guard:
              - { fact: regard, op: gte, value: 20 }
          - node: neutral
        nodes:
          warm:
            beat: "There they are! Sit, sit — I've been saving one just for you."
            choices:
              - { line: "Go on then, what's the word?", to: gossip }
              - line: "You know everyone — introduce me around?"
                to: intro
              - line: "Always good to see you, Remy."
                to: warm
                effects:
                  - { verb: regard, delta: 3 }
              - { line: "Just here for the quiet.", to: done }
          neutral:
            beat: "Hey hey — new face! Well, not anymore. Remy's the name. What're we drinking, friend?"
            choices:
              - { line: "What's the word around here?", to: gossip }
              - line: "You look like a man who hears things."
                guard:
                  - { fact: "trait:honesty", op: lt, value: 0 }
                to: gossip
              - { line: "Nothing for now, thanks.", to: done }
          gossip:
            beat: >-
              Between us? Big doings with the corpo lot up the avenue —
              but you didn't hear it from me.
            choices:
              - line: "Tell me more."
                to: avenue
                effects:
                  - { verb: regard, delta: 2 }
              - { line: "You're terrible, Remy.", to: done }
          avenue:
            beat: >-
              There's a story in every bottle on that shelf, if you know
              who owns what. Stick around long enough and I'll teach you
              to read the room.
            choices:
              - line: "I'd like that."
                to: done
                effects:
                  - { verb: regard, delta: 2 }
              - { line: "Maybe later.", to: done }
          intro:
            beat: "Say the word and I'll point you at the right people. That's what I'm for."
            choices:
              - line: "Appreciate it."
                to: done
                effects:
                  - { verb: regard, delta: 2 }
              - { line: "I'll find my own way.", to: done }
          done:
            beat: "Catch you 'round, friend!"
            terminal: true
