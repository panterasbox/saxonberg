# The alcove's ceiling lamp — the thing that makes the wire alcove a
# room you can see in.
#
# It is here because light is not ambient by default: a Location with no
# LightSource in it reads `pitch-black`, and at that band the vision
# modality's `canSee` gate fails, so `RecognitionApi.describe` falls all
# the way back to "someone" / "something" for every occupant. A dark
# room doesn't just look dark — nobody in it can be named, targeted by
# name, or told apart. (Found live: the crossing tests couldn't address
# each other, and the wardrobe read as "something".) Every furnished
# room in the lounge is lit the same way, fixture-side: the bar has its
# neons, this nook has a lamp.
#
# `on: true` — it is a fixed ceiling fitting, not a prop to switch off;
# it just happens to ride the shipped PortableLight class, which is the
# only concrete LightSource in the library.
class: /lib/equipment/PortableLight
hydratorClass: /lib/persistence/PersistentHydrator
data:
  shortDescription: a caged ceiling lamp
  primaryKeyword: lamp
  keywords: [lamp, light, ceiling, cage]
  longDescription: |
    A bare bulb in a wire cage, screwed to the ceiling just off-centre.
    It throws a flat working light with no warmth in it at all — the
    kind of fitting nobody chose, only installed.
  on: true
  emittedIntensity: 300
  emittedColorTemperature: 4000
