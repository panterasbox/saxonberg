# The lounge Warren — the singleton coordinator (an incorporeal Idea,
# NOT a Location) that owns the elastic graph of lounge-room instances.
#
# This template makes the LoungeWarren *class* resolvable and gives
# `StuffApi.singleton('/domain/lounge/warren')` a path to lazily clone
# the one Warren instance on first landing. Avatars spawn here via
# `data.startLocation: /domain/lounge/warren` — `applyStartLocation`
# resolves the Warren and lands them in its host room.
#
# Nothing about the Warren persists beyond this definition: the instance
# and every room it coordinates are runtime-only and reconstitute on the
# next first-landing after a restart. No hydratorClass — the Warren has
# no persistent or instruction fields to apply.
class: /lib/multilocation/LoungeWarren
data: {}
