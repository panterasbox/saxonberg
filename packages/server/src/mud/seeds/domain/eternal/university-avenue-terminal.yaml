# The University Avenue TPA terminal — the EU campus node. Both-directional;
# routes back to the lounge node. `seatIn` points at the static University
# Avenue room: a plain singleton location, so the terminal seats ITSELF
# directly into it on postRegister (FixtureMixin — same field as the lounge
# terminal, only the target type differs). Authored from the generic
# TpaTerminal class (terminals live in their area's domain, not
# /domain/common/tpa/).
class: /domain/common/tpa/TpaTerminal
hydratorClass: /lib/persistence/PersistentHydrator
data:
  seatIn: /domain/eternal/university-avenue/plaza
  shortDescription: a Teleport Authority terminal
  keywords: [university-avenue, campus, university, avenue]
  directionality: both
  routes:
    - to: /domain/lounge/terminal
