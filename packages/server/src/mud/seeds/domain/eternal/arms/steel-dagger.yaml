class: /lib/equipment/Weapon
hydratorClass: /lib/persistence/PersistentHydrator
data:
  shortDescription: a steel dagger
  primaryKeyword: dagger
  longDescription: >
    A slim double-edged dagger of good steel, a hand-span of blade. It
    delivers a cutting edge, and its point will find a gap in mail.
  _materialPath: /lib/material/alloy/steel
  constructionForm: bladed
  gradeBand: fine
  mass: 0.3
  # A light, fast blade — a favourable emergent-tempo hook (a dagger acts
  # more often than a heavy weapon). Neutral is 1.0; see combat Tempo.
  balanceFactor: 1.6
  # One-handed — claims a single hand slot (wield it in either hand).
  slotClaims:
    "/lib/body-plans/biped": ["hand:right"]
