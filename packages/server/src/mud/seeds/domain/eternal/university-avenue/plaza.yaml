# University Avenue plaza — the campus-edge street, across the avenue from the
# Terminus station. The standalone University Avenue TPA terminal is RETIRED;
# Terminus (its own branch, across the street) absorbs the campus-arrival role,
# so travellers arrive at Terminus and walk across to campus (the last mile on
# foot). The plaza stays in /domain/eternal/ (its EU owner sphere) and is
# reachable on foot from the bank etc.; only the terminal was removed.
#
# The `east` exit is the reciprocal of the Terminus arrival-gate's cross-branch
# exit — two independently-owned zones that touch in the world (no shared zone).
# Cross-zone exits are authored explicitly on both sides (never grid-derived);
# a cardinal name is allowed cross-zone (CartesianLocation.addExit only forces
# cross-zone for NON-cardinal names), so this is a plain `east`/`west` pair.
class: /lib/location/CartesianLocation
hydratorClass: /lib/persistence/PersistentHydrator
data:
  shortDescription: University Avenue
  primaryKeyword: plaza
  longDescription: |
    A broad transit plaza at the edge of Eternal University. Plane trees line a swept stone concourse; banners snap overhead, and the campus rises in pale terraces beyond a low wall. Across the avenue, past the kerb, the tall grey hall of the Terminus station faces the gates.
  coords:
    x: 0
    y: 0
    z: 0
  exits:
    # North one cell to the campus bank (the bank declares `south` back here);
    # `east` across the avenue to the Terminus arrival gate (a cross-branch
    # exit, declared on both sides). Every connection is authored explicitly.
    north:
      destination: /domain/eternal/university-avenue/bank
    east:
      destination: /domain/terminus/terminal/arrival-gate
