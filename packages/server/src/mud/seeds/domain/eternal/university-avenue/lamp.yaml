# The crossing lamppost — `Lamp` = LightSource + Switchable + Detailed. It
# lights at dusk and goes dark at dawn on its own (a host-bound WorldClockApi
# schedule, no seed params needed), and a passer-by can `switch` it by hand
# between boundaries. The fluted post also carries the crossing's posters.
class: /obj/Lamp
hydratorClass: /lib/persistence/PersistentHydrator
data:
  shortDescription: a cast-iron lamppost
  primaryKeyword: lamppost
  longDescription: |
    A fluted cast-iron lamppost at the kerb, its glass head clouded with age. It comes on by itself at dusk and dies at dawn, keeping the crossing lit through the dark hours for a traffic that is all on foot. A few weathered posters are stuck around the base.
  details:
    head:
      keywords: [head, glass, lamp, light, bulb]
      description: A clouded glass head on an iron collar; the filament inside glows amber after dark and sits cold and grey by day.
    posters:
      keywords: [posters, poster, bills, flyers, notices]
      description: Weathered bills pasted round the base and painted over by rain — a lecture series, a lost cat, a room to let, layered until the oldest are just texture.
