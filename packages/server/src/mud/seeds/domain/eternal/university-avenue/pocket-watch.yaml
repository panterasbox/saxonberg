# Gus's pocket-watch — `/obj/Watch` (Sealable + Timekeeping + Detailed +
# Reserved). Carried on its chain; equipped at standup by Gus.equipLoadout.
# It keeps game-time and DRIFTS: `setTo` is seeded to a wrong hour and `rate`
# runs a touch under 1.0, so the dial disagrees with the accurate ClockTower
# across the avenue. It is ALWAYS-WOUND (the mainspring fills at construction
# and Gus winds it daily), so it never stops — it only drifts. He never SETS
# it right (the "won't set" of the sit/set/open/cross quartet). The AUGUSTUS
# engraving hides the full name the badge keeps off. Generic object:
# Visible.shortDescription, never Named.
class: /obj/Watch
hydratorClass: /lib/persistence/PersistentHydrator
data:
  shortDescription: a brass pocket-watch
  primaryKeyword: watch
  keywords: [watch, pocketwatch, brass, hunter, chain]
  longDescription: |
    A brass hunter-cased pocket-watch on a worn chain, the lid smoothed where a thumb flips it open. Inside, the dial keeps a time all its own — close, but never quite the hour the clock tower shows, and drifting a little further off with every passing day. Nobody has ever set it right.
  # 3:47 — a wrong hour to start from; `rate` < 1.0 is the honest slow drift.
  setTo: 227
  rate: 0.995
  details:
    engraving:
      keywords: [engraving, case, augustus, name, inscription]
      description: |
        Inside the case, engraved in a fine old hand: AUGUSTUS. The full name, handed down the chain and half-disowned — kept here, the one place he lets it show, where the badge outside says only 'Gus'.
