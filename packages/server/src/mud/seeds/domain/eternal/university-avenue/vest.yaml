# Gus's high-vis vest — a `Garment` (Wearable) worn on the biped torso slot.
# Equipped onto Gus at standup by `Gus.equipLoadout` (there is no declarative
# seed path to WEAR gear on an NPC — see obj/Gus.ts). Generic object, so it
# uses Visible.shortDescription and is never Named. Its faded orange and the
# pinholes-where-the-badge-re-clips are Detailed sub-features; the CROSSING
# AUTHORITY badge itself is Gus's own hero detail (on gus.yaml), clipped here.
class: /lib/equipment/Garment
hydratorClass: /lib/persistence/PersistentHydrator
data:
  shortDescription: a faded hi-vis vest
  primaryKeyword: vest
  keywords: [vest, hi-vis, hivis, orange, safety]
  longDescription: |
    A high-visibility orange safety vest gone soft at the seams, the reflective striping worn dull and grey with the years. Down the front, a scatter of pinholes marks where a badge has been clipped and re-clipped a thousand times. It is the whole uniform of a one-man Authority, and he keeps it squared.
  slotClaims:
    "/lib/body-plans/biped": [torso]
  details:
    striping:
      keywords: [striping, stripe, reflective, silver]
      description: Two bands of reflective striping across the chest, the silver crazed and lifting — it caught headlights once, on a road that has never had any.
    pinholes:
      keywords: [pinholes, holes, pin, clip]
      description: A little constellation of pinholes over the heart, each the ghost of a badge re-clipped a fraction to the left of the last. He has never got it quite square, and never stopped trying.
