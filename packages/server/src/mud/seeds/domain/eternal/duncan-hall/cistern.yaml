# The Flooded Cistern — the respiration drown-here proof.
#
# A brick maintenance cistern under the Duncan Hall steps, long since
# flooded. Its `_atmosphere` is `water`: an air-breather who climbs down
# into it stops exchanging gas and the respiration drain engages — a real
# drown-here hazard a body *enters* by walking (the move reassess fires on
# the traverse). Reached via the `down` exit from the steps (auto-reversed
# to `up`); sits one cell below at [0, 0, -1].
#
# This is the W1 proof content — not the Atlantis area, just a place a
# body can actually drown. (`inhale` before descending buys a longer dive;
# climbing back `up` to the steps cancels the drain and recovers.)
#
# Its way back up to the steps is declared explicitly here (exits are authored
# on both sides — the steps declare `down` to here, this room declares `up`
# back). One cell below the steps at [0, 0, -1].
class: /lib/location/CartesianLocation
hydratorClass: /lib/persistence/PersistentHydrator
data:
  shortDescription: a flooded cistern
  primaryKeyword: cistern
  longDescription: |
    Cold black water fills this brick vault to the brim — a maintenance cistern that overflowed a long time ago and was never pumped out. Iron rungs climb the near wall back up toward daylight. Whatever was stored down here is gone; only silt and the slow drift of the water remain.
  coords:
    x: 0
    y: 0
    z: -1
  exits:
    up:
      destination: /domain/eternal/duncan-hall/steps
  _atmosphere: water
