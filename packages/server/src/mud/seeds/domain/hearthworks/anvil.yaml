# The smithy anvil — the `anvil` capability fixture: a ToolItem too heavy
# to walk off with (a fixture by encumbrance, not by flag — 60 kg sits
# past a normal biped's strain ceiling). The recipe gate is emergent
# reachability: hammer + anvil + heat, wherever they are.
class: /lib/craft/ToolItem
hydratorClass: /lib/persistence/PersistentHydrator
data:
  shortDescription: the smithy anvil
  primaryKeyword: anvil
  keywords: [anvil, stump]
  longDescription: |
    A smithy anvil on a scarred oak stump, its face bright where ten thousand blows have polished it.
  capabilities: [anvil]
  _materialPath: /lib/material/element/iron
  mass: 60
