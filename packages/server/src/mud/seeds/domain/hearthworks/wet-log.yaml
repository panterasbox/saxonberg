# A rain-soaked oak log — same Combustible, but its wick is wet: the ignition
# energy balance must first boil off the water it holds, so it resists catching
# until it dries (the wet-firewood, now derived). Its saturation is authored.
class: /obj/Firewood
hydratorClass: /lib/persistence/PersistentHydrator
data:
  shortDescription: a rain-soaked oak log
  keywords: [log, oak, firewood, wood, wet]
  _materialPath: /lib/material/wood/oak
  charMaterialPath: /lib/material/element/carbon
  _saturation: 1
  reserves:
    fuel:
      capacityValue: 100
      currentValue: 100
      unit: "%"
      theme: combustion
      floorEffect: null
