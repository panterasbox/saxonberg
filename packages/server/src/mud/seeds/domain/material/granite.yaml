# Granite — coarse-grained igneous rock. Heavy, hard, electrically
# inert. The default stone for walls and statuary.
class: /lib/stuff/Material
hydratorClass: /lib/persistence/PersistentHydrator
data:
  name: granite
  density: 2750
  hardness: 7
  flammability: 0
  opacity: 1
  thermalConductivity: 2.8
  electricalConductivity: 1.0e-6
  magneticSusceptibility: 0.001
  edibility: false
  nutrients: []
  toxicity: []
  damageResistance:
    slash: 0.8
    blunt: 0.7
    pierce: 0.6
