# The sellsword — the cycle-2 multi-party demonstrator's recruitable ally,
# now also the FORMATIONS demonstrator's front line. A hireable
# `Mercenary` (PartyMemberMixin(NPC)): form a party, `party enlist the
# sellsword`, and she fights on your side. Her `backs-up` brain watches
# for a party-mate who has drawn steel and joins that fight
# (CombatApi.join) against their foe; once in, the session's default
# `combatant` brain drives her gambits (formation-role-aware — a `front`
# holds the line), and her `arms` brain keeps a blade in hand. A sentient
# human, so the same two-stage-death rules apply to her as to any person.
# Generic-but-carved (no proper name — recruited by role, not name;
# Visible.shortDescription per the NamedMixin rule).
#
# The Vanguard demo (combat-formations — everything shipped):
#   party form Wardens
#   party enlist the sellsword
#   party adopt vanguard
#   party assign front the sellsword
#   party assign back me
#   west              (the fog hollow — the duelist)
#   attack the gentleman --lethal
# The duelist's edge onto you (the back) is intercepted to the sellsword
# (the front) at the top of the next beat, narrated to the room; `fight`
# shows your formation + role; the interception mints her nothing (brain)
# but yours would mint `command`.
class: /lib/party/Mercenary
hydratorClass: /lib/persistence/PersistentHydrator
data:
  _speciesPath: /lib/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  primaryKeyword: sellsword
  alternateNames:
    - sellsword
    - mercenary
    - merc
    - woman
  shortDescription: a lean sellsword with a blade for hire
  longDescription: |
    A lean woman in travelled leathers who has the loose, economical stand of someone who has waited at a lot of crossroads for a lot of work. There is a blade within easy reach and her eyes go to the treeline and back on a slow, habitual circuit — not nervous, just counting exits. She'll take a side for a while, if you ask her into yours and there's a fight worth the walk.

    She fights beside the people she's thrown in with and against whoever they're against; the arithmetic is that simple, and she has never once been confused about which side she's on. Put her on the front and she takes the front and holds it — stepping into a line meant for someone softer is, as she'd tell you, exactly what the rate is for.
  behaviors:
    # Keep a blade in hand (take up the nearest wieldable).
    - brain: /lib/behavior/arms
      trigger: cadence:2s
    # Throw in with a party-mate who's started a fight.
    - brain: /lib/behavior/backs-up
      trigger: cadence:2s
    # Ambient between jobs.
    - brain: /lib/behavior/idles
      trigger: cadence:17s
      config:
        pool:
          - { kind: free, value: "rolls a shoulder and re-counts the exits." }
          - { kind: free, value: "tests the blade's edge against a thumb, unhurried." }
          - { kind: free, value: "watches the treeline the way you watch weather." }
