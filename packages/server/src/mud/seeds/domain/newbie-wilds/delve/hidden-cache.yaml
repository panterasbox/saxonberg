# The hidden cache — a concealed `Thing` (a stashed pouch), the demonstrator's
# hidden BONUS. Only `Thing`/`Creature`/`Exit` carry ConcealableMixin (Phase
# 1 did not compose it onto Container/Vessel), so the cache is realized as a
# concealed loose Thing rather than a concealed container — the plan's own
# "(concealed Container/Thing)" alternative. `hidden` (requirement 4): absent
# from a passing mover's world, turned up by a broad `search` of the corridor,
# then plainly present and takeable. Pure upside — the obvious reward waits in
# the vault regardless, so no critical content sits behind this perception wall.
class: /lib/stuff/Thing
hydratorClass: /lib/persistence/PersistentHydrator
data:
  shortDescription: a mortar-chinked stash pouch
  primaryKeyword: pouch
  longDescription: |
    A small oilcloth pouch tucked into a gap where a slab has slumped and chinked back over with crumbling mortar — the last delver's cache, missed by whatever came after. It has the weight of coin in it.
  concealment: hidden
  concealmentHint: a slab has slumped; the mortar chinking the gap behind it is newer than the rest
