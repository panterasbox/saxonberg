# The watchpost — the stealth/concealment demonstrator arena. A cut in the
# treeline where a wary sentry keeps the ground, and a dropped trap kit
# waits in the bracken. The whole player-facing half of concealment plays
# out here: `hide` (from the deep cover and shadow this clearing affords),
# then either sneak past the sentry (hide well — `hidden` beats its watch)
# or `attack` it from concealment (an ambush — surprise denies its poise);
# and `arm the trap kit` on this public ground to leave a snare for the
# next traveller (crime-marked if it springs on someone who didn't ask for
# it — the accountability substrate).
#
# Reached by ONE plain ground exit off the treeline (which is itself stood
# up by the char-gen spawn override and NO test — so this room + the sentry
# pull into no standup / fast-travel cascade; the GlassAlley failure,
# avoided by construction). It asserts no exit count, composes no
# FastTravelMixin, and appears in no TPA manifest. Content-only.
class: /lib/location/CartesianLocation
hydratorClass: /lib/persistence/PersistentHydrator
data:
  shortDescription: a watchpost in the treeline
  primaryKeyword: watchpost
  _address: last-counted-mile/watchpost
  longDescription: |
    A cut in the pines where the wood thins to a held breath: deadfall and bracken to the knees, a lightning-split trunk gone to shadow, and the needles deep enough to swallow a footstep. The light comes down broken here, more shade than sun — the kind of ground made for not being seen on.

    Someone stands watch at the far edge, where the road resumes into the trees, eyes working the clearing. There is cover everywhere — the split trunk, the bracken, the deadfall — for anyone minded to `hide` and go on unnoticed, or to wait. In the bracken by your feet, half-buried, a folded roll of oilcloth someone left behind.

    East, the way back to the treeline and the crossroads beyond.
  coords:
    x: 1
    y: 1
    z: 0
  details:
    trunk:
      keywords: [trunk, tree, deadfall, bracken, cover, shadow]
      description: |
        A pine split top to root by old lightning, the halves leaned apart into a black wedge of shadow; bracken and deadfall banked around the base. Cover enough to lose a person in, if the person holds still.
  exits:
    east:
      destination: /domain/newbie-wilds/crossroads/treeline
  # The sentry keeps the ground; the trap kit waits in the bracken. Both
  # cloned fresh at standup.
  populates:
    - /domain/newbie-wilds/npc/sentry
    - /obj/traps/trap-kit
