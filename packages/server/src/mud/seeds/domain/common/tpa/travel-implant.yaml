# The personal half of the credential — a cranial travel implant. Real,
# composed, tested content; NOT the v1 default loadout (the cranial slot is
# capacity-1 and holds the AetherImplant). Installs into a free cranial slot.
class: /domain/common/tpa/TravelImplant
hydratorClass: /lib/persistence/PersistentHydrator
data:
  shortDescription: a Teleport Authority travel implant
  primaryKeyword: implant
  targetSlot: cranial
  longDescription: |
    A coin-small node of brass and silicon, meant to seat against the skull. It carries your registered Teleport Authority stops the way a card would — but you never have to carry it.
