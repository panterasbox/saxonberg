# The general-store counter — the Stock fixture. One fixture that holds the
# shelf goods (a Container/Vessel), prices them (PricedOffer — Law 1, worth on
# the offer not the good), attends its customers (Attendant — instant/scrum,
# no wait for the newcomer path), and tops itself back to par on the game-time
# reset sweep (Resettable). It stocks itself to par on standup (postRegister →
# reset). The Business stands up lazily off `operatingLocations` (this path).
#
# Prices are the store's authored stance, calibrated to the shipped anchors
# (stipend 20 / wages 4-6 per game-hour / coinage 1/5/25): a relative ladder a
# fresh arrival on the 20-credit stipend can shop against. The goods are all
# discrete Things (never Globbable) so each carries a chattel stamp on buy.
class: /lib/retail/Stock
hydratorClass: /lib/persistence/PersistentHydrator
data:
  shortDescription: the general-store counter
  primaryKeyword: counter
  keywords: [counter, shelf, shelves, goods, stock]
  longDescription: |
    A long plank counter worn pale by decades of elbows, and behind it shelves stacked to the ceiling with the honest gear of getting by underground: torches and waterskins, ration packs and a tray of clasp knives, a row of tin lanterns catching the light. A chalk slate by the till lists the prices in a plain hand. Nothing here is fine; everything here works.
  discipline: scrum
  attendDurationMs: 0
  staffingPolicy: self-service
  serverPositionKeys: [clerk]
  businessPath: /domain/terminus/general-store/business
  stockLines:
    - { itemTemplatePath: /domain/terminus/general-store/goods/torch, par: 4 }
    - { itemTemplatePath: /domain/terminus/general-store/goods/rations, par: 5 }
    - { itemTemplatePath: /domain/terminus/general-store/goods/waterskin, par: 3 }
    - { itemTemplatePath: /domain/terminus/general-store/goods/clasp-knife, par: 2 }
    - { itemTemplatePath: /domain/terminus/general-store/goods/lantern, par: 2 }
    - { itemTemplatePath: /domain/terminus/general-store/goods/whetstone, par: 2 }
    - { itemTemplatePath: /domain/terminus/general-store/goods/iron-ingot, par: 3 }
    - { itemTemplatePath: /domain/terminus/general-store/goods/sewing-kit, par: 2 }
    - { itemTemplatePath: /domain/terminus/general-store/goods/sewing-machine, par: 1 }
    # The gardening line. These are ordinary `/obj/` templates, NOT
    # store-local `goods/` ones: `itemTemplatePath` takes any path, and
    # duplicating them here would mean two pots (and two seeds growing the
    # same plant) drifting apart. The existing goods live under `goods/`
    # because they are store-specific, not because the path is required.
    - { itemTemplatePath: /obj/pot/small, par: 3 }
    - { itemTemplatePath: /obj/pot/large, par: 2 }
    - { itemTemplatePath: /obj/vessel/soil-sack, par: 4 }
    - { itemTemplatePath: /obj/seed/snake-plant, par: 3 }
  prices:
    /domain/terminus/general-store/goods/torch: 2
    /domain/terminus/general-store/goods/rations: 3
    /domain/terminus/general-store/goods/waterskin: 4
    /domain/terminus/general-store/goods/clasp-knife: 6
    /domain/terminus/general-store/goods/lantern: 10
    /domain/terminus/general-store/goods/whetstone: 3
    /domain/terminus/general-store/goods/iron-ingot: 5
    /domain/terminus/general-store/goods/sewing-kit: 5
    /domain/terminus/general-store/goods/sewing-machine: 18
    # Against the shipped ladder (stipend 20; torch 2, rations 3, waterskin
    # 4, clasp-knife 6, lantern 10). The large pot is deliberately a real
    # but reachable purchase — it is the first thing a new player has a
    # REASON to buy, and the reason is legible before the purchase.
    /obj/pot/small: 3
    /obj/pot/large: 8
    /obj/vessel/soil-sack: 2
    /obj/seed/snake-plant: 5
