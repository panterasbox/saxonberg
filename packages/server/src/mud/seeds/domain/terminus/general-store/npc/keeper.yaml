# Odell Marrow — the general store's keeper (the Business proprietor). Not on
# the roster: she covers the till unpaid (the proprietor draws no wage), an old
# hand who's outfitted three generations of delvers and buried some of them.
# Dry, fair, unsentimental about money and quietly sentimental about the trade.
class: /lib/npc/NPC
hydratorClass: /lib/persistence/PersistentHydrator
data:
  name: Odell Marrow
  pronouns: she
  _speciesPath: /lib/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
  lifecycleState: alive
  primaryKeyword: keeper
  alternateNames: [odell, marrow, owner, proprietor]
  shortDescription: the store's grey-haired keeper
  longDescription: |
    A small, square woman with iron-grey hair scraped back hard and reading glasses on a cord, watching the floor from a stool by the strongbox. She has sold gear to three generations of delvers and has no illusions left about the trade or the odds; what she has instead is a straight price, an honest weight, and a way of looking at a green arrival's kit that tells them exactly what they've forgotten.
  dispositions:
    - { disposition: diligence, valence: 70 }
    - { disposition: temperance, valence: 55 }
  behaviors:
    - brain: /lib/behavior/introduces
      trigger: arrival
    - brain: /lib/behavior/idles
      trigger: cadence:27s
      config:
        pool:
          - { kind: free, value: "totals a column of figures without writing anything down, and nods to herself." }
          - { kind: say, value: "Buy the lantern if you can stretch to it. Cheapest thing in here, measured in the dark." }
          - { kind: free, value: "polishes her reading glasses on her apron and resettles them, missing nothing." }
          - { kind: say, value: "Bring back what you don't use. I'll shelf it and sell it on — better than it rotting in a pack." }
