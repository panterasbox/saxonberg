# Hinkley Hills' lot holder — the PROVISIONING half: how a sold lot
# becomes somewhere you can stand. An instance of the general
# `/obj/LotHolder`, named by the plat book beside it.
#
# One field, and it is the one that changes when the provisioning model
# does: today a shared room template cloned per lot and keyed on the
# lot's parcel extent, tomorrow (probably) a template minted per
# residence. That swap is a subclass and this line — the catalogue does
# not move.
class: /obj/LotHolder
hydratorClass: /obj/persistence/PersistentHydrator
data:
  # MUST be a persistable room (/lib/location/FurnishableRoom or a
  # subclass) and NOT a CartesianLocation: a per-lot room cannot be a
  # member of the district's shared grid.
  roomTemplate: /domain/terminus/hinkley-hills/yard
  # The street the lots front onto. A gate is hung here per sold lot,
  # directioned by the lot's leaf (`lot-1`), so `lot-1` walks you in.
  streetPath: /domain/terminus/hinkley-hills/lane
  # The subdivision's parcel extent — read at boot to re-hang a gate for
  # every lot that already sold, so an owner can get home after a restart.
  parentExtent: /domain/terminus/hinkley-hills
