# The Goodkin branch Business — a bank is a Business whose product is banking
# (the budget.yaml precedent). Its own operating account (bank-banks-with-
# itself: held at its own branch via ensureVenueAccount), staff on a roster (=
# the branch's hours), a P&L. No local proprietor — corpo-owned, the corpo is
# the parent above; Wenna and Halloran are both salaried employees (the roster
# settles their wages at each shift boundary from the branch account).
#
# operatingLocations points at the BankCounter fixture, so
# EmploymentApi.ensureOperatorAt(<counter>) stands this up lazily (fee income +
# wages share the one account keyed on this Business path) and the Attendant /
# banking layers resolve the branch here.
#
# The banking affiliation (corpoKey: goodkin) lives on the BankCounter fixture,
# NOT here — a Business has no corpoKey (the map convention).
class: /lib/employment/Business
hydratorClass: /lib/persistence/PersistentHydrator
data:
  proprietorPath: ""
  positions:
    - key: teller
      label: working the Goodkin counter
      wageRate: 5
      confers: []
    - key: officer
      label: hosting the Goodkin Circle
      wageRate: 6
      confers: []
  rosterSlots:
    - positionKey: teller
      assignee: /domain/terminus/counting-houses/npc/teller
      schedule:
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [8, 18] }
    - positionKey: officer
      assignee: /domain/terminus/counting-houses/npc/officer
      schedule:
        - { days: [0, 1, 2, 3, 4, 5, 6], hours: [8, 18] }
  # The bank banks at itself — a branch's own operating account at its
  # own counter is the legitimate self-custody (the custodian IS a bank).
  banksAt: /domain/terminus/counting-houses/bank-counter
  operatingLocations:
    - /domain/terminus/counting-houses/bank-counter
