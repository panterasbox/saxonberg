# The station noticeboard — the labor market's discovery surface in the
# Terminus terminal hall: posted work (reward held in escrow) waiting for
# whoever steps off a gate needing a living. Affords the `job` verb to the
# hall; the travel half (`fulfill`) rides the courier's own implant.
# Populated by the hall's `populates` list. Keyworded as a NOTICEBOARD —
# the hall's `board` detail is the split-flap departures board.
class: /obj/JobBoard
hydratorClass: /obj/persistence/PersistentHydrator
data:
  shortDescription: a public noticeboard
  primaryKeyword: noticeboard
  longDescription: >
    A public noticeboard in an Authority frame, bolted to the wall between
    two fossilised strata of advertisements. Work wanted, work offered —
    each slip stamped with an escrow seal, because in Terminus a promise
    is only a promise when the money is already locked. A stub of pencil
    hangs from a string, worn to the ferrule.
  keywords: [noticeboard, notice-board, notices, jobs, job-board]
