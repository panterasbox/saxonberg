class: /lib/equipment/Weapon
hydratorClass: /lib/persistence/PersistentHydrator
data:
  shortDescription: a leather whip
  primaryKeyword: whip
  longDescription: >
    A long plaited leather whip with a weighted fall. It keeps a foe at the
    very end of its reach and can lash a cutting welt across bare skin — but a
    whip cannot be brought back to guard its wielder, and a man who gets
    inside it turns all that length into so much dead cord. Its real work is
    done wrapped round a wrist or an ankle, not swung.
  _materialPath: /lib/material/organic/leather
  constructionForm: whip
  gradeBand: fine
  # The long-reach extreme — the authored length puts it at `long` reach (it
  # controls until closed, then whiffs). Light, guardless; its teeth are the
  # `entangle` control gambit, not the lash. One-handed.
  mass: 0.6
  length: 2.5
  slotClaims:
    "/lib/body-plans/biped": ["hand:right"]
