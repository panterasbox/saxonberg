# Peace lily — the thirsty, light-hungry species. Its profile and the snake
# plant's are deliberate opposites so "one engine, many plants" is visible
# side by side: this one wants watering about every real day and bright
# indirect light, and it is the one that dies if you go away for a week.
#
# Every number here is a placeholder for a running game. Under the 12x clock
# one real day is 12 game days, so the buffers are sized against the LOGIN,
# not the game-day: a 1 L root zone at 0.08 L/game-day stays fully satisfied
# for ~8 game days and runs dry at ~12 — a daily player tops it up right as
# it starts to dip. See docs/subsystems/husbandry.md.
class: /obj/Plant
hydratorClass: /lib/persistence/PersistentHydrator
data:
  shortDescription: a peace lily
  primaryKeyword: lily
  keywords: [lily, "peace lily", plant, houseplant]
  longDescription: |
    Broad dark leaves fan out of the soil on slender stalks, each one tapering to a point. A peace lily — the plant every hall porter hands out and nobody quite manages to kill on purpose.
  _speciesPath: /lib/species/plantae/tracheophyta/liliopsida/alismatales/araceae/spathiphyllum/wallisii
  material: /lib/material/tissue/plant-tissue
  lifecycleState: alive
  seedTemplatePath: /obj/seed/peace-lily
  # The root-zone moisture reserve — the water half of the growth model.
  # Litres, theme `cultivation` (NOT biological: Reserve is a neutral
  # capacity axis, and a plant is not a Creature).
  reserves:
    moisture:
      capacityValue: 1
      currentValue: 1
      unit: "L"
      theme: cultivation
      floorEffect: wilting
  profile:
    # Thirsty: satisfied while the root zone is a third full, wilting dry.
    moistureHappyAt: 0.35
    moistureWiltAt: 0.05
    litresPerGameDay: 0.08
    # Bright indirect light — a lit room suits it, a dim corner does not.
    luxHappyAt: 25
    luxDarkAt: 3
    # Generous roots: the shipped small pot (0.5 L) carries it to `young`
    # and then binds, which is the whole transplanting tutorial.
    rootDemand:
      seedling: 0.15
      young: 1.2
      established: 2.0
      mature: 3.0
    # Cumulative well-kept game-days per stage: ~2 real weeks to maturity.
    daysToStage:
      young: 30
      established: 90
      mature: 168
