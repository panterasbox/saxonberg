# Firebolt — create·fire, the flagship impulse: injects REAL heat. At a
# body it folds through the covering stack into a burn (armor inversion
# free); at an object it deposits real thermal joules and real combustion
# takes over (tryAutoignite → spread, smoke, char) — no magic-side damage
# path exists. See docs/subsystems/magic.md.
class: /obj/magic/Spell
hydratorClass: /obj/persistence/PersistentHydrator
data:
  spellId: firebolt
  name: Firebolt
  verb: create
  noun: fire
  cost: 20
  castingProfile:
    requiredBand: novice
    castSeconds: 3
  targeting: any
  effects:
    - kind: inject-channel
      channel: heat
      # [cursed · uncursed · blessed] — the MAGNITUDE case, which is the
      # one a multiplier did handle. It stays authored per working rather
      # than engine-fixed, because how much a guttering firebolt loses is
      # a fact about firebolt, not a global constant. A wand that barely
      # catches vs one that sears.
      energy: [1, 2, 4]
      joules: [300000, 900000, 1800000]
      resist: { axis: channel, intensity: 2 }
  description: >-
    A lance of true flame. What it touches, it heats — flesh burns, tinder
    catches, iron merely warms. The fire it starts is real fire.
