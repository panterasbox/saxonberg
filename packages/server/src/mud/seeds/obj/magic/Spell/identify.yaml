# Identify — perceive·arcana, the paid shortcut past experiment. A Sense
# effect whose result is a WRITE to the reader's belief store, not a
# message: it teaches the item's CLASS, so every flask that looks like
# that one reads as known from here on. Not oracular — you are buying
# the answer you would otherwise get by drinking the unknown flask and
# finding out. See requirements D24.
#
# ⚠ There is deliberately no `identify` VERB (D34). A scroll of identify
# affords `read`, like every written thing, and this is what happens
# when you read it. An `identify` affordance would announce what you
# were holding just by appearing in your list.
class: /obj/magic/Spell
hydratorClass: /obj/persistence/PersistentHydrator
data:
  spellId: identify
  name: Identify
  verb: perceive
  noun: arcana
  cost: 12
  castingProfile:
    requiredBand: competent
    castSeconds: 4
  targeting: object
  effects:
    - kind: sense
      sense: identify-item
  description: >-
    The shape of a made thing remembers its making. Held long enough
    against the question, it answers what it is.
