# Glowlight — create·light, the modifier proof: conjures a bound orb
# (LightSourceMixin Thing) held up by a SustainedEffect on the caster.
# Realized by pull; dormant inside a suppression field (winks out);
# released on dispel or expiry (orb destructs). Light, not heat — the
# sim decouples them, so this warms nothing.
class: /obj/magic/Spell
hydratorClass: /obj/persistence/PersistentHydrator
data:
  spellId: glowlight
  name: Glowlight
  verb: create
  noun: light
  requiredBand: novice
  cost: 10
  castSeconds: 2
  targeting: none
  durationSeconds: 3600
  effects:
    - kind: emit-field
      field: light
  description: >-
    A palm-sized mote of cold light that follows its maker. It casts no
    heat and burns nothing; it simply refuses the dark — while the
    magic holds.
