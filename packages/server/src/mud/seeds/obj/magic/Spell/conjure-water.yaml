# Conjure water — create·water: real litres of real water, transferred
# from an unbounded source into a reachable vessel (or pooling on the
# floor when no vessel is offered). Downstream physics is honest — it
# wets, it conducts, it douses.
class: /obj/magic/Spell
hydratorClass: /obj/persistence/PersistentHydrator
data:
  spellId: conjure-water
  name: Conjure Water
  verb: create
  noun: water
  requiredBand: novice
  cost: 15
  castSeconds: 3
  targeting: any
  effects:
    - kind: conjure
      bulkMaterial: water
  description: >-
    Clean water, called out of nowhere into whatever will hold it — or
    onto the floor, if nothing will.
