# Spark — create·lightning: imposes a real potential on a transient locus
# at the target and lets the REAL conduction graph resolve it (I=V/R,
# shared pools bridge, ground sinks). The caster obeys their own physics —
# stand in the same puddle and the walk finds you too.
class: /obj/magic/Spell
hydratorClass: /obj/persistence/PersistentHydrator
data:
  spellId: spark
  name: Spark
  verb: create
  noun: lightning
  requiredBand: competent
  cost: 25
  castSeconds: 3
  targeting: any
  effects:
    - kind: inject-channel
      channel: shock
      voltage: 240
  description: >-
    A snap of raw current leaps to the mark. It follows the honest paths —
    metal, water, flesh — and it does not know friend from foe.
