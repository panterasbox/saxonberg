# Vanguard — the front line eats the edges; the back line stays free.
# Any threat edge landing on a `back` member is intercepted to the first
# eligible `front` member at the top of the next beat (roles are sets:
# two fronts resolve in roster order; no front standing → the clause goes
# inert and allocation degrades to sustained). Egalitarian coup.
class: /obj/CombatFormation
hydratorClass: /obj/persistence/PersistentHydrator
data:
  name: vanguard
  roles: [front, back]
  allocation: sustain
  primaryRole: ""
  protectsRoles: [back]
  interceptorRoles: [front]
  interceptTrigger: any
  coupRight: engaged
  coupCall: engaged
