# A CURSED scroll of remove curse — the demonstration the whole BUC
# model rests on, and the case a potency multiplier cannot express.
#
# Identical to `scroll-of-remove-curse` but one band down. It carries the
# SAME working (`/obj/magic/Spell/remove-curse`), and that working
# authors its own low end:
#
#   steps: [-1, 1, 1]      limit: [cursed, uncursed, blessed]
#
# So reading this one does not lift a curse — it LAYS one. Not a weaker
# cure, not 60% of a cure: the opposite act, because that is the low end
# of remove-curse's own axis. No scalar produces that.
#
# ⚠ Which is exactly why you must identify a scroll before you read it,
# and why BUC and class are two independent facts you need BOTH of. A
# blessed scroll of this consecrates past ordinary; a cursed one is a
# trap wearing the same words.
#
# `regionTarget: 0` — deliberate clones only, like the cursed wand.
class: /obj/magic/Scroll
hydratorClass: /obj/persistence/PersistentHydrator
data:
  shortDescription: a scroll of remove curse
  primaryKeyword: scroll
  longDescription: >
    A short strip of vellum, the lettering pressed rather than inked and
    laid out in a spiral that reads inward. Read it upon a thing that
    will not let go.
  markText: >-
    a spiral of pressed characters reading inward, patient and
    unhurried
  markForm: embossed
  carriedSpellPath: /obj/magic/Spell/remove-curse
  usesRemaining: 1
  censusKey: scroll
  materialTags: [vellum]
  descriptorClass: scroll
  regionTarget: 0
  identifiedName: a scroll of remove curse
  selfIdentifying: true
  # ── the one field that differs ──
  blessingBand: cursed
