# Coffee urn — the demo's unbounded liquid source. `unboundedSource`
# makes its interior `available()` return ∞ so refills never run dry,
# demonstrating the source end of the holder dial (regenerating wells
# are deferred; ∞ is the simpler demonstration). Holds coffee.
class: /obj/Receptacle
hydratorClass: /lib/persistence/PersistentHydrator
data:
  shortDescription: a coffee urn
  longDescription: A tall steel coffee urn with a little spigot near its base.
  keywords: [urn, coffee]
  interiorBulk: true
  interiorMaterial: /lib/material/bulk/coffee
  unboundedSource: true
