# Colander — the demo's open-closure vessel. `closure: open` can't
# retain liquid (which requires `liquidTight`), so pouring water into it
# drains through to a puddle on the floor below. Demonstrates the
# closure scale and the drain-through cascade. Closure is a per-vessel
# construction property, not the wall material (a steel bucket and a
# steel sieve differ).
class: /obj/Receptacle
hydratorClass: /obj/persistence/PersistentHydrator
data:
  shortDescription: a tin colander
  longDescription: A battered tin colander, its bowl pierced by a hundred little holes.
  keywords: [colander, sieve, strainer]
  interiorBulk: true
  interiorCapacity: 0.5
  closure: open
