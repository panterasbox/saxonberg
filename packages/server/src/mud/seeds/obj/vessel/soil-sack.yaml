# A sack of potting soil — the only genuinely new good this build adds to
# the store. An ordinary bulk holder that ships FULL: you `pour` it into a
# pot, which needs no new verb at all.
#
# 3 L fills the large pot in one go, or a small pot six times over.
class: /obj/Receptacle
hydratorClass: /lib/persistence/PersistentHydrator
data:
  shortDescription: a sack of potting soil
  primaryKeyword: sack
  keywords: [sack, soil, "potting soil", bag, dirt, compost]
  longDescription: |
    A stout paper sack with the top folded over twice, heavy in the middle and shedding a little dark grit from one corner.
  interiorBulk: true
  interiorCapacity: 3
  interiorMaterial: /lib/material/bulk/potting-soil
  interiorAmount: 3
  # `liquidTight` (the default), NOT `open`: an `open` interior does not
  # RETAIN bulk — a transfer into it drains straight through to the floor.
  # A folded-over paper sack holds its soil.
