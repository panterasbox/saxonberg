# Forge — a bellows-fed smithing furnace. Charcoal-fuelled, its base held
# temperature (1300 K) is hot but shy of iron's 1811 K melting point; working
# the bellows scales it by 1.6 (→ 2080 K), so smelting heat is reachable ONLY
# with the bellows — the forge's reasoned mechanic. Lit with `ignite`.
class: /obj/Forge
hydratorClass: /obj/persistence/PersistentHydrator
data:
  shortDescription: a stone forge
  longDescription: >
    A squat stone forge with a deep charcoal bed and a great leather bellows
    at its side. Cold, it is just soot and iron fittings; lit and pumped, it
    roars white-hot.
  keywords: [forge, hearth, furnace, bellows]
  # Furnace config — charcoal base heat + a bellows multiplier to smelting heat.
  burnTemperatureK: 1300
  bellowsMultiplier: 1.6
  fuelBurnRatePerMin: 0.3
  lit: false
  reserves:
    fuel:
      capacityValue: 100
      currentValue: 100
      unit: "%"
      theme: combustion
      floorEffect: null
  emittedIntensity: 90
  emittedColorTemperature: 2200
