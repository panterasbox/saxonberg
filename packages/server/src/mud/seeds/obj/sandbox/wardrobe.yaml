# /obj/sandbox/wardrobe — the wardrobe SKIN of the sandbox door.
#
# The mechanism is `/lib/sandbox/SandboxCrossing`: a placeable, ownable
# fixture whose presence in a room installs the crossing passage
# (SandboxCrossingExit). This row is the wardrobe version of it, and a
# turbolift / mirror / drafting table are sibling ROWS — prose, keywords
# and `passageDirection` — never new classes.
#
# An unlinked, unowned door opens onto whoever walks through it — clone
# one, place it, step in (the authoring ladder, literally).
# See docs/subsystems/sandbox.md.
class: /obj/sandbox/SandboxCrossing
hydratorClass: /obj/persistence/PersistentHydrator
data:
  # The exit label this fixture installs. Skin-specific, hence data —
  # the class is the mechanism, and a turbolift template says
  # `turbolift` here without a line of new code.
  passageDirection: wardrobe
  name: wardrobe
  shortDescription: a tall standing wardrobe
  longDescription: >
    A tall wardrobe of dark lacquered wood, doors slightly ajar. The
    inside does not appear to have a back. Stepping in feels less like
    entering furniture and more like leaving the room.
