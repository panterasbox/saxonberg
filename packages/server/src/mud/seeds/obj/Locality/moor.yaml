# The Weeping Moor — a Locality carrying an authored **weather pin** (weather
# Wave 2). Claims the address prefix `moor`, and pins its whole subtree to an
# *alive* storm: the type is forced (`storm` — it is always under a storm
# here), but the model still animates the intensity by season & time-of-day.
# The higher-precedence hard pin outranks the procgen field and any climate
# lean; every consumer downstream (wetness / puddle / strike / light / analyze)
# reads the resolved storm exactly as it would a modelled one.
#
# The `narnia`-roster precedent: templatePath (`/obj/Locality/moor`) diverges
# from the claimed address (`moor`).
class: /obj/Locality
hydratorClass: /obj/persistence/PersistentHydrator
data:
  name: The Weeping Moor
  _address: moor
  _weatherPin:
    type: storm
    mode: alive
