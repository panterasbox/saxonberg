# Command — reading a fight and directing others through it: holding the
# line for a ward, creating the opening an ally cashes, calling the
# target, deciding the fate of the fallen. The formation build's
# teaching payoff: these deeds mint ONLY for policy work performed for
# someone else (an interception taken, an armed opening an ally
# exploited, a captain's call landing), so a master/captain advances the
# exact discipline you cannot grind solo — the game pays veterans to
# invest in newbies, in a currency earned no other way. No `conferrals`:
# formations are afforded by the party verb; competence grades the work,
# it doesn't gate the menu (the awareness precedent).
class: /obj/Discipline
hydratorClass: /obj/persistence/PersistentHydrator
data:
  key: command
  channel: skill
  label: Command
  iscedf: "0413"  # ISCED-F 2013 — Management and administration
  synergizes: [melee-combat]
  description: >-
    Leadership under pressure — reading the whole fray, not one blade:
    where the line must hold, which guard is about to crack, who takes
    the next redirect, and whether the fallen live. Earned only in
    company; nobody learns command alone.
