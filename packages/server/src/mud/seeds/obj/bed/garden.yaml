# A raised garden bed — the same class shape as a plant pot with a bigger
# number. Four planting places over 12 L of soil, so a full bed gives each
# plant 3 L (a large pot's worth) and a crowded one gives less: density is
# the player's dial, and the shipped satRoot curve does the arguing.
#
# There is no `portable: false` flag and there is no fixture base. You
# cannot pick this up because a bed of soil weighs ~340 kg and
# GetController's encumbrance gate says "it doesn't budge" — the shipped
# doctrine that can't-budge is emergent from mass, never a type flag
# (see lib/stuff/Vessel.ts). Empty it and a strong character could shift
# the frame, which is a consequence rather than a special case.
class: /obj/GardenBed
hydratorClass: /lib/persistence/PersistentHydrator
data:
  shortDescription: a raised garden bed
  primaryKeyword: bed
  keywords: [bed, "garden bed", "raised bed", plot, planter]
  longDescription: |
    A knee-high frame of weathered boards, filled level with dark soil and edged by a path worn into the grass. There is room along its length for several plants without crowding.
  material: /lib/material/wood/pine
  # ~340 kg filled: the frame plus 12 L of soil in a bed that is mostly
  # soil by volume. Well over any character's strain ceiling.
  mass: 340
  # This is GROUND, not a container of soil — so what may be grown in it
  # is the parcel's business, and a bed refuses ground whose land use
  # does not admit cultivation. A pot leaves this false: a houseplant on
  # a windowsill is not agriculture and no ordinance cares.
  fixedGround: true
  # Square metres of land this draws from the parcel it stands on. A
  # 2 m × 1 m frame plus the path you need around it to work it — call it
  # 8 m², so a quarter-acre lot (1000 m²) has room for a great many beds
  # and the number only starts to bite on a garden somebody is farming
  # rather than gardening.
  #
  # The draw rides the BED because that is both expressive (compose beds
  # of any size) and honest (backed by things a player can count).
  # Over-draw is PERMITTED and carries no penalty — crowding is
  # competition for light, water and nutrients, which the limiting-factor
  # minimum already models.
  landRequirementM2: 8
  interiorBulk: true
  interiorCapacity: 12
  # `liquidTight` (the default), NOT `open`: an `open` interior does not
  # RETAIN bulk — the transfer would drain the soil straight through to
  # the ground. Same reasoning as the pots.
  #
  # Two soil reserves, and they are different axes from the bulk soil
  # above: bulk is EARTH (the root ceiling), these are what the earth
  # currently HOLDS. 6 L of water is roughly a fortnight for a full bed
  # of four, so a smallholding needs tending on about that cadence.
  #
  # Unlike a pot, a bed declares `nitrogen` — which is the whole of what
  # makes the fourth limiting factor visible outdoors and invisible on a
  # windowsill. Harvesting exports it; `feed` puts it back.
  reserves:
    moisture:
      capacityValue: 6
      currentValue: 6
      unit: "L"
      theme: cultivation
      floorEffect: wilting
    nitrogen:
      capacityValue: 100
      currentValue: 100
      unit: "%"
      theme: cultivation
      floorEffect: spent
  staticSlots:
    - name: plant
      accepts: SlottableMixin
      # THE one number that makes this a bed rather than a pot.
      capacity: 4
      userFacingDetail: planting
  details:
    planting:
      keywords: [soil, planting, row, rows, earth]
      description: |
        Dark crumbly earth, raked level, with room enough along the rows for four plants to grow without fighting each other for it.
