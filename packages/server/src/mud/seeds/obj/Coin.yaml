# Coin — the one physical cash object, cloned per cash issuance / withdrawal.
# The default clone is the base 1-credit denomination; `issueCash` re-stamps
# the `denomination` per dispensed stack (1 / 5 / 25 → credit / crown /
# sovereign). A massed Globbable, so a large stack blows past carry capacity
# through the shipped encumbrance gauge (the honest cap on cash). Per-coin mass
# is DERIVED from the denomination (`Coinage.perCoinMass`, currency-intrinsic)
# — the `mass` below is the base-credit value for a bare clone; `Coin.getMass`
# reads the denomination, so higher denominations are correctly heavier.
class: /obj/Coin
hydratorClass: /obj/persistence/PersistentHydrator
data:
  shortDescription: a credit coin
  keywords: [coin, coins, credit, cash, money]
  denomination: credit
  mass: 0.002
  quantity: 1
