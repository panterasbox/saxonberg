# Curated relayed Twitch channels — seeded into the `twitch_channels`
# collection by `TwitchChannelSeeder.run()` at boot. Multiple entries =
# multiple channels relayed at once. The reader subscribes to a channel's
# chat only while >=1 in-game player is tuned in (presence-gated), using
# the single operator reader account (env `TWITCH_READER_USER_ID`).
#
# Operators: `broadcasterId` is the Twitch user id (stable); change these
# to the channel(s) you want to relay. The seeder is insert-only — edits
# to an already-seeded row do not re-seed.
#
# The default below is Twitch's own low-traffic `twitchdev` channel, handy
# for verifying the relay against real chat.

channels:
  - broadcasterId: "141981764"
    broadcasterLogin: "twitchdev"
    label: "TwitchDev"
