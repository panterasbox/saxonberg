# wiki-pages.yaml — the starter articles, installed by the backend
# WikiSeeder at boot.
#
# **Insert-only.** A page whose name already exists is left completely
# alone. That is load-bearing rather than convenient: a wiki is
# community-maintained, and a seeder that re-asserted its version every
# boot would silently revert every edit anybody made to a seeded page,
# on a schedule, with no record of having done it.
#
# ⭐ WHAT BELONGS HERE, and what does not.
#
# "Where the taxonomy IS the thing's identity — materials, biomes — we
# seed deliberately, because there the structure is not an editorial
# choice, it is the subject matter. Everything else grows organically
# and is reorganised later if it ever needs to be. **Over-organising an
# empty wiki is how wikis die.**"
#
# So this file is a FLOOR to build on, not a skeleton to fill in. It
# ships: the front door, one worked example of each thing the engine can
# do (a subject-bound article, a snippet, a guide), and nothing else.
# Resist adding a stub for every material. A redlink is a better empty
# page than an empty page — it says "somebody wanted this" and turns up
# in `wiki wanted`, whereas a stub says "this is done" and does not.
#
# ⚠ Bodies are **markdown** — the article dialect, exactly what a
# player types into `wiki edit`. Not MML. These pages are the first
# thing anybody reads AND the first thing anybody opens the source of,
# so a seed written in markup the guide page does not teach would be
# teaching two syntaxes on day one. MML tags the dialect has no
# markdown for (`<composition/>`, `<spoiler>`, snippet components) are
# written inline as tags, which is the intended mixed authoring.

pages:
  # ── The front door ──
  - page: main:saxonberg
    title: Saxonberg
    tags: [meta]
    related: [guide:how-to-write-here, lore:the-compact]
    body: |
      # Saxonberg {#saxonberg}

      This is the encyclopedia of the world — what things are, what
      they are made of, and what you can do with them.

      It is written by the people who play here, which includes you.
      Every page has an edit button and a full history; nothing you
      write is unrecoverable, and neither is anything you overwrite.

      ## Where to start {#where-to-start}

      - [[guide:how-to-write-here|How to write here]] — the markup, in
        about two minutes.
      - [[oak|Oak]] — a worked example of an article about a thing in
        the world.
      - Type `wiki wanted` to see what other readers have asked for and
        nobody has written yet. That is the to-do list, and it is
        written by its readers.

      ## What goes here {#what-goes-here}

      The nouns: materials, biomes, species, places, tools. Also lore,
      guides, and anything else worth writing down.

      What does NOT go here is what a verb does — that is `help`, and a
      page can transclude it rather than restating it. The distinction
      is worth keeping: help tells you what `plant` does; this tells
      you what soil IS, and therefore why planting in it works.

  # ── The guide that makes the rest possible ──
  - page: guide:how-to-write-here
    title: How to write here
    tags: [meta, guide]
    related: [main:saxonberg]
    body: |
      # How to write here {#how-to-write-here}

      `wiki create <name>` starts a page. `wiki edit <name>` changes
      one. That is the whole workflow.

      ## Linking {#linking}

      Write `[[Oak]]` to link to a page, or `[[Oak|oak wood]]` to give
      the link your own words.

      A link to a page nobody has written renders red. **That is not an
      error.** It is how a wiki grows: you noticed a gap, and the next
      reader can click straight into filling it. Red links are also
      ranked by demand in `wiki wanted`.

      ## Markup {#markup}

      `**bold**`, `*italic*`, `` `code` ``, `> quote`, `- lists`
      (indent to nest), and pipe tables. Headings are `#` to `###`.

      | you write | you get |
      | --- | --- |
      | `**oak**` | **oak** |
      | `[[Oak]]` | a link |
      | `{{stub}}` | a snippet |

      ## Citing a section {#citing}

      A heading can carry a permanent name: `## Uses {#uses}`. Once set
      it is **kept** even if you later reword the heading — so a course
      lesson citing `#uses` keeps working. Anchors are minted for you
      if you do not write one.

      ## Working together {#working-together}

      `--section <anchor>` edits one section and leaves the rest alone,
      so two people working on different parts of a long page never
      collide.

      `--rev <n>` says which version you started from. If somebody else
      edited meanwhile, your save is refused and you are shown both
      versions rather than one quietly replacing the other.

      `wiki preview` shows exactly what saving will produce.

      ## Reusable pieces {#snippets}

      A page in the `snippet` namespace can be dropped into any article
      with `{{name|arg}}`. See [[snippet:stub|the stub snippet]] for a
      worked one. Snippets are ordinary pages — same editing, same
      history, same rollback.

  # ── The worked example: a subject-bound article ──
  #
  # ⚠ The subject ref must be a REAL template path — this page is the
  # flagship demonstration of the live architecture panel, so a page
  # whose panel is an error message demonstrates the opposite. It
  # shipped once pointing at `/obj/material/oak`, which does not exist
  # (the material is `/obj/material/wood/oak`), and the comment here
  # rationalised the miss as "exercising the honest path" — which is
  # how a typo survives review. `wiki dangling` reported it correctly
  # the whole time; nobody ran it. `wiki-seed-subjects.test.ts` now
  # checks every seeded subject against the real template tree.
  - page: main:oak
    title: Oak
    subject: { kind: template, ref: /obj/material/wood/oak }
    tags: [material, wood]
    body: |
      # Oak {#oak}

      A dense hardwood. Slow to grow, hard to work, and worth both.

      ## What it is made of {#architecture}

      The panel below is not written down anywhere — it is read out of
      the running world every time somebody opens this page, so it
      cannot drift from the truth.

      <composition kind="template" of="/obj/material/wood/oak"/>

      ## Uses {#uses}

      Furniture, tool handles, and anything that has to take a beating.
      Its density is what makes it good for all three and tiring for
      all three.

      ## Working it {#working}

      Hard on tools and slow under them. Budget more time than the
      volume suggests.

  # ── The worked example: a snippet ──
  - page: snippet:stub
    title: Stub
    tags: [meta, snippet]
    body: |
      *This article is a stub — {{{why|it needs more detail}}}. You can
      help by expanding it.*

  # ── A second snippet, showing parameters properly ──
  - page: snippet:infobox
    title: Infobox
    tags: [meta, snippet]
    body: |
      <infobox title="{{{title|Untitled}}}" class="{{{class|unknown}}}"/>

  # ── Lore: a page with no subject, by nature ──
  - page: lore:the-compact
    title: The Compact
    tags: [lore, politics]
    related: [main:saxonberg]
    body: |
      # The Compact {#the-compact}

      The agreement that governs this world, and the reason anything
      here is anybody's to decide.

      This page has no subject binding, and could not have one: there
      is no template for an agreement. That is the ordinary case — most
      pages document ideas, not objects, and the architecture panel is
      an option rather than a requirement.

      ## Reading further {#reading-further}

      - [[lore:the-ordinance|The Ordinance]] — the founding document.

  # ── The maintenance page, which is also a demonstration ──
  - page: guide:keeping-the-wiki
    title: Keeping the wiki
    tags: [meta, guide]
    body: |
      # Keeping the wiki {#keeping-the-wiki}

      Four reports keep a wiki from rotting. None of them needs
      permission to run.

      - `wiki wanted` — what readers have asked for and nobody has
        written, ranked by how many pages want it. Start here.
      - `wiki orphans` — pages nothing links to. Usually a sign
        something should mention them.
      - `wiki links <page>` — what links here.
      - `wiki dangling` — articles whose subject was renamed or deleted
        out from under them.

      ## Vandalism {#vandalism}

      `wiki history` then `wiki rollback`. It takes about four seconds,
      which is the whole reason editing can be open in the first place:
      there is no review queue because undoing is cheaper than
      reviewing.
