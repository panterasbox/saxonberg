# Char-gen rosters — the closed-choice content the `embody` flow
# presents. Loaded (cached) by EmbodyController. CONTENT, not code:
# add a species or change the outfit by editing this file, no code
# change.
#
# `species[].path` must point at a real Species template — these live in
# the `@saxonberg/content-species-and-names` content pack
# (`content/stuff/idea/species/**`).
#
# `species[].image` (OPTIONAL) — a resolvable
# illustration URL surfaced in the char-gen detail card (3:4 portrait).
# Omitted until image assets exist; the client renders a framed
# placeholder in the meantime. The asset subsystem owns how these URLs
# are produced; char-gen only consumes the field.

# ⭐ `startingOutfit` — what EVERY new character (and every guest) wears:
# garment template paths cloned + worn at commit (a missing one is
# skipped). One plain outfit for everybody; who you were before you came
# is the lineage slate's, not char-gen's. ⭐ It has pockets (the trousers'
# two) — the phone in `startingKit` goes into one.
startingOutfit:
  - /stuff/thing/clothes/student-shirt
  - /stuff/thing/clothes/student-trousers
  - /stuff/thing/clothes/canvas-shoes

# ⭐ `startingKit` — what EVERY new character is handed after dressing
# (aether-devices D11): today a Hollis Pal phone, its title BOUND to the
# new person (worthless to anyone else, unsellable), put away in a pocket.
# The same for everyone until lineage chooses the brand.
startingKit:
  - { item: /stuff/thing/gear/hollis-pal, bound: true, into: pocket }

species:
  - key: human
    path: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/sapiens
    label: Human
    description: Adaptable and ambitious; the striving majority of the campus.
  - key: elf
    path: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/eldarinus
    label: Elf
    description: Keen-eyed and long-lived, with a measured, watchful grace.
  - key: dwarf
    path: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/khazadicus
    label: Dwarf
    description: Stone-sturdy and stout, at home in the dark and the deep.
  - key: halfling
    path: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/periannath
    label: Halfling
    description: Small, quick, and comfortable; fond of a good meal and a warm hole.
  - key: half-orc
    path: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/semiorcus
    label: Half-orc
    description: Broad and powerful, with a keen nose and a quiet steadiness.
  - key: tiefling
    path: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/infernalis
    label: Tiefling
    description: Horned and ember-eyed, carrying an old, infernal heat.
  - key: dragonborn
    path: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/draconicus
    label: Dragonborn
    description: Scaled and proud, with the bearing of an elder wyrm.
  - key: gnome
    path: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/gnomus
    label: Gnome
    description: Small, wiry, and tirelessly curious; a tinker-folk of the deep places.
  - key: half-elf
    path: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/semieldarinus
    label: Half-elf
    description: Between two worlds; elven poise and human drive, at home in neither fully.
  - key: orc
    path: /stuff/idea/species/animalia/chordata/mammalia/primates/hominidae/homo/orcus
    label: Orc
    description: Broad and fierce, keen-nosed and short-lived; intense from first breath to last.

# Pronouns are NOT listed here — the closed-choice pronoun options
# derive from the `Pronouns` enum in @saxonberg/types (single source of
# truth), with display labels in EmbodyController. Pronouns are free and
# independent of sex; free-text is deferred (grammar-engine cost).
