# Authored managed-group memberships — the owner-conferred "who is staff"
# ledger. Seeded idempotently by `GroupSeeder` at boot (the ChannelSeeder /
# ParcelSeeder precedent; config-not-seeds because a `Group` is a Document, not
# a Stuff template, so it doesn't belong in the `domain` collection).
#
# The governing rule: group membership is CONFERRED HERE by the content owner,
# never self-claimed by the member. An NPC that is an agent of a parcel owner
# is authorized because the OWNER put it in the owning group as authored data —
# not because the NPC enrolled itself in its own class code (self-issued
# authority is no authority; see residence.md § provisioning authorization).
#
# `id` is the member reference the membership check keys on: a player's
# `playerId`, or an NPC's `templatePath` (an NPC has no playerId — the same key
# `isDormsAgent` resolves).
groups:
  - name: duncan-hall
    # The dorms-owning landlord group. It owns
    # /domain/eternal/duncan-hall/dorms in parcels.yaml; its members are the
    # landlord's staff. Owner `system` — matches ParcelRegistry's mint-or-find
    # (so this seed and the lazy owner-ref resolution converge on one group).
    owner: system
    members:
      # Katie, the live-in super — an agent of the landlord, so her intake
      # dialogue's `dispatch provision $player` clears the execute-level
      # dorms-agent gate in ProvisionController. She no longer enrolls herself.
      - id: /domain/eternal/duncan-hall/npc/katie
        role: member

  - name: hinkley-hills
    # The Improvement District — the suburb's own body, holding
    # /domain/terminus/hinkley-hills in parcels.yaml until lots are sold
    # out of it. Deliberately EMPTY of members: the District has no staff
    # and no agents, and a group with nobody in it is the honest shape for
    # a government that exists only on paper. Owner `system`, matching
    # ParcelRegistry's mint-or-find so this seed and the lazy owner-ref
    # resolution converge on one group.
    owner: system
    members: []

  - name: wiki-editors
    # The wiki's ONE managed group. It owns /wiki in parcels.yaml, so
    # the protection ladder's `editors` rung is membership here and the
    # `moderators` rung is the 'owner' role here.
    #
    # ⭐ One group, not two. A separate `wiki-moderators` would need a
    # controller to call `GroupApi.isMember` directly — which the
    # antipatterns table forbids — and the substrate ALREADY
    # distinguishes 'owner' from 'member', so a second group would be
    # inventing a distinction that exists. Confer moderator status with
    # `group` by setting a member's role to owner.
    #
    # Deliberately EMPTY: an open wiki needs no editors to start, and
    # the `anyone` floor at /wiki means the encyclopedia is writable on
    # a fresh world by anyone who logs in. The group exists so the two
    # rungs ABOVE that floor have somewhere to resolve against. Owner
    # `system`, matching ParcelRegistry's mint-or-find so this seed and
    # the lazy owner-ref resolution converge on one group.
    owner: system
    members: []
