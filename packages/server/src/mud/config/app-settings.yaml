# Application-wide settings — seeded into the `app_settings` collection by
# AppSettingsSeeder.run() at boot. This YAML is the single source of the
# settings' initial values (there are no code-side defaults).
#
# Insert / merge-missing / idempotent — operator changes via the `config`
# verb survive subsequent boots (existing keys are left alone); adding a key
# here seeds it on the next boot without clobbering existing values.
settings:
  # Where a brand-new avatar's startLocation is stamped at mint time.
  - key: defaultStartLocation
    value: /domain/lounge/warren
  # Where an orphaned HasInteractive evacuates when its container destructs
  # with no outer (Container.cleanupOnDestruct). The void is the designed,
  # destruct-refusing fallback.
  - key: evacuationFallback
    value: /domain/void
  # Reactions — act-scoped-emote aggregation. See
  # docs/subsystems/reactions.md. At/above `threshold` reactions on one
  # act, the per-emote fan-out line is suppressed in favour of the
  # batched counter. `cadenceMs` is the fixed-cadence flush window
  # (clamped to [150, 250] in the registry). `sampleCap` bounds the
  # per-recipient familiar-biased attributed sample.
  - key: reactions.threshold
    value: "10"
  - key: reactions.cadenceMs
    value: "200"
  - key: reactions.sampleCap
    value: "5"
  # Forums — anti-snowball display gate. The displayed vote score is
  # suppressed (the client shows a placeholder) until an entry reaches
  # `minVotes` votes OR ages `minMinutes` minutes. Server-side ranking
  # always uses true scores; this gates only the rendered number.
  - key: forums.antiSnowball.minVotes
    value: "5"
  - key: forums.antiSnowball.minMinutes
    value: "30"
  # Renown — the *scalar* value-function parameters (GOVERNANCE-OWNED
  # ordinary law, NOT deployment config). The engine ships the scoring
  # algorithm; these numbers are the polity's declared values, re-scored
  # over history on each recompute. The entrenched invariants
  # (notoriety→zero governance weight, the engagement×renown form,
  # renown×no-participation=nothing) are CODE, never keys. Per-emote
  # VALENCE is NOT here — it lives on the emote (Emote.valence /
  # emotes.yaml). See docs/requirements/renown-requirements.md.
  # esteem fast/fragile (7d), notoriety slow/sticky (30d), in game-seconds.
  - key: renown.decayHalfLives
    value: '{"esteem":604800,"notoriety":2592000}'
  - key: renown.contextMultipliers
    value: '{}'
  - key: renown.qualityWeight
    value: "1"
  # Being heard: a small per-listener engagement reward for the speaker,
  # well below a reaction (1). Contribution log-saturates over the count,
  # and a listener only counts once per receptionWindowS (5 min) — reward
  # reaching new people, not spamming the same ones.
  - key: renown.receptionValence
    value: "0.1"
  - key: renown.receptionWindowS
    value: "300"

  # Participation — the consumer-influence QUANTITY axis. A member is
  # credited once per active bucket (10 min real time) in which they take a
  # recognized action; the decayed bucket count is the quantity half of
  # `engagement × renown`. Decay is REAL-time (participation = a human
  # showing up): half-life 14 days, so standing reflects who is present now.
  - key: participation.bucketSeconds
    value: "600"
  - key: participation.decayHalfLife
    value: "1209600"

  # Producer — the MAKE faucet (the third influence stock). An author is
  # credited once per (author, actor, 10-min bucket) of attributed
  # engagement with their released content; the decayed bucket count is the
  # standing. Engagement-only (no `× regard`); decay is REAL-time (current
  # draw): half-life 14 days, matching participation.
  - key: producer.bucketSeconds
    value: "600"
  - key: producer.decayHalfLife
    value: "1209600"

  # Influence band cutoffs (display-only; the scalar maps to the highest
  # tier whose `min` it meets). Stock-agnostic — same bands for every stock.
  - key: influence.bandThresholds
    value: '[{"name":"dormant","min":0},{"name":"nascent","min":1},{"name":"familiar","min":5},{"name":"established","min":20},{"name":"pillar","min":100}]'

  # Conviction — the spend half. A held position's weight ramps linearly to
  # full over one build period of unbroken hold (a flip resets it). 7 days
  # real-time, so conviction rewards sustained commitment over a snap vote.
  - key: conviction.buildPeriodSeconds
    value: "604800"

  # Traits — the disposition estimator dials (the personality layer). A
  # trait-position is the game-time-decayed signed sum of an axis's
  # valenced acts (clamped -100..+100); its evidence mass drives the
  # form→define→entrench band. Decay is GAME-time (character forms over a
  # lifetime): half-life 180 game-days. `defined`/`entrenched` are mass
  # cutoffs; `pronouncedThreshold` is the |position| an axis must reach to
  # count as a defining trait; `compatibilityScale` divides the raw
  # position dot-product into the regard range. See docs/subsystems/trait.md.
  - key: traits.decayHalfLifeDays
    value: "180"
  - key: traits.definedThreshold
    value: "20"
  - key: traits.entrenchedThreshold
    value: "60"
  - key: traits.pronouncedThreshold
    value: "25"
  - key: traits.compatibilityScale
    value: "100"
  # Operator policy knobs lifted out of scattered module constants (the
  # pre-app-settings sweep). Each was a hardcoded literal in its owning
  # module; the consumer now reads it here, falling back to this same value
  # if read before the cache is warmed.
  #
  # Chat — how many recent frames each channel keeps in its in-memory
  # history ring (the storage/bandwidth-vs-scrollback tradeoff).
  - key: chat.historyCap
    value: "200"
  # Char-gen — the inclusive min/max length (characters) of a chosen
  # character name token (the name-policy bounds).
  - key: chargen.nameMinLength
    value: "2"
  - key: chargen.nameMaxLength
    value: "24"
  # Status — the max rendered length (characters) of a Character's status
  # one-liner (a one-liner, not a paragraph).
  - key: status.maxLength
    value: "100"
  # Behavior — the global ambient-chatter pacing dial + anti-spam floor.
  # scale multiplies every ambient cadence brain's authored interval
  # (1.0 = as written; crank it up during playtest to quiet the whole
  # world at once); floor is the hard minimum (60s) no unprompted ambient
  # beat may fire faster than. Functional pollers (shifts/covers) are
  # exempt. See docs/subsystems/behavior.md § Ambient pacing budget.
  - key: behavior.ambientCadenceScale
    value: "1"
  - key: behavior.ambientCadenceFloorMs
    value: "60000"
  # Scripting — resource governance. The slice yields the single-threaded
  # event loop every N interpreter steps so a no-suspension tight loop
  # cannot freeze other players; the ceilings stop a runaway run (steps =
  # tight loops, dispatch = each-fan-out, depth = recursion). Tiered by
  # authorship: player-home/inline scripts get the tight budget, released
  # /obj/ + /domain/ content the large one. See
  # docs/subsystems/scripting.md § Resource governance.
  - key: script.sliceSteps
    value: "1000"
  - key: script.maxSteps.player
    value: "10000"
  - key: script.maxSteps.platform
    value: "1000000"
  - key: script.maxDispatch.player
    value: "500"
  - key: script.maxDispatch.platform
    value: "50000"
  - key: script.maxDepth.player
    value: "64"
  - key: script.maxDepth.platform
    value: "256"
  # Banking — the DEMO sales-tax rate (a fraction of a purchase remitted to
  # the placeholder treasury via the remittance-split seam). Authored and
  # INERT: recorded + instrumented, not governed. Live taxation is the
  # cooperative build. The treasury account is a placeholder that only
  # accumulates (no appropriation path).
  - key: banking.salesTaxRate
    value: "0.08"
  - key: banking.treasuryAccount
    value: treasury
  # Banking — the DEMO onboarding coin (minor units) a committed non-guest
  # char-gen player is granted via issueCash (the CB cash faucet) at commit.
  # Drink-sized (~a drink + change, or the newbie-wilds fare); anti-farm;
  # guests get nothing; 0 disables the grant.
  - key: banking.onboardingStipend
    value: "20"
  # Fast-travel — the TPA network fee (a flat base + a percentage) levied on
  # every PAID ride into the TPA operating budget (both budgets recirculate;
  # the sink lever is a deferred CB drain, not accumulation). The base
  # guarantees a non-zero fee on any paid ride: min(fee, base + floor(fee ×
  # rate)). Read try/catch → 0-fallback like banking.salesTaxRate.
  - key: fasttravel.networkFeeRate
    value: "0.15"
  - key: fasttravel.networkFeeBase
    value: "1"
  # Fast-travel — the TPA operating-budget account id (the network fee
  # accrues here), named like banking.treasuryAccount.
  - key: fasttravel.tpaAccount
    value: tpa
  # YouTube relay (read-only) dials — operator knobs for the second chat
  # transport. pollIntervalMs: the `list`-poll read cadence + overlay
  # live-status poll floor (the API's pollingIntervalMillis wins when
  # larger). See docs/subsystems/streaming.md.
  - key: youtube.pollIntervalMs
    value: "5000"
  # Overlay-owner live-status re-resolve — 15 min (a search.list costs ~100
  # quota units, so keep it slow; it only catches the owner's stream restart).
  - key: youtube.overlayPollIntervalMs
    value: "900000"

  # Social-graph (attention management) — the reserved-baseline notify
  # rules' default fields (deployment defaults, NOT code constants). A
  # reserved label (foes / friends / everyone-else / strangers) resolves to
  # these defaults until the player edits it. `friends` boosts + shows
  # presence + warm color; `foes` de-emphasizes + suppresses notifications +
  # muted/red; `everyone-else` is the named, silent recognized fallback;
  # `strangers` render as feature-strings, silent. Presence surfaces are
  # `show` | `silent` (a presence frame renders inline in the buffer; the
  # old `banner`/`log-only` split retired with the toast). See
  # docs/subsystems/social-graph.md.
  - key: social.baselineRules
    value: '{"foes":{"nameRendering":"feature-string","boostInDense":false,"onConnect":"silent","onDisconnect":"silent","onMessage":"silent","color":"rose"},"friends":{"nameRendering":"name","boostInDense":true,"onConnect":"show","onDisconnect":"show","onMessage":"full","color":"amber"},"everyone-else":{"nameRendering":"name","boostInDense":false,"onConnect":"silent","onDisconnect":"silent","onMessage":"silent","color":"neutral"},"strangers":{"nameRendering":"feature-string","boostInDense":false,"onConnect":"silent","onDisconnect":"silent","onMessage":"silent","color":"slate"}}'
  # The neutral palette token a fresh custom rule inherits until `color=` is set.
  - key: social.defaultColor
    value: neutral
  # Social inspection: seconds of input inactivity after which a connected
  # session is derived as idle (vs active) in `who`/`profile`. Idle is
  # computed on read, never stored. Default 5 minutes.
  - key: social.idleAfter
    value: "300"

  # Bulletin (news ticker) — the server-owned ticker semantics. The engine
  # ships the pins-first/recency window + soft-retract/expiry filtering;
  # these are the operator-tunable limits. tickerWindow caps the live
  # window; maxPins caps the pin block held at the top; the length knobs
  # bound an authored headline/body (validated at the `bulletin` verb).
  - key: bulletin.tickerWindow
    value: "30"
  - key: bulletin.maxPins
    value: "3"
  - key: bulletin.headlineMaxLength
    value: "120"
  - key: bulletin.bodyMaxLength
    value: "4000"

  # Residency — scheduled object self-maintenance. The eviction sweep
  # (`residency.eviction.*`) is the real-time cold-tail garbage-culler;
  # it ships in observe mode (logs what it WOULD cull, destructs nothing)
  # so the go-live memory profile can be measured before enforcement —
  # flip mode to `enforce` (re-read each sweep, no restart) to cull for
  # real. The deferred game-time reset sweep will add `residency.reset.*`.
  # See docs/subsystems/residency.md.
  - key: residency.eviction.mode
    value: observe
  - key: residency.eviction.intervalMs
    value: "60000"
  - key: residency.eviction.idleThresholdMs
    value: "1800000"

  # Materials-response — the response function's magnitudes (the "shape"
  # lives in code on `Construction`; these are the coefficients each
  # qualitative token resolves to). Tuned against a running game; no code
  # invariant. See docs/subsystems/materials-response.md.
  # Per-token base attenuation fraction (0..1): deflect turns almost
  # everything, transmit passes almost everything, fail is a defeated
  # construction.
  - key: response.attenuation.deflect
    value: "0.98"
  - key: response.attenuation.resist
    value: "0.7"
  - key: response.attenuation.absorb
    value: "0.75"
  - key: response.attenuation.moderate
    value: "0.5"
  - key: response.attenuation.poor
    value: "0.2"
  - key: response.attenuation.transmit
    value: "0.1"
  - key: response.attenuation.fail
    value: "0"
  # Reference material magnitudes (steel) the height ratio scales against.
  - key: response.material.hardnessRef
    value: "600"
  - key: response.material.toughnessRef
    value: "200"
  - key: response.material.scaleMax
    value: "1.5"
  - key: response.material.heightFloor
    value: "0.6"
  # Grade / condition height-scale bounds (poor..masterful → min..max;
  # condition floors at conditionMin so a wrecked item still does something).
  - key: response.grade.min
    value: "0.85"
  - key: response.grade.max
    value: "1.15"
  - key: response.condition.min
    value: "0.5"
  # Tissue tail.
  - key: response.blunt.fractureThreshold
    value: "1.5"
  - key: response.noWoundThreshold
    value: "0.25"
  - key: response.severityPerResidual
    value: "1"
  # Legibility preview + weapon delivery + outcome bands.
  - key: response.preview.referenceEnergy
    value: "2"
  - key: response.delivery.secondaryFactor
    value: "0.6"
  - key: response.band.grazeMax
    value: "0.5"
  - key: response.band.biteMax
    value: "1.5"
  # Electricity (the shock channel + conduction) — see
  # docs/subsystems/electricity.md. Real-world-grounded magnitudes: the
  # multimeter should read what coursework predicts. SHAPE (I=V/R, the
  # current-division walk) is code; these are the magnitudes.
  - key: electricity.body.dryResistanceOhms
    value: "100000"
  - key: electricity.body.wetFactor
    value: "100"
  - key: electricity.body.geometryFactor
    value: "20000"
  - key: electricity.contact.geometryFactor
    value: "0.01"
  - key: electricity.contact.maxOhms
    value: "1000000000000"
  - key: electricity.resistanceFloorOhms
    value: "1"
  - key: electricity.letGoAmps
    value: "0.01"
  - key: electricity.tetanicAmps
    value: "0.02"
  - key: electricity.fibrillationAmps
    value: "0.1"
  - key: electricity.burnThresholdAmps
    value: "0.02"
  - key: electricity.burnSeverityPerAmp
    value: "10"
  - key: electricity.pool.minConductivity
    value: "0.005"
  - key: electricity.insulator.maxConductivity
    value: "0.001"
  - key: electricity.armor.conductiveSkinFactor
    value: "0.15"
  - key: electricity.sustain.burnSeverityPerAmpSec
    value: "2"
  - key: electricity.heartRate.arrestDrivePerSec
    value: "40"
  # Combat (core 1v1) — see docs/subsystems/combat.md. All tuning; no
  # code defaults. Poise/tempo/energy are the load-bearing curves.
  - key: combat.tickSeconds
    value: "3"
  - key: combat.poise.pressedBelow
    value: "0.75"
  - key: combat.poise.reelingBelow
    value: "0.5"
  - key: combat.poise.brokenAt
    value: "0.25"
  - key: combat.poise.openingTicks
    value: "2"
  - key: combat.poise.erodePerExchange
    value: "0.12"
  - key: combat.poise.overextendCost
    value: "0.2"
  - key: combat.poise.restorePerDefense
    value: "0.15"
  - key: combat.poise.whiffPenalty
    value: "0.25"
  - key: combat.tempo.base
    value: "1"
  - key: combat.tempo.encumbrancePenalty
    value: "0.5"
  - key: combat.tempo.enduranceFloor
    value: "0.4"
  - key: combat.tempo.minRate
    value: "0.1"
  - key: combat.tempo.maxRate
    value: "3"
  - key: combat.energy.steady
    value: "1.2"
  - key: combat.energy.pressed
    value: "1.6"
  - key: combat.energy.reeling
    value: "2.2"
  - key: combat.energy.broken
    value: "3"
  - key: combat.energy.open
    value: "4.5"
  - key: combat.maxBeats
    value: "200"
  # Build 2 — consequence & progression.
  # The coup de grâce window (game-time seconds): a downed sentient is
  # finished by a slow, telegraphed, interruptible killing stroke, not the
  # winning blow. Long enough that a present party can stay the hand.
  - key: combat.coupSeconds
    value: "6"
  # Regard deltas a witnessed resolution writes. A clean, consented duel
  # win earns the victor a little regard from onlookers; an unlawful kill
  # (a non-consenting sentient put to death) makes witnesses recoil.
  - key: combat.regard.duelWin
    value: "2"
  - key: combat.regard.unlawfulKill
    value: "-20"
  # Cycle 2 — multi-party.
  # Focus-fire: each attacker beyond the first pressing a target erodes
  # that target's poise this much faster (2 attackers → 1.5x erosion), and
  # at/above `suppressRecoveryAt` incoming attackers a defender can't spend
  # a beat recovering — the pin that breaks the lone turtle who beats one
  # but loses to two.
  - key: combat.focusFire.erosionPerEdge
    value: "0.5"
  - key: combat.focusFire.suppressRecoveryAt
    value: "2"
  # A foe you disengage past gets one parting shot at this inflict energy.
  - key: combat.flee.partingShotEnergy
    value: "1.6"
