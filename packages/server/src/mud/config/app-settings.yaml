# Application-wide settings — seeded into the `app_settings` collection by
# AppSettingsSeeder.run() at boot. This YAML is the single source of the
# settings' initial values (there are no code-side defaults).
#
# Insert / merge-missing / idempotent — operator changes via the `config`
# verb survive subsequent boots (existing keys are left alone); adding a key
# here seeds it on the next boot without clobbering existing values.
settings:
  # Where a brand-new avatar's startLocation is stamped at mint time.
  - key: defaultStartLocation
    value: /domain/lounge/warren
  # Where an orphaned HasInteractive evacuates when its container destructs
  # with no outer (Container.cleanupOnDestruct). The void is the designed,
  # destruct-refusing fallback.
  - key: evacuationFallback
    value: /domain/void
  # Reactions — act-scoped-emote aggregation. See
  # docs/subsystems/reactions.md. At/above `threshold` reactions on one
  # act, the per-emote fan-out line is suppressed in favour of the
  # batched counter. `cadenceMs` is the fixed-cadence flush window
  # (clamped to [150, 250] in the registry). `sampleCap` bounds the
  # per-recipient familiar-biased attributed sample.
  - key: reactions.threshold
    value: "10"
  - key: reactions.cadenceMs
    value: "200"
  - key: reactions.sampleCap
    value: "5"
  # Renown — the value-function parameters (GOVERNANCE-OWNED ordinary law,
  # NOT deployment config). The engine ships the scoring algorithm; these
  # numbers are the polity's declared values, re-scored over history on each
  # recompute. The entrenched invariants (notoriety→zero governance weight,
  # the engagement×renown form, renown×no-participation=nothing) are CODE,
  # never keys. See docs/requirements/renown-requirements.md.
  - key: renown.valenceMap
    value: '{"cheer":1,"applaud":1,"laugh":1,"agree":1,"boo":-1,"jeer":-1,"disagree":-1}'
  # esteem fast/fragile (7d), notoriety slow/sticky (30d), in game-seconds.
  - key: renown.decayHalfLives
    value: '{"esteem":604800,"notoriety":2592000}'
  - key: renown.contextMultipliers
    value: '{}'
  - key: renown.qualityWeight
    value: "1"
