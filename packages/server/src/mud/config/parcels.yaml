# parcels.yaml — the platform's infrastructure title rows, installed into
# the gated `parcels` collection by the backend ParcelSeeder.
#
# THE GOVERNING SECURITY INVARIANT: ownership is declared HERE (a gated
# platform seed channel), never on the editable `domain` zone template. A
# content edit (or a future untrusted content pack) can never forge a
# title — access-check data lives only in this collection. This replaces
# the retired `data.ownerGroupName` stamps on the lounge / Terminus zone
# seeds.
#
# `owner` is a typed ParcelOwner: `{kind: group, name: <managed-group>}`
# resolves mint-or-find to a runtime `managed:<id>` ref (the seed can't
# know the id); `{kind: player, templatePath: <path>}` is an individual.
# `zonePath` defaults to `extent`. Seeding is idempotent (insert-iff-absent
# keyed on `extent`).
#
# `landUse` — one of the closed six (residential · agricultural ·
# commercial · industrial · civic · wild). OMIT IT on rows that are not
# ground: `/studio`, `/lib/lounge` and friends are path-branch titles over
# the template tree, and the inheritance walk answers `wild` for them,
# which admits nothing. That default is the fail-closed one and should
# stay. `areaM2` is the declared lot area — likewise omitted for
# path-branch rows. Neither is ever derived from room geometry; see
# lib/parcel/LandUse.ts.

parcels:
  # The /studio branch — the sandbox's group-cell namespace (sandbox
  # build, Decision M). Held by `core` so acting on it is already a
  # governance-gated act through the shipped AccessApi.can core-default
  # dispatch: a governor `subdivide`s /studio/<groupId> out of this
  # parcel and `transfer --group`s the child title to the group. No
  # self-serve path exists; /home stays personal, always.
  - extent: /studio
    owner: { kind: group, name: core }

  # The lounge team's ownership roots — the library folder and the content
  # folder, both owned by the managed `lounge` group (was ownerGroupName).
  - extent: /lib/lounge
    owner: { kind: group, name: lounge }
  - extent: /domain/lounge
    owner: { kind: group, name: lounge }

  # The Terminus municipality's transit-hub terminal — the first spatial
  # (CartesianZone) ownership stamp, validating "parcel = FolderZone OR
  # spatial zone" (was ownerGroupName: terminus).
  - extent: /domain/terminus/terminal
    owner: { kind: group, name: terminus }
    landUse: civic

  # The downtown Counting-Houses financial quarter — the public avenue block +
  # the Goodkin branch. The city (municipality) owns the district; Goodkin owns
  # its branch by corpo affiliation on the counter fixture, not by zone title.
  - extent: /domain/terminus/counting-houses
    owner: { kind: group, name: terminus }
    landUse: commercial

  # The general store off the avenue block — the city owns the building; the
  # store owns its Business (its P&L account), not the street it stands on.
  - extent: /domain/terminus/general-store
    owner: { kind: group, name: terminus }
    landUse: commercial

  # The city Registry annex (the civics flagship) — the administration's
  # own rented rooms, held like everything municipal by the managed
  # `terminus` group (the Terminus committee, in the jargon standard's
  # terms: the group holding title IS the committee).
  - extent: /domain/terminus/registry
    owner: { kind: group, name: terminus }
    landUse: civic

  # Hinkley Hills — the suburb, held by its own Improvement District
  # until a lot is sold out of it. `residential` is what makes a garden
  # bed legal here and illegal on the Registry's civic floor, and it is
  # INHERITED by every lot subdivided out of this extent unless that lot
  # declares otherwise. ~24 hectares of surveyed paddock: a hundred
  # quarter-acre lots' worth, which is the joke the empty stakes tell.
  #
  # Individual LOTS are minted by `title buy` — with ONE exception below.
  - extent: /domain/terminus/hinkley-hills
    owner: { kind: group, name: hinkley-hills }
    landUse: residential
    areaM2: 240000

  # ⭐ lot-1 — the one lot that was taken before you got here.
  #
  # It makes the lane's own prose TRUE on a fresh world: "Where a lot has
  # been taken there is a gate in the fence and, behind it, somebody's
  # roof." Without this the lane describes a gate that only exists after
  # somebody buys, so the first player to walk up the road is told about
  # a house that isn't there. A subdivision drawn for a hundred families
  # that got one is the whole joke, and one is not zero.
  #
  # Held by the developer group rather than a player: nobody is home, and
  # the parcel layer has no notion of an absent owner. Selling it on is a
  # later beat (there is no resale path yet).
  #
  # It is also what lets the e2e suite work a yard WITHOUT money. The gate
  # is ungated and the cultivation gate reads ZONING, not title, so a
  # walk-in-and-plant test needs a lot that is SOLD, not a lot it bought
  # — and buying one needs 4000 credits against char-gen's 20-credit
  # stipend. That gap is the economy working as designed; a test-only cash
  # faucet in the backend was the wrong way to close it.
  - extent: /domain/terminus/hinkley-hills/lots/lot-1
    parentParcel: /domain/terminus/hinkley-hills
    owner: { kind: group, name: hinkley-hills }
    landUse: residential
    areaM2: 1000

  # Duncan Hall's dorms wing — the parent parcel the leased unit parcels
  # subdivide under (…/dorms/f<n>-r<p>). Owned by the managed `duncan-hall`
  # group (the landlord). NO unit rows here: they're minted at provisioning.
  # No backing zone — the extent is just the D1 + Warren-member key string.
  - extent: /domain/eternal/duncan-hall/dorms
    owner: { kind: group, name: duncan-hall }
    landUse: residential
