# Starter emote roster — seeded into the `emotes` collection by
# `EmoteSeeder.run()` at boot. Each entry is an `EmoteSeedEntry`
# (see backend/EmoteSeeder.ts). One Liquid template per emote;
# slot kinds = `stuff` (MQL-resolved at scope `'online'`) or `free`
# (raw text). The bare emote with no target is the default register;
# the target / manner clauses extend it via Liquid conditionals.
#
# Author edits via `soul edit` survive subsequent seeder runs —
# the seeder is insert-only, matching `SeederManager`. To re-seed
# a single record: `db.emotes.deleteOne({verb: '<name>'}); restart`.

emotes:
  # ── Greetings ─────────────────────────────────────────────────
  - verb: wave
    emoji: "👋"
    tags: [greeting]
    grammar:
      slots:
        target: { kind: stuff, optional: true }
      template: "{{ actor }} wave{{ s }}{% if target %} at {{ target }}{% endif %}."

  - verb: bow
    emoji: "🙇"
    tags: [greeting, formal]
    grammar:
      slots:
        target: { kind: stuff, optional: true }
        manner: { kind: free, optional: true }
      template: "{{ actor }} bow{{ s }}{% if manner %} {{ manner }}{% endif %}{% if target %} before {{ target }}{% endif %}."

  - verb: nod
