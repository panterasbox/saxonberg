verbs: [watch]
controller: /obj/command/stream/WatchController
description: "Put a livestream's video in the focal embed (Twitch / YouTube)"
help: |
  Put a livestream's video in the cockpit's focal embed. Name the
  streamer the same three ways as `tune`:

    - a URL:      `watch twitch.tv/shroud`, `watch youtu.be/<id>`
    - a handle:   `watch shroud --twitch`, `watch mkbhd --youtube`
    - a character: `watch alice` (their linked Twitch channel)

  There is one focal video — a second `watch` swaps it; `watch off`
  clears it. Watching also follows the stream's chat (Twitch this
  cycle) so the chat pane fills in alongside the video.

  Most forms need no setup — a Twitch handle, a YouTube URL / video id /
  channel id all resolve with no external call, so watching works even
  when the chat relay is unconfigured. A bare YouTube `@handle` needs the
  YouTube reader configured (give a URL / video id otherwise).
validators:
  - /lib/command/validators/requiresAnimate
fallthrough: true
options:
  twitch:
    type: boolean
    field: twitch
    description: "The target is a Twitch handle"
  youtube:
    type: boolean
    field: youtube
    description: "The target is a YouTube handle"
subcommands:
  off:
    description: "Clear the focal embed"
args:
  - name: target
    type: string
    required: true
