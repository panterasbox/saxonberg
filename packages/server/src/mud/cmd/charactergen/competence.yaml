verbs: [competence]
controller: /obj/command/charactergen/CompetenceController
description: "Read your own competence — the bands you've reached."
help: |
  Your competence on the record, as *bands* — never a number. The
  view lists each Discipline you have practiced and the band your
  evidence currently warrants (the floor band is implicit: Disciplines
  you've never practiced simply don't appear).

  You learn you've improved the way you would in life — the lock that
  beat you last week now clicks open — not by watching a meter tick.
  It's a read-only, self-only view, and takes no arguments.
