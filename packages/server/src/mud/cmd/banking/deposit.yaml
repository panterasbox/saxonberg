verbs: [deposit]
controller: banking/DepositController
description: "Deposit coin into your account"
help: |
  Hand coin across the counter — `deposit coins`. The cash goes into the
  vault and your balance rises by the same amount.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: coins
    type: object
    required: true
    scope: "inventory"
