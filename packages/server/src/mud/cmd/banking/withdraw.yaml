verbs: [withdraw]
controller: banking/WithdrawController
description: "Withdraw cash from your account"
help: |
  Draw cash from your account — `withdraw 50`. Bounded by your balance and
  by the branch's actual coin on hand: a branch can run low.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: amount
    type: string
    required: true
