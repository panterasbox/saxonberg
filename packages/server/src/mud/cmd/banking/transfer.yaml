verbs: [transfer]
controller: banking/TransferController
description: "Transfer money to someone by name"
help: |
  Move money from your account here to someone else — `transfer 25 to bob`.
  It lands in their account, addressed by who they are; no number needed.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: amount
    type: string
    required: true
  - name: recipient
    type: object
    required: true
    prepositions: [to]
    scope: ["reachable", "online"]
