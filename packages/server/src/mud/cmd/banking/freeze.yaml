verbs: [freeze]
controller: banking/FreezeController
description: "Report a payment card lost (freeze + reissue)"
help: |
  Report a card lost — `freeze card`. The card is frozen (it can no longer
  spend) and a fresh replacement is issued for the same account. Your
  balance is untouched. The implant can't be lost this way.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: card
    type: object
    required: true
    scope: "inventory"
