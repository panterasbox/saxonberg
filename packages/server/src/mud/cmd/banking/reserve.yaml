verbs: [reserve]
controller: banking/ReserveController
description: "Central bank operator — mint / supply (operator)"
help: |
  The central-bank surface. `reserve mint <amount>` mints subsidy into the
  present venue's account — a logged, visible, accountable faucet that covers
  the deficit-as-target P&L. `reserve supply` reads the money supply and the
  reconciliation audit. Operator-gated.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresWizard
subcommands:
  mint:
    description: "Mint subsidy into the present venue's account"
    args:
      - name: amount
        type: string
        required: true
  supply:
    description: "Money supply + reconciliation audit"
