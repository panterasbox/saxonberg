verbs: [bank]
controller: banking/BankController
description: "Bank here — balance / open / deposit / withdraw / transfer"
help: |
  Do your banking at the branch you're standing in. Bare `bank` shows your
  balance. `bank open` opens an account (recording the branch's corpo
  affiliation); `bank deposit <coins>` and `bank withdraw <amount>` move
  cash across the counter; `bank transfer <amount> to <who>` pays another
  account by name. No account number is ever needed.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
subcommands:
  open:
    description: "Open an account at this branch"
  balance:
    description: "Show your balance here (same as bare `bank`)"
  deposit:
    description: "Deposit a coin stack into your account"
    args:
      - name: coins
        type: object
        required: true
        scope: "inventory"
  withdraw:
    description: "Withdraw cash from your account (till-bounded)"
    args:
      - name: amount
        type: string
        required: true
  transfer:
    description: "Transfer money to someone by name"
    args:
      - name: amount
        type: string
        required: true
      - name: recipient
        type: object
        required: true
        prepositions: [to]
        scope: ["reachable", "online"]
