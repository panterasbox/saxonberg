verbs: [fly]
controller: movement/FlyController
description: "Fly through a named exit (must be Flyable-enabled)."
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: target
    type: object
    required: true
    validators:
      - /lib/command/validators/canReach
