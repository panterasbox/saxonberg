verbs: [ride]
controller: /obj/command/movement/RideController
description: "Ride your mount through a named exit (passthrough to the Mountable host)."
help: |
  Steer the mount you're on through an exit. Name where you want to
  go (`ride north`, `ride gate`) and your mount carries you there —
  you don't move on your own feet, the mount does the traveling.

  You need to be mounted first; use `mount` to get on and `dismount`
  to get off. For a vehicle rather than a creature, use `drive`.
validators:
  - /lib/command/validators/requiresAnimate
args:
  - name: target
    type: object
    scope: ["$focus", "reachable"]
    required: true
    validators:
      - /lib/command/validators/canReach
