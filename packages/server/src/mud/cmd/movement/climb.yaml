verbs: [climb]
controller: movement/ClimbController
description: "Climb through a named exit (must be Climbable-enabled)."
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: target
    type: object
    required: true
    validators:
      - /lib/command/validators/canReach
