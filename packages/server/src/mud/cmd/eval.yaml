verbs: [eval]
controller: EvalController
description: "Run a code snippet against the avatar (or --on target)"
args:
  - name: expr
    type: string
    required: false
    greedy: true
options:
  on:
    type: objects
    scope: [reachable]
    description: "MQL expression for the target(s) to bind `this` to"
  all:
    type: boolean
    description: "When --on matches multiple, iterate across each"
