verbs: [examine, exa]
controller: /obj/command/perception/ExamineController
description: "Look closely at something for what it conceals"
help: |
  `examine` is a quick, close once-over of one thing — sharper than a
  passing `look`, but instantaneous and free (it doesn't tie up your
  hands the way a full `search` does). Name a container and you peer
  into it for anything half-concealed; you turn up less than a proper
  `search` would, but you lose no time doing it.

  Use `search` when you want to go over a place thoroughly, or when a
  thing is well hidden.
examples:
  - cmd: examine the drawer
    note: A quick close look inside
args:
  - name: target
    type: object
    required: true
    scope: ["$focus", "reachable"]
    updates_focus: extend
    prepositions: [at, in, inside]
