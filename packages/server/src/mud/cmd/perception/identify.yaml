verbs: [identify]
controller: /obj/command/perception/IdentifyController
description: "Read a scroll of identify on something to learn what it is"
help: |
  Read aloud from a scroll of identify to learn the true nature
  of a thing — what it really is, beneath whatever name or
  appearance it wears. Use it when an object's surface
  description leaves you guessing.

  You need the scroll in hand and the ability to read it, and the
  target must be within reach. Identifying something teaches you
  its identity for good; you won't need the scroll again for that
  same thing.
validators:
  - /lib/command/validators/requiresAnimate
args:
  - name: target
    type: object
    required: true
    scope: "reachable"
    onExcess: prompt
