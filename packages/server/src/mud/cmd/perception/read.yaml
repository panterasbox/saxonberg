verbs: [read]
controller: /obj/command/perception/ReadController
description: "Take in the marks on a written thing and decode them"
help: |
  Reading is two things at once, and they come apart.

  First you have to **perceive** the marks. Ink needs light — a
  scroll in a dark cellar is a blank you cannot make out. Raised or
  incised lettering does not: you can read embossed text with your
  hands, in the pitch dark, which is why an expedition pays for it.

  Then you **decode** what you perceived. Everyone reads the common
  script, so today this is the easy half — but it is a separate
  half, and a spellbook's comprehension floor lives in it.

  Reading a scroll is also how a scroll's working fires. There is no
  separate verb for that, deliberately: if there were, the verb
  showing up in your list would tell you what you were holding.

  Some workings need something to act on. Reading is not aimed —
  you read a scroll, you do not read *at* a flask — so when the
  working needs a mark it simply asks you which one, and a scroll
  is never spent on a question you did not answer.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: target
    type: object
    required: true
    scope: ["$focus", "reachable"]
    updates_focus: extend
    requires: [VisibleMixin, MarkedMixin]
