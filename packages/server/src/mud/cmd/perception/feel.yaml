verbs: [feel]
controller: perception/FeelController
description: "Feel your surroundings or a specific thing"
validators:
  - /lib/command/validators/requiresTouch
args:
  - name: target
    type: object
    required: false
    scope: ["$focus", "reachable"]
    updates_focus: extend
    prepositions: [at]
    default: "$focus"
    onExcess: prompt
