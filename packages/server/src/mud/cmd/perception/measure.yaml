verbs: [measure]
description: "Measure a physical channel at a location"
help: |
  Read a single value off the world. `measure` gives you one
  clean number for a physical channel where you stand — no
  breakdown, no provenance, just the figure. When you want the
  working behind it, reach for `analyze` instead.

  Pick a channel as a subcommand: `light`, `temperature`,
  `pressure`, `humidity`, `gravity`, `atmosphere`, `altitude`,
  or `shadow`. Some of the sky readings (`altitude`, `shadow`)
  need an instrument such as a sextant or sundial.
subcommands:
  light:
    description: "Measure light intensity at a location (lux)"
    help: |
      Read the light level at a place in lux — one number, no
      source breakdown. Defaults to where you stand if you name
      no location. For the per-source breakdown, use
      `analyze light`.
    examples:
      - cmd: measure light the cellar
        note: Read the light at another place
    controller: /obj/command/perception/MeasureLightController
    args:
      - name: location
        type: object
        required: false
        default: "here"
        scope: ["reachable"]
        validators:
          - /lib/command/validators/mustBeContainer
  temperature:
    description: "Measure atmospheric temperature (Kelvin) at your immediate scope"
    help: |
      Read the air temperature around you in Kelvin. Measures your
      immediate surroundings; it doesn't take a location.
    controller: /obj/command/perception/MeasureTemperatureController
    args:
      - name: detail
        type: string
        required: false
  pressure:
    description: "Measure atmospheric pressure (Pa) at your immediate scope"
    help: |
      Read the air pressure around you in pascals. Measures your
      immediate surroundings; it doesn't take a location.
    controller: /obj/command/perception/MeasurePressureController
    args:
      - name: detail
        type: string
        required: false
  humidity:
    description: "Measure relative humidity (%) at your immediate scope"
    help: |
      Read the relative humidity around you as a percentage.
      Measures your immediate surroundings; it doesn't take a
      location.
    controller: /obj/command/perception/MeasureHumidityController
    args:
      - name: detail
        type: string
        required: false
  gravity:
    description: "Measure gravitational acceleration (m/s²) at your immediate scope"
    help: |
      Read the local gravity around you in metres per second
      squared — handy off-world or anywhere the pull feels wrong.
      Measures your immediate surroundings; it doesn't take a
      location.
    controller: /obj/command/perception/MeasureGravityController
    args:
      - name: detail
        type: string
        required: false
  atmosphere:
    description: "Identify the bulk atmosphere medium at your immediate scope"
    help: |
      Name the medium you're standing in — air, water, vacuum, or
      whatever else fills the space. Useful before you trust a
      breath. Measures your immediate surroundings; it doesn't take
      a location.
    controller: /obj/command/perception/MeasureAtmosphereController
    args:
      - name: detail
        type: string
        required: false
  altitude:
    description: "Estimate altitude from the barometric delta, or read the angular altitude of the sun/moon with a sextant"
    help: |
      With no argument, estimate how high you are from the drop in
      air pressure. Name a celestial body — the sun or moon — to
      read its angular height above the horizon with a sextant.
    examples:
      - cmd: measure altitude sun
        note: Read the sun's angle with a sextant
    controller: /obj/command/perception/MeasureAltitudeController
    args:
      - name: body
        type: string
        required: false
  shadow:
    description: "Read solar elevation/azimuth from your shadow (needs a sundial)"
    help: |
      Read the sun's elevation and bearing off the cast of your
      shadow — an old way to tell the time and direction outdoors.
      Needs a sundial to hand and a sun in the sky.
    controller: /obj/command/perception/MeasureShadowController
    args:
      - name: detail
        type: string
        required: false
