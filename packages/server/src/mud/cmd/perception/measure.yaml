verbs: [measure]
description: "Measure a physical channel at a location"
subcommands:
  light:
    description: "Measure light intensity at a location (lux)"
    controller: perception/MeasureLightController
    args:
      - name: location
        type: object
        required: false
        default: "here"
        scope: ["reachable"]
        validators:
          - /lib/command/validators/mustBeContainer
  temperature:
    description: "Measure atmospheric temperature (Kelvin) at your immediate scope"
    controller: perception/MeasureTemperatureController
    args:
      - name: detail
        type: string
        required: false
  pressure:
    description: "Measure atmospheric pressure (Pa) at your immediate scope"
    controller: perception/MeasurePressureController
    args:
      - name: detail
        type: string
        required: false
  humidity:
    description: "Measure relative humidity (%) at your immediate scope"
    controller: perception/MeasureHumidityController
    args:
      - name: detail
        type: string
        required: false
  gravity:
    description: "Measure gravitational acceleration (m/s²) at your immediate scope"
    controller: perception/MeasureGravityController
    args:
      - name: detail
        type: string
        required: false
  atmosphere:
    description: "Identify the bulk atmosphere medium at your immediate scope"
    controller: perception/MeasureAtmosphereController
    args:
      - name: detail
        type: string
        required: false
  altitude:
    description: "Estimate altitude from the barometric delta, or read the angular altitude of the sun/moon with a sextant"
    controller: perception/MeasureAltitudeController
    args:
      - name: body
        type: string
        required: false
  shadow:
    description: "Read solar elevation/azimuth from your shadow (needs a sundial)"
    controller: perception/MeasureShadowController
    args:
      - name: detail
        type: string
        required: false
