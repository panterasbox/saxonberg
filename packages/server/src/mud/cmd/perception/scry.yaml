verbs: [scry]
controller: /obj/command/perception/ScryController
description: "Perceive a remote object as if you were there"
help: |
  See the distant as though you stood beside it. `scry` perceives
  a remote object — somewhere else entirely — rendering it as if
  you were present. Reach for it when you want to check on
  something far away without travelling there.

  Scrying usually needs an instrument that grants the sight. Pass
  `--with` an MQL expression naming the focus or device that
  powers the vision when one is required.
args:
  - name: target
    type: object
    required: true
    scope: ["online", "/obj/**"]
    requires: any
options:
  with:
    type: object
    scope: [reachable]
    description: "MQL expression for an instrument that grants the scry"
    requires: ScryableMixin
