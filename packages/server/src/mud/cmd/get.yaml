verbs: [get, take]
controller: GetController
description: "Pick up objects from your location"
args:
  - name: targets
    type: objects
    required: true
    greedy: true
    scope: "peers"
    validators:
      - /lib/command/validators/mustBeVisible
      - /lib/command/validators/mustBeContainable
      - /lib/command/validators/mustBeInLocation
