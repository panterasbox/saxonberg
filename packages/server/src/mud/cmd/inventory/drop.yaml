verbs: [drop]
controller: /obj/command/inventory/DropController
description: "Drop objects from your inventory"
help: |
  Set something down where you're standing. `drop` takes one or
  more things out of your inventory and leaves them in the room for
  anyone to see or pick up.

  Name several items in one line to drop them all at once. You can
  only drop what you're actually carrying — worn or wielded gear has
  to come off first with `remove` or `unwield`.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresEmbodied
args:
  - name: targets
    type: objects
    required: true
    greedy: true
    scope: "inventory"
    validators:
      - /lib/command/validators/mustBeContainable
      - /lib/command/validators/mustBeInInventory
