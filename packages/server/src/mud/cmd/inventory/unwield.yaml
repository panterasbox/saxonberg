verbs: [unwield]
controller: /obj/command/inventory/UnwieldController
description: "Stop wielding a held item"
help: |
  Lower a weapon or tool you're holding. `unwield` frees your hand
  and returns the item to your inventory, where it stays until you
  wield it again, stow it, or drop it.

  This is the counterpart to `wield` — for taking off worn clothing
  or armor, reach for `remove` instead.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresSlotted
  - /lib/command/validators/requiresEmbodied
args:
  - name: target
    type: object
    required: true
    scope: "inventory"
    requires: WieldableMixin
    validators:
      - /lib/command/validators/mustBeInInventory
