verbs: [unwield]
controller: inventory/UnwieldController
description: "Stop wielding a held item"
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresSlotted
args:
  - name: target
    type: object
    required: true
    scope: "inventory"
    validators:
      - /lib/command/validators/mustBeInInventory
      - /lib/command/validators/mustBeWieldable
