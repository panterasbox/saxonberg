verbs: [wield]
controller: inventory/WieldController
description: "Wield a weapon or held item from your inventory"
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresSlotted
args:
  - name: target
    type: object
    required: true
    scope: "inventory"
    validators:
      - /lib/command/validators/mustBeInInventory
      - /lib/command/validators/mustBeWieldable
