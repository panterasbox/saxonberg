verbs: [wield]
controller: /obj/command/inventory/WieldController
description: "Wield a weapon or held item from your inventory"
help: |
  Take a weapon or tool in hand. `wield` readies an item from your
  inventory for use, occupying a hand until you put it away.

  The item has to be something you can hold. If your hands are
  already full, lower what you're holding with `unwield` first. To
  put on clothing or armor instead, use `wear`.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresSlotted
  - /lib/command/validators/requiresEmbodied
args:
  - name: target
    type: object
    required: true
    scope: "inventory"
    requires: WieldableMixin
    validators:
      - /lib/command/validators/mustBeInInventory
