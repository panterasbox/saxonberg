verbs: [get, take]
controller: inventory/GetController
description: "Pick up objects from your location"
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: targets
    type: objects
    required: true
    greedy: true
    scope: "peers"
    validators:
      - /lib/command/validators/mustBeVisible
      - /lib/command/validators/mustBeContainable
      - /lib/command/validators/mustBeInLocation
