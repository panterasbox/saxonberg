verbs: [get, take]
controller: inventory/GetController
description: "Pick up objects from your location"
help: |
  Pick something up off the ground or out of the room and move it
  into your inventory. You can only get things that are here with
  you — to take something out of a container or off a surface, name
  it and `get` reaches in.

  Name several things at once to grab them in one go. You can't get
  what you're already carrying.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: targets
    type: objects
    required: true
    greedy: true
    scope: "peers"
    validators:
      - /lib/command/validators/mustBeVisible
      - /lib/command/validators/mustBeContainable
      - /lib/command/validators/mustBeInLocation
