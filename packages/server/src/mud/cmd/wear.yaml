verbs: [wear]
controller: WearController
description: "Put on a wearable item from your inventory"
validators:
  - /lib/command/validators/requiresAnimate
args:
  - name: target
    type: object
    required: true
    scope: "inventory"
    validators:
      - /lib/command/validators/mustBeInInventory
      - /lib/command/validators/mustBeWearable
