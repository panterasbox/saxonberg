# teleport — dual-mode, one verb, two forks chosen by privilege.
#
#  - Self-powered (privileged): teleport yourself anywhere, destination
#    targeted via MQL; `--target <obj>` moves something else instead
#    (subsumes the old object-relocation teleport and `goto`).
#  - TPA ride (unprivileged): the same verb rides the Teleport Authority
#    from the node you're standing at; the raw destination token is a
#    route keyword, and a bare `teleport` reads the departures board.
#
# Only `requiresAnimate` is verb-level — the TPA-specific gating (a
# credential, being at a node) lives inside the TPA fork so it never
# blocks the privileged self-powered path.
verbs: [teleport, tp]
controller: /obj/command/author/TeleportController
description: "Teleport yourself (or --target something) — self-powered if able, else via the Teleport Authority."
help: |
  Cross the world in a single step. How `teleport` behaves depends
  on what you're allowed to do. If you have the privilege, it
  self-powers: name any destination and you go, and `--target
  <obj>` sends something else there instead of you.

  Without that privilege, the same verb rides the Teleport
  Authority from the node you're standing at. Here the destination
  is a route keyword, and a bare `teleport` just reads the
  departures board for the routes you can take.

  `--force` (`-f`) bypasses teleport and containment vetoes, but
  it's admin-only and the v1 stub always denies it. `tp` is a
  shorthand alias.
examples:
  - cmd: teleport University Avenue
    note: Travel to a destination or route
  - cmd: teleport --target Bob fountain
    note: Send another being to a destination
validators:
  - /lib/command/validators/requiresAnimate
args:
  # Where to go. Self-powered fork resolves it as an MQL target; the TPA
  # fork reinterprets the raw token as a local route keyword.
  - name: destination
    type: object
    required: false
    scope: ["online", "/obj/**", "reachable"]
    requires: any
options:
  target:
    short: t
    type: object
    scope: ["reachable", "online", "/obj/**"]
    description: "Move this object/being instead of yourself (privileged; access-gated)."
    requires: any
  force:
    short: f
    type: boolean
    description: "Bypass canTeleport / containment vetoes (admin only; v1 stub always denies)."
