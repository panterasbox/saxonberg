verbs: [reload]
controller: author/ReloadController
description: "Hot-reload a template or runtime instance"
validators:
  - /lib/command/validators/requiresDeveloper
args:
  - name: target
    type: string
    required: false
options:
  mql:
    type: object
    scope: [reachable]
    description: "MQL expression alternate to <target>"
