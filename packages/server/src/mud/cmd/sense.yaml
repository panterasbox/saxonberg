verbs: [sense]
controller: SenseController
description: "Take in your surroundings across every sense you possess"
validators:
  - /lib/command/validators/requiresLocation
args:
  - name: target
    type: object
    required: false
    scope: ["$focus", "reachable"]
    updates_focus: extend
    prepositions: [at]
    default: "$focus"
    onExcess: prompt
