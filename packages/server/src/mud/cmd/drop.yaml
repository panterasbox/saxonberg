verbs: [drop]
controller: DropController
description: "Drop objects from your inventory"
syntax:
  - pattern: "<target>"
    description: "Drop a single object"
    fields:
      target:
        type: object
        required: true
        searchOrder: [inventory]

  - pattern: "<targets...>"
    description: "Drop multiple objects"
    fields:
      targets:
        type: object
        required: true
        multiple: true
        searchOrder: [inventory]
