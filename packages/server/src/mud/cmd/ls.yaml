verbs: [ls]
controller: LsController
description: "List children of <path> (or cwd) in the content or source tree"
args:
  - name: path
    type: string
    required: false
options:
  mql:
    type: object
    scope: [reachable]
    description: "MQL expression alternate to <path>"
  content:
    short: c
    type: boolean
    description: "Force the operation to the content tree (overrides workspace.tree)"
  source:
    short: s
    type: boolean
    description: "Force the operation to the source tree (overrides workspace.tree)"
  long:
    short: l
    type: boolean
    description: "Long-form listing (one entry per line)"
  recursive:
    short: R
    type: boolean
    description: "Recurse into subdirectories"
