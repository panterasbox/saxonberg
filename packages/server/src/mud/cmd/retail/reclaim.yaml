verbs: [reclaim, unconsign]
controller: /obj/command/retail/ReclaimController
description: "Take back an unsold good you consigned"
help: |
  Take back a good you consigned that hasn't sold yet — `reclaim
  lantern`. Custody returns to you; you owned it the whole time.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: thing
    type: string
    required: true
