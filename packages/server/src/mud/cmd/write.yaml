verbs: [write]
controller: WriteController
description: "Author a content-tree template or source-tree file (uses workspace.tree default; require -c / -s under mirror mode)"
args:
  - name: path
    type: string
    required: true
options:
  mql:
    type: object
    scope: [reachable]
    description: "MQL expression alternate to <path>"
  content:
    short: c
    type: boolean
    description: "Write to the content tree (mutually exclusive with -s)"
  source:
    short: s
    type: boolean
    description: "Write to the source tree (mutually exclusive with -c)"
  class:
    type: string
    description: "Backing class path for content writes (default /lib/stuff/Idea)"
  hydrator:
    type: string
    description: "Hydrator class path for content writes (default /lib/persistence/PersistentHydrator); pass empty string to omit"
payload:
  body:
    type: string
    required: true
    description: "File body. Structured-form-only — provided by the client via the structured payload channel; not bindable from the text shell."
