verbs: [fold]
controller: /obj/command/device/FoldController
description: "Fold up a collapsible thing"
help: |
  Fold up something that collapses — a folding camp chair. Name the
  thing (`fold chair`). You can't fold it while someone's using it, and
  a folded chair can't be sat on until you unfold it again.

  The target has to be within reach. If it's already folded, or it
  isn't something that folds at all, the game tells you so and nothing
  happens.
validators:
  - /lib/command/validators/requiresAnimate
args:
  - name: target
    type: object
    required: true
    scope: "reachable"
    updates_focus: extend
    validators:
      - /lib/command/validators/canReach
