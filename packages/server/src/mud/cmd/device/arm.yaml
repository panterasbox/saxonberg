verbs: [arm]
controller: /obj/command/device/ArmController
description: "Set and conceal a carried trap where you stand"
help: |
  `arm` deploys a trap you're carrying — a `trap kit` — into the room
  around you, tucked out of sight. How well it's hidden is a read of
  your **stealth** (and the cover the place affords): a practised hand
  leaves a snare a careful searcher still walks onto.

  You may set traps freely on ground you hold. On shared or public
  ground you *can* still set one — but if it later springs on someone
  who didn't agree to be hurt, that's on you (a crime, derived the same
  way a struck-down victim's is). You can't rig a trap on someone
  else's property.

  A kit makes one trap. You can pick your own un-sprung trap back up;
  once it springs, it's spent. To defuse someone's trap you've found,
  use `disarm`.
examples:
  - cmd: arm the trap kit
    note: Set and conceal a carried trap here
validators:
  - /lib/command/validators/requiresAnimate
args:
  - name: target
    type: object
    required: true
    scope: ["$focus", "reachable"]
    updates_focus: extend
    validators:
      - /lib/command/validators/canReach
