verbs: [collect]
controller: /obj/command/employment/CollectController
description: "Collect the tips from the jar (on-shift bartender)"
help: |
  Scoop the tip jar into your own pocket — `collect` (or `collect tips`).
  Only whoever's actually tending the bar can take it, and they take the
  lot: per-shift, off the books. The jar goes back to empty.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: what
    type: string
    required: false
