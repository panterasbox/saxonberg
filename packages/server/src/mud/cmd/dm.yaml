verbs: [dm, tell, whisper]
controller: DmController
description: "Send a direct message (dm) to someone"
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresVerbalESP
args:
  - name: target
    type: object
    required: true
    scope: "online"
    # `mustBeAgent` filters Login objects (HasInteractive but not
    # Agent) and any other non-actor command-giver out of the
    # candidate set; only Avatars and NPCs that extend Agent pass.
    validators:
      - /lib/command/validators/mustBeAgent
    # Typed ambiguity (two players matching the same keyword) →
    # disambiguation prompt instead of silently picking the top.
    onExcess: prompt
  - name: message
    type: string
    required: true
    greedy: true
