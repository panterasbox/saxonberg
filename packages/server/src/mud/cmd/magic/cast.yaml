verbs: [cast]
controller: /obj/command/magic/CastController
description: "Shape a magical working"
help: |
  `cast <spell> [<target>]` shapes a working you command. Casting takes
  time and commits your hands and voice — a blow, a grapple, or your own
  `cancel` interrupts it, and an interrupted cast spends nothing and does
  nothing. What a spell can do, it does through the real world: fire it
  starts is real fire, current it looses follows the honest paths (your
  own body included), and a working another mage holds up can be
  unmade with `cast dispel`.

  `spells` lists what you can currently shape, and how well.
examples:
  - cmd: cast glowlight
    note: A held mote of cold light (lasts until dispelled or it lapses)
  - cmd: cast firebolt at the dummy
    note: Real heat — flesh burns, tinder catches, iron merely warms
  - cmd: cast dispel at the veiled figure
    note: Unravels magical workings; a mundane fever is untouchable
args:
  - name: spell
    type: string
    required: true
  - name: target
    type: object
    required: false
    scope: ["$focus", "reachable"]
    updates_focus: extend
    prepositions: [at, on]
validators:
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresCastingFaculty
  - /lib/command/validators/requiresEmbodied
