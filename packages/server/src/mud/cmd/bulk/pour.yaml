verbs: [pour]
controller: /obj/command/bulk/PourController
description: "Pour liquid from one holder into another"
help: |
  Moves liquid from one holder into another. Name the source
  first, then the destination with `into`:
  `pour the jug into the cup`. With no measure given, you pour as
  much as the destination can take and the rest stays put.

  Lead with a measure to pour a precise amount —
  `pour 2 cups water into the pot`. Liquids that don't mix won't
  combine, and pouring into an open vessel that's already full can
  spill through. To fill something completely instead, use `fill`;
  to dump everything on the ground, use `spill`.
examples:
  - cmd: pour the jug into the cup
    note: Move liquid between two holders
  - cmd: pour 2 cups water into the pot
    note: Pour a measured amount
validators:
  - /lib/command/validators/requiresAnimate
args:
  - name: source
    type: object
    required: true
    scope: "reachable"
    validators:
      - /lib/command/validators/mustBeVisible
  - name: target
    type: object
    required: true
    scope: "reachable"
    prepositions: [into, in]
    validators:
      - /lib/command/validators/mustBeVisible
