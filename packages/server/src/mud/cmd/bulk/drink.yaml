verbs: [drink, quaff]
controller: /obj/command/bulk/DrinkController
description: "Drink from a holder — all of it, or a measured amount"
help: |
  Point `drink` at a cup, flask or bottle and you swallow what is
  in it. Without a measure you finish the container and it comes
  back empty.

  You can name the container or the liquid itself, so
  `drink coffee` works as well as `drink mug`. If you only want a
  taste, use `sip` instead, which leaves the rest behind.

  Give `--amount` to take a measured quantity —
  `drink flask --amount 100ml`, `drink mug --amount 1cup`. This is
  real for a potion: dose response is continuous, so half a graded
  draught is half the effect, and a threshold draught does nothing
  at all below its minimum.

  `quaff` is the same verb. A potion is a liquid like any other —
  it goes down through the same door as ale, and the measure is
  real: dose response is continuous, so half a graded draught is
  half the effect, and a threshold draught does nothing at all
  below its minimum.
options:
  amount:
    type: string
    description: "How much to drink — `100ml`, `1cup`, `0.5L`"
  exact:
    type: boolean
    description: "Take the full measure or none of it"
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: target
    type: object
    required: true
    scope: "reachable"
    validators:
      - /lib/command/validators/mustBeVisible
      - /lib/command/validators/mustHaveBulkSlot
examples:
  - cmd: drink the flask
    note: Finish it
  - cmd: drink flask --amount 100ml
    note: Take a measured dose and leave the rest
