verbs: [drink, quaff]
controller: /obj/command/bulk/DrinkController
description: "Drink the contents of a holder"
help: |
  Point `drink` at a cup, flask or bottle and you swallow what is
  in it. Without a measure you finish the container and it comes
  back empty.

  You can name the container or the liquid itself, so
  `drink coffee` works as well as `drink mug`. If you only want a
  taste, use `sip` instead, which leaves the rest behind.

  `quaff` is the same verb. A potion is a liquid like any other —
  it goes down through the same door as ale, and the measure is
  real: dose response is continuous, so half a graded draught is
  half the effect, and a threshold draught does nothing at all
  below its minimum.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: target
    type: object
    required: true
    scope: "reachable"
    validators:
      - /lib/command/validators/mustBeVisible
