verbs: [eat]
controller: bulk/EatController
description: "Eat a discrete edible item"
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: target
    type: object
    required: true
    scope: "reachable"
    validators:
      - /lib/command/validators/mustBeVisible
      - /lib/command/validators/mustBeEdible
