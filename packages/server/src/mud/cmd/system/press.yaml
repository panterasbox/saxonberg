verbs: [press]
controller: /obj/command/system/PressController
opens_card: news
description: "The news ticker — the staff→player broadcast feed (post / edit / retract)"
help: |
  Put something out under a publisher's name, and manage what is
  already out. Everything published rides the news ticker that every
  connected player sees.

  `press post <headline>` publishes an announcement. Type the
  headline inline and the longer text with `--body`. (Bare `press
  <headline>` is shorthand for `press post <headline>`.)

  `--as` names the publisher organization the release goes out
  under, by path (e.g. `/compact/press`). It is required and never
  guessed: which masthead something appears under is your statement,
  not the game's. You must hold one of that organization's
  publishing positions — being the person who *appoints* to them is
  a different power and does not count.

  There is no `--realm`. Whether a release reads as operator
  (`ooc`) or in-fiction (`world`) is a fact about the publisher, not
  about the release, so it is taken from the organization — you
  cannot speak in character on an operator's feed by passing a flag.

  `--body "..."` adds the long-form text under the headline —
  quote it, and it may use MML.

  `--visibility` may make one release **more private** than its
  publisher normally is (`public` | `members`). It can only narrow:
  asking for `public` on a members-only publisher gets you
  `members`.

  `--kind` classifies it: `changelog`, `decision`, `event`, `notice`
  (default), or `repost` — something somebody else put out, with
  `--source` saying whose. `--pin` sticks it to the top of the
  window. `--expires` sets a shell-style lifetime (`2h`, `7d`,
  `1h30m`); without one it never expires.

  `press edit <id> …` revises an existing release; `press
  retract <id>` soft-deletes it (the document stays in the archive
  but drops out of the live window).

  The verb is offered to anyone holding a publishing position
  anywhere — if you hold none, the game won't offer it.
validators:
  - /lib/command/validators/requiresPublisher
fallthrough: true
options:
  as:
    type: string
    field: as
    description: "Publisher organization path to publish as (e.g. /compact/press)"
  # ⚠ The body is a verb-scoped OPTION, not the `payload:` side-channel it
  # used to be. The side-channel is the GUI editor's seam — and there is
  # no press editor, so nothing could write a body at all and every
  # release shipped bodiless. A quoted `--body` makes it reachable from
  # the command line today; a structured editor can still submit the
  # `body` field later, since it is a known field name either way.
  body:
    type: string
    field: body
    description: "Long-form MML body — quote it: --body \"...\""
  # Verb-scoped (global to `press`): in scope for the bare/`post`
  # publish form AND the edit subcommand. No YAML `default:` on kind — the
  # publish default (notice) is applied in the controller so an unpassed
  # flag stays undefined on the edit patch (change-only-what-you-pass).
  visibility:
    type: string
    field: visibility
    description: "Narrow this release's reach: public | members (never widens)"
  source:
    type: string
    field: source
    description: "Where a repost's substance came from"
  kind:
    type: string
    field: kind
    description: "Classification: changelog | decision | event | notice | repost (publish default notice)"
  pin:
    type: boolean
    field: pin
    description: "Pin to the top of the ticker window"
  expires:
    type: string
    field: expires
    description: "Shell-style lifetime (e.g. 2h, 7d, 1h30m); omit for never"
subcommands:
  post:
    description: "Publish a new release to the ticker"
    help: |
      Publish an announcement to the news ticker. Give the headline
      inline and the publisher with `--as`; the verb-scoped
      `--body` / `--visibility` / `--kind` / `--pin` / `--expires`
      options shape it. Bare `press <headline>` is the same thing.
    args:
      - name: headline
        type: string
        required: true
        greedy: true
  edit:
    description: "Edit an existing release in place (by id)"
    help: |
      Revise a release you published. Give its id, then the new
      headline inline (or leave it off to edit only the flags). The
      same verb-scoped `--body` / `--visibility` / `--kind` / `--pin` /
      `--expires` options apply, changing only the ones you pass.
    args:
      - name: id
        type: string
        required: true
      - name: headline
        type: string
        required: false
        greedy: true
  retract:
    description: "Retract a release (soft delete — kept in the archive)"
    help: |
      Drop a release out of the live ticker. It is a soft delete: the
      row stays in the archive for truthfulness, but no longer shows in
      the window.
    args:
      - name: id
        type: string
        required: true
args:
  # Fallthrough: when the first token isn't `post` / `edit` / `retract`,
  # bind the shorthand publish form `press <headline>`. The headline is
  # greedy — it consumes the whole inline phrase (a multi-word ticker line).
  - name: headline
    type: string
    required: true
    greedy: true
