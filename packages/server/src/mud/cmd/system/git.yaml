verbs: [git]
controller: /obj/command/system/GitController
description: "In-runtime version control: status / diff / log / publish / revert engine source edits"
help: |
  Capture your live source edits into version control. The box tracks a
  long-lived authoring branch; your edits accumulate as working-tree
  changes until you `git publish` them as a commit pushed to GitLab.

  `git` (or `git status`) shows the current branch, whether it diverges
  from its remote, and the dirty files. `git diff [<path>]` shows the
  working-tree patch; `git log [<path>] [--limit <n>]` shows recent
  commits.

  `git publish -m "<message>"` stages **only** the dirty files in source
  slices you may write, commits them authored to you, and pushes the
  branch. Files you may not write are left dirty for their owner. Paths
  outside `packages/` (docs, deploy config) can't be published — git is
  never a permission bypass.

  `git revert <sha>` adds a commit undoing an earlier one, scoped to files
  you may write (a commit touching anything you may not write is refused).

  Wizard-only — it version-controls engine TypeScript.
examples:
  - cmd: git status
    note: Show the branch, divergence, and dirty files
  - cmd: git publish -m "fix the lounge bar brain"
    note: Commit + push your writable dirty files
  - cmd: git revert 1a2b3c4
    note: Additively roll back a commit you may write
validators:
  - /lib/command/validators/requiresWizard
fallthrough: true
# The bare form `git` falls through here → status (the controller defaults
# an absent subcommand to status); an explicit subcommand uses its own
# args. fallthrough:true requires both `args` and `subcommands`.
args:
  - name: path
    type: string
    required: false
options:
  message:
    short: m
    type: string
    field: message
    description: "Commit message (git publish)"
  limit:
    type: number
    field: limit
    description: "Max commits to show (git log; default 50)"
subcommands:
  status:
    description: "Show the branch, divergence, and dirty files (default)"
  diff:
    description: "Show the working-tree patch (optionally one path)"
    args:
      - name: path
        type: string
        required: false
  log:
    description: "Show recent commits (optionally one path)"
    args:
      - name: path
        type: string
        required: false
  publish:
    description: "Commit + push your writable dirty files (-m <message>)"
  revert:
    description: "Add a commit undoing an earlier one (scoped to what you may write)"
    args:
      - name: sha
        type: string
        required: true
