verbs: [recall]
controller: /obj/command/system/RecallController
description: "Search the wiki, forums, chat, press and help for a phrase."
help: |
  Look something up across everything the world has written down.

    recall iron price          search everywhere
    recall wiki compact        search one source

  The sources are `wiki`, `forum`, `chat`, `press`, `help`, and `all`
  (the default). Each result shows the command that opens it, so you
  can read the real thing — and reading it checks your access again at
  that moment.

  You will only ever see what you are allowed to read. Anything else is
  absent from the results rather than shown as withheld: telling you a
  page exists is itself telling you something.

  ⚠ This is not `search`. `search` is going over a room with your hands
  for something hidden in it — a thing you do in the world. `recall` is
  looking something up.
examples:
  - cmd: recall iron price
    note: Search every source for a phrase
  - cmd: recall wiki compact
    note: Search just the wiki
  - cmd: recall help cockpit
    note: Search the rulebook
args:
  # ⚠ One greedy arg, not `scope` + `terms`. A greedy arg is required by
  # definition, so it cannot follow an optional one — and more to the
  # point, whether the first word IS a scope is a decision the
  # controller makes against the real scope list, not something the
  # binder can know.
  - name: query
    type: string
    required: true
    greedy: true
