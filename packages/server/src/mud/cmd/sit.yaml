verbs: [sit]
controller: SitController
description: "Sit on something. With no argument, sit on the ground."
validators:
  - /lib/command/validators/requiresAnimate
args:
  - name: target
    type: object
    required: true
    default: "ground"
    scope: ["$focus", "reachable"]
    validators:
      - /lib/command/validators/mustBeVisible
