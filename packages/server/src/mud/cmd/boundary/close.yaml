verbs: [close]
controller: boundary/CloseController
description: "Close a door (by direction or by name)"
help: |
  Close anything that can be sealed — a door blocking an exit, a
  chest, a cabinet. Name a direction to close the door on that exit
  (`close south`), or name the thing directly (`close oak door`,
  `close chest`).

  The target has to be within reach. If it's already closed, or it
  isn't something that closes at all, the game tells you so and
  nothing happens.
validators:
  - /lib/command/validators/requiresAnimate
args:
  - name: target
    type: object
    required: true
    scope: "reachable"
    updates_focus: extend
    validators:
      - /lib/command/validators/canReach
