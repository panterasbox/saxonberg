verbs: [unlock]
controller: boundary/UnlockController
description: "Unlock a door (by direction or by name)"
help: |
  Unlock anything that can be locked — a door blocking an exit. Name a
  direction to unlock the door on that exit (`unlock north`), or name
  the thing directly (`unlock oak door`).

  The target has to be within reach. If it's already unlocked, or it
  isn't something that locks at all, the game tells you so and nothing
  happens.
validators:
  - /lib/command/validators/requiresAnimate
args:
  - name: target
    type: object
    required: true
    scope: "reachable"
    updates_focus: extend
    validators:
      - /lib/command/validators/canReach
