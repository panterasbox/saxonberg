verbs: [rm]
controller: RmController
description: "Remove a content-tree template (default) or source-tree file"
args:
  - name: path
    type: string
    required: false
options:
  mql:
    type: string
    description: "MQL expression alternate to <path>"
  content:
    short: c
    type: boolean
    description: "Force the operation to the content tree (overrides workspace.tree)"
  source:
    short: s
    type: boolean
    description: "Force the operation to the source tree (overrides workspace.tree)"
  recursive:
    short: r
    type: boolean
    description: "Recurse into subdirectories"
