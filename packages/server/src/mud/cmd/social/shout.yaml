verbs: [shout]
controller: /obj/command/social/ShoutController
description: "Shout — loud, multi-room acoustic reach"
help: |
  Raise your voice so it carries past your own room. A shout is
  still acoustic — it reaches nearby rooms within earshot, not the
  whole world — so reach for it to get the attention of people one
  or two rooms over. For room-only speech use `say`; for anywhere
  use `tell` or a channel.

  Add `--to <someone>` to mark the shout as aimed at a person.
  Everyone in range still hears it; the line just notes who it's
  for.
validators:
  - /lib/command/validators/requiresAnimate
options:
  to:
    short: t
    type: object
    scope: "online"
    field: target
    description: "Address an explicit target. The shout still reaches all hearers in range; the target is marked."
    requires: class:Agent
    onExcess: prompt
args:
  - name: message
    type: string
    required: true
    greedy: true
