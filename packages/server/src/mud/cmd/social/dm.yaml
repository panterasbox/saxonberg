verbs: [dm, tell]
controller: /obj/command/social/DmController
description: "Send a direct message (dm) to one or more people. Multi-target DMs create an ad-hoc channel under the hood."
help: |
  Send a private message straight to someone, anywhere in the world —
  no need to share a room. `tell` is an alias and reads identically.
  Unlike `say`, a `dm` doesn't carry acoustically; it's delivered
  over comms.

  Name more than one recipient and the message becomes a small group
  thread: an ad-hoc channel is spun up under the hood so the whole
  cohort can keep talking. Use `reply` to answer your last inbound
  DM without retyping names.
examples:
  - cmd: tell alice see you tonight
    note: Same thing — `tell` is an alias for `dm`
  - cmd: dm alice bob the plan is set
    note: Message several people; they share an ad-hoc thread
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresVerbalESP
args:
  - name: target
    type: objects
    required: true
    scope: "online"
    cardinality: { min: 1, max: 10 }
    onShortage: error
    onExcess: error
    validators:
      - /lib/command/validators/mustBeAgent
  - name: message
    type: string
    required: true
    greedy: true
