verbs: [status]
controller: social/StatusController
description: "Set your activity status — what others see you doing (omit to clear)"
help: |
  Set a short note about what you're up to. Others see it alongside
  your name when they look at you or list who's around — handy for
  signalling "busy", "looking for a study group", or staying in
  character.

  Type `status` with no text to clear it again.
validators:
  - /lib/command/validators/requiresAnimate
args:
  - name: text
    type: string
    required: false
    greedy: true
