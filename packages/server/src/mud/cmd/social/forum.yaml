verbs: [forum]
controller: social/ForumController
description: "Read and post on forum boards (list / make / on / post / reply / edit / read / vote / promote / follow)"
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresVerbalESP
fallthrough: true
subcommands:
  list:
    description: "List boards visible to you"
  make:
    description: "Create a subject + board (you become the owner)"
    options:
      open:
        type: boolean
        field: open
        description: "Leave the audience open to every player"
      group:
        short: g
        type: string
        field: group
        description: "Bind an existing guild:/mql:/contacts:/managed: ref"
      argument:
        type: boolean
        field: argument
        description: "Use the argument organizer (a typed claim-graph, not a ranked feed)"
    args:
      - name: name
        type: string
        required: true
      - name: description
        type: string
        required: false
        greedy: true
  on:
    description: "Attach a board to an existing subject you own"
    options:
      argument:
        type: boolean
        field: argument
        description: "Use the argument organizer (a typed claim-graph, not a ranked feed)"
    args:
      - name: name
        type: string
        required: true
  post:
    description: "Start a thread on a board"
    options:
      title:
        short: t
        type: string
        field: title
        description: "Thread title (otherwise derived from the body)"
    args:
      - name: board
        type: string
        required: true
      # Body is OPTIONAL on the command string: it is dual-source — greedy
      # markdown inline (CLI), the `fields` side-channel (GUI), or the
      # `compose` prompt (interactive). A required arg would make the
      # parser reject `forum post <board>` before the side-channel overlay
      # runs; the controller enforces body presence after the overlay.
      - name: body
        type: string
        required: false
        greedy: true
  reply:
    description: "Reply (popularity) or attach a typed claim (argument: --pro/--con/--rebut)"
    options:
      pro:
        type: boolean
        field: pro
        description: "Argument board: attach a supporting claim (supports edge)"
      con:
        type: boolean
        field: con
        description: "Argument board: attach an objection (objects-to edge)"
      rebut:
        type: boolean
        field: rebut
        description: "Argument board: attach a neutral question/clarification (responds-to edge)"
    args:
      - name: entry
        type: string
        required: true
      # Optional for the same dual-source reason as `post` above.
      - name: body
        type: string
        required: false
        greedy: true
  edit:
    description: "Edit a body in place (author or board owner); keeps a lossless trail"
    args:
      - name: entry
        type: string
        required: true
      # Optional for the same dual-source reason as `post` above.
      - name: body
        type: string
        required: false
        greedy: true
  read:
    description: "Read a board's thread-list, or a thread's tree"
    options:
      sort:
        short: s
        type: string
        field: sort
        description: "Sort order: new | top | hot | controversial (default new)"
    args:
      - name: board
        type: string
        required: true
      - name: thread
        type: string
        required: false
  vote:
    description: "Up/down vote an entry (toggles off if you repeat the same direction)"
    args:
      - name: entry
        type: string
        required: true
      - name: direction
        type: string
        required: true
  promote:
    description: "Promote a thread into a thread-subject with its own chat"
    args:
      - name: board
        type: string
        required: true
      - name: thread
        type: string
        required: true
      - name: name
        type: string
        required: true
  follow:
    description: "Follow a subject (tunes you into all its lit surfaces)"
    args:
      - name: name
        type: string
        required: true
args:
  # Fallthrough: `forum <board>` with no subcommand reads the board.
  - name: board
    type: string
    required: true
