verbs: [who]
controller: /obj/command/social/WhoController
opens_card: who
description: "See who's online."
help: |
  `who` lists everyone currently online. You always appear on it when
  connected — presence is public; there is no "appear offline". What you
  see *about* each person depends on whether you know them: people you've
  been introduced to show by name, strangers by description. Country of
  origin is always shown, and a notable status (idle / engaged) is badged.

  Narrow the list — only ever on what's already public:

  - `--here` (`-h`) — only people in the room with you.
  - `--friends` (`-f`) — only people in your contacts.
  - `--country <name>` (`-c`) — only people from a matching country.

  Use `profile <name>` to look someone up in full.
validators:
  - /lib/command/validators/requiresAnimate
options:
  here:
    short: h
    type: boolean
    description: "Only people here in the room with you."
  friends:
    short: f
    type: boolean
    description: "Only people in your contacts."
  country:
    short: c
    type: string
    description: "Only people whose (always-public) country of origin matches."
