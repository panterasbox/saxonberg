verbs: [reply]
controller: social/ReplyController
description: "Reply to the cohort of your last-inbound DM. Defaults to reply-all; --one narrows to the original sender."
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresVerbalESP
options:
  one:
    short: o
    type: boolean
    description: "Reply only to the original sender, not the full cohort"
args:
  - name: message
    type: string
    required: true
    greedy: true
