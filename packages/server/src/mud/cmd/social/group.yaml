verbs: [group]
controller: social/GroupController
description: "Manage persistent named groups of players (managed-provider source for grouping facade)"
validators:
  - /lib/command/validators/requiresAnimate
subcommands:
  make:
    description: "Create a new group with the caller as owner"
    args:
      - name: name
        type: string
        required: true
  delete:
    description: "Disband a group (owner-only)"
    args:
      - name: name
        type: string
        required: true
  rename:
    description: "Rename a group (owner-only)"
    args:
      - name: old_name
        type: string
        required: true
      - name: new_name
        type: string
        required: true
  add:
    description: "Add a player to a group"
    args:
      - name: name
        type: string
        required: true
      - name: target
        type: object
        required: true
        scope: "online"
        validators:
          - /lib/command/validators/mustBeAgent
        onExcess: prompt
  remove:
    description: "Remove a player from a group"
    args:
      - name: name
        type: string
        required: true
      - name: target
        type: string
        required: true
  role:
    description: "Set a member's role (owner/admin/member)"
    args:
      - name: name
        type: string
        required: true
      - name: target
        type: string
        required: true
      - name: role_name
        type: string
        required: true
  show:
    description: "Show a group's membership"
    args:
      - name: name
        type: string
        required: true
  list:
    description: "List groups you belong to"
