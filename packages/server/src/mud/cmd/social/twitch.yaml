verbs: [twitch]
controller: social/TwitchController
description: "Read and post to relayed Twitch channels (list / tune / untune / history / who)"
help: |
  Tune in to a relayed Twitch channel and read its chat in your
  console; post to it as your own linked Twitch identity. The bare
  form posts: `twitch twitchdev hello` sends "hello" to that
  channel's Twitch chat (and mirrors it here).

  Start with `twitch list` to see relayed channels, `twitch tune
  <channel>` to listen in. Posting requires a linked Twitch account
  with chat authorized; you'll be pointed to the authorize flow the
  first time.
validators:
  - /lib/command/validators/requiresAnimate
fallthrough: true
subcommands:
  list:
    description: "List relayed Twitch channels and your tuned status"
  tune:
    description: "Tune in to a relayed channel"
    args:
      - name: channel
        type: string
        required: true
  untune:
    description: "Tune out of a relayed channel"
    args:
      - name: channel
        type: string
        required: true
  history:
    description: "Recent messages on a relayed channel"
    args:
      - name: channel
        type: string
        required: true
  who:
    description: "Who is tuned in to a relayed channel"
    args:
      - name: channel
        type: string
        required: true
args:
  - name: channel
    type: string
    required: true
  - name: message
    type: string
    required: true
    greedy: true
