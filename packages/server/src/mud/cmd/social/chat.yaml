verbs: [chat]
controller: social/ChatController
description: "Post to a chat channel, or manage channel membership (list / join / leave / mute / unmute / who / make / rename / disband / history / promote)"
help: |
  Talk on a named channel that reaches everyone tuned in, wherever
  they are. The bare form posts: `chat gossip hello` sends "hello"
  to the gossip channel. The subcommands manage which channels you
  hear and let you run your own.

  Start with `chat list` to see what's available and `chat join` to
  tune in. You can spin up your own channel with `chat make`, and
  quiet a noisy one without leaving via `chat mute`.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresVerbalESP
fallthrough: true
subcommands:
  list:
    description: "List channels visible to you"
    help: |
      Show every channel you're allowed to see, including the ones
      you've already joined. Start here when you're new to find out
      what conversations exist.
  join:
    description: "Subscribe (tune in) to a channel"
    help: |
      Tune in to a channel so you start receiving its posts. You
      stay subscribed across sessions until you `leave`.
    examples:
      - cmd: chat join gossip
        note: Subscribe to the gossip channel
    args:
      - name: name
        type: string
        required: true
  leave:
    description: "Unsubscribe from a channel"
    help: |
      Drop a channel entirely — you stop receiving its posts and it
      no longer counts you as a member. To stay subscribed but go
      quiet, use `mute` instead.
    args:
      - name: name
        type: string
        required: true
  mute:
    description: "Mute a channel (subscription kept; no frames delivered)"
    help: |
      Silence a channel without leaving it. You stay subscribed, but
      no posts are delivered until you `unmute`. Good for a busy
      channel you want to check on your own terms.
    args:
      - name: name
        type: string
        required: true
  unmute:
    description: "Unmute a channel"
    help: |
      Start hearing a channel you previously muted. Delivery resumes
      from now on; you won't get the posts you missed while muted.
    args:
      - name: name
        type: string
        required: true
  who:
    description: "Show tuned-in members of a channel"
    help: |
      List who is currently tuned in to a channel, so you know your
      audience before you post.
    args:
      - name: name
        type: string
        required: true
  make:
    description: "Create a new player-created channel (you become the owner)"
    help: |
      Start your own channel and become its owner. Pick a name that
      isn't taken; others can then `join` it. As owner you can later
      `rename` or `disband` it.
    args:
      - name: name
        type: string
        required: true
  on:
    description: "Attach a chat surface to an existing subject you own (default free)"
    options:
      rules:
        type: boolean
        field: rules
        description: "Attach the rules-of-order surface (deferred; reserved)"
    args:
      - name: name
        type: string
        required: true
  rename:
    description: "Rename a player-created channel you own"
    help: |
      Change the name of a channel you own. Members stay subscribed;
      only the label changes. Owner-only.
    args:
      - name: old_name
        type: string
        required: true
      - name: new_name
        type: string
        required: true
  disband:
    description: "Disband a player-created channel you own"
    help: |
      Permanently remove a channel you own. Everyone is unsubscribed
      and the name frees up. Owner-only and not reversible.
    args:
      - name: name
        type: string
        required: true
  history:
    description: "Show recent posts in a channel"
    help: |
      Catch up on what was said recently on a channel — useful after
      you join, or after a stretch of being muted or away.
    args:
      - name: name
        type: string
        required: true
  promote:
    description: "Promote an ad-hoc DM channel into a persistent player-created channel"
    help: |
      Turn a throwaway group-DM thread into a real, named channel
      that sticks around. Give the thread's handle and the new name
      you want; you become the owner of the resulting channel.
    examples:
      - cmd: chat promote dm-4f2a finals-cram
        note: Make a group DM into a permanent channel
    args:
      - name: handle
        type: string
        required: true
      - name: new_name
        type: string
        required: true
args:
  # Fallthrough: when the first token isn't a reserved subcommand,
  # bind these as a bare post: `chat gossip hello`.
  - name: channel
    type: string
    required: true
  - name: message
    type: string
    required: true
    greedy: true
