verbs: [listen]
controller: ListenController
description: "Listen to your surroundings or a specific source"
validators:
  - /lib/command/validators/requiresLocation
  - /lib/command/validators/requiresHearing
args:
  - name: target
    type: object
    required: false
    scope: ["$focus", "reachable"]
    updates_focus: extend
    prepositions: [to, at]
    default: "$focus"
    onExcess: prompt
