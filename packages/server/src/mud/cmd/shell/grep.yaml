verbs: [grep]
controller: /obj/command/shell/GrepController
description: "Search for <pattern> in the content (default) or source tree"
help: |
  Hunt for text. Give `grep` a pattern and it scans the content
  tree for matches, reporting where each one lives. Add an optional
  path to narrow the search to one subtree instead of starting from
  your current position.

  Use `-i` to ignore case and `-r` to descend into subdirectories.
  Pass `-s` to search the engine source tree instead of the
  authored world.
args:
  - name: pattern
    type: string
    required: true
  - name: path
    type: string
    required: false
options:
  content:
    short: c
    type: boolean
    description: "Force the operation to the content tree (overrides workspace.tree)"
  source:
    short: s
    type: boolean
    description: "Force the operation to the source tree (overrides workspace.tree)"
  ignore:
    short: i
    type: boolean
    description: "Case-insensitive match"
  recursive:
    short: r
    type: boolean
    description: "Recurse into subdirectories"
