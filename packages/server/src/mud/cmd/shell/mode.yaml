verbs: [mode]
controller: /obj/command/shell/ModeController
description: "Scope a command bar: type bare lines as `<prefix> …` until you turn it off."
help: |
  Put a command bar into a mode so everything you type there is
  prefixed for you. `mode chat gossip` scopes this bar to the gossip
  channel — then a bare `hello` is dispatched as `chat hello`. Run a
  one-off raw command without leaving the mode by starting it with a
  slash: `/look`. Turn the mode off with `mode off` (or bare `mode`).

  Modes are per-bar: a layout with several terminals can have one bar
  scoped to chat while another stays plain. The bar shows its prefix
  inline as you type, so what you see is exactly what dispatches.

  By default `mode` targets the bar you typed it in. A UI control can
  target a different bar with `--bar <id>` (e.g. a button that scopes the
  stream-chat bar sends `mode chat --bar stream-chat`) — this is how an
  affordance, which dispatches un-moded, names the bar it means.
validators:
  - /lib/command/validators/requiresHasInteractive
examples:
  - cmd: mode chat gossip
    note: Scope this bar to the gossip channel
  - cmd: mode off
    note: Clear this bar's mode
  - cmd: mode chat --bar stream-chat
    note: Scope a named bar (used by mode-setting buttons)
options:
  bar:
    short: b
    type: string
    description: "Target a named command bar (default: the bar you typed in)."
args:
  - name: prefix
    type: string
    required: false
    greedy: true
