verbs: [find]
controller: /obj/command/shell/FindController
description: "Enumerate things matching a query without changing focus"
help: |
  List every nearby thing that matches a query, without committing
  to any of them. `find` searches inside your current focus first
  — so `find apple` while focused on a bookcase looks inside the
  bookcase — then widens to everything reachable around you.

  Unlike `look`, `find` deliberately leaves your focus untouched,
  so it's the safe way to scan for candidates before you act. Use
  it when you're not sure what's around or how something is named.
args:
  - name: query
    type: objects
    required: true
    greedy: true
    # Match `focus`'s scope chain: drill into the current focus first
    # (so `find apple` while focused on the bookcase searches inside
    # the bookcase), then fall back to `reachable` for fresh selection.
    # The absence of `updates_focus` is load-bearing — `find`
    # deliberately does not touch focus (defaults to `'none'`).
    scope: ["$focus", "reachable"]
    requires: any
