verbs: [layout]
controller: shell/LayoutController
description: "Switch the cockpit layout (world | forum | livestream-viewer | streamer | builder)."
help: |
  Choose how your cockpit is arranged. A layout is the whole
  screen's shape — `world` is the classic terminal, `forum` opens
  the board view, `livestream-viewer` puts a stream embed beside a
  chat terminal, `streamer` is the broadcaster's view, and
  `builder` opens the content editor.

  Your layout is remembered: it follows you across reconnects and
  every connection you have open. A terminal showing live play is
  always present in every layout, so you can always type `layout
  world` to come back.

  The "Views" menu in the cockpit sends this command for you — typing
  `layout <name>` and clicking a menu item are the same thing.
validators:
  - /lib/command/validators/requiresHasInteractive
examples:
  - cmd: layout forum
    note: Open the forum board view
  - cmd: layout world
    note: Return to the classic terminal cockpit
args:
  - name: name
    type: string
    required: true
