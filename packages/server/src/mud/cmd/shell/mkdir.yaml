verbs: [mkdir]
controller: /obj/command/shell/MkdirController
description: "Create a folder template (default) or code directory"
help: |
  Make a new directory at the given path. In the content tree this
  creates a folder template — an organizing node that holds other
  templates beneath it. In the source tree it creates a plain code
  directory.

  `mkdir` works on the content tree by default; pass `-s` to create
  a directory in the source tree instead.
args:
  - name: path
    type: string
    required: true
options:
  content:
    short: c
    type: boolean
    description: "Force the operation to the content tree (overrides workspace.tree)"
  source:
    short: s
    type: boolean
    description: "Force the operation to the source tree (overrides workspace.tree)"
