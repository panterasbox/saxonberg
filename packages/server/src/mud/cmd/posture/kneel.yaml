verbs: [kneel]
controller: /obj/command/posture/KneelController
description: "Kneel. With no argument, kneel on the ground."
help: |
  Drop to your knees. Bare `kneel` kneels right where you are,
  on the ground. Name something to kneel on it instead — a
  cushion, a low step, anything that can hold a kneeling pose.

  Kneeling is a posture, so it sticks until you change it. Use
  `stand` to rise again, or `sit` / `lie` to settle differently.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresPosed
  - /lib/command/validators/requiresSlottable
  - /lib/command/validators/requiresEmbodied
args:
  - name: target
    type: object
    required: true
    default: "ground"
    scope: ["$focus", "reachable"]
    validators:
      - /lib/command/validators/mustBeVisible
      - /lib/command/validators/mustBePostured
