verbs: [stand]
controller: posture/StandController
description: "Stand up. With no argument, vacate any current posture-bearing slot."
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresPosed
args:
  - name: target
    type: object
    required: false
    scope: ["$focus", "reachable"]
    validators:
      - /lib/command/validators/mustBeVisible
      - /lib/command/validators/mustBePostured
