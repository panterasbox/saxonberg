verbs: [lie]
controller: posture/LieController
description: "Lie down on something. With no argument, lie on the ground."
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresPosed
  - /lib/command/validators/requiresSlottable
args:
  - name: target
    type: object
    required: true
    default: "ground"
    scope: ["$focus", "reachable"]
    validators:
      - /lib/command/validators/mustBeVisible
      - /lib/command/validators/mustBePostured
