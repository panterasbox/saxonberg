verbs: [look, l]
controller: LookController
description: "Examine your surroundings or an object"
args:
  - name: target
    type: object
    required: false
    scope: ["$scope", "inventory, here"]
    updates_scope: true
    prepositions: [at]
    default: "$scope"
    validators:
      - /lib/command/validators/mustBeVisible
