verbs: [smell]
controller: SmellController
description: "Smell your surroundings or a specific thing"
validators:
  - /lib/command/validators/requiresLocation
  - /lib/command/validators/requiresSmell
args:
  - name: target
    type: object
    required: false
    scope: ["$focus", "reachable"]
    updates_focus: extend
    prepositions: [at]
    default: "$focus"
    onExcess: prompt
