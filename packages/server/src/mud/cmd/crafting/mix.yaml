verbs: [mix]
controller: crafting/MixController
description: "Mix a cocktail for yourself"
help: |
  Make a drink and keep it — `mix martini`. You're the maker. Steer the
  pour with `with`: `mix martini with bombay`. You need the ingredients
  and tools within reach.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
args:
  - name: cocktail
    type: string
    required: true
  - name: brand
    type: string
    required: false
    prepositions: [with]
