verbs: [pour, add]
controller: /obj/command/crafting/PourController
description: "Pour a measure of a spirit into a shaker (a manual build step)"
help: |
  Build a drink by hand, one ingredient at a time — `pour gin into
  shaker`, or just `add vermouth` to add to the shaker you're working in.
  Each pour drains the bottle by a measure and banks a graded ingredient
  into the build. Finish with `stir`/`shake` and `strain into <glass>`.
  Pouring takes a moment and keeps your hands busy.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: spirit
    type: object
    required: true
    scope: "reachable"
    targetKind: any
  - name: vessel
    type: object
    required: false
    scope: "reachable"
    prepositions: [into, in, to]
    validators:
      - /lib/command/validators/mustBeBuildVessel
