verbs: [stir, shake]
controller: /obj/command/crafting/StirController
description: "Stir or shake a build in progress"
help: |
  Work the drink you're building — `stir` (or `shake`) the shaker. It
  records how the build was mixed and takes a moment. Name the vessel
  (`stir mixing glass`) or leave it to the one you're building in.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: vessel
    type: object
    required: false
    scope: "reachable"
    requires: ManualBuildMixin
