verbs: [serve]
controller: /obj/command/crafting/ServeController
description: "Make a cocktail and hand it to someone"
help: |
  Make a drink and serve it to someone — `serve bob martini`. You're
  the maker (your name goes on it). Steer the pour with `with`:
  `serve bob martini with bombay`. You need the ingredients and tools
  within reach.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: patron
    type: object
    required: true
    scope: "reachable"
    requires: [VisibleMixin, class:Agent]
  - name: cocktail
    type: string
    required: true
  - name: brand
    type: string
    required: false
    prepositions: [with]
