verbs: [cook]
controller: /obj/command/crafting/CookController
description: "Cook a dish at the hearth"
help: |
  Cook a dish in one act — `cook stew`. You're the cook: you need the
  recipe learned by hand first (work it once with `add` / `stir` /
  `heat` / `plate`), reachable heat where the recipe wants it, the pot,
  and the ingredients.
validators:
  - /lib/command/validators/requiresAnimate
  - /lib/command/validators/requiresConscious
  - /lib/command/validators/requiresEmbodied
args:
  - name: dish
    type: string
    required: true
