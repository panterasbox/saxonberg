verbs: [unprovision, unlease]
controller: /domain/eternal/duncan-hall/command/UnprovisionController
description: "End a Duncan Hall dorm lease and reclaim the unit"
help: |
  End a tenant's dorm lease and reclaim their room. Name the tenant (symmetric
  with `provision`); their held unit is resolved automatically. The lease is
  revoked, the room reverts to a clean shell (the tenant's personalization is
  cleared), and the slot is freed so the next provision can reuse it. A live
  occupant is moved out to the corridor first.

  Authorized for the dorms' owner and its agents (Katie fronts move-out in
  the world) or an operator.
examples:
  - cmd: unprovision alice
    note: End Alice's dorm lease and free the slot
validators:
  - /lib/command/validators/requiresWizard
args:
  - name: player
    type: object
    required: true
    scope: "online"
    validators:
      - /lib/command/validators/mustBeAgent
