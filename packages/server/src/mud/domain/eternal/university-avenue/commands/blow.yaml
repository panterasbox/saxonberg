verbs: [blow]
controller: domain/eternal/university-avenue/commands/BlowController
description: "Blow a whistle"
help: |
  Blow a whistle you're carrying or wearing — one sharp blast, heard
  across the room and the ones next to it. Name the whistle (`blow
  whistle`) or, if you're carrying just the one, `blow` on its own.

  It's a loud, deliberate noise: a real event in the room, not a private
  toot. If you've nothing to blow, the game tells you so.
validators:
  - /lib/command/validators/requiresAnimate
args:
  - name: target
    type: object
    required: false
    scope: "reachable"
