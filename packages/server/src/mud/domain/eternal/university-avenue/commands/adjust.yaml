verbs: [adjust]
controller: domain/eternal/university-avenue/commands/AdjustController
description: "Adjust a mechanical timepiece to a time"
help: |
  Adjust the hands of a mechanical timepiece you're carrying to a time
  you give it, in 24-hour `HH:MM` — `adjust watch 4:00`. There's no clock
  to sync to; you read the tower, guess, and dial it in by hand. Which is
  exactly why a mechanical movement drifts: it only ever knows the time
  you last told it.
validators:
  - /lib/command/validators/requiresAnimate
args:
  - name: target
    type: object
    required: true
    scope: "reachable"
  - name: time
    type: string
    required: true
