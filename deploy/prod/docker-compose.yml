# Runs on the box at /srv/saxonberg. The deploy pipeline ships this
# file alongside a materialized `.env` (rendered from SSM Parameter
# Store) and the Caddyfile, then runs `docker compose pull && up -d`.
#
# Only Caddy is public; it terminates TLS (Let's Encrypt, auto) and
# reverse-proxies to the app on the internal network. The app itself
# publishes no host ports. See docs/deployment.md.

services:
  app:
    # The deploy job pins IMAGE to the just-built commit-SHA tag.
    image: ${IMAGE:-registry.gitlab.com/panterasbox/saxonberg:latest}
    restart: unless-stopped
    # Base config materialized from Param Store at deploy time.
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "2010"
    expose:
      - "2010"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
